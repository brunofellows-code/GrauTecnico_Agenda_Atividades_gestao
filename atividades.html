<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Atividades · GERA</title>

<!-- provider + primitivos (mesma fundação das demais telas) -->
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
  <script src="mnav.js"></script>

<style>
/* ===== layout da tela Atividades (cor 100% via var) ===== */
.at-app{display:flex;min-height:100vh;background:var(--bg)}
.at-app>.ui-side{position:sticky;top:0;height:100vh}
.at-main{flex:1;min-width:0;display:flex;flex-direction:column}

.at-top{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--s1)}
.at-hi{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
.at-dd{font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}

.at-mhead{display:none;align-items:flex-start;justify-content:space-between;padding:14px 20px 16px;background:var(--s1);border-bottom:1px solid var(--border)}
.at-mg{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.at-md{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}

.at-content{flex:1;padding:22px 32px 48px}

/* toolbar */
.at-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.at-toolleft{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.at-toolright{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.at-count{font-size:12.5px;font-weight:600;color:var(--muted)}
.at-count b{color:var(--text);font-weight:800}

/* select compacto na toolbar (reaproveita a borda do tema) */
.at-fsel{font-family:inherit;font-size:12.5px;font-weight:700;color:var(--text);background:var(--s1);
  border:1px solid var(--border);border-radius:9px;padding:8px 11px;cursor:pointer}
.at-fsel:focus{outline:none;border-color:var(--brand)}

/* segmented (período) */
.at-seg{display:inline-flex;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.at-seg button{font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);background:transparent;border:0;cursor:pointer;
  padding:7px 12px;border-radius:7px;white-space:nowrap;transition:color .15s,background .15s}
.at-seg button:hover{color:var(--text)}
.at-seg button.on{color:var(--ctaText);background:var(--cta)}

/* busca */
.at-search{display:inline-flex;align-items:center;gap:8px;background:var(--s1);border:1px solid var(--border);
  border-radius:10px;padding:0 11px;min-width:210px}
.at-search:focus-within{border-color:var(--brand)}
.at-search svg{color:var(--muted2);flex:none}
.at-search input{flex:1;min-width:0;font-family:inherit;font-size:13px;font-weight:600;color:var(--text);
  background:transparent;border:0;outline:none;padding:9px 0}
.at-search input::placeholder{color:var(--muted2);font-weight:500}

/* sino de pendentes */
.at-bell{position:relative;display:inline-flex;align-items:center;justify-content:center;width:38px;height:38px;flex:none;
  border:1px solid var(--border);border-radius:10px;background:var(--s1);color:var(--muted);cursor:pointer;transition:color .15s,border-color .15s}
.at-bell:hover{color:var(--text);border-color:var(--brand)}
.at-bell .badge{position:absolute;top:-6px;right:-6px;min-width:18px;height:18px;padding:0 4px;border-radius:9px;
  background:var(--haloRed);color:var(--red);font-size:10.5px;font-weight:800;display:flex;align-items:center;justify-content:center;line-height:1}

/* toggle de visão */
.at-vtoggle{display:inline-flex;background:var(--s1);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.at-vtoggle button{display:inline-flex;align-items:center;gap:7px;font-family:inherit;font-size:12px;font-weight:700;color:var(--muted);
  background:transparent;border:0;cursor:pointer;padding:7px 11px;border-radius:7px;transition:color .15s,background .15s}
.at-vtoggle button:hover{color:var(--text)}
.at-vtoggle button.on{color:var(--greenText);background:var(--activeBg)}

/* ===== COLUNAS POR RECORRÊNCIA (visão padrão · REGRA GLOBAL) =====
   Abre calma: colunas com contadores; vermelho = ponto + número; drill no clique. */
.at-reccols{display:grid;grid-template-columns:repeat(auto-fill,minmax(252px,1fr));gap:14px;align-items:start}
.at-rcol{background:var(--sideBg);border:1px solid var(--border);border-radius:14px;padding:11px;min-width:0}
.at-rchd{display:flex;align-items:center;gap:8px;padding:4px 5px 11px}
.at-rcname{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at-rcsp{flex:1}
.at-rccount{font-size:11px;font-weight:800;color:var(--muted2);background:var(--chipBg);border:1px solid var(--border);border-radius:20px;padding:1px 8px;flex:none}
.at-latedot{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:800;color:var(--red);flex:none}
.at-latedot::before{content:"";width:8px;height:8px;border-radius:50%;background:var(--red);display:inline-block}
.at-rcbody{display:flex;flex-direction:column;gap:8px}
.at-scard{background:var(--s1);border:1px solid var(--border);border-radius:11px;overflow:hidden}
.at-schd{display:flex;flex-direction:column;gap:6px;width:100%;padding:11px 12px;background:transparent;border:0;cursor:pointer;text-align:left;color:var(--text);font:inherit}
.at-schd:hover{background:var(--s2)}
.at-sct{font-size:13px;font-weight:700;line-height:1.35;color:var(--text);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.at-scmeta{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
.at-scmeta .at-tag{font-size:9.5px;padding:1px 6px}
.at-scfoot{display:flex;align-items:center;gap:8px}
.at-scfoot .at-gcount{margin-left:auto}
.at-noresp{font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--amber);background:var(--chipBg);border:1px solid var(--border);border-radius:6px;padding:2px 7px}
.at-sresp{display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:600;color:var(--muted);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at-sdrill{border-top:1px solid var(--border);padding:6px 8px 8px;display:flex;flex-direction:column;gap:2px;background:var(--s2)}
.at-orow{display:flex;align-items:center;gap:9px;padding:5px 4px;border-radius:8px;min-width:0}
.at-orow:hover{background:var(--s1)}
.at-odate{font-size:12px;font-weight:700;color:var(--text);flex:none;width:44px}
.at-orow.done .at-odate{color:var(--muted);text-decoration:line-through}
.at-orow.skip .at-odate{color:var(--muted);text-decoration:line-through}
.at-olate{font-size:9.5px;font-weight:800;letter-spacing:.03em;color:var(--red);background:var(--haloRed);border-radius:5px;padding:1px 6px;flex:none}
.at-ostate{font-size:9.5px;font-weight:800;border-radius:5px;padding:1px 6px;flex:none;border:1px solid var(--border);background:var(--chipBg)}
.at-ostate.skip{color:var(--amber)}
.at-ostate.rep{color:var(--orange)}
.at-ostate.doing{color:var(--doing)}
.at-osp{flex:1;min-width:0}
.at-okebab{display:inline-flex;align-items:center;justify-content:center;width:26px;height:26px;flex:none;border:0;border-radius:7px;background:transparent;color:var(--muted2);cursor:pointer}
.at-okebab:hover{background:var(--s3);color:var(--text)}
@media (max-width:640px){.at-reccols{grid-template-columns:1fr}}

/* ===== LISTA ===== */
.at-list{display:flex;flex-direction:column;gap:20px}
.at-group{display:flex;flex-direction:column;gap:9px}
.at-grouphd{display:flex;align-items:center;gap:10px;padding:0 2px}
.at-gname{font-size:12.5px;font-weight:800;letter-spacing:.02em;color:var(--text)}
.at-gname.today{color:var(--greenText)}
.at-gline{flex:1;height:1px;background:var(--border)}
.at-gcount{font-size:11px;font-weight:700;color:var(--muted2)}

.at-card{display:flex;align-items:center;gap:13px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:13px 15px}
.at-card.late{border-color:var(--red);box-shadow:0 0 0 3px var(--haloRed)}
.at-card.done{opacity:.72}
.at-card.skip{opacity:.6}
.at-check{flex:none}
.at-cmain{flex:1;min-width:0}
.at-ctitle{font-size:14px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.at-card.done .at-ctitle{color:var(--muted);text-decoration:line-through}
.at-card.skip .at-ctitle{color:var(--muted);text-decoration:line-through}
.at-cmeta{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:5px}
.at-tag{font-size:10.5px;font-weight:800;letter-spacing:.05em;color:var(--greenText);background:var(--activeBg);
  border:1px solid var(--border);border-radius:6px;padding:2px 7px}
.at-tag.sub{color:var(--muted);background:var(--chipBg)}
.at-sgroup{border:1px solid var(--border);border-radius:12px;margin-bottom:10px;overflow:hidden;background:var(--s1)}
.at-shd{display:flex;align-items:center;gap:9px;width:100%;padding:12px 14px;background:transparent;border:0;cursor:pointer;text-align:left;color:var(--text);font:inherit}
.at-shd:hover{background:var(--s2)}
.at-scaret{display:inline-flex;color:var(--muted);transition:transform .15s}
.at-sgroup.open .at-scaret{transform:rotate(180deg)}
.at-stitle{font-weight:700;font-size:14px;color:var(--text)}
.at-sbody{padding:2px 14px 12px 14px;display:flex;flex-direction:column;gap:8px}
.at-multibox{display:flex;flex-direction:column;gap:10px}
.at-extrasec{display:flex;flex-wrap:wrap;gap:8px 18px;padding-left:2px}
.at-hint2{font-size:12px;color:var(--muted)}
.at-freqhd{display:flex;align-items:center;gap:8px;margin:16px 2px 8px;color:var(--muted)}
.at-freqname{font-size:12px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--text)}
.at-mi{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;color:var(--muted)}
.at-mi svg{color:var(--muted2)}
.at-recpill{display:inline-flex;align-items:center;gap:5px;font-size:10.5px;font-weight:700;color:var(--muted);
  background:var(--chipBg);border:1px solid var(--border);border-radius:20px;padding:2px 8px}
.at-latebadge{font-size:10px;font-weight:800;letter-spacing:.03em;color:var(--red);background:var(--haloRed);border-radius:6px;padding:2px 7px}
.at-statetag{font-size:10px;font-weight:800;letter-spacing:.03em;border-radius:6px;padding:2px 7px}
.at-statetag.skip{color:var(--amber);background:var(--chipBg);border:1px solid var(--border)}
.at-statetag.rep{color:var(--orange);background:var(--chipBg);border:1px solid var(--border)}
.at-statetag.doing{color:var(--doing);background:var(--chipBg);border:1px solid var(--border)}
.at-coltitle .dot.doing{background:var(--doing)}
.at-card.doing{box-shadow:inset 3px 0 0 var(--doing)}
.at-cact{display:flex;align-items:center;gap:6px;flex:none}
.at-ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--border);
  border-radius:8px;background:var(--s2);color:var(--muted);cursor:pointer;transition:color .15s,background .15s,border-color .15s}
.at-ibtn:hover{background:var(--s3);color:var(--text)}

/* ===== KANBAN ===== */
.at-kanban{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.at-col{background:var(--sideBg);border:1px solid var(--border);border-radius:14px;padding:12px;min-height:120px;transition:border-color .15s,background .15s}
.at-col.dragover{border-color:var(--brand);background:var(--activeBg)}
.at-colhd{display:flex;align-items:center;gap:9px;padding:4px 6px 12px}
.at-coltitle{font-size:13px;font-weight:800;letter-spacing:.01em;color:var(--text)}
.at-coltitle .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:7px;vertical-align:middle}
.at-coltitle .dot.todo{background:var(--amber)}
.at-coltitle .dot.done{background:var(--green)}
.at-colcount{font-size:11px;font-weight:800;color:var(--muted2);background:var(--chipBg);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.at-colbody{display:flex;flex-direction:column;gap:9px;min-height:60px}
.at-cardk{background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:12px 13px;cursor:grab}
.at-cardk:active{cursor:grabbing}
.at-cardk.late{border-color:var(--red);box-shadow:0 0 0 3px var(--haloRed)}
.at-cardk.drag{opacity:.4}
.at-kt{display:flex;align-items:flex-start;gap:10px}
.at-kcheck{flex:none;margin-top:1px}
.at-ktitle{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--text);line-height:1.3}
.at-kmeta{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:9px}
.at-kfoot{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:11px;padding-top:10px;border-top:1px solid var(--border)}
.at-kdate{font-size:11px;font-weight:700;color:var(--muted)}
.at-kdate.late{color:var(--red)}
.at-colempty{font-size:12px;font-weight:500;color:var(--muted2);padding:14px 8px;text-align:center}

/* cap aviso */
.at-capnote{font-size:11.5px;font-weight:600;color:var(--amber);margin:14px 2px 0}

/* onboarding (first-run) */
.at-onb{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:30px 30px 28px;max-width:720px}
.at-onb-ic{width:46px;height:46px;border-radius:13px;background:var(--activeBg);color:var(--greenText);display:flex;align-items:center;justify-content:center;margin-bottom:16px}
.at-onb-t{font-size:19px;font-weight:800;letter-spacing:-.01em}
.at-onb-p{font-size:13.5px;font-weight:500;color:var(--muted);line-height:1.55;margin-top:8px;max-width:620px}
.at-onb-prev{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0 6px}
.at-pchip{display:inline-flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--text);
  background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:7px 11px}
.at-pchip svg{color:var(--muted2)}
.at-onb-actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:22px}
.at-onb-note{font-size:12.5px;font-weight:500;color:var(--muted2);margin-top:18px}

/* skeleton / erro / sem-acesso */
.at-skel{display:flex;flex-direction:column;gap:10px}
.at-skrow{height:60px;border-radius:12px;border:1px solid var(--border);background:
  linear-gradient(90deg,var(--s1) 0%,var(--s2) 50%,var(--s1) 100%);background-size:200% 100%;animation:atsk 1.2s ease-in-out infinite}
@keyframes atsk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.at-msg{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:34px 30px;max-width:560px;text-align:center;margin:8px auto 0}
.at-msg-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;
  background:var(--chipBg);color:var(--muted)}
.at-msg-ic.err{color:var(--red)}
.at-msg-t{font-size:16px;font-weight:800}
.at-msg-p{font-size:13px;font-weight:500;color:var(--muted);line-height:1.5;margin-top:7px}
.at-msg-actions{display:flex;justify-content:center;margin-top:18px}

/* toast */
.at-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:80;
  display:flex;align-items:center;gap:10px;max-width:90vw;padding:12px 16px;border-radius:11px;
  background:var(--s2);border:1px solid var(--border);box-shadow:var(--cardShadow);
  font-size:13px;font-weight:600;color:var(--text);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.at-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.at-toast .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--brand)}
.at-toast.err .bar{background:var(--red)}

/* toggle de tema temporário (até existir a tela Configurações) */
.at-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;
  font-family:inherit;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--cardShadow)}
.at-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}

/* extras de modal próprios desta tela */
.at-textarea{width:100%;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);background:var(--s2);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;line-height:1.5;resize:vertical;min-height:74px}
.at-textarea::placeholder{color:var(--muted2);font-weight:500}
.at-textarea:focus{outline:none;border-color:var(--brand);background:var(--s1)}
.at-date{width:100%;font-family:inherit;font-size:13.5px;font-weight:600;color:var(--text);background:var(--s2);
  border:1px solid var(--border);border-radius:10px;padding:9px 12px}
.at-date:focus{outline:none;border-color:var(--brand)}
.at-date:disabled{color:var(--muted);background:var(--s3);cursor:not-allowed}
.at-row2{display:flex;gap:12px;flex-wrap:wrap}
.at-row2>*{flex:1;min-width:150px}
.at-subs{margin:10px 0 4px 14px;border-left:2px solid var(--border);padding-left:14px}
.at-sub{display:flex;align-items:center;gap:10px;padding:6px 0}
.at-sub-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.at-sub-sel{appearance:none;font-family:inherit;font-size:12px;font-weight:700;background:var(--s2);color:var(--text);border:1px solid var(--border);border-radius:8px;padding:4px 8px;cursor:pointer}
.at-sub-x{appearance:none;border:0;background:transparent;color:var(--muted2);cursor:pointer;padding:2px;display:inline-flex}
.at-sub-x:hover{color:var(--red)}
.at-addsub{display:flex;gap:8px;margin-top:8px}
.at-addsub .ui-input{flex:1}
.at-i{appearance:none;border:0;background:transparent;color:var(--muted2);cursor:pointer;padding:2px;display:inline-flex;align-items:center}
.at-i:hover{color:var(--text)}
.at-subchip{display:inline-flex;align-items:center;gap:4px;font-size:10.5px;font-weight:800;color:var(--doing);background:var(--chipBg);border:0;border-radius:20px;padding:2px 8px;cursor:pointer;font-family:inherit}
.at-recbox{display:flex;flex-direction:column;gap:14px;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px}
.at-grp{display:flex;flex-direction:column;gap:12px}
.at-wdays{display:flex;gap:7px;flex-wrap:wrap}
.at-wday{font-family:inherit;font-size:12px;font-weight:800;color:var(--muted);background:var(--s1);border:1px solid var(--border);
  border-radius:9px;width:42px;height:38px;cursor:pointer;transition:color .15s,background .15s,border-color .15s}
.at-wday:hover{color:var(--text)}
.at-wday.on{color:var(--ctaText);background:var(--cta);border-color:var(--cta)}
.at-note{font-size:12px;font-weight:600;color:var(--muted);line-height:1.45}
.at-banner{display:none;font-size:12.5px;font-weight:600;color:var(--red);background:var(--chipBg);border:1px solid var(--red);
  border-radius:10px;padding:10px 12px;line-height:1.4}
.at-banner.on{display:block}
.at-actsheet{display:flex;flex-direction:column;gap:8px}
.at-actbtn{display:flex;align-items:center;gap:11px;width:100%;text-align:left;font-family:inherit;font-size:13.5px;font-weight:700;
  color:var(--text);background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:12px 14px;cursor:pointer;transition:background .15s,border-color .15s,color .15s}
.at-actbtn:hover{background:var(--s3)}
.at-actbtn svg{color:var(--muted);flex:none}
.at-actbtn.danger{color:var(--red)}
.at-actbtn.danger svg{color:var(--red)}
.at-actbtn.danger:hover{border-color:var(--red)}
.at-actbtn .sub{display:block;font-size:11px;font-weight:500;color:var(--muted2);margin-top:2px}
.at-reqinfo{font-size:12px;font-weight:600;color:var(--muted);line-height:1.5;background:var(--chipBg);
  border:1px solid var(--border);border-radius:10px;padding:11px 13px}
.at-reqinfo b{color:var(--text)}

/* fila de pendentes */
.at-pend{display:flex;flex-direction:column;gap:11px}
.at-pcard{background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:13px 14px}
.at-pt{font-size:13.5px;font-weight:700;color:var(--text)}
.at-pmeta{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:5px;line-height:1.5}
.at-pdates{display:flex;align-items:center;gap:9px;margin-top:9px;font-size:12.5px;font-weight:700}
.at-pdates .from{color:var(--muted);text-decoration:line-through}
.at-pdates .to{color:var(--greenText)}
.at-pdates svg{color:var(--muted2)}
.at-pwho{font-size:11px;font-weight:600;color:var(--muted2);margin-top:7px}
.at-pact{display:flex;gap:9px;margin-top:12px}
.at-pempty{font-size:13px;font-weight:500;color:var(--muted);text-align:center;padding:18px 8px}

/* lista de inativas */
.at-inact{display:flex;flex-direction:column;gap:9px}
.at-inrow{display:flex;align-items:center;gap:12px;background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:11px 13px}
.at-inname{flex:1;min-width:0;font-size:13.5px;font-weight:700;color:var(--muted)}
.at-inempty{font-size:13px;font-weight:500;color:var(--muted);text-align:center;padding:16px 8px}

/* disabled (botão sem permissão) */
.at-disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.2)}

@media (max-width:900px){
  .at-app>.ui-side{display:none}
  .at-top{display:none}
  .at-mhead{display:flex}
  .at-content{padding:16px 18px 44px}
  .at-kanban{grid-template-columns:1fr}
  .at-search{min-width:0;flex:1}
  .at-toolright{width:100%}
}
/* F1-G · catálogo de ações */
.at-catlist{max-height:52vh;overflow:auto;display:flex;flex-direction:column;gap:6px;margin-top:8px}
.at-catrow{display:flex;align-items:center;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--surface)}
.at-catc{flex:1;min-width:0}
.at-catt{font-weight:600;font-size:.86rem;color:var(--text)}
.at-cats{font-size:.74rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
</style>
</head>
<body>

  <!-- portão de acesso (guard.js controla) -->
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="at-dev" data-theme-toggle type="button" title="Alternar tema (temporário)"><span class="pin"></span>Tema</button>

  <div class="at-app" id="app">
    <main class="at-main">

      <div class="at-top">
        <div style="line-height:1.2">
          <h1 class="at-hi">Atividades</h1>
          <div class="at-dd">Rotinas e tarefas recorrentes por setor · cada cartão é uma ocorrência da agenda</div>
        </div>
      </div>

      <div class="at-mhead">
        <div>
          <h1 class="at-mg">Atividades</h1>
          <div class="at-md">Rotinas por setor</div>
        </div>
        <span id="at-mav"></span>
      </div>

      <div class="at-content">
        <div id="at-toolbar"></div>
        <div id="at-stage"></div>
      </div>

    </main>
  </div>

  <div class="at-toast" id="at-toast"><span class="bar"></span><span id="at-toast-msg"></span></div>

  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script src="cascade.js"></script>
  <script src="ctx.js"></script>
  <script src="catalogo.js"></script>
  <script src="lentes.js"></script>
  <script>
  (function () {
    'use strict';

    /* =========================================================
       USUÁRIO ATUAL — placeholder até o Guard.onReady publicar o
       usuário real (mesma estratégia das telas Setores/Usuários).
       Perfis: 'Admin' | 'Editor' | 'Visualizador' | 'Consultor Externo'
       ========================================================= */
    var CURRENT_USER = { uid: null, name: '—', profile: 'Visualizador', initials: '—' };
    var CAN_WRITE = false;   /* Admin ou Editor — cria/edita/conclui */
    var IS_ADMIN  = false;   /* super-autorizador da fila de mudança de data */

    var R = window.GrautRecorrencia;   /* motor puro (já validado no Node) */

    /* =========================================================
       CAMADA DE DADOS — Firestore. Coleções: atividades, ocorrencias,
       solicitacoes, usuarios, setores, atividade_log. Disciplina
       where()/limit() nas grandes (atividades/ocorrencias); filtro de
       setor é feito em memória para não exigir índice composto. Toda
       mutação registra em atividade_log (best-effort). Namespace
       exclusivo do Sistema A — nunca toca GMIX.
       ========================================================= */
    var Store = (function () {
      var _fb = null;
      function fb() {
        if (!_fb) {
          _fb = Promise.all([
            import('./firebase.js'),
            import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
          ]).then(function (m) { return { db: m[0].db, f: m[1] }; });
        }
        return _fb;
      }

      /* Traduz erro técnico do Firestore para linguagem leiga. */
      function ferr(e) {
        var code = (e && e.code) || '';
        if (code === 'permission-denied') {
          return Object.assign(new Error('Sem permissão para esta operação. Confirme seu perfil e que as Regras do Firestore foram publicadas.'), { field: 'geral', code: code });
        }
        if (code === 'unavailable' || code === 'failed-precondition' || code === 'deadline-exceeded') {
          return Object.assign(new Error('Não consegui falar com o banco agora. Verifique a conexão e tente de novo.'), { field: 'geral', code: code });
        }
        return Object.assign(new Error((e && e.message) || 'Erro ao acessar o banco.'), { field: 'geral', code: code });
      }

      function mapDocs(snap) { var a = []; snap.forEach(function (d) { a.push(Object.assign({ id: d.id }, d.data())); }); return a; }

      var api = {
        /* ----- leituras de apoio ----- */
        listSetores: function () {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            return f.getDocs(f.collection(db, 'setores')).then(function (snap) {
              var a = []; snap.forEach(function (d) { a.push(d.data()); });
              a.sort(function (x, y) { return (x.ordem || 0) - (y.ordem || 0) || (x.sigla < y.sigla ? -1 : 1); });
              return a;
            });
          }).catch(function (e) { throw ferr(e); });
        },

        /* Usuários ativos para o picker de responsável. Rule de 'list':
           gestor E líder (F1-D). O líder é recortado ao escopo no cliente
           (KPI.usuariosNoEscopo). Demais perfis: permission-denied →
           fallback (auto-atribuição). */
        listUsuariosAtivos: function () {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var q = f.query(f.collection(db, 'usuarios'), f.where('ativo', '==', true), f.limit(1000));
            return f.getDocs(q).then(function (snap) {
              /* F1-H: setor + setoresLiderados de volta no shape — o recorte do
                 líder (KPI.usuariosNoEscopo, contrato F1-D) e a sugestão de
                 supervisor (KPI.sugerirSupervisor) dependem deles. */
              var a = []; snap.forEach(function (d) { var u = d.data() || {}; a.push({ uid: d.id, nome: u.nome || '(sem nome)', perfil: u.perfil || '', setor: u.setor || null, setoresLiderados: Array.isArray(u.setoresLiderados) ? u.setoresLiderados : [] }); });
              a.sort(function (x, y) { return (x.nome || '').localeCompare(y.nome || '', 'pt-BR'); });
              return a;
            });
          }).catch(function (e) { throw ferr(e); });
        },

        /* R4-B2: subtarefas migraram do detalhe do projeto (morto) para ca.
           Hierarquia travada: Atividade -> Subtarefa, cascade de % (cascade.js).
           1 query GLOBAL, agrupada por atividadeId no cliente (decisao 2.8). */
        listSubtarefas: function () {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var q = f.query(f.collection(db, 'subtarefas'), f.where('ativo', '==', true), f.limit(2000));
            return f.getDocs(q).then(mapDocs);
          }).catch(function (e) { throw ferr(e); });
        },
        criarSubtarefa: function (atividadeId, texto, ordem) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var doc = { atividadeId: atividadeId, texto: texto, pct: 0, ordem: ordem, ativo: true, criadoEm: Date.now() };
            return f.addDoc(f.collection(db, 'subtarefas'), doc).then(function (ref) {
              api.log({ acao: 'criar_subtarefa', entidade: 'subtarefa', refId: ref.id, antes: null, depois: doc });
              return ref.id;
            });
          }).catch(function (e) { throw ferr(e); });
        },
        atualizarSubtarefa: function (id, patch, antes) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            return f.updateDoc(f.doc(db, 'subtarefas', id), patch).then(function () {
              api.log({ acao: 'editar_subtarefa', entidade: 'subtarefa', refId: id, antes: antes || null, depois: patch });
            });
          }).catch(function (e) { throw ferr(e); });
        },
        inativarSubtarefa: function (id) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            return f.updateDoc(f.doc(db, 'subtarefas', id), { ativo: false }).then(function () {
              api.log({ acao: 'inativar_subtarefa', entidade: 'subtarefa', refId: id, antes: { ativo: true }, depois: { ativo: false } });
            });
          }).catch(function (e) { throw ferr(e); });
        },

        /* Todas as atividades ATIVAS (sem filtro de setor — o filtro é em
           memória). Teto 2000 + filtro single-field = sem índice composto. */
        listAtividadesAtivas: function () {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var q = f.query(f.collection(db, 'atividades'), f.where('ativo', '==', true), f.limit(2000));
            return f.getDocs(q).then(mapDocs);
          }).catch(function (e) { throw ferr(e); });
        },

        listInativas: function () {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var q = f.query(f.collection(db, 'atividades'), f.where('ativo', '==', false), f.limit(500));
            return f.getDocs(q).then(mapDocs);
          }).catch(function (e) { throw ferr(e); });
        },

        /* Ocorrências (overrides gravados) da janela. Range em campo único
           (data) → sem índice composto; filtro de setor em memória. */
        listOcorrencias: function (jIni, jFim) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var q = f.query(f.collection(db, 'ocorrencias'), f.where('data', '>=', jIni), f.where('data', '<=', jFim), f.limit(3000));
            return f.getDocs(q).then(function (snap) { var a = []; snap.forEach(function (d) { a.push(d.data()); }); return a; });
          }).catch(function (e) { throw ferr(e); });
        },

        listPendentes: function () {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var q = f.query(f.collection(db, 'solicitacoes'), f.where('status', '==', 'pendente'), f.limit(200));
            return f.getDocs(q).then(mapDocs);
          }).catch(function (e) { throw ferr(e); });
        },

        /* ----- mutações de atividade ----- */
        criarAtividade: function (data, uid) {
          return fb().then(function (c) {
            var db = c.db, f = c.f, now = Date.now();
            var doc = Object.assign({}, data, {
              ativo: true, criadoPor: uid, criadoEm: now, atualizadoEm: now /* R4-B2: projetoSigla morreu */
            });
            return f.addDoc(f.collection(db, 'atividades'), doc).then(function (ref) {
              api.log({ acao: 'criar_atividade', entidade: 'atividade', refId: ref.id, antes: null, depois: doc });
              return ref.id;
            });
          }).catch(function (e) { throw ferr(e); });
        },

        atualizarAtividade: function (id, patch, antes) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var up = Object.assign({}, patch, { atualizadoEm: Date.now() });
            return f.updateDoc(f.doc(db, 'atividades', id), up).then(function () {
              api.log({ acao: 'editar_atividade', entidade: 'atividade', refId: id, antes: antes || null, depois: patch });
            });
          }).catch(function (e) { throw ferr(e); });
        },

        inativarAtividade: function (id) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            return f.updateDoc(f.doc(db, 'atividades', id), { ativo: false, atualizadoEm: Date.now() }).then(function () {
              api.log({ acao: 'inativar_atividade', entidade: 'atividade', refId: id, antes: { ativo: true }, depois: { ativo: false } });
            });
          }).catch(function (e) { throw ferr(e); });
        },

        reativarAtividade: function (id) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            return f.updateDoc(f.doc(db, 'atividades', id), { ativo: true, atualizadoEm: Date.now() }).then(function () {
              api.log({ acao: 'reativar_atividade', entidade: 'atividade', refId: id, antes: { ativo: false }, depois: { ativo: true } });
            });
          }).catch(function (e) { throw ferr(e); });
        },

        /* ----- mutação de ocorrência (override idempotente) ----- */
        setOcorrencia: function (act, origData, patch, acao) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var idoc = R.docIdOcorrencia(act.id, origData);
            var base = {
              atividadeId: act.id,
              setorSigla: act.setorSigla,
              responsavelUid: act.responsavelUid || null,
              data: origData,
              prazoOriginal: origData
            };
            var body = Object.assign(base, patch);
            return f.setDoc(f.doc(db, 'ocorrencias', idoc), body, { merge: true }).then(function () {
              api.log({ acao: acao || 'editar_ocorrencia', entidade: 'ocorrencia', refId: idoc, antes: null, depois: patch });
            });
          }).catch(function (e) { throw ferr(e); });
        },

        /* ----- solicitações de mudança de data ----- */
        createSolicitacao: function (d) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var doc = Object.assign({ status: 'pendente', criadoEm: Date.now() }, d);
            return f.addDoc(f.collection(db, 'solicitacoes'), doc).then(function (ref) {
              api.log({ acao: 'solicitar_data', entidade: 'solicitacao', refId: ref.id, antes: { data: d.dataAtual }, depois: { data: d.dataProposta } });
              return ref.id;
            });
          }).catch(function (e) { throw ferr(e); });
        },

        decidirSolicitacao: function (id, patch) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            return f.updateDoc(f.doc(db, 'solicitacoes', id), patch).then(function () {
              api.log({ acao: patch.status === 'aprovada' ? 'aprovar_data' : 'rejeitar_data', entidade: 'solicitacao', refId: id, antes: { status: 'pendente' }, depois: { status: patch.status } });
            });
          }).catch(function (e) { throw ferr(e); });
        },

        /* ----- log append-only (best-effort: nunca derruba a UX) ----- */
        log: function (entry) {
          return fb().then(function (c) {
            var db = c.db, f = c.f;
            var row = Object.assign({ ts: Date.now(), uid: (CURRENT_USER && CURRENT_USER.uid) || null }, entry);
            return f.addDoc(f.collection(db, 'atividade_log'), row);
          }).catch(function (e) { if (window.console && console.warn) { console.warn('[atividades] log falhou', e); } });
        }
      };
      return api;
    })();

    /* ===================== util de DOM ===================== */
    function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
    /* txt(): texto via textContent — nunca interpola dado do usuário em HTML (anti-injeção) */
    function txt(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } e.textContent = text == null ? '' : text; return e; }
    function ico(d, size) {
      size = size || 16;
      var s = document.createElement('span'); s.style.display = 'inline-flex';
      s.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +
        '" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">' + d + '</svg>';
      return s.firstChild;
    }
    var PATH = {
      pencil: '<path d="M12 20h9"></path><path d="M16.5 3.5a2.12 2.12 0 0 1 3 3L7 19l-4 1 1-4z"></path>',
      archive: '<rect x="3" y="4" width="18" height="4" rx="1"></rect><path d="M5 8v11a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1V8"></path><path d="M10 12h4"></path>',
      restore: '<path d="M3 8V3h5"></path><path d="M3.5 8a9 9 0 1 0 2.2-2.9"></path>',
      lock: '<rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path>',
      alert: '<path d="M12 9v4"></path><path d="M12 17h.01"></path><path d="M10.3 3.9 2 18a2 2 0 0 0 1.7 3h16.6a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0z"></path>',
      repeat: '<polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path>',
      clock: '<circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path>',
      user: '<circle cx="9" cy="8" r="3.4"></circle><path d="M2.5 20c0-3.6 2.9-6.5 6.5-6.5s6.5 2.9 6.5 6.5"></path><path d="M16.5 5.2a3.4 3.4 0 0 1 0 6"></path>',
      check: '<path d="M5 12l4.5 4.5L19 6"></path>',
      undo: '<path d="M3 8V3h5"></path><path d="M3.5 8a9 9 0 1 0 2.2-2.9"></path>',
      skip: '<path d="M5 4l10 8-10 8z"></path><path d="M19 5v14"></path>',
      play: '<path d="M6 4l12 8-12 8z"></path>',
      calendar: '<rect x="3" y="4.5" width="18" height="17" rx="2"></rect><path d="M3 9h18M8 2.5v4M16 2.5v4"></path>',
      arrow: '<path d="M5 12h14"></path><path d="M13 6l6 6-6 6"></path>',
      bell: '<path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.7 21a2 2 0 0 1-3.4 0"></path>',
      dots: '<circle cx="5" cy="12" r="1.6" fill="currentColor" stroke="none"></circle><circle cx="12" cy="12" r="1.6" fill="currentColor" stroke="none"></circle><circle cx="19" cy="12" r="1.6" fill="currentColor" stroke="none"></circle>',
      plus: '<path d="M12 5v14M5 12h14"></path>',
      x: '<path d="M18 6 6 18M6 6l12 12"></path>'
    };
    function initialsOf(name) {
      var s = String(name || '').trim(); if (!s) { return 'U'; }
      var p = s.split(/\s+/);
      if (p.length === 1) { return p[0].slice(0, 2).toUpperCase(); }
      return (p[0].charAt(0) + p[p.length - 1].charAt(0)).toUpperCase();
    }

    /* ===================== helpers de data civil ===================== */
    function pad2(n) { return n < 10 ? '0' + n : '' + n; }
    function fmtBR(iso) { if (!iso) { return ''; } var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
    var DOW = ['Dom', 'Seg', 'Ter', 'Qua', 'Qui', 'Sex', 'Sáb'];
    function dayLabel(iso) {
      var hoje = R.hojeISO();
      if (iso === hoje) { return 'Hoje'; }
      if (iso === R.addDias(hoje, 1)) { return 'Amanhã'; }
      if (iso === R.addDias(hoje, -1)) { return 'Ontem'; }
      var p = iso.split('-');
      return DOW[R.diaSemana(iso)] + ' · ' + p[2] + '/' + p[1];
    }
    /* janela [jIni,jFim] por período. 'band' = atrasadas + próximos 30 dias. */
    function windowFor(p) {
      var hoje = R.hojeISO();
      if (p === 'semana') { return { jIni: hoje, jFim: R.addDias(hoje, 6) }; }
      if (p === 'mes') {
        var y = parseInt(hoje.slice(0, 4), 10), m = parseInt(hoje.slice(5, 7), 10);
        return { jIni: y + '-' + pad2(m) + '-01', jFim: y + '-' + pad2(m) + '-' + pad2(R.ultimoDiaMes(y, m)) };
      }
      return { jIni: R.addDias(hoje, -45), jFim: R.addDias(hoje, 30) };
    }
    var PERIODO_LABEL = { band: 'atrasadas + 30 dias', semana: 'esta semana', mes: 'este mês' };
    var RECOR_LABEL = { diario: 'Diária', semanal: 'Semanal', quinzenal: 'Quinzenal', mensal: 'Mensal', bimestral: 'Bimestral', trimestral: 'Trimestral', unico: 'Única' };

    var CAP = 300; /* teto de cartões renderizados por vez */

    /* ===================== estado ===================== */
    var SETORES = [];      /* docs de setores */
    var ATIV = [];         /* TODAS as atividades ativas (filtro de setor é em memória) */
    var USERS = [];        /* usuários ativos p/ picker (pode vir vazio sem permissão) */
    var USERS_ALL = [];    /* F1-H: lista completa p/ a cadeia de supervisor (o gestor pode estar fora do escopo do líder) */
    var SUBS = {};         /* R4-B2: atividadeId -> [subtarefas] (cascade mora aqui) */
    var CC = window.GrautCascade; /* motor puro do % (cascade.js) — CC para nao colidir com o C do catalogo */
    var OCC_DOCS = [];     /* docs de ocorrencias na janela */
    var OCC_BY_ATIV = {};  /* atividadeId -> [override docs] */
    var PEND = [];         /* solicitacoes pendentes */
    var BOARD = [];        /* ocorrências enriquecidas (após filtro/busca) */
    var byKey = {};        /* key -> ocorrência (para drag & drop e ações) */
    var dragKey = null;    /* ocorrência em arraste */
    var capped = false;    /* houve corte pelo teto? */

          /* F1-I: deep-link vindo do drill da Inteligência (#a=<id>) —
             pré-preenche a busca com o título da atividade e limpa o hash. */
          try {
            var mHash = /[#&]a=([^&]+)/.exec(window.location.hash || '');

          } catch (eH) { }

    /* ===================== toolbar ===================== */
    function setoresRaiz() { return SETORES.filter(function (s) { return !s.setorPaiSigla && s.ativo; }); }
    function subsetoresDe(sig) { return SETORES.filter(function (s) { return s.setorPaiSigla === sig; }); }
    function nomeSetor(sig) { var s = SETORES.filter(function (x) { return x.sigla === sig; })[0]; return s ? s.nome : sig; }
    /* cor efetiva do setor por sigla: cor salva → subsetor herda do pai → fallback por ordem */
    function corSetor(sig) {
      var s = SETORES.filter(function (x) { return x.sigla === sig; })[0];
      if (!s) { return 'setor1'; }
      if (/^setor[1-8]$/.test(s.cor)) { return s.cor; }
      if (s.setorPaiSigla) { return corSetor(s.setorPaiSigla); }
      var o = s.ordem || 1; return 'setor' + (((o - 1) % 8) + 1);
    }
    /* multi-homing: siglas em que a atividade aparece (todos → todas as raízes ativas; senão array; senão o setor principal legado) */
    function setoresRaizAtivasSiglas() { return setoresRaiz().map(function (s) { return s.sigla; }); }
    function setoresDe(act) {
      if (act && act.todosSetores) { return setoresRaizAtivasSiglas(); }
      if (act && Array.isArray(act.setorSiglas) && act.setorSiglas.length) { return act.setorSiglas.slice(); }
      return (act && act.setorSigla) ? [act.setorSigla] : [];
    }
    function uniqSig(a) { var seen = {}, out = []; a.forEach(function (x) { if (x && !seen[x]) { seen[x] = 1; out.push(x); } }); return out; }

    /* F1-B · escopo de visibilidade por papel (RBAC de conteúdo).
       gestor: tudo · líder: interseção com setoresLiderados (todos→visível) ·
       usuário: só as suas (responsavelUid). Reaproveita o setoresDe local. */
    function visivelPara(act, u) {
      if (!u) { return false; }
      if (u.perfil === 'gestor') { return true; }
      if (u.perfil === 'lider') {
        var lid = Array.isArray(u.setoresLiderados) ? u.setoresLiderados : [];
        if (!lid.length) { return false; }
        if (act && act.todosSetores) { return true; }
        var sigs = setoresDe(act);
        for (var i = 0; i < sigs.length; i++) { if (lid.indexOf(sigs[i]) !== -1) { return true; } }
        return false;
      }
      if (u.perfil === 'usuario') { return !!(act && act.responsavelUid && u.uid && act.responsavelUid === u.uid); }
      return false;
    }

    function renderToolbar() {

      var right = el('<div class="at-toolright"></div>');

      /* REGRA GLOBAL 5 (topo enxuto): o filtro de setor é o contexto global
         GrautCtx (à esquerda) — o select local redundante foi removido.
         selSetor permanece '' (variável preservada; sem UI). */

      /* período (segmented) */
      var seg = el('<div class="at-seg" role="group" aria-label="Período"></div>');
      [['band', 'Atrasadas + 30d'], ['semana', 'Semana'], ['mes', 'Mês']].forEach(function (p) {
        var b = el('<button type="button"' + (periodo === p[0] ? ' class="on"' : '') + '></button>'); b.textContent = p[1];
        b.addEventListener('click', function () { if (periodo === p[0]) { return; } periodo = p[0]; refresh(); });

      var sinp = el('<input type="text" placeholder="Buscar título, responsável, setor…" autocomplete="off" spellcheck="false">');

        searchTimer = setTimeout(function () { renderBoard(); updateCount(); }, 180);

      /* sino de pendentes (só quem escreve) */

        bell.addEventListener('click', openPendentes);

        right.appendChild(UI.button({ label: 'Usar do catálogo', icon: 'list', onClick: abrirCatalogo }));
        right.appendChild(UI.button({ label: 'Criar do zero', icon: 'plus', variant: 'ghost', onClick: function () { openEditor(null); } }));

    /* atualiza só o número de ocorrências (sem reconstruir a toolbar — preserva o foco da busca) */
    function updateCount() {
      var c = toolbarEl.querySelector('.at-count');
      if (c) { c.innerHTML = '<b>' + BOARD.length + '</b> ocorrência(s) · ' + PERIODO_LABEL[periodo]; }

    /* ===================== permissões de ação ===================== */
    function isOwner(act) { return !!(act && act.criadoPor && CURRENT_USER.uid && act.criadoPor === CURRENT_USER.uid); }
    function canApproveDirect(act) { return IS_ADMIN || isOwner(act); }
    function pendentesAcionaveis() {
      return PEND.filter(function (s) { return IS_ADMIN || (s.donoUid && s.donoUid === CURRENT_USER.uid); });
    }

    /* ===================== construção das ocorrências ===================== */
    /* Monta a lista de ocorrências (cartões) da janela atual, aplicando
       filtro de setor e busca, recomputando "atrasada" pela data efetiva
       (override de data conta) e ordenando por data efetiva + horário. */
    function buildOccurrences() {
      var w = windowFor(periodo);
      var hoje = R.hojeISO();
      var term = search.trim().toLowerCase();
      var out = [];

      ATIV.forEach(function (act) {
        if (!visivelPara(act, CURRENT_USER)) { return; }   /* F1-B: escopo por papel */
        if (window.GrautCtx && !GrautCtx.aplicaAtividade(act, GrautCtx.sanear(GrautCtx.get(), SETORES, CURRENT_USER))) { return; } /* F1-D(j): pré-filtro global */
        if (selSetor && !act.todosSetores && setoresDe(act).indexOf(selSetor) === -1) { return; }
        /* R3 · lente ativa como predicado: EU FAÇO = responsável sou eu ·
           EU COBRO = da equipe (inclui sem responsável, que é cobrança de
           higiene) · OS NÚMEROS = escopo completo (sem corte). */
        if (window.GrautLentes) {
          var _lt = GrautLentes.ativa();
          if (_lt === 'eufaco' && act.responsavelUid !== CURRENT_USER.uid) { return; }
          if (_lt === 'eucobro' && act.responsavelUid === CURRENT_USER.uid) { return; }
        }
        var ovs = OCC_BY_ATIV[act.id] || [];
        var occs = R.ocorrenciasNaJanela(act, w.jIni, w.jFim, ovs, hoje);
        occs.forEach(function (oc) {
          var ov = oc.override || null;
          var effDate = (ov && ov.dataOverride) || oc.data;
          var aberto = (oc.status === 'pendente' || oc.status === 'reprogramada' || oc.status === 'em_andamento');
          var enriched = {
            key: act.id + '|' + oc.data,
            act: act,
            origData: oc.data,
            effDate: effDate,
            status: oc.status,
            ov: ov,
            titulo: (ov && ov.tituloOverride) || act.titulo,
            horario: (ov && ov.horarioOverride) || act.horario || '',
            atrasada: aberto && R.compareISO(effDate, hoje) < 0
          };
          out.push(enriched);
        });
      });

      if (term) {
        out = out.filter(function (o) {
          var hay = (o.titulo || '') + ' ' + (o.act.responsavelNome || '') + ' ' + (o.act.supervisorNome || '') + ' ' + setoresDe(o.act).join(' ') + ' ' + (o.act.subsetorSigla || '') + (o.act.todosSetores ? ' todos' : '');
          return hay.toLowerCase().indexOf(term) !== -1;
        });
      }

      out.sort(function (a, b) {
        if (a.effDate !== b.effDate) { return a.effDate < b.effDate ? -1 : 1; }
        var ha = a.horario || '99:99', hb = b.horario || '99:99';
        if (ha !== hb) { return ha < hb ? -1 : 1; }
        return (a.titulo || '').localeCompare(b.titulo || '', 'pt-BR');
      });

      capped = out.length > CAP;
      if (capped) { out = out.slice(0, CAP); }

      byKey = {};
      out.forEach(function (o) { byKey[o.key] = o; });
      return out;
    }

    /* R3 · "i" desta tela (mesmo padrão do Hoje — Protocolo A) */
    function infoAt(titulo, d) {
      var b = el('<button type="button" aria-label="Como este número é calculado" title="Como este número é calculado" style="width:18px;height:18px;border-radius:50%;border:1px solid var(--border);background:var(--s2);color:var(--muted);font-size:11px;font-weight:800;cursor:pointer;line-height:1;flex:none">i</button>');
      b.addEventListener('click', function (ev) {

        UI.modal({ title: titulo, width: 520, body: function () {
          var w = el('<div style="display:flex;flex-direction:column;gap:10px"></div>');
          [['FÓRMULA', dd.formula], ['DADOS', dd.dados], ['NÚMEROS DESTE CÁLCULO', dd.numeros]].forEach(function (r) {
            var s = el('<div></div>');
            s.appendChild(el('<div style="font-size:10px;font-weight:800;letter-spacing:.08em;color:var(--muted2);margin-bottom:3px">' + r[0] + '</div>'));
            var p = el('<div style="font-size:13px;color:var(--text);line-height:1.5"></div>'); p.textContent = r[1] || '—';
            s.appendChild(p); w.appendChild(s);
          });

    }

    /* R3 · lente OS NÚMEROS: os mesmos números do motor (KPI.computar) sobre
       o escopo da janela atual. Com esta lente ativa o predicado não corta

      head.appendChild(infoAt('Números da janela — como cada um é calculado', function () {
        return {
          formula: 'Aderência = concluídas ÷ previstas até hoje × 100 (meta 90%). Atrasadas = abertas com data efetiva vencida; aging = média de dias de atraso. Em andamento = status "em andamento". Reprogramação = reprogramadas ÷ total × 100 (limite 20%). Sem responsável = abertas sem dono (não medem).',
          dados: 'as MESMAS ocorrências desta tela (seu escopo + contexto de setor + busca + período acima); dia civil de Salvador.',
          numeros: 'ocorrências ' + mm.totais.ocorrencias + ' · aderência ' + (mm.aderencia == null ? '—' : mm.aderencia + '%') + ' · atrasadas ' + mm.totais.atrasadas + ' (aging ' + (Math.round(mm.agingMedio * 10) / 10) + 'd) · andamento ' + mm.totais.andamento + ' · reprog ' + mm.reprogPct + '% · sem resp. ' + mm.totais.semResp
        };
      }));
      wrap.appendChild(head);
      var grid = el('<div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px"></div>');
      [
        { label: 'Aderência à rotina', value: (mm.aderencia == null || mm.totais.previstasVencidas === 0) ? '—' : mm.aderencia + '%', sub: mm.totais.previstasVencidas === 0 ? 'coletando' : 'meta 90%', tone: (mm.aderencia == null || mm.totais.previstasVencidas === 0) ? 'amber' : (mm.aderencia >= 90 ? 'green' : mm.aderencia >= 80 ? 'amber' : 'red') },
        { label: 'Atrasadas agora', value: String(mm.totais.atrasadas), sub: mm.totais.atrasadas ? 'aging médio ' + (Math.round(mm.agingMedio * 10) / 10) + 'd' : 'nada vencido', tone: mm.totais.atrasadas ? 'red' : 'green' },
        { label: 'Em andamento', value: String(mm.totais.andamento), sub: 'já iniciadas', tone: mm.totais.andamento ? 'amber' : 'green' },
        { label: 'Concluídas na janela', value: String(mm.totais.concluidas), sub: 'de ' + mm.totais.ocorrencias + ' ocorrência(s)', tone: 'green' },
        { label: 'Reprogramação', value: mm.reprogPct + '%', sub: 'limite 20%', tone: mm.reprogPct > 20 ? 'red' : 'green' },
        { label: 'Sem responsável', value: String(mm.totais.semResp), sub: mm.totais.semResp ? 'defina o dono — não medem' : 'todas com dono', tone: mm.totais.semResp ? 'amber' : 'green' }
      ].forEach(function (k) { grid.appendChild(UI.kpiCard(k)); });
      wrap.appendChild(grid);
      wrap.appendChild(el('<div style="margin-top:12px;font-size:12px;color:var(--muted2)">Detalhe por pessoa em <a href="performance.html" style="color:var(--brand);font-weight:700">Performance</a> · plano de ação em <a href="inteligencia.html" style="color:var(--brand);font-weight:700">Inteligência</a>.</div>'));
      stage.appendChild(wrap);
    }

    function renderBoard() {
      BOARD = buildOccurrences();
      stage.innerHTML = '';
      /* R3 · lente OS NÚMEROS troca o palco pelos indicadores da janela */
      if (window.GrautLentes && GrautLentes.ativa() === 'numeros') { renderNumeros(); updateCount(); return; }
      if (!BOARD.length) {
        var box = el('<div class="at-msg"></div>');
        var icw = el('<div class="at-msg-ic"></div>'); icw.appendChild(ico(PATH.calendar, 22)); box.appendChild(icw);
        /* F1-B: distinguir "vazio por escopo" de "vazio por período/filtro" */
        var algumVisivel = ATIV.some(function (a) { return visivelPara(a, CURRENT_USER); });
        if (ATIV.length && !algumVisivel) {
          box.appendChild(el('<div class="at-msg-t">Nada no seu escopo</div>'));
          box.appendChild(txt('div', 'at-msg-p', (Guard.isLider && Guard.isLider())
            ? 'Você vê apenas as atividades dos setores que lidera.'
            : 'Você vê apenas as atividades atribuídas a você.'));
        } else {
          box.appendChild(el('<div class="at-msg-t">Nada na janela selecionada</div>'));
          box.appendChild(txt('div', 'at-msg-p', (search.trim() || selSetor) ? 'Nenhuma ocorrência bate com o filtro/busca atual. Limpe o filtro ou troque o período.' : 'Não há ocorrências para este período. Troque o período acima ou crie uma atividade.'));
        }
        stage.appendChild(box);
        return;
      }
      if (view === 'recor') { renderColunasRecorrencia(); }
      else if (view === 'kanban') { renderKanban(); }
      else if (view === 'setor') { renderPorSetor(); }
      else if (view === 'quadro') { renderQuadroSetor(); }
      else if (view === 'serie') { renderColapsadoSerie(); }
      else { renderList(); }
      if (capped) { stage.appendChild(txt('div', 'at-capnote', 'Mostrando as primeiras ' + CAP + ' ocorrências. Use o filtro de setor, a busca ou um período mais curto para refinar.')); }
      updateCount(); /* F1-E · 0.3: BOARD acabou de ser reconstruído — o contador do topo acompanha */
      if (window.GrautLentes) { GrautLentes.aplicar(); } /* R3 · lentes */
    }

    /* ----- meta comum dos cartões ----- */
    function metaChips(o, into) {
      if (o.act.todosSetores) {
        var alltag = txt('span', 'at-tag', 'Todos os setores'); alltag.style.color = 'var(--muted)'; alltag.style.background = 'var(--chipBg)'; into.appendChild(alltag);
      } else {
        setoresDe(o.act).forEach(function (sg) { var st = txt('span', 'at-tag', sg); var sc = corSetor(sg); st.style.color = 'var(--' + sc + ')'; st.style.background = 'var(--' + sc + 'Bg)'; into.appendChild(st); });
      }
      if (o.act.subsetorSigla) { var subt = txt('span', 'at-tag sub', o.act.subsetorSigla); var cc = corSetor(o.act.subsetorSigla); subt.style.color = 'var(--' + cc + ')'; subt.style.background = 'var(--' + cc + 'Bg)'; into.appendChild(subt); }
      var rec = el('<span class="at-recpill"></span>'); rec.appendChild(ico(PATH.repeat, 11)); rec.appendChild(document.createTextNode(RECOR_LABEL[o.act.recorrencia] || o.act.recorrencia)); into.appendChild(rec);
      if (o.horario) { var hr = el('<span class="at-mi"></span>'); hr.appendChild(ico(PATH.clock, 12)); hr.appendChild(document.createTextNode(o.horario)); into.appendChild(hr); }
      if (o.act.responsavelNome) { var rp = el('<span class="at-mi"></span>'); rp.appendChild(ico(PATH.user, 12)); rp.appendChild(document.createTextNode(o.act.responsavelNome)); into.appendChild(rp); }
      /* F1-H: supervisor visível no card (rastreabilidade de quem acompanha) */
      if (o.act.supervisorNome) { var sv = el('<span class="at-mi"></span>'); sv.appendChild(ico(PATH.user, 12)); sv.appendChild(document.createTextNode('Sup.: ' + o.act.supervisorNome)); into.appendChild(sv); }
      /* R4-B2: subtarefas da atividade — n + % (media, cascade.js). Chip
         clicavel abre o modal (leitura p/ todos; edicao so p/ quem escreve). */
      (function () {
        var sl = SUBS[o.act.id] || [];
        if (!sl.length) { return; }
        var pc = CC.pctAtividade({ subtarefas: sl });
        var sc = txt('button', 'at-subchip', sl.length + ' sub · ' + pc + '%');
        sc.type = 'button';
        sc.title = 'Subtarefas: ' + sl.length + ' · % da atividade = media dos % das subtarefas (cascade). Clique para abrir.';
        sc.addEventListener('click', function (ev) { ev.stopPropagation(); modalSubtarefas(o.act); });
        into.appendChild(sc);
      })();
      if (o.act.origemTipo === 'reuniao' || (o.act.origem && o.act.origem.tipo === 'reuniao')) {
        var rg = txt('span', 'at-tag', 'Reunião'); rg.style.color = 'var(--doing)'; rg.style.background = 'var(--chipBg)';
        var og = o.act.origem || {};
        rg.title = 'Nasceu na reunião' + (og.reuniaoTitulo ? ' "' + og.reuniaoTitulo + '"' : '') + (og.reuniaoData ? ' de ' + og.reuniaoData : '');
        into.appendChild(rg);
      }
      if (o.status === 'em_andamento') { into.appendChild(txt('span', 'at-statetag doing', 'Em andamento')); }
      if (o.status === 'reprogramada' && o.ov && o.ov.dataOverride) { into.appendChild(txt('span', 'at-statetag rep', 'Reprogramada → ' + fmtBR(o.ov.dataOverride))); }
      if (o.status === 'pulada') { into.appendChild(txt('span', 'at-statetag skip', 'Pulada')); }
      if (o.atrasada) { into.appendChild(txt('span', 'at-latebadge', 'Atrasada')); }
    }

    /* ===================== LISTA ===================== */
    function renderList() {
      var wrap = el('<div class="at-list"></div>');
      /* agrupa por data efetiva */
      var groups = []; var idx = {};
      BOARD.forEach(function (o) {
        var k = o.effDate;
        if (!(k in idx)) { idx[k] = groups.length; groups.push({ data: k, items: [] }); }
        groups[idx[k]].items.push(o);
      });

    function listCard(o) {
      var done = o.status === 'concluida';
      var skip = o.status === 'pulada';
      var doing = o.status === 'em_andamento';
      var card = el('<div class="at-card' + (o.atrasada ? ' late' : '') + (done ? ' done' : '') + (skip ? ' skip' : '') + (doing ? ' doing' : '') + '"></div>');

      /* check (concluir/reabrir) — só quem escreve */
      var chkHolder = el('<span class="at-check"></span>');
      if (CAN_WRITE && !skip) {
        chkHolder.appendChild(UI.checkbox({ checked: done, onToggle: function () { if (done) { reabrir(o); } else { concluir(o); } } }));
      } else {
        var ph = el('<span class="ui-check"><span class="box' + (done ? ' on' : '') + '"></span></span>');
        if (done) { ph.querySelector('.box').appendChild(UI.icon('check', 12)); }
        chkHolder.appendChild(ph);
      }
      card.appendChild(chkHolder);

      var main = el('<div class="at-cmain"></div>');
      main.appendChild(txt('div', 'at-ctitle', o.titulo));

        var act = el('<div class="at-cact"></div>');
        var more = el('<button class="at-ibtn" type="button" title="Mais ações"></button>'); more.appendChild(ico(PATH.dots, 16));
        more.addEventListener('click', function () { actionsMenu(o); });
        act.appendChild(more);

    }

    /* ===================== KANBAN ===================== */
    function renderKanban() {
      var todo = [], doing = [], doneList = [];
      BOARD.forEach(function (o) {
        if (o.status === 'concluida') { doneList.push(o); }
        else if (o.status === 'em_andamento') { doing.push(o); }
        else if (o.status === 'pulada') { /* puladas não entram no quadro */ }
        else { todo.push(o); } /* pendente + reprogramada */
      });
      var ordena = function (a, b) {
        if (a.atrasada !== b.atrasada) { return a.atrasada ? -1 : 1; }
        if (a.effDate !== b.effDate) { return a.effDate < b.effDate ? -1 : 1; }
        return (a.horario || '99:99') < (b.horario || '99:99') ? -1 : 1;
      };
      todo.sort(ordena); doing.sort(ordena);

      var grid = el('<div class="at-kanban"></div>');
      grid.appendChild(kanbanCol('A fazer', 'todo', todo, 'todo'));
      grid.appendChild(kanbanCol('Em andamento', 'doing', doing, 'doing'));
      grid.appendChild(kanbanCol('Concluída', 'done', doneList, 'done'));
      stage.appendChild(grid);
    }

    function kanbanCol(title, dotCls, items, colKind) {
      var col = el('<div class="at-col" data-col="' + colKind + '"></div>');
      var hd = el('<div class="at-colhd"></div>');
      var t = el('<div class="at-coltitle"></div>'); t.appendChild(el('<span class="dot ' + dotCls + '"></span>')); t.appendChild(document.createTextNode(title)); hd.appendChild(t);
      hd.appendChild(txt('span', 'at-colcount', String(items.length)));
      col.appendChild(hd);

      var body = el('<div class="at-colbody"></div>');
      if (!items.length) { body.appendChild(txt('div', 'at-colempty', colKind === 'done' ? 'Nenhuma concluída na janela.' : (colKind === 'doing' ? 'Nada em andamento.' : 'Nada a fazer aqui.'))); }
      else { items.forEach(function (o) { body.appendChild(kanbanCard(o)); }); }
      col.appendChild(body);

      /* drop zone (só quem escreve) */
      if (CAN_WRITE) {
        col.addEventListener('dragover', function (e) { e.preventDefault(); col.classList.add('dragover'); });
        col.addEventListener('dragleave', function () { col.classList.remove('dragover'); });
        col.addEventListener('drop', function (e) {
          e.preventDefault(); col.classList.remove('dragover');
          var o = dragKey ? byKey[dragKey] : null; dragKey = null;
          if (!o) { return; }
          if (colKind === 'done') { if (o.status !== 'concluida') { concluir(o); } }
          else if (colKind === 'doing') { if (o.status !== 'em_andamento') { iniciar(o); } }
          else { if (o.status === 'concluida') { reabrir(o); } else if (o.status !== 'pendente') { retomar(o); } }
        });
      }
      return col;
    }

    function kanbanCard(o) {
      var card = el('<div class="at-cardk' + (o.atrasada ? ' late' : '') + '"></div>');
      if (CAN_WRITE) {
        card.setAttribute('draggable', 'true');
        card.addEventListener('dragstart', function (e) { dragKey = o.key; card.classList.add('drag'); try { e.dataTransfer.setData('text/plain', o.key); e.dataTransfer.effectAllowed = 'move'; } catch (er) {} });
        card.addEventListener('dragend', function () { card.classList.remove('drag'); dragKey = null; });
      }
      var top = el('<div class="at-kt"></div>');
      var chk = el('<span class="at-kcheck"></span>');
      var done = o.status === 'concluida';
      if (CAN_WRITE) {
        chk.appendChild(UI.checkbox({ checked: done, onToggle: function () { if (done) { reabrir(o); } else { concluir(o); } } }));
      } else {
        var ph = el('<span class="ui-check"><span class="box' + (done ? ' on' : '') + '"></span></span>'); if (done) { ph.querySelector('.box').appendChild(UI.icon('check', 12)); } chk.appendChild(ph);
      }
      top.appendChild(chk);
      top.appendChild(txt('div', 'at-ktitle', o.titulo));
      card.appendChild(top);

      var meta = el('<div class="at-kmeta"></div>'); metaChips(o, meta); card.appendChild(meta);

      var foot = el('<div class="at-kfoot"></div>');
      foot.appendChild(txt('span', 'at-kdate' + (o.atrasada ? ' late' : ''), dayLabel(o.effDate)));
      if (CAN_WRITE) {
        var more = el('<button class="at-ibtn" type="button" title="Mais ações"></button>'); more.appendChild(ico(PATH.dots, 16));
        more.addEventListener('click', function () { actionsMenu(o); });
        foot.appendChild(more);
      }
      card.appendChild(foot);
      return card;
    }

    /* ===================== AGRUPADO POR SETOR ===================== */
    function byGrupoSetorOrdem(a, b) {
      var sa = SETORES.filter(function (s) { return s.sigla === a.sig; })[0];
      var sb = SETORES.filter(function (s) { return s.sigla === b.sig; })[0];
      var oa = sa ? (sa.ordem || 999) : 999, ob = sb ? (sb.ordem || 999) : 999;
      return oa - ob || (a.sig < b.sig ? -1 : 1);
    }
    function groupBySetor() {
      var groups = [], idx = {};
      BOARD.forEach(function (o) {
        var sigs = setoresDe(o.act); if (!sigs.length) { sigs = ['—']; }
        sigs.forEach(function (k) {
          if (!(k in idx)) { idx[k] = groups.length; groups.push({ sig: k, items: [] }); }
          groups[idx[k]].items.push(o);
        });
      });
      groups.sort(byGrupoSetorOrdem);
      return groups;
    }
    function renderPorSetor() {
      var wrap = el('<div class="at-list"></div>');
      groupBySetor().forEach(function (g) {
        var late = 0; g.items.forEach(function (o) { if (o.atrasada) { late++; } });
        var c = corSetor(g.sig);
        var sec = el('<div class="at-group"></div>');
        var hd = el('<div class="at-grouphd"></div>');
        var sg = txt('span', 'at-tag', g.sig); sg.style.color = 'var(--' + c + ')'; sg.style.background = 'var(--' + c + 'Bg)'; hd.appendChild(sg);
        hd.appendChild(txt('span', 'at-gname', nomeSetor(g.sig)));
        hd.appendChild(el('<span class="at-gline"></span>'));
        if (late) { hd.appendChild(txt('span', 'at-latebadge', late + ' atrasada(s)')); }
        hd.appendChild(txt('span', 'at-gcount', g.items.length + ' ocorrência(s)'));
        sec.appendChild(hd);
        g.items.forEach(function (o) { sec.appendChild(listCard(o)); });
        wrap.appendChild(sec);
      });
      stage.appendChild(wrap);
      stage.appendChild(txt('div', 'at-capnote', 'Atividade marcada em vários setores aparece em cada um deles — a soma dos grupos pode passar do total de ocorrências.'));
    }

    /* ===================== QUADRO POR SETOR ===================== */
    function renderQuadroSetor() {
      var cols = [], idx = {};
      BOARD.forEach(function (o) {
        if (o.status === 'pulada') { return; }
        var sigs = setoresDe(o.act); if (!sigs.length) { sigs = ['—']; }
        sigs.forEach(function (k) {
          if (!(k in idx)) { idx[k] = cols.length; cols.push({ sig: k, items: [] }); }
          cols[idx[k]].items.push(o);
        });
      });
      cols.sort(byGrupoSetorOrdem);
      var grid = el('<div class="at-kanban"></div>');
      cols.forEach(function (col) {
        var c = corSetor(col.sig);
        col.items.sort(function (a, b) { if (a.atrasada !== b.atrasada) { return a.atrasada ? -1 : 1; } return a.effDate < b.effDate ? -1 : 1; });
        var box = el('<div class="at-col"></div>');
        var hd = el('<div class="at-colhd"></div>');
        var t = el('<div class="at-coltitle"></div>');
        var dot = el('<span class="dot"></span>'); dot.style.background = 'var(--' + c + ')'; t.appendChild(dot);
        t.appendChild(document.createTextNode(col.sig + ' · ' + nomeSetor(col.sig)));
        hd.appendChild(t);
        hd.appendChild(txt('span', 'at-colcount', String(col.items.length)));
        box.appendChild(hd);
        var body = el('<div class="at-colbody"></div>');
        if (!col.items.length) { body.appendChild(txt('div', 'at-colempty', 'Nada aqui.')); }
        else { col.items.forEach(function (o) { body.appendChild(kanbanCard(o)); }); }
        box.appendChild(body);
        grid.appendChild(box);
      });
      stage.appendChild(grid);
    }

    /* ===================== COLAPSADO POR SÉRIE ===================== */
    function renderColapsadoSerie() {
      /* 1) agrupa ocorrências por série (atividade) */
      var smap = {}, slist = [];
      BOARD.forEach(function (o) {
        var k = o.act.id;
        if (!(k in smap)) { smap[k] = { id: k, act: o.act, items: [] }; slist.push(smap[k]); }
        smap[k].items.push(o);
      });
      /* 2) agrupa séries por frequência de recorrência */
      var fmap = {};
      slist.forEach(function (s) { var f = s.act.recorrencia || 'unico'; (fmap[f] = fmap[f] || []).push(s); });
      var FREQ_ORDER = ['diario', 'semanal', 'quinzenal', 'mensal', 'bimestral', 'trimestral', 'unico'];
      var wrap = el('<div class="at-list"></div>');
      FREQ_ORDER.forEach(function (f) {
        var arr = fmap[f]; if (!arr || !arr.length) { return; }
        arr.sort(function (a, b) { return (a.act.titulo || '').localeCompare(b.act.titulo || '', 'pt-BR'); });
        var fhd = el('<div class="at-freqhd"></div>');
        fhd.appendChild(ico(PATH.repeat, 13));
        fhd.appendChild(txt('span', 'at-freqname', RECOR_LABEL[f] || f));
        fhd.appendChild(el('<span class="at-gline"></span>'));
        fhd.appendChild(txt('span', 'at-gcount', arr.length + (arr.length === 1 ? ' série' : ' séries')));
        wrap.appendChild(fhd);
        arr.forEach(function (g) {
          var late = 0; g.items.forEach(function (o) { if (o.atrasada) { late++; } });
          var open = !!openSeries[g.id];
          var sec = el('<div class="at-sgroup' + (open ? ' open' : '') + '"></div>');
          var hd = el('<button type="button" class="at-shd"></button>');
          var car = el('<span class="at-scaret"></span>'); car.appendChild(ico('<path d="M6 9l6 6 6-6"></path>', 16)); hd.appendChild(car);
          if (g.act.todosSetores) {
            var atag = txt('span', 'at-tag', 'Todos'); atag.style.color = 'var(--muted)'; atag.style.background = 'var(--chipBg)'; hd.appendChild(atag);
          } else {
            setoresDe(g.act).forEach(function (sg2) { var t2 = txt('span', 'at-tag', sg2); var c2 = corSetor(sg2); t2.style.color = 'var(--' + c2 + ')'; t2.style.background = 'var(--' + c2 + 'Bg)'; hd.appendChild(t2); });
          }
          hd.appendChild(txt('span', 'at-stitle', g.act.titulo));
          hd.appendChild(el('<span class="at-gline"></span>'));
          if (late) { hd.appendChild(txt('span', 'at-latebadge', late + ' atras.')); }
          hd.appendChild(txt('span', 'at-gcount', g.items.length + ' ocor.'));
          hd.addEventListener('click', function () { openSeries[g.id] = !openSeries[g.id]; renderBoard(); });
          sec.appendChild(hd);
          if (open) {
            var body = el('<div class="at-sbody"></div>');
            g.items.forEach(function (o) { body.appendChild(listCard(o)); });
            sec.appendChild(body);
          }
          wrap.appendChild(sec);
        });
      });
      stage.appendChild(wrap);
    }

    /* ===== COLUNAS POR RECORRÊNCIA (visão padrão · REGRA GLOBAL) =====
       1) Abre calma: séries colapsadas, sem lista empilhada de vermelhos.
       2) Colunas: Diária / Semanal / Quinzenal / Mensal / Outras — com contadores.
       3) Vermelho = ponto + número no cabeçalho da coluna e no rodapé do card.
       4) Drill no clique: a série abre as ocorrências (data + estado + check + ações).
       Reusa BOARD, openSeries, listadores e ações existentes — zero lógica nova de dado. */
    var RECCOL_DEF = [
      { id: 'diario',    label: 'Diária',    tipos: ['diario'] },
      { id: 'semanal',   label: 'Semanal',   tipos: ['semanal'] },
      { id: 'quinzenal', label: 'Quinzenal', tipos: ['quinzenal'] },
      { id: 'mensal',    label: 'Mensal',    tipos: ['mensal'] },
      { id: 'outras',    label: 'Outras',    tipos: ['bimestral', 'trimestral', 'unico'] }
    ];

    function occRowCompact(o) {
      var done = o.status === 'concluida';
      var skip = o.status === 'pulada';
      var row = el('<div class="at-orow' + (done ? ' done' : '') + (skip ? ' skip' : '') + '"></div>');
      if (CAN_WRITE && !skip) {
        row.appendChild(UI.checkbox({ checked: done, onToggle: function () { if (done) { reabrir(o); } else { concluir(o); } } }));
      }
      var p = (o.effDate || '').split('-');
      row.appendChild(txt('span', 'at-odate', p.length === 3 ? (p[2] + '/' + p[1]) : o.effDate));
      if (o.atrasada) { row.appendChild(txt('span', 'at-olate', 'Atrasada')); }
      if (o.status === 'em_andamento') { row.appendChild(txt('span', 'at-ostate doing', 'Andamento')); }
      if (o.status === 'reprogramada') { row.appendChild(txt('span', 'at-ostate rep', 'Reprog.')); }
      if (skip) { row.appendChild(txt('span', 'at-ostate skip', 'Pulada')); }
      if (o.horario) { var hr = txt('span', 'at-mi', o.horario); row.appendChild(hr); }
      row.appendChild(el('<span class="at-osp"></span>'));
      var kb = el('<button type="button" class="at-okebab" title="Ações da ocorrência"></button>');
      kb.appendChild(ico('<circle cx="12" cy="5" r="1.6"></circle><circle cx="12" cy="12" r="1.6"></circle><circle cx="12" cy="19" r="1.6"></circle>', 15));
      kb.addEventListener('click', function () { actionsMenu(o); });
      row.appendChild(kb);
      return row;
    }

    function serieCard(g) {
      var late = 0; g.items.forEach(function (o) { if (o.atrasada) { late++; } });

      } else {
        setoresDe(g.act).forEach(function (sg) { var t = txt('span', 'at-tag', sg); var c = corSetor(sg); t.style.color = 'var(--' + c + ')'; t.style.background = 'var(--' + c + 'Bg)'; meta.appendChild(t); });
      }

      hd.appendChild(meta);

      } else {

      }
      if (late) { foot.appendChild(txt('span', 'at-latedot', String(late))); }
      foot.appendChild(txt('span', 'at-gcount', g.items.length + ' ocor.'));

      card.appendChild(hd);

        g.items.forEach(function (o) { drill.appendChild(occRowCompact(o)); });
        card.appendChild(drill);

    }

    function renderColunasRecorrencia() {
      /* agrupa ocorrências por série (atividade) */
      var smap = {}, slist = [];
      BOARD.forEach(function (o) {
        var k = o.act.id;
        if (!(k in smap)) { smap[k] = { id: k, act: o.act, items: [] }; slist.push(smap[k]); }
        smap[k].items.push(o);
      });
      var grid = el('<div class="at-reccols"></div>');
      RECCOL_DEF.forEach(function (cdef) {
        var series = slist.filter(function (s) { return cdef.tipos.indexOf(s.act.recorrencia || 'unico') !== -1; });
        if (!series.length) { return; }
        var tot = 0, late = 0;
        series.forEach(function (s) { tot += s.items.length; s.items.forEach(function (o) { if (o.atrasada) { late++; } }); });
        /* atrasadas primeiro dentro da coluna; depois alfabético */
        series.sort(function (a, b) {
          var la = a.items.some(function (o) { return o.atrasada; }) ? 1 : 0;
          var lb = b.items.some(function (o) { return o.atrasada; }) ? 1 : 0;
          if (la !== lb) { return lb - la; }
          return (a.act.titulo || '').localeCompare(b.act.titulo || '', 'pt-BR');
        });
        var col = el('<div class="at-rcol"></div>');
        var hd = el('<div class="at-rchd"></div>');
        hd.appendChild(txt('span', 'at-rcname', cdef.label));
        hd.appendChild(el('<span class="at-rcsp"></span>'));
        if (late) { var ld = txt('span', 'at-latedot', String(late)); ld.title = late + ' ocorrência(s) atrasada(s) nesta coluna'; hd.appendChild(ld); }
        hd.appendChild(txt('span', 'at-rccount', series.length + ' · ' + tot));
        col.appendChild(hd);
        var body = el('<div class="at-rcbody"></div>');
        series.forEach(function (g) { body.appendChild(serieCard(g)); });
        col.appendChild(body);
        grid.appendChild(col);
      });
      stage.appendChild(grid);
    }
