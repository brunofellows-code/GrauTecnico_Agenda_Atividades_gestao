    /* 16/09 · Pareto: os DADOS das colunas saem daqui, SEM o filtro de
       classificação; renderBoard conta os chips nesta base e só depois filtra
       (filtrarEtapas) para desenhar. Em que coluna uma atividade cai depende só
       das ocorrências DELA (ATRASADAS > FAZENDO > A FAZER; FEITAS pelos docs),
       então filtrar depois dá o mesmo quadro que filtrar antes — e o número do
       chip nunca discorda do que o clique mostra. Corpo igual ao do antigo
       renderEtapas (Item 1, 15/09). */
    function dadosEtapas(base) {
      var g = { afazer: [], fazendo: [], atrasada: [], pulada: [] };
      base.forEach(function (o) { var e = etapaDe(o); if (e !== 'feita') { g[e].push(o); } });

      var atr = agrupar(g.atrasada);
      atr.forEach(function (x) { x.itens.sort(porData); });
      atr.sort(function (a, b) { return b.itens.length - a.itens.length || porData(a.itens[0], b.itens[0]); });
      var ocupada = {};
      atr.forEach(function (x) { ocupada[x.act.id] = 1; });
      var faz = g.fazendo.slice().sort(porData);
      faz.forEach(function (o) { ocupada[o.act.id] = 1; });
      var afz = agrupar(g.afazer.filter(function (o) { return !ocupada[o.act.id]; }));
      afz.forEach(function (x) { x.itens.sort(porData); });
      /* 15/09 (5): atividade sem ocorrência aberta no período ainda aparece com a próxima data */
      var temCartao = {}; afz.forEach(function (x) { temCartao[x.act.id] = 1; });
      var wAf = windowFor(periodo), hojeAf = R.hojeISO();
      var desde = R.compareISO(wAf.jFim, hojeAf) >= 0 ? R.addDias(wAf.jFim, 1) : hojeAf;
      ATIV.forEach(function (act) {
        if (temCartao[act.id] || ocupada[act.id] || !etPassa(act)) { return; }
        var prox = R.proximas(act, desde, 1);
        if (!prox.length) { return; }
        afz.push({ act: act, itens: [{ key: act.id + '|' + prox[0], act: act, origData: prox[0], effDate: prox[0], status: 'pendente', ov: null,
          titulo: act.titulo, horario: act.horario || '', atrasada: false, foraPeriodo: true }] });
      });
      afz.sort(function (a, b) { return porData(a.itens[0], b.itens[0]) || (a.act.titulo || '').localeCompare(b.act.titulo || '', 'pt-BR'); });
      return { g: g, atr: atr, faz: faz, afz: afz, feitas: feitasRecentes() };
    }
    function filtrarEtapas(E, filtro) {
      if (!filtro) { return E; }
      function ok(x) { return passaPeso(x.act, filtro); }
      return {
        g: { afazer: E.g.afazer.filter(ok), fazendo: E.g.fazendo.filter(ok), atrasada: E.g.atrasada.filter(ok), pulada: E.g.pulada.filter(ok) },
        atr: E.atr.filter(ok), faz: E.faz.filter(ok), afz: E.afz.filter(ok), feitas: E.feitas.filter(ok)
      };
    }
    /* atividades com cartão no quadro (pode repetir: contarPorPeso tira a repetição) */
    function atividadesDoQuadro(E) {
      var acts = [];
      E.atr.forEach(function (x) { acts.push(x.act); });
      E.faz.forEach(function (o) { acts.push(o.act); });
      E.afz.forEach(function (x) { acts.push(x.act); });
      E.feitas.forEach(function (x) { acts.push(x.act); });
      return acts;
    }
    function quadroVazio(E) { return !E.atr.length && !E.faz.length && !E.afz.length && !E.feitas.length && !E.g.pulada.length; }

    function renderEtapas(E) {
      etLentesVisivel();
      var sig = ctxAtual();
      var g = E.g, atr = E.atr, faz = E.faz, afz = E.afz, feitas = E.feitas;
      var fazAtiv = {}; faz.forEach(function (o) { fazAtiv[o.act.id] = 1; });

      var COL = {
        afazer: { itens: afz, n: afz.length },
        fazendo: { itens: faz, n: Object.keys(fazAtiv).length },
        atrasada: { itens: atr, n: atr.length },
        feita: { itens: feitas, n: feitas.length }
      };

      renderAvisoSobrecarga(BOARD_FULL);
      /* o chip "Só as minhas" mudou para a barra de filtros (#at-filtros, renderFiltros) */

      var board = el('<div class="et-board"></div>');
      ET_COLS.forEach(function (c) {
        var col = COL[c.k];
        /* 16/09: com filtro de classificação a coluna é só um pedaço dela; o
           limite do setor vale para a coluna INTEIRA — comparar 3 vitais com o
           limite de 8 diria "folga" numa coluna que pode estar estourada. O
           limite volta com "Todas"; o "i" da coluna explica. */
        var lim = (sig && !FILTRO_PESO) ? (ET_LIM[c.k] || 0) : 0;
        var colEl = el('<div class="et-col c-' + c.k + (lim && col.n > lim ? ' over' : '') + '" data-etapa="' + c.k + '"></div>');
        var hd = el('<div class="et-colh"></div>');
        hd.appendChild(txt('span', 't', c.t));
        var cnt = el('<span class="et-cnt"></span>');
        cnt.appendChild(txt('span', 'n', String(col.n)));
        if (lim) { cnt.appendChild(txt('span', 'wip', '/ ' + lim)); }
        cnt.appendChild(infoAt('Contagem · ' + c.t, contagemInfo(c.k, COL, g, lim, sig)));
        hd.appendChild(cnt);
        colEl.appendChild(hd);
        if (lim) {
          var bar = el('<div class="et-wipbar"><span></span></div>');
          bar.firstChild.style.width = Math.min(100, Math.round(100 * col.n / lim)) + '%';
          colEl.appendChild(bar);
        }
        var body = el('<div class="et-body"></div>');
        colEl.appendChild(body);
        if (!col.itens.length) { body.appendChild(txt('div', 'et-empty', c.vazio)); }
        else { desenharLote(body, col.itens, c.k, 0); }
        ligarDrop(colEl, c.k);
        board.appendChild(colEl);
      });
      stage.appendChild(board);

      if (g.pulada.length) {
        var ft = el('<div class="et-foot"></div>');
        ft.appendChild(txt('span', null, g.pulada.length + ' ocorrência(s) pulada(s) no período — ficam fora do quadro.'));
        ft.appendChild(infoAt('Puladas', { formula: 'Ocorrências com status pulada dentro do período.', dados: 'ocorrencias · status = pulada' + recortePeso(), numeros: String(g.pulada.length) }));
        stage.appendChild(ft);
      }
      /* #6: o rodapé dizia "Somente leitura: seu perfil não conclui", mas o
         responsável conclui as próprias (igual ao Hoje). Diz o que ele faz e
         o que continua com líder/gestor. */
      if (!CAN_WRITE) { stage.appendChild(txt('div', 'et-foot at-leitura', 'Nas atividades em que você é o responsável: concluir (com relato), iniciar e desfazer a conclusão. Arrastar cartões, reprogramar, pular e editar ficam com o líder ou o gestor.')); }
    }

    function contagemInfo(k, COL, g, lim, sig) {
      return function () {
        var janela = windowFor(periodo);
        var dados = 'período ' + fmtBR(janela.jIni) + ' a ' + fmtBR(janela.jFim) + ' · escopo do papel + setor + busca' + (ET_SO_MINHAS ? ' + só as minhas' : '') + recortePeso();
        var limTxt = lim ? ' Limite com 1 setor (' + sig + '): ' + lim + ' atividades.'
          : ((sig && FILTRO_PESO) ? ' O limite do setor vale para a coluna inteira: aparece com a classificação em “Todas”.' : ' O limite só aparece com 1 setor selecionado.');
        if (k === 'atrasada') {
          var occ = 0; COL.atrasada.itens.forEach(function (x) { occ += x.itens.length; });
          return { formula: 'Atividades com ao menos 1 ocorrência aberta (pendente, em andamento ou reprogramada) com data efetiva já vencida. 1 cartão por atividade.', dados: dados, numeros: COL.atrasada.n + ' atividade(s) · ' + occ + ' ocorrência(s) atrasada(s).' + limTxt };
        }
        if (k === 'fazendo') {
          return { formula: 'Ocorrências em andamento com data efetiva de hoje em diante. A contagem é de atividades distintas.', dados: dados, numeros: COL.fazendo.n + ' atividade(s) · ' + COL.fazendo.itens.length + ' ocorrência(s).' + limTxt };
        }
        if (k === 'afazer') {
          var tot = 0, fora = 0; COL.afazer.itens.forEach(function (x) { if (x.itens[0].foraPeriodo) { fora++; } else { tot += x.itens.length; } });
          return { formula: 'Todas as atividades com próxima ocorrência aberta (pendente ou reprogramada) de hoje em diante, sem limite de período, ordenadas pela data. Não conta quem já está em ATRASADAS ou FAZENDO. Atividade com regra incompleta (sem data ou sem dia) não tem próxima data e não aparece.', dados: dados + ' · próxima data calculada pela regra da atividade', numeros: COL.afazer.n + ' atividade(s) · ' + (COL.afazer.n - fora) + ' com ocorrência no período (' + tot + ' ocorrências) · ' + fora + ' só depois do período.' };
        }
        var fo = 0; COL.feita.itens.forEach(function (x) { fo += x.itens.length; });
        return { formula: 'Atividades com ocorrência concluída nos últimos ' + ET_FEITAS_DIAS + ' dias (pela hora da conclusão), 1 cartão por atividade.', dados: 'ocorrencias · status concluida · concluidaEm · escopo do papel + setor + busca' + (ET_SO_MINHAS ? ' + só as minhas' : '') + recortePeso(), numeros: COL.feita.n + ' atividade(s) · ' + fo + ' conclusão(ões).' };
      };
    }

    function desenharLote(body, itens, k, ini) {
      var fim = Math.min(itens.length, ini + ET_LOTE);
      var velho = body.querySelector('.et-more'); if (velho) { velho.parentNode.removeChild(velho); }
      for (var i = ini; i < fim; i++) {
        body.appendChild(k === 'fazendo' ? cartaoFazendo(itens[i]) : (k === 'feita' ? cartaoFeita(itens[i]) : (k === 'atrasada' ? cartaoAtrasado(itens[i]) : cartaoAFazer(itens[i]))));
      }
      if (fim < itens.length) {
        var m = el('<button type="button" class="et-more"></button>');
        m.textContent = 'mostrar mais ' + Math.min(ET_LOTE, itens.length - fim) + ' (' + (itens.length - fim) + ' restantes)';
        m.addEventListener('click', function () { desenharLote(body, itens, k, fim); });
        body.appendChild(m);
      }
    }

    function rodapeDono(act, into) {
      if (act.responsavelUid) {
        var who = el('<span class="et-who"></span>');
        who.appendChild(txt('span', 'av', initialsOf(act.responsavelNome || '?')));
        who.appendChild(txt('span', 'nm', act.responsavelNome || '(sem nome)'));
        into.appendChild(who);
      } else {
        var qr = quemResponde(setorPrincipal(act));
        into.appendChild(txt('span', 'et-nodono', 'sem dono → ' + (qr.nomes.length ? qr.nomes[0] : 'quem responde pelo setor')));
      }
    }

    function botaoAcao(titulo, path, fn) {
      var b = el('<button type="button"></button>');
      b.title = titulo; b.setAttribute('aria-label', titulo);
      b.appendChild(ico(path, 14));
      b.addEventListener('click', function (ev) { ev.stopPropagation(); fn(); });
      return b;
    }

    /* arrastar continua só com CAN_WRITE (#6): o responsável executa pelos
       botões, que também servem a teclado e leitor de tela — o arraste não. */
    function arrastavel(card, payload) {
      if (!CAN_WRITE) { return; }
      card.setAttribute('draggable', 'true');
      card.addEventListener('dragstart', function (e) { etDrag = payload; card.classList.add('drag'); try { e.dataTransfer.setData('text/plain', 'et'); e.dataTransfer.effectAllowed = 'move'; } catch (er) {} });
      card.addEventListener('dragend', function () { card.classList.remove('drag'); etDrag = null; });
    }

    function montarCartao(titulo, linha, linhaCls, act, recTxt, acoes) {
      var card = el('<div class="et-card" tabindex="0"></div>');
      /* #6: era CAN_WRITE — o responsável (perfil usuario) via o cartão sem
         botão nenhum. A lista já chega sem "Mais ações" para quem não escreve
         (acaoMais), então aqui só sobra concluir/iniciar/desfazer. */
      if (podeAgir({ act: act }) && acoes.length) {
        var acts = el('<div class="et-acts"></div>');
        acoes.forEach(function (a) { acts.appendChild(botaoAcao(a[0], a[1], a[2])); });
        card.appendChild(acts);
      }
      card.appendChild(txt('div', 'et-ctitle', titulo));
      /* 16/09: o selo de classificação abre a linha logo abaixo do título —
         é o que se lê primeiro ao varrer a coluna, sem somar uma linha ao
         cartão. Sem classificação gravada, nada aparece (não inventa). */
      var selo = seloPeso(act);
      if (linha || selo) {
        var ln = el('<div class="' + linhaCls + ' at-clinha"></div>');
        if (selo) { ln.appendChild(selo); }
        if (linha) { ln.appendChild(txt('span', null, linha)); }
        card.appendChild(ln);
      }
      var foot = el('<div class="et-cfoot"></div>');
      rodapeDono(act, foot);
      foot.appendChild(txt('span', 'et-rec', recTxt));
      card.appendChild(foot);
      return card;
    }

    function cartaoAFazer(gr) {
      var o = gr.itens[0], n = o.foraPeriodo ? 0 : gr.itens.length;
      var card = montarCartao(o.titulo, 'próxima: ' + dayLabel(o.effDate) + (o.foraPeriodo ? ' · fora do período' : (n > 1 ? ' · +' + (n - 1) + ' no período' : '')), 'et-next', gr.act,
        RECOR_LABEL[gr.act.recorrencia] || 'Única',
        [['Concluir a próxima', PATH.check, function () { concluir(o); }], ['Iniciar a próxima', PATH.play, function () { iniciar(o); }]].concat(acaoMais(o, 'Mais ações')));
      arrastavel(card, { tipo: 'grupo', o: o, n: n, de: 'afazer' });
      return card;
    }

    function cartaoFazendo(o) {
      var card = montarCartao(o.titulo, 'em andamento · ' + dayLabel(o.effDate), 'et-next', o.act, RECOR_LABEL[o.act.recorrencia] || 'Única',
        [['Concluir', PATH.check, function () { concluir(o); }]].concat(acaoMais(o, 'Mais ações')));
      arrastavel(card, { tipo: 'occ', o: o, de: 'fazendo' });
      return card;
    }

    function subAntiga(o, n) { return 'Conclui a ocorrência de ' + fmtBR(o.effDate) + ' (a mais antiga).' + (n > 1 ? ' Continuam atrasadas: ' + (n - 1) + '.' : ''); }

    function cartaoAtrasado(gr) {
      var o = gr.itens[0], n = gr.itens.length;
      var card = montarCartao(o.titulo, (n === 1 ? 'atrasou 1× · ' : 'atrasou ' + n + '× desde ') + fmtBR(o.effDate), 'et-late', gr.act,
        RECOR_LABEL[gr.act.recorrencia] || 'Única',
        [['Concluir a mais antiga', PATH.check, function () { concluir(o, subAntiga(o, n)); }]].concat(acaoMais(o, 'Mais ações (mais antiga)')));
      arrastavel(card, { tipo: 'grupo', o: o, n: n, de: 'atrasada' });
      return card;
    }

    function cartaoFeita(gr) {
      var o = gr.itens[0], n = gr.itens.length;
      var d = new Date(o.quando);
      var dd = pad2(d.getDate()) + '/' + pad2(d.getMonth() + 1);
      var card = montarCartao(o.titulo, 'feita ' + n + '× em ' + ET_FEITAS_DIAS + ' dias · última ' + dd, 'et-done', gr.act,
        RECOR_LABEL[gr.act.recorrencia] || 'Única',
        [['Desfazer a mais recente', PATH.undo, function () { reabrir(o); }]].concat(acaoMais(o, 'Mais ações')));
      if (o.ov && o.ov.relato) { card.appendChild(txt('div', 'et-relato', o.ov.relato)); }
      arrastavel(card, { tipo: 'feita', o: o, n: n, de: 'feita' });
      return card;
    }

    function ligarDrop(col, k) {
      if (!CAN_WRITE) { return; }
      col.addEventListener('dragover', function (e) {
        if (!etDrag || k === 'atrasada') { return; }   /* sem preventDefault = soltar proibido */
        e.preventDefault(); col.classList.add('dragover');
      });
      col.addEventListener('dragleave', function () { col.classList.remove('dragover'); });
      col.addEventListener('drop', function (e) {
        col.classList.remove('dragover');
        var p = etDrag; etDrag = null;
        if (!p) { return; }
        e.preventDefault();
        if (k === 'atrasada') { toast('ATRASADAS é calculada pela data — conclua ou reprograme.', 'err'); return; }
        if (p.de === k) { return; }
        var o = p.o;
        if (k === 'feita') { concluir(o, p.de === 'atrasada' ? subAntiga(o, p.n) : null); return; }
        if (p.de === 'feita') { if (k === 'afazer') { reabrir(o); } else { toast('Desfaça a conclusão primeiro (arraste para A FAZER).', 'err'); } return; }
        if (o.atrasada) { toast('Atrasada continua em ATRASADAS até ser concluída ou reprogramada.', 'err'); return; }
        if (k === 'fazendo') { iniciar(o); return; }
        if (k === 'afazer' && o.status === 'em_andamento') { retomar(o); }
      });
    }

    /* aviso de sobrecarga: UMA faixa, nunca repetido em cartão */
    function renderAvisoSobrecarga(base) {
      var host = document.getElementById('at-aviso');
      if (!host) { return; }
      host.innerHTML = '';
      var porPessoa = {}, nomes = {};
      base.forEach(function (o) {
        if (o.status === 'concluida' || o.status === 'pulada' || !o.act.responsavelUid) { return; }
        var u = o.act.responsavelUid;
        porPessoa[u] = porPessoa[u] || {}; porPessoa[u][o.act.id] = 1; nomes[u] = o.act.responsavelNome || '(sem nome)';
      });
      var sobre = Object.keys(porPessoa).map(function (u) { return { nome: nomes[u], n: Object.keys(porPessoa[u]).length }; })
        .filter(function (x) { return x.n >= 8; }).sort(function (a, b) { return b.n - a.n; });
      if (!sobre.length) { return; }
      var w = el('<div class="et-warn"><span class="ic">!</span></div>');
      var s = el('<span></span>');
      s.appendChild(txt('b', null, 'Sobrecarga: '));
      s.appendChild(document.createTextNode(sobre.map(function (x) { return x.nome + ' (' + x.n + ' atividades)'; }).join(', ') + ' — 8 ou mais na mesma pessoa. Redistribua parte em Dar dono.'));
      w.appendChild(s);
      w.appendChild(infoAt('Sobrecarga', { formula: 'Por pessoa: atividades distintas com ocorrência aberta (não concluída, não pulada) na janela. Aviso a partir de 8.',
        dados: 'ocorrências da janela no escopo atual' + recortePeso() + ' · responsavelUid', numeros: sobre.map(function (x) { return x.nome + ': ' + x.n; }).join(' · ') }));
      host.appendChild(w);
    }

    /* ===================== mutações de ocorrência ===================== */
    /* Item 1 (D2): concluir exige relato >= 60 (conclusao.js). Devolve Promise<boolean>:
       false = cancelou/falhou -> o check otimista do UI.checkbox reverte. */
    function concluir(o, sub) {
      if (!podeAgir(o)) { toast(MSG_SO_RESPONSAVEL, 'err'); return Promise.resolve(false); } /* #6: era CAN_WRITE */
      if (!window.GrautConclusao) { toast('Não carreguei o módulo de conclusão. Recarregue a página.', 'err'); return Promise.resolve(false); }
      return GrautConclusao.pedir({ titulo: 'Concluir · ' + (o.titulo || ''), subtitulo: sub || ('Ocorrência de ' + fmtBR(o.effDate) + '.') })
        .then(function (relato) {
          if (relato == null) { return false; }
          var agora = Date.now();
          var patch = { status: 'concluida', concluidaEm: agora, relato: relato, relatoEm: agora };
          /* #6 · concluir aqui faz o mesmo que concluir no Hoje: a trava morre
             junto. Sem isto, ocorrência travada no Hoje ("Travei nesta") e
             concluída neste quadro guardava travadoMotivo — e o pareto-motor
             checa a trava ANTES do status, então contava como FALHA "trava"
             uma tarefa entregue no prazo, e a causa seguia somando no Pareto
             do líder. Só manda os 3 campos quando havia trava (patch enxuto,
             igual ao Hoje). */
          if (o.ov && o.ov.travadoMotivo) { patch.travadoMotivo = ''; patch.travadoDetalhe = ''; patch.travadoEm = null; }
          return Store.setOcorrencia(o.act, o.origData, patch, 'concluir_ocorrencia')
            .then(function () { toast('Ocorrência concluída.'); refresh(); return true; })
            .catch(function (e) { toast(e.message, 'err'); return false; });
        });
    }
    function reabrir(o) {
      if (!podeAgir(o)) { toast(MSG_SO_RESPONSAVEL, 'err'); return; } /* #6: o responsável desfaz a própria conclusão (o Hoje também deixa) */
      Store.setOcorrencia(o.act, o.origData, { status: 'pendente', concluidaEm: null }, 'reabrir_ocorrencia')
        .then(function () { toast('Conclusão desfeita.'); refresh(); })
        .catch(function (e) { toast(e.message, 'err'); });
    }
    /* pular, retomar e pendenciar seguem só com CAN_WRITE (#6): o responsável
       não pula nem devolve etapa — igual ao Hoje e às regras F1-J, que negam
       'pulada' a ele. Nesta tela os três só chegam por "Mais ações" e pelo
       arraste, que já são de quem escreve. */
    function pular(o) {
      if (!CAN_WRITE) { return; }
      Store.setOcorrencia(o.act, o.origData, { status: 'pulada' }, 'pular_ocorrencia')
        .then(function () { toast('Ocorrência pulada.'); refresh(); })
        .catch(function (e) { toast(e.message, 'err'); });
    }
    function retomar(o) {
      if (!CAN_WRITE) { return; }
      Store.setOcorrencia(o.act, o.origData, { status: 'pendente' }, 'retomar_ocorrencia')
        .then(function () { toast('Ocorrência retomada.'); refresh(); })
        .catch(function (e) { toast(e.message, 'err'); });
    }
    function iniciar(o) {
      if (!podeAgir(o)) { toast(MSG_SO_RESPONSAVEL, 'err'); return; } /* #6: era CAN_WRITE */
      Store.setOcorrencia(o.act, o.origData, { status: 'em_andamento', iniciadaEm: Date.now() }, 'iniciar_ocorrencia')
        .then(function () { toast('Marcada como em andamento.'); refresh(); })
        .catch(function (e) { toast(e.message, 'err'); });
    }
    function pendenciar(o) {
      if (!CAN_WRITE) { return; }
      Store.setOcorrencia(o.act, o.origData, { status: 'pendente', concluidaEm: null }, 'pendenciar_ocorrencia')
        .then(function () { toast('Voltou para “a fazer”.'); refresh(); })
        .catch(function (e) { toast(e.message, 'err'); });
    }

    /* aplica reprogramação direta da ocorrência (dono/Admin) */
    function aplicarReprogEsta(o, novaData) {
      Store.setOcorrencia(o.act, o.origData, { status: 'reprogramada', dataOverride: novaData }, 'reprogramar_ocorrencia')
        .then(function () { toast('Ocorrência reprogramada para ' + fmtBR(novaData) + '.'); refresh(); })
        .catch(function (e) { toast(e.message, 'err'); });
    }

    /* ===================== ações da ocorrência (menu) ===================== */
    function actionsMenu(o) {
      if (!CAN_WRITE) { return; }
      var done = o.status === 'concluida';
      var skip = o.status === 'pulada';

      var rows = [];
      function row(label, sub, pathIcon, danger, fn) {
        var b = el('<button class="at-actbtn' + (danger ? ' danger' : '') + '" type="button"></button>');
        b.appendChild(ico(pathIcon, 18));
        var span = document.createElement('span'); span.appendChild(document.createTextNode(label));
        if (sub) { span.appendChild(txt('span', 'sub', sub)); }
        b.appendChild(span);
        b.addEventListener('click', function () { m.close(); fn(); });
        rows.push(b);
      }

      var doing = o.status === 'em_andamento';
      if (!skip) {
        if (done) { row('Reabrir (desfazer conclusão)', 'Volta para “a fazer”, sem apagar histórico', PATH.undo, false, function () { reabrir(o); }); }
        else { row('Concluir', null, PATH.check, false, function () { concluir(o); }); }
        if (!done && !doing) { row('Marcar como em andamento', 'Sinaliza que a tarefa já começou', PATH.play, false, function () { iniciar(o); }); }
        if (doing) { row('Voltar para “a fazer”', 'Tira de “em andamento”', PATH.undo, false, function () { pendenciar(o); }); }
      }
      row('Reprogramar esta ocorrência', canApproveDirect(o.act) ? 'Aplica direto (você é dono/Admin)' : 'Cria um pedido para o dono aprovar', PATH.calendar, false, function () { reprogramarEstaModal(o); });
      if (skip) { row('Retomar', 'Tira de “pulada” e volta a pendente', PATH.play, false, function () { retomar(o); }); }
      else if (!done) { row('Pular esta ocorrência', null, PATH.skip, false, function () { pular(o); }); }
      row('Subtarefas', 'Quebre em passos com % — a média vira o % da atividade', PATH.check, false, function () { modalSubtarefas(o.act); });
      row('Editar só esta ocorrência', 'Muda título/horário apenas deste dia', PATH.pencil, false, function () { editarEstaModal(o); });
      row('Editar a atividade (todas)', 'Altera a regra e as ocorrências futuras', PATH.repeat, false, function () { openEditor(o.act); });
      row('Inativar atividade', 'Some das listas; histórico preservado', PATH.archive, true, function () { inativarAtividade(o.act); });

      var m = UI.modal({ title: o.titulo, width: 440, body: function () { var box = el('<div class="at-actsheet"></div>'); rows.forEach(function (r) { box.appendChild(r); }); return box; } });
    }

    /* ----- subtarefas da atividade (R4-B2: migradas do detalhe do projeto) -----
       Cascade travado (RESUMO 106): Atividade -> Subtarefa; % da atividade =
       media dos % das subtarefas (cascade.js, mesmo motor de antes). Leitura
       para todos; edicao respeita CAN_WRITE. Toda mutacao vai ao atividade_log. */
    function modalSubtarefas(act) {
      var body = el('<div></div>');
      var m = UI.modal({ title: 'Subtarefas — ' + (act.titulo || '(sem título)'), width: 480, body: function () { return body; } });
      function draw() {
        body.innerHTML = '';
        var subs = (SUBS[act.id] || []).slice().sort(function (x, y) { return (x.ordem || 0) - (y.ordem || 0); });
        var pc = subs.length ? CC.pctAtividade({ subtarefas: subs }) : 0;
        var head = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:4px"></div>');
        head.appendChild(txt('div', 'at-gname', subs.length ? (pc + '% concluído') : 'Sem subtarefas'));
        var ib = el('<button class="at-i" type="button" aria-label="Como o % é calculado"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></button>');
        ib.title = 'Fórmula: % da atividade = média aritmética dos % das subtarefas (0/25/50/75/100), arredondada — cascade.js. Dados: coleção subtarefas (ativas) desta atividade. Números: ' + subs.map(function (x) { return (x.pct || 0) + '%'; }).join(' + ') + (subs.length ? ' ÷ ' + subs.length + ' = ' + pc + '%' : '');
        head.appendChild(ib);
        body.appendChild(head);
        var wrap = el('<div class="at-subs"></div>');
        subs.forEach(function (sb) {
          var line = el('<div class="at-sub"></div>');
          line.appendChild(txt('div', 'at-sub-t', sb.texto || '(sem texto)'));
          var sel = document.createElement('select');
          sel.className = 'at-sub-sel';
          [0, 25, 50, 75, 100].forEach(function (v) { var op = document.createElement('option'); op.value = String(v); op.textContent = v + '%'; sel.appendChild(op); });
          sel.value = String(sb.pct || 0);
          sel.disabled = !CAN_WRITE;
          sel.addEventListener('change', function () {
            var novo = parseInt(sel.value, 10);
            Store.atualizarSubtarefa(sb.id, { pct: novo }, { pct: sb.pct })
              .then(function () { sb.pct = novo; toast('Subtarefa atualizada.'); draw(); refresh(); })
              .catch(function (e) { toast(e.message, 'err'); });
          });
          line.appendChild(sel);
          if (CAN_WRITE) {
            var x = el('<button class="at-sub-x" type="button" aria-label="Remover"><svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>');
            x.addEventListener('click', function () {
              Store.inativarSubtarefa(sb.id)
                .then(function () { SUBS[act.id] = (SUBS[act.id] || []).filter(function (z) { return z.id !== sb.id; }); toast('Subtarefa removida.'); draw(); refresh(); })
                .catch(function (e) { toast(e.message, 'err'); });
            });
            line.appendChild(x);
          }
          wrap.appendChild(line);
        });
        if (!subs.length) { wrap.appendChild(txt('div', 'at-gcount', CAN_WRITE ? 'Crie a primeira subtarefa abaixo — o % da atividade passa a ser a média delas.' : 'Nenhuma subtarefa nesta atividade.')); }
        if (CAN_WRITE) {
          var addWrap = el('<div class="at-addsub"></div>');
          var inp = UI.input({ placeholder: 'Nova subtarefa…' });
          var add = UI.button({ label: 'Adicionar', variant: 'ghost' });
          add.addEventListener('click', function () {
            var t = inp.value.trim();
            if (!t) { return; }
            var ordem = subs.length ? (subs[subs.length - 1].ordem || 0) + 1 : 1;
            Store.criarSubtarefa(act.id, t, ordem)
              .then(function (id) {
                SUBS[act.id] = (SUBS[act.id] || []).concat([{ id: id, atividadeId: act.id, texto: t, pct: 0, ordem: ordem, ativo: true }]);
                toast('Subtarefa criada.'); draw(); refresh();
              })
              .catch(function (e) { toast(e.message, 'err'); });
          });
          addWrap.appendChild(inp); addWrap.appendChild(add);
          wrap.appendChild(addWrap);
        }
        body.appendChild(wrap);
      }
      draw();
      return m;
    }

    /* ----- reprogramar “esta” (com trava de aprovação de data) ----- */
    function reprogramarEstaModal(o) {
      var direct = canApproveDirect(o.act);
      var dateInp = el('<input type="date" class="at-date" value="' + o.effDate + '">');
      var dateField = UI.field({ label: 'Nova data', required: true, control: dateInp, hint: 'Data atual: ' + fmtBR(o.effDate) + '.' });

      var motivoTa = el('<textarea class="at-textarea" placeholder="Por que precisa mudar a data? (ajuda o dono a decidir)"></textarea>');
      var motivoField = UI.field({ label: 'Motivo' + (direct ? ' (opcional)' : ''), required: !direct, control: motivoTa });

      var info = el('<div class="at-reqinfo"></div>');
      info.innerHTML = direct
        ? 'Você é <b>dono ou Admin</b> desta atividade: a reprogramação é aplicada <b>na hora</b>.'
        : 'Você <b>não é o dono</b> desta atividade. Em vez de mudar a data direto, será criado um <b>pedido</b> para o dono (ou um Admin) aprovar.';

      var banner = el('<div class="at-banner"></div>');

      var body = [info, dateField, motivoField, banner];
      var saveBtn = null;
      var m = UI.modal({
        title: 'Reprogramar ocorrência', width: 460, body: body,
        footer: function (close) {
          var cancel = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
          saveBtn = UI.button({ label: direct ? 'Reprogramar' : 'Enviar pedido', icon: direct ? 'check' : 'repeat', onClick: onGo });
          return [cancel, saveBtn];
        }
      });

      function showBanner(msg) { banner.textContent = msg; banner.classList.add('on'); }
      function onGo() {
        banner.classList.remove('on');
        var nova = dateInp.value;
        if (!R.isISO(nova)) { showBanner('Escolha uma data válida.'); return; }
        if (nova === o.effDate) { showBanner('A nova data é igual à atual. Escolha outro dia.'); return; }
        var motivo = motivoTa.value.trim();
        if (!direct && motivo.length < 3) { showBanner('Descreva o motivo do pedido (mínimo 3 caracteres).'); return; }
        if (saveBtn) { saveBtn.disabled = true; }

        if (direct) {
          m.close(); aplicarReprogEsta(o, nova); return;
        }
        Store.createSolicitacao({
          atividadeId: o.act.id, ocorrenciaData: o.origData, escopo: 'esta',
          dataAtual: o.effDate, dataProposta: nova, motivo: motivo,
          solicitanteUid: CURRENT_USER.uid,
          solicitanteNome: CURRENT_USER.name, tituloAtividade: o.act.titulo, donoUid: o.act.criadoPor || null
        }).then(function () { m.close(); toast('Pedido de mudança de data enviado ao dono.'); refresh(); })
          .catch(function (e) { if (saveBtn) { saveBtn.disabled = false; } showBanner((e && e.message) || 'Falha ao enviar o pedido.'); });
      }
    }

    /* ----- editar só esta ocorrência (título/horário) ----- */
    function editarEstaModal(o) {
      var tInp = UI.input({ value: o.titulo, placeholder: 'Título desta ocorrência' });
      var tField = UI.field({ label: 'Título (só hoje)', control: tInp, hint: 'Vale apenas para esta ocorrência; a atividade continua com o título original.' });
      var hInp = el('<input type="time" class="at-date" value="' + (o.horario || '') + '">');
      var hField = UI.field({ label: 'Horário (só hoje)', control: hInp });
      var banner = el('<div class="at-banner"></div>');

      var saveBtn = null;
      var m = UI.modal({
        title: 'Editar esta ocorrência', width: 440, body: [tField, hField, banner],
        footer: function (close) {
          var cancel = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
          saveBtn = UI.button({ label: 'Salvar', icon: 'check', onClick: onSave });
          return [cancel, saveBtn];
        }
      });
      function onSave() {
        banner.classList.remove('on');
        var titulo = tInp.value.trim();
        if (!titulo) { banner.textContent = 'O título não pode ficar vazio.'; banner.classList.add('on'); return; }
        var patch = {};
        patch.tituloOverride = (titulo === o.act.titulo) ? null : titulo;
        patch.horarioOverride = (hInp.value === (o.act.horario || '')) ? null : (hInp.value || null);
        if (saveBtn) { saveBtn.disabled = true; }
        Store.setOcorrencia(o.act, o.origData, patch, 'editar_ocorrencia')
          .then(function () { m.close(); toast('Ocorrência atualizada.'); refresh(); })
          .catch(function (e) { if (saveBtn) { saveBtn.disabled = false; } banner.textContent = e.message; banner.classList.add('on'); });
      }
    }

    /* F (16/09): grava motivo 'manual', o dia e quem (patchInativacao). O aviso
       dizia "reative em Ver inativas" — botão que só existia com a escola sem
       nenhuma atividade ativa; agora aponta o "Inativas" da barra, que existe. */
    function inativarAtividade(act) {
      if (!CAN_WRITE) { return; }
      var m = UI.modal({
        title: 'Inativar atividade', width: 440,
        body: function () { var p = txt('p', null, 'Inativar “' + act.titulo + '”? Ela sai do quadro, do Hoje e dos indicadores, e o histórico de ocorrências fica guardado. Para trazer de volta, use “Inativas” na barra de Atividades — ao ativar, os dias parada não contam como atraso.'); p.setAttribute('style', 'margin:0;color:var(--muted);font-size:13.5px;line-height:1.55'); return p; },
        footer: function (close) {
          var cancel = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
          var go = UI.button({ label: 'Inativar', icon: 'archive', onClick: function () {
            close();
            var pi = patchInativacao(act, R.hojeISO(), CURRENT_USER.uid);
            return Store.inativarAtividade(act.id, pi.patch, pi.antes).then(function () {
              if (INATIVAS) { INATIVAS = INATIVAS.filter(function (x) { return x.id !== act.id; }).concat([Object.assign({}, act, pi.patch)]); }
              toast('Atividade inativada · está em “Inativas”.'); refresh();
            }).catch(function (e) { toast(e.message, 'err'); });
          } });
          return [cancel, go];
        }
      });
      return m;
    }

    /* ===================== editor de atividade ===================== */
    /* ===================== F1-G · CATÁLOGO DE AÇÕES =====================
       95 ações extraídas 1:1 da ATA (catalogo.js). Padrão Asana template
       library: escolher -> vira atividade normal com 1 clique (o editor
       abre pré-preenchido; nada é gravado sem passar pelo onSave). */
    function abrirCatalogo() {
      if (!CAN_WRITE) { return; }
      var C = window.CATALOGO;
      if (!C || !C.itens || !C.itens.length) { toast('Catálogo não carregado (catalogo.js).', 'err'); return; }
      var FILTRO_CAT = 'TODOS';
      var lista = el('<div class="at-catlist"></div>');
      var opts = [{ value: 'TODOS', label: 'Todos os setores (' + C.itens.length + ')' }];
      C.setores.forEach(function (s) {
        var n = C.itens.filter(function (it) { return (it.setorSigla || 'A_CLASSIFICAR') === s; }).length;
        opts.push({ value: s, label: (s === 'A_CLASSIFICAR' ? 'A classificar' : s + ' · ' + nomeSetor(s)) + ' (' + n + ')' });
      });
      var selSetor = UI.select({ value: 'TODOS', options: opts });
      selSetor.addEventListener('change', function () { FILTRO_CAT = selSetor.value; pinta(); });
      var hint = el('<div class="at-hint2">Fonte: ' + C.fonte + ' · ' + C.versao + '. Escolher abre o formulário pré-preenchido — nada é criado sem você confirmar.</div>');
      var mCat = UI.modal({ title: 'Catálogo de ações (ATA)', width: 640, body: [UI.field({ label: 'Setor', control: selSetor }), hint, lista] });
      function pinta() {
        lista.innerHTML = '';
        var itens = C.itens.filter(function (it) {
          return FILTRO_CAT === 'TODOS' || (it.setorSigla || 'A_CLASSIFICAR') === FILTRO_CAT;
        });
        if (!itens.length) { lista.appendChild(txt('div', 'at-inempty', 'Nenhuma ação neste setor.')); return; }
        itens.forEach(function (it) {
          var row = el('<div class="at-catrow"></div>');
          var cc = el('<div class="at-catc"></div>');
          var l1 = el('<div class="at-catt"></div>');
          l1.textContent = it.titulo;
          cc.appendChild(l1);
          var l2 = el('<div class="at-cats"></div>');
          l2.textContent = (it.setorSigla ? it.setorSigla + (it.subsetorSigla ? '/' + it.subsetorSigla : '') : 'a classificar') +
            ' · ATA: ' + it.categoriaATA + (it.como ? ' · COMO: ' + it.como : '');
          l2.title = it.como || '';
          cc.appendChild(l2);
          row.appendChild(cc);
          row.appendChild(UI.button({ label: 'Usar', variant: 'ghost', onClick: function () {
            mCat.close();
            openEditor(null, it);
          } }));
          lista.appendChild(row);
        });
      }
      pinta();
    }

    function openEditor(act, pre) {
      /* F1-G: pre = item do CATÁLOGO (id, titulo, como, setorSigla,
         subsetorSigla) — pré-preenche a criação; nada muda na edição. */
      if (!CAN_WRITE) { return; }
      var editing = !!act;
      pre = (!editing && pre) ? pre : null;

      /* título / descrição */
      var titInp = UI.input({ value: editing ? act.titulo : (pre ? pre.titulo : ''), placeholder: 'Ex: Conferir matrículas do dia', maxlength: 120 });
      var titField = UI.field({ label: 'Título', required: true, control: titInp });
      var descTa = el('<textarea class="at-textarea" placeholder="Detalhes, instruções, checklist… (opcional)"></textarea>');
      if (editing && act.descricao) { descTa.value = act.descricao; }
      else if (pre && pre.como) { descTa.value = pre.como; }
      var descField = UI.field({ label: 'Descrição (opcional)', control: descTa });
      /* F1-F: observações operacionais — anotações vivas da atividade
         (o que aconteceu, combinados, contexto). Diferente da descrição
         (o que É a atividade). Aparece no card da lista.               */
      var obsTa = el('<textarea class="at-textarea" placeholder="Anotações do andamento, combinados, contexto… (opcional)"></textarea>');
      if (editing && act.observacoes) { obsTa.value = act.observacoes; }
      var obsField = UI.field({ label: 'Observações (opcional)', control: obsTa });

      /* setor (raízes ativas; preserva o atual se inativo) */
      var setorOpts = setoresRaiz().map(function (s) { return { value: s.sigla, label: s.sigla + ' · ' + s.nome }; });
      if (editing && act.setorSigla && !setorOpts.some(function (o) { return o.value === act.setorSigla; })) {
        setorOpts.unshift({ value: act.setorSigla, label: act.setorSigla + ' · ' + nomeSetor(act.setorSigla) + ' (inativo)' });
      }
      var preSetor = (pre && pre.setorSigla && setorOpts.some(function (o) { return o.value === pre.setorSigla; })) ? pre.setorSigla : '';
      var setorSelect = UI.select({ value: editing ? act.setorSigla : preSetor, placeholder: '— Escolha o setor —', options: setorOpts });
      var setorField = UI.field({ label: 'Setor', required: true, control: setorSelect, hint: 'Área da escola dona desta rotina.' });

      /* subsetor (depende do setor) */
      var subSelect = null;
      var subHolder = el('<div></div>');
      function subOptsFor(sig) { return subsetoresDe(sig).filter(function (s) { return s.ativo; }).map(function (s) { return { value: s.sigla, label: s.sigla + ' · ' + s.nome }; }); }
      function paintSub(sig, val) {
        subHolder.innerHTML = '';
        var opts = subOptsFor(sig);
        if (val && !opts.some(function (o) { return o.value === val; })) {
          var sObj = SETORES.filter(function (s) { return s.sigla === val; })[0];
          if (sObj) { opts.unshift({ value: val, label: val + ' · ' + sObj.nome + (sObj.ativo ? '' : ' (inativo)') }); }
        }
        subSelect = UI.select({ value: val || '', placeholder: '— Nenhum (direto no setor) —', options: opts, disabled: !sig });
        subHolder.appendChild(subSelect);
      }
      paintSub(editing ? act.setorSigla : preSetor, editing ? (act.subsetorSigla || '') : ((pre && preSetor && pre.subsetorSigla) || ''));
      var subField = UI.field({ label: 'Subsetor (opcional)', control: subHolder, hint: 'Refina dentro do setor, quando fizer sentido.' });
      setorSelect.addEventListener('change', function () { paintSub(setorSelect.value, ''); });

      /* multi-setor (multi-homing) — aditivo: além do setor principal acima */
      var todosState = editing ? !!act.todosSetores : false;
      var extraState = {};
      if (editing && Array.isArray(act.setorSiglas)) {
        act.setorSiglas.forEach(function (sg) { if (sg !== act.setorSigla) { extraState[sg] = true; } });
      }
      var extraHolder = el('<div class="at-extrasec"></div>');
      function repaintExtras() {
        extraHolder.innerHTML = '';
        if (todosState) { extraHolder.appendChild(txt('div', 'at-hint2', 'Vai aparecer em todos os setores ativos.')); return; }
        setoresRaiz().forEach(function (s) {
          if (s.sigla === setorSelect.value) { return; }
          extraHolder.appendChild(UI.checkbox({ checked: !!extraState[s.sigla], label: s.sigla + ' · ' + s.nome, onToggle: function (v) { extraState[s.sigla] = v; } }));
        });
      }
      var todosChk = UI.checkbox({ checked: todosState, label: 'Aparece em todos os setores', onToggle: function (v) { todosState = v; repaintExtras(); } });
      repaintExtras();
      var multiWrap = el('<div class="at-multibox"></div>');
      multiWrap.appendChild(todosChk); multiWrap.appendChild(extraHolder);
      var multiField = UI.field({ label: 'Também aparece em (opcional)', control: multiWrap, hint: 'A mesma atividade aparece em cada área marcada. O responsável continua sendo um só.' });
      setorSelect.addEventListener('change', function () { repaintExtras(); });

      /* responsável (usuários ativos; fallback p/ auto-atribuição) */
      var respOpts = USERS.map(function (u) { return { value: u.uid, label: u.nome }; });
      if (editing && act.responsavelUid && !respOpts.some(function (o) { return o.value === act.responsavelUid; })) {
        respOpts.unshift({ value: act.responsavelUid, label: (act.responsavelNome || '(responsável atual)') });
      }
      if (!respOpts.length && CURRENT_USER.uid) { respOpts.push({ value: CURRENT_USER.uid, label: CURRENT_USER.name + ' (você)' }); }
      function respNomeOf(uid) {
        var u = USERS.filter(function (x) { return x.uid === uid; })[0]; if (u) { return u.nome; }
        if (editing && act.responsavelUid === uid) { return act.responsavelNome || ''; }
        if (CURRENT_USER.uid === uid) { return CURRENT_USER.name; }
        var o = respOpts.filter(function (x) { return x.value === uid; })[0]; return o ? o.label.replace(' (você)', '') : '';
      }
      var respSelect = UI.select({ value: editing ? act.responsavelUid : (CURRENT_USER.uid || ''), placeholder: '— Escolha o responsável —', options: respOpts });
      var respHint = USERS.length
        ? ((Guard.isLider && Guard.isLider()) ? 'Escolha entre os liderados do seu escopo.' : 'Quem responde por esta rotina.')
        : 'Lista de usuários indisponível para o seu perfil. Atribuída a você por padrão.';
      var respField = UI.field({ label: 'Responsável', required: true, control: respSelect, hint: respHint });

      /* F1-D(c): camada do organograma no modal (antes só vinha do import).
         Default 'operacional' — mesmo default do importador e do filtro do Hoje.
         Doc antigo sem o campo segue funcionando (leitura trata ausência). */
      var camSelect = UI.select({
        value: (editing && act.camada) ? act.camada : 'operacional',
        options: [{ value: 'socio', label: 'Sócio (gestão indireta)' }, { value: 'gestor', label: 'Gestor (gestão direta)' }, { value: 'operacional', label: 'Operacional (líder + assistente)' }]
      });
      var camField = UI.field({ label: 'Camada', control: camSelect, hint: 'Quem acompanha essa rotina: Sócio, Gestor ou Operacional.' });

      /* 16/09 · C: classificação do Pareto no formulário. Quem já edita a
         atividade (CAN_WRITE: líder, gestor, sócio) escolhe. Nova atividade
         nasce sem classificação — ninguém inventa um peso por ela. Na edição
         só grava se a escolha MUDOU: um valor fora das três palavras gravado à
         mão no banco não é apagado só por abrir e salvar o formulário. */
      var pesoAtual = editing ? pesoDe(act) : '';
      var pesoSelect = UI.select({
        value: pesoAtual,
        options: [{ value: '', label: 'Sem classificação' }, { value: 'vital', label: 'Vital' }, { value: 'importante', label: 'Importante' }, { value: 'rotina', label: 'Rotina' }]
      });
      var pesoField = UI.field({ label: 'Classificação (Pareto)', control: pesoSelect, hint: 'Vital = das poucas que mais pesam no resultado (no máximo 25% das atividades) · Importante · Rotina. Sem classificação, o cartão fica sem selo.' });

      /* F1-H · SUPERVISOR (padrão Jira/Asana: quem acompanha por cima do
         responsável). Campo NULLABLE + sugestão determinística subindo a
         árvore de setores por camada (KPI.sugerirSupervisor, harness_f1h):
         operacional → líder do subsetor → líder do setor → gestor;
         gestor → outro gestor; sócio → sem supervisor (topo).
         Tocar no campo desliga a sugestão automática (escolha manual vale). */
      var supPool = (USERS_ALL && USERS_ALL.length) ? USERS_ALL : USERS;
      var supOpts = supPool.map(function (u) { return { value: u.uid, label: u.nome }; });
      if (editing && act.supervisorUid && !supOpts.some(function (o) { return o.value === act.supervisorUid; })) {
        supOpts.unshift({ value: act.supervisorUid, label: (act.supervisorNome || '(supervisor atual)') });
      }
      var supTouched = !!(editing && act.supervisorUid); /* edição preserva o gravado */
      var supSelect = UI.select({ value: (editing && act.supervisorUid) ? act.supervisorUid : '', placeholder: '— Sem supervisor —', options: supOpts });
      supSelect.addEventListener('change', function () { supTouched = true; });
      var supField = UI.field({ label: 'Supervisor (opcional)', control: supSelect,
        hint: 'Sugerido pela hierarquia: operacional → líder do subsetor/setor → gestor; camada gestor → outro gestor; sócio fica sem (topo). Pode trocar ou limpar.' });
      function sugerirSup() {
        if (supTouched) { return; }
        var s = KPI.sugerirSupervisor({
          camada: camSelect.value || 'operacional',
          setorSigla: setorSelect.value || null,
          subsetorSigla: (subSelect && subSelect.value) ? subSelect.value : null,
          responsavelUid: respSelect.value || CURRENT_USER.uid || null
        }, supPool, SETORES);
        supSelect.value = s ? s.uid : '';
      }
      setorSelect.addEventListener('change', sugerirSup);
      subHolder.addEventListener('change', sugerirSup);   /* delegação: subSelect é recriado */
      respSelect.addEventListener('change', sugerirSup);
      camSelect.addEventListener('change', sugerirSup);
      if (!editing) { sugerirSup(); }

      /* recorrência + campos condicionais */
      var recBox = el('<div class="at-recbox"></div>');

      var diInp = el('<input type="date" class="at-date" value="' + (editing && act.dataInicio ? act.dataInicio : R.hojeISO()) + '">');
      var dfInp = el('<input type="date" class="at-date" value="' + (editing && act.dataFim ? act.dataFim : '') + '">');
      var grpRecDates = el('<div class="at-grp"></div>');
      var rowDates = el('<div class="at-row2"></div>');
      rowDates.appendChild(UI.field({ label: 'Início', required: true, control: diInp, hint: 'A partir de quando vale.' }));
      rowDates.appendChild(UI.field({ label: 'Fim (opcional)', control: dfInp, hint: 'Em branco = sem término.' }));
      grpRecDates.appendChild(rowDates);

      var selDias = (editing && Array.isArray(act.diasSemana)) ? act.diasSemana.slice() : [];
      if (editing && act.recorrencia === 'diario' && !selDias.length) { selDias = [1, 2, 3, 4, 5]; } /* 15/09: diária sem dias = segunda a sexta */
      var grpSemanal = el('<div class="at-grp"></div>');
      grpSemanal.appendChild(txt('div', 'at-note', 'Dias da semana:'));
      var wdays = el('<div class="at-wdays"></div>');
      DOW.forEach(function (name, i) {
        var b = el('<button type="button" class="at-wday' + (selDias.indexOf(i) !== -1 ? ' on' : '') + '"></button>'); b.textContent = name;
        b.addEventListener('click', function () { var k = selDias.indexOf(i); if (k === -1) { selDias.push(i); b.classList.add('on'); } else { selDias.splice(k, 1); b.classList.remove('on'); } });
        wdays.appendChild(b);
      });
      grpSemanal.appendChild(wdays);
      /* 15/09: ao escolher Diária sem dias marcados, pré-marca segunda a sexta */
      function marcarDiasUteis() { selDias = [1, 2, 3, 4, 5]; Array.prototype.forEach.call(wdays.children, function (bt, ix) { bt.classList.toggle('on', selDias.indexOf(ix) !== -1); }); }

      var dmOpts = []; for (var dd = 1; dd <= 31; dd++) { dmOpts.push({ value: String(dd), label: 'Dia ' + dd }); }
      var dmSelect = UI.select({ value: editing && act.diaMes ? String(act.diaMes) : '', placeholder: '— Escolha o dia —', options: dmOpts });
      var grpMensal = el('<div class="at-grp"></div>');
      grpMensal.appendChild(UI.field({ label: 'Dia do mês', required: true, control: dmSelect, hint: '29, 30 ou 31 caem no último dia nos meses mais curtos.' }));
      grpMensal.appendChild(txt('div', 'at-note', 'Bimestral/Trimestral usam este mesmo dia, a cada 2/3 meses, contados a partir da data de Início.'));

      var grpQuinz = el('<div class="at-grp"></div>');
      grpQuinz.appendChild(txt('div', 'at-note', 'Quinzenal = dias fixos 1 e 15 de cada mês (entre Início e Fim).'));

      var unicoNonOwner = editing && act.recorrencia === 'unico' && !canApproveDirect(act);
      var unInp = el('<input type="date" class="at-date" value="' + (editing && act.data ? act.data : R.hojeISO()) + '">');
      if (unicoNonOwner) { unInp.setAttribute('disabled', 'disabled'); }
      var deslizState = editing ? !!act.deslizante : false;
      var grpUnico = el('<div class="at-grp"></div>');
      grpUnico.appendChild(UI.field({ label: 'Data', required: true, control: unInp, hint: unicoNonOwner ? 'Você não é o dono: mudar a data exige pedido (botão abaixo).' : 'Dia único desta tarefa.' }));
      var deslizChk = UI.checkbox({ checked: deslizState, label: 'Fica no Hoje todo dia até você concluir', onToggle: function (v) { deslizState = v; } });
      grpUnico.appendChild(UI.field({ label: 'Comportamento', control: deslizChk, hint: 'Se marcado, enquanto não concluída a ocorrência aparece sempre em Hoje.' }));
      if (unicoNonOwner) { grpUnico.appendChild(UI.button({ label: 'Solicitar nova data', variant: 'ghost', icon: 'calendar', onClick: function () { solicitarSerieModal(act); } })); }

      recBox.appendChild(grpRecDates);
      recBox.appendChild(grpSemanal);
      recBox.appendChild(grpMensal);
      recBox.appendChild(grpQuinz);
      recBox.appendChild(grpUnico);

      function show(node, on) { node.style.display = on ? '' : 'none'; }
      function setRecVis(t) {
        show(grpRecDates, t && t !== 'unico');
        show(grpSemanal, t === 'semanal' || t === 'diario');
        show(grpMensal, t === 'mensal' || t === 'bimestral' || t === 'trimestral');
        show(grpQuinz, t === 'quinzenal');
        show(grpUnico, t === 'unico');
      }

      var recSelect = UI.select({
        value: editing ? act.recorrencia : '', placeholder: '— Selecione —',
        options: [{ value: 'diario', label: 'Diária' }, { value: 'semanal', label: 'Semanal' }, { value: 'quinzenal', label: 'Quinzenal (dias 1 e 15)' }, { value: 'mensal', label: 'Mensal' }, { value: 'bimestral', label: 'Bimestral (a cada 2 meses)' }, { value: 'trimestral', label: 'Trimestral (a cada 3 meses)' }, { value: 'unico', label: 'Data única' }],
        onChange: function (v) { if (v === 'diario' && !selDias.length) { marcarDiasUteis(); } setRecVis(v); }
      });
      var recField = UI.field({ label: 'Recorrência', required: true, control: recSelect });
      setRecVis(editing ? act.recorrencia : '');

      var hrInp = el('<input type="time" class="at-date" value="' + (editing && act.horario ? act.horario : '') + '">');
      var hrField = UI.field({ label: 'Horário (opcional)', control: hrInp, hint: 'Horário sugerido no dia.' });

      var banner = el('<div class="at-banner"></div>');
      function showBanner(msg) { banner.textContent = msg; banner.classList.add('on'); }

      /* 16/09 · G: antes de CRIAR, confere se já existe inativa igual no escopo
         (mesmo item do catálogo ou mesmo título, sem acento/caixa/pontuação).
         Cenário que motivou: as 7 atividades inativadas por estarem fora do
         Pareto (ex.: "Conferir conciliação bancária") continuavam no banco; o
         líder que a quisesse de volta ia em "Usar do catálogo" ou "Criar do
         zero" — o único caminho visível — e nascia uma SEGUNDA atividade, com
         histórico zerado, ao lado da inativa. A oferta é ativar a que existe;
         criar outra continua possível (mesmo título em outro setor pode ser
         outra rotina), mas só com um segundo clique consciente. */
      var dupBox = el('<div class="at-dup" role="alert"></div>');
      dupBox.style.display = 'none';
      var criarMesmoAssim = false;
      titInp.addEventListener('input', function () { criarMesmoAssim = false; if (dupBox.style.display !== 'none') { dupBox.style.display = 'none'; } });
      function mostrarIguais(lista) {
        dupBox.innerHTML = '';
        dupBox.appendChild(txt('div', 'at-dup-t', lista.length === 1 ? 'Já existe uma atividade INATIVA igual' : 'Já existem ' + lista.length + ' atividades INATIVAS iguais'));
        dupBox.appendChild(txt('div', 'at-dup-p', 'Ativar a que já existe guarda o histórico e não duplica a rotina — os dias em que ficou parada não viram atraso. Crie outra só se for mesmo uma rotina diferente.'));
        var primeiro = null;
        lista.slice(0, 3).forEach(function (a) {
          var r = el('<div class="at-duprow"></div>');
          var t = el('<div class="t"></div>');
          t.appendChild(document.createTextNode((a.codigo ? a.codigo + ' · ' : '') + (a.titulo || '(sem título)')));
          var info = [a.todosSetores ? 'Todos os setores' : setoresDe(a).join(', '), RECOR_LABEL[a.recorrencia] || 'sem recorrência', motivoInativaDe(a).rotulo];
          if (a.inativadaEm) { info.push('inativa desde ' + fmtBR(a.inativadaEm)); }
          t.appendChild(txt('span', 's', info.join(' · ')));
          r.appendChild(t);
          var b = UI.button({ label: 'Ativar esta', icon: 'check', onClick: function () { m.close(); openInativas({ focoId: a.id }); } });
          b.appendChild(txt('span', 'at-sr', ': ' + (a.titulo || '')));
          if (!primeiro) { primeiro = b; }
          r.appendChild(b);
          dupBox.appendChild(r);
        });
        if (lista.length > 3) { dupBox.appendChild(txt('div', 'at-dup-p', '… e mais ' + (lista.length - 3) + '. Todas estão em “Inativas”.')); }
        var pe = el('<div class="at-inacts"></div>');
        pe.appendChild(UI.button({ label: 'Criar outra mesmo assim', variant: 'ghost', onClick: function () { criarMesmoAssim = true; dupBox.style.display = 'none'; onSave(); } }));
        dupBox.appendChild(pe);
        dupBox.style.display = '';
        if (primeiro && typeof primeiro.focus === 'function') { try { primeiro.focus(); } catch (eD) { } }
      }

      var saveBtn = null;
      var m = UI.modal({
        title: editing ? 'Editar atividade' : 'Nova atividade', width: 540,
        body: [titField, descField, obsField, setorField, subField, multiField, respField, camField, pesoField, supField, recField, recBox, hrField, dupBox, banner],
        footer: function (close) {
          var cancel = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
          saveBtn = UI.button({ label: editing ? 'Salvar' : 'Criar atividade', icon: 'check', onClick: onSave });
          return [cancel, saveBtn];
        }
      });

      function onSave() {
        banner.classList.remove('on');
        var tipo = recSelect.value;
        var titulo = titInp.value.trim();
        var setor = setorSelect.value;
        var siglas = todosState ? [] : uniqSig([setor].concat(Object.keys(extraState).filter(function (k) { return extraState[k]; })).filter(Boolean));
        var errs = [];
        if (!titulo) { errs.push('Informe o título.'); }
        if (!setor) { errs.push('Escolha o setor.'); }
        if (!tipo) { errs.push('Escolha a recorrência.'); }
        if ((tipo === 'semanal' || tipo === 'diario') && !selDias.length) { errs.push('Marque ao menos um dia da semana.'); }
        if ((tipo === 'mensal' || tipo === 'bimestral' || tipo === 'trimestral') && !dmSelect.value) { errs.push('Escolha o dia do mês.'); }
        if (tipo === 'unico' && !R.isISO(unInp.value)) { errs.push('Escolha a data única.'); }
        if (tipo && tipo !== 'unico' && !R.isISO(diInp.value)) { errs.push('Escolha a data de início.'); }
        if (errs.length) { showBanner(errs[0]); return; }

        var respUid = respSelect.value || CURRENT_USER.uid || null;
        var payload = {
          titulo: titulo,
          descricao: descTa.value.trim(),
          observacoes: obsTa.value.trim(), /* F1-F */
          setorSigla: setor,
          setorSiglas: siglas,
          todosSetores: !!todosState,
          subsetorSigla: (subSelect && subSelect.value) ? subSelect.value : null,
          responsavelUid: respUid,
          responsavelNome: respNomeOf(respUid),
          camada: camSelect.value || 'operacional', /* F1-D(c) */
          supervisorUid: supSelect.value || null,   /* F1-H: nullable */
          supervisorNome: supSelect.value ? (((supSelect.options[supSelect.selectedIndex] || {}).text) || '') : null,
          recorrencia: tipo,
          horario: hrInp.value || null,
          diasSemana: (tipo === 'semanal' || tipo === 'diario') ? selDias.slice().sort(function (a, b) { return a - b; }) : null,
          diaMes: (tipo === 'mensal' || tipo === 'bimestral' || tipo === 'trimestral') ? parseInt(dmSelect.value, 10) : null,
          data: tipo === 'unico' ? unInp.value : null,
          deslizante: tipo === 'unico' ? !!deslizState : null,
          dataInicio: tipo !== 'unico' ? diInp.value : null,
          dataFim: (tipo !== 'unico' && dfInp.value) ? dfInp.value : null,
          catalogoId: editing ? (act.catalogoId || null) : (pre ? pre.id : null) /* F1-G: rastreio ATA->atividade */
        };
        /* 16/09 · C: classificação — nova grava a escolha (ou nada); edição só o que mudou */
        var antesEd = { titulo: act ? act.titulo : null, recorrencia: act ? act.recorrencia : null };
        if (!editing) { payload.peso = pesoSelect.value || null; }
        else if (pesoSelect.value !== pesoAtual) { payload.peso = pesoSelect.value || null; antesEd.peso = (act.peso == null) ? null : act.peso; }

        var verr = R.validar(payload);
        if (verr.length) { showBanner('Revise: ' + verr[0]); return; }

        if (!editing) {
          if (!criarMesmoAssim) {
            if (INATIVAS === null) {
              /* a lista ainda não foi lida (ou falhou): lê antes de gravar — sem ela não dá para garantir que não duplica */
              if (saveBtn) { saveBtn.disabled = true; }
              Store.listInativas().then(function (lista) {
                INATIVAS = lista; INATIVAS_ERRO = null;
                if (saveBtn) { saveBtn.disabled = false; }
                onSave();
              }, function () {
                if (saveBtn) { saveBtn.disabled = false; }
                showBanner('Não consegui conferir se já existe uma atividade inativa igual. Verifique a conexão e tente de novo.');
              });
              return;
            }
            var iguais = inativasIguais(payload);
            if (iguais.length) { mostrarIguais(iguais); return; }
          }
          if (saveBtn) { saveBtn.disabled = true; }
          Store.criarAtividade(payload, CURRENT_USER.uid)
            .then(function () { m.close(); toast('Atividade criada.'); refresh(); })
            .catch(function (e) { if (saveBtn) { saveBtn.disabled = false; } showBanner(e.message); });
          return;
        }

        if (saveBtn) { saveBtn.disabled = true; }

        /* edição: trava de data só p/ único de não-dono (input já vem desabilitado) */
        if (act.recorrencia === 'unico' && !canApproveDirect(act)) { payload.data = act.data; payload.deslizante = act.deslizante != null ? act.deslizante : false; }

        Store.atualizarAtividade(act.id, payload, antesEd)
          .then(function () { m.close(); toast('Atividade atualizada.'); refresh(); })
          .catch(function (e) { if (saveBtn) { saveBtn.disabled = false; } showBanner(e.message); });
      }
    }

    /* ----- pedido de nova data para atividade ÚNICA (escopo série) ----- */
    function solicitarSerieModal(act) {
      var dInp = el('<input type="date" class="at-date" value="' + (act.data || R.hojeISO()) + '">');
      var dField = UI.field({ label: 'Nova data', required: true, control: dInp, hint: 'Data atual: ' + fmtBR(act.data) + '.' });
      var mTa = el('<textarea class="at-textarea" placeholder="Motivo do pedido"></textarea>');
      var mField = UI.field({ label: 'Motivo', required: true, control: mTa });
      var banner = el('<div class="at-banner"></div>');
      var info = el('<div class="at-reqinfo">Você não é o dono desta atividade. Será criado um <b>pedido</b> de mudança de data para o dono (ou Admin) aprovar.</div>');
      var saveBtn = null;
      var mm = UI.modal({
        title: 'Solicitar nova data', width: 460, body: [info, dField, mField, banner],
        footer: function (close) { var c = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }); saveBtn = UI.button({ label: 'Enviar pedido', icon: 'repeat', onClick: go }); return [c, saveBtn]; }
      });
      function go() {
        banner.classList.remove('on');
        var nova = dInp.value;
        if (!R.isISO(nova)) { banner.textContent = 'Escolha uma data válida.'; banner.classList.add('on'); return; }
        if (nova === act.data) { banner.textContent = 'A nova data é igual à atual.'; banner.classList.add('on'); return; }
        var motivo = mTa.value.trim();
        if (motivo.length < 3) { banner.textContent = 'Descreva o motivo (mínimo 3 caracteres).'; banner.classList.add('on'); return; }
        if (saveBtn) { saveBtn.disabled = true; }
        Store.createSolicitacao({ atividadeId: act.id, escopo: 'serie', dataAtual: act.data, dataProposta: nova, motivo: motivo, solicitanteUid: CURRENT_USER.uid, solicitanteNome: CURRENT_USER.name, tituloAtividade: act.titulo, setorSigla: act.setorSigla, donoUid: act.criadoPor || null })
          .then(function () { mm.close(); toast('Pedido enviado ao dono.'); })
          .catch(function (e) { if (saveBtn) { saveBtn.disabled = false; } banner.textContent = e.message; banner.classList.add('on'); });
      }
    }

    /* ===================== inativas (lista, busca e ativar) =====================
       16/09 · D/E. Antes esta lista só abria pelo "Ver inativas" do estado
       vazio — que só aparece com a escola sem NENHUMA atividade ativa. Na
       prática ninguém listava nem reativava, embora o aviso de inativar e a
       importação prometessem "Atividades → Inativas". E reativar trazia de volta
       todos os dias parados como atraso. Agora: botão "Inativas (N)" na barra
       de quem escreve; lista no escopo de quem vê (KPI.visivelPara — o líder vê
       as do setor dele); título, setor, recorrência, responsável, classificação
       e MOTIVO; busca; e ativar com confirmação que diz de quando passa a contar
       e no Hoje de quem aparece (planoAtivacao + R.inicioAoReativar).
       opts.focoId: abre já confirmando aquela atividade (vem do "Ativar esta"
       do formulário, quando alguém ia criar uma duplicata). */
    function openInativas(opts) {
      if (!CAN_WRITE) { return null; }
      opts = opts || {};
      var focoId = opts.focoId || null;
      var termo = '';
      var painelAberto = null;
      var pendenteFoco = null;
      var SEQ_CONF = 0; /* id único da explicação de cada confirmação (aria-describedby) */

      var wrap = el('<div class="at-inwrap"></div>');
      var busca = UI.input({ placeholder: 'Título, código, setor, responsável ou motivo' });
      wrap.appendChild(UI.field({ label: 'Buscar nas inativas', control: busca }));
      var resumo = el('<div class="at-insum"></div>');
      /* região viva fica SEMPRE na árvore de acessibilidade (escondida só visualmente enquanto vazia): região que nasce com display:none não é anunciada pelo leitor de tela */
      var aviso = el('<div class="at-inlive at-sr" role="status" aria-live="polite"></div>');
      var lista = el('<div class="at-inact" role="list" aria-label="Atividades inativas"></div>');
      wrap.appendChild(resumo);
      wrap.appendChild(aviso);
      wrap.appendChild(lista);
      var m = UI.modal({
        title: 'Atividades inativas', width: 660, body: wrap,
        footer: function (close) { return [UI.button({ label: 'Fechar', variant: 'ghost', onClick: close })]; }
      });
      busca.addEventListener('input', function () { termo = busca.value; pintar(); });

      function nomeUsuario(uid) {
        if (!uid) { return ''; }
        if (CURRENT_USER && uid === CURRENT_USER.uid) { return 'você'; }
        var u = (USERS_ALL || []).filter(function (x) { return x.uid === uid; })[0];
        return u ? u.nome : '';
      }
      function rotuloSetores(a) {
        if (a.todosSetores) { return 'Todos os setores'; }
        var s = setoresDe(a).map(function (sg) { return sg + ' · ' + nomeSetor(sg); }).join(', ') || 'sem setor';
        return a.subsetorSigla ? s + ' / ' + a.subsetorSigla : s;
      }
      function quandoInativou(a) {
        if (!a.inativadaEm) { return ''; }
        var quem = nomeUsuario(a.inativadaPor);
        return 'inativa desde ' + fmtBR(a.inativadaEm) + (quem ? ' por ' + quem : '');
      }
      function textoBusca(a) {
        return normTexto([a.codigo, a.titulo, rotuloSetores(a), RECOR_LABEL[a.recorrencia], a.responsavelNome, motivoInativaDe(a).rotulo, PESO_DEF[pesoDe(a)] ? PESO_DEF[pesoDe(a)].rotulo : ''].join(' '));
      }

      function carregar() {
        resumo.innerHTML = '';
        lista.innerHTML = '';
        lista.appendChild(txt('div', 'at-inempty', 'Carregando as atividades inativas…'));
        return Store.listInativas().then(function (rows) {
          INATIVAS = rows; INATIVAS_ERRO = null;
          pintar();
          if (ATIV.length) { renderToolbar(); } /* o "Inativas (N)" da barra ganha o número */
        }, function (e) {
          INATIVAS_ERRO = e;
          lista.innerHTML = '';
          var box = el('<div class="at-inempty"></div>');
          box.appendChild(txt('div', 'at-inempty-t', 'Não consegui carregar as inativas'));
          box.appendChild(txt('div', null, ((e && e.message) || 'Falha de leitura.')));
          box.appendChild(UI.button({ label: 'Tentar de novo', variant: 'ghost', icon: 'repeat', onClick: carregar }));
          lista.appendChild(box);
        });
      }

      function pintar() {
        if (painelAberto) { painelAberto = null; }
        var todas = inativasNoEscopo();
        var t = normTexto(termo);
        var vis = t ? todas.filter(function (a) { return textoBusca(a).indexOf(t) !== -1; }) : todas;

        resumo.innerHTML = '';
        if (todas.length) {
          var cont = { fora_pareto: 0, manual: 0, sem: 0, outro: 0 };
          todas.forEach(function (a) { cont[motivoInativaDe(a).chave]++; });
          var partes = [];
          if (cont.fora_pareto) { partes.push(cont.fora_pareto + ' fora do Pareto'); }
          if (cont.manual) { partes.push(cont.manual + ' inativada(s) à mão'); }
          if (cont.outro) { partes.push(cont.outro + ' com outro motivo'); }
          if (cont.sem) { partes.push(cont.sem + ' sem motivo registrado'); }
          var s = el('<span></span>');
          s.appendChild(txt('b', null, todas.length + ' inativa(s)'));
          s.appendChild(document.createTextNode(' no seu escopo · ' + partes.join(' · ') + (t ? ' · ' + vis.length + ' bate(m) com a busca' : '')));
          resumo.appendChild(s);
          resumo.appendChild(infoAt('Inativas — de onde vem cada número', function () {
            return {
              formula: 'Atividades com ativo = falso que o seu papel pode ver (gestor e sócio: todas; líder: as dos setores que lidera). Motivo: “Fora do Pareto” = tirada pelo arquivo da planilha do Pareto; “Inativada à mão” = alguém usou Inativar; “Sem motivo registrado” = inativada antes de 16/09, quando o motivo não era gravado.',
              dados: 'atividades · ativo, motivoInativa, inativadaEm, inativadaPor · escopo do papel' + (t ? ' · busca “' + termo.trim() + '”' : ''),
              numeros: todas.length + ' inativa(s) = ' + cont.fora_pareto + ' fora do Pareto + ' + cont.manual + ' à mão + ' + cont.outro + ' outro motivo + ' + cont.sem + ' sem motivo' + (t ? ' · ' + vis.length + ' na busca' : '')
            };
          }));
        }

        lista.innerHTML = '';
        if (!todas.length) {
          var vz = el('<div class="at-inempty"></div>');
          vz.appendChild(txt('div', 'at-inempty-t', 'Nenhuma atividade inativa no seu escopo.'));
          vz.appendChild(txt('div', null, 'Quando uma atividade for inativada — à mão ou pelo arquivo do Pareto —, ela aparece aqui para ser ativada de novo.'));
          lista.appendChild(vz);
          return;
        }
        if (!vis.length) {
          lista.appendChild(txt('div', 'at-inempty', 'Nenhuma inativa bate com “' + termo.trim() + '”.'));
          return;
        }
        vis.forEach(function (a) { lista.appendChild(linha(a)); });
        /* confirmação pedida de fora ("Ativar esta"): abre depois de a linha estar na lista, para o foco e a rolagem funcionarem */
        if (pendenteFoco) { var pf = pendenteFoco; pendenteFoco = null; abrirConfirmacao(pf.a, pf.row, pf.bt); }
      }

      function linha(a) {
        var row = el('<div class="at-inrow" role="listitem"></div>');
        var top = el('<div class="at-intop"></div>');
        var info = el('<div class="at-ininfo"></div>');
        var nome = el('<div class="at-inname"></div>');
        if (a.codigo) { nome.appendChild(txt('span', 'at-incod', a.codigo)); }
        nome.appendChild(document.createTextNode(a.titulo || '(sem título)'));
        info.appendChild(nome);
        var meta = el('<div class="at-inmeta"></div>');
        var mot = motivoInativaDe(a);
        var chip = el('<span class="at-inmot' + (mot.chave === 'sem' ? ' sem' : '') + '"></span>');
        chip.appendChild(txt('span', 'at-sr', 'Motivo: '));
        chip.appendChild(document.createTextNode(mot.chave === 'outro' ? mot.rotulo.replace(/^Motivo: /, '') : mot.rotulo));
        meta.appendChild(chip);
        var selo = seloPeso(a); if (selo) { meta.appendChild(selo); }
        meta.appendChild(txt('span', null, rotuloSetores(a)));
        meta.appendChild(txt('span', null, RECOR_LABEL[a.recorrencia] || 'recorrência não definida'));
        meta.appendChild(txt('span', null, a.responsavelNome ? 'Resp.: ' + a.responsavelNome : 'Sem responsável'));
        var quando = quandoInativou(a); if (quando) { meta.appendChild(txt('span', null, quando)); }
        info.appendChild(meta);
        top.appendChild(info);
        var bt = UI.button({ label: 'Ativar', variant: 'ghost', icon: 'repeat', onClick: function () { abrirConfirmacao(a, row, bt); } });
        bt.appendChild(txt('span', 'at-sr', ': ' + (a.titulo || 'atividade'))); /* nome acessível único por linha; o visível continua contido nele */
        top.appendChild(bt);
        row.appendChild(top);
        if (focoId && focoId === a.id) { focoId = null; pendenteFoco = { a: a, row: row, bt: bt }; }
        return row;
      }

      function abrirConfirmacao(a, row, bt) {
        if (painelAberto) { painelAberto.fechar(false); }
        var hoje = R.hojeISO();
        var base = planoAtivacao(a, hoje, {}, CURRENT_USER.uid);
        var painel = el('<div class="at-inconf" role="group"></div>');
        painel.setAttribute('aria-label', 'Confirmar ativação: ' + (a.titulo || 'atividade'));
        var dataInp = null, fimInp = null;
        if (base.pede === 'data') {
          dataInp = el('<input type="date" class="at-date">');
          dataInp.setAttribute('min', hoje);
          painel.appendChild(UI.field({ label: 'Nova data', required: true, control: dataInp, hint: 'Hoje ou um dia depois.' }));
        } else if (base.pede === 'fim') {
          fimInp = el('<input type="date" class="at-date">');
          fimInp.setAttribute('min', hoje);
          painel.appendChild(UI.field({ label: 'Novo fim (opcional)', control: fimInp, hint: 'Em branco = sem término.' }));
        }
        /* duas linhas: de quando conta (o que muda) e em que Hoje aparece (quem é afetado) */
        SEQ_CONF += 1;
        var msgId = 'at-inconf-msg-' + SEQ_CONF;
        var msg = el('<div class="at-inmsgs" aria-live="polite" id="' + msgId + '"></div>');
        var msgDatas = txt('p', 'at-inmsg', '');
        var msgQuem = txt('p', 'at-inmsg quem', '');
        msg.appendChild(msgDatas); msg.appendChild(msgQuem);
        painel.appendChild(msg);
        var erro = el('<div class="at-banner" role="alert"></div>');
        painel.appendChild(erro);
        var acts = el('<div class="at-inacts"></div>');
        var cancelar = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: function () { fechar(true); } });
        acts.appendChild(cancelar);
        var confirmar = null;
        if (base.pede === 'regra') {
          acts.appendChild(UI.button({ label: 'Editar a regra', icon: 'repeat', onClick: function () { m.close(); openEditor(a); } }));
        } else {
          confirmar = UI.button({ label: 'Ativar agora', icon: 'check', onClick: function () { return go(); } });
          confirmar.setAttribute('aria-describedby', msgId); /* quem chega pelo teclado ouve de quando conta e no Hoje de quem aparece */
          acts.appendChild(confirmar);
        }
        painel.appendChild(acts);
        row.appendChild(painel);
        row.classList.add('conf');
        bt.disabled = true;

        function escolha() {
          var e = {};
          if (dataInp) { e.data = dataInp.value || ''; }
          if (fimInp) { e.dataFim = fimInp.value || null; }
          return e;
        }
        function atualizar() {
          var p = planoAtivacao(a, hoje, escolha(), CURRENT_USER.uid);
          msgDatas.textContent = p.pode ? p.textoDatas : p.texto;
          msgQuem.textContent = p.pode ? p.textoQuem : '';
          if (confirmar) { confirmar.disabled = !p.pode; }
          return p;
        }
        function fechar(devolverFoco) {
          if (painel.parentNode) { painel.parentNode.removeChild(painel); }
          row.classList.remove('conf');
          bt.disabled = false;
          painelAberto = null;
          if (devolverFoco && typeof bt.focus === 'function') { try { bt.focus(); } catch (eF) { } }
        }
        function go() {
          erro.classList.remove('on');
          var p = atualizar();
          if (!p.pode) { erro.textContent = p.texto; erro.classList.add('on'); return Promise.resolve(false); }
          if (confirmar) { confirmar.disabled = true; }
          cancelar.disabled = true;
          return Store.reativarAtividade(a.id, p.patch, p.antes).then(function () {
            INATIVAS = (INATIVAS || []).filter(function (x) { return x.id !== a.id; });
            painelAberto = null;
            var desde = p.patch.dataInicio || p.patch.data || null;
            aviso.textContent = '“' + (a.titulo || 'Atividade') + '” ativada' + (p.r && p.r.proxima ? ' — primeira ocorrência ' + fmtBR(p.r.proxima) : '') + '.';
            aviso.classList.remove('at-sr');
            toast('Atividade ativada' + (desde ? ' · conta a partir de ' + fmtBR(desde) : '') + '.');
            pintar();
            if (typeof busca.focus === 'function') { try { busca.focus(); } catch (eB) { } }
            refresh();
            return true;
          }, function (e) {
            erro.textContent = (e && e.message) || 'Não consegui ativar agora. Tente de novo.';
            erro.classList.add('on');
            if (confirmar) { confirmar.disabled = false; }
            cancelar.disabled = false;
            return false;
          });
        }
        if (dataInp) { dataInp.setAttribute('aria-describedby', msgId); dataInp.addEventListener('input', atualizar); dataInp.addEventListener('change', atualizar); }
        if (fimInp) { fimInp.setAttribute('aria-describedby', msgId); fimInp.addEventListener('input', atualizar); fimInp.addEventListener('change', atualizar); }
        atualizar();
        painelAberto = { fechar: fechar, go: go };
        var alvoFoco = dataInp || fimInp || confirmar || cancelar;
        if (alvoFoco && typeof alvoFoco.focus === 'function') { try { alvoFoco.focus(); } catch (eA) { } }
        if (typeof row.scrollIntoView === 'function') { try { row.scrollIntoView({ block: 'nearest' }); } catch (eS) { } }
      }

      if (INATIVAS === null) { carregar(); } else { pintar(); }
      return m;
    }

    /* ===================== fila de pendentes (mudança de data) ===================== */
    function openPendentes() {
      if (!CAN_WRITE) { return; }
      var items = pendentesAcionaveis();
      var holder = el('<div class="at-pend"></div>');
      UI.modal({ title: 'Pedidos de mudança de data', width: 520, body: holder });
      function paint() {
        holder.innerHTML = '';
        var live = items.filter(function (s) { return s.status === 'pendente'; });
        if (!live.length) { holder.appendChild(txt('div', 'at-pempty', 'Nenhum pedido pendente para você.')); return; }
        live.forEach(function (s) { holder.appendChild(pendCard(s, paint)); });
      }
      paint();
    }

    function pendCard(s, after) {
      var card = el('<div class="at-pcard"></div>');
      card.appendChild(txt('div', 'at-pt', s.tituloAtividade || '(atividade)'));
      card.appendChild(txt('div', 'at-pmeta', (s.escopo === 'serie' ? 'Série inteira (data da atividade única)' : 'Só esta ocorrência') + (s.motivo ? (' · Motivo: ' + s.motivo) : '')));
      var dates = el('<div class="at-pdates"></div>'); dates.appendChild(txt('span', 'from', fmtBR(s.dataAtual))); dates.appendChild(ico(PATH.arrow, 15)); dates.appendChild(txt('span', 'to', fmtBR(s.dataProposta))); card.appendChild(dates);
      card.appendChild(txt('div', 'at-pwho', 'Solicitado por ' + (s.solicitanteNome || '—')));
      var act = el('<div class="at-pact"></div>');
      act.appendChild(UI.button({ label: 'Rejeitar', variant: 'ghost', icon: 'x', onClick: function () { decidir(s, 'rejeitada', after); } }));
      act.appendChild(UI.button({ label: 'Aprovar', icon: 'check', onClick: function () { decidir(s, 'aprovada', after); } }));
      card.appendChild(act);
      return card;
    }

    function decidir(s, decision, after) {
      var apply = Promise.resolve();
      if (decision === 'aprovada') {
        var act = ATIV.filter(function (a) { return a.id === s.atividadeId; })[0];
        if (s.escopo === 'esta') {
          var target = act || { id: s.atividadeId, setorSigla: s.setorSigla || null, responsavelUid: null };
          apply = Store.setOcorrencia(target, s.ocorrenciaData, { status: 'reprogramada', dataOverride: s.dataProposta }, 'reprogramar_ocorrencia');
        } else {
          apply = Store.atualizarAtividade(s.atividadeId, { data: s.dataProposta }, null);
        }
      }
      apply.then(function () {
        return Store.decidirSolicitacao(s.id, { status: decision, decididoPor: CURRENT_USER.uid, decididoEm: Date.now() });
      }).then(function () {
        s.status = decision;
        toast(decision === 'aprovada' ? 'Pedido aprovado e data atualizada.' : 'Pedido rejeitado.');
        if (after) { after(); }
        refresh();
      }).catch(function (e) { toast(e.message, 'err'); });
    }

    /* ===================== entrada (Guard) ===================== */
    Guard.onReady(function (u) {
      CURRENT_USER = u;                          /* identidade real (substitui o placeholder) */
      CAN_WRITE = (u.profile === 'Admin' || u.profile === 'Editor');
      IS_ADMIN  = (u.profile === 'Admin');
      mount();
    });
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
