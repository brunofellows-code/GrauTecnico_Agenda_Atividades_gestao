<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PROVA L3.5 · painel do dia (2 temas) — NUNCA PUBLICAR</title>
<!-- Abrir com os arquivos de CODIGO/ na MESMA pasta (theme.css, components.css, hoje-cockpit-l3.css, fluxos-l3.css,
     flags.js, ui.js, recorrencia.js, kpi.js, scores.js, firestore-adapter.js, quick-add.js, anti-dup.js, undo-toast.js, hoje-cockpit-l3.js) -->
<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="hoje-cockpit-l3.css">
<link rel="stylesheet" href="fluxos-l3.css">
<style>
  body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
  .pv-bar{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--border);background:var(--s1);position:sticky;top:0;z-index:5}
  .pv-bar button{padding:7px 12px;border-radius:9px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-weight:700;cursor:pointer}
  .pv-wrap{max-width:900px;margin:0 auto;padding:16px}
  .hj-xcard{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:14px 16px;margin-bottom:14px}
  .hj-xtitle{font-weight:800;font-size:13px}
  .pv-note{font-size:12px;color:var(--muted);margin:6px 0 14px}
  #app{position:relative}
</style>
<script src="flags.js"></script>
<script src="ui.js"></script>
<script src="recorrencia.js"></script>
<script src="kpi.js"></script>
<script src="scores.js"></script>
<script src="firestore-adapter.js"></script>
<script src="quick-add.js"></script>
<script src="anti-dup.js"></script>
<script src="undo-toast.js"></script>
</head>
<body>
<div class="pv-bar">
  <strong>PROVA L3.5</strong>
  <button type="button" onclick="setTema('dark')">Tema escuro</button>
  <button type="button" onclick="setTema('light')">Tema claro</button>
  <button type="button" onclick="perfil('gestor')">Gestor</button>
  <button type="button" onclick="perfil('lider')">Líder (PED)</button>
  <button type="button" onclick="perfil('usuario')">Usuário (Ana)</button>
  <button type="button" onclick="perfil('vazio')">Estado vazio</button>
  <button type="button" onclick="perfil('erro')">Estado erro</button>
  <button type="button" onclick="perfil('sem')">Sem permissão</button>
  <button type="button" onclick="QUICK_ADD.open()">Ctrl+N</button>
  <button type="button" onclick="UNDO.iniciar('p'+Date.now(), {}, 'Criando \'Exemplo\' em CRA · 12/09', {onUndo:function(){UI.toast('Cancelado.')}, onCommit:function(){UI.toast('Gravaria agora.', 'ok')}})">Undo 7 s</button>
</div>
<div class="pv-wrap" id="app">
  <div class="pv-note">Mesmos arquivos do CODIGO/. Dados de exemplo (nenhuma leitura de banco). A régua "Meu mês" abaixo simula a de hoje.html — o painel só LINKA para ela (P3).</div>
  <div class="hj-xcard"><div class="hj-xtitle">Meu mês</div><div class="pv-note">(régua única de hoje.html — simulada)</div></div>
  <div id="hj-prog"></div>
  <div id="hj-kpis"></div>
</div>
<script src="hoje-cockpit-l3.js"></script>
<script>
  function setTema(t) { document.documentElement.setAttribute('data-theme', t); }
  function occ(id, titulo, uid, nome, setor, eff, status, atrasada, hora) {
    return { titulo: titulo, uid: uid, responsavel: nome, effDate: eff, status: status, atrasada: !!atrasada,
      act: { id: id, titulo: titulo, responsavelUid: uid, responsavelNome: nome, setorSigla: setor, horario: hora || null } };
  }
  var hoje = (function () { var d = new Date(); return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate(); })();
  function dia(n) { var d = new Date(); d.setDate(d.getDate() + n); return d.getFullYear() + '-' + (d.getMonth() + 1 < 10 ? '0' : '') + (d.getMonth() + 1) + '-' + (d.getDate() < 10 ? '0' : '') + d.getDate(); }
  var CTX = { hoje: hoje, setores: [{ sigla: 'CRA', nome: 'Central' }, { sigla: 'PED', nome: 'Pedagógico' }, { sigla: 'COM', nome: 'Comercial' }], ativ: [], board: [
    occ('1', 'Ligar para inadimplentes de setembro', 'u1', 'Ana Souza', 'CRA', dia(-3), 'pendente', true),
    occ('2', 'Fechar caixa do dia', 'u1', 'Ana Souza', 'CRA', hoje, 'pendente', false, '17:30'),
    occ('3', 'Relatório semanal', 'u1', 'Ana Souza', 'CRA', dia(-1), 'concluida', false),
    occ('4', 'Aula assistida — turma noite', 'u2', 'Beto Lima', 'PED', dia(-6), 'pendente', true),
    occ('5', 'Plano de aula outubro', 'u2', 'Beto Lima', 'PED', dia(1), 'em_andamento', false),
    occ('6', 'Visita escola parceira', 'u3', 'Carla Dias', 'COM', hoje, 'pendente', false, '09:00'),
    occ('7', 'Raio-X comercial', 'u3', 'Carla Dias', 'COM', dia(-2), 'concluida', false),
    occ('8', 'Follow-up potenciais', 'u3', 'Carla Dias', 'COM', dia(2), 'pendente', false),
    occ('9', 'Conferir 1ªs parcelas', 'u1', 'Ana Souza', 'CRA', dia(-8), 'pendente', true),
    occ('10', '<b>tentativa de injeção</b>', 'u2', 'Beto Lima', 'PED', dia(-1), 'pendente', true)
  ] };
  var USERS = {
    gestor: { uid: 'g1', nome: 'Gestor', perfil: 'gestor', setoresLiderados: [] },
    lider: { uid: 'u2', nome: 'Beto Lima', perfil: 'lider', setoresLiderados: ['PED'] },
    usuario: { uid: 'u1', nome: 'Ana Souza', perfil: 'usuario', setoresLiderados: [] },
    vazio: { uid: 'u9', nome: 'Novo', perfil: 'usuario', setoresLiderados: [] },
    sem: { uid: 'x', nome: 'X', perfil: 'desconhecido' }
  };
  function perfil(k) {
    window.GRAUT_USER = USERS[k] || null;
    var modelo = (k === 'erro') ? { hoje: hoje, board: [{ bad: true, act: null, status: 'pendente', effDate: 'xx' }], ativ: [], setores: null } : CTX;
    if (k === 'erro') { window.GRAUT_USER = USERS.gestor; }
    document.dispatchEvent(new CustomEvent('hoje:modelo', { detail: { modelo: modelo, user: window.GRAUT_USER } }));
  }
  document.addEventListener('quickadd:submit', function (ev) {
    UI.toast('Parseado: ' + JSON.stringify(ev.detail) + ' (na tela Hoje, a ponte grava no banco)', 'ok');
  });
  perfil('gestor');
</script>
</body>
</html>
