<!doctype html>
<html lang="pt-BR" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Entrar · GERA</title>
  <link rel="stylesheet" href="theme.css">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#090B10">
  <script src="theme.js"></script>
  <style>
    /* cor 100% via token do theme.css — zero hex */
    *{box-sizing:border-box}
    html,body{margin:0}
    body{background:var(--bg);color:var(--text);font-family:'Sora',system-ui,-apple-system,sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px}
    .lg-wrap{width:100%;max-width:400px;position:relative}
    .lg-card{background:var(--s1);border:1px solid var(--border);border-radius:18px;padding:30px 28px;box-shadow:var(--cardShadow)}
    .lg-brand{display:flex;align-items:center;gap:12px;margin-bottom:22px}
    .lg-logo{width:42px;height:42px;border-radius:11px;background:var(--brand);color:var(--onBrand);display:flex;align-items:center;justify-content:center;flex:0 0 auto}
    .lg-bname{font-weight:800;font-size:16px;line-height:1.15;letter-spacing:-.01em}
    .lg-bname span{display:block;font-size:11px;font-weight:600;color:var(--muted2Text,var(--muted2));letter-spacing:.05em;text-transform:uppercase;margin-top:2px}
    .lg-title{font-size:22px;font-weight:800;letter-spacing:-.01em;margin:0 0 4px}
    .lg-sub{font-size:13.5px;color:var(--muted);margin:0 0 22px}
    .lg-field{margin-bottom:14px}
    .lg-field label{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin-bottom:6px}
    .lg-field input{width:100%;font:inherit;font-size:14px;color:var(--text);background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:11px 13px;outline:none;transition:border-color .12s ease,box-shadow .12s ease}
    .lg-field input::placeholder{color:var(--muted2Text,var(--muted2))}
    .lg-field input:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--activeBg)}
    .lg-msg{font-size:13px;font-weight:600;border-radius:10px;padding:10px 12px;margin:2px 0 14px;line-height:1.45}
    .lg-msg.err{color:var(--redText,var(--red));background:var(--haloRed)}
    .lg-msg.info{color:var(--greenText);background:var(--activeBg)}
    .lg-btn{width:100%;font:inherit;font-size:14px;font-weight:800;color:var(--ctaText);background:var(--cta);border:0;border-radius:11px;padding:12px 16px;cursor:pointer;transition:filter .12s ease,opacity .12s ease}
    .lg-btn:hover{filter:brightness(1.05)}
    .lg-btn:disabled{opacity:.6;cursor:default}
    .lg-link{display:block;width:100%;margin-top:12px;font:inherit;font-size:13px;font-weight:700;color:var(--accentText);background:none;border:0;cursor:pointer;text-align:center;padding:6px}
    .lg-link:hover{text-decoration:underline}
    .lg-theme{position:absolute;top:-44px;right:0;font:inherit;font-size:12px;font-weight:700;color:var(--muted);background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:7px 12px;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
    .lg-theme:hover{background:var(--s3);color:var(--text)}
    @media (max-width:480px){ .lg-theme{position:static;margin:0 auto 14px;display:flex;width:max-content} }
  </style>
</head>
<body>
  <main class="lg-wrap">
    <button class="lg-theme" type="button" data-theme-toggle aria-label="Alternar tema">
      <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"></path></svg>
      Tema
    </button>

    <div class="lg-card">
      <div class="lg-brand">
        <span class="lg-logo">
          <img src="icon-192.png" alt="GERA" width="22" height="22" style="display:block;border-radius:22%">
        </span>
        <span class="lg-bname">GERA<span>Grau Técnico FSA</span></span>
      </div>

      <h1 class="lg-title">Entrar</h1>
      <p class="lg-sub">Acesse com seu e-mail e senha.</p>

      <div class="lg-field">
        <label for="email">E-mail</label>
        <input id="email" type="email" autocomplete="username" inputmode="email" autocapitalize="off" spellcheck="false" placeholder="nome@escola.com.br">
      </div>
      <div class="lg-field">
        <label for="senha">Senha</label>
        <input id="senha" type="password" autocomplete="current-password" placeholder="Sua senha">
      </div>

      <div id="msg" class="lg-msg err" role="alert" hidden></div>

      <button id="entrar" class="lg-btn" type="button">Entrar</button>
      <button id="reset" class="lg-link" type="button">Esqueci minha senha</button>
      <button id="pedir" class="lg-link" type="button">Primeiro acesso? Pedir acesso ao gestor</button>

      <!-- 17/09 · cadastro por pedido: a pessoa cria a própria conta e registra UM pedido; só o gestor libera (perfil e setor) -->
      <div id="pedido" hidden>
        <div class="lg-field">
          <label for="pnome">Seu nome completo</label>
          <input id="pnome" type="text" autocomplete="name" placeholder="Nome e sobrenome">
        </div>
        <div class="lg-field">
          <label for="psetor">Setor ou função</label>
          <input id="psetor" type="text" placeholder="Ex.: Secretaria · atendimento">
        </div>
        <button id="enviarPedido" class="lg-btn" type="button">Pedir acesso</button>
        <button id="voltarLogin" class="lg-link" type="button">Já tenho acesso · voltar</button>
      </div>
    </div>
  </main>

  <script type="module">
    import { auth, db } from "./firebase.js";
    import {
      signInWithEmailAndPassword,
      sendPasswordResetEmail,
      onAuthStateChanged,
      createUserWithEmailAndPassword,
      signOut
    } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-auth.js";
    import { doc, setDoc } from "https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js";

    var $ = function (id) { return document.getElementById(id); };
    var msg = $('msg');
    var btn = $('entrar');

    function showErr(t) { msg.className = 'lg-msg err'; msg.textContent = t; msg.hidden = false; }
    function showInfo(t) { msg.className = 'lg-msg info'; msg.textContent = t; msg.hidden = false; }
    function clearMsg() { msg.hidden = true; msg.textContent = ''; }

    function msgFor(code) {
      switch (code) {
        case 'auth/invalid-credential':
        case 'auth/wrong-password':
        case 'auth/user-not-found': return 'E-mail ou senha incorretos.';
        case 'auth/invalid-email': return 'E-mail inválido.';
        case 'auth/too-many-requests': return 'Muitas tentativas. Aguarde alguns minutos e tente de novo.';
        case 'auth/user-disabled': return 'Esta conta está desativada. Procure um Admin.';
        case 'auth/network-request-failed': return 'Sem conexão. Verifique sua internet.';
        default: return 'Não foi possível entrar. Tente novamente.';
      }
    }

    function entrar() {
      clearMsg();
      var email = $('email').value.trim();
      var senha = $('senha').value;
      if (!email || !senha) { showErr('Preencha e-mail e senha.'); return; }
      btn.disabled = true;
      var lbl = btn.textContent;
      btn.textContent = 'Entrando…';
      signInWithEmailAndPassword(auth, email, senha)
        .then(function () { window.location.replace('hoje.html'); })
        .catch(function (e) {
          showErr(msgFor(e && e.code));
          btn.disabled = false;
          btn.textContent = lbl;
        });
    }

    function resetar() {
      clearMsg();
      var email = $('email').value.trim();
      if (!email) { showErr('Digite seu e-mail no campo acima para receber o link de redefinição.'); return; }
      sendPasswordResetEmail(auth, email)
        .then(function () { showInfo('Se houver uma conta com esse e-mail, enviei um link de redefinição. Confira a caixa de entrada e o spam.'); })
        .catch(function (e) {
          if (e && e.code === 'auth/invalid-email') { showErr('Informe um e-mail válido.'); }
          else { showInfo('Se houver uma conta com esse e-mail, enviei um link de redefinição. Confira a caixa de entrada e o spam.'); }
        });
    }

    /* ---------- 17/09 · pedir acesso ----------
       Cria a conta no Authentication e grava solicitacoes_acesso/{uid} com status 'pendente'.
       A conta NÃO entra no sistema: sem cadastro em /usuarios o guard nega. O gestor libera em Usuários. */
    var PEDINDO = false;
    function modoPedido(on) {
      clearMsg();
      $('pedido').hidden = !on; $('entrar').hidden = on; $('reset').hidden = on; $('pedir').hidden = on;
      $('senha').setAttribute('autocomplete', on ? 'new-password' : 'current-password');
      $('senha').placeholder = on ? 'Crie uma senha (mínimo 8 caracteres)' : 'Sua senha';
      var t = document.querySelector('.lg-title'), sb = document.querySelector('.lg-sub');
      if (t) { t.textContent = on ? 'Pedir acesso' : 'Entrar'; }
      if (sb) { sb.textContent = on ? 'Preencha e envie. O gestor libera o seu acesso e define o seu perfil.' : 'Acesse com seu e-mail e senha.'; }
    }
    function msgPedido(code) {
      switch (code) {
        case 'auth/email-already-in-use': return 'Este e-mail já tem conta. Use "Entrar" ou "Esqueci minha senha". Se o acesso ainda não foi liberado, fale com o gestor.';
        case 'auth/weak-password': return 'Senha fraca: use pelo menos 8 caracteres.';
        case 'auth/invalid-email': return 'E-mail inválido.';
        case 'auth/operation-not-allowed': return 'O cadastro por pedido ainda não está habilitado. Fale com o gestor.';
        case 'auth/network-request-failed': return 'Sem conexão. Verifique sua internet.';
        default: return 'Não consegui enviar o pedido agora. Tente de novo em instantes.';
      }
    }
    function pedirAcesso() {
      clearMsg();
      var nome = $('pnome').value.trim(), setor = $('psetor').value.trim(), email = $('email').value.trim(), senha = $('senha').value;
      if (nome.length < 3) { showErr('Informe o seu nome completo.'); return; }
      if (!email) { showErr('Informe o seu e-mail.'); return; }
      if (senha.length < 8) { showErr('Crie uma senha com pelo menos 8 caracteres.'); return; }
      var b = $('enviarPedido'); b.disabled = true; var lbl = b.textContent; b.textContent = 'Enviando…';
      PEDINDO = true;
      createUserWithEmailAndPassword(auth, email, senha)
        .then(function (cred) {
          var uid = cred.user.uid;
          return setDoc(doc(db, 'solicitacoes_acesso', uid), { uid: uid, nome: nome.slice(0, 120), email: cred.user.email || email, setorInformado: setor.slice(0, 120), status: 'pendente', criadoEm: Date.now() })
            .then(function () { return signOut(auth); })
            .then(function () { PEDINDO = false; modoPedido(false); showInfo('Pedido enviado. Quando o gestor liberar, entre com este e-mail e a senha que você criou.'); })
            .catch(function (e) { return signOut(auth).then(function () { PEDINDO = false; showErr(e && e.code === 'permission-denied' ? 'A sua conta foi criada, mas o pedido não pôde ser registrado. Avise o gestor para liberar o seu acesso.' : 'A sua conta foi criada, mas o pedido não foi registrado. Avise o gestor.'); }); });
        })
        .catch(function (e) { PEDINDO = false; showErr(msgPedido(e && e.code)); })
        .then(function () { b.disabled = false; b.textContent = lbl; });
    }
    $('pedir').addEventListener('click', function () { modoPedido(true); });
    $('voltarLogin').addEventListener('click', function () { modoPedido(false); });
    $('enviarPedido').addEventListener('click', pedirAcesso);

    $('entrar').addEventListener('click', entrar);
    $('reset').addEventListener('click', resetar);
    ['email', 'senha'].forEach(function (id) {
      $(id).addEventListener('keydown', function (e) { if (e.key === 'Enter') { entrar(); } });
    });

    /* Já está logado? Pula a tela de login e vai pro app. */
    onAuthStateChanged(auth, function (u) { if (u && !PEDINDO) { window.location.replace('hoje.html'); } });
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
</html>
