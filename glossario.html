  <script>
  (function () {
  'use strict';

  /* ============================================================
     GLOSSÁRIO (Protocolo A · aba 2) — linguagem simples.
     O "i" das telas PROVA o cálculo; aqui explicamos o SIGNIFICADO.
     ============================================================ */

  var SECOES = [
    ['Siglas dos setores (taxonomia oficial: 7 setores-raiz + 13 subsetores)', [
      ['PED — Pedagógico', 'Setor que cuida das aulas, professores e do conteúdo dos cursos. Subsetores: PAD (Pedagógico Administrativo), PAT (Pedagógico Atendimento), ENF (Estágio Enfermagem) e RAD (Estágio Radiologia).'],
      ['SEC — Secretaria', 'Setor que cuida de matrículas, documentos e atendimento ao aluno. Subsetores: ADM (Administrativo), FIN (Financeiro), BEM (Bem-estar), TI (Tecnologia da Informação) e MAN (Manutenção).'],
      ['CRA — Central de Relacionamento com o Aluno', 'Setor que acompanha o aluno durante o curso: dúvidas, avisos, cobrança e retenção.'],
      ['GES — Gestão', 'Direção e administração da escola: decisões, finanças e pessoas.'],
      ['CSA — Central de Sucesso do Aluno', 'Setor que cuida da experiência do aluno de ponta a ponta. Subsetores: AGE (Agência de Emprego — conecta alunos a vagas), PVE (Pós-venda — os primeiros dias após a matrícula), RET (Retenção — evita cancelamentos) e EVA (Evasão — traz de volta quem sumiu).'],
      ['COM — Comercial', 'Setor que capta novos alunos: vendas, campanhas e visitas.'],
      ['SOC — Sócios', 'Os donos do negócio: as rotinas de prestação de contas e decisão que sobem do gestor para os sócios.'],
      ['Subsetor', 'Uma divisão dentro de um setor-raiz (ex.: FIN dentro da SEC). Tem sigla própria e permite dar a um líder o acesso a só uma fatia do setor.'],
      ['SIGLA', 'Código curto e ESTÁVEL de cada setor ou subsetor (ex.: PED, FIN). É por ela que o sistema liga atividades, eventos e indicadores ao setor — por isso mudar a sigla de um setor em uso é perigoso.']
    ]],
    ['Termos do dia a dia', [
      ['Atividade', 'Uma tarefa cadastrada no sistema. Pode acontecer uma vez só (única) ou se repetir (recorrente).'],
      ['Ocorrência', 'CADA vez que uma atividade acontece. Uma atividade "limpar sala toda segunda" gera uma ocorrência por segunda-feira. O check de feito/não-feito é por ocorrência — assim o histórico não se perde.'],
      ['Recorrência', 'A regra de repetição: Diária, Semanal, Quinzenal (2× por mês, a cada ~15 dias), Mensal, Bimestral, Trimestral ou Única.'],
      ['Bimestral', 'Repete a cada 2 meses, sempre no mesmo dia do mês (ex.: dia 15 de julho, setembro, novembro…). O mês de partida é o da data de início.'],
      ['Trimestral', 'Repete a cada 3 meses, sempre no mesmo dia do mês (ex.: dia 1º de julho, outubro, janeiro…). O mês de partida é o da data de início.'],
      ['Camada', 'Em que nível do organograma a rotina vive: SÓCIO (gestão indireta — o que sobe para os donos), GESTOR (gestão direta — os rituais do gestor da unidade) e OPERACIONAL (líder e assistente de cada setor executando o dia a dia).'],
      ['Data de início da operação', 'A "virada de chave": na importação, o gestor digita UMA data e todas as rotinas recorrentes sem data própria passam a valer a partir dela — sem precisar datar linha por linha.'],
      ['Data deslizante', 'Só para atividade única: se não foi feita, a pendência "desliza" e continua aparecendo até ser concluída.'],
      ['Reprogramada', 'Ocorrência cuja data foi adiada com aprovação. Conta no indicador de reprogramação.'],
      ['Pulada', 'Ocorrência marcada como "não vai acontecer desta vez" (ex.: feriado). Não conta como atraso nem entra na aderência.'],
      ['Subtarefa', 'Pedaço de uma atividade, com % próprio (0, 25, 50, 75, 100). A média das subtarefas vira o % da atividade (cascata). Gerencie pelo menu ⋮ do cartão, na tela Atividades.'],
      ['Reunião (no sistema)', 'Registro de uma reunião com suas DECISÕES: o que foi decidido, quem é o dono e o prazo. Uma decisão pode virar atividade com 1 clique.'],
      ['Rollforward', 'Decisões ainda abertas de reuniões passadas reaparecem automaticamente na reunião seguinte — nada cai no esquecimento.'],
      ['Evento', 'Compromisso com data no calendário (formatura, feira, visita), com custo previsto e custo realizado.'],
      ['Soft-delete', 'Nada é apagado de verdade: o registro é só "desativado" e some das telas, mas o histórico continua guardado.'],
      ['atividade_log', 'O "livro-caixa" do sistema: toda criação, edição e conclusão fica registrada com data, hora e autor. A tela Performance lê daqui.']
    ]],
    ['Indicadores (o que cada número significa)', [
      ['Atividades atrasadas', 'Quantas ocorrências passaram do prazo e ainda não foram feitas. Se sobe, algo precisa ser replanejado ou redistribuído.'],
      ['Catálogo de ações (ATA)', 'Biblioteca com as 95 ações da ATA "Estratégia Cajazeiras", já classificadas por setor. Na tela Atividades, "Do catálogo" abre a lista e o item escolhido vira uma atividade normal, pré-preenchida — nada é criado sem você confirmar.'],
      ['Plano de ação (vivo)', 'Compromisso que nasce de um alerta da Inteligência: tem dono, prazo e atividades vinculadas. O % e o status (No prazo / Em risco / Vencido / Concluído) são calculados na hora a partir das atividades — o plano nunca "mente" porque ninguém digita o status.'],
      ['Score 50/30/20', 'Nota de desempenho de setor, líder ou pessoa: 50% aderência + 30% conclusão no prazo + 20% de (100 − atraso residual). Quando falta um componente (ex.: ninguém concluiu nada ainda), ele sai da conta e os pesos se reequilibram — a nota nunca usa número inventado.'],
      ['Atraso residual', 'De tudo o que JÁ venceu, quanto continua aberto (em %). Diferente do aging (que mede há quantos dias): o residual mede o TAMANHO da dívida. 0% = tudo que venceu foi resolvido.'],
      ['Aderência à rotina', 'De tudo o que estava previsto até hoje, quanto foi realmente feito (em %). É o termômetro da disciplina da rotina. Sem nada previsto no período, mostra "—" (não inventa 0%).'],
      ['Conclusão no prazo', 'Das que foram concluídas, quantas foram concluídas DENTRO do prazo (em %). Se está baixo, os prazos estão irreais ou a fila está travando.'],
      ['Aging das atrasadas', 'Há quantos dias, em média, as atrasadas estão vencidas. Atrasada "velha" (8+ dias) é mais grave que a de ontem — ataque as mais velhas primeiro.'],
      ['Carga (WIP)', 'Quantas ocorrências em aberto cada pessoa/setor tem. Carga muito acima da mediana = sobrecarga → redistribuir.'],
      ['Tempo de ciclo', 'Quanto tempo passa entre INICIAR e CONCLUIR uma ocorrência (em dias). Mede a velocidade real de execução. "<1 d" = começou e terminou no mesmo dia.'],
      ['Taxa de reprogramação', 'Quantas ocorrências foram adiadas, em % do total. Alta demais = metas ou escopo precisam de revisão.'],
      ['Throughput', 'Quantas ocorrências são concluídas por semana. Mostra a capacidade real da equipe.'],
      ['Score do setor (0–100)', 'Nota única que junta: aderência (peso 50), atrasadas (peso 30) e aging (peso 20). Verde ≥ 80 · amarelo 60–79 · vermelho < 60. O "i" ao lado do score mostra a conta feita com os números do dia.'],
      ['Gargalo', 'Setor que o detector aponta como ponto de travamento: aderência abaixo de 80%, ou atrasadas antigas com carga bem acima da mediana. É o 1º item do Plano de ação.'],
      ['Δ7d (delta 7 dias)', 'Quanto o indicador mudou em relação a 7 dias atrás. Seta verde = melhorou; vermelha = piorou. Só aparece na janela padrão e depois de 7 fotos diárias ("coletando X/7 dias").'],
      ['Sparkline', 'O mini-gráfico de linha dentro do card: a forma dos últimos 7 dias do indicador, para ver a tendência de relance.'],
      ['Snapshot (foto do dia)', 'Uma vez por dia o sistema grava os números daquele dia. É dessa série de fotos que nascem o Δ7d e o sparkline. Sem medição retroativa: só existe tendência a partir do 1º dia de foto.'],
      ['Janela padrão', 'O recorte de tempo dos indicadores: dos últimos 45 dias até 30 dias à frente. As tendências (Δ7d) só valem nessa janela — comparar com "semana" ou "mês" misturaria réguas diferentes.'],
      ['Pareto', 'Regra 80/20: poucos itens causam a maior parte do problema. O Plano de ação e a Matriz de Risco ordenam do mais impactante para o menos.'],
      ['Pareto das atrasadas', 'Card da Inteligência que ordena os setores pelo nº de atrasadas e mostra o % acumulado. Os setores "vitais" (até a barra em que o acumulado cruza 80%) concentram a maior parte do problema — atacar esses primeiro rende mais que espalhar esforço.'],
      ['Supervisor', 'Quem acompanha a atividade POR CIMA do responsável (padrão de aprovador do Jira/Asana). O sistema sugere sozinho subindo a hierarquia: operacional → líder do subsetor/setor → gestor; camada gestor → outro gestor; sócio fica sem (é o topo). É só sugestão: dá para trocar ou deixar vazio.'],
      ['Risco dinâmico (score)', 'Nota de risco que MUDA com o comportamento real: prioridade do PEF (P1=5 … P5=1) × fator de atraso (quanto mais velho, maior) × fator de reprogramação (quanto mais adiada, maior). ≥15 Crítico · ≥7,5 Em risco · abaixo, Observação. A mitigação mostrada é sempre a do PEF — o sistema nunca inventa uma.'],
      ['Sequência (🔥 streak)', 'Dias seguidos em que você concluiu pelo menos 80% das SUAS atividades do dia. Dia de folga (sem nada previsto) não quebra; o dia de hoje, ainda aberto, também não. É motivação, não punição — não entra em nenhum ranking.'],
      ['Escalonamento D-5/D-3/D-0', 'Plano de ação abaixo de 70% escala sozinho: faltando 5 dias alerta o DONO · faltando 3 dias sobe à GESTÃO · vencido vira NÃO-CONFORMIDADE. Nunca trava nada — só muda de dono e de cor, para a cobrança acontecer antes do estouro.'],
      ['Você supervisiona', 'Card do Meu Dia com as rotinas abertas em que você é o SUPERVISOR (e outra pessoa é a responsável). Serve para acompanhar por cima sem virar o executor.'],
      ['Backup (exportar JSON)', 'Botão na tela Importar (só gestor) que baixa uma cópia completa do banco num arquivo JSON. É a recuperação de desastre do sistema: guarde o arquivo em local seguro e repita todo mês.'],
      ['Responsável marca as próprias', 'Quem é o responsável de uma rotina pode concluir, iniciar e reabrir as PRÓPRIAS ocorrências no Meu Dia — mesmo no perfil usuário (padrão Asana: o assignado age na própria tarefa). Reprogramar e pular continuam com líder/gestor.'],
      ['Exportar CSV (ranking)', 'Botão na tela Performance que baixa a lente atual do ranking (setor, líder ou usuário) num arquivo que abre direto no Excel. Mesmos números da tela — nada é recalculado.'],
      ['Placar da reunião', 'Cabeçalho numérico da reunião — Realizadas (no prazo/com atraso), Em andamento, Planejadas, Vencidas e Vence hoje — igual ao topo da planilha ATA, mas AUTOMÁTICO: cada número vem do status derivado da atividade-filha de cada decisão. Ninguém digita status.'],
      ['Reunião (entidade raiz)', 'No GERA a reunião é a raiz do ciclo: pauta, presença, decisões e cobrança automática. Decisão aberta reaparece na reunião seguinte do mesmo tipo (rollforward) e vira atividade em 1 clique — não existe \"Projeto\".'],
      ['Custo do mês (Eventos)', 'Linha no topo da Agenda de Eventos somando o previsto × realizado de todos os eventos do mês no seu recorte, com a diferença em destaque. Valores em centavos por baixo — sem erro de arredondamento.']
    ]],
    ['Perfis e permissões', [
      ['Admin', 'Vê e faz tudo, inclusive gerenciar usuários e aprovar mudanças de data automaticamente.'],
      ['Editor', 'Cria e edita atividades, reuniões e eventos. Mudança de data de série precisa de aprovação.'],
      ['Visualizador', 'Só enxerga: não cria nem edita nada.'],
      ['Consultor Externo', 'Acesso de visualização limitado, pensado para alguém de fora da equipe.'],
      ['RBAC', 'Controle de acesso por papel (Role-Based Access Control): o que cada perfil pode fazer é imposto também no banco (Regras do Firestore), não só na tela.']
    ]],
    ['Importação', [
      ['Planilha-modelo', 'O arquivo CSV com as colunas que o sistema espera. A 1ª linha é o cabeçalho com os nomes das colunas.'],
      ['Código estável', 'A coluna "codigo": um identificador que NUNCA muda (ex.: PED-001). É por ele que o sistema sabe se a linha é uma atividade nova (cria) ou existente (atualiza).'],
      ['De-para', 'A conferência coluna a coluna: o que o sistema ESPERAVA × o que ENCONTROU no arquivo. Divergência crítica BLOQUEIA a importação; divergência leve só alerta e pede confirmação.'],
      ['Delta', 'Só grava o que MUDOU. Linha idêntica ao que já existe é pulada; célula vazia PRESERVA o valor atual (não apaga nada por engano). Nunca sobrescreve tudo.'],
      ['Auditoria da importação', 'Cada criação/alteração da importação vai para o atividade_log com o rótulo de importação — dá para rastrear depois o que aquele arquivo mudou.']
    ]],
    ['Telas', [
      ['Meu Dia (Hoje)', 'A primeira tela: compromissos e atividades do dia em uma visão única, com check por ocorrência.'],
      ['Inteligência', 'O painel de priorização: indicadores gerais, score por setor, gargalos e o Plano de ação (o que atacar primeiro).'],
      ['Performance', 'O ranking por pessoa, lido do atividade_log. Pior score primeiro — é onde agir. Não mede o passado anterior ao log.'],
      ['Agenda de Eventos', 'O calendário mensal de eventos de todos os setores, com custo previsto × realizado. O botão no Meu Dia pulsa quando há novidade.'],
      ['Matriz de Risco', 'A lista dos riscos do sistema/operação, ordenada por Pareto (impacto × chance), cada um com sua mitigação.'],
      ['Importar', 'A tela de importação por planilha, com o de-para de auditoria e o preview do delta antes de gravar.']
    ]],
    ['Planejamento do Setor (5W2H mensal)', [
      ['Planejamento do Setor', 'A tela onde cada setor monta o plano do mês SEGUINTE (o que · como · quem · quando · quanto). Todo mundo vê os planos de todos (prestação de contas); edita quem lidera o setor — e o gestor.'],
      ['Prazo de entrega (D-5 / D-3 / D-0)', 'O plano da competência vence no dia 25 do mês anterior. Dia 20 acende o alerta ao líder (D-5), dia 22 à gestão (D-3) e no dia 25 sem plano vira flag de não-conformidade (D-0). NUNCA bloqueia: entregar atrasado é sempre possível — o farol só registra.'],
      ['Cobrança manual (D-3/D-0)', 'Quando o prazo aperta e o plano não chegou, o gestor ganha botões que abrem o WhatsApp ou o e-mail com a cobrança já escrita. O envio automático (push) depende de servidor e ainda não existe no GERA.'],
      ['Alçada R$ 200 (gestor + sócio)', 'Item de plano que custa até R$ 200: o líder tem autonomia total. Acima de R$ 200: o item trava até ter DUAS assinaturas — de um GESTOR e de um SÓCIO (em qualquer ordem). Quem cria o item não assina a própria aprovação. A trava é só do item; o plano nunca trava.'],
      ['Sócio (marca no cadastro)', 'Sócio não é um perfil novo: é um usuário Gestor com a marca \"É sócio\" ligada na tela Usuários. É essa marca que habilita a assinatura de sócio na alçada.'],
      ['Pause de aprovação (clock-pause)', 'Enquanto um item acima de R$ 200 espera as assinaturas, ele fica FORA do cálculo da nota do setor — o relógio não corre contra o líder por uma espera que não é dele (mesmo padrão dos sistemas de chamados, que pausam o SLA em \"aguardando aprovação\").'],
      ['Não realizado (com motivo)', 'Item que não vai acontecer é declarado \"não realizado\" com um motivo obrigatório da lista (falta de tempo, dependência de outro setor, falta de recurso, prioridade mudou, aguardando aprovação, outro). Ele conta CONTRA a aderência do setor e o motivo alimenta o Pareto de causas. \"Reabrir\" desfaz e limpa o motivo.'],
      ['Nota do mês (50/30/20)', 'Nota do setor na competência: 50% aderência (realizados ÷ previstos) + 30% no prazo + 20% atraso residual (teto de 7 dias). Item removido sai da conta; item em pause de aprovação também; item \"não realizado\" derruba a aderência. O \"i\" ao lado da nota mostra a conta feita.'],
      ['O QUE VEM × O QUE FOI', 'O eixo no topo da tela: à esquerda, o que está previsto e aberto (em ordem de data); à direita, os desfechos — realizados (com o desvio de prazo) e não realizados (em vermelho, com o motivo).']
    ]],
    ['Reuniões (ciclo PEF)', [
      ['Tipos de reunião', 'O GERA tem 5 tipos, e o tipo define quem entra na convocação automática: Reunião de Líderes (todos os líderes + gestores), Reunião Integrada (líderes + gestores + sócios), Reunião de Departamento (o líder do setor escolhido + quem é lotado nele), Reunião com Instrutor e Reunião c/ Líderes de Turmas (só quem criou — instrutores e alunos não têm login, entram como convidados externos). Em todos os tipos dá para ajustar a lista à mão.'],
      ['Convocado, presente e ausente', 'Convocado é quem foi chamado para a reunião. Presente é quem recebeu o check de presença na tela da reunião. Ausente NÃO é gravado: é a conta convocados − presentes, feita na hora — assim nunca fica ausência velha esquecida no banco.'],
      ['Convidado externo', 'Pessoa sem login no GERA (ex.: instrutor, líder de turma). Entra pelo nome na criação da reunião e ganha check de presença igual aos demais.'],
      ['Pauta', 'O texto do que será tratado. Pode ser escrito à mão ou gerado pelo botão "Gerar pauta automática", que monta o retrato honesto do momento: atrasadas por setor, setores abaixo da banda, gargalos, decisões abertas e aprovações pendentes. Setor sem nada vencido aparece como "em coleta" — a pauta não pune quem ainda não teve prazo vencendo.'],
      ['Itens sugeridos de pauta', 'Qualquer pessoa com permissão de escrita pode sugerir um item antes da reunião — o item entra com o nome de quem sugeriu.'],
      ['Ata / resumo (obrigatório)', 'O texto do que foi discutido e combinado. SEM ATA A REUNIÃO NÃO ENCERRA: o botão "Encerrar reunião" bloqueia se o resumo estiver vazio. Reunião encerrada fica travada; só um gestor pode reabrir.'],
      ['Atraso da reunião', 'Minutos entre a hora prevista e a hora em que alguém clicou "Iniciar reunião". Positivo = começou atrasada; negativo = adiantada. Sem hora prevista ou sem o clique de início, não há atraso a medir — o GERA não inventa.'],
      ['Decisão → atividade', 'Toda decisão pode virar uma atividade única com dono e prazo (botão "→ Atividade"). A atividade nasce com a etiqueta "Reunião" nas telas Hoje e Atividades — dá para rastrear de onde ela veio.'],
      ['Status da decisão', 'Calculado na hora, nunca gravado: EM ABERTO (sem atividade e não resolvida, ou atividade ainda no prazo) · RESOLVIDA NA REUNIÃO · FEITA / FEITA NO PRAZO / FEITA COM ATRASO (a atividade-filha foi concluída) · VENCIDA (a atividade-filha estourou o prazo e segue aberta). Na reunião seguinte, as decisões aparecem agrupadas por dono — é a prestação de contas pessoa a pessoa.'],
      ['Ação obrigatória (banda de aderência)', 'Regra inspirada na ISO: setor com aderência abaixo de 80% em 2 fotos do dia consecutivas ganha a etiqueta AÇÃO OBRIGATÓRIA na pauta — precisa sair da reunião com um plano. Uma foto abaixo = "atenção". Sem fotos suficientes, o GERA não acusa ninguém.'],
      ['Decisão 5W2H', 'Cada decisão agora carrega O QUÊ (o texto), COMO (o caminho combinado) e POR QUÊ (a razão), além de QUEM (dono) e QUANDO (prazo). COMO e POR QUÊ são opcionais — mas quando preenchidos vão junto para a ata, para a tabela e para a descrição da atividade criada da decisão.'],
      ['Tabela e CSV de decisões', 'No bloco de decisões dá para alternar entre Lista e Tabela (colunas O QUE · COMO · POR QUÊ · QUEM · QUANDO · STATUS · AVALIAÇÕES) e baixar um CSV — o mesmo formato da ata em planilha que a escola já usa, só que preenchido pelo sistema.'],
      ['Formulário de pauta', 'O "Gerar pauta automática" virou formulário com 4 seções: (1) indicadores vermelhos do recorte, já marcados — desmarque o que não entra; (2) sugestões vindas de outras reuniões para este destino; (3) rollforward, informativo; (4) itens livres. O recorte segue o tipo: reunião de departamento olha só o setor + subsetores; as demais olham a escola toda.'],

      ['Observações da atividade', 'Campo livre da atividade para anotações do andamento (combinados, contexto, o que aconteceu). Diferente da descrição, que diz o que a atividade É. Aparece no card da lista de Atividades.'],

  function boot(USER) {
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Glossário', user: USER }), app.firstChild);
    var body = document.getElementById('gl-body');

    var intro = document.createElement('div');
    intro.className = 'gl-intro';
    intro.textContent = 'Toda sigla e todo elemento do sistema, explicados em linguagem simples. O "i" ao lado de cada número nas telas mostra a CONTA; aqui você encontra o SIGNIFICADO.';
    body.appendChild(intro);

    var busca = UI.input({ placeholder: 'Buscar termo… (ex.: aderência, PED, delta)' });
    busca.classList.add('gl-search');
    body.appendChild(busca);

    var holder = document.createElement('div');
    body.appendChild(holder);

    function render(filtro) {
      holder.innerHTML = '';
      var f = (filtro || '').trim().toLowerCase();
      var achou = false;
      SECOES.forEach(function (sec) {
        var itens = sec[1].filter(function (it) {
          if (!f) { return true; }
          return (it[0] + ' ' + it[1]).toLowerCase().indexOf(f) >= 0;
        });
        if (!itens.length) { return; }
        achou = true;
        var card = document.createElement('div'); card.className = 'gl-sec';
        var t = document.createElement('div'); t.className = 'gl-sec-t'; t.textContent = sec[0];
        card.appendChild(t);
        itens.forEach(function (it) {
          var d = document.createElement('div'); d.className = 'gl-item';
          var a = document.createElement('div'); a.className = 'gl-term'; a.textContent = it[0];
          var b = document.createElement('div'); b.className = 'gl-def'; b.textContent = it[1];
          d.appendChild(a); d.appendChild(b);
          card.appendChild(d);
        });
        holder.appendChild(card);
      });
      if (!achou) {
        var n = document.createElement('div'); n.className = 'gl-none';
        n.textContent = 'Nenhum termo encontrado para "' + filtro + '". Sentiu falta de algo? Peça para incluir.';
        holder.appendChild(n);
      }
    }
    busca.addEventListener('input', function () { render(busca.value); });
    render('');
  }

  Guard.onReady(boot);
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
