<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Reuniões — GERA</title>

<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
<script src="mnav.js"></script>

<style>
/* ============================================================
   REUNIÕES · v2 (16/09/2026) — a reunião como ela acontece.
   Benchmark: EOS Level 10 (blocos com minutos, to-do feito/não feito,
   nota 1–10), Fellow (pendência rola até fechar), a ATA do Bruno
   (tabela de demandas: ação · quem · prevista · dias · status).
   Regras: zero filtro acima da dobra; "i" em todo número; tokens do
   theme.css (marca verde, claro e escuro); escala tipográfica só do
   theme.css; ES5.
   ============================================================ */
.rn-app{display:flex;min-height:100vh;background:var(--bg)}
.rn-app>.ui-side{position:sticky;top:0;height:100vh}
.rn-main{flex:1;min-width:0;display:flex;flex-direction:column}
.rn-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4) var(--sp-6);background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.rn-top h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.rn-top .sub{font-size:var(--fs-sm);font-weight:600;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rn-topactions{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}
.rn-mhead{display:none;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--s1);border-bottom:1px solid var(--border)}
.rn-mhead h1{font-size:var(--fs-xl);font-weight:800;margin:0}
.rn-wrap{padding:var(--sp-5) var(--sp-6) var(--sp-7);max-width:1100px}
.rn-sec{font-size:var(--fs-xs);font-weight:800;letter-spacing:.12em;color:var(--muted2);margin:var(--sp-5) 0 var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);text-transform:uppercase}
.rn-sec:first-child{margin-top:0}
.rn-sec .n{color:var(--muted)}
.rn-sec .rn-link{margin-left:auto;text-transform:none;letter-spacing:0}
.rn-i{width:18px;height:18px;border-radius:50%;border:1px solid var(--muted2);background:transparent;color:var(--muted2);font-size:9px;font-weight:800;line-height:1;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.rn-i:hover,.rn-i:focus-visible{color:var(--text);border-color:var(--brand);outline:none}
.rn-link{font-size:var(--fs-sm);font-weight:800;color:var(--accentText);text-decoration:none;background:transparent;border:0;cursor:pointer;font-family:inherit;padding:0}
.rn-link:hover{text-decoration:underline}
.rn-pill{font-size:var(--fs-xs);font-weight:800;padding:2px 8px;border-radius:6px;background:var(--chipBg);border:1px solid var(--border);white-space:nowrap;color:var(--muted)}
.rn-pill.ok{color:var(--greenText);border-color:var(--green)}
.rn-pill.warn{color:var(--bandaAlta,var(--orange));border-color:var(--orange)}
.rn-pill.bad{color:var(--red);border-color:var(--red)}
.rn-pill.doing{color:var(--doing);border-color:var(--doing)}
.rn-btn{border:1px solid var(--border);background:var(--s2);color:var(--text);font-family:inherit;font-weight:700;font-size:var(--fs-sm);padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px;text-decoration:none}
.rn-btn:hover{background:var(--s3)}
.rn-btn.p{background:var(--cta);color:var(--ctaText);border-color:transparent}
.rn-btn.p:hover{filter:brightness(1.05)}
.rn-btn.ok{color:var(--greenText);border-color:var(--green)}
.rn-btn.warn{color:var(--bandaAlta,var(--orange));border-color:var(--orange)}
.rn-btn.bad{color:var(--red);border-color:var(--red)}
.rn-btn.sm{padding:4px 9px;font-size:var(--fs-xs)}
.rn-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.rn-btn:disabled{opacity:.5;cursor:default}

/* nova reunião: uma linha, não um modal */
.rn-nova{display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:10px 12px;margin-bottom:var(--sp-4);box-shadow:var(--shadowSoft)}
.rn-nova .lb{font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;color:var(--muted2);text-transform:uppercase;margin-right:4px}
.rn-nova select,.rn-nova input{background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:var(--fs-sm);padding:7px 9px;min-width:0}
.rn-nova input[type=date]{width:150px}.rn-nova input[type=time]{width:96px}
.rn-nova .hint{font-size:var(--fs-xs);color:var(--muted2);flex-basis:100%}

/* herói: a de agora */
.rn-hero{background:var(--s1);border:1px solid var(--brand);border-radius:15px;padding:var(--sp-4) 18px;box-shadow:var(--shadowSoft);display:flex;gap:var(--sp-4);align-items:center;flex-wrap:wrap}
.rn-hero .tx{flex:1;min-width:240px}
.rn-hero .lab{display:inline-flex;font-size:var(--fs-xs);font-weight:800;color:var(--onBrand);background:var(--brand);border-radius:6px;padding:2px 8px;margin-bottom:8px;letter-spacing:.04em}
.rn-hero .ttl{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.01em;line-height:1.25}
.rn-hero .meta{font-size:var(--fs-sm);color:var(--muted);margin-top:4px}
.rn-hero .acts{display:flex;gap:8px;flex-wrap:wrap}
.rn-hero.warn{border-color:var(--orange)}
.rn-hero.warn .lab{background:var(--orange);color:var(--onOrange)}

/* placar (6 números) */
.rn-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:var(--sp-3)}
.rn-kpi{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadowSoft);min-width:0}
.rn-kpi .lab{font-size:var(--fs-xs);font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.rn-kpi .val{font-size:var(--fs-display);font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.rn-kpi .sub{font-size:var(--fs-xs);font-weight:700;color:var(--muted2);margin-top:5px}
.rn-kpi.t-green .val{color:var(--green)} .rn-kpi.t-red .val{color:var(--red)} .rn-kpi.t-amber .val{color:var(--amber)} .rn-kpi.t-blue .val{color:var(--accentText)} .rn-kpi.t-flat .val{color:var(--muted)}
.rn-kpi[role=button]{cursor:pointer}.rn-kpi[role=button]:hover{box-shadow:var(--elev-2)}

/* tabela de demandas (a ATA) */
.rn-tbl{background:var(--s1);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadowSoft);overflow:hidden}
.rn-tr{display:grid;grid-template-columns:minmax(220px,2.2fr) 1.1fr .9fr .8fr .7fr 1fr auto;gap:10px;align-items:center;padding:9px 14px;border-top:1px solid var(--border);font-size:var(--fs-sm)}
.rn-tr:first-child{border-top:0}
.rn-tr.hd{font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);background:var(--s2)}
.rn-tr .t{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.rn-tr .t small{display:block;font-weight:600;color:var(--muted2);font-size:var(--fs-xs);white-space:normal}
.rn-tr .num{font-variant-numeric:tabular-nums}
.rn-tr .dias.bad{color:var(--red);font-weight:800}
.rn-tr .dias.ok{color:var(--muted)}
.rn-tr .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end}
.rn-tr.done{opacity:.55}

/* lista de reuniões */
.rn-row{display:flex;align-items:center;gap:var(--sp-3);background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:10px 14px;margin-bottom:7px;box-shadow:var(--shadowSoft);cursor:pointer;transition:box-shadow .15s,transform .15s;text-align:left;width:100%;font-family:inherit;color:var(--text)}
.rn-row:hover{box-shadow:var(--elev-2);transform:translateY(-1px)}
.rn-row:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.rn-row .dt{width:64px;flex:none;text-align:center}
.rn-row .dt b{display:block;font-size:var(--fs-lg);font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.rn-row .dt span{font-size:var(--fs-xs);color:var(--muted2);font-weight:700;text-transform:uppercase;letter-spacing:.06em}
.rn-row .tt{flex:1;min-width:0}
.rn-row .tt .t{font-size:var(--fs-base);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn-row .tt .m{font-size:var(--fs-xs);color:var(--muted2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn-row .side{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.rn-toggle{display:inline-flex;background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:3px;margin-left:auto}
.rn-toggle button{border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:var(--fs-xs);padding:4px 10px;border-radius:7px;cursor:pointer;text-transform:none;letter-spacing:0}
.rn-toggle button.on{background:var(--s1);color:var(--text);box-shadow:var(--shadowPill)}

/* condução: trilho + conteúdo */
.rn-cond{display:grid;grid-template-columns:250px minmax(0,1fr);gap:var(--sp-4);align-items:start}
.rn-rail{position:sticky;top:76px;background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:8px;box-shadow:var(--shadowSoft)}
.rn-rail .tot{display:flex;align-items:baseline;justify-content:space-between;padding:6px 8px 8px;border-bottom:1px solid var(--border);margin-bottom:6px}
.rn-rail .tot b{font-size:var(--fs-lg);font-variant-numeric:tabular-nums}
.rn-rail .tot span{font-size:var(--fs-xs);color:var(--muted2);font-weight:700}
.rn-rail .tot b.over{color:var(--red)}
.rn-blk{display:flex;align-items:center;gap:8px;width:100%;border:0;background:transparent;color:var(--muted);font-family:inherit;font-weight:700;font-size:var(--fs-sm);padding:8px 8px;border-radius:9px;cursor:pointer;text-align:left}
.rn-blk .n{width:20px;height:20px;border-radius:50%;border:1px solid var(--border);display:inline-flex;align-items:center;justify-content:center;font-size:10px;flex:none}
.rn-blk .r{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn-blk .mn{font-size:var(--fs-xs);color:var(--muted2);font-variant-numeric:tabular-nums;white-space:nowrap}
.rn-blk.on{background:var(--activeBg);color:var(--text)}
.rn-blk.on .n{background:var(--brand);color:var(--onBrand);border-color:transparent}
.rn-blk.done .n{background:var(--s3);color:var(--muted2)}
.rn-blk .mn.over{color:var(--red);font-weight:800}
.rn-blk:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.rn-nav{display:flex;gap:6px;padding:8px 4px 2px;justify-content:space-between}
.rn-card{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:var(--sp-4) 18px;box-shadow:var(--shadowSoft)}
.rn-card .h{display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.rn-card .h .t{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.01em}
.rn-card .h .mn{font-size:var(--fs-xs);color:var(--muted2);font-weight:700}
.rn-card .h .sp{margin-left:auto;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.rn-donos{font-size:var(--fs-xs);color:var(--muted2);margin:-6px 0 10px}
.rn-item{display:flex;align-items:flex-start;gap:10px;padding:9px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.rn-item:first-of-type{border-top:0}
.rn-item .tx{flex:1 1 200px;min-width:0;font-size:var(--fs-base);font-weight:600;line-height:1.35}
.rn-item .tx small{display:block;color:var(--muted2);font-size:var(--fs-xs);font-weight:600;margin-top:2px}
.rn-item .acts{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;flex:none}
.rn-item.done .tx{text-decoration:line-through;opacity:.6}
.rn-tri{display:inline-flex;gap:3px;flex:none}
.rn-tri button{width:30px;height:28px;border:1px solid var(--border);background:var(--s2);border-radius:7px;cursor:pointer;font-size:13px;line-height:1;font-family:inherit;color:var(--muted)}
.rn-tri button.on-ok{background:var(--haloGreen);border-color:var(--green)}
.rn-tri button.on-atencao{background:var(--haloAmber);border-color:var(--amber)}
.rn-tri button.on-fora{background:var(--haloRed);border-color:var(--red)}
.rn-add{display:flex;gap:8px;margin-top:10px;align-items:center}
.rn-add input{flex:1;background:var(--s2);border:1px solid var(--border);border-radius:9px;color:var(--text);font-family:inherit;font-size:var(--fs-sm);padding:8px 10px;min-width:0}
.rn-add input:focus{outline:2px solid var(--brand);outline-offset:1px;border-color:transparent}
.rn-form{display:grid;grid-template-columns:2fr 1.2fr 1fr 1fr auto;gap:8px;align-items:end;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:10px;margin:8px 0 4px;width:100%;flex-basis:100%}
.rn-form label{display:flex;flex-direction:column;gap:4px;font-size:var(--fs-xs);font-weight:800;color:var(--muted2);letter-spacing:.04em;text-transform:uppercase;min-width:0}
.rn-form input,.rn-form select{background:var(--s1);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:var(--fs-sm);padding:7px 9px;min-width:0;text-transform:none;letter-spacing:0;font-weight:600}
.rn-pres{display:grid;grid-template-columns:repeat(2,1fr);gap:6px 14px}
.rn-pes{display:flex;align-items:center;gap:8px;padding:6px 0;border-top:1px solid var(--border);font-size:var(--fs-sm)}
.rn-pes label{display:flex;align-items:center;gap:8px;cursor:pointer;flex:1;min-width:0}
.rn-pes input{width:18px;height:18px;accent-color:var(--brand)}
.rn-pes .nm{font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.rn-bar{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:9px}
.rn-bar .nm{width:190px;flex:none;font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.rn-bar .nm .d{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.rn-bar .track{flex:1;height:14px;border-radius:8px;background:var(--track);overflow:hidden;position:relative}
.rn-bar .track>span{display:block;height:100%;border-radius:8px;background:var(--sc)}
.rn-bar .track>i{position:absolute;top:-2px;bottom:-2px;width:2px;background:var(--text);opacity:.7;left:90%}
.rn-bar .vv{width:210px;flex:none;text-align:right;font-size:var(--fs-xs);font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;justify-content:flex-end;gap:6px;align-items:center}
.rn-bar .vv b{color:var(--text);font-variant-numeric:tabular-nums}
.rn-nota{display:flex;gap:5px;flex-wrap:wrap;margin:8px 0}
.rn-nota button{width:36px;height:34px;border:1px solid var(--border);background:var(--s2);color:var(--text);border-radius:8px;font-family:inherit;font-weight:800;cursor:pointer}
.rn-nota button.on{background:var(--brand);color:var(--onBrand);border-color:transparent}
.rn-ata{white-space:pre-wrap;font-size:var(--fs-sm);line-height:1.55;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:12px 14px;max-height:360px;overflow:auto;font-family:inherit}
.rn-ez{background:var(--s1);border:1px dashed var(--border);border-radius:13px;padding:16px 18px}
.rn-ez .tt{font-size:var(--fs-base);font-weight:800;margin-bottom:4px}
.rn-ez .ds{font-size:var(--fs-sm);color:var(--muted);line-height:1.5;max-width:66ch}
.rn-state{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:280px;padding:40px 20px}
.rn-state-t{font-size:var(--fs-lg);font-weight:800}
.rn-state-s{font-size:var(--fs-base);color:var(--muted);max-width:460px;line-height:1.5}
.rn-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--s1);border:1px solid var(--border);color:var(--text);font-size:var(--fs-base);font-weight:600;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--elev-3)}
.rn-toast.err{border-color:var(--red);color:var(--red)}
.rn-info-k{font-size:var(--fs-xs);font-weight:800;color:var(--muted2);letter-spacing:.08em;margin-top:10px}
.rn-info-v{font-size:var(--fs-base);line-height:1.5}
.rn-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;font-size:var(--fs-sm);font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--elev-2)}
.rn-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}
@media (min-width:901px){html body .rn-dev{display:none}}
@media (max-width:1100px){.rn-kpis{grid-template-columns:repeat(3,1fr)}.rn-form{grid-template-columns:1fr 1fr}.rn-bar .vv{width:150px}}
@media (max-width:900px){
  .rn-app>.ui-side{display:none}.rn-top{display:none}.rn-mhead{display:flex}
  .rn-wrap{padding:var(--sp-4) var(--sp-4) 110px}
  .rn-cond{grid-template-columns:1fr}
  .rn-rail{position:static;display:flex;flex-wrap:nowrap;overflow-x:auto;gap:4px;padding:6px}
  .rn-rail .tot{border:0;margin:0;padding:6px;flex:none}
  .rn-blk{width:auto;flex:none}.rn-blk .r{max-width:140px}
  .rn-nav{display:none}
  .rn-tr{grid-template-columns:1fr 1fr;padding:10px 12px}.rn-tr.hd{display:none}.rn-tr .t{grid-column:span 2;white-space:normal}.rn-tr .acts{grid-column:span 2;justify-content:flex-start}
  .rn-pres{grid-template-columns:1fr}.rn-bar .nm{width:110px}.rn-bar .vv{width:120px}
  .rn-row .tt .t,.rn-row .tt .m{white-space:normal}
  .rn-dev{bottom:94px}
}
@media (max-width:560px){.rn-kpis{grid-template-columns:1fr 1fr}.rn-form{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.rn-row{transition:none}}
</style>
</head>
<body>

  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="rn-dev" data-theme-toggle type="button" title="Alternar tema claro/escuro"><span class="pin"></span>Tema</button>

  <div class="rn-app" id="app">
    <main class="rn-main">
      <div class="rn-top">
        <div><h1 id="rn-title">Reuniões</h1><div class="sub" id="rn-sub"></div></div>
        <div class="rn-topactions" id="rn-actions"></div>
      </div>
      <div class="rn-mhead"><div><h1 id="rn-mtitle">Reuniões</h1></div><span id="rn-mav"></span></div>
      <div class="rn-wrap">
        <div class="rn-state" id="rn-state"></div>
        <div id="rn-body"></div>
      </div>
    </main>
  </div>

  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="pautas-modelo.js"></script>
  <script src="reunioes-motor.js"></script>
  <script src="kpi.js"></script>
  <script src="conclusao.js"></script>
  <script src="app-version.js"></script>
  <script>
  (function () {
  'use strict';
  var R = window.GrautRecorrencia, M = window.ReunioesMotor;
  var USER = null, REUN = [], USERS = [], SUGS = [], PENDS = [], PLANOS = [], CTX = null;
  var OLD_OCC = null;              /* ocorrências resolvidas das únicas ANTIGAS (fora da janela) */
  var ABERTA = null;               /* id da reunião aberta na condução */
  var BLOCO = 0;                   /* índice do bloco atual */
  var CLOCK = { relogio: null, inicioBloco: null, gastoBloco: {} };
  var LISTA_QUANDO = 'proximas';
  var TIPOS_REUNIAO = [

    if (b.modelo) { if (b.modelo.pauta) { var pt = txt('div', 'rn-info-v', b.modelo.pauta); pt.style.cssText = 'margin-bottom:6px'; box.appendChild(pt); } if (b.modelo.saida) { var sd = txt('div', 'rn-info-v', 'Saída esperada: ' + b.modelo.saida); sd.style.cssText = 'color:var(--accentText);font-size:var(--fs-sm);font-weight:700;margin-bottom:10px'; box.appendChild(sd); } }
    var itens = itensDoBloco(r, chave);
    var sugs = chave === 'assunto' ? SUGS.filter(function (g) { return (g.destinoTipo || null) === (r.tipo || null) && (g.destinoSetorSigla || null) === (r.setorSigla || null); }) : [];
    if (chave === 'assunto') {
      var lead = txt('div', 'rn-info-v', ''); lead.style.cssText = 'color:var(--muted);font-size:var(--fs-sm);margin-bottom:8px';
      lead.appendChild(document.createTextNode('Resolver os 3 mais importantes primeiro (IDS). Cada assunto sai daqui como demanda com dono e prazo, resolvido, ou adiado para a próxima. '));
      lead.appendChild(infoBtn('Assuntos', { formula: 'itens de pauta desta reunião (qualquer convocado adiciona) + sugestões encaminhadas de outras reuniões + o que virou assunto nos blocos anteriores. "Nª vez" = quantas reuniões já rolou; na 3ª deixa de ser lembrete.', dados: 'reunioes.pautaItens[] + pauta_sugestoes pendentes para este tipo/setor.', numeros: itens.length + ' assunto(s) · ' + sugs.length + ' sugestão(ões)', serve: 'nada sai da reunião sem dono, prazo ou destino.' }));
      box.appendChild(lead);
      if (PENDS.length && CAN_WRITE()) { var pd = txt('div', 'rn-info-v', PENDS.length + ' pedido(s) de adiamento aguardam decisão — em Atividades.'); pd.style.cssText = 'color:var(--bandaAlta,var(--orange));font-size:var(--fs-sm);margin-bottom:8px'; box.appendChild(pd); }
    }
    if (!itens.length && !sugs.length) { box.appendChild(vazio('Nenhum assunto ainda', 'Adicione na linha abaixo, ou use "→ assunto" nos blocos anteriores.')); }
    itens.forEach(function (x) { box.appendChild(linhaAssunto(r, x.it, x.i, podeEditar)); });
    sugs.forEach(function (g) {
      var row = el('<div class="rn-item"></div>');
      var tx = el('<div class="tx"></div>'); tx.appendChild(document.createTextNode(g.texto || '(sem texto)')); tx.appendChild(txt('small', '', 'sugerido de outra reunião' + (g.criadoEm ? ' há ' + R.diasEntre(R.toISO(new Date(Number(g.criadoEm))), hojeISO()) + ' dia(s)' : ''))); row.appendChild(tx);
      var ac = el('<div class="acts"></div>');
      if (podeEditar) {
        ac.appendChild(btn('Aceitar', 'ok sm', function () { viraAssunto(r, g.texto, { sugestaoId: g.id }).then(function () { return Store.atualizarSugestaoPauta(g.id, { status: 'aceita', reuniaoId: r.id }, 'aceitar_pauta_sugestao'); }).then(function () { SUGS = SUGS.filter(function (s) { return s.id !== g.id; }); renderReuniao(); }).catch(function (e) { toast(e.message, 'err'); }); }));
        ac.appendChild(btn('Descartar', 'sm', function () { Store.atualizarSugestaoPauta(g.id, { status: 'descartada' }, 'descartar_pauta_sugestao').then(function () { SUGS = SUGS.filter(function (s) { return s.id !== g.id; }); renderReuniao(); }).catch(function (e) { toast(e.message, 'err'); }); }));
      }
      row.appendChild(ac); box.appendChild(row);
    });
    if (!r.encerradaEm) { box.appendChild(linhaAdicionar(r, chave)); }
    return box;
  }
  function linhaAdicionar(r, chave) {
    var add = el('<div class="rn-add"></div>'); var inp = el('<input type="text" placeholder="Adicionar assunto — uma linha, o que precisa ser decidido" aria-label="Novo assunto">');
    var b = btn('Adicionar', 'p sm', function () {
      var t = inp.value.trim(); if (t.length < 3) { toast('Escreva o assunto.', 'err'); return; }
      var novo = (r.pautaItens || []).concat([{ texto: t, uid: USER.uid, nome: USER.name || USER.nome || '', secao: chave, status: 'aberta', semanasRolando: 0, em: Date.now() }]);
      Store.atualizarReuniao(r.id, { pautaItens: novo }, 'pauta_item_adicionado').then(function () { r.pautaItens = novo; inp.value = ''; renderReuniao(); }).catch(function (e) { toast(e.message, 'err'); });
    });
    inp.addEventListener('keydown', function (ev) { if (ev.key === 'Enter') { ev.preventDefault(); b.click(); } });

  }
  function linhaAssunto(r, it, idx, podeEditar) {
    var row = el('<div class="rn-item"></div>');
    var tx = el('<div class="tx"></div>'); tx.appendChild(document.createTextNode(it.texto || '(sem texto)'));
    var meta = []; if (it.nome) { meta.push(primeiroNome(it.nome)); } if (it.semanasRolando) { meta.push((it.semanasRolando + 1) + 'ª vez'); } if (it.viraAssunto) { meta.push('parou de ser lembrete: resolver a causa'); }

    row.appendChild(tx);
    var ac = el('<div class="acts"></div>');
    if (podeEditar) {
      ac.appendChild(btn('Decidir', 'p sm', function () { if (row.querySelector('.rn-form')) { return; } row.appendChild(formDecidir(r, it.texto, function () { return marcarItem(r, idx, 'resolvida', true); })); }));
      ac.appendChild(btn('Resolvido', 'ok sm', function () { marcarItem(r, idx, 'resolvida'); }));
      ac.appendChild(btn('Próxima', 'sm', function () { marcarItem(r, idx, 'aberta'); toast('Fica aberto e rola para a próxima reunião.'); }));
    } else if (it.uid === USER.uid && !r.encerradaEm) { ac.appendChild(btn('Remover', 'sm', function () { var novo = (r.pautaItens || []).filter(function (_, i) { return i !== idx; }); Store.atualizarReuniao(r.id, { pautaItens: novo }, 'pauta_item_removido').then(function () { r.pautaItens = novo; renderReuniao(); }).catch(function (e) { toast(e.message, 'err'); }); })); }
    row.appendChild(ac);
    return row;
  }
  function marcarItem(r, idx, status, semRepintar) {
    var novo = (r.pautaItens || []).map(function (it, i) { return i === idx ? Object.assign({}, it, { status: status, tratadoEm: Date.now() }) : it; });
    return Store.atualizarReuniao(r.id, { pautaItens: novo }, 'pauta_item_' + status).then(function () { r.pautaItens = novo; if (!semRepintar) { renderReuniao(); } }).catch(function (e) { toast(e.message, 'err'); });
  }
  /* decidir = demanda com dono, prazo e setor → vira atividade única na hora */
  function formDecidir(r, textoIni, depois) {
    var f = el('<div class="rn-form"></div>');
    var oq = el('<label>O quê<input type="text"></label>'); oq.querySelector('input').value = textoIni || '';
    var qm = el('<label>Quem<select></select></label>'); var sel = qm.querySelector('select'); USERS.forEach(function (u) { var o = document.createElement('option'); o.value = u.uid; o.textContent = u.nome; if (u.uid === USER.uid) { o.selected = true; } sel.appendChild(o); });
    var pz = el('<label>Prazo<input type="date"></label>'); pz.querySelector('input').value = R.addDias(hojeISO(), 7);
    var st = el('<label>Setor<select></select></label>'); var ssel = st.querySelector('select'); (CTX.setores || []).filter(function (s) { return s.ativo !== false; }).forEach(function (s) { var o = document.createElement('option'); o.value = s.sigla; o.textContent = s.sigla; ssel.appendChild(o); });
    function setorDoDono() { var u = USERS.filter(function (x) { return x.uid === sel.value; })[0]; var sig = u && (u.setor || (u.setoresLiderados || [])[0]); if (sig) { ssel.value = sig; } }
    sel.addEventListener('change', setorDoDono); setorDoDono();
    var go = btn('Criar demanda', 'p', function () {
      var t = oq.querySelector('input').value.trim(), prazo = pz.querySelector('input').value;
      if (t.length < 3) { toast('Escreva o que foi decidido.', 'err'); return; } if (!R.isISO(prazo)) { toast('Informe o prazo.', 'err'); return; }
      var dono = sel.value || USER.uid, dec = { texto: t, comoTexto: null, porqueTexto: null, donoUid: dono, donoNome: nomeUser(dono) || USER.name, prazo: prazo, atividadeId: null, aberta: true, atualizacoes: [], em: Date.now() };
      go.disabled = true;
      Store.criarAtividadeDeDecisao(dec, r, ssel.value).then(function (atId) { dec.atividadeId = atId; dec.aberta = false; return salvarDecisoes(r, (r.decisoes || []).concat([dec]), 'criar_decisao'); })
        .then(function () { toast('Demanda criada: ' + primeiroNome(dec.donoNome) + ' até ' + fmtBR(prazo) + '. Já está na agenda da pessoa.'); return depois ? depois() : null; })
        /* a atividade nova precisa entrar no quadro para o status da demanda sair certo ("em aberto", não "fora da janela") */
        .then(function () { return reload(true); })
        .catch(function (e) { go.disabled = false; toast(e.message, 'err'); });
    });
    f.appendChild(oq); f.appendChild(qm); f.appendChild(pz); f.appendChild(st); f.appendChild(go);
    setTimeout(function () { oq.querySelector('input').focus(); }, 30);
    return f;
  }

  /* 6 · bloco temático da Integrada: checklist ✅ ⚠️ ❌ + assuntos do tema */
  function blocoTema(r, b, podeEditar) {
    var box = el('<div></div>'), perguntas = motorTem('perguntasDe') ? M.perguntasDe(r.tipo, b.chave) : [];
    var marks = (r.checklist || {})[b.chave] || {};
    var lead = txt('div', 'rn-info-v', ''); lead.style.cssText = 'color:var(--muted);font-size:var(--fs-sm);margin-bottom:8px';
    lead.appendChild(document.createTextNode('Marque cada pergunta: ✅ na meta · ⚠️ atenção · ❌ fora da meta. Fora da meta vira demanda com dono e prazo. '));
    lead.appendChild(infoBtn(b.rotulo, { formula: 'perguntas do checklist da Reunião Integrada para este tema (metas incluídas). As marcas ficam gravadas na reunião (checklist).', dados: '00-CHECKLIST-REUNIAO-INTEGRADA.md → reunioes-motor.js.', numeros: Object.keys(marks).length + ' de ' + perguntas.length + ' marcada(s)', serve: 'o roteiro é fixo; o que muda é a resposta da semana.' }));
    box.appendChild(lead);
    perguntas.forEach(function (q, i) {
      var row = el('<div class="rn-item"></div>');
      var tri = el('<span class="rn-tri" role="group" aria-label="Situação"></span>');
      [['ok', '✅'], ['atencao', '⚠️'], ['fora', '❌']].forEach(function (o) {
        var bt = el('<button type="button" title="' + (o[0] === 'ok' ? 'Na meta' : (o[0] === 'atencao' ? 'Atenção' : 'Fora da meta')) + '"' + (marks[i] === o[0] ? ' class="on-' + o[0] + '"' : '') + '>' + o[1] + '</button>');
        bt.disabled = !podeEditar;
        bt.addEventListener('click', function () {
          var ck = {}; Object.keys(r.checklist || {}).forEach(function (k) { ck[k] = Object.assign({}, r.checklist[k]); }); ck[b.chave] = ck[b.chave] || {}; ck[b.chave][i] = marks[i] === o[0] ? null : o[0];
          Store.atualizarReuniao(r.id, { checklist: ck }, 'checklist_marcado').then(function () { r.checklist = ck; renderReuniao(); if (ck[b.chave][i] === 'fora') { toast('Fora da meta — registre a ação com dono e prazo.'); } }).catch(function (e) { toast(e.message, 'err'); });
        });
        tri.appendChild(bt);
      });
      row.appendChild(tri);
      var tx = el('<div class="tx"></div>'); tx.appendChild(document.createTextNode(q)); row.appendChild(tx);
      var ac = el('<div class="acts"></div>');
      if (podeEditar && (marks[i] === 'fora' || marks[i] === 'atencao')) { ac.appendChild(btn('Decidir', 'p sm', function () { if (row.querySelector('.rn-form')) { return; } row.appendChild(formDecidir(r, q, null)); })); }
      row.appendChild(ac); box.appendChild(row);
    });
    var itens = itensDoBloco(r, b.chave);
    if (itens.length) { box.appendChild(secao('Assuntos deste tema', null, itens.length)); itens.forEach(function (x) { box.appendChild(linhaAssunto(r, x.it, x.i, podeEditar)); }); }
    if (!r.encerradaEm) { box.appendChild(linhaAdicionar(r, b.chave)); }
    return box;
  }

  /* 7 · fechamento: recap, nota, ata, encerrar */
  function blocoFechamento(r, hoje, podeEditar) {
    var box = el('<div></div>');
    var dec = r.decisoes || [];
    box.appendChild(secao('Demandas desta reunião', null, dec.length));
    if (!dec.length) { box.appendChild(vazio('Nenhuma demanda criada', 'Use "Decidir" nos assuntos — cada decisão nasce com dono e prazo e vai para a agenda da pessoa.')); }
    dec.forEach(function (d) { var row = el('<div class="rn-item"></div>'); var tx = el('<div class="tx"></div>'); tx.appendChild(document.createTextNode(d.texto)); tx.appendChild(txt('small', '', (d.donoNome || nomeUser(d.donoUid) || '—') + ' · até ' + fmtBR(d.prazo) + ' · ' + statusDe(d).rotulo)); row.appendChild(tx); box.appendChild(row); });
    var rl = rolados(r), semTrato = rl.filter(function (it) { return !entryDaReuniao(it.dec, r.id); });
    if (semTrato.length && !r.encerradaEm) { var av = txt('div', 'rn-info-v', semTrato.length + ' pendência(s) da anterior sem tratamento (Feito / Não feito / Assunto) — a reunião não fecha assim. Volte ao bloco "O que ficou da anterior".'); av.style.cssText = 'color:var(--bandaAlta,var(--orange));font-size:var(--fs-sm);margin:10px 0'; box.appendChild(av); }

    /* nota 1–10 (Level 10) */
    box.appendChild(secao('Nota da reunião', { formula: 'cada participante com escrita dá nota de 1 a 10; abaixo de 8 diz o que faria ser 10. A ata registra a média.', dados: 'reunioes.notas[uid].', numeros: (function () { var m = motorTem('mediaNotas') ? M.mediaNotas(r.notas) : null; return m && m.responderam ? 'média ' + m.media + ' (' + m.responderam + ')' : 'ninguém deu nota ainda'; }()), serve: 'a nota baixa repetida é o sinal de que a reunião precisa mudar de formato.' }));
    var minha = ((r.notas || {})[USER.uid] || {});
    if (CAN_WRITE()) {
      var nb = el('<div class="rn-nota" role="group" aria-label="Nota"></div>'), sug = el('<input type="text" class="ui-input" placeholder="O que faria ser 10? (obrigatório abaixo de 8)" style="width:100%;margin-top:4px">'); sug.value = minha.sugestao || '';
      for (var n = 1; n <= 10; n++) { (function (v) { var bt = el('<button type="button"' + (Number(minha.nota) === v ? ' class="on"' : '') + '>' + v + '</button>'); bt.disabled = !!r.encerradaEm; bt.addEventListener('click', function () { var val = motorTem('validarNota') ? M.validarNota(v, sug.value) : { ok: true }; if (!val.ok) { toast(val.erro, 'err'); return; } var notas = {}; Object.keys(r.notas || {}).forEach(function (k) { notas[k] = r.notas[k]; }); notas[USER.uid] = { nota: v, sugestao: sug.value.trim(), em: Date.now() }; var media = motorTem('mediaNotas') ? M.mediaNotas(notas).media : v; Store.atualizarReuniao(r.id, { notas: notas, notaReuniao: media }, 'nota_reuniao').then(function () { r.notas = notas; r.notaReuniao = media; toast('Nota ' + v + ' registrada.'); renderReuniao(); }).catch(function (e) { toast(e.message, 'err'); }); }); nb.appendChild(bt); }(n)); }
      box.appendChild(nb); box.appendChild(sug);
    } else { var mN = motorTem('mediaNotas') ? M.mediaNotas(r.notas) : null; box.appendChild(txt('div', 'rn-info-v', mN && mN.responderam ? 'Média ' + mN.media + ' (' + mN.responderam + ' resposta(s)).' : 'A nota é dada por quem conduz e pelos líderes.')); }

    /* ata */
    box.appendChild(secao(r.encerradaEm ? 'Ata' : 'Ata (prévia — sai pronta ao encerrar)', null, null, (function () { var a = el('<button type="button" class="rn-link">Copiar →</button>'); a.addEventListener('click', function () { copiarTexto(r.encerradaEm ? (r.resumoTexto || textoAta(r)) : textoAta(r), 'Ata copiada.'); }); return a; }())));
    var pre = el('<div class="rn-ata"></div>'); pre.textContent = r.encerradaEm ? (r.resumoTexto || textoAta(r)) : textoAta(r); box.appendChild(pre);
    var envio = el('<div style="display:flex;gap:8px;flex-wrap:wrap;margin-top:8px"></div>');
    envio.appendChild(btn('WhatsApp', '', function () { window.open('https://wa.me/?text=' + encodeURIComponent(r.encerradaEm ? (r.resumoTexto || textoAta(r)) : textoAta(r)), '_blank'); }));
    if (podeEditar) {
      var enc = btn('Encerrar reunião e registrar a ata', 'p', function () {
        if (semTrato.length) { toast(semTrato.length + ' pendência(s) da anterior sem tratamento — registre Feito / Não feito / Assunto.', 'err'); return; }
        var ata = textoAta(r), patch = { resumoTexto: ata, encerradaEm: Date.now() };
        if (motorTem('mediaNotas')) { var mm = M.mediaNotas(r.notas); if (mm.responderam) { patch.notaReuniao = mm.media; } }
        enc.disabled = true;
        Store.atualizarReuniao(r.id, patch, 'reuniao_encerrada').then(function () {
          Object.assign(r, patch); pararRelogio(); toast('Reunião encerrada — ata registrada.');
          return criarProximaInstancia(r).catch(function (e2) { toast('Encerrada, mas a próxima da série não foi criada: ' + e2.message, 'err'); });
        }).then(function () { renderReuniao(); }).catch(function (e) { enc.disabled = false; toast(e.message, 'err'); });
      });
      envio.appendChild(enc);
    }
    box.appendChild(envio);
    return box;
  }
  function criarProximaInstancia(r) {
    if (!motorTem('proximaData')) { return Promise.resolve(); }
    var prox = M.proximaData(r.tipo, r.data); if (!prox) { return Promise.resolve(); }

    return Store.criarReuniao(doc).then(function () { toast('Próxima ' + (TIPO_LABEL[r.tipo] || 'reunião') + ' criada para ' + fmtBR(prox) + (rolados2.length ? ' com ' + rolados2.length + ' assunto(s) que rolaram.' : '.')); return reload(true); });
  }

  /* ---------- carga ---------- */
  function rerender() { if (ABERTA) { renderReuniao(); } else { renderLista(); } }
  function reload(manterAberta) {
    if (!manterAberta) { setState('Carregando as reuniões…', 'Lendo reuniões, atividades e pessoas.'); }
    return Promise.all([KPI.carregar('band'), Store.listReunioes(), Store.listUsuariosAtivos(), Store.listSolicPendentes(), Store.listSugestoesPauta(), Store.listPlanosVivos()]).then(function (r) {
      CTX = r[0]; USERS = r[2] || []; REUN = (r[1] || []).filter(visivelReuniao); PENDS = r[3] || []; SUGS = (r[4] || []).filter(function (g) { return g.status === 'pendente'; }); PLANOS = r[5] || [];
      OLD_OCC = null;
      return varrerAntigas();
    }).then(function () { rerender(); }).catch(function (e) { setState('Não consegui carregar as reuniões.', (e && e.message) || 'Erro ao ler o banco.'); });
  }
  Guard.onReady(function (u) {
    USER = u;
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Reuniões', user: USER }), app.firstChild);
    document.getElementById('rn-mav').appendChild(UI.avatar({ initials: USER.initials, size: 40 }));
    var m = String(location.search || '').match(/[?&]r=([^&]+)/);
    if (m) { ABERTA = decodeURIComponent(m[1]); }
    /* ?bloco=N abre direto no bloco (o Hoje manda "Fechar ata" para o fechamento; 'fim' = último) */
    var mb = String(location.search || '').match(/[?&]bloco=(\d+|fim)/);
    if (mb) { BLOCO = mb[1] === 'fim' ? 99 : Math.max(0, parseInt(mb[1], 10) - 1); }
    reload();
  });
  }());
