    pt0.appendChild(txt('div', 'pj-card-t', 'Ciclo de decisões'));
    pt0.appendChild(iBtn('Como o status é calculado', [
      ['Fórmula', 'Cada decisão de cada reunião ativa: EM ABERTO = sem atividade e não resolvida, ou atividade ainda no prazo · VENCIDA = atividade com prazo estourado em aberto · CONCLUÍDA = resolvida na reunião, ou atividade feita (no prazo ou com atraso).'],
      ['Dados', 'reunioes.decisoes[] + ocorrência da atividade-filha no board (kpi.js, janela padrão). Status derivado na hora — nunca gravado.']
    ]));
    ph0.appendChild(pt0);
    painel.appendChild(ph0);
    var pgrid = el('<div class="pj-dgrid"></div>');
    [['Decisões em aberto', cAb, 'var(--orange)'], ['Decisões vencidas', cVc, 'var(--red)'], ['Decisões concluídas', cCc, 'var(--green)']].forEach(function (kk) {
      var dm = el('<div class="pj-dm"></div>');
      dm.appendChild(txt('div', 'pj-dm-k', kk[0]));
      var vEl = txt('div', 'pj-dm-v', String(kk[1]));
      vEl.style.color = kk[2];
      dm.appendChild(vEl);
      pgrid.appendChild(dm);
    });
    painel.appendChild(pgrid);
    bodyEl.appendChild(painel);

    /* botão de pauta */
    var pcard = el('<div class="pj-card"></div>');
    var ph = el('<div class="pj-card-h"></div>');
    var pt = el('<div style="display:flex;align-items:center;gap:8px"></div>');
    pt.appendChild(txt('div', 'pj-card-t', 'Pauta da reunião de líderes'));
    pt.appendChild(iBtn('O que entra na pauta', [
      ['Conteúdo', 'Atrasadas por setor + setores abaixo da banda (só com previsto VENCIDO; 2 períodos consecutivos = ação obrigatória) + gargalos nomeados (score 50/30/20) + decisões ABERTAS + solicitações de data PENDENTES. Siglas fora do cadastro ativo são ignoradas e listadas no rodapé.'],
      ['Uso', 'Gere, copie e cole onde a reunião acontece — ou grave direto numa reunião aberta (modelo L10/EOS: métricas → pendências → ações).']
    ]));
    ph.appendChild(pt);
    var gen = UI.button({ label: 'Gerar pauta', icon: 'check' });
    gen.addEventListener('click', function () { modalPauta(null); });
    ph.appendChild(gen);
    pcard.appendChild(ph);
    pcard.appendChild(txt('div', 'pj-empty2', 'Texto pronto com atrasadas por setor, banda de aderência, gargalos, decisões abertas e aprovações pendentes.'));
    bodyEl.appendChild(pcard);

    /* F1-F · B4 — sugestões de pauta PENDENTES (cascata) com idade + descarte em lote */
    if (SUGS.length) {
      var scard = el('<div class="pj-card"></div>');
      var sh = el('<div class="pj-card-h"></div>');
      var st0 = el('<div style="display:flex;align-items:center;gap:8px"></div>');
      st0.appendChild(txt('div', 'pj-card-t', 'Sugestões de pauta pendentes (' + SUGS.length + ')'));
      st0.appendChild(iBtn('Cascata de pauta', [
        ['O que é', 'Itens encaminhados de uma reunião para a pauta de outra (ex.: da Integrada para os departamentos). Ficam PENDENTES até alguém gerar a pauta de uma reunião do destino e aceitar — ou até serem descartados aqui.'],
        ['Idade', 'Pendente há N dias = hoje − data do encaminhamento. Sugestão velha é sinal de pauta que não roda — trate ou descarte.'],
        ['Dados', 'Coleção pauta_sugestoes (status pendente). Descartar é soft-delete: vira status descartada, nada é apagado.']
      ]));
      sh.appendChild(st0);
      scard.appendChild(sh);
      var marcS = {};
      SUGS.forEach(function (g) {
        var lin = el('<div style="display:flex;align-items:flex-start;gap:8px;padding:6px 0;border-top:1px solid var(--border)"></div>');
        if (CAN_WRITE()) {
          var cbS = document.createElement('input'); cbS.type = 'checkbox';
          cbS.addEventListener('change', function () { marcS[g.id] = cbS.checked; });
          lin.appendChild(cbS);
        }
        var mainS = el('<div style="flex:1"></div>');
        mainS.appendChild(txt('div', 'pj-dec-t', g.texto || '(sem texto)'));
        var idade = g.criadoEm ? R.diasEntre(R.toISO(new Date(Number(g.criadoEm))), hoje) : null;
        var destino = rotuloTipo(g.destinoTipo || 'sem_tipo') + (g.destinoSetorSigla ? ' · ' + g.destinoSetorSigla : '');
        mainS.appendChild(txt('div', 'pj-dec-m', 'Destino: ' + destino +
          ' · Origem: ' + (g.origem && g.origem.data ? fmtBR(g.origem.data) : '—') +
          (idade == null ? '' : ' · pendente há ' + idade + 'd') +
          (g.candidatoIndicador ? ' · candidato a indicador' : '')));
        lin.appendChild(mainS);
        scard.appendChild(lin);
      });
      if (CAN_WRITE()) {
        var swrap = el('<div style="margin-top:8px"></div>');
        swrap.appendChild(UI.button({ label: 'Descartar selecionadas', variant: 'ghost', onClick: function () {
          var ids = Object.keys(marcS).filter(function (k) { return marcS[k]; });
          if (!ids.length) { toast('Marque ao menos uma sugestão.', 'err'); return; }
          if (!window.confirm('Descartar ' + ids.length + ' sugestão(ões)? Elas somem da fila (soft-delete).')) { return; }
          Promise.all(ids.map(function (id) {
            return Store.atualizarSugestaoPauta(id, { status: 'descartada' }, 'descartar_pauta_sugestao');
          })).then(function () {
            SUGS = SUGS.filter(function (g) { return ids.indexOf(g.id) < 0; });
            toast(ids.length + ' sugestão(ões) descartada(s).'); rerender();
          }).catch(function (e) { toast(e.message, 'err'); });
        } }));
        scard.appendChild(swrap);
      }
      bodyEl.appendChild(scard);
    }

    var card = el('<div class="pj-card"></div>');
    var h = el('<div class="pj-card-h"></div>');
    var tituloLista = VIEW_TIPO === 'todas' ? 'Todas as reuniões' : rotuloTipo(VIEW_TIPO);
    h.appendChild(txt('div', 'pj-card-t', tituloLista + ' (' + REUNV.length + ')'));
    /* F1-F · B7 — toggle Lista | Kanban (leitura; sem arrastar: as travas de
       Iniciar/Encerrar/Reabrir do F1-E continuam mandando no status).      */
    var tg = el('<div style="display:flex;gap:6px"></div>');
    tg.appendChild(UI.button({ label: 'Lista', variant: MODO_REUN === 'lista' ? undefined : 'ghost', onClick: function () { MODO_REUN = 'lista'; rerender(); } }));
    tg.appendChild(UI.button({ label: 'Kanban', variant: MODO_REUN === 'kanban' ? undefined : 'ghost', onClick: function () { MODO_REUN = 'kanban'; rerender(); } }));
    h.appendChild(tg);
    card.appendChild(h);
    if (!REUNV.length) {
      card.appendChild(txt('div', 'pj-empty2', CAN_WRITE() ? 'Nenhuma reunião nesta visão — clique em "Nova reunião".' : 'Nenhuma reunião nesta visão.'));
    } else if (MODO_REUN === 'kanban') {
      card.appendChild(kanbanReunioes(REUNV));
    } else {
      REUNV.slice().sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); })
        .forEach(function (r) { renderReuniaoRow(r, card); });
    }
    bodyEl.appendChild(card);
  }

  /* F1-F · B7 — kanban de LEITURA: 3 colunas com status derivado
     (K.statusReuniao — harness). Card abre a reunião completa em modal
     (o MESMO fillReuniao da lista: zero lógica duplicada).             */
  function kanbanReunioes(lista) {
    var wrap = el('<div style="display:flex;gap:10px;align-items:flex-start;overflow-x:auto;margin-top:6px"></div>');
    [['agendada', 'Agendadas'], ['andamento', 'Em andamento'], ['encerrada', 'Encerradas']].forEach(function (c) {
      var itens = lista.filter(function (r) { return KPI.statusReuniao(r).chave === c[0]; })
        .sort(function (a, b) { return (b.data || '').localeCompare(a.data || ''); });
      var col = el('<div style="flex:1;min-width:220px;border:1px solid var(--border);border-radius:10px;padding:8px"></div>');
      var ch = txt('div', 'pj-rrow-meta', c[1] + ' (' + itens.length + ')');
      ch.style.fontWeight = '700';
      col.appendChild(ch);
      if (!itens.length) { col.appendChild(txt('div', 'pj-empty2', '—')); }
      itens.forEach(function (r) {
        var cd = el('<div style="border:1px solid var(--border);background:var(--s2);border-radius:8px;padding:8px;margin-top:6px;cursor:pointer"></div>');
        cd.appendChild(txt('div', 'pj-dec-t', r.titulo || 'Reunião'));
        cd.appendChild(txt('div', 'pj-dec-m', fmtBR(r.data) + ' · ' + (TIPO_LABEL[r.tipo] || r.tipo || '—') + ' · ' + ((r.decisoes || []).length) + ' decisão(ões)'));
        cd.addEventListener('click', function () {
          var boxM = el('<div></div>');
          UI.modal({ title: (r.titulo || 'Reunião') + ' — ' + fmtBR(r.data), width: 760, body: [boxM] });
          fillReuniao(r, boxM, null);
        });
        col.appendChild(cd);
      });
      wrap.appendChild(col);
    });
    return wrap;
  }

  /* ===================== PAUTA ===================== */
  /* Pauta HONESTA (F1-E · 0.1 + 4.1): não mente no dia zero — só cobra setor
     com previsto VENCIDO; setor em coleta é declarado; sigla morta é ignorada
     e listada no rodapé; banda ISO 2 períodos consecutivos = ação obrigatória. */
  function textoPauta() {
    var m = KPI.computar(CTX);
    var cls = KPI.pautaSetores(m.porSetor, m.setores, 80);
    var mortaSet = {};
    cls.mortas.forEach(function (sg) { mortaSet[sg] = true; });
    var L = [];
    L.push('PAUTA — REUNIÃO DE LÍDERES · ' + fmtBR(R.hojeISO()));
    L.push('Janela dos indicadores: ' + fmtBR(m.janela.jIni) + ' a ' + fmtBR(m.janela.jFim));
    L.push('');
    L.push('1) ATRASADAS POR SETOR (' + m.totais.atrasadas + ' no total)');
    var comAtraso = m.porSetor.filter(function (s) { return s.atrasadas > 0 && !mortaSet[s.sig]; });
    if (!comAtraso.length) { L.push('   — nenhuma atrasada. '); }
    comAtraso.forEach(function (s) {
      L.push('   · ' + KPI.nomeSetor(s.sig, m.setores) + ' (' + s.sig + '): ' + s.atrasadas +
        ' atrasada(s) · aderência ' + (s.aderencia == null ? '—' : s.aderencia + '%') +
        ' · aging médio ' + String(s.agingMedio).replace('.', ',') + 'd');
    });
    L.push('');
    L.push('2) SETORES ABAIXO DA BANDA (aderência < 80% com previsto VENCIDO)');
    if (!cls.abaixo.length) { L.push('   — nenhum setor abaixo da banda.'); }
    cls.abaixo.forEach(function (s) {
      var bc = KPI.bandaConsecutiva(SNAPS, s.sig, 80);
      var etiqueta = bc.obrigatoria ? ' — AÇÃO OBRIGATÓRIA (2 períodos consecutivos abaixo da banda)'
        : (bc.atencao ? ' — atenção (1º período abaixo)' : '');
      L.push('   · ' + KPI.nomeSetor(s.sig, m.setores) + ' (' + s.sig + '): aderência ' + s.aderencia + '% · ' + s.prevVencidas + ' previsto(s) vencido(s)' + etiqueta);
    });
    if (cls.coletando.length) {
      L.push('   Em coleta (nada venceu ainda — medir no próximo período): ' + cls.coletando.map(function (s) { return s.sig; }).join(', '));
    }
    L.push('');
    L.push('3) GARGALOS (score 50/30/20)');
    var base = m.porSetor.filter(function (s) { return s.sig !== '—' && (s.prevVencidas || 0) > 0 && !mortaSet[s.sig]; }).map(function (s) {
      return { sigla: s.sig, ader: s.aderencia == null ? 0 : s.aderencia, atrasadas: s.atrasadas, agingMedio: s.agingMedio || 0, carga: s.carga || 0 };
    });
    var gg = KPI._gargalos(base);
    if (!gg.length) { L.push('   — nenhum gargalo detectado (só conta setor com previsto vencido).'); }
    gg.forEach(function (g) { L.push('   · ' + g.sigla + ' — ' + g.motivo); });
    L.push('');
    L.push('4) DECISÕES ABERTAS (rollforward)');
    var nAb = 0;
    REUN.slice().sort(function (a, b) { return (a.data || '').localeCompare(b.data || ''); }).forEach(function (r) {
      (r.decisoes || []).forEach(function (d) {
        if (d.aberta === true) {
          nAb++;
          L.push('   · ' + d.texto + ' — dono: ' + (d.donoNome || nomeUser(d.donoUid) || '—') +
            ' · prazo ' + fmtBR(d.prazo) + ' · reunião ' + fmtBR(r.data));
        }
      });
    });
    if (!nAb) { L.push('   — nenhuma decisão aberta.'); }
    L.push('');
    L.push('5) APROVAÇÕES DE DATA PENDENTES (' + PENDS.length + ')');
    if (!PENDS.length) { L.push('   — nenhuma pendente.'); }
    PENDS.forEach(function (s) {
      L.push('   · ' + (s.tituloAtividade || s.atividadeId) + ': ' + fmtBR(s.dataAtual) + ' → ' + fmtBR(s.dataProposta) +
        ' (' + (s.solicitanteNome || '—') + ')');
    });
    if (cls.mortas.length) {
      L.push('');
      L.push('Obs.: siglas fora do cadastro ativo foram ignoradas (' + cls.mortas.join(', ') + ') — limpe na Zona de manutenção em Setores.');
    }
    return L.join('\n');
  }

  /* modalPauta(reuniaoAlvo, done) — F1-F · B3 (formulário de pauta):
     COM alvo → 4 seções:
       1) indicadores VERMELHOS do recorte, pré-marcados: setor abaixo da
          banda, setor com atrasada e decisão VENCIDA rolando p/ esta
          reunião. Recorte: departamento = escopoLider(setorSigla);
          líderes / integrada / resultado_mensal / sem tipo = escola toda.
       2) sugestões de CASCATA pendentes deste destino, pré-marcadas:
          aceitar grava status "aceita" + consumidaPorReuniaoId e tira da
          fila; desmarcada continua pendente.
       3) ROLLFORWARD informativo (sem checkbox): esses itens entram no
          bloco 4 da reunião com ou sem pauta; vencida marcada na seção 1
          não repete aqui no texto gerado (zero duplicação, zero omissão).
       4) itens LIVRES + check "candidato a indicador" (grava também em
          pauta_sugestoes com candidatoIndicador:true, já consumida, p/ a
          fila da Inteligência).
     Gerar substitui os itens GERADOS anteriores (origem preenchida) e
     preserva os manuais (sem origem). Premissa F1-E declarada: pautaItens
     é gated por canWrite — perfil "usuario" não gera pauta nesta fase.
     SEM alvo (botão da raiz) → comportamento antigo: textarea global da
     reunião de líderes + Copiar (seções 2-4 exigem reunião de destino). */
  function modalPauta(reuniaoAlvo, done) {
    if (!reuniaoAlvo) {
      var taG = document.createElement('textarea');
      taG.className = 'pj-pauta';
      taG.value = textoPauta();
      UI.modal({
        title: 'Pauta da reunião de líderes', width: 640,
        body: [taG],
        footer: function (close) {
          return [UI.button({ label: 'Fechar', variant: 'ghost', onClick: close }),
            UI.button({ label: 'Copiar', icon: 'check', onClick: function () { copiarTexto(taG.value, 'Pauta copiada.'); } })];
        }
      });
      return;
    }
    var r = reuniaoAlvo;
    var hoje = R.hojeISO();
    var m = KPI.computar(CTX);
    var cls = KPI.pautaSetores(m.porSetor, m.setores, 80);
    var mortaSet = {};
    cls.mortas.forEach(function (sg) { mortaSet[sg] = true; });

    var recorte = null;
    if (r.tipo === 'departamento' && r.setorSigla) {
      recorte = {};
      KPI.escopoLider([r.setorSigla], (CTX && CTX.setores) || []).forEach(function (sg) { recorte[sg] = true; });
    }
    function noRecorte(sig) { return !recorte || recorte[sig] === true; }
    var nomeRecorte = recorte ? ('setor ' + r.setorSigla + ' + subsetores') : 'escola toda';

    /* seção 1 — indicadores vermelhos (roladoIdx marca decisão vencida p/ não duplicar no bloco 3) */
    var inds = [];
    cls.abaixo.forEach(function (s) {
      if (!noRecorte(s.sig)) { return; }
      var bc = KPI.bandaConsecutiva(SNAPS, s.sig, 80);
      var extra = bc.obrigatoria ? ' — AÇÃO OBRIGATÓRIA (2 períodos abaixo da banda)' : (bc.atencao ? ' — atenção (1º período)' : '');
      inds.push({ texto: 'Aderência abaixo da banda: ' + KPI.nomeSetor(s.sig, m.setores) + ' (' + s.sig + ') ' + s.aderencia + '% · ' + s.prevVencidas + ' previsto(s) vencido(s)' + extra });
    });
    m.porSetor.forEach(function (s) {
      if (mortaSet[s.sig] || !noRecorte(s.sig)) { return; }
      if ((s.atrasadas || 0) > 0) {
        inds.push({ texto: 'Atrasadas em ' + KPI.nomeSetor(s.sig, m.setores) + ' (' + s.sig + '): ' + s.atrasadas + ' · aging médio ' + String(s.agingMedio).replace('.', ',') + 'd' });
      }
    });
    var rolados = itensRolados(r);
    rolados.forEach(function (g, gi) {
      if (g.st.chave !== 'vencida') { return; }
      inds.push({ roladoIdx: gi, texto: 'Decisão VENCIDA: ' + g.dec.texto + ' — ' + (g.dec.donoNome || nomeUser(g.dec.donoUid) || '—') + ' · prazo ' + fmtBR(g.dec.prazo) + ' · reunião ' + fmtBR(g.reuniao.data) });
    });

    /* seção 2 — cascata pendente deste destino */
    var sugsDest = SUGS.filter(function (g) {
      if ((g.destinoTipo || null) !== (r.tipo || null)) { return false; }
      if (r.tipo === 'departamento' && (g.destinoSetorSigla || null) !== (r.setorSigla || null)) { return false; }
      return true;
    });

    var bodyF = el('<div style="max-height:60vh;overflow:auto"></div>');
    var h0 = el('<div style="display:flex;align-items:center;gap:8px;margin-bottom:6px"></div>');
    h0.appendChild(txt('div', 'pj-card-t', 'Gerar pauta — ' + (TIPO_LABEL[r.tipo] || 'Reunião') + ' · ' + fmtBR(r.data)));
    h0.appendChild(iBtn('Como esta pauta é montada', [
      ['Recorte', nomeRecorte + ' (departamento usa o setor + subsetores; os demais tipos e reunião sem tipo olham a escola toda).'],
      ['Seção 1', 'Vermelhos da janela ' + fmtBR(m.janela.jIni) + ' a ' + fmtBR(m.janela.jFim) + ': aderência < 80% com previsto vencido (banda), atrasadas > 0 por setor e decisões vencidas que rolam p/ esta reunião. Pré-marcados — desmarque o que não entra.'],
      ['Seção 2', 'Sugestões encaminhadas de outras reuniões p/ este destino. Aceitar grava "aceita" e tira da fila; desmarcada continua pendente.'],
      ['Seção 3', 'Rollforward informativo: os itens já entram no bloco 4 da reunião. Vencida marcada na seção 1 não repete no texto.'],
      ['Seção 4', 'Itens livres. "Candidato a indicador" também grava na fila da Inteligência (pauta_sugestoes).'],
      ['Gravação', 'Gerar substitui os itens gerados anteriores (com origem) e preserva os adicionados à mão. pautaItens exige perfil com escrita (canWrite).']
    ]));
    bodyF.appendChild(h0);

    function secao(titulo) {
      var c = el('<div style="margin-top:10px;padding-top:8px;border-top:1px solid var(--border)"></div>');
      c.appendChild(txt('div', 'pj-dec-t', titulo));
      return c;
    }

    var marc1 = [];
    var s1 = secao('1) Indicadores vermelhos (' + inds.length + ') — pré-marcados');
    if (!inds.length) { s1.appendChild(txt('div', 'pj-empty2', 'Nenhum indicador vermelho no recorte (' + nomeRecorte + ').')); }
    inds.forEach(function (it, ix) {
      marc1[ix] = true;
      var lin = el('<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0"></div>');
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
      cb.addEventListener('change', function () { marc1[ix] = cb.checked; });
      lin.appendChild(cb);
      lin.appendChild(txt('div', '', it.texto));
      s1.appendChild(lin);
    });
    bodyF.appendChild(s1);

    var marc2 = {};
    var s2 = secao('2) Sugestões de cascata p/ este destino (' + sugsDest.length + ') — pré-marcadas');
    if (!sugsDest.length) { s2.appendChild(txt('div', 'pj-empty2', 'Nenhuma sugestão pendente p/ este destino.')); }
    sugsDest.forEach(function (g) {
      marc2[g.id] = true;
      var lin = el('<div style="display:flex;align-items:flex-start;gap:8px;padding:4px 0"></div>');
      var cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = true;
      cb.addEventListener('change', function () { marc2[g.id] = cb.checked; });
      lin.appendChild(cb);
      var mn = el('<div style="flex:1"></div>');
      mn.appendChild(txt('div', '', g.texto || '(sem texto)'));
      var idade = g.criadoEm ? R.diasEntre(R.toISO(new Date(Number(g.criadoEm))), hoje) : null;
      mn.appendChild(txt('div', 'pj-dec-m', 'Origem: ' + (g.origem && g.origem.data ? fmtBR(g.origem.data) : '—') + (idade == null ? '' : ' · pendente há ' + idade + 'd') + (g.candidatoIndicador ? ' · candidato a indicador' : '')));
      lin.appendChild(mn);
      s2.appendChild(lin);
    });
    bodyF.appendChild(s2);

    var s3 = secao('3) Rollforward — itens que rolam p/ esta reunião (' + rolados.length + ') · informativo');
    if (!rolados.length) { s3.appendChild(txt('div', 'pj-empty2', 'Nada rolando de reuniões anteriores.')); }
    rolados.forEach(function (g) {
      s3.appendChild(txt('div', 'pj-dec-m', '· [' + g.st.rotulo + '] ' + g.dec.texto + ' — ' + (g.dec.donoNome || nomeUser(g.dec.donoUid) || '—') + ' · reunião ' + fmtBR(g.reuniao.data)));
    });
    if (rolados.length) { s3.appendChild(txt('div', 'pj-dec-m', 'Esses itens entram no bloco Rollforward da reunião com ou sem pauta.')); }
    bodyF.appendChild(s3);

    var livres = [];
    var s4 = secao('4) Itens livres');
    var lvLista = el('<div></div>');
    s4.appendChild(lvLista);
    function pintaLivres() {
      lvLista.innerHTML = '';
      livres.forEach(function (lv, ix) {
        var lin = el('<div style="display:flex;align-items:center;gap:8px;padding:2px 0"></div>');
        lin.appendChild(txt('div', '', '· ' + lv.texto + (lv.candidato ? ' — candidato a indicador' : '')));
        var bx = txt('button', 'pj-back', '×'); bx.type = 'button'; bx.title = 'Remover';
        bx.addEventListener('click', function () { livres.splice(ix, 1); pintaLivres(); });
        lin.appendChild(bx);
        lvLista.appendChild(lin);
      });
    }
    var lvInp = UI.input({ placeholder: 'Novo item de pauta' });
    lvInp.style.flex = '1';
    var lvCand = document.createElement('input'); lvCand.type = 'checkbox';
    var lvLab = el('<label style="display:flex;align-items:center;gap:4px;white-space:nowrap;color:var(--muted);cursor:pointer"></label>');
    lvLab.appendChild(lvCand);
    lvLab.appendChild(document.createTextNode('candidato a indicador'));
    var lvWrap = el('<div style="display:flex;gap:8px;align-items:center;margin-top:6px;flex-wrap:wrap"></div>');
    lvWrap.appendChild(lvInp); lvWrap.appendChild(lvLab);
    lvWrap.appendChild(UI.button({ label: 'Adicionar', variant: 'ghost', onClick: function () {
      var t = lvInp.value.trim();
      if (!t) { toast('Escreva o item.', 'err'); return; }
      livres.push({ texto: t, candidato: lvCand.checked });
      lvInp.value = ''; lvCand.checked = false; pintaLivres();
    } }));
    s4.appendChild(lvWrap);
    bodyF.appendChild(s4);

    UI.modal({
      title: 'Pauta — formulário', width: 720,
      body: [bodyF],
      footer: function (close) {
        var btns = [UI.button({ label: 'Fechar', variant: 'ghost', onClick: close })];
        if (CAN_WRITE() && !r.encerradaEm) {
          btns.push(UI.button({ label: 'Gerar pauta', onClick: function () {
            var gerados = [];
            var vencidaMarcada = {};
            inds.forEach(function (it, ix) {
              if (!marc1[ix]) { return; }
              if (it.roladoIdx != null) { vencidaMarcada[it.roladoIdx] = true; }
              gerados.push({ texto: it.texto, origem: 'indicador', uid: USER.uid, nome: USER.name || USER.nome || '' });
            });
            var aceitas = sugsDest.filter(function (g) { return marc2[g.id]; });
            aceitas.forEach(function (g) { gerados.push({ texto: g.texto, origem: 'sugestao', uid: USER.uid, nome: USER.name || USER.nome || '' }); });
            rolados.forEach(function (g, gi) {
              if (vencidaMarcada[gi]) { return; }
              gerados.push({ texto: '[rollforward · ' + g.st.rotulo + '] ' + g.dec.texto, origem: 'rollforward', uid: USER.uid, nome: USER.name || USER.nome || '' });
            });
            livres.forEach(function (lv) { gerados.push({ texto: lv.texto + (lv.candidato ? ' (candidato a indicador)' : ''), origem: 'livre', uid: USER.uid, nome: USER.name || USER.nome || '' }); });
            var manuais = (r.pautaItens || []).filter(function (it) { return !it.origem; });
            var novoI = manuais.concat(gerados);
            var L = [];
            L.push('PAUTA — ' + (TIPO_LABEL[r.tipo] || 'Reunião') + (r.titulo ? ' · ' + r.titulo : '') + ' · ' + fmtBR(r.data) + (r.horaPrevista ? ' às ' + r.horaPrevista : ''));
            L.push('Recorte: ' + nomeRecorte + ' · janela ' + fmtBR(m.janela.jIni) + ' a ' + fmtBR(m.janela.jFim));
            L.push('');
            function bloco(titulo, arr) {
              L.push(titulo);
              if (!arr.length) { L.push('   — nada.'); }
              arr.forEach(function (t2) { L.push('   · ' + t2); });
              L.push('');
            }
            function soOrigem(o) { return gerados.filter(function (g) { return g.origem === o; }).map(function (g) { return g.texto; }); }
            bloco('1) INDICADORES', soOrigem('indicador'));
            bloco('2) CASCATA (sugestões aceitas)', soOrigem('sugestao'));
            bloco('3) ROLLFORWARD', soOrigem('rollforward'));
            bloco('4) ITENS LIVRES', soOrigem('livre'));
            var texto = L.join('\n');
            var candDocs = livres.filter(function (lv) { return lv.candidato; }).map(function (lv) {
              return { texto: lv.texto, candidatoIndicador: true, status: 'aceita', consumidaPorReuniaoId: r.id,
                destinoTipo: r.tipo || null, destinoSetorSigla: r.setorSigla || null,
                origem: { reuniaoId: r.id, tipo: r.tipo || null, data: r.data || null, titulo: r.titulo || null } };
            });
            var passos = [Store.atualizarReuniao(r.id, { pautaTexto: texto, pautaGeradaEm: Date.now(), pautaItens: novoI }, 'pauta_gerada')];
            if (aceitas.length) {
              passos.push(Promise.all(aceitas.map(function (g) {
                return Store.atualizarSugestaoPauta(g.id, { status: 'aceita', consumidaPorReuniaoId: r.id }, 'aceitar_pauta_sugestao');
              })));
            }
            if (candDocs.length) { passos.push(Store.criarSugestoesPauta(candDocs)); }
            Promise.all(passos).then(function () {
              r.pautaTexto = texto; r.pautaGeradaEm = Date.now(); r.pautaItens = novoI;
              if (aceitas.length) {
                var ids = aceitas.map(function (g) { return g.id; });
                SUGS = SUGS.filter(function (g) { return ids.indexOf(g.id) < 0; });
              }
              if (done) { done(texto); }
              close();
              toast('Pauta gerada' + (aceitas.length ? ' · ' + aceitas.length + ' sugestão(ões) aceita(s)' : '') + (candDocs.length ? ' · ' + candDocs.length + ' candidato(s) a indicador' : '') + '.');
            }).catch(function (e) { toast(e.message, 'err'); });
          } }));
        }
        return btns;
      }
    });
  }

  /* ===================== MODAL: PROJETO ===================== */
  /* ===================== ESTADOS / BOOT ===================== */
  function renderLoading() {
    bodyEl.innerHTML = '';
    var s = el('<div class="pj-state"><div class="pj-state-t">Carregando…</div><div class="pj-state-s">Buscando reuniões e o board de atividades.</div></div>');
    bodyEl.appendChild(s);
  }
  function renderError(e) {
    bodyEl.innerHTML = '';
    var s = el('<div class="pj-state"></div>');
    s.appendChild(txt('div', 'pj-state-t', 'Não deu para carregar'));
    s.appendChild(txt('div', 'pj-state-s', (e && e.message) || 'Erro desconhecido.'));
    var rb = UI.button({ label: 'Tentar de novo', icon: 'upload' });
    rb.addEventListener('click', reload);
    s.appendChild(rb);
    bodyEl.appendChild(s);
  }

  function rerender() { renderRoot(); }

  function reload() {
    renderLoading();
    return Promise.all([
      KPI.carregar('band'),
      Store.listReunioes(),
      Store.listUsuariosAtivos(),
      Store.listSolicPendentes(),
      KPI.lerSnapshots(R.hojeISO()).catch(function () { return []; }),
      Store.listSugestoesPauta()
    ]).then(function (r) {
      CTX = r[0]; REUN = r[1];
      USERS = r[2]; PENDS = r[3]; SNAPS = r[4] || [];
      SUGS = (r[5] || []).filter(function (g) { return g.status === 'pendente'; }); /* F1-F · B4 */
      OLD_OCC = null; /* F1-F · B2: reload zera o cache da varredura */
      rerender();
    }).catch(function (e) { renderError(e); });
  }

  function boot() {
    POP = document.getElementById('pj-pop');
    BACK = document.getElementById('pj-backdrop');
    BACK.addEventListener('click', closePop);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); } });
    titleEl = document.getElementById('pj-title');
    actionsEl = document.getElementById('pj-actions');
    bodyEl = document.getElementById('pj-body');
    var app = document.getElementById('app');
    /* R4·B2: sem abas nem hash — a tela é 100% Reuniões. Links antigos
       com #reunioes seguem funcionando (o hash é simplesmente ignorado). */
    app.insertBefore(UI.sidebar({ active: 'Reuniões', user: USER }), app.firstChild);
    reload();
  }

  Guard.onReady(function (u) { USER = u; boot(); });
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
