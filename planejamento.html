      options: MOTIVOS_NAO_REALIZAR.map(function (m) { return { value: m, label: m }; }) });
    var detTa = document.createElement('textarea');
    detTa.className = 'ui-input'; detTa.rows = 2; detTa.style.resize = 'vertical';
    detTa.placeholder = 'Detalhe (obrigatório se "Outro")';
    UI.modal({
      title: 'Não realizado — por quê?', width: 460,
      body: [
        txt('div', 'pl-empty', it.oque || ''),
        UI.field({ label: 'Motivo', required: true, control: motSel, hint: 'O item passa a contar CONTRA a aderência do setor; o motivo alimenta o cartão de motivos de não-realização.' }),
        UI.field({ label: 'Detalhe', control: detTa })
      ],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: 'Confirmar', icon: 'check', onClick: function () {
            var mot = motSel.value || '';
            /* item 24 — erro no CAMPO (marca, foca e escreve no slot), não só no toast. */
            if (!mot) { erroCampo(motSel, 'Escolha o motivo da não-realização.'); return; }
            if (mot === 'Outro' && !detTa.value.trim()) { erroCampo(detTa, 'O motivo "Outro" exige o detalhe escrito.'); return; }
            var lista = (pl.itens || []).map(function (x) {
              return x.id === it.id ? Object.assign({}, x, { naoFeito: true, motivo: mot, motivoDetalhe: detTa.value.trim() || null, naoFeitoEm: Date.now() }) : x;
            });
            salvarItens(pl, lista, 'planejamento_item_nao_realizado', { itemId: it.id, motivo: mot })
              .then(function () { close(); toast('Registrado como não realizado.'); render(); })
              .catch(function (e) { toast(e.message, 'err'); });
          } })];
      }
    });
  }
  function reabrirItem(pl, it) {
    var lista = (pl.itens || []).map(function (x) {
      return x.id === it.id ? Object.assign({}, x, { naoFeito: false, motivo: null, motivoDetalhe: null, naoFeitoEm: null }) : x;
    });
    salvarItens(pl, lista, 'planejamento_item_reabrir', { itemId: it.id, motivoAnterior: it.motivo || null })
      .then(function () { toast('Item reaberto.'); render(); })
      .catch(function (e) { toast(e.message, 'err'); });
  }
  function modalItem(pl, it) {
    var editing = !!it;
    var oqInp = UI.input({ value: editing ? (it.oque || '') : '', placeholder: 'Ex.: Mutirão de rematrícula' });
    var comoTa = document.createElement('textarea');
    comoTa.className = 'ui-input'; comoTa.rows = 2; comoTa.style.resize = 'vertical';
    comoTa.value = editing ? (it.como || '') : '';
    var quemOpts = USERS.map(function (u) { return { value: u.uid, label: u.nome }; });
    /* ============================================================
       item 34 · O FORMULÁRIO JÁ SABE A RESPOSTA — ENTÃO ELE RESPONDE
       ------------------------------------------------------------
       O modal de item novo abria com TUDO em branco, inclusive QUEM e
       QUANDO — que em quase todo caso são "o líder do setor" e "fim do
       mês". A própria tela já provava saber disso: a inclusão por
       sugestão de risco preenche os dois sozinha há duas rodadas. Aqui
       vale a mesma sugestão, EDITÁVEL, e o hint diz que é sugestão —
       campo pré-preenchido que se apresenta como verdade é pior do que
       campo vazio. Só vale para item NOVO: editando, manda o gravado.
       ============================================================ */
    var lidSug = editing ? null : liderDoSetor(pl.setorSigla);
    var quemSel = UI.select({
      value: editing ? (it.quemUid || '') : (lidSug ? lidSug.uid : ''),
      placeholder: '— Quem executa —', options: quemOpts
    });
    /* item 10 — "quando previsto" também não tinha teto: dava para planejar
       dentro do plano de AGOSTO uma ação para 2029. A competência é o
       intervalo legítimo; o submit revalida (o teclado ignora min/max). */
    var qdMin = COMP + '-01';
    var qdMax = ultimoDiaComp(COMP);
    var qdInp = UI.input({}); qdInp.type = 'date';
    qdInp.value = editing ? (it.quandoPrevisto || '') : qdMax; /* item 34: fim do mês, editável */
    qdInp.min = qdMin; qdInp.max = qdMax;
    var vPrevAtual = editing ? valorPrev(it) : null;
    var vInp = UI.input({ placeholder: 'R$ 0,00 (opcional)', value: vPrevAtual != null && vPrevAtual !== 0 ? fmtBRL(vPrevAtual) : '' });
    vInp.addEventListener('input', function () { vInp.value = vInp.value.trim() ? fmtBRL(parseBRL(vInp.value)) : ''; });
    /* R5-B2: setores PARCEIROS (multi, com aceite) — só siglas raiz, fora o
       setor dono do plano; edição preserva aceites já dados. */
    var envAtuais = {}; (editing ? (it.setoresEnvolvidos || []) : []).forEach(function (se) { envAtuais[se.sigla] = se; });
    var parcBox = el('<div style="display:flex;flex-wrap:wrap;gap:6px 14px"></div>');
    var parcCbs = {};
    siglasRaizParceiras(pl.setorSigla).forEach(function (sg) {
      var lab = el('<label style="display:flex;align-items:center;gap:6px;cursor:pointer"></label>');
      var cb = document.createElement('input'); cb.type = 'checkbox';
      cb.checked = !!envAtuais[sg];
      parcCbs[sg] = cb;
      lab.appendChild(cb);
      lab.appendChild(txt('span', 'pl-l-m', sg));
      parcBox.appendChild(lab);
    });
    UI.modal({
      title: (editing ? 'Editar' : 'Novo') + ' item — ' + pl.setorSigla + ' · ' + compLabel(COMP), width: 520,
      body: [
        UI.field({ label: 'O que', required: true, control: oqInp }),
        UI.field({ label: 'Como', control: comoTa }),
        /* item 34 — o hint DIZ que veio sugerido. Campo pré-preenchido que se
           apresenta como se a pessoa tivesse escolhido vira dado falso. */
        UI.field({ label: 'Quem', control: quemSel, hint: !USERS.length
          ? 'Sem lista de usuários (perfil sem acesso) — fica em branco.'
          : (lidSug ? ('Responsável pela execução. Já veio SUGERIDO ' + lidSug.nome + ', que lidera ' + pl.setorSigla + ' — troque se quem executa for outra pessoa.') : 'Responsável pela execução.') }),
        UI.field({ label: 'Quando (previsto)', required: true, control: qdInp, hint: (editing ? '' : 'Já veio SUGERIDO o fim do mês (' + fmtBR(qdMax) + ') — ajuste para a data real. ')
          + 'Dentro de ' + compLabel(COMP) + ': de ' + fmtBR(COMP + '-01') + ' a ' + fmtBR(ultimoDiaComp(COMP)) + '. É o plano DESTE mês — data fora da competência não seria cobrada por ninguém.' }),
        UI.field({ label: 'Custo previsto', control: vInp, hint: 'Acima de R$ 200,00 o item trava até GESTOR + SÓCIO aprovarem (alçada pelo PREVISTO — o plano nunca trava). O custo final entra na baixa ("✓ realizar").' }),
        UI.field({ label: 'Setores parceiros', control: parcBox, hint: 'Opcional. Quem lidera o setor marcado vê o item e registra o aceite no chip (nada trava sem aceite — é ciência).' })
      ],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: editing ? 'Salvar' : 'Adicionar', icon: 'check', onClick: function () {
            /* item 24 — erro marcado NO campo (aria-invalid + foco + slot). */
            if (!oqInp.value.trim()) { erroCampo(oqInp, 'Informe "O que" será feito.'); return; }
            if (!R.isISO(qdInp.value)) { erroCampo(qdInp, 'Informe a data prevista.'); return; }
            /* item 10 — validação de verdade: o min/max do input é só dica. */
            if (qdInp.value < qdMin || qdInp.value > qdMax) {
              erroCampo(qdInp, 'A data prevista tem de cair em ' + compLabel(COMP) + ' — entre ' + fmtBR(qdMin) + ' e ' + fmtBR(qdMax) + '.');
              return;
            }
            var quem = USERS.filter(function (u) { return u.uid === quemSel.value; })[0] || null;
            var cents = vInp.value.trim() ? parseBRL(vInp.value) : null;
            var envs = [];
            siglasRaizParceiras(pl.setorSigla).forEach(function (sg) {
              if (!parcCbs[sg] || !parcCbs[sg].checked) { return; }
              envs.push(envAtuais[sg] ? envAtuais[sg] : { sigla: sg, aceite: null }); /* preserva aceite já dado */
            });
            var base = {
              oque: oqInp.value.trim(), como: comoTa.value.trim() || null,
              quemUid: quem ? quem.uid : null, quemNome: quem ? quem.nome : null,
              quandoPrevisto: qdInp.value, valorPrevistoCentavos: cents,
              setoresEnvolvidos: envs
            };
            var lista;
            if (editing) {
              /* previsto mudou e cruzou/permanece acima da alçada -> assinaturas zeram (o aprovado foi OUTRO valor) */
              lista = (pl.itens || []).map(function (x) {
                if (x.id !== it.id) { return x; }
                var novo = Object.assign({}, x, base);
                if ((Number(valorPrev(x)) || 0) !== (Number(cents) || 0) && (Number(cents) || 0) > 20000) {
                  novo.aprovGestor = null; novo.aprovSocio = null; /* o aprovado foi OUTRO valor */
                }
                return novo;
              });
            } else {
              /* item 1 — criadoPor é a base do four-eyes: sem ele o autor
                 assinaria a própria alçada. Campo obrigatório em todo item novo. */
              lista = (pl.itens || []).concat([Object.assign({ id: novoItemId(), quandoRealizado: null, valorFinalCentavos: null, aprovGestor: null, aprovSocio: null, naoFeito: false, motivo: null, motivoDetalhe: null, naoFeitoEm: null, removido: false, criadoEm: Date.now(), criadoPor: USER.uid }, base)]);
            }
            salvarItens(pl, lista, editing ? 'planejamento_item_editar' : 'planejamento_item_add', editing ? { itemId: it.id } : null)
              .then(function () { close(); toast(editing ? 'Item salvo.' : 'Item adicionado ao plano.'); render(); })
              .catch(function (e) { toast(e.message, 'err'); });
          } })];
      }
    });
  }

  /* ===================== ESTADOS / RENDER / BOOT ===================== */
  function renderLoading() {
    bodyEl.innerHTML = '';
    bodyEl.appendChild(el('<div class="pl-state"><div class="pl-state-t">Carregando…</div><div class="pl-state-s">Buscando setores e os planos da competência.</div></div>'));
  }
  function renderError(e) {
    bodyEl.innerHTML = '';
    var s = el('<div class="pl-state"></div>');
    s.appendChild(txt('div', 'pl-state-t', 'Não deu para carregar'));
    s.appendChild(txt('div', 'pl-state-s', (e && e.message) || 'Erro desconhecido.'));
    var rb = UI.button({ label: 'Tentar de novo', icon: 'upload' });
    rb.addEventListener('click', reload);
    s.appendChild(rb);
    bodyEl.appendChild(s);
  }
  function render() {
    /* item 22 — render() zera o body: se o popover estivesse aberto, o "i" que
       o abriu era destruído e o foco ficava órfão no <body> (o leitor de tela
       perdia o lugar). Fechar ANTES devolve o foco enquanto a origem existe. */
    closePop();
    compEl.textContent = compLabel(COMP);
    actionsEl.innerHTML = '';
    var livres = minhasSiglasEscreviveis().filter(function (sg) {
      return !PLANOS.some(function (p) { return p.setorSigla === sg; });
    });
    if (livres.length) {
      var nb = UI.button({ label: 'Novo planejamento', icon: 'plus', onClick: function () {
        var opts = livres.map(function (sg) { return { value: sg, label: sg + ' — ' + nomeSetor(sg) }; });
        var sel = UI.select({ placeholder: 'Escolha o setor', options: opts });
        if (livres.length === 1) { sel.value = livres[0]; }
        UI.modal({
          title: 'Novo planejamento — ' + compLabel(COMP), width: 460,
          body: [
            UI.field({ label: 'Setor', required: true, control: sel, hint: 'Um plano por setor por competência.' }),
            txt('div', 'pl-smeta', 'Comece do zero, ou copie os itens de ' + compLabel(compShift(COMP, -1)) + ' (datas viram o fim deste mês; realizados e assinaturas zeram).')
          ],
          footer: function (close) {
            return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
              UI.button({ label: 'Copiar de ' + compLabel(compShift(COMP, -1)), variant: 'ghost', onClick: function () {
                /* item 24 — o erro marca e foca o próprio campo. */
                if (!sel.value) { erroCampo(sel, 'Escolha o setor do novo plano.'); return; }
                close(); criarPlanoCopiando(sel.value);
              } }),
              UI.button({ label: 'Criar vazio', icon: 'check', onClick: function () {
                if (!sel.value) { erroCampo(sel, 'Escolha o setor do novo plano.'); return; }
                close(); criarPlano(sel.value);
              } })];
          }
        });
      } });
      actionsEl.appendChild(nb);
    }
    bodyEl.innerHTML = '';
    /* itens 5 e 12 — além do aviso de leitura truncada (AVISOS, nasce na carga),
       entram os avisos DERIVADOS do dado: plano órfão, catálogo de risco que não
       carregou e setor raiz sem mapeamento de risco. Nada falha em silêncio. */
    AVISOS.concat(avisosDerivados()).forEach(function (msg) {
      var a = txt('div', 'pl-aviso', '⚠ ' + msg);
      a.setAttribute('role', 'alert');
      bodyEl.appendChild(a);
    });
    if (!SETORES.length) {
      bodyEl.appendChild(el('<div class="pl-state"><div class="pl-state-t">Sem setores cadastrados</div><div class="pl-state-s">Cadastre os setores primeiro (tela Setores) — o plano nasce por sigla.</div></div>'));
      return;
    }
    renderHero();   /* R6/design: a conclusão primeiro (Minto) */
    renderEixo();
    renderRanking();
    renderSetores();
  }
  function reload() {
    renderLoading();
    AVISOS = []; /* recomeça a cada carga: aviso de leitura truncada não pode ficar preso da carga anterior */
    return Promise.all([Store.listSetores(), Store.listPlanejamentos(COMP), Store.listUsuariosAtivos()])
      .then(function (r) { SETORES = r[0]; PLANOS = r[1]; USERS = r[2]; render(); })
      .catch(renderError);
  }
  function boot() {
    POP = document.getElementById('pl-pop');
    BACK = document.getElementById('pl-backdrop');
    BACK.addEventListener('click', closePop);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); } });
    document.addEventListener('keydown', prenderFocoPop); /* item 22: Tab preso no "i" */
    bodyEl = document.getElementById('pl-body');
    actionsEl = document.getElementById('pl-actions');
    compEl = document.getElementById('pl-comp');
    HOJE = R.hojeISO();
    COMP = compSeguinte(HOJE); /* padrão: a competência que se planeja AGORA (vence dia 25 deste mês) */
    document.getElementById('pl-prev').addEventListener('click', function () { COMP = compShift(COMP, -1); reload(); });
    document.getElementById('pl-next').addEventListener('click', function () { COMP = compShift(COMP, 1); reload(); });
    /* item 9 — a tela NÃO é 5W2H: ela coleta O quê · Como · Quem · Quando ·
       Quanto (4W+1H). Faltam Onde e Por quê, então o rótulo virou o que a
       tela de fato faz. Decisão travada: NÃO se acrescentam campos. */
    var ib = iBtn('Plano do setor — O quê · Como · Quem · Quando · Quanto', [
      ['O que é', 'O plano mensal obrigatório de cada setor (RESUMO §4): O QUÊ / COMO / QUEM / QUANDO / QUANTO, previsto × realizado. É a prestação de contas pública do líder — TODOS leem; edita quem lidera o setor (ou o gestor).'],
      ['Por que não se chama 5W2H', 'O 5W2H tem sete perguntas (what, why, where, when, who, how, how much). Esta tela coleta cinco — não pede ONDE nem POR QUÊ. Chamar de 5W2H prometia um método que o formulário não entrega; o nome agora descreve exatamente os campos que existem.'],
      ['Entrega', 'Até o dia 25 do mês anterior à competência. Farol D-5 (dia 20, alerta ao líder) · D-3 (dia 22, gestão) · D-0 (dia 25, flag de não-conformidade). NUNCA bloqueia.'],
      ['Alçada', 'Item até R$ 200: autonomia do líder. Acima: trava o ITEM até GESTOR + SÓCIO assinarem (paralelo). Quem CRIOU o item não assina — o botão "aprovar" não aparece para o autor (four-eyes). A trava é pelo custo PREVISTO. O plano nunca trava.'],
      ['Risco aceito', 'Dispensar risco de banda CRÍTICA (nível 15 a 25) exige DUAS assinaturas — gestor e sócio —, a mesma exigência de gastar acima de R$ 200. Banda ALTA (nível 10 a 14) segue com uma. Aceitar risco é decisão de risco residual (ISO 31000), não formalidade.'],
      ['Nota', '50% aderência + 30% no prazo + 20% atraso residual (teto 7 dias) — ranking "quem precisa de atenção". Calibrável.']
    ]);
    document.getElementById('pl-info').appendChild(ib);
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Planejamento', user: USER }), app.firstChild);
    reload();
  }

  Guard.onReady(function (u) { USER = u; boot(); });
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
