<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planejamento — GERA</title>

<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
<script src="mnav.js"></script>

<style>
/* ============================================================
   PLANEJAMENTO · v2 (16/09/2026) — a planilha do Bruno, viva.
   Um plano por setor-raiz (subsetor é seção); grade mês × setor
   (célula vazia cria); 3 números + "Acompanhar esta semana"; grade
   5W2H editável na célula (Notion/Airtable); farol semanal de 3
   estados com motivo (EOS: fora do rumo vira assunto da reunião).
   Regras: zero filtro acima da dobra; "i" em todo número; tokens do
   theme.css (marca verde, claro e escuro); escala tipográfica só do
   theme.css; ES5.
   ============================================================ */
.pl-app{display:flex;min-height:100vh;background:var(--bg)}
.pl-app>.ui-side{position:sticky;top:0;height:100vh}
.pl-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pl-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4) var(--sp-6);background:var(--bg);border-bottom:1px solid var(--border);flex-wrap:wrap}
.pl-top h1{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.pl-top .sub{font-size:var(--fs-sm);font-weight:600;color:var(--muted);margin-top:3px}
.pl-topactions{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}
.pl-mhead{display:none;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--s1);border-bottom:1px solid var(--border)}
.pl-mhead h1{font-size:var(--fs-xl);font-weight:800;margin:0}
.pl-wrap{padding:var(--sp-5) var(--sp-6) var(--sp-7);max-width:1180px}
.pl-sec{font-size:var(--fs-xs);font-weight:800;letter-spacing:.12em;color:var(--muted2);margin:var(--sp-5) 0 var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);text-transform:uppercase;flex-wrap:wrap}
.pl-sec:first-child{margin-top:0}
.pl-sec .n{color:var(--muted)}
.pl-sec .right{margin-left:auto;display:flex;gap:8px;align-items:center;text-transform:none;letter-spacing:0}
.pl-i{width:18px;height:18px;border-radius:50%;border:1px solid var(--muted2);background:transparent;color:var(--muted2);font-size:9px;font-weight:800;line-height:1;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.pl-i:hover,.pl-i:focus-visible{color:var(--text);border-color:var(--brand);outline:none}
.pl-link{font-size:var(--fs-sm);font-weight:800;color:var(--accentText);text-decoration:none;background:transparent;border:0;cursor:pointer;font-family:inherit;padding:0}
.pl-link:hover{text-decoration:underline}
.pl-pill{font-size:var(--fs-xs);font-weight:800;padding:2px 8px;border-radius:6px;background:var(--chipBg);border:1px solid var(--border);white-space:nowrap;color:var(--muted)}
.pl-pill.ok{color:var(--greenText);border-color:var(--green)} .pl-pill.warn{color:var(--bandaAlta,var(--orange));border-color:var(--orange)} .pl-pill.bad{color:var(--red);border-color:var(--red)} .pl-pill.doing{color:var(--doing);border-color:var(--doing)}
.pl-btn{border:1px solid var(--border);background:var(--s2);color:var(--text);font-family:inherit;font-weight:700;font-size:var(--fs-sm);padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.pl-btn:hover{background:var(--s3)} .pl-btn.p{background:var(--cta);color:var(--ctaText);border-color:transparent} .pl-btn.ok{color:var(--greenText);border-color:var(--green)} .pl-btn.warn{color:var(--bandaAlta,var(--orange));border-color:var(--orange)} .pl-btn.bad{color:var(--red);border-color:var(--red)} .pl-btn.sm{padding:4px 9px;font-size:var(--fs-xs)}
.pl-btn:focus-visible{outline:2px solid var(--brand);outline-offset:2px} .pl-btn:disabled{opacity:.5;cursor:default}

/* 3 números + ação */
.pl-kpis{display:grid;grid-template-columns:1fr 1fr 1fr auto;gap:var(--sp-3);align-items:stretch}
.pl-kpi{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadowSoft);min-width:0}
.pl-kpi .lab{font-size:var(--fs-xs);font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.pl-kpi .val{font-size:var(--fs-display);font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:8px;font-variant-numeric:tabular-nums}
.pl-kpi .sub{font-size:var(--fs-xs);font-weight:700;color:var(--muted2);margin-top:5px}
.pl-kpi.t-green .val{color:var(--green)} .pl-kpi.t-red .val{color:var(--red)} .pl-kpi.t-amber .val{color:var(--amber)} .pl-kpi.t-flat .val{color:var(--muted)}
.pl-kpi[role=button]{cursor:pointer} .pl-kpi[role=button]:hover{box-shadow:var(--elev-2)}
.pl-cta{background:var(--s1);border:1px solid var(--brand);border-radius:13px;padding:12px 16px;box-shadow:var(--shadowSoft);display:flex;flex-direction:column;justify-content:center;gap:6px;min-width:200px}
.pl-cta .t{font-size:var(--fs-sm);font-weight:800}
.pl-cta .m{font-size:var(--fs-xs);color:var(--muted2)}

/* grade mês × setor */
.pl-grid{background:var(--s1);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadowSoft);overflow:hidden}
.pl-gr{display:grid;grid-template-columns:200px repeat(3,1fr);border-top:1px solid var(--border)}
.pl-gr:first-child{border-top:0}
.pl-gr.hd{background:var(--s2)}
.pl-gr.hd>div{font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);padding:9px 12px}
.pl-gr.hd>div.foco{color:var(--accentText)}
.pl-gr .rz{padding:10px 12px;font-size:var(--fs-sm);font-weight:800;display:flex;align-items:center;gap:8px;min-width:0}
.pl-gr .rz .d{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.pl-gr .rz small{display:block;font-weight:600;color:var(--muted2);font-size:var(--fs-xs)}
.pl-cell{border-left:1px solid var(--border);padding:8px 10px;min-height:56px;text-align:left;font-family:inherit;color:var(--text);background:transparent;border-top:0;border-right:0;border-bottom:0;cursor:pointer;display:flex;flex-direction:column;gap:4px;justify-content:center}
.pl-cell:hover{background:var(--activeBg)}
.pl-cell:focus-visible{outline:2px solid var(--brand);outline-offset:-2px}
.pl-cell.on{background:var(--activeBg);box-shadow:inset 3px 0 0 var(--brand)}
.pl-cell .a{font-size:var(--fs-sm);font-weight:800;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl-cell .b{font-size:var(--fs-xs);color:var(--muted2);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.pl-cell .vazio{color:var(--muted2);font-weight:700;font-size:var(--fs-xs);border:1px dashed var(--border);border-radius:7px;padding:4px 8px;display:inline-block}
.pl-dots{display:inline-flex;gap:3px}
.pl-dots i{width:8px;height:8px;border-radius:50%;display:inline-block}
.pl-dots i.verde{background:var(--green)} .pl-dots i.amarelo{background:var(--amber)} .pl-dots i.vermelho{background:var(--red)}
.pl-mini{height:5px;border-radius:4px;background:var(--track);overflow:hidden;width:100%}
.pl-mini>span{display:block;height:100%;background:var(--green)}

/* plano do setor */
.pl-card{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:var(--sp-4) 18px;box-shadow:var(--shadowSoft)}
.pl-card .h{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
.pl-card .h .t{font-size:var(--fs-lg);font-weight:800;letter-spacing:-.01em}
.pl-card .h .m{font-size:var(--fs-xs);color:var(--muted2);font-weight:700}
.pl-card .h .sp{margin-left:auto;display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.pl-tblwrap{overflow-x:auto;border:1px solid var(--border);border-radius:11px}
.pl-tbl{width:100%;border-collapse:collapse;min-width:900px;font-size:var(--fs-sm)}
.pl-tbl th{font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);background:var(--s2);text-align:left;padding:8px 8px;border-bottom:1px solid var(--border);white-space:nowrap}
.pl-tbl td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:middle;max-width:220px}
.pl-tbl tr:last-child td{border-bottom:0}
.pl-tbl td.ed{cursor:text;border-radius:6px}
.pl-tbl td.ed:hover{background:var(--activeBg)}
.pl-tbl td .v{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px}
.pl-tbl td .v.vazio{color:var(--muted2);font-style:italic}
.pl-tbl td input,.pl-tbl td select{width:100%;background:var(--s1);border:1px solid var(--brand);border-radius:6px;color:var(--text);font-family:inherit;font-size:var(--fs-sm);padding:5px 7px;min-width:80px}
.pl-tbl td.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.pl-tbl tr.done td{opacity:.6}
.pl-tbl tr.sub-h td{background:var(--s2);font-size:var(--fs-xs);font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2);padding:5px 10px}
.pl-tbl tr.add td{background:var(--s2)}
.pl-tbl tr.add input{border-color:var(--border)}
.pl-acts{display:flex;gap:4px;flex-wrap:nowrap}
.pl-farol{display:inline-flex;align-items:center;gap:5px;font-size:var(--fs-xs);font-weight:700;color:var(--muted2);white-space:nowrap}
.pl-farol i{width:10px;height:10px;border-radius:50%;display:inline-block;background:var(--track)}
.pl-farol i.verde{background:var(--green)} .pl-farol i.amarelo{background:var(--amber)} .pl-farol i.vermelho{background:var(--red)}
.pl-x{border:0;background:transparent;color:var(--muted2);cursor:pointer;font-size:14px;line-height:1;padding:2px 4px;border-radius:5px;font-family:inherit}
.pl-x:hover{color:var(--red);background:var(--haloRed)}

/* semana do setor */
.pl-week{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;margin:10px 0 14px}
.pl-day{background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:6px 8px;min-height:54px}
.pl-day.hoje{border-color:var(--brand)}
.pl-day .d{font-size:var(--fs-xs);font-weight:800;color:var(--muted2);text-transform:uppercase;letter-spacing:.06em;display:flex;justify-content:space-between}
.pl-day .it{font-size:var(--fs-xs);font-weight:700;margin-top:4px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pl-day .it.done{opacity:.55;text-decoration:line-through}

/* check-in */
.pl-ck{display:grid;grid-template-columns:minmax(200px,1.4fr) 1.6fr auto 1fr;gap:8px;align-items:center;padding:8px 0;border-top:1px solid var(--border)}
.pl-ck:first-of-type{border-top:0}
.pl-ck .t{font-size:var(--fs-sm);font-weight:700}
.pl-ck .t small{display:block;font-weight:600;color:var(--muted2);font-size:var(--fs-xs)}
.pl-ck input,.pl-ck select{background:var(--s2);border:1px solid var(--border);border-radius:8px;color:var(--text);font-family:inherit;font-size:var(--fs-sm);padding:7px 9px;width:100%;min-width:0}
.pl-tri{display:inline-flex;gap:3px}
.pl-tri button{width:34px;height:30px;border:1px solid var(--border);background:var(--s2);border-radius:7px;cursor:pointer;font-family:inherit;font-weight:800;font-size:var(--fs-xs);color:var(--muted)}
.pl-tri button.on-verde{background:var(--haloGreen);border-color:var(--green);color:var(--greenText)} .pl-tri button.on-amarelo{background:var(--haloAmber);border-color:var(--amber);color:var(--bandaAlta,var(--amber))} .pl-tri button.on-vermelho{background:var(--haloRed);border-color:var(--red);color:var(--red)}

/* parceiros · membro · cobertura */
.pl-chip{display:inline-flex;align-items:center;gap:4px;font-size:var(--fs-xs);font-weight:800;padding:2px 7px;border-radius:6px;background:var(--chipBg);border:1px solid var(--border);white-space:nowrap;color:var(--muted);margin:1px 2px 1px 0}
.pl-chip.ok{color:var(--greenText);border-color:var(--green)} .pl-chip.warn{color:var(--bandaAlta,var(--orange));border-color:var(--orange)} .pl-chip.bad{color:var(--red);border-color:var(--red)}
.pl-chip button{border:0;background:transparent;color:inherit;cursor:pointer;font-family:inherit;font-weight:800;padding:0 2px;line-height:1}
.pl-tbl tr.mine td{background:var(--activeBg)}
.pl-cov{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:var(--fs-xs);color:var(--muted2);margin:-4px 0 10px}
.pl-cov b{color:var(--text)}
.pl-cov .kp{border:1px dashed var(--border);border-radius:6px;padding:1px 7px;color:var(--muted)}
.pl-ped{background:var(--s1);border:1px solid var(--orange);border-radius:13px;padding:12px 16px;box-shadow:var(--shadowSoft);margin-bottom:var(--sp-4)}
.pl-ped .t{font-size:var(--fs-base);font-weight:800;margin-bottom:6px;display:flex;align-items:center;gap:8px}

/* detalhe do item (linha expandida) · indicador clicável */
.pl-tbl th.chv,.pl-tbl td.chv{width:22px;padding-left:8px;padding-right:0}
.pl-chev{border:0;background:transparent;color:var(--muted2);cursor:pointer;font-size:12px;line-height:1;padding:3px 4px;border-radius:5px;font-family:inherit}
.pl-chev:hover{color:var(--text);background:var(--activeBg)}
.pl-tbl tr.det td{background:var(--s2);padding:8px 14px 12px 36px;border-bottom:1px solid var(--border)}
.pl-det{display:grid;grid-template-columns:repeat(4,minmax(140px,1fr));gap:8px 16px}
.pl-det .f{min-width:0}
.pl-det .f.wide{grid-column:span 2}
.pl-det .f label{display:block;font-size:var(--fs-xs);font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted2);margin-bottom:2px}
.pl-det .h{display:block;min-height:24px;border-radius:6px;padding:2px 6px;margin-left:-6px}
.pl-det .h.ed{cursor:text} .pl-det .h.ed:hover{background:var(--activeBg)}
.pl-det .h .v{max-width:none;white-space:normal}
.pl-cov button.kp{font-family:inherit;font-size:inherit;background:transparent;cursor:pointer}
.pl-cov button.kp:hover,.pl-cov .kp.on{border-style:solid;border-color:var(--brand);color:var(--text)}

/* sugestões e estados */
.pl-item{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-top:1px solid var(--border);flex-wrap:wrap}
.pl-item:first-of-type{border-top:0}
.pl-item .tx{flex:1 1 240px;min-width:0;font-size:var(--fs-sm);font-weight:600;line-height:1.35}
.pl-item .tx small{display:block;color:var(--muted2);font-size:var(--fs-xs);font-weight:600;margin-top:2px}
.pl-ez{background:var(--s1);border:1px dashed var(--border);border-radius:13px;padding:16px 18px}
.pl-ez .tt{font-size:var(--fs-base);font-weight:800;margin-bottom:4px}
.pl-ez .ds{font-size:var(--fs-sm);color:var(--muted);line-height:1.5;max-width:66ch}
.pl-state{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:280px;padding:40px 20px}
.pl-state-t{font-size:var(--fs-lg);font-weight:800}
.pl-state-s{font-size:var(--fs-base);color:var(--muted);max-width:460px;line-height:1.5}
.pl-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--s1);border:1px solid var(--border);color:var(--text);font-size:var(--fs-base);font-weight:600;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--elev-3)}
.pl-toast.err{border-color:var(--red);color:var(--red)}
.pl-info-k{font-size:var(--fs-xs);font-weight:800;color:var(--muted2);letter-spacing:.08em;margin-top:10px}
.pl-info-v{font-size:var(--fs-base);line-height:1.5}
.pl-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;font-size:var(--fs-sm);font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--elev-2)}
.pl-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}
@media (min-width:901px){html body .pl-dev{display:none}}
@media (max-width:1100px){.pl-kpis{grid-template-columns:1fr 1fr}.pl-cta{grid-column:span 2}.pl-ck{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .pl-app>.ui-side{display:none}.pl-top{display:none}.pl-mhead{display:flex}
  .pl-wrap{padding:var(--sp-4) var(--sp-4) 110px}
  .pl-gr{grid-template-columns:110px repeat(3,1fr)}.pl-gr .rz small{display:none}.pl-cell{padding:6px}.pl-cell .b{display:none}
  .pl-week{grid-template-columns:repeat(2,1fr)}
  .pl-dev{bottom:94px}
}
@media (max-width:560px){.pl-kpis{grid-template-columns:1fr}.pl-cta{grid-column:span 1}.pl-ck{grid-template-columns:1fr}.pl-gr{grid-template-columns:90px repeat(3,1fr)}}
</style>
</head>
<body>

  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box"><div class="graut-gate__spin" aria-hidden="true"></div><p class="graut-gate__msg">Verificando acesso…</p></div>
  </div>
  <button class="pl-dev" data-theme-toggle type="button" title="Alternar tema claro/escuro"><span class="pin"></span>Tema</button>

  <div class="pl-app" id="app">
    <main class="pl-main">
      <div class="pl-top">
        <div><h1>Planejamento</h1><div class="sub" id="pl-sub">Carregando…</div></div>
        <div class="pl-topactions" id="pl-actions"></div>
      </div>
      <div class="pl-mhead"><div><h1>Planejamento</h1></div><span id="pl-mav"></span></div>
      <div class="pl-wrap">
        <div class="pl-state" id="pl-state"></div>
        <div id="pl-body"></div>
      </div>
    </main>
  </div>

  <script src="ui.js"></script>
  <script src="riscos-catalogo.js"></script>
  <script src="kpis-setor.js"></script>
  <script src="recorrencia.js"></script>
  <script src="planejamento-motor.js"></script>
  <script src="kpi.js"></script>
  <script src="app-version.js"></script>
  <script>
  (function () {
  'use strict';
  var R = window.GrautRecorrencia, M = window.PlanejamentoMotor;
  var USER = null, SETORES = [], USERS = [], PLANOS = [], SUGS = null, SOLIC = [], OCC = {}, ABERTOS = {}, KPI_PENDENTE = null;
  var HOJE = null, COMPS = [], FOCO = null;          /* FOCO = { sig, comp } — plano aberto */
  var MODO_CHECKIN = false, EDITANDO = null;         /* EDITANDO = { itemId, campo } */
  var RISCO_SETOR_SIGLA = { 'Central Rel.': 'CRA', 'Pedagógico': 'PED', 'Gestor': 'GES', 'ADM/Fin': 'ADM', 'Agência': 'AGE', 'CSA': 'CSA' };
  var MOTIVOS = [['dependencia', 'Dependo de outra pessoa ou setor'], ['informacao', 'Faltou informação'], ['prioridade', 'Outra prioridade entrou na frente'], ['tempo', 'Não sobrou tempo'], ['ferramenta', 'Sistema ou ferramenta fora do ar'], ['outro', 'Outro motivo']];
  var MESES = ['jan', 'fev', 'mar', 'abr', 'mai', 'jun', 'jul', 'ago', 'set', 'out', 'nov', 'dez'];
  var DIAS = ['seg', 'ter', 'qua', 'qui', 'sex', 'sáb', 'dom'];

  /* ---------- utilidades ---------- */
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function txt(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } e.textContent = text == null ? '' : text; return e; }
  function toast(msg, kind) { var t = el('<div class="pl-toast' + (kind === 'err' ? ' err' : '') + '" role="status"></div>'); t.textContent = msg; document.body.appendChild(t); setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 3000); }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtBR(iso) { if (!iso) { return '—'; } var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function compLabel(c) { return MESES[parseInt(c.slice(5, 7), 10) - 1] + '/' + c.slice(2, 4); }
  function ultimoDia(comp) { var y = parseInt(comp.slice(0, 4), 10), mo = parseInt(comp.slice(5, 7), 10); return comp + '-' + pad2(new Date(y, mo, 0).getDate()); }

      footer: function (close) { return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }), UI.button({ label: 'Concluir', icon: 'check', onClick: function () {
        var v = M.validarFechamento({ status: 'concluido', relato: ta.value, evidencia: ev.value }); if (!v.ok) { toast(v.erros[0], 'err'); return; }
        if (!R.isISO(dt.value) || R.compareISO(dt.value, HOJE) > 0) { toast('A data de realização não pode ser futura.', 'err'); return; }
        var patch = { quandoRealizado: dt.value, status: 'concluido', relato: ta.value.trim(), evidencia: ev.value.trim(), valorFinalCentavos: parseBRL(fin.value), naoFeito: false };
        var lista = (pl.itens || []).map(function (o) { return o.id === it.id ? Object.assign({}, o, patch) : o; });
        salvarItens(pl, lista, 'planejamento_item_realizado', { itemId: it.id }).then(function () { close(); toast('Concluído. ✔'); render(); }).catch(function (e) { toast(e.message, 'err'); });
      } })]; } });
  }
  function modalNaoFeito(pl, it) {
    var sel = UI.select({ placeholder: 'Por que não foi feito?', options: MOTIVOS.map(function (m) { return { value: m[0], label: m[1] }; }) });
    var det = UI.input({ placeholder: 'Detalhe em uma linha (opcional; obrigatório em "Outro")' });
    UI.modal({ title: 'Não feito — ' + it.oque, width: 460, body: [txt('div', 'pl-info-v', 'O item fica como não feito: derruba a aderência do mês e alimenta o Pareto de motivos.'), UI.field({ label: 'Motivo', required: true, control: sel }), UI.field({ label: 'Detalhe', control: det })],
      footer: function (close) { return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }), UI.button({ label: 'Registrar', icon: 'check', onClick: function () {
        var v = M.validarFechamento({ status: 'nao_feito', motivo: sel.value }); if (!v.ok) { toast(v.erros[0], 'err'); return; }
        if (sel.value === 'outro' && !det.value.trim()) { toast('Detalhe o motivo "Outro".', 'err'); return; }
        var patch = { naoFeito: true, status: 'nao_feito', motivo: sel.value, motivoDetalhe: det.value.trim() || null, naoFeitoEm: Date.now() };
        var lista = (pl.itens || []).map(function (o) { return o.id === it.id ? Object.assign({}, o, patch) : o; });
        salvarItens(pl, lista, 'planejamento_item_nao_realizado', { itemId: it.id, motivo: sel.value }).then(function () { close(); toast('Registrado como não feito.'); render(); }).catch(function (e) { toast(e.message, 'err'); });
      } })]; } });
  }
  function entregarPlano(pl) {
    if (!vivos(pl).length) { toast('Um plano vazio não é plano — adicione ao menos um item.', 'err'); return; }
    var semQuem = vivos(pl).filter(function (i) { return !i.quemUid; }).length; if (semQuem) { toast(semQuem + ' item(ns) sem "quem". Todo item precisa de dono.', 'err'); return; }
    var ts = Date.now();
    Store.atualizarPlanejamento(pl.id, { entregueEm: ts }, 'planejamento_entregue', { entregueEm: null }).then(function (t2) { pl.entregueEm = ts; pl.atualizadoEm = t2; toast('Plano entregue — gestor e sócio recebem para ciência.'); render(); }).catch(function (e) { toast(e.message, 'err'); });
  }
  function ciencia(pl, papel) {
    var patch = {}; patch[papel] = { uid: USER.uid, nome: USER.name || USER.nome || '', em: Date.now() };
    Store.atualizarPlanejamento(pl.id, patch, 'planejamento_ciencia_' + (papel === 'aprovSocio' ? 'socio' : 'gestor'), null).then(function (t2) { pl[papel] = patch[papel]; pl.atualizadoEm = t2; toast('Ciência registrada.'); render(); }).catch(function (e) { toast(e.message, 'err'); });
  }

  /* ---------- check-in da semana (3 campos por item, 1 gravação) ---------- */
  function renderCheckin(pl) {
    var box = el('<div></div>'), semana = semanaAtual();
    var abertos = vivos(pl).filter(function (i) { return statusItem(i) === 'aberto'; });
    box.appendChild(secao('Check-in da semana ' + semana.slice(6) + ' (' + fmtBR(segundaDe(HOJE)) + ' a ' + fmtBR(R.addDias(segundaDe(HOJE), 6)) + ')', { formula: 'para cada item aberto: fez o quê (até 280 caracteres) · vai cumprir? (🟢 sim · 🟡 em risco · 🔴 não) · o que trava (obrigatório em amarelo e vermelho). Tudo gravado de uma vez em acompanhamentos[semana]. Amarelo e vermelho viram sugestão de pauta da próxima Reunião de Líderes.', dados: 'itens abertos do plano.', numeros: abertos.length + ' item(ns) aberto(s)', serve: 'o farol de 3 campos (Perdoo/Quantive), sem meta numérica: o que importa é o que trava.' }, abertos.length));
    if (!abertos.length) { box.appendChild(vazio('Nada aberto', 'Todos os itens do plano estão concluídos ou marcados como não feitos.')); return box; }
    var estado = {};
    abertos.forEach(function (it) {
      var ac = (it.acompanhamentos || {})[semana] || {}; estado[it.id] = { fez: ac.fez || '', farol: ac.farol || null, motivo: ac.motivo || null };
      var row = el('<div class="pl-ck"></div>');
      var t = el('<div class="t"></div>'); t.appendChild(document.createTextNode(it.oque)); t.appendChild(txt('small', '', (it.quemNome || nomeUser(it.quemUid) || '—') + ' · prazo ' + fmtBR(it.quandoPrevisto))); row.appendChild(t);
      var fez = el('<input type="text" placeholder="Fez o quê nesta semana?" maxlength="280">'); fez.value = estado[it.id].fez; fez.addEventListener('input', function () { estado[it.id].fez = fez.value; }); row.appendChild(fez);
      var tri = el('<span class="pl-tri" role="group" aria-label="Vai cumprir?"></span>');
      var motivo = document.createElement('select'); motivo.style.display = estado[it.id].farol === 'amarelo' || estado[it.id].farol === 'vermelho' ? '' : 'none';
      var o0 = document.createElement('option'); o0.value = ''; o0.textContent = 'O que trava?'; motivo.appendChild(o0); MOTIVOS.forEach(function (m) { var o = document.createElement('option'); o.value = m[0]; o.textContent = m[1]; if (m[0] === estado[it.id].motivo) { o.selected = true; } motivo.appendChild(o); });
      motivo.addEventListener('change', function () { estado[it.id].motivo = motivo.value || null; });
      [['verde', '🟢 sim'], ['amarelo', '🟡 risco'], ['vermelho', '🔴 não']].forEach(function (f) {
        var b = el('<button type="button"' + (estado[it.id].farol === f[0] ? ' class="on-' + f[0] + '"' : '') + '>' + f[1] + '</button>');
        b.addEventListener('click', function () { estado[it.id].farol = f[0]; [].forEach.call(tri.children, function (c, ix) { c.className = ''; }); b.className = 'on-' + f[0]; motivo.style.display = f[0] === 'verde' ? 'none' : ''; });
        tri.appendChild(b);
      });
      row.appendChild(tri); row.appendChild(motivo); box.appendChild(row);
    });
    var foot = el('<div style="display:flex;gap:8px;align-items:center;margin-top:12px;flex-wrap:wrap"></div>');
    var salvar = btn('Salvar a semana', 'p', function () {
      var erros = [], novos = {};
      abertos.forEach(function (it) { var e = estado[it.id]; if (!e.farol && !e.fez.trim()) { return; } var v = M.validarAcompanhamento(e); if (!v.ok) { erros.push(it.oque + ': ' + v.erros[0]); return; } novos[it.id] = { fez: e.fez.trim(), farol: e.farol, motivo: e.farol === 'verde' ? null : e.motivo, em: Date.now(), uid: USER.uid }; });
      if (erros.length) { toast(erros[0], 'err'); return; }
      var ids = Object.keys(novos); if (!ids.length) { toast('Preencha ao menos um item.', 'err'); return; }
      var lista = (pl.itens || []).map(function (o) { if (!novos[o.id]) { return o; } var acs = Object.assign({}, o.acompanhamentos || {}); acs[semana] = novos[o.id]; return Object.assign({}, o, { acompanhamentos: acs }); });
      salvar.disabled = true;
      salvarItens(pl, lista, 'planejamento_checkin', { semana: semana, itens: ids.length })
        .then(function () { var fora = ids.filter(function (id) { return M.viraAssunto(novos[id]); }); toast('Semana salva: ' + ids.length + ' item(ns)' + (fora.length ? ' · ' + fora.length + ' vira(m) assunto da próxima Reunião de Líderes.' : '.')); return fora.length ? sugerirPauta(pl, fora.map(function (id) { return abertos.filter(function (i) { return i.id === id; })[0]; }), novos) : null; })
        .then(function () { MODO_CHECKIN = false; render(); })
        .catch(function (e) { salvar.disabled = false; toast(e.message, 'err'); });
    });
    foot.appendChild(salvar); foot.appendChild(txt('span', 'pl-info-v', 'Uma gravação só. Item sem farol fica sem check-in nesta semana.')).style.cssText = 'color:var(--muted2);font-size:var(--fs-xs)';
    box.appendChild(foot);
    return box;
  }
  /* amarelo/vermelho → sugestão de pauta para a Reunião de Líderes (sem duplicar a que já está pendente) */
  function sugerirPauta(pl, itens, novos) {
    return (SUGS ? Promise.resolve(SUGS) : Store.listSugestoes()).then(function (lista) {
      SUGS = lista;
      return Promise.all(itens.map(function (it) {
        var chave = pl.id + '|' + it.id;
        if (lista.some(function (g) { return g.origem && g.origem.planejamentoId === pl.id && g.origem.itemId === it.id; })) { return null; }
        var ac = novos[it.id];
        return Store.criarSugestao({ texto: 'Plano ' + pl.setorSigla + ' · ' + it.oque + ' — ' + (ac.farol === 'vermelho' ? 'não vai cumprir' : 'em risco') + ' (' + motivoLabel(ac.motivo) + ')', destinoTipo: 'lideres', destinoSetorSigla: null, origem: { tipo: 'planejamento', planejamentoId: pl.id, itemId: it.id, chave: chave }, secao: 'assunto' })
          .then(function (id) { lista.push({ id: id, origem: { planejamentoId: pl.id, itemId: it.id } }); });
      }));
    }).catch(function () { /* a sugestão é acessório: falhar não desfaz o check-in */ });
  }

  /* ---------- carga ---------- */
  function reload() {
    HOJE = R.hojeISO();
    var c = HOJE.slice(0, 7); COMPS = [M.compShift(c, -1), c, M.compShift(c, 1)];
    return Promise.all([Store.listSetores(), Store.listUsuarios(), Store.listPlanejamentos(COMPS), Store.listSolicParceiro()]).then(function (r) {
      SETORES = r[0]; USERS = r[1]; PLANOS = r[2]; SOLIC = r[3] || [];
      var ids = []; PLANOS.forEach(function (pl) { vivos(pl).forEach(function (i) { if (i.atividadeId && ids.indexOf(i.atividadeId) < 0) { ids.push(i.atividadeId); } }); });
      return Store.listOccPorAtividades(ids).then(function (occs) { OCC = {}; occs.forEach(function (o) { if (!o || !o.atividadeId || o.status === 'pulada') { return; } var atual = OCC[o.atividadeId]; if (!atual || String(o.data || '') < String(atual.data || '')) { OCC[o.atividadeId] = o; } }); });
    });
  }
  Guard.onReady(function (u) {
    USER = u;
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Planejamento', user: USER }), app.firstChild);
    document.getElementById('pl-mav').appendChild(UI.avatar({ initials: USER.initials, size: 40 }));
    setState('Carregando o planejamento…', 'Lendo setores, pessoas e planos.');
    reload().then(function () {
      var qs = String(location.search || ''), m = qs.match(/[?&]setor=([A-Z0-9]+)/i), mc = qs.match(/[?&]comp=(\d{4}-\d{2})/), mi = qs.match(/[?&]item=([A-Za-z0-9_-]+)/); var ms = minhaSigla();
      var compQ = mc && COMPS.indexOf(mc[1]) >= 0 ? mc[1] : COMPS[1];
      if (m && planoDe(m[1].toUpperCase(), compQ)) { FOCO = { sig: m[1].toUpperCase(), comp: compQ }; if (mi) { ABERTOS[mi[1]] = true; } }
      else if (ms) { FOCO = { sig: ms, comp: COMPS[1] }; }
      render();
    }).catch(function (e) { setState('Não consegui carregar o planejamento.', (e && e.message) || 'Erro ao ler o banco.'); });
  });
  }());
  </script>
