<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Planejamento — GERA</title>

<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
<script src="mnav.js"></script>

<style>
/* ============================================================
   PLANEJAMENTO DO SETOR (R4 · Bloco 3) — zero hex (theme.css)
   ============================================================ */
/* R6/bug: .ui-app não existe em components.css nem aqui → sem flex a sidebar virava
   bloco de linha inteira e o conteúdo caía ABAIXO dela (buraco branco de ~600px).
   Mesmo padrão que inteligencia.html (.pf-app) e importacao.html (.im-app) já usam. */
.ui-app{display:flex;min-height:100vh;background:var(--bg)}
.ui-app>.ui-side{position:sticky;top:0;height:100vh}
.pl-main{flex:1;min-width:0;padding:22px 26px 90px}
.pl-top{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.pl-title{font-size:19px;font-weight:800;margin:0}
.pl-compnav{display:flex;align-items:center;gap:6px;margin-left:4px}
.pl-compbtn{appearance:none;border:1px solid var(--border);background:var(--s2);color:var(--text);border-radius:8px;width:28px;height:28px;cursor:pointer;font-size:14px;font-weight:800;display:inline-flex;align-items:center;justify-content:center}
.pl-comp{font-size:13px;font-weight:800;min-width:86px;text-align:center}
.pl-actions{margin-left:auto;display:flex;gap:8px;align-items:center}
.pl-i{appearance:none;border:0;background:transparent;color:var(--muted);cursor:pointer;padding:3px;min-width:24px;min-height:24px;display:inline-flex;align-items:center;justify-content:center}
.pl-i:hover{color:var(--text)}
.pl-legenda{font-size:11px;color:var(--muted);margin:-6px 0 14px}
.pl-eixo{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
@media(max-width:860px){.pl-eixo{grid-template-columns:1fr}.pl-main{padding:16px 14px 110px}}
.pl-card{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.pl-card-h{display:flex;align-items:center;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.pl-card-t{font-size:13.5px;font-weight:800}
.pl-count{font-size:11px;font-weight:800;color:var(--muted);background:var(--chipBg);border-radius:20px;padding:2px 8px}
/* R6/design — herói: a tela responde a pergunta no topo (título = conclusão) */
.pl-hero{display:flex;align-items:center;gap:16px;background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:16px 18px;margin-bottom:12px}
.pl-hero-n{font-size:40px;font-weight:900;line-height:1;letter-spacing:-1px;white-space:nowrap}
.pl-hero-den{font-size:18px;font-weight:800;color:var(--muted2Text)}/* item 16: --muted2 como texto dá 3,58:1 no escuro */
.pl-hero-t{font-size:15px;font-weight:800;line-height:1.3}
.pl-hero-s{font-size:12px;color:var(--muted);margin-top:3px}
@media (max-width:480px){.pl-hero{flex-direction:column;align-items:flex-start;gap:8px}.pl-hero-n{font-size:32px}}
.pl-empty{font-size:12px;color:var(--muted);padding:4px 0}
.pl-linha{display:flex;align-items:center;gap:10px;padding:7px 0;border-top:1px solid var(--border)}
.pl-linha:first-of-type{border-top:0}
.pl-l-dot{width:7px;height:7px;border-radius:50%;flex:none}
.pl-l-t{flex:1;min-width:0;font-size:12.5px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pl-l-m{font-size:11px;font-weight:700;color:var(--muted);white-space:nowrap}
.pl-l-det{font-size:11px;line-height:1.45;color:var(--muted);padding:0 0 7px 17px}
.pl-badge{font-size:10.5px;font-weight:800;border-radius:20px;padding:2px 8px;background:var(--chipBg);white-space:nowrap}
.pl-srow{border-top:1px solid var(--border);padding:12px 2px}
.pl-srow:first-of-type{border-top:0}
.pl-shead{display:flex;align-items:center;gap:10px;cursor:pointer;flex-wrap:wrap}
.pl-sname{font-size:13px;font-weight:800}
.pl-smeta{font-size:11px;font-weight:700;color:var(--muted)}
.pl-aceitas>summary{cursor:pointer;min-height:24px;display:flex;align-items:center;gap:4px;list-style:revert}
.pl-aceitas>summary:focus-visible{outline:2px solid var(--greenText);outline-offset:2px;border-radius:4px}
.pl-aceitas[open]>summary{margin-bottom:2px}
.pl-nota{font-size:12px;font-weight:800;margin-left:auto;display:inline-flex;align-items:center;gap:4px}
.pl-grade{margin-top:10px;overflow:auto}
.pl-tb{width:100%;border-collapse:collapse;font-size:12px;min-width:640px}
.pl-tb th{font-size:10.5px;font-weight:800;color:var(--muted);text-align:left;padding:6px 8px;border-bottom:1px solid var(--border);text-transform:uppercase;letter-spacing:.04em}
.pl-tb td{padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
.pl-tb tr:last-child td{border-bottom:0}
.pl-acao{appearance:none;border:0;background:transparent;color:var(--doing);cursor:pointer;font:inherit;font-size:11px;font-weight:800;padding:4px 8px;min-height:24px}
.pl-acao.red{color:var(--red)}
.pl-acao.green{color:var(--green)}
.pl-acao.muted{color:var(--muted2Text);font-weight:700}/* R6/fix16: ações secundárias sem peso de primária · item 16: --muted2 reprova contraste */
.pl-acao-del{appearance:none;border:0;background:transparent;cursor:pointer;color:var(--muted);font-size:14px;font-weight:700;padding:4px 8px;min-height:24px;margin-left:10px}
.pl-acao-del:hover{color:var(--red)}/* destrutivo só acende no hover — não compete com "realizar" */
.pl-foot{display:flex;gap:8px;align-items:center;margin-top:10px;flex-wrap:wrap}
.pl-state{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:34px 20px;text-align:center}
.pl-state-t{font-size:14px;font-weight:800;margin-bottom:6px}
.pl-state-s{font-size:12px;color:var(--muted);margin-bottom:12px}
.pl-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--s2);border:1px solid var(--border);color:var(--text);font-size:12.5px;font-weight:700;padding:9px 16px;border-radius:10px;z-index:80;box-shadow:var(--cardShadow)}
.pl-toast.err{color:var(--red)}
.pl-pop{position:fixed;z-index:70;background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:12px 14px;max-width:340px;max-height:calc(100vh - 24px);overflow:auto;font-size:12px;display:none;box-shadow:var(--cardShadow)}
.pl-pop.on{display:block}
.pl-pop:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.pl-aviso{background:var(--s2);border:1px solid var(--amber);border-left-width:4px;border-radius:10px;padding:10px 14px;margin-bottom:14px;font-size:13px;font-weight:600;color:var(--text);line-height:1.5}
.pl-pop-fech{margin-top:12px;width:100%;min-height:32px;background:var(--s3);color:var(--text);border:1px solid var(--border);border-radius:8px;font-size:12px;font-weight:700;cursor:pointer}
.pl-pop-fech:hover{background:var(--s1)}
.pl-pop-k{font-size:10px;font-weight:800;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;margin-top:8px}
.pl-pop-k:first-child{margin-top:0}
.pl-pop-v{color:var(--text);font-weight:600;line-height:1.45}
.pl-backdrop{position:fixed;inset:0;z-index:69;display:none}
.pl-backdrop.on{display:block}
/* R7·item 22 — sugeridos pelos manuais */
.pl-sug{margin:2px 0 12px;display:flex;flex-direction:column;gap:6px}
.pl-sug-h{display:flex;align-items:center;gap:8px}
.pl-sug-l{display:flex;align-items:flex-start;gap:10px;padding:8px 10px;border:1px solid var(--border);border-radius:10px;background:var(--s2)}
.pl-sug-l .pl-badge{flex:none;margin-top:2px}
.pl-sug-m{flex:1;min-width:0;font-size:13px;line-height:1.45}
.pl-sug-l .pl-acao{flex:none}
@media (max-width:640px){.pl-sug-l{flex-wrap:wrap}}
/* R7·item 21 — grupos raiz → subsetores */
.pl-gsubs{margin-left:16px;border-left:2px solid var(--border);padding-left:8px}
.pl-ssub .pl-sname{font-weight:600}

/* ============================================================
   R8 — correções de acessibilidade, contraste e legibilidade
   (tokens do theme.css; zero hex e zero rgba nesta tela)
   ============================================================ */
/* item 16 — .ui-fhint vem do components.css, que é APPEND-ONLY: --muted2 como
   TEXTO dá 3,58:1 sobre o fundo do diálogo no tema escuro e reprova o 1.4.3.
   Sobrescrito aqui, na própria tela, pelo token de texto legível. */
.ui-fhint{color:var(--muted2Text)}
/* item 20 — utilitário "só para leitor de tela" (padrão .sr-only) */
.pl-sr{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
/* item 19 — heading DE VERDADE sem mudar a aparência: o navegador acrescenta
   margem, tamanho e peso ao h2/h3; aqui zeramos e devolvemos o valor da classe. */
h2.pl-card-t,h2.pl-hero-t,h3.pl-sname{margin:0;font-size:inherit;font-weight:inherit}
h2.pl-card-t{font-size:13.5px;font-weight:800}
h2.pl-hero-t{font-size:15px;font-weight:800;line-height:1.3}
h3.pl-sname{font-size:13px;font-weight:800}
/* item 21 — a grade rola na horizontal: sem foco, quem usa só teclado nunca
   alcança as últimas colunas (WCAG 2.1.1). Focável + contorno visível. */
.pl-grade:focus-visible{outline:2px solid var(--brand);outline-offset:2px;border-radius:8px}
/* item 27 — célula de texto longo: 2 linhas + "ver tudo". O nowrap de .pl-l-m
   empurrava 250 caracteres numa linha só e detonava a largura da grade. */
.pl-cel-long{font-size:11px;font-weight:700;color:var(--muted);line-height:1.35;max-width:260px}
.pl-cel-long .pl-clamp{display:-webkit-box;-webkit-line-clamp:2;line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.pl-vertudo{appearance:none;border:0;background:transparent;color:var(--doing);cursor:pointer;font:inherit;font-size:10.5px;font-weight:800;padding:2px 0;min-height:24px}
/* item 14 — estouro de orçamento com TEXTO: cor sozinha reprova WCAG 1.4.1 e
   o title não abre no toque nem no leitor de tela. */
.pl-estouro{display:inline-block;margin-left:6px;font-size:10.5px;font-weight:800;color:var(--amber);white-space:nowrap}
/* item 6 — setor sem plano NENHUM entra no ranking, no topo e marcado */
.pl-semplano{color:var(--bandaCritica);font-weight:800}
/* item 28 — risco ACEITO é a decisão mais grave da tela: peso de título de cartão */
.pl-aceitas>summary.pl-card-t{font-size:13.5px;font-weight:800;color:var(--text)}
/* item 23 — quem pediu menos movimento não leva rolagem animada */
@media (prefers-reduced-motion: reduce){
  *{scroll-behavior:auto !important}
}
</style>
</head>
<body>
  <div class="ui-app" id="app">
    <!-- sidebar via JS -->
    <main class="pl-main">
      <div class="pl-top">
        <h1 class="pl-title" id="pl-title">Plano do setor — O quê · Como · Quem · Quando · Quanto</h1>
        <div class="pl-compnav">
          <button class="pl-compbtn" id="pl-prev" type="button" aria-label="Mês anterior">‹</button>
          <div class="pl-comp" id="pl-comp">—</div>
          <button class="pl-compbtn" id="pl-next" type="button" aria-label="Próximo mês">›</button>
        </div>
        <span id="pl-info"></span>
        <div class="pl-actions" id="pl-actions"></div>
      </div>
      <div class="pl-legenda">Previsto × realizado do setor — visível a todos. Entrega até o <b>dia 25</b> do mês anterior.</div><!-- R6/design: manual completo mora no "i" do eixo, não na tela (Krug) -->
      <div id="pl-body"></div>
    </main>
  </div>

  <div class="pl-backdrop" id="pl-backdrop"></div>
  <!-- item 22: o "i" é um diálogo de verdade — aria-modal + prisão de foco no JS -->
  <div class="pl-pop" id="pl-pop" role="dialog" aria-modal="true" tabindex="-1"></div>

  <script src="ui.js"></script>
  <script src="riscos-catalogo.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script type="module">
  (function () {
  'use strict';

  /* ============================================================
     PLANO DO SETOR · Sistema A · Grau Técnico FSA
     R4 · BLOCO 3 — entidade nova (RESUMO §4, desenho travado R3/R4):
       - Plano mensal do líder — O quê · Como · Quem · Quando · Quanto
         (4W+1H; previsto × realizado) — grade estilo Excel.
         NOME CORRIGIDO NA R8: a tela nunca coletou Onde nem Por quê,
         então chamá-la de "5W2H" era rótulo falso. Decisão travada:
         NÃO acrescentar campos (o objetivo é reduzir o esforço de
         preenchimento) — corrigir o NOME.
       - Entrega até o dia 25 do mês anterior (KPI.planejamentoPrazo:
         D-5 líder · D-3 gestão · D-0 flag — NUNCA bloqueia).
       - Visível a TODOS (line-of-sight público). Edição: gestor em
         tudo; líder no próprio escopo (KPI.escopoLider — raiz cobre
         subsetores).
       - Alçada R$200 (KPI.planejamentoItemTravado): item >R$200 trava
         até aprovGestor E aprovSocio (paralelo — quem cria não assina;
         RESUMO §4/O4 + four-eyes de mercado); o PLANO nunca trava.
       - Item aberto travado = CLOCK-PAUSE na nota (não conta no
         denominador enquanto espera — padrão SLA "Awaiting approval").
       - "Não realizei" com motivo obrigatório (lista O3 do RESUMO +
         Outro com detalhe); reabrir limpa. naoFeito derruba aderência.
       - Fase D-3/D-0 sem entrega: gestor tem botão de cobrança manual
         (WhatsApp/E-mail com texto pronto — padrão 3 canais F1-E).
       - Nota mensal 50/30/20 (KPI.planejamentoNota) + ranking "quem
         precisa de atenção". Tudo com "i" (fórmula+dados+números).
       - Fora das 3 lentes (eixo próprio VEM×FOI — decisão travada).
     Fundamentos: where()+limit() sempre · SIGLA nunca ID · status e
     nota DERIVADOS (nunca gravados) · toda mutação em atividade_log ·
     dia civil local (R.hojeISO) · soft-remove de item (removido:true).
     ============================================================ */

  /* ============================================================
     item 13 · REDE DE SEGURANÇA DE DEPENDÊNCIA
     ------------------------------------------------------------
     recorrencia.js / kpi.js / ui.js / guard.js EXISTEM em produção. Mas se um
     deles não chegar (rede caiu no meio do carregamento, cache corrompido,
     deploy incompleto), a primeira chamada — R.hojeISO() — lança TypeError
     DENTRO do Guard.onReady, ninguém pega, e a tela fica BRANCA e MUDA: o
     líder acha que não tem plano, o gestor acha que ninguém entregou.
     Aqui a falta vira um estado de erro legível que DIZ o que faltou.
     ============================================================ */
  var FALTOU = [];
  if (!window.GrautRecorrencia) { FALTOU.push('recorrencia.js — calendário e dia civil'); }
  if (!window.KPI) { FALTOU.push('kpi.js — prazo, nota e Pareto'); }
  if (!window.UI) { FALTOU.push('ui.js — botões, campos e diálogos'); }
  if (!window.Guard) { FALTOU.push('guard.js — login e perfil'); }
  if (FALTOU.length) {
    var alvoErr = document.getElementById('pl-body');
    if (alvoErr) {
      alvoErr.innerHTML = '';
      var caixaErr = document.createElement('div');
      caixaErr.className = 'pl-state';
      caixaErr.setAttribute('role', 'alert');
      var tErr = document.createElement('div');
      tErr.className = 'pl-state-t';
      tErr.textContent = 'Esta tela não carregou por inteiro';
      caixaErr.appendChild(tErr);
      var sErr = document.createElement('div');
      sErr.className = 'pl-state-s';
      sErr.textContent = 'Faltaram arquivos do sistema, então NADA aqui pode ser considerado correto — não use como base de decisão. Recarregue a página (Ctrl+F5). Se continuar, avise a gestão informando o que faltou:';
      caixaErr.appendChild(sErr);
      var lErr = document.createElement('ul');
      lErr.style.textAlign = 'left';
      lErr.style.margin = '10px auto 0';
      lErr.style.maxWidth = '420px';
      FALTOU.forEach(function (nome) {
        var li = document.createElement('li');
        li.className = 'pl-state-s';
        li.style.marginBottom = '4px';
        li.textContent = nome;
        lErr.appendChild(li);
      });
      caixaErr.appendChild(lErr);
      alvoErr.appendChild(caixaErr);
    }
    return; /* nada mais roda: sem estes arquivos toda conta desta tela seria mentira */
  }

  var R = window.GrautRecorrencia;
  var USER = null;

  var _fb = null;
  function fb() {
    if (!_fb) {
      _fb = Promise.all([
        import('./firebase.js'),
        import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
      ]).then(function (m) { return { db: m[0].db, f: m[1] }; });
    }
    return _fb;
  }
  function ferr(e) {
    var code = (e && e.code) || '';
    if (code === 'permission-denied') { return Object.assign(new Error('Você não tem permissão para ver ou alterar este planejamento. Confirme seu perfil com o gestor.'), { code: code }); }
    if (code === 'unavailable' || code === 'failed-precondition' || code === 'deadline-exceeded') { return Object.assign(new Error('Não consegui falar com o banco agora. Verifique a conexão e tente de novo.'), { code: code }); }
    return Object.assign(new Error('Não foi possível acessar o planejamento agora. Tente de novo em alguns instantes; se persistir, avise a gestão.'), { code: code });
  }
  function mapDocs(snap) { var a = []; snap.forEach(function (d) { var o = d.data() || {}; o.id = d.id; a.push(o); }); return a; }

  /* Teto de leitura: as consultas pedem SEMPRE 1 a mais que o teto. Se o extra vier, é
     porque a tela está escondendo registro — e isso não pode acontecer em silêncio numa
     tela de prestação de contas (a nota e o ranking sairiam errados sem ninguém saber). */
  var AVISOS = [];
  var TETO = { setores: 200, planejamentos: 100, usuarios: 300 };
  function cortar(lista, chave, oQue) {
    var teto = TETO[chave];
    if (lista.length > teto) {
      AVISOS.push('Esta tela mostra no máximo ' + teto + ' ' + oQue + ', e existem mais que isso. Os números abaixo estão INCOMPLETOS — avise a gestão antes de usar como base de decisão.');
      return lista.slice(0, teto);
    }
    return lista;
  }

  var Store = {
    listSetores: function () {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var q = f.query(f.collection(db, 'setores'), f.where('ativo', '==', true), f.limit(TETO.setores + 1));
        return f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var o = d.data() || {}; o.sigla = o.sigla || d.id; a.push(o); });
          a.sort(function (x, y) { return (x.sigla || '').localeCompare(y.sigla || '', 'pt-BR'); });
          return cortar(a, 'setores', 'setores');
        });
      }).catch(function (e) { throw ferr(e); });
    },
    listUsuariosAtivos: function () {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var q = f.query(f.collection(db, 'usuarios'), f.where('ativo', '==', true), f.limit(TETO.usuarios + 1));
        return f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var u = d.data() || {}; a.push({ uid: d.id, nome: u.nome || '(sem nome)', email: u.email || '', perfil: u.perfil || '', setoresLiderados: Array.isArray(u.setoresLiderados) ? u.setoresLiderados : [] }); });
          a.sort(function (x, y) { return (x.nome || '').localeCompare(y.nome || '', 'pt-BR'); });
          return cortar(a, 'usuarios', 'pessoas');
        });
      }).catch(function () { return []; }); /* líder pode não listar — degrada p/ campo livre */
    },
    listPlanejamentos: function (comp) {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var q = f.query(f.collection(db, 'planejamentos'), f.where('competencia', '==', comp), f.limit(TETO.planejamentos + 1));
        return f.getDocs(q).then(mapDocs).then(function (a) {
          return cortar(a, 'planejamentos', 'planos por mês').filter(function (p) { return p.ativo !== false; });
        });
      }).catch(function (e) { throw ferr(e); });
    },
    criarPlanejamento: function (doc) {
      return fb().then(function (c) {
        var db = c.db, f = c.f, now = Date.now();
        var body = Object.assign({}, doc, { ativo: true, criadoPor: USER.uid, criadoEm: now, atualizadoEm: now });
        return f.addDoc(f.collection(db, 'planejamentos'), body).then(function (ref) {
          Store.log({ acao: 'planejamento_criado', entidade: 'planejamento', refId: ref.id, antes: null, depois: { setorSigla: body.setorSigla, competencia: body.competencia } });
          return ref.id;
        });
      }).catch(function (e) { throw ferr(e); });
    },
    atualizarPlanejamento: function (id, patch, acao, antes) {
      return fb().then(function (c) {
        var db = c.db, f = c.f, agora = Date.now();
        var up = Object.assign({}, patch, { atualizadoEm: agora });
        return f.updateDoc(f.doc(db, 'planejamentos', id), up).then(function () {

  /* ===================== HERÓI: adesão dos planos (R6/design) =====================
     Título = a conclusão (Minto): a tela responde "quantos setores entregaram?" no topo.
     Cor pelo sinal: ≥80% verde · ≥50% âmbar · <50% vermelho. */
  function renderHero() {
    /* R6/auditoria: ENTREGUE = tem entregueEm E tem ao menos 1 item. Rascunho NÃO conta
       como entregue (o badge da lista abaixo diria "Rascunho" e o número brigaria com ela). */
    /* item 5 — o NUMERADOR conta APENAS plano de setor OBRIGADO. PLANOS traz
       qualquer plano da competência, inclusive de setor desativado depois (plano
       ÓRFÃO) e de setor ativo sem líder (plano VOLUNTÁRIO): sem o filtro,
       "falta = t − n" podia ficar NEGATIVO e o herói dizia "-2 setores sem plano
       entregue". Nada some em silêncio — os dois casos viram aviso no topo. */
    var ob = obrigadosEntrega();
    var t = ob.siglas.length;
    var ativa = {};
    SETORES.forEach(function (s) { ativa[s.sigla] = true; });
    var planosObrig = PLANOS.filter(function (p) { return !!ob.mapa[p.setorSigla]; });
    var entregues = planosObrig.filter(function (p) {
      /* itensVivos ignora os removidos (soft-delete): um plano cujos itens foram todos
         apagados NÃO pode contar como "entregue com ao menos 1 item", que é o que o "i" promete. */
      return p.entregueEm && itensVivos(p).length > 0;
    });
    var n = entregues.length;
    var rascunhos = planosObrig.filter(function (p) { return !p.entregueEm; }).length;
    var entreguesVazios = planosObrig.length - n - rascunhos;
    var orfaos = PLANOS.filter(function (p) { return !ativa[p.setorSigla]; }).length;
    var voluntarios = PLANOS.filter(function (p) { return !!ativa[p.setorSigla] && !ob.mapa[p.setorSigla]; }).length;
    var falta = Math.max(0, t - n);
    var pct = t ? n / t : 0;
    var cor = pct >= 0.8 ? 'var(--green)' : (pct >= 0.5 ? 'var(--amber)' : 'var(--red)');
    var titulo, sub;
    if (n === t && t > 0) {
      titulo = (t === 1 ? 'O único setor entregou' : 'Todos os ' + t + ' setores entregaram') + ' o plano de ' + compLabel(COMP);
      sub = 'Planejamento completo — acompanhe os desfechos em O QUE FOI.';
    } else {
      titulo = (pct < 0.5 ? 'Só ' : '') + n + ' de ' + t + (n === 1 ? ' setor entregou' : ' setores entregaram') + ' o plano de ' + compLabel(COMP);
      sub = plural(falta, 'setor sem plano entregue', 'setores sem plano entregue')
          + (rascunhos ? ' — sendo ' + plural(rascunhos, 'em rascunho', 'em rascunho') : '')
          + (entreguesVazios ? ' — e ' + plural(entreguesVazios, 'entregue sem nenhum item', 'entregues sem nenhum item') : '')
          + '. Desça até a lista e cobre os líderes.';
    }
    /* O denominador é "quem DEVE entregar", não "quem existe": se houver setor
       ativo fora da conta, o herói DIZ quantos são — senão a diferença entre o
       número de cima e a lista de baixo pareceria erro de conta. */
    var foraDaConta = SETORES.length - t;
    if (foraDaConta > 0) {
      sub += ' ' + plural(foraDaConta, 'setor ativo está FORA desta conta', 'setores ativos estão FORA desta conta')
           + ' (sem líder designado — ninguém a cobrar). O aviso no topo nomeia quais.';
    }
    var hero = el('<div class="pl-hero"></div>');
    var num = el('<div class="pl-hero-n">' + n + '<span class="pl-hero-den">/' + t + '</span></div>');
    num.style.color = cor;
    num.setAttribute('aria-hidden', 'true'); /* o título ao lado já diz "n de t" por extenso */
    hero.appendChild(num);
    var tx = el('<div></div>');
    var ht = txt('h2', 'pl-hero-t', titulo); ht.style.color = cor;/* item 19: heading de verdade */
    tx.appendChild(ht);
    tx.appendChild(txt('div', 'pl-hero-s', sub));
    hero.appendChild(tx);
    hero.appendChild(iBtn('Adesão do plano do mês', [
      ['Fórmula', 'Planos ENTREGUES (com data de entrega e ao menos 1 item) de setor OBRIGADO ÷ setores OBRIGADOS. Aqui: ' + n + ' ÷ ' + t + ' = ' + Math.round(pct * 100) + '%.'],
      ['Quem é OBRIGADO a entregar', ob.semBase
        ? ('Não foi possível montar a lista de quem lidera cada setor (seu perfil não lista usuários, ou nenhum líder tem setor no cadastro). Sem essa base, o denominador cai no piso honesto: TODOS os ' + t + ' setores ativos. O aviso no topo da tela declara isso — trate o número como teto, não como cobrança.')
        : ('O setor ativo que tem líder PRÓPRIO no cadastro (a sigla dele aparece em "setores liderados" de alguém ativo): ' + plural(t, 'setor', 'setores') + '. Subsetor sem líder próprio NÃO entrega plano separado — o trabalho dele rola para o plano do setor-pai, igual à regra de escopo do RBAC. Antes o denominador era "quem PODE criar plano" (os ' + SETORES.length + ' setores ativos, raiz e subsetor): o número nascia vermelho e não tinha como ficar verde nunca.')],
      ['Dados', 'Os planos de ' + compLabel(COMP) + ' (entregues, com pelo menos 1 item não apagado) comparados aos ' + plural(t, 'setor obrigado', 'setores obrigados') + '. NÃO contam como entregues: ' + plural(rascunhos, 'plano em rascunho', 'planos em rascunho') + ' e ' + plural(entreguesVazios, 'entregue sem nenhum item', 'entregues sem nenhum item') + '.'],
      ['Plano órfão', orfaos
        ? (plural(orfaos, 'plano é de setor que não existe mais', 'planos são de setor que não existe mais') + ' (setor desativado depois da criação). Ele NÃO entra nem no numerador nem no denominador e NÃO aparece na lista abaixo — o aviso no topo da tela nomeia o caso.')
        : 'Nenhum plano deste mês pertence a setor desativado. Se existisse, ele ficaria FORA da conta e apareceria como aviso no topo da tela.'],
      ['Plano voluntário', voluntarios
        ? (plural(voluntarios, 'plano foi criado por setor ATIVO que não é obrigado', 'planos foram criados por setores ATIVOS que não são obrigados') + ' (setor sem líder próprio). Ele aparece normalmente na lista abaixo e vale como trabalho, mas fica FORA do numerador: entrada voluntária não pode inflar uma taxa de cobrança.')
        : 'Nenhum plano deste mês veio de setor ativo fora da lista de obrigados. Se viesse, apareceria na lista abaixo, mas fora desta conta.'],
      ['O que diz', 'Quantos setores obrigados já ENTREGARAM o plano do mês. Verde ≥80% · âmbar ≥50% · vermelho <50%.'],
      ['Para que serve', 'Cobrança de prestação de contas: quem está sem plano aparece na lista abaixo com o farol de prazo (D-5/D-3/D-0).']
    ]));
    bodyEl.appendChild(hero);
  }
  /* ============================================================
     item 5 e item 12 · AVISOS DERIVADOS DO DADO
     ------------------------------------------------------------
     AVISOS (o array de cima) guarda o aviso de leitura TRUNCADA, que nasce na
     carga. Estes aqui nascem do cruzamento dos dados e são recalculados a cada
     render — por isso ficam separados, senão duplicariam a cada desenho de tela.
     Regra da casa: numa tela de prestação de contas, nada falha em silêncio.
     ============================================================ */
  function avisosDerivados() {
    var out = [];
    var ativa = {};
    SETORES.forEach(function (s) { ativa[s.sigla] = true; });
    var orfaos = PLANOS.filter(function (p) { return !ativa[p.setorSigla]; });
    if (orfaos.length) {
      out.push('Existe plano de setor que NÃO está mais ativo no cadastro: '
        + orfaos.map(function (p) { return p.setorSigla; }).join(', ')
        + '. Esse plano NÃO entra nos números desta tela (nem no numerador, nem no denominador) e NÃO aparece na lista de setores. Reative o setor no cadastro, ou trate o plano como encerrado.');
    }
    /* item 5 — o denominador do herói encolheu de "quem PODE criar plano" para
       "quem DEVE entregar". Encolher denominador SEM dizer nada seria maquiar a
       taxa: quem ficou de fora tem de aparecer aqui, com nome. */
    var ob = obrigadosEntrega();
    if (ob.semBase) {
      out.push('Não consegui montar a lista de quem lidera cada setor (o seu perfil não lista usuários, ou nenhum líder tem setor no cadastro). Sem essa base, o número do topo divide por TODOS os ' + SETORES.length + ' setores ativos — inclusive subsetores que talvez não devessem entregar plano próprio. Leia o percentual como PISO, não como cobrança, e peça à gestão para preencher "setores liderados" no cadastro de usuários.');
    } else {
      var semLider = SETORES.filter(function (s) { return !ob.mapa[s.sigla]; }).map(function (s) { return s.sigla; });
      if (semLider.length) {
        out.push('Estes setores ativos NÃO têm líder designado no cadastro: ' + semLider.join(', ')
          + '. Como não há a quem cobrar, eles ficam FORA da conta do topo (nem no numerador, nem no denominador) — mas continuam na lista de setores abaixo. Designe o líder no cadastro de usuários, ou desative o setor: setor ativo sem dono não presta contas a ninguém.');
      }
      var volunt = PLANOS.filter(function (p) { return !!ativa[p.setorSigla] && !ob.mapa[p.setorSigla]; }).map(function (p) { return p.setorSigla; });
      if (volunt.length) {
        out.push('Estes setores criaram plano mesmo sem líder designado: ' + volunt.join(', ')
          + '. O trabalho vale e aparece na lista abaixo, mas fica FORA da taxa de entrega do topo — entrega voluntária não pode inflar uma taxa de cobrança. Designe o líder para que o setor passe a ser contado.');
      }
    }
    if (CATALOGO_FALTOU) {
      out.push('O catálogo de riscos dos manuais (riscos-catalogo.js) não carregou. As sugestões de item vindas de risco estão DESLIGADAS nesta tela: "nenhum risco a tratar" aqui significa apenas "não consegui ler os riscos". Recarregue a página; se continuar, avise a gestão.');
    } else {
      var semMapa = SETORES.filter(function (s) {
        if (s.setorPaiSigla) { return false; } /* subsetor herda o mapeamento do raiz */
        return !Object.keys(RISCO_SETOR_SIGLA).some(function (k) { return RISCO_SETOR_SIGLA[k] === s.sigla; });
      }).map(function (s) { return s.sigla; });
      if (semMapa.length) {
        out.push('Estes setores raiz não têm matriz de risco ligada aos manuais: ' + semMapa.join(', ')
          + '. Eles nunca receberão sugestão de item vinda de risco — não porque estejam sem risco, mas porque falta o mapeamento. Avise a gestão para incluí-los.');
      }
    }
    return out;
  }

  /* ===================== EIXO: O QUE VEM × O QUE FOI ===================== */
  function nomeSetor(sig) {
    var s = SETORES.filter(function (x) { return x.sigla === sig; })[0];
    return s ? (s.nome || sig) : sig;
  }
  function todosItens() {
    var out = [];
    /* item 5 — plano de setor desativado (órfão) fica FORA de todos os números
       desta tela; ele é denunciado no aviso do topo, não misturado na conta. */
    var ativa = {};
    SETORES.forEach(function (s) { ativa[s.sigla] = true; });
    PLANOS.forEach(function (p) {
      if (!ativa[p.setorSigla]) { return; }
      itensVivos(p).forEach(function (i) { out.push({ item: i, plano: p }); });
    });
    return out;
  }

    var c1 = el('<div class="pl-card"></div>');
    var h1 = el('<div class="pl-card-h"></div>');
    h1.appendChild(tituloCartao('O QUE VEM'));
    h1.appendChild(txt('span', 'pl-count', plural(vem.length, 'previsto', 'previstos')));
    /* item 31 — os dois cartões tinham botões "i" com o MESMO rótulo
       ("O QUE VEM × O QUE FOI"): na lista de elementos do leitor de tela viravam
       duas entradas idênticas, impossíveis de distinguir. */
    h1.appendChild(iBtn('O QUE VEM — o que ainda vai acontecer', I_EIXO));
    c1.appendChild(h1);
    if (!vem.length) { c1.appendChild(txt('div', 'pl-empty', 'Nenhum item previsto para esta competência. Adicione itens no plano do seu setor — ou navegue de mês em ‹ ›.')); }
    vem.slice(0, 12).forEach(function (x) {
      var lin = el('<div class="pl-linha"></div>');
      var vencido = x.item.quandoPrevisto && x.item.quandoPrevisto < HOJE;

      var dot = el('<div class="pl-l-dot"></div>');
      dot.style.background = vencido ? 'var(--red)' : hojeE ? 'var(--amber)' : 'var(--doing)';
      dot.setAttribute('aria-hidden', 'true');
      lin.appendChild(dot);
      lin.appendChild(txt('div', 'pl-l-t', '[' + x.plano.setorSigla + '] ' + (x.item.oque || '(sem título)')));
      if (KPI.planejamentoItemTravado(x.item)) {

      }
      /* item 18 — "atrasado" existia SÓ na cor da bolinha (WCAG 1.4.1: cor não

      var marcaPrazo = vencido ? ' · atrasado' : (hojeE ? ' · hoje' : '');
      var dPrev = txt('div', 'pl-l-m', fmtBR(x.item.quandoPrevisto) + marcaPrazo);
      if (vencido) { dPrev.style.color = 'var(--red)'; } else if (hojeE) { dPrev.style.color = 'var(--amber)'; }
      lin.appendChild(dPrev);
      lin.appendChild(txt('div', 'pl-l-m', x.item.quemNome || '—'));
      wrapLinha(lin, x.plano.setorSigla);
      c1.appendChild(lin);
    });
    if (vem.length > 12) { c1.appendChild(txt('div', 'pl-empty', '+ ' + (vem.length - 12) + ' — abra o setor abaixo para ver todos.')); }
    wrap.appendChild(c1);

    /* --- O QUE FOI --- */
    /* item 3 — era new Date(...).toISOString().slice(0,10), que é UTC: o item
       marcado às 22h do dia 03 em Salvador (UTC−3) virava 04 e ORDENAVA errado. */
    function dtDesfecho(x) { return x.item.quandoRealizado || (x.item.naoFeitoEm ? isoLocal(x.item.naoFeitoEm) : ''); }
    var foi = all.filter(function (x) { return !!x.item.quandoRealizado || !!x.item.naoFeito; })
      .sort(function (a, b) { return dtDesfecho(b).localeCompare(dtDesfecho(a)); });
    var c2 = el('<div class="pl-card"></div>');
    var h2 = el('<div class="pl-card-h"></div>');
    h2.appendChild(tituloCartao('O QUE FOI'));/* item 19: heading de verdade */
    h2.appendChild(txt('span', 'pl-count', plural(foi.length, 'desfecho', 'desfechos')));/* item 29 */
    /* item 31 — rótulo único: era 'O QUE VEM × O QUE FOI' nos DOIS cartões. */
    h2.appendChild(iBtn('O QUE FOI — o que já teve desfecho', I_EIXO));
    c2.appendChild(h2);
    if (!foi.length) { c2.appendChild(txt('div', 'pl-empty', 'Nenhum desfecho ainda. Ao marcar "✓ realizar" (ou "✗ não realizei") num item, ele aparece aqui.')); }
    foi.slice(0, 12).forEach(function (x) {
      var lin = el('<div class="pl-linha"></div>');
      var dot = el('<div class="pl-l-dot"></div>');
      lin.appendChild(dot);
      lin.appendChild(txt('div', 'pl-l-t', '[' + x.plano.setorSigla + '] ' + (x.item.oque || '(sem título)')));
      var detLin = null;
      if (x.item.naoFeito) {
        dot.style.background = 'var(--red)';
        /* O motivo fica VISÍVEL na linha (não só no hover: hover não existe no toque nem no leitor de tela). */
        var bn = txt('span', 'pl-badge', '✗ não realizado — ' + (x.item.motivo || 'sem motivo declarado'));
        bn.style.color = 'var(--red)';
        lin.appendChild(bn);
        if (x.item.motivoDetalhe) { detLin = txt('div', 'pl-l-det', x.item.motivoDetalhe); }
        /* item 3 — 2ª ocorrência do bug de UTC: usar a data CIVIL local. */
        lin.appendChild(txt('div', 'pl-l-m', x.item.naoFeitoEm ? fmtBR(isoLocal(x.item.naoFeitoEm)) : '—'));
      } else {

        /* item 18/29 — o atraso não pode viver só na cor: vem por extenso. */

        var bd = txt('span', 'pl-badge', desvio);
        bd.style.color = noPrazo ? 'var(--green)' : 'var(--orange)';
        lin.appendChild(bd);
        lin.appendChild(txt('div', 'pl-l-m', fmtBR(x.item.quandoRealizado)));
      }
      wrapLinha(lin, x.plano.setorSigla);
      c2.appendChild(lin);
      if (detLin) { c2.appendChild(detLin); }
    });
    if (foi.length > 12) { c2.appendChild(txt('div', 'pl-empty', '+ ' + (foi.length - 12) + ' — abra o setor abaixo para ver todos.')); }
    wrap.appendChild(c2);
    bodyEl.appendChild(wrap);

    /* --- R5-B2: PARETO DE MOTIVOS (só quando houver não-realizados) --- */
    var todosI = [];

    var par = KPI.paretoMotivos(todosI);
    if (par.length) {
      var pc = el('<div class="pl-card" style="margin-top:14px"></div>');

      ph.appendChild(tituloCartao('Motivos de não-realização (do mais frequente ao menos)'));
      var totalPar = par.reduce(function (s, x) { return s + x.n; }, 0);
      ph.appendChild(txt('span', 'pl-count', plural(totalPar, 'item não realizado', 'itens não realizados')));
      ph.appendChild(iBtn('Motivos de não-realização', I_PARETO));
      pc.appendChild(ph);
      var maxN = par[0].n;
      par.forEach(function (px) {
        var lin = el('<div style="display:flex;align-items:center;gap:10px;margin-top:6px"></div>');
        var lbl = txt('div', 'pl-l-m', px.motivo);
        lbl.style.flex = '0 0 220px';
        lin.appendChild(lbl);
        /* item 26 — o trilho ganhou min-width: é ELE que garante a legibilidade
           da barra pequena. O piso de 6% na barra mentia (1 item era desenhado
           com o tamanho de 6): proporção agora é proporção, sem piso. */
        var trilho = el('<div style="flex:1;min-width:160px;height:14px;border-radius:7px;background:var(--s1);overflow:hidden"></div>');
        var barra = el('<div style="height:100%;border-radius:7px;background:var(--red)"></div>');
        barra.style.width = (maxN ? (px.n / maxN * 100) : 0) + '%';
        trilho.appendChild(barra);
        lin.appendChild(trilho);
        lin.appendChild(txt('div', 'pl-l-m', px.n + '×'));
        pc.appendChild(lin);
      });

  }
  function wrapLinha(lin, sigla) {
    lin.style.cursor = 'pointer';
    /* Drill-down também pelo teclado (WCAG 2.1.1): sem role/tabindex/Enter, quem não usa mouse não sai do painel. */
    lin.setAttribute('role', 'button');
    lin.setAttribute('tabindex', '0');
    /* ============================================================
       item 17 · O RÓTULO INCLUI O CONTEÚDO — NÃO O SUBSTITUI
       ------------------------------------------------------------
       Com role="button" + aria-label, o leitor de tela ANULA os filhos e
       lê SÓ o rótulo: eram 24 linhas dizendo "Abrir o plano de CRA" e
       nenhuma dizendo o título do item, a data, o desvio ou o "✗ não
       realizado". O rótulo agora é o conteúdo da linha + a ação no fim.
       Chamada obrigatoriamente DEPOIS de montar os filhos.
       ============================================================ */
    var partes = [];
    var i, f, s;
    for (i = 0; i < lin.childNodes.length; i++) {
      f = lin.childNodes[i];
      s = (f.textContent || '').replace(/\s+/g, ' ').replace(/^ | $/g, '');
      if (s) { partes.push(s); }
    }
    var conteudo = partes.join('. ');
    var rotulo = (conteudo ? conteudo + '. ' : '') + 'Abrir o plano de ' + sigla;
    lin.setAttribute('aria-label', rotulo);
    lin.title = 'Abrir o plano de ' + sigla;
    function abrir() { ABERTOS[sigla] = true; render(); levarPara(document.getElementById('pl-s-' + sigla)); }
    lin.addEventListener('click', abrir);
    lin.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); abrir(); } });
  }
  function diffDias(a, b) {
    if (!a || !b) { return 0; }
    var d1 = Date.UTC(parseInt(a.slice(0, 4), 10), parseInt(a.slice(5, 7), 10) - 1, parseInt(a.slice(8, 10), 10));
    var d2 = Date.UTC(parseInt(b.slice(0, 4), 10), parseInt(b.slice(5, 7), 10) - 1, parseInt(b.slice(8, 10), 10));
    return Math.round((d2 - d1) / 86400000);
  }

  /* ===================== RANKING "quem precisa de atenção" ===================== */
  function renderRanking() {
    /* ============================================================
       item 6 · QUEM NÃO ENTREGOU NADA VINHA PRIMEIRO — DE FORA
       ------------------------------------------------------------
       O ranking nascia de PLANOS: quem NÃO criou plano não tem linha em
       PLANOS, logo SUMIA do cartão "quem precisa de atenção" — exatamente
       quem mais precisa. E quem criou um rascunho com 1 item aparecia com
       nota 20 no topo, como se fosse o pior caso. O pior caso é o vazio.
       Setor sem plano (ou com plano sem item ranqueável) entra ANTES de
       todos, marcado, dizendo o que aconteceu.
       ============================================================ */
    var ativa = {};
    SETORES.forEach(function (s) { ativa[s.sigla] = true; });
    var comNota = {};
    var linhas = PLANOS.filter(function (p) { return !!ativa[p.setorSigla]; }).map(function (p) {
      return { sigla: p.setorSigla, nota: KPI.planejamentoNota(itensVivos(p)) };
    }).filter(function (x) { return x.nota !== null; })
      .sort(function (a, b) { return a.nota.nota - b.nota.nota; });
    linhas.forEach(function (x) { comNota[x.sigla] = true; });
    var temPlano = {};
    PLANOS.forEach(function (p) { temPlano[p.setorSigla] = true; });
    /* item 5/6 — o cartão se chama "quem precisa de ATENÇÃO": ele cobra pessoa.
       Só entra na lista quem TEM a quem cobrar (setor obrigado) ou quem já
       criou plano. Acusar de "não entregou nada" um setor ativo que não tem
       líder designado seria cobrar do vazio — esse caso é do aviso do topo,
       que fala com a gestão, não do ranking, que fala com o líder. */
    var obR = obrigadosEntrega();
    var semNota = SETORES.filter(function (s) {
      return !comNota[s.sigla] && (obR.mapa[s.sigla] || temPlano[s.sigla]);
    }).map(function (s) {
      return { sigla: s.sigla, semPlano: !temPlano[s.sigla] };
    });
    if (!linhas.length && !semNota.length) { return; }
    var card = el('<div class="pl-card"></div>');
    var h = el('<div class="pl-card-h"></div>');
    h.appendChild(tituloCartao('Quem precisa de atenção'));/* item 19: heading de verdade */
    h.appendChild(iBtn('Ranking por nota (menor primeiro)', function () {
      /* item 6 — o "i" citava linhas[0] direto: com o ranking vazio (todos
         sem plano) isso estourava TypeError e derrubava o cartão inteiro. */
      var base = linhas.length ? iRowsNota(linhas[0].nota) : [];
      return base.concat([
        ['Quem vem primeiro', 'No topo, em vermelho, os setores SEM nota: quem não criou plano ou criou plano sem item ranqueável. Não entregar nada é pior do que entregar pouco — por isso eles vêm ANTES de qualquer nota baixa. Depois vêm os setores com nota, em ordem crescente.'],
        ['Quem NÃO entra nesta lista', 'Setor ativo SEM líder designado no cadastro e sem plano criado. Este cartão cobra uma pessoa; sem líder não há a quem cobrar, e a linha vermelha só geraria culpa sem dono. Esse caso vira aviso no topo da tela, endereçado à gestão: designe o líder ou desative o setor.'],
        ['Atenção', linhas.length
          ? ('Os números acima são do 1º setor COM nota (' + linhas[0].sigla + '), o de MENOR nota — não são o total da rede. Para os números de outro setor, use o "i" ao lado da nota dele, na lista de setores.')
          : 'Nenhum setor tem nota ainda nesta competência: não há item com data prevista para calcular. Os setores listados estão todos sem entrega.'],
        ['Ordem', 'Sem plano primeiro; depois nota crescente — quem mais precisa de apoio AGORA está sempre no alto da lista.']
      ]);
    }));
    card.appendChild(h);
    semNota.forEach(function (x) {
      var lin = el('<div class="pl-linha"></div>');
      var dot = el('<div class="pl-l-dot"></div>');
      dot.style.background = 'var(--bandaCritica)';
      dot.setAttribute('aria-hidden', 'true');
      lin.appendChild(dot);
      lin.appendChild(txt('div', 'pl-l-t', x.sigla + ' — ' + nomeSetor(x.sigla)));
      lin.appendChild(txt('div', 'pl-semplano', x.semPlano
        ? 'sem plano criado — não entregou nada'
        : 'plano sem item com data prevista — nada a avaliar'));
      wrapLinha(lin, x.sigla);
      card.appendChild(lin);
    });
    linhas.forEach(function (x) {
      var lin = el('<div class="pl-linha"></div>');
      var dot = el('<div class="pl-l-dot"></div>');
      dot.style.background = x.nota.nota >= 80 ? 'var(--green)' : x.nota.nota >= 50 ? 'var(--amber)' : 'var(--red)';
      dot.setAttribute('aria-hidden', 'true');
      lin.appendChild(dot);
      lin.appendChild(txt('div', 'pl-l-t', x.sigla + ' — ' + nomeSetor(x.sigla)));
      lin.appendChild(txt('div', 'pl-l-m', 'nota ' + x.nota.nota + ' · aderência ' + x.nota.aderencia + '%'));
      wrapLinha(lin, x.sigla);
      card.appendChild(lin);
    });
    bodyEl.appendChild(card);
  }

  /* ===================== PAINEL POR SETOR ===================== */
  function renderSetores() {
    var card = el('<div class="pl-card"></div>');
    var h = el('<div class="pl-card-h"></div>');
    h.appendChild(tituloCartao('Planos por setor — ' + compLabel(COMP)));/* item 19 */
    /* ============================================================
       item 30 · O CHIP É UM CHIP, NÃO UM RODAPÉ
       ------------------------------------------------------------
       .pl-count é pílula de 11px com border-radius 20: recebia um
       parágrafo de ~100 caracteres explicando a diferença de critério e
       deformava o cabeçalho inteiro. O número fica no chip; a ressalva
       (que é importante e continua escrita) mudou para o "i" ao lado.
       ============================================================ */
    var ativaLst = {};
    SETORES.forEach(function (s) { ativaLst[s.sigla] = true; });
    var criados = PLANOS.filter(function (p) { return !!ativaLst[p.setorSigla]; }).length;
    h.appendChild(txt('span', 'pl-count', criados + ' de ' + SETORES.length + ' com plano'));
    h.appendChild(iBtn('Planos por setor — contagem e escalonamento', function () {
      return [
        ['Números', criados + ' de ' + plural(SETORES.length, 'setor ativo tem', 'setores ativos têm') + ' plano CRIADO nesta competência — rascunho conta.'],
        ['Critério diferente do cartão do topo', 'Este chip conta plano CRIADO (inclusive rascunho e plano sem item) sobre TODOS os setores ativos — é o retrato da lista que vem logo abaixo. O número grande no topo da tela conta plano ENTREGUE com ao menos um item sobre os setores OBRIGADOS (os que têm líder designado). Dois numeradores e dois denominadores diferentes, de propósito: aqui é "quem começou", lá é "quem prestou contas". Os dois critérios estão escritos para que a divergência não pareça erro de conta.']
      ].concat(iRowsPrazo(KPI.planejamentoPrazo(COMP, HOJE, null)));
    }));
    card.appendChild(h);

    /* R7·item 21: a lista era 23 linhas planas em ordem alfabética —
       impossível de varrer. Agora agrupa por setor-RAIZ (setorPaiSigla, o
       mesmo dado da hierarquia do usuarios.html) com subsetores indentados
       ↳ e roll-up no raiz. A CONTAGEM da tela não muda: são as MESMAS linhas
       de antes (herói e contador do cabeçalho intactos). */
    function linhaSetor(s, ehSub) {
      var pl = PLANOS.filter(function (p) { return p.setorSigla === s.sigla; })[0];
      var row = el('<div class="pl-srow' + (ehSub ? ' pl-ssub' : '') + '" id="pl-s-' + escAttr(s.sigla) + '"></div>');
      var head = el('<div class="pl-shead"></div>');
      /* O NOME do setor é o botão de abrir/fechar (não o cabeçalho inteiro: ele já contém
         botões "i" e chips, e botão dentro de botão quebra o leitor de tela). */
      /* item 19 — o nome do setor é o título da seção dele: vira <h3> dentro
         do <h2> do cartão. A página inteira tinha UM heading (o <h1>). */
      var nome = txt('h3', 'pl-sname', (ehSub ? '↳ ' : '') + s.sigla + ' — ' + (s.nome || s.sigla));
      nome.setAttribute('role', 'button');
      nome.setAttribute('tabindex', '0');
      head.appendChild(nome);

      var pz = KPI.planejamentoPrazo(COMP, HOJE, pl && pl.entregueEm ? pl.entregueEm : null);
      var f = FASES[pz.fase] || FASES.ok;
      var fase = txt('span', 'pl-badge', f[0]);
      fase.style.color = f[1];
      fase.title = 'Prazo de entrega: ' + fmtBR(pz.deadline);
      head.appendChild(fase);
      head.appendChild(iBtn('Fase da entrega — ' + s.sigla, function () { return iRowsPrazo(pz); }));

      /* R4-EXT (arbitragem 2): cobrança MANUAL nos canais travados da F1-E
         (WhatsApp/E-mail com texto pronto) quando D-3/D-0 sem entrega — o
         push automático segue O2 aberto (exige backend). Só o gestor cobra. */
      if ((pz.fase === 'd3' || pz.fase === 'd0') && !(pl && pl.entregueEm) && Guard.isGestor && Guard.isGestor()) {
        var msgCob = 'Planejamento ' + s.sigla + ' (' + compLabel(COMP) + '): prazo dia ' + fmtBR(pz.deadline) + ' — favor entregar o plano no GERA.';
        var lidsCob = USERS.filter(function (u) {
          return u.perfil === 'lider' && (u.setoresLiderados.indexOf(s.sigla) >= 0 || (s.setorPaiSigla && u.setoresLiderados.indexOf(s.setorPaiSigla) >= 0));
        });
        /* R6/design (regra Chanel): 1 ação visível por linha — o canal escolhe-se depois */
        var bC = txt('button', 'pl-acao', 'cobrar ▾'); bC.type = 'button';
        bC.title = lidsCob.length ? ('Cobrança pronta por WhatsApp ou e-mail — ' + (lidsCob.length === 1 ? 'líder' : 'líderes') + ': ' + lidsCob.map(function (u) { return u.nome; }).join(', ')) : 'Cobrança pronta por WhatsApp ou e-mail (o cadastro não aponta líder deste setor).';
        bC.addEventListener('click', function (ev) {
          ev.stopPropagation();
          UI.modal({
            title: 'Cobrar ' + s.sigla + ' — plano de ' + compLabel(COMP), width: 440,
            body: [txt('div', 'pl-smeta', 'Mensagem pronta: "' + msgCob + '"')],
            footer: function (close) {
              return [
                UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
                UI.button({ label: 'E-mail ✉', variant: 'ghost', onClick: function () {
                  close();
                  var to = lidsCob.map(function (u) { return u.email; }).filter(Boolean).join(',');
                  window.location.href = 'mailto:' + to + '?subject=' + encodeURIComponent('Planejamento ' + s.sigla + ' — ' + compLabel(COMP)) + '&body=' + encodeURIComponent(msgCob);
                } }),
                UI.button({ label: 'WhatsApp 📱', onClick: function () {
                  close();
                  /* item 25 — sem 'noopener', a aba do wa.me herda window.opener e
                     pode reescrever a URL DESTA aba (reverse tabnabbing). */
                  window.open('https://wa.me/?text=' + encodeURIComponent(msgCob), '_blank', 'noopener,noreferrer');
                } })
              ];
            }
          });
        });
        head.appendChild(bC);
      }

      if (pl) {
        /* R5-B2: estado formal DERIVADO do plano (nunca gravado). */
        var stp = KPI.planejamentoStatus(pl);
        var stMeta = STATUS_PLANO[stp] || STATUS_PLANO.rascunho;
        var stB = txt('span', 'pl-badge', stMeta.label);
        stB.style.color = stMeta.cor;
        stB.title = 'Estado calculado a partir da entrega e das ciências — nenhum estado trava o trabalho.';
        head.appendChild(stB);
        head.appendChild(iBtn('Estado do plano — ' + s.sigla, I_STATUS));
        var vivos = itensVivos(pl);
        /* item 29 — pluralização de verdade ("1 item · 1 realizado"). */
        var qtdReal = vivos.filter(function (i) { return i.quandoRealizado; }).length;
        var qtdNao = vivos.filter(function (i) { return i.naoFeito; }).length;
        head.appendChild(txt('span', 'pl-smeta', plural(vivos.length, 'item', 'itens')
          + ' · ' + plural(qtdReal, 'realizado', 'realizados')
          + (qtdNao ? (' · ' + plural(qtdNao, 'não realizado', 'não realizados')) : '')));
        var n = KPI.planejamentoNota(vivos);
        var nb = el('<span class="pl-nota"></span>');
        nb.appendChild(txt('span', '', n ? ('Nota ' + n.nota) : 'sem nota'));
        if (n) { nb.style.color = n.nota >= 80 ? 'var(--green)' : n.nota >= 50 ? 'var(--amber)' : 'var(--red)'; }
        nb.appendChild(iBtn('Nota do mês — ' + s.sigla, function () { return iRowsNota(n); }));
        head.appendChild(nb);
      } else {
        head.appendChild(txt('span', 'pl-smeta', 'sem plano nesta competência'));
        if (escreveNoSetor(s.sigla)) {
          var nb2 = UI.button({ label: 'Criar plano', variant: 'ghost' });
          nb2.addEventListener('click', function (ev) { ev.stopPropagation(); criarPlano(s.sigla); });
          nb2.style.marginLeft = 'auto';
          head.appendChild(nb2);
        }
      }
      row.appendChild(head);

      var box = el('<div style="display:none"></div>');
      row.appendChild(box);
      function alternar() {
        ABERTOS[s.sigla] = !ABERTOS[s.sigla];
        box.style.display = ABERTOS[s.sigla] ? 'block' : 'none';
        nome.setAttribute('aria-expanded', ABERTOS[s.sigla] ? 'true' : 'false');
        if (ABERTOS[s.sigla]) { box.innerHTML = ''; if (pl) { fillPlano(pl, box); } else { box.appendChild(txt('div', 'pl-empty', 'Sem plano — ' + (escreveNoSetor(s.sigla) ? 'clique em "Criar plano" para abrir o plano do mês.' : 'o líder do setor ainda não criou.'))); } }
      }
      nome.setAttribute('aria-expanded', ABERTOS[s.sigla] ? 'true' : 'false');
      head.addEventListener('click', alternar);
      /* Abrir/fechar o setor é a interação principal da tela — precisa existir no teclado. */
      nome.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); alternar(); } });
      if (ABERTOS[s.sigla]) { box.style.display = 'block'; if (pl) { fillPlano(pl, box); } else { box.appendChild(txt('div', 'pl-empty', 'Sem plano nesta competência.')); } }
      return row;
    }

    /* laço de grupos: raiz → subsetores indentados (dado: setorPaiSigla) */
    var vistos = {};
    var raizes = SETORES.filter(function (s) { return !s.setorPaiSigla; });
    raizes.forEach(function (rz) {
      vistos[rz.sigla] = true;
      var subs = SETORES.filter(function (x) { return x.setorPaiSigla === rz.sigla; });
      subs.forEach(function (x) { vistos[x.sigla] = true; });
      var rowRaiz = linhaSetor(rz, false);
      card.appendChild(rowRaiz);
      if (!subs.length) { return; }
      var comPlano = subs.filter(function (x) { return PLANOS.some(function (p) { return p.setorSigla === x.sigla; }); }).length;
      var temPend = subs.some(function (x) {
        var pp = PLANOS.filter(function (p) { return p.setorSigla === x.sigla; })[0];
        return !(pp && pp.entregueEm);
      });
      /* "a ação certa é a mais fácil": grupo com pendência já nasce aberto */
      if (GRUPOS_ABERTOS[rz.sigla] == null) { GRUPOS_ABERTOS[rz.sigla] = temPend; }
      var subBox = el('<div class="pl-gsubs"></div>');
      subs.forEach(function (x) { subBox.appendChild(linhaSetor(x, true)); });
      subBox.style.display = GRUPOS_ABERTOS[rz.sigla] ? '' : 'none';
      var chip = txt('button', 'pl-acao', '');
      chip.type = 'button';
      chip.title = 'Mostrar/ocultar os subsetores de ' + rz.sigla + '. Grupo com subsetor sem plano entregue abre sozinho.';
      chip.setAttribute('aria-expanded', GRUPOS_ABERTOS[rz.sigla] ? 'true' : 'false');
      function pintaChip() { chip.textContent = (GRUPOS_ABERTOS[rz.sigla] ? '▾ ' : '▸ ') + comPlano + ' de ' + plural(subs.length, 'subsetor', 'subsetores') + ' com plano'; }
      pintaChip();
      chip.addEventListener('click', function (ev) {
        ev.stopPropagation();
        GRUPOS_ABERTOS[rz.sigla] = !GRUPOS_ABERTOS[rz.sigla];
        subBox.style.display = GRUPOS_ABERTOS[rz.sigla] ? '' : 'none';
        chip.setAttribute('aria-expanded', GRUPOS_ABERTOS[rz.sigla] ? 'true' : 'false');
        pintaChip();
      });
      var headRaiz = rowRaiz.querySelector('.pl-shead');
      if (headRaiz) { headRaiz.appendChild(chip); }
      card.appendChild(subBox);
    });
    /* órfão (setorPaiSigla aponta p/ raiz fora da lista): NUNCA some da tela */
    SETORES.forEach(function (s) {
      if (!vistos[s.sigla]) { card.appendChild(linhaSetor(s, !!s.setorPaiSigla)); }
    });
    bodyEl.appendChild(card);
  }

  /* ---------- grade do plano: O quê · Como · Quem · Quando · Quanto ---------- */
  function fillPlano(pl, box) {
    var podeEd = escreveNoSetor(pl.setorSigla);
    /* R7·item 22: o ciclo manual → risco (P×I) → mitigação agora CHEGA ao
       plano do setor — bloco acima da grade, nunca bloqueia a entrega. */
    var sug = blocoSugeridos(pl, podeEd);
    if (sug.childNodes.length) { box.appendChild(sug); }
    /* ============================================================
       item 21 · REGIÃO QUE ROLA NA HORIZONTAL PRECISA DE TECLADO
       ------------------------------------------------------------
       .pl-grade tem overflow-x mas não era focável: quem navega só pelo
       teclado não conseguia rolar para ver as colunas R$ e ações
       (WCAG 2.1.1). tabindex=0 + role=region + nome + :focus-visible.
       ============================================================ */
    var rotuloGrade = 'Itens do plano de ' + pl.setorSigla + ' — ' + compLabel(pl.competencia || COMP) + ' (tabela rolável na horizontal)';
    var grade = el('<div class="pl-grade"></div>');
    grade.setAttribute('tabindex', '0');
    grade.setAttribute('role', 'region');
    grade.setAttribute('aria-label', rotuloGrade);
    var tb = el('<table class="pl-tb"></table>');
    /* item 20 — a tabela era ANÔNIMA (sem caption), os th não diziam a que
       eixo pertenciam (sem scope) e a coluna de ações não tinha nome. */
    var cap = document.createElement('caption');
    cap.className = 'pl-sr';
    cap.textContent = 'Plano de ' + pl.setorSigla + ' — ' + compLabel(pl.competencia || COMP)
      + ': o quê, como, quem, quando previsto, realizado, quanto e as ações de cada item.';
    tb.appendChild(cap);
    var thead = el('<thead><tr>'
      + '<th scope="col">O que</th>'
      + '<th scope="col">Como</th>'
      + '<th scope="col">Quem</th>'
      + '<th scope="col">Quando (prev.)</th>'
      + '<th scope="col">Realizado</th>'
      + '<th scope="col">R$ (prev → final)</th>'
      + '<th scope="col">Ações do item</th>'
      + '</tr></thead>');
    tb.appendChild(thead);
    var tbody = document.createElement('tbody');
    var vivos = itensVivos(pl).slice().sort(function (a, b) { return (a.quandoPrevisto || '9999').localeCompare(b.quandoPrevisto || '9999'); });
    if (!vivos.length) {
      var tr0 = document.createElement('tr');
      var td0 = document.createElement('td');
      td0.colSpan = 7; td0.appendChild(txt('span', 'pl-empty', 'Nenhum item ainda — o plano do mês nasce vazio.'));
      tr0.appendChild(td0); tbody.appendChild(tr0);
    }
    vivos.forEach(function (it) {
      var tr = document.createElement('tr');
      function td(node) { var c = document.createElement('td'); if (node) { c.appendChild(node); } tr.appendChild(c); return c; }
      function abrirOrigem(texto, titulo) {
        UI.modal({
          title: titulo || 'Origem do item', width: 440,
          body: [txt('div', 'pl-empty', texto)],
          footer: function (close) { return [UI.button({ label: 'Fechar', variant: 'ghost', onClick: close })]; }
        });
      }
      var tdOq = td(txt('span', '', it.oque || '—'));
      /* R7·item 22: item nascido de sugestão carrega a ORIGEM (qual risco) —
         rastreabilidade "as mitigações dos críticos estão sendo executadas?" */
      if (it.origemRisco && it.origemRisco.nivel) {
        var oR = txt('span', 'pl-badge', '⛨ risco ' + it.origemRisco.nivel);
        oR.style.marginLeft = '6px';
        /* item 15 — --red/--orange sobre --chipBg dão 3,14:1 e 4,27:1 no claro
           (reprovam 1.4.3). Os tokens de banda existem exatamente para isto. */
        oR.style.color = corBanda(it.origemRisco.nivel);
        /* item 33 — "Antecipa" prometia indicador antecedente para os 67 riscos;
           o campo é o sinal descrito no manual, não um KPI de resultado. */
        var oTxt = 'Origem: matriz de risco do manual — "' + (it.origemRisco.risco || '') + '" (P' + it.origemRisco.p + '×I' + it.origemRisco.i + ')' + (it.origemRisco.ind ? ' · Sinal de alerta do manual: ' + it.origemRisco.ind : '');
        oR.title = oTxt;
        // O title nao abre no toque: o badge tambem responde a clique/Enter (a origem e' rastreabilidade, nao enfeite).
        oR.setAttribute('role', 'button');
        oR.setAttribute('tabindex', '0');
        oR.setAttribute('aria-label', oTxt);
        oR.style.cursor = 'pointer';
        oR.addEventListener('click', function (ev) { ev.stopPropagation(); abrirOrigem(oTxt); });
        oR.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); abrirOrigem(oTxt); } });
        tdOq.appendChild(oR);
      }
      /* R5-B2: setores parceiros (aceite por chip — quem lidera o setor
         parceiro aceita; padrão convite: aceitar registra ciência). */
      (it.setoresEnvolvidos || []).forEach(function (se) {
        var chip = txt('span', 'pl-badge', se.aceite ? ('✓ ' + se.sigla) : (se.sigla + ' — aceitar?'));
        chip.style.marginLeft = '6px';
        chip.style.color = se.aceite ? 'var(--green)' : 'var(--muted)';
        var chipTxt = se.aceite
          ? ('Aceito por ' + (se.aceite.nome || '—') + ' (' + se.sigla + ').')
          : ('Aguardando o aceite de quem lidera ' + se.sigla + '.');
        chip.title = chipTxt;
        chip.setAttribute('aria-label', chipTxt);
        if (!se.aceite && escreveNoSetor(se.sigla)) {
          /* Registrar o aceite é ato de governança: precisa de teclado, não só de clique. */
          chipTxt = 'Você lidera ' + se.sigla + ' — aceite o envolvimento do seu setor neste item.';
          chip.style.cursor = 'pointer';
          chip.style.color = 'var(--amber)';
          chip.title = chipTxt;
          chip.setAttribute('role', 'button');
          chip.setAttribute('tabindex', '0');
          chip.setAttribute('aria-label', chipTxt);
          chip.addEventListener('click', function (ev) { ev.stopPropagation(); aceitarSetorItem(pl, it, se.sigla); });
          chip.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); aceitarSetorItem(pl, it, se.sigla); } });
        } else if (se.aceite) {
          /* Quem aceitou é rastreabilidade — no toque o title não abre, então o chip também clica. */
          chip.style.cursor = 'pointer';
          chip.setAttribute('role', 'button');
          chip.setAttribute('tabindex', '0');
          chip.addEventListener('click', function (ev) { ev.stopPropagation(); abrirOrigem(chipTxt, 'Aceite do setor parceiro'); });
          chip.addEventListener('keydown', function (ev) { if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); ev.stopPropagation(); abrirOrigem(chipTxt, 'Aceite do setor parceiro'); } });
        }
        tdOq.appendChild(chip);
      });
      /* ============================================================
         item 27 · CÉLULA DE TEXTO LONGO
         ------------------------------------------------------------
