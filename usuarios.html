<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Usuários · Cadastro — GERA</title>

<!-- provider + primitivos (mesma fundação das demais telas) -->

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">

<style>
/* ===== layout da tela Usuários (cor 100% via var) ===== */
.us-app{display:flex;min-height:100vh;background:var(--bg)}
.us-app>.ui-side{position:sticky;top:0;height:100vh}
.us-main{flex:1;min-width:0;display:flex;flex-direction:column}

.us-top{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--s1)}
.us-hi{font-size:21px;font-weight:800;letter-spacing:-.02em;margin:0}
.us-dd{font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}

.us-mhead{display:none;align-items:flex-start;justify-content:space-between;padding:14px 20px 16px;background:var(--s1);border-bottom:1px solid var(--border)}
.us-mg{font-size:22px;font-weight:800;letter-spacing:-.02em;margin:0}
.us-md{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}

.us-content{flex:1;padding:24px 32px 40px}

/* toolbar */
.us-toolbar{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:18px}
.us-count{font-size:12.5px;font-weight:600;color:var(--muted)}
.us-count b{color:var(--text);font-weight:800}
.us-toolright{display:flex;align-items:center;gap:16px;flex-wrap:wrap}

/* lista */
.us-list{display:flex;flex-direction:column;gap:10px}
.us-row{display:flex;align-items:center;gap:14px;padding:13px 16px;background:var(--s1);border:1px solid var(--border);border-radius:13px}
.us-row.inactive{opacity:.66}
.us-meta{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.us-nm{font-size:14.5px;font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.us-em{font-size:12px;font-weight:500;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.us-badge{font-size:11px;font-weight:800;letter-spacing:.03em;border-radius:7px;padding:4px 10px;flex:none;
  background:var(--chipBg);color:var(--muted);border:1px solid var(--border)}
.us-badge.adm{background:var(--activeBg);color:var(--greenText)}
.us-tag{font-size:11px;font-weight:700;flex:none;display:inline-flex;align-items:center;gap:6px;color:var(--muted)}
.us-tag .dot{width:7px;height:7px;border-radius:50%;background:var(--muted2)}
.us-tag.on{color:var(--greenText)}
.us-tag.on .dot{background:var(--green)}
.us-you{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted2);border:1px dashed var(--border);border-radius:6px;padding:2px 7px;flex:none}
.us-actions{display:flex;align-items:center;gap:6px;flex:none}
.us-ibtn{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;flex:none;border:1px solid var(--border);
  border-radius:8px;background:var(--s2);color:var(--muted);cursor:pointer;transition:color .15s,background .15s,border-color .15s}
.us-ibtn:hover{background:var(--s3);color:var(--text)}
.us-ibtn.danger:hover{color:var(--red);border-color:var(--red)}
.us-ibtn.off{opacity:.4;cursor:not-allowed}

/* skeleton / msg / sem-acesso */
.us-skel{display:flex;flex-direction:column;gap:10px}
.us-skrow{height:58px;border-radius:13px;border:1px solid var(--border);background:
  linear-gradient(90deg,var(--s1) 0%,var(--s2) 50%,var(--s1) 100%);background-size:200% 100%;animation:ussk 1.2s ease-in-out infinite}
@keyframes ussk{0%{background-position:200% 0}100%{background-position:-200% 0}}
.us-msg{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:34px 30px;max-width:560px;text-align:center;margin:8px auto 0}
.us-msg-ic{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;margin:0 auto 14px;background:var(--chipBg);color:var(--muted)}
.us-msg-ic.err{color:var(--red)}
.us-msg-t{font-size:16px;font-weight:800}
.us-msg-p{font-size:13px;font-weight:500;color:var(--muted);line-height:1.5;margin-top:7px}
.us-msg-actions{display:flex;justify-content:center;margin-top:18px}

/* toast */
.us-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(14px);z-index:80;
  display:flex;align-items:center;gap:10px;max-width:90vw;padding:12px 16px;border-radius:11px;
  background:var(--s2);border:1px solid var(--border);box-shadow:var(--cardShadow);
  font-size:13px;font-weight:600;color:var(--text);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s}
.us-toast.on{opacity:1;transform:translateX(-50%) translateY(0)}
.us-toast .bar{width:4px;align-self:stretch;border-radius:4px;background:var(--brand)}
.us-toast.err .bar{background:var(--red)}

/* toggle de tema temporário (até existir a tela Configurações) */
.us-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;
  font-family:inherit;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--cardShadow)}
.us-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}

.us-disabled{opacity:.5;cursor:not-allowed;filter:grayscale(.2)}
.us-lidgrid{display:flex;flex-direction:column;gap:8px;padding:4px 2px}

@media (max-width:900px){
  .us-app>.ui-side{display:none}
  .us-top{display:none}
  .us-mhead{display:flex}
  .us-content{padding:16px 18px 40px}
}
</style>
</head>
<body>

  <!-- portão de acesso (guard.js controla) -->
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="us-dev" data-theme-toggle type="button" title="Alternar tema (temporário)"><span class="pin"></span>Tema</button>

  <div class="us-app" id="app">
    <main class="us-main">

      <div class="us-top">
        <div style="line-height:1.2">
          <h1 class="us-hi">Usuários</h1>
          <div class="us-dd">Quem acessa o sistema, com qual perfil e em qual setor · o login é criado no Console do Firebase; aqui se define a permissão</div>
        </div>
      </div>

      <div class="us-mhead">
        <div>
          <h1 class="us-mg">Usuários</h1>
          <div class="us-md">Acessos e perfis</div>
        </div>
        <span id="us-mav"></span>
      </div>

      <div class="us-content">
        <div class="us-toolbar" id="us-toolbar" hidden>
          <div class="us-count" id="us-count"></div>
          <div class="us-toolright">
            <span id="us-groupsetor"></span>
            <span id="us-showinactive"></span>
            <span id="us-lotebtn"></span>
            <span id="us-newbtn"></span>
          </div>
        </div>
        <div id="us-stage"></div>
      </div>

    </main>
  </div>

  <div class="us-toast" id="us-toast"><span class="bar"></span><span id="us-toast-msg"></span></div>

  <script src="ui.js"></script>

  <!-- ==========================================================
       LOGICA PURA da tela de Usuarios (sem DOM, sem banco).
       Fica isolada de proposito: o harness de Node
       (NOITE/harness_usuarios.js) recorta exatamente o trecho
       entre as duas marcas abaixo e roda os casos de teste.
       NAO mover as marcas nem colocar DOM aqui dentro.
       ========================================================== -->
  <script>
  /* == GERA:USUARIOS-LOGICA-INICIO == */
  (function (raiz) {
    'use strict';

    var L = {};

    /* ---------- perfis ----------
       perfilEfetivo espelha guard.js:79-83 (Admin -> gestor, Editor -> lider,
       o resto -> usuario). Serve para que um documento legado "Admin" seja
       tratado como Gestor tambem nesta tela — inclusive na marca de socio. */
    L.perfilEfetivo = function (bruto) {
      var p = String(bruto == null ? '' : bruto).replace(/^\s+|\s+$/g, '');
      if (p === 'gestor' || p === 'lider' || p === 'usuario') { return p; }
      if (p === 'Admin') { return 'gestor'; }
      if (p === 'Editor') { return 'lider'; }
      return 'usuario';
    };

    /* aceita o que a pessoa digitar no lote e devolve o valor canonico ('' se nao der) */
    L.perfilDoTexto = function (bruto) {
      var p = L.normalizarNome(bruto);
      if (p === 'gestor' || p === 'gestora' || p === 'admin' || p === 'administrador') { return 'gestor'; }
      if (p === 'lider' || p === 'lideranca' || p === 'editor') { return 'lider'; }
      if (p === 'usuario' || p === 'usuaria' || p === 'colaborador' || p === 'colaboradora' || p === 'visualizador') { return 'usuario'; }
      return '';
    };

    /* ---------- normalizacao de texto ---------- */
    var COM_ACENTO = 'aaaaaeeeeiiiiooooouuuucn';
    var ACENTUADAS = 'áàâãäéèêëíìîïóòôõöúùûüçñ';
    L.tiraAcento = function (s) {
      var t = String(s == null ? '' : s).toLowerCase();
      var saida = '', i, pos;
      for (i = 0; i < t.length; i++) {
        pos = ACENTUADAS.indexOf(t.charAt(i));
        saida += (pos >= 0) ? COM_ACENTO.charAt(pos) : t.charAt(i);
      }
      return saida;
    };
    /* nome comparavel: sem acento, sem pontuacao, minusculo, um espaco so */
    L.normalizarNome = function (s) {
      var t = L.tiraAcento(s).replace(/[^a-z0-9]+/g, ' ');
      return t.replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    };
    L.normalizarEmail = function (s) {
      return String(s == null ? '' : s).replace(/^\s+|\s+$/g, '').toLowerCase();
    };
    L.partesNome = function (s) {
      var n = L.normalizarNome(s);
      return n ? n.split(' ') : [];
    };
    L.limpar = function (s) {
      return String(s == null ? '' : s).replace(/\s+/g, ' ').replace(/^\s+|\s+$/g, '');
    };

    /* distancia de edicao (Levenshtein), iterativa — pega erro de digitacao */
    L.distancia = function (a, b) {
      a = String(a == null ? '' : a); b = String(b == null ? '' : b);
      if (a === b) { return 0; }
      if (!a.length) { return b.length; }
      if (!b.length) { return a.length; }
      var linha = [], i, j, anterior, guarda, custo;
      for (j = 0; j <= b.length; j++) { linha[j] = j; }
      for (i = 1; i <= a.length; i++) {
        anterior = linha[0];
        linha[0] = i;
        for (j = 1; j <= b.length; j++) {
          guarda = linha[j];
          custo = (a.charAt(i - 1) === b.charAt(j - 1)) ? 0 : 1;
          linha[j] = Math.min(linha[j] + 1, linha[j - 1] + 1, anterior + custo);
          anterior = guarda;
        }
      }
      return linha[b.length];
    };

    /* ---------- nome parecido ----------
       Nunca bloqueia: so avisa. Regra deliberada do GERA — "Bruno Fellows" e
       "Bruno Bandeira" SAO pessoas diferentes, entao primeiro nome igual vira
       aviso ('parecido'), jamais impedimento. */
    L.compararNomes = function (novo, existente) {
      var a = L.normalizarNome(novo), b = L.normalizarNome(existente);
      if (!a || !b) { return null; }
      if (a === b) { return { nivel: 'igual', motivo: 'nome escrito exatamente igual' }; }
      var pa = a.split(' '), pb = b.split(' ');
      if (pa.length > 1 && pb.length > 1 && pa[0] === pb[0] && pa[pa.length - 1] === pb[pb.length - 1]) {
        return { nivel: 'igual', motivo: 'mesmo primeiro e mesmo ultimo nome' };
      }
      var d = L.distancia(a, b);
      if (d > 0 && d <= 2 && Math.max(a.length, b.length) >= 6) {
        return { nivel: 'parecido', motivo: 'escrita quase igual' };
      }
      if (pa[0] === pb[0]) { return { nivel: 'parecido', motivo: 'mesmo primeiro nome' }; }
      return null;
    };

    L.avisosDeNome = function (nome, existentes) {
      var saida = [], i, c, u;
      existentes = existentes || [];
      for (i = 0; i < existentes.length; i++) {
        u = existentes[i];
        c = L.compararNomes(nome, u && u.nome);
        if (c) {
          saida.push({ uid: (u && u.uid) || '', nome: (u && u.nome) || '', setor: (u && u.setor) || '',
            nivel: c.nivel, motivo: c.motivo });
        }
      }
      return saida;
    };

    /* ---------- setores ---------- */
    L.temSetor = function (setores, sigla) {
      var s = L.normalizarNome(sigla), i;
      setores = setores || [];
      for (i = 0; i < setores.length; i++) {
        if (L.normalizarNome(setores[i] && (setores[i].sigla || setores[i])) === s) { return true; }
      }
      return false;
    };

    /* agrupa a lista de pessoas na ordem hierarquica dos setores.
       Setor sem ninguem continua na tela, com o vazio "Sem equipe cadastrada". */
    L.agruparPorSetor = function (usuarios, setores) {
      var grupos = [], porSigla = {}, i, u, sig, g;
      setores = setores || [];
      usuarios = usuarios || [];
      for (i = 0; i < setores.length; i++) {
        g = { sigla: setores[i].sigla, nome: setores[i].nome || setores[i].sigla,
          pai: setores[i].pai || null, cadastrado: true, usuarios: [] };
        grupos.push(g);
        porSigla[g.sigla] = g;
      }
      var semSetor = { sigla: '', nome: 'Sem setor definido', pai: null, cadastrado: false, usuarios: [] };
      for (i = 0; i < usuarios.length; i++) {
        u = usuarios[i];
        sig = L.limpar(u && u.setor);
        if (!sig) { semSetor.usuarios.push(u); continue; }
        if (!porSigla[sig]) {
          g = { sigla: sig, nome: sig, pai: null, cadastrado: false, usuarios: [] };
          porSigla[sig] = g;
          grupos.push(g);
        }
        porSigla[sig].usuarios.push(u);
      }
      if (semSetor.usuarios.length) { grupos.push(semSetor); }
      return grupos;
    };

    /* ---------- quem pode marcar/desmarcar socio ----------
       A2: socio = gestor (ou o legado Admin) com a marca. So gestor marca. */
    L.podeMarcarSocio = function (ator, alvo) {
      if (!ator || !alvo) { return { pode: false, motivo: 'Nao consegui identificar quem esta pedindo.' }; }
      if (L.perfilEfetivo(ator.perfil) !== 'gestor') {
        return { pode: false, motivo: 'Só o perfil Gestor marca quem é sócio.' };
      }
      if (L.perfilEfetivo(alvo.perfil) !== 'gestor') {
        return { pode: false, motivo: 'Só quem tem perfil Gestor pode ser marcado como sócio. Mude o perfil antes.' };
      }
      if (alvo.ativo === false) {
        return { pode: false, motivo: 'Esta pessoa está desativada. Reative antes de mudar a marca de sócio.' };
      }
      return { pode: true, motivo: '' };
    };

    /* quem responde pelo SOC = sócio · pelo GES = gestor sem a marca de sócio */
    L.respondePeloSoc = function (u) {
      return !!u && L.perfilEfetivo(u.perfil) === 'gestor' && u.socio === true && u.ativo !== false;
    };
    L.respondePeloGes = function (u) {
      return !!u && L.perfilEfetivo(u.perfil) === 'gestor' && u.socio !== true && u.ativo !== false;
    };

    /* ---------- conta de teste ---------- */
    L.ehContaDeTeste = function (u) {
      if (!u) { return false; }
      var partes = L.partesNome(u.nome), i;
      for (i = 0; i < partes.length; i++) {
        if (partes[i] === 'teste' || partes[i] === 'testes' || partes[i] === 'test') { return true; }
      }
      var local = L.normalizarEmail(u.email).split('@')[0] || '';
      return /(^|[._+-])test(e|es)?([._+-]|$)/.test(local);
    };

    /* ---------- lote ---------- */
    var RX_EMAIL_LOTE = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

    L.separarColunas = function (linha) {
      var t = String(linha == null ? '' : linha);
      var sep = (t.indexOf('\t') >= 0) ? '\t' : ((t.indexOf(';') >= 0) ? ';' : ',');
      var partes = t.split(sep), saida = [], i;
      for (i = 0; i < partes.length; i++) { saida.push(L.limpar(partes[i])); }
      return saida;
    };

    L.ehCabecalho = function (colunas) {
      if (!colunas || colunas.length < 2) { return false; }
      var c0 = L.normalizarNome(colunas[0]), c1 = L.normalizarNome(colunas[1]);
      return (c0 === 'nome' || c0 === 'nome completo') && c1.indexOf('mail') >= 0;
    };

    /* valida UMA pessoa. ctx.setores = [{sigla,nome}] (se vazio, nao cobra o setor) */
    L.validarCadastro = function (item, ctx) {
      ctx = ctx || {};
      var erros = [];
      var nome = L.limpar(item && item.nome);
      var email = L.normalizarEmail(item && item.email);
      var perfil = L.perfilDoTexto(item && item.perfil);
      var setor = L.limpar(item && item.setor).toUpperCase();
      if (nome.length < 2) { erros.push('Escreva o nome completo (2 letras ou mais).'); }
      else if (L.partesNome(nome).length < 2) { erros.push('Escreva nome e sobrenome.'); }
      if (!RX_EMAIL_LOTE.test(email)) { erros.push('E-mail inválido.'); }
      if (!perfil) { erros.push('Perfil deve ser Gestor, Líder ou Usuário.'); }
      if (!setor) { erros.push('Informe a sigla do setor.'); }
      else if ((ctx.setores || []).length && !L.temSetor(ctx.setores, setor)) {
        erros.push('O setor "' + setor + '" não existe no cadastro de setores.');
      }
      return { ok: erros.length === 0, erros: erros,
        valor: { nome: nome, email: email, perfil: perfil, setor: setor } };
    };

    /* le o texto colado e devolve a previa, linha a linha, SEM gravar nada.
       ctx = { setores: lista de setores, existentes: lista de quem ja esta cadastrado } */
    L.analisarLote = function (texto, ctx) {
      ctx = ctx || {};
      var existentes = ctx.existentes || [];
      var brutas = String(texto == null ? '' : texto).split(/\r\n|\r|\n/);
      var porEmail = {}, i, j, u, e;
      for (i = 0; i < existentes.length; i++) {
        u = existentes[i];
        e = L.normalizarEmail(u && u.email);
        if (e) { porEmail[e] = u; }
      }
      var linhas = [], vistos = {}, crua, colunas, res, reg;
      for (i = 0; i < brutas.length; i++) {
        crua = L.limpar(brutas[i]);
        if (!crua) { continue; }
        colunas = L.separarColunas(crua);
        if (L.ehCabecalho(colunas)) { continue; }
        res = L.validarCadastro({ nome: colunas[0], email: colunas[1], perfil: colunas[2], setor: colunas[3] }, ctx);
        reg = { linha: i + 1, bruta: crua, valor: res.valor, erros: res.erros.slice(),
          avisos: [], estado: 'novo', jaExiste: null };
        if (colunas.length < 4) {
          reg.erros.unshift('A linha precisa de 4 partes: nome, e-mail, perfil e setor.');
        }
        e = res.valor.email;
        if (e && vistos[e]) { reg.erros.push('Este e-mail já apareceu na linha ' + vistos[e] + ' deste mesmo lote.'); }
        else if (e) { vistos[e] = i + 1; }
        if (reg.erros.length) { reg.estado = 'erro'; }
        else if (e && porEmail[e]) {
          reg.estado = 'ja_existe';
          u = porEmail[e];
          reg.jaExiste = { uid: (u && u.uid) || '', nome: (u && u.nome) || '' };
        } else {
          reg.avisos = L.avisosDeNome(res.valor.nome, existentes);
        }
        linhas.push(reg);
      }
      var resumo = { total: linhas.length, prontos: 0, erros: 0, jaExistem: 0, comAviso: 0 };
      for (j = 0; j < linhas.length; j++) {
        if (linhas[j].estado === 'erro') { resumo.erros++; }
        else if (linhas[j].estado === 'ja_existe') { resumo.jaExistem++; }
        else {
          resumo.prontos++;
          if (linhas[j].avisos.length) { resumo.comAviso++; }
        }
      }
      return { linhas: linhas, resumo: resumo };
    };

    /* UID do Authentication: mesma regra que a tela ja usava no cadastro avulso */
    L.uidValido = function (v) { return /^[A-Za-z0-9_-]{6,128}$/.test(String(v == null ? '' : v)); };

    raiz.UsuariosLogica = L;
  })(typeof window !== 'undefined' ? window : this);
  /* == GERA:USUARIOS-LOGICA-FIM == */
  </script>

  <script>
  (function () {
    'use strict';

    var L = window.UsuariosLogica;

    /* Placeholder até a guarda entregar a identidade real (Guard.onReady). */
    var CURRENT_USER = { uid: '', name: '', profile: 'Visualizador', initials: '' };
    var CAN_VIEW = false; /* só Gestor vê esta tela (recomputado no onReady) */

    /* Fase 1 RBAC — 3 perfis (papel). Legados (Admin/Editor/Visualizador/Consultor
       Externo) ainda aparecem em docs não migrados, mas o editor grava só os 3. */
    var PERFIS = [
      { value: 'gestor', label: 'Gestor' },
      { value: 'lider', label: 'Líder' },
      { value: 'usuario', label: 'Usuário' }
    ];
    var PERFIL_VALS = ['gestor', 'lider', 'usuario'];

    var Store = (function () {

        list: function () {

            return f.getDocs(q).then(function (snap) {

        },
        create: function (d) {

          var socio = (L.perfilEfetivo(perfil) === 'gestor' && d.socio === true);

              if (nome.length < 2) { throw vErr('Informe um nome com pelo menos 2 caracteres.', 'nome'); }
              if (PERFIL_STORABLE.indexOf(perfil) < 0) { throw vErr('Selecione um perfil.', 'perfil'); }
              if (!setor) { throw vErr('Escolha o setor do usuário.', 'setor'); }
              var now = Date.now();
              var novo = { uid: uid, email: email, nome: nome, perfil: perfil, setor: setor, setoresLiderados: setoresLiderados, socio: socio, ativo: true, criadoEm: now, atualizadoEm: now };

        },
        update: function (uid, patch) {

                 Antes, um documento legado — "Admin" ou "Editor" — perdia a marca de
                 sócio (ou os setores liderados) em qualquer gravação que não mexia no
                 perfil, como desativar/reativar. Bruno Fellows está como Admin no banco,
                 então era ele quem perdia o "sócio" ao ser desativado e reativado. */
              if (L.perfilEfetivo(perfil) !== 'lider') { setoresLiderados = []; } /* só Líder guarda setores */

                 exigência continua igual. Já uma gravação parcial (desativar,
                 reativar, marcar sócio) apenas devolve ao banco o que já estava
                 lá, e não pode ser barrada por um campo que o documento nunca
                 teve. Era exatamente isso que impedia desativar a conta de teste

              if (patch.email !== undefined && !RX_EMAIL.test(email)) { throw vErr('Informe um e-mail válido.', 'email'); }
              if (patch.nome !== undefined && nome.length < 2) { throw vErr('Informe um nome com pelo menos 2 caracteres.', 'nome'); }
              if (patch.perfil !== undefined && PERFIL_STORABLE.indexOf(perfil) < 0) { throw vErr('Selecione um perfil.', 'perfil'); }

        setoresRaiz: function () {
          return fb().then(function (ctx) {
            var db = ctx.db, f = ctx.f;

              });

              return a;
            });
          }).catch(function (e) { throw ferr(e); });
        },
        /* F1-C: setores ATIVOS (raiz + subsetores), já ordenados por hierarquia:
           cada raiz seguida dos seus subsetores. Item = { sigla, nome, pai }.
           Alimenta o campo "Setor" do usuário e os checkboxes de "setores liderados". */

          return fb().then(function (ctx) {

              snap.forEach(function (d) { var s = d.data() || {}; all.push({ sigla: (s.sigla || d.id), nome: s.nome || d.id, pai: s.setorPaiSigla || null }); });

    /* ===================== util ===================== */

    function ico(d, size) {

      s.innerHTML = '<svg xmlns="http://www.w3.org/2000/svg" width="' + size + '" height="' + size +

    /* ===================== montagem ===================== */
    function mount() {
      var app = document.getElementById('app');
      var old = app.querySelector('.ui-side'); if (old) { old.parentNode.removeChild(old); }
      app.insertBefore(UI.sidebar({ active: 'Usuários', user: CURRENT_USER }), app.firstChild);

      var mav = document.getElementById('us-mav'); mav.innerHTML = '';
      mav.appendChild(UI.avatar({ initials: CURRENT_USER.initials, size: 42 }));

      if (!CAN_VIEW) { renderNoAccess(); return; }
      load();
    }

    function load() {
      toolbar.hidden = true;
      renderLoading();
      /* M6: carrega pessoas e setores juntos. Se os setores falharem, a tela
         continua: o agrupamento cai para as siglas encontradas nas pessoas. */
      Store.list().then(function (rows) {
        ALL = rows;
        return Store.setoresTodos().then(function (arr) {
          SETORES = arr || [];
        }).catch(function () { SETORES = []; });
      }).then(function () {
        renderList();
      }).catch(function (e) { renderError(e); });

    function refresh() {

    }

      box.appendChild(txt('div', 'us-msg-t', 'Não consegui carregar os usuários'));
      box.appendChild(txt('div', 'us-msg-p', (e && e.message) || 'Erro desconhecido.'));

    function badge(perfil) {
      var novo = PERFIL_VALS.indexOf(perfil) >= 0;

    function statusTag(ativo) {

      t.appendChild(txt('span', null, ativo ? 'Ativo' : 'Inativo'));
      return t;

    function row(u) {

      var r = txt('div', 'us-row' + (u.ativo ? '' : ' inactive'));
      r.appendChild(UI.avatar({ initials: initialsOf(u.nome), size: 38 }));

      var meta = txt('div', 'us-meta');
      meta.appendChild(txt('div', 'us-nm', u.nome || '(sem nome)'));
      meta.appendChild(txt('div', 'us-em', u.email || ''));
      var efetivo = L.perfilEfetivo(u.perfil);
      var lin = [];
      if (u.setor) { lin.push('Setor: ' + u.setor); }
      if (efetivo === 'lider' && Array.isArray(u.setoresLiderados) && u.setoresLiderados.length) { lin.push('Lidera: ' + u.setoresLiderados.join(', ')); }
      if (lin.length) { meta.appendChild(txt('div', 'us-em', lin.join('  ·  '))); }

      if (isSelf) { r.appendChild(txt('span', 'us-you', 'VOCÊ')); }

      if (efetivo === 'gestor') {

        soc.title = u.socio === true ? 'Tirar a marca de sócio' : 'Marcar como sócio';
        soc.appendChild(ico(PATH.socio, 16));
        soc.addEventListener('click', function () {

    /* M6: faixa que oferece desativar a conta de teste que ainda está ativa
       (ex.: "Bruno Fellows Usuário teste"). Nunca apaga — só desativa. */
    function faixaTeste() {
      if (testeDispensada) { return null; }
      var alvo = null, i;
      for (i = 0; i < ALL.length; i++) {
        if (ALL[i].ativo !== false && L.ehContaDeTeste(ALL[i])) { alvo = ALL[i]; break; }
      }
      if (!alvo) { return null; }
      var f = txt('div', 'us-faixa');
      var ic = txt('span', 'ic'); ic.appendChild(ico(PATH.alert, 20)); f.appendChild(ic);
      var tx = txt('div', 'tx', 'Conta de teste ainda ativa: "' + (alvo.nome || alvo.email || alvo.uid) + '"');
      tx.appendChild(txt('span', null, 'Conta de teste entra na contagem e pode virar dono de tarefa por engano. Desativar guarda o registro inteiro: nada é apagado e dá para reativar depois.'));
      f.appendChild(tx);
      f.appendChild(UI.button({ label: 'Desativar esta conta', icon: 'check', onClick: function () { pedirDesativar(alvo); } }));
      f.appendChild(UI.button({ label: 'Agora não', variant: 'ghost', onClick: function () { testeDispensada = true; renderList(); } }));
      return f;
    }

    function cabecalhoGrupo(g) {
      var h = txt('div', 'us-ghead');
      h.appendChild(txt('span', 'us-gnome', g.nome));
      if (g.sigla) { h.appendChild(txt('span', 'us-gsigla', g.sigla)); }
      var sub = txt('div', 'us-gsub');
      if (g.usuarios.length) {
        sub.appendChild(txt('b', null, String(g.usuarios.length)));
        sub.appendChild(document.createTextNode(' ' + (g.usuarios.length === 1 ? 'pessoa' : 'pessoas')));
      } else {
        sub.appendChild(document.createTextNode('nenhuma pessoa'));
      }
      h.appendChild(sub);
      return h;
    }

    function renderList() {
      var vis = showInactive ? ALL : ALL.filter(function (u) { return u.ativo !== false; });
      var inativos = ALL.filter(function (u) { return u.ativo === false; }).length;

      toolbar.hidden = false;
      var count = document.getElementById('us-count');
      count.innerHTML = '';
      count.appendChild(txt('b', null, String(vis.length)));
      count.appendChild(document.createTextNode(' ' + (vis.length === 1 ? 'usuário' : 'usuários') + (inativos ? ' · ' + inativos + ' inativo(s)' : '')));

      var sw = document.getElementById('us-showinactive'); sw.innerHTML = '';
      sw.appendChild(UI.checkbox({ checked: showInactive, label: 'Mostrar inativos', onToggle: function (v) { showInactive = v; renderList(); } }));

      var gp = document.getElementById('us-groupsetor'); gp.innerHTML = '';
      gp.appendChild(UI.checkbox({ checked: porSetor, label: 'Separar por setor', onToggle: function (v) { porSetor = v; renderList(); } }));

      var lb = document.getElementById('us-lotebtn'); lb.innerHTML = '';
      lb.appendChild(UI.button({ label: 'Cadastrar em lote', variant: 'ghost', icon: 'upload', onClick: function () { openLote(); } }));

      var nb = document.getElementById('us-newbtn'); nb.innerHTML = '';
      nb.appendChild(UI.button({ label: 'Adicionar usuário', icon: 'plus', onClick: function () { openEditor(null); } }));

      stage.innerHTML = '';
      var faixa = faixaTeste();
      if (faixa) { stage.appendChild(faixa); }

      if (!ALL.length) {
        var box = txt('div', 'us-msg');
        var ic = txt('div', 'us-msg-ic'); ic.appendChild(ico(PATH.users, 22)); box.appendChild(ic);
        box.appendChild(txt('div', 'us-msg-t', 'Ninguém cadastrado ainda'));
        box.appendChild(txt('div', 'us-msg-p', 'Use "Adicionar usuário" para liberar o primeiro acesso, ou "Cadastrar em lote" para conferir uma equipe inteira de uma vez.'));
        stage.appendChild(box);
        return;
      }
      if (!vis.length) {
        var box2 = txt('div', 'us-msg');
        var ic2 = txt('div', 'us-msg-ic'); ic2.appendChild(ico(PATH.users, 22)); box2.appendChild(ic2);
        box2.appendChild(txt('div', 'us-msg-t', 'Nenhum usuário para mostrar'));
        box2.appendChild(txt('div', 'us-msg-p', 'Todos os cadastros estão desativados. Marque "Mostrar inativos" para vê-los.'));
        stage.appendChild(box2);
        return;
      }

      if (!porSetor) {
        var list = txt('div', 'us-list');
        vis.forEach(function (u) { list.appendChild(row(u)); });
        stage.appendChild(list);
        return;
      }

      /* agrupado: o setor sem ninguém continua na tela, com o vazio da regra */
      var grupos = L.agruparPorSetor(vis, SETORES);
      grupos.forEach(function (g) {
        var bloco = txt('div', 'us-grupo' + (g.pai ? ' us-gfilho' : ''));
        bloco.appendChild(cabecalhoGrupo(g));
        if (!g.usuarios.length) {
          var vazio = txt('div', 'us-gvazio');
          vazio.appendChild(txt('b', null, 'Sem equipe cadastrada'));
          vazio.appendChild(document.createTextNode(' · Ninguém neste setor ainda. Use "Adicionar usuário" ou "Cadastrar em lote".'));
          bloco.appendChild(vazio);
        } else {
          var lista = txt('div', 'us-list');
          g.usuarios.forEach(function (u) { lista.appendChild(row(u)); });
          bloco.appendChild(lista);
        }
        stage.appendChild(bloco);
      });
    }

    /* M6: desativar sempre passa por confirmação e explica que nada é apagado. */
    function pedirDesativar(u) {
      if (!CAN_VIEW) { return; }
      if (u.uid === CURRENT_USER.uid) { toast('Você não pode desativar o seu próprio acesso.', 'err'); return; }
      var m = UI.modal({
        title: 'Desativar ' + (u.nome || 'usuário'),
        width: 420,
        body: function () {
          var p = txt('div', 'us-passo');
          p.appendChild(txt('div', null, 'Quem está desativado não consegue mais entrar no sistema.'));
          var ol = document.createElement('ol');
          ol.appendChild(txt('li', null, 'O cadastro continua guardado — nada é apagado.'));
          ol.appendChild(txt('li', null, 'O histórico do que a pessoa fez continua no lugar.'));
          ol.appendChild(txt('li', null, 'Dá para reativar a qualquer momento, aqui mesmo.'));
          p.appendChild(ol);
          return p;
        },
        footer: function (close) {
          var cancelar = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
          var ok = UI.button({ label: 'Desativar', icon: 'check', onClick: function () { close(); aplicarAtivo(u, false); } });
          return [cancelar, ok];
        }
      });
      return m;
    }

    function aplicarAtivo(u, ativo) {
      Store.setAtivo(u.uid, ativo).then(function () {
        toast(ativo ? ('Acesso de "' + u.nome + '" reativado.') : ('Acesso de "' + u.nome + '" desativado. O cadastro continua guardado.'));
        refresh();
      }).catch(function (e) { toast((e && e.message) || 'Erro ao alterar.', 'err'); });
    }

    function toggleAtivo(u) {
      if (!CAN_VIEW) { return; }
      if (u.ativo === false) { aplicarAtivo(u, true); return; }
      pedirDesativar(u);
    }

    /* M6: marcar/desmarcar sócio — só gestor, só sobre quem tem perfil Gestor. */
    function toggleSocio(u) {
      if (!CAN_VIEW) { return; }
      var permissao = L.podeMarcarSocio(CURRENT_USER, u);
      if (!permissao.pode) { toast(permissao.motivo, 'err'); return; }
      var virando = !(u.socio === true);
      Store.update(u.uid, { socio: virando }).then(function () {
        toast(virando
          ? ('"' + u.nome + '" agora assina como sócio.')
          : ('"' + u.nome + '" não assina mais como sócio.'));
        refresh();
      }).catch(function (e) { toast((e && e.message) || 'Erro ao alterar.', 'err'); });
    }

    /* ===================== editor (modal) ===================== */
    function openEditor(uid) {
      if (!CAN_VIEW) { return; }
      var editing = !!uid;
      var cur = editing ? ALL.filter(function (u) { return u.uid === uid; })[0] : null;
      if (editing && !cur) { return; }
      var isSelf = editing && cur.uid === CURRENT_USER.uid;

      var uidInput = UI.input({ value: editing ? cur.uid : '', placeholder: 'Cole o código do login (UID)', disabled: editing });
      var uidField = UI.field({ label: 'Código do login (UID)', required: !editing, control: uidInput,
        hint: editing ? 'É o código que liga o login a este cadastro. Não muda.'
          : 'Crie o login antes, no Console do Firebase (Authentication → Users → Add user), com o e-mail e uma senha provisória. Depois copie o código (UID) da conta criada e cole aqui. O sistema não cria login pelo navegador.' });

      var emailInput = UI.input({ value: editing ? cur.email : '', placeholder: 'pessoa@grautecnico.com.br' });
      var emailField = UI.field({ label: 'E-mail', required: true, control: emailInput, hint: 'Use o mesmo e-mail da conta no Authentication.' });

      var nomeInput = UI.input({ value: editing ? cur.nome : '', placeholder: 'Ex: Maria Silva' });
      var nomeField = UI.field({ label: 'Nome', required: true, control: nomeInput });

      var perfilOpts = PERFIS.map(function (p) { return { value: p.value, label: p.label }; });
      var perfilInicial = editing ? sugerePerfil(cur.perfil) : '';
      var perfilSelect = UI.select({ value: perfilInicial, placeholder: '— Selecione o perfil —', options: perfilOpts, disabled: isSelf,
        onChange: function (v) { updateLiderVisibility(v); updateSocioVisibility(v); } });
      var perfilHintTxt = isSelf ? 'Você não pode alterar o seu próprio perfil.'
        : ((editing && perfilLegado(cur.perfil)) ? ('Perfil atual: "' + cur.perfil + '" (antigo). Escolha um dos 3 para migrar. ' + PERFIL_HINT) : PERFIL_HINT);
      var perfilField = UI.field({ label: 'Perfil', required: true, control: perfilSelect, hint: perfilHintTxt });

      /* ----- R4-EXT: sócio (só quando o perfil é Gestor) ----- */
      var socioState = editing ? (cur.socio === true) : false;
      var socioChk = UI.checkbox({ checked: socioState, label: 'É sócio', onToggle: function (v) { socioState = v; } });
      var socioField = UI.field({ label: 'Alçada', control: socioChk,
        hint: 'Sócio assina a 2ª aprovação de itens de planejamento acima de R$ 200 (gestor + sócio) e é quem responde pelo setor SOC. Gestor sem esta marca é quem responde pelo GES. Sócio não é um perfil novo: é o Gestor com esta marca.' });
      socioField.style.display = 'none';
      function updateSocioVisibility(perfilVal) {
        socioField.style.display = (perfilVal === 'gestor') ? '' : 'none';
      }

      /* ----- F1-C: cache compartilhado de setores (raiz + subsetores, hierárquico) ----- */
      var setoresCache = null;
      function carregarSetores(then) {
        if (setoresCache !== null) { then(true); return; }
        Store.setoresTodos().then(function (arr) { setoresCache = arr; then(true); }).catch(function () { then(false); });
      }
      function rotuloSetor(s) { return s.pai ? ('↳ ' + s.nome + ' (' + s.sigla + ')') : (s.nome + ' (' + s.sigla + ')'); }

      /* ----- F1-C: SETOR de lotação (obrigatório para TODO perfil) ----- */
      var setorSel = null; /* <select> vivo (montado após carregar o cache) */
      var setorInicial = editing ? (cur.setor || '') : '';
      var setorBox = document.createElement('div');
      var setorField = UI.field({ label: 'Setor', required: true, control: setorBox,
        hint: 'Setor de lotação — define o que o usuário enxerga no calendário. Pode ser um setor ou um subsetor.' });
      function renderSetorSelect() {
        setorBox.innerHTML = '';
        if (setoresCache === null) {
          setorBox.appendChild(txt('div', 'us-em', 'Carregando setores…'));
          carregarSetores(function (ok) {
            if (!ok) { setorBox.innerHTML = ''; setorBox.appendChild(txt('div', 'us-em', 'Não consegui carregar os setores agora. Tente de novo.')); return; }
            renderSetorSelect();
          });
          return;
        }
        if (!setoresCache.length) {
          setorBox.appendChild(txt('div', 'us-em', 'Nenhum setor cadastrado ainda. Cadastre em Setores primeiro.'));
          return;
        }
        var opts = setoresCache.map(function (s) { return { value: s.sigla, label: rotuloSetor(s) }; });
        setorSel = UI.select({ value: setorInicial, placeholder: '— Escolha o setor —', options: opts });
        setorBox.appendChild(setorSel);
      }

      /* ----- setores liderados (aparece só quando o perfil é Líder) ----- */
      var liderState = (editing && Array.isArray(cur.setoresLiderados)) ? cur.setoresLiderados.slice() : [];
      var liderBox = document.createElement('div');
      var liderField = UI.field({ label: 'Setores que lidera', control: liderBox,
        hint: 'Marque a RAIZ para liderar o setor inteiro (inclui todos os subsetores), ou marque subsetores específicos. O Líder enxerga e cobra as atividades desses escopos.' });
      liderField.style.display = 'none';
      function renderLiderCheckboxes() {
        liderBox.innerHTML = '';
        if (setoresCache === null) {
          liderBox.appendChild(txt('div', 'us-em', 'Carregando setores…'));
          carregarSetores(function (ok) {
            if (!ok) { liderBox.innerHTML = ''; liderBox.appendChild(txt('div', 'us-em', 'Não consegui carregar os setores agora. Salve e tente de novo.')); return; }
            renderLiderCheckboxes();
          });
          return;
        }
        if (!setoresCache.length) {
          liderBox.appendChild(txt('div', 'us-em', 'Nenhum setor cadastrado ainda. Cadastre em Setores antes de definir a liderança.'));
          return;
        }
        var grid = txt('div', 'us-lidgrid');
        setoresCache.forEach(function (s) {
          var on = liderState.indexOf(s.sigla) >= 0;
          grid.appendChild(UI.checkbox({ checked: on, label: rotuloSetor(s), onToggle: function (v) {
            var i = liderState.indexOf(s.sigla);
            if (v && i < 0) { liderState.push(s.sigla); } else if (!v && i >= 0) { liderState.splice(i, 1); }
          } }));
        });
        liderBox.appendChild(grid);
      }
      function updateLiderVisibility(perfilVal) {
        if (perfilVal === 'lider') { liderField.style.display = ''; renderLiderCheckboxes(); }
        else { liderField.style.display = 'none'; }
      }
      renderSetorSelect(); /* F1-C: campo Setor visível para todo perfil, desde a abertura */

      var ativoState = editing ? (cur.ativo !== false) : true;
      var ativoField = null;
      if (editing && !isSelf) {
        var chk = UI.checkbox({ checked: cur.ativo !== false, label: 'Usuário ativo', onToggle: function (v) { ativoState = v; } });
        ativoField = UI.field({ label: 'Situação', control: chk, hint: 'Inativos não conseguem entrar; o registro é preservado.' });
      }

      var bodyFields = [uidField, nomeField, emailField, perfilField, socioField, setorField, liderField]; if (ativoField) { bodyFields.push(ativoField); }

      var saveBtn = null;
      var m = UI.modal({
        title: editing ? ('Editar ' + (cur.nome || 'usuário')) : 'Adicionar usuário',
        width: 480,
        body: bodyFields,
        footer: function (close) {
          var cancel = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
          saveBtn = UI.button({ label: editing ? 'Salvar' : 'Adicionar', icon: 'check', onClick: onSave });
          return [cancel, saveBtn];
        }
      });

      function submitOnEnter(e) { if (e.key === 'Enter') { e.preventDefault(); onSave(); } }
      uidInput.addEventListener('keydown', submitOnEnter);
      emailInput.addEventListener('keydown', submitOnEnter);
      nomeInput.addEventListener('keydown', submitOnEnter);
      updateLiderVisibility(perfilInicial); /* mostra setores se já for Líder ao abrir */
      updateSocioVisibility(perfilInicial);  /* R4-EXT: mostra a marca de sócio se já for Gestor */

      function onSave() {
        clearErrs(m.card);
        var uidVal = editing ? cur.uid : uidInput.value.trim();
        var email = emailInput.value.trim();
        var nome = nomeInput.value.trim();
        var perfil = isSelf ? cur.perfil : (perfilSelect.value || '');
        var setorVal = setorSel ? (setorSel.value || '') : '';
        /* M6: perfil EFETIVO — quem está no banco como "Admin"/"Editor" não pode
           perder a marca de sócio nem os setores liderados ao salvar. */
        var setoresLid = (L.perfilEfetivo(perfil) === 'lider') ? liderState.slice() : [];
        var socioVal = (L.perfilEfetivo(perfil) === 'gestor') ? socioState : false;
        var ok = true;
        if (!editing && !RX_UID.test(uidVal)) { setErr(uidField, 'Cole um UID válido (sem espaços).'); ok = false; }
        if (!RX_EMAIL.test(email)) { setErr(emailField, 'Informe um e-mail válido.'); ok = false; }
        if (nome.length < 2) { setErr(nomeField, 'Informe um nome com 2+ caracteres.'); ok = false; }
        if (PERFIL_STORABLE.indexOf(perfil) < 0) { setErr(perfilField, 'Selecione um perfil.'); ok = false; }
        if (!setorVal) { setErr(setorField, 'Escolha o setor do usuário.'); ok = false; }
        if (!ok) { return; }

        if (saveBtn) { saveBtn.disabled = true; }
        var op = editing
          ? Store.update(uidVal, { email: email, nome: nome, perfil: perfil, setor: setorVal, ativo: isSelf ? true : ativoState, setoresLiderados: setoresLid, socio: socioVal })
          : Store.create({ uid: uidVal, email: email, nome: nome, perfil: perfil, setor: setorVal, setoresLiderados: setoresLid, socio: socioVal });

        op.then(function () {
          m.close();
          toast(editing ? ('Usuário "' + nome + '" atualizado.') : ('Usuário "' + nome + '" adicionado.'));
          refresh();
        }).catch(function (e) {
          if (saveBtn) { saveBtn.disabled = false; }
          var f = e && e.field;
          if (f === 'uid') { setErr(uidField, e.message); }
          else if (f === 'email') { setErr(emailField, e.message); }
          else if (f === 'nome') { setErr(nomeField, e.message); }
          else if (f === 'perfil') { setErr(perfilField, e.message); }
          else if (f === 'setor') { setErr(setorField, e.message); }
          else { toast((e && e.message) || 'Erro ao salvar.', 'err'); }
        });
      }
    }

    /* ===================== cadastro em lote ===================== */
    function copiarTexto(t) {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(t).then(function () { toast('Copiado.'); },
          function () { toast('Não consegui copiar. Selecione o texto e copie na mão.', 'err'); });
        return;
      }
      var a = document.createElement('textarea');
      a.value = t; a.setAttribute('style', 'position:fixed;left:-9999px;top:0');
      document.body.appendChild(a); a.select();
      var ok = false;
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(a);
      toast(ok ? 'Copiado.' : 'Não consegui copiar. Selecione o texto e copie na mão.', ok ? '' : 'err');
    }

    function openLote() {
      if (!CAN_VIEW) { return; }
      var analise = null;        /* resultado de L.analisarLote */
      var campos = [];           /* [{ reg, input }] das linhas prontas */
      var gravarBtn = null;

      var ta = document.createElement('textarea');
      ta.className = 'us-ta';
      ta.setAttribute('spellcheck', 'false');
      ta.placeholder = 'Antonia Souza; antonia@grautecnico.com.br; lider; SEC\nKamile Lima; kamile@grautecnico.com.br; lider; CRA\nJoao Pereira; joao@grautecnico.com.br; usuario; SEC';

      var passo = txt('div', 'us-passo');
      passo.appendChild(txt('div', null, 'Uma pessoa por linha, com quatro partes separadas por ponto e vírgula: nome, e-mail, perfil (gestor, lider ou usuario) e sigla do setor.'));
      var ol = document.createElement('ol');
      ol.appendChild(txt('li', null, 'Cole a lista e clique em "Conferir a lista". Nada é gravado nesta etapa.'));
      ol.appendChild(txt('li', null, 'Crie o login de cada pessoa no Console do Firebase (Authentication → Users → Add user, com e-mail e uma senha provisória). O sistema não cria login pelo navegador.'));
      ol.appendChild(txt('li', null, 'Copie o código do login (UID) de cada pessoa e cole no campo da linha correspondente.'));
      ol.appendChild(txt('li', null, 'Clique em "Gravar os prontos". Só as linhas com código de login preenchido são gravadas; o resto continua aqui esperando.'));
      passo.appendChild(ol);

      var previa = document.createElement('div');

      function atualizarBotao() {
        if (!gravarBtn) { return; }
        var n = 0, i;
        for (i = 0; i < campos.length; i++) {
          if (campos[i].reg.estado === 'novo' && L.uidValido(campos[i].input.value)) { n++; }
        }
        var rot = gravarBtn.querySelector('span:last-child');
        if (rot) { rot.textContent = n ? ('Gravar os prontos (' + n + ')') : 'Gravar os prontos'; }
        gravarBtn.disabled = (n === 0);
      }

      function linhaPreview(reg) {
        var estadoCls = reg.estado === 'erro' ? ' erro' : (reg.estado === 'ja_existe' ? ' ja' : ' pronto');
        var el = txt('div', 'us-pl' + estadoCls);
        var cab = txt('div', 'us-plh');
        cab.appendChild(txt('span', 'us-pn', 'linha ' + reg.linha));
        cab.appendChild(txt('span', 'us-pnome', reg.valor.nome || '(sem nome)'));
        cab.appendChild(txt('span', 'us-pmail', reg.valor.email || ''));
        if (reg.valor.perfil) { cab.appendChild(txt('span', 'us-pchip', perfilLabel(reg.valor.perfil))); }
        if (reg.valor.setor) { cab.appendChild(txt('span', 'us-pchip', reg.valor.setor)); }
        if (reg.estado === 'erro') { cab.appendChild(txt('span', 'us-pchip bad', 'CORRIGIR')); }
        else if (reg.estado === 'ja_existe') { cab.appendChild(txt('span', 'us-pchip', 'JÁ CADASTRADO')); }
        else if (reg.estado === 'gravado') { cab.appendChild(txt('span', 'us-pchip ok', 'GRAVADO')); }
        else if (reg.avisos.length) { cab.appendChild(txt('span', 'us-pchip warn', 'CONFERIR')); }
        else { cab.appendChild(txt('span', 'us-pchip ok', 'PRONTO')); }
        el.appendChild(cab);

        var i;
        for (i = 0; i < reg.erros.length; i++) { el.appendChild(txt('div', 'us-pmsg', reg.erros[i])); }
        if (reg.estado === 'ja_existe' && reg.jaExiste) {
          el.appendChild(txt('div', 'us-pnota', 'Este e-mail já é de "' + reg.jaExiste.nome + '". A linha é ignorada para não criar cadastro duplicado.'));
        }
        for (i = 0; i < reg.avisos.length; i++) {
          el.appendChild(txt('div', 'us-pwarn',
            'Parecido com "' + reg.avisos[i].nome + '"' + (reg.avisos[i].setor ? ' (' + reg.avisos[i].setor + ')' : '') +
            ' — ' + reg.avisos[i].motivo + '. Confira se não é a mesma pessoa; se forem pessoas diferentes, siga em frente.'));
        }
        if (reg.estado === 'novo' && reg.valor.perfil === 'lider') {
          el.appendChild(txt('div', 'us-pnota', 'Depois de gravar, abra esta pessoa e marque quais setores ela lidera.'));
        }
        if (reg.estado === 'novo') {
          var box = txt('div', 'us-puid');
          box.appendChild(txt('span', 'rot', 'Código do login (UID):'));
          var inp = UI.input({ placeholder: 'cole aqui o UID do Console', onInput: function () { atualizarBotao(); } });
          box.appendChild(inp);
          el.appendChild(box);
          campos.push({ reg: reg, input: inp });
        }
        return el;
      }

      function renderPrevia() {
        campos = [];
        previa.innerHTML = '';
        if (!analise) { return; }
        if (!analise.linhas.length) {
          var vazio = txt('div', 'us-gvazio');
          vazio.appendChild(txt('b', null, 'Nada para conferir'));
          vazio.appendChild(document.createTextNode('Cole pelo menos uma linha com nome, e-mail, perfil e setor.'));
          previa.appendChild(vazio);
          atualizarBotao();
          return;
        }
        /* recontagem a cada desenho: depois de gravar, os estados mudam */
        var r = { prontos: 0, comAviso: 0, erros: 0, jaExistem: 0, gravados: 0 }, k;
        for (k = 0; k < analise.linhas.length; k++) {
          var est = analise.linhas[k].estado;
          if (est === 'erro') { r.erros++; }
          else if (est === 'ja_existe') { r.jaExistem++; }
          else if (est === 'gravado') { r.gravados++; }
          else { r.prontos++; if (analise.linhas[k].avisos.length) { r.comAviso++; } }
        }
        var res = txt('div', 'us-resumo');
        var b1 = txt('span', 'ok'); b1.appendChild(txt('b', null, String(r.prontos))); b1.appendChild(document.createTextNode(' pronto(s)')); res.appendChild(b1);
        var b2 = txt('span', 'warn'); b2.appendChild(txt('b', null, String(r.comAviso))); b2.appendChild(document.createTextNode(' para conferir')); res.appendChild(b2);
        var b3 = txt('span', 'bad'); b3.appendChild(txt('b', null, String(r.erros))); b3.appendChild(document.createTextNode(' para corrigir')); res.appendChild(b3);
        var b4 = txt('span'); b4.appendChild(txt('b', null, String(r.jaExistem))); b4.appendChild(document.createTextNode(' já cadastrado(s)')); res.appendChild(b4);
        if (r.gravados) {
          var b5 = txt('span', 'ok'); b5.appendChild(txt('b', null, String(r.gravados))); b5.appendChild(document.createTextNode(' gravado(s)')); res.appendChild(b5);
        }
        previa.appendChild(res);

        var lista = txt('div', 'us-prev');
        analise.linhas.forEach(function (reg) { lista.appendChild(linhaPreview(reg)); });
        previa.appendChild(lista);

        if (r.prontos) {
          var acts = txt('div', 'us-loteacts');
          acts.appendChild(UI.button({ label: 'Copiar os e-mails para criar o login', variant: 'ghost', onClick: function () {
            var mails = [], i;
            for (i = 0; i < analise.linhas.length; i++) {
              if (analise.linhas[i].estado === 'novo') { mails.push(analise.linhas[i].valor.email); }
            }
            copiarTexto(mails.join('\n'));
          } }));
          previa.appendChild(acts);
        }
        atualizarBotao();
      }

      function conferir() {
        analise = L.analisarLote(ta.value, { setores: SETORES, existentes: ALL });
        renderPrevia();
      }

      function gravar() {
        var fila = [], i;
        for (i = 0; i < campos.length; i++) {
          if (campos[i].reg.estado === 'novo' && L.uidValido(campos[i].input.value)) {
            fila.push({ reg: campos[i].reg, uid: L.limpar(campos[i].input.value) });
          }
        }
        if (!fila.length) { return; }
        gravarBtn.disabled = true;
        var gravados = 0, comProblema = 0;
        var p = Promise.resolve();
        fila.forEach(function (item) {
          p = p.then(function () {
            return Store.create({
              uid: item.uid, email: item.reg.valor.email, nome: item.reg.valor.nome,
              perfil: item.reg.valor.perfil, setor: item.reg.valor.setor,
              setoresLiderados: [], socio: false
            }).then(function () {
              gravados++;
              item.reg.estado = 'gravado';
              item.reg.avisos = [];
            }).catch(function (e) {
              comProblema++;
              item.reg.estado = 'erro';
              item.reg.erros = [(e && e.message) || 'Não consegui gravar esta linha.'];
            });
          });
        });
        p.then(function () {
          refresh();
          if (comProblema) {
            renderPrevia();
            toast(gravados + ' gravado(s) · ' + comProblema + ' com problema. Veja as linhas em vermelho.', 'err');
          } else {
            m.close();
            toast(gravados === 1 ? '1 pessoa cadastrada.' : (gravados + ' pessoas cadastradas.'));
          }
        });
      }

      var m = UI.modal({
        title: 'Cadastrar em lote',
        width: 720,
        body: [passo, ta, previa],
        footer: function (close) {
          var cancelar = UI.button({ label: 'Fechar', variant: 'ghost', onClick: close });
          var conf = UI.button({ label: 'Conferir a lista', icon: 'search', onClick: conferir });
          gravarBtn = UI.button({ label: 'Gravar os prontos', icon: 'check', onClick: gravar });
          gravarBtn.disabled = true;
          return [cancelar, conf, gravarBtn];
        }
      });
      return m;
    }

    /* ===================== identidade real ===================== */
    Guard.onReady(function (u) {
      CURRENT_USER = u;
      CAN_VIEW = (CURRENT_USER.perfil === 'gestor'); /* só Gestor gerencia usuários */
      mount();
    });
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
</html>
