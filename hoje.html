<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoje · Agenda — GERA</title>

<!-- provider + primitivos -->
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>

<style>
/* ===== layout da tela Hoje (cor 100% via var) ===== */
.hj-app{display:flex;min-height:100vh;background:var(--bg)}
.hj-app>.ui-side{position:sticky;top:0;height:100vh}
.hj-main{flex:1;min-width:0;display:flex;flex-direction:column}

.hj-top{display:flex;align-items:center;justify-content:space-between;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--s1)}
.hj-hi{font-size:21px;font-weight:800;letter-spacing:-.02em}
.hj-dd{font-size:13px;font-weight:500;color:var(--muted);margin-top:2px}
.hj-topactions{display:flex;align-items:center;gap:12px}
.hj-search{display:flex;align-items:center;gap:8px;padding:9px 13px;border-radius:10px;background:var(--s2);border:1px solid var(--border);color:var(--muted);font-size:13px;width:230px}
.hj-search svg{width:16px;height:16px;flex:none}

.hj-mhead{display:none;align-items:flex-start;justify-content:space-between;padding:14px 20px 16px;background:var(--s1);border-bottom:1px solid var(--border)}
.hj-mg{font-size:22px;font-weight:800;letter-spacing:-.02em}
.hj-md{font-size:12.5px;font-weight:500;color:var(--muted);margin-top:2px}

.hj-content{flex:1;padding:24px 32px 32px}
.hj-kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:24px}
.hj-cols{display:grid;grid-template-columns:1.55fr 1fr;gap:20px;align-items:start}
.hj-card{background:var(--s1);border:1px solid var(--border);border-radius:15px;padding:20px 22px}
.hj-cardhead{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.hj-ctitle{font-size:15px;font-weight:800}
.hj-nowbadge{display:flex;align-items:center;gap:7px;font-size:11.5px;font-weight:700;color:var(--greenText);background:var(--activeBg);padding:4px 10px;border-radius:20px}
.hj-nowbadge .pin{width:7px;height:7px;border-radius:50%;background:var(--brand)}
.hj-rstack{display:flex;flex-direction:column;gap:20px}
.hj-rhead{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.hj-rtitle{font-size:14.5px;font-weight:800}
.hj-rcount{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted)}
.hj-reddot{width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 0 3px var(--haloRed)}
.hj-late-badge{margin-left:auto;font-size:11px;font-weight:800;color:var(--red);background:var(--haloRed);padding:2px 9px;border-radius:20px}
.hj-list{display:flex;flex-direction:column;gap:9px}

/* timeline (markup próprio da tela) */
.hj-tl{display:flex;flex-direction:column}
.hj-tlrow{display:grid;grid-template-columns:54px 22px 1fr;align-items:stretch}
.hj-time{font-size:13px;font-weight:700;padding-top:14px;text-align:right;padding-right:12px}
.hj-rail{display:flex;flex-direction:column;align-items:center}
.hj-seg{width:2px;background:var(--track)}
.hj-tlrow .node{width:13px;height:13px}
.hj-ev{padding:0 0 14px 4px}
.hj-evcard{border-radius:11px;padding:11px 14px}
.hj-evcard.now{background:var(--activeBg);border:1px solid var(--brand)}
.hj-evcard.std{background:var(--s2);border:1px solid var(--border)}
.hj-evmeta{display:flex;align-items:center;gap:9px;margin-bottom:5px}
.hj-tag{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;padding:2px 8px;border-radius:6px;background:var(--chipBg);border:1px solid var(--border)}
/* F1-D(i): blocos colapsáveis por setor na lista "Atividades do dia" */
.hj-grp{border:1px solid var(--border);border-radius:12px;background:var(--s1);margin-bottom:8px;overflow:hidden}
.hj-grphd{display:flex;align-items:center;gap:9px;width:100%;background:transparent;border:0;font-family:inherit;cursor:pointer;padding:10px 12px;text-align:left}
.hj-grphd:focus-visible{outline:2px solid var(--brand);outline-offset:-2px;border-radius:12px}
.hj-grpcaret{display:inline-flex;color:var(--muted2);transition:transform .18s ease}
.hj-grp.closed .hj-grpcaret{transform:rotate(-90deg)}
.hj-grpnome{font-size:12.5px;font-weight:800;color:var(--text)}
.hj-grpline{flex:1;height:1px;background:var(--border)}
.hj-grpcount{font-size:11px;font-weight:700;color:var(--muted2);white-space:nowrap}
.hj-grpcount b{color:var(--text)}
.hj-grpbody{padding:2px 10px 8px}
.hj-grp.closed .hj-grpbody{display:none}
@media(prefers-reduced-motion:reduce){.hj-grpcaret{transition:none}}
/* F1-D(m): régua do dia — progresso vivo no topo */
.hj-prog{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadowSoft)}
.hj-prog-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;margin-bottom:8px}
.hj-prog-t{font-size:12.5px;font-weight:800;color:var(--text)}
.hj-prog-t b{font-size:15px}
.hj-prog-s{font-size:11.5px;font-weight:700;color:var(--muted2)}
.hj-prog-track{height:7px;border-radius:20px;background:var(--chipBg);overflow:hidden}
.hj-prog-fill{height:100%;border-radius:20px;background:var(--green);transition:width .45s var(--easeSwift),background .3s ease;min-width:0}
@media(prefers-reduced-motion:reduce){.hj-prog-fill{transition:none}}
/* F1-D(n): microrrespostas nas linhas do dia */
.hj-daytask{border-radius:9px;padding:5px 7px;margin:0 -7px;transition:background .15s ease}
.hj-daytask:hover{background:var(--chipBg)}
.hj-grp{box-shadow:var(--shadowSoft)}
.hj-grphd:hover .hj-grpnome{color:var(--greenText)}
.hj-evsec{font-size:11px;font-weight:600;color:var(--muted2)}
.hj-evt{font-size:14px;font-weight:700}

/* atividades do dia */
.hj-daytask{display:flex;align-items:center;gap:11px}
.hj-daytask .ui-check{flex:1}
.hj-freq{font-size:10px;font-weight:700;color:var(--muted2);background:var(--chipBg);padding:2px 7px;border-radius:6px;border:1px solid var(--border);flex:none}

/* atrasadas */
.hj-late{display:flex;align-items:center;gap:11px}
.hj-late-days{width:40px;text-align:center;flex:none}
.hj-late-dn{font-size:17px;font-weight:800;line-height:1;color:var(--tone)}
.hj-late-dl{font-size:9px;font-weight:700;color:var(--muted2);letter-spacing:.04em}
.hj-late-main{flex:1;min-width:0}
.hj-late-t{font-size:12.5px;font-weight:700;line-height:1.25}
.hj-late-s{font-size:10.5px;font-weight:600;color:var(--muted2);margin-top:1px}

/* dots da timeline (estados) */
.node{border-radius:50%;flex:none}
.node.done{background:var(--green);border:2px solid var(--green)}
.node.now{background:var(--brand);border:2px solid var(--brand);box-shadow:0 0 0 4px var(--activeBg)}
.node.todo{background:var(--s1);border:2px solid var(--track)}
.tcol-now{color:var(--greenText)} .tcol-done{color:var(--muted2)} .tcol-todo{color:var(--text)}
.ttl-done{color:var(--muted)} .ttl-live{color:var(--text)}

/* tab bar (mobile) */
.hj-tabbar{display:none}
.hj-tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-weight:600}
.hj-tab svg{width:22px;height:22px}
.hj-tab.on{color:var(--greenText);font-weight:700}
.hj-fab{width:50px;height:50px;border-radius:16px;background:var(--cta);color:var(--ctaText);display:flex;align-items:center;justify-content:center;margin-top:-6px;box-shadow:0 6px 16px var(--activeBg)}
.hj-fab svg{width:24px;height:24px}

/* toggle de tema temporário (até existir a tela Configurações) */
.hj-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--cardShadow)}
.hj-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}

@media (max-width:900px){
  .hj-app>.ui-side{display:none}
  .hj-top{display:none}
  .hj-mhead{display:flex}
  .hj-content{padding:16px 18px 96px}
  .hj-kpis{grid-template-columns:1fr 1fr}
  .hj-kpis .ui-kpi .info{display:none}
  .hj-kpis .ui-kpi .val{font-size:25px}
  .hj-cols{grid-template-columns:1fr}
  .hj-card{padding:16px}
  .hj-tlrow{grid-template-columns:46px 18px 1fr}
  .hj-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:80px;background:var(--s1);border-top:1px solid var(--border);align-items:flex-start;justify-content:space-around;padding:11px 14px 0;z-index:20}
  .hj-dev{bottom:94px}
}

/* ---- Meu Dia: adições ---- */
.hj-scope{display:inline-flex;gap:4px;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;margin-bottom:16px}
.hj-seg-b{border:0;background:transparent;color:var(--muted);font:inherit;font-size:12.5px;font-weight:700;padding:7px 14px;border-radius:8px;cursor:pointer}
.hj-seg-b.on{background:var(--s1);color:var(--text);box-shadow:0 1px 2px rgba(0,0,0,.18)}
.hj-act{border:1px solid var(--border);background:var(--s1);color:var(--text);font:inherit;font-size:11px;font-weight:700;padding:4px 10px;border-radius:8px;cursor:pointer}
.hj-act:hover{background:var(--s2)}
.hj-act.ok{color:var(--greenText);border-color:var(--green)}
.hj-act.warn{color:var(--orange);border-color:var(--orange)} /* R5-B1 */
.hj-rowacts{display:flex;gap:6px;margin-top:9px}
.hj-empty{font-size:12.5px;color:var(--muted);padding:8px 2px}
.hj-state{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:320px;padding:40px 20px}
.hj-state-t{font-size:16px;font-weight:800;color:var(--text)}
.hj-state-s{font-size:13px;color:var(--muted);max-width:460px;line-height:1.5}
.hj-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--s1);border:1px solid var(--border);color:var(--text);font-size:13px;font-weight:600;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:0 8px 24px rgba(0,0,0,.3)}
.hj-toast.err{border-color:var(--red);color:var(--red)}
/* ---- F1-I: streak, i, supervisiona e cobranças ---- */
.hj-fire{font-size:11.5px;font-weight:800;color:var(--orange);background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:3px 10px;margin-left:8px;white-space:nowrap}
.hj-i{width:18px;height:18px;border-radius:50%;border:1px solid var(--border);background:var(--s2);color:var(--muted2);font-size:11px;font-weight:800;line-height:1;cursor:pointer;margin-left:8px;flex:0 0 auto}
.hj-i:hover{color:var(--text);border-color:var(--brand)}
.hj-xcard{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:12px 16px;margin-bottom:14px;box-shadow:var(--shadowSoft)}
.hj-xhead{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.hj-xtitle{font-size:12.5px;font-weight:800}
.hj-xcount{margin-left:auto;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;background:var(--s2);border:1px solid var(--border)}
.hj-xrow{display:flex;align-items:center;gap:9px;padding:7px 0;border-top:1px solid var(--border);font-size:12.5px}
.hj-xrow:first-of-type{border-top:0}
.hj-xdot{width:8px;height:8px;border-radius:50%;flex:0 0 auto}
.hj-xtit{font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hj-xmeta{margin-left:auto;font-size:11px;font-weight:700;color:var(--muted2);white-space:nowrap}
.hj-xlink{font-size:11.5px;font-weight:800;color:var(--brand);text-decoration:none;margin-top:6px;display:inline-block}
/* ---- N4-B: botão "Agenda de Eventos" pulsante (D2) — tokens, sem hex ---- */
.hj-evbtn{position:relative}
.hj-evbtn.pulse{animation:hjEvPulse 1.6s ease-in-out infinite}
@keyframes hjEvPulse{
  0%,100%{box-shadow:0 0 0 0 var(--haloDoing)}
  50%{box-shadow:0 0 0 7px var(--haloDoing)}
}
@media (prefers-reduced-motion: reduce){
  .hj-evbtn.pulse{animation:none;box-shadow:0 0 0 3px var(--haloDoing)}
}
</style>
</head>
<body>

  <!-- portão de acesso (guard.js controla) -->
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="hj-dev" data-theme-toggle type="button" title="Alternar tema (temporário)"><span class="pin"></span>Tema</button>

  <div class="hj-app" id="app">
    <!-- sidebar inserida via JS (desktop) -->
    <main class="hj-main">

      <div class="hj-top">
        <div style="line-height:1.2">
          <div class="hj-hi">Olá</div>
          <div class="hj-dd">Quinta-feira, 26 de junho de 2026 · Agenda do dia</div>
        </div>
        <div class="hj-topactions">
          <div class="hj-search">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"></circle><path d="M21 21l-4-4"></path></svg>
            <span>Buscar reunião ou atividade</span>
          </div>
          <span id="hj-cta"></span>
        </div>
      </div>

      <div class="hj-mhead">
        <div>
          <div class="hj-mg">Olá</div>
          <div class="hj-md">Quinta, 26 de junho · 12 atividades</div>
        </div>
        <span id="hj-mav"></span>
      </div>

      <div class="hj-content">
        <div class="hj-scope" id="hj-scope"></div>
      <div class="hj-state" id="hj-state"></div>
      <div id="hj-prog"></div>
      <div class="hj-kpis" id="hj-kpis" data-lente="numeros"></div>

        <div class="hj-cols" data-lente="eufaco">
          <div class="hj-card">
            <div class="hj-cardhead">
              <div class="hj-ctitle">Linha do tempo de hoje</div>
              <div class="hj-nowbadge"><span class="pin"></span> 11:24 agora</div>
            </div>
            <div class="hj-tl" id="hj-timeline"></div>
          </div>

          <div class="hj-rstack">
            <div class="hj-card">
              <div class="hj-rhead"><div class="hj-rtitle">Atividades do dia</div><span class="hj-rcount">5 de 12</span></div>
              <div class="hj-list" id="hj-daytasks"></div>
            </div>
            <div class="hj-card">
              <div class="hj-rhead"><span class="hj-reddot"></span><div class="hj-rtitle">Atrasadas e críticas</div><span class="hj-late-badge">4</span></div>
              <div class="hj-list" id="hj-atrasadas"></div>
            </div>
          </div>
        </div>
      </div>

    </main>
  </div>

  <!-- tab bar mobile -->
  <div class="hj-tabbar">
    <div class="hj-tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>Hoje</span></div>
    <div class="hj-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path><circle cx="9" cy="7" r="4"></circle><path d="M23 21v-2a4 4 0 0 0-3-3.87M16 3.13a4 4 0 0 1 0 7.75"></path></svg><span>Reuniões</span></div>
    <div class="hj-fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
    <div class="hj-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="17 1 21 5 17 9"></polyline><path d="M3 11V9a4 4 0 0 1 4-4h14"></path><polyline points="7 23 3 19 7 15"></polyline><path d="M21 13v2a4 4 0 0 1-4 4H3"></path></svg><span>Atividades</span></div>
    <div class="hj-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 1 16 0"></path><path d="M4 11v3a8 8 0 0 0 16 0v-3"></path></svg><span>Perfil</span></div>
  </div>

  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script src="ctx.js"></script>
  <script src="lentes.js"></script>
  <script>
  /* ================= MEU DIA — dados REAIS (zero mock) =================
     Carrega via KPI.carregar (mesmo motor validado da Inteligência) e
     filtra pelo usuário logado. Ações de 1 toque gravam override em
     `ocorrencias` (idempotente) + atividade_log, igual ao atividades.html. */
  var CURRENT_USER = null;
  var MODO = 'minhas';          /* 'minhas' | 'todas' */
  var MODELO = null;            /* último KPI.carregar */
  var R = window.GrautRecorrencia;
  var RECOR_LABEL = { diario: 'Diário', semanal: 'Semanal', quinzenal: 'Quinzenal', mensal: 'Mensal', bimestral: 'Bimestral', trimestral: 'Trimestral', unico: 'Único' };
  /* P2: camada do organograma (Sócio = gestão indireta · Gestor = direta · Operacional = líder+assistente).
     Atividade antiga sem o campo: sem etiqueta; no filtro conta como 'operacional' (mesmo default do import). */
  var CAMADA_LABEL = { socio: 'Sócio', gestor: 'Gestor', operacional: 'Operacional' };
  var CAMADA_COR = { socio: 'brand', gestor: 'orange', operacional: 'muted2' };
  var FCAMADA = 'todas';          /* 'todas' | 'socio' | 'gestor' | 'operacional' */
  var HJ_ABERTO = {};             /* F1-D(i): colapso por setor (memória da sessão; false = fechado) */
  var CONVOC = [];                /* F1-E · 3.1: reuniões abertas em que fui convocado */
  var PLANOS = [];                /* F1-I: planos de ação vivos (só líder/gestor) p/ escalonamento D-5/D-3/D-0 */
  var CELEBRADO = '';
  var CELEB80 = '';               /* F1-N: marco dos 80% — 1 toast por dia */             /* F1-I: 1 celebração por dia por sessão (Kahneman: nudge único, nunca modal) */
  var LAST_NUM = {};              /* F1-I: números da última pintura p/ os "i" estáticos */
  var HJ_I_ATRAS = false;         /* F1-I: "i" das Atrasadas injetado 1x */
  var TIPO_LABEL_R = { lideres: 'Reunião de Líderes', integrada: 'Reunião Integrada', instrutor: 'Reunião com Instrutor', lideres_turma: 'Reunião c/ Líderes de Turmas', departamento: 'Reunião de Departamento' };
  /* R5-B1 · lista O3 do RESUMO (falta em reunião) — mesma lista usada no
     "justificar falta" da tela Reuniões; 'Outro' exige detalhe. */
  var MOTIVOS_FALTA = ['Conflito de agenda', 'Atendimento urgente', 'Ausência justificada', 'Esquecimento/não vi', 'Outro'];
  function origemReuniao(act) {
    return act && (act.origemTipo === 'reuniao' || (act.origem && act.origem.tipo === 'reuniao'));
  }

  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function txt(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } e.textContent = text == null ? '' : text; return e; }

  /* ---------- Firestore (mesmo padrão do atividades/kpi) ---------- */
  var _fb = null;
  function fb() {
    if (!_fb) {
      _fb = Promise.all([
        import('./firebase.js'),
        import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
      ]).then(function (m) { return { db: m[0].db, f: m[1] }; });
    }
    return _fb;
  }
  function ferr(e) {
    var code = (e && e.code) || '';
    if (code === 'permission-denied') { return new Error('Sem permissão para gravar. Confirme seu perfil e as Regras publicadas.'); }
    return new Error((e && e.message) || 'Erro ao falar com o banco.');
  }

  var Store = {
    /* R4-B3: planos da competência (1 query where+limit; filtro de sigla
       no cliente — evita 'in' e índice composto). */
    listPlanejamentosComp: function (comp) {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'planejamentos'), c.f.where('competencia', '==', comp), c.f.limit(100));
        return c.f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var o = d.data() || {}; o.id = d.id; if (o.ativo !== false) { a.push(o); } });
          return a;
        });
      }).catch(function () { return []; });
    },
    log: function (entry) {
      return fb().then(function (c) {
        var row = Object.assign({ ts: Date.now(), uid: (CURRENT_USER && CURRENT_USER.uid) || null }, entry);
        return c.f.addDoc(c.f.collection(c.db, 'atividade_log'), row);
      }).catch(function (e) { if (window.console && console.warn) { console.warn('[hoje] log falhou', e); } });
    },
    setOcorrencia: function (act, origData, patch, acao) {
      return fb().then(function (c) {
        var idoc = R.docIdOcorrencia(act.id, origData);
        var base = {
          atividadeId: act.id,
          setorSigla: act.setorSigla,
          responsavelUid: act.responsavelUid || null,
          data: origData,
          prazoOriginal: origData
        };
        var body = Object.assign(base, patch);
        return c.f.setDoc(c.f.doc(c.db, 'ocorrencias', idoc), body, { merge: true }).then(function () {
          Store.log({ acao: acao, entidade: 'ocorrencia', refId: idoc, antes: null, depois: patch });
        });
      }).catch(function (e) { throw ferr(e); });
    },
    /* F1-E · 3.1: convocações do usuário — reuniões abertas onde ele foi
       convocado. where('convocadosUids','array-contains') + limit; filtro de
       ativo/encerrada NO CLIENTE (evita índice composto). Falha degrada p/ []. */
    /* F1-I: planos vivos p/ o escalonamento D-5/D-3/D-0 (mesma query da
       Inteligência: where ativo + limit 100). Falha → [] (o Hoje nunca quebra). */
    listPlanosVivos: function () {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'planos_acao'), c.f.where('ativo', '==', true), c.f.limit(100));
        return c.f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { a.push(Object.assign({ id: d.id }, d.data())); });
          return a;
        });
      }).catch(function () { return []; });
    },
    /* F1-N: convocado confirma a própria presença (regra espelhada no
       Firestore: só adiciona a si; nunca remove ninguém). R5-B1: a regra
       subiu de fato (hasOnly confirmadosUids+recusas) e confirmar agora
       LIMPA a própria recusa, se houver ("vou sim"). */
    confirmarPresenca: function (reuniaoId, atuais, uid, recusas) {
      return fb().then(function (c) {
        var novo = (Array.isArray(atuais) ? atuais.slice() : []);
        if (novo.indexOf(uid) === -1) { novo.push(uid); }
        var patch = { confirmadosUids: novo };
        if (recusas && recusas[uid]) {
          var rc = {}; Object.keys(recusas).forEach(function (k) { if (k !== uid) { rc[k] = recusas[k]; } });
          patch.recusas = rc;
        }
        return c.f.updateDoc(c.f.doc(c.db, 'reunioes', reuniaoId), patch).then(function () {
          return Store.log({ acao: 'confirmar_presenca', entidade: 'reuniao', refId: reuniaoId, antes: null, depois: { uid: uid } });
        });
      });
    },
    /* R5-B1: convocado avisa que NÃO vem, com motivo pré-definido (padrão
       RSVP Google Calendar "Não vou"). Grava recusas[uid] e sai da lista de
       confirmados. Só mexe no PRÓPRIO uid (auditado no atividade_log). */
    recusarPresenca: function (reuniaoId, confirmados, recusas, uid, nome, motivo, detalhe) {
      return fb().then(function (c) {
        var conf = (Array.isArray(confirmados) ? confirmados : []).filter(function (u) { return u !== uid; });
        var rc = {}; Object.keys(recusas || {}).forEach(function (k) { rc[k] = recusas[k]; });
        rc[uid] = { motivo: motivo, detalhe: detalhe || null, nome: nome || '', em: Date.now() };
        return c.f.updateDoc(c.f.doc(c.db, 'reunioes', reuniaoId), { confirmadosUids: conf, recusas: rc }).then(function () {
          return Store.log({ acao: 'recusar_presenca', entidade: 'reuniao', refId: reuniaoId, antes: null, depois: { uid: uid, motivo: motivo } });
        });
      });
    },
    /* R5-B1: ACEITE DE ATRIBUIÇÃO (padrão Outlook Accept/Decline): o
       responsável aceita ou recusa o compromisso nascido de decisão de
       reunião. Regra espelhada: responsavelUid == auth + hasOnly(aceite,
       recusaAtribuicao, atualizadoEm). A recusa NÃO desatribui — sinaliza
       o líder para reatribuir (a decisão de gente é humana). */
    aceitarAtribuicao: function (actId, patch, acao) {
      return fb().then(function (c) {
        var up = Object.assign({}, patch, { atualizadoEm: Date.now() });
        return c.f.updateDoc(c.f.doc(c.db, 'atividades', actId), up).then(function () {
          return Store.log({ acao: acao, entidade: 'atividade', refId: actId, antes: null, depois: patch });
        });
      });
    },
    listMinhasConvocacoes: function (uid) {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'reunioes'),
          c.f.where('convocadosUids', 'array-contains', uid), c.f.limit(20));
        return c.f.getDocs(q).then(function (snap) {
          var a = [];
          snap.forEach(function (d) { var r = d.data() || {}; r.id = d.id; a.push(r); });
          return a.filter(function (r) { return r.ativo !== false && !r.encerradaEm; })
            .sort(function (x, y) { return (x.data || '').localeCompare(y.data || ''); });
        });
      }).catch(function () { return []; });
    }
  };

  /* ---------- toast ---------- */
  function toast(msg, kind) {
    var t = el('<div class="hj-toast' + (kind === 'err' ? ' err' : '') + '"></div>');
    t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 2600);
  }

  /* ---------- mutações (1 toque) ---------- */
  function CAN_WRITE() { var p = (CURRENT_USER && CURRENT_USER.profile) || ''; return p === 'Admin' || p === 'Editor'; }
  /* F1-J: o RESPONSÁVEL age nas próprias (padrão Asana: assignado conclui
     a própria tarefa mesmo sendo somente-leitura no resto). Espelha a regra
     do Firestore — só concluir/iniciar/reabrir; reprogramar/pular seguem
     com líder/gestor. */
  function PODE_AGIR(o) {
    if (CAN_WRITE()) { return true; }
    return !!(o && o.act && CURRENT_USER && o.act.responsavelUid === CURRENT_USER.uid);
  }
  function mutar(o, patch, acao, msg) {
    if (!CAN_WRITE()) { toast('Seu perfil só visualiza.', 'err'); return; }
    Store.setOcorrencia(o.act, o.origData, patch, acao)
      .then(function () { toast(msg); refresh(); })
      .catch(function (e) { toast(e.message, 'err'); });
  }
  function concluir(o) { mutar(o, { status: 'concluida', concluidaEm: Date.now() }, 'concluir_ocorrencia', 'Concluída. ✔'); }
  function reabrir(o) { mutar(o, { status: 'pendente', concluidaEm: null }, 'reabrir_ocorrencia', 'Reaberta.'); }
  function iniciar(o) { mutar(o, { status: 'em_andamento', iniciadaEm: Date.now() }, 'iniciar_ocorrencia', 'Em andamento.'); }

  /* ---------- helpers de exibição ---------- */
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function saudacao() { var h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
  function dataLonga(iso) {
    var M = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    var D = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    var d = R.fromISO(iso);
    return D[d.getDay()] + ', ' + d.getDate() + ' de ' + M[d.getMonth()] + ' de ' + d.getFullYear();
  }
  function chipSetor(act) {
    if (act.todosSetores) { var a = txt('span', 'hj-tag', 'Todos'); a.style.color = 'var(--muted2)'; return a; }
    var sig = KPI.setoresDe(act, MODELO.setores)[0] || '—';
    var c = KPI.corSetor(sig, MODELO.setores);
    var s = txt('span', 'hj-tag', sig); s.style.color = 'var(--' + c + ')';
    return s;
  }
  function chipCamada(act) {
    var c = act && act.camada;
    if (!c || !CAMADA_LABEL[c]) { return null; }
    var s = txt('span', 'hj-tag', CAMADA_LABEL[c]);
    s.style.color = 'var(--' + (CAMADA_COR[c] || 'muted2') + ')';
    return s;
  }
  function miniBtn(label, fn, tone) {
    var b = el('<button type="button" class="hj-act' + (tone ? ' ' + tone : '') + '"></button>');
    b.textContent = label;
    b.addEventListener('click', function (ev) { ev.stopPropagation(); fn(); });
    return b;
  }

  /* ---------- derivação das seções (puro, testável) ---------- */
  function derivar(board, hoje) {
    var doHoje = [], atras = [];
    board.forEach(function (o) {
      if (o.atrasada) { atras.push(o); }
      if (o.effDate === hoje && o.status !== 'pulada') { doHoje.push(o); }
    });
    atras.sort(function (a, b) { return a.effDate < b.effDate ? -1 : 1; });
    var comHora = doHoje.filter(function (o) { return !!o.horario; })
      .sort(function (a, b) { return (a.horario || '') < (b.horario || '') ? -1 : 1; });
    var semHora = doHoje.filter(function (o) { return !o.horario; })
      .sort(function (a, b) { return (a.act.titulo || '').localeCompare(b.act.titulo || '', 'pt-BR'); });
    var feitasHoje = doHoje.filter(function (o) { return o.status === 'concluida'; }).length;
    return { doHoje: doHoje, atras: atras, comHora: comHora, semHora: semHora, feitasHoje: feitasHoje };
  }

  /* ---------- linhas ---------- */
  function tlRow(o, agoraHM) {
    var state = o.status === 'concluida' ? 'done' : (o.status === 'em_andamento' ? 'now' : 'todo');
    var timeClass = state === 'now' ? 'tcol-now' : state === 'done' ? 'tcol-done' : 'tcol-todo';
    var row = el('<div class="hj-tlrow"></div>');
    row.appendChild(txt('div', 'hj-time ' + timeClass, o.horario || ''));
    row.appendChild(el('<div class="hj-rail"><div class="hj-seg" style="height:14px"></div><div class="node ' + state + '"></div><div class="hj-seg" style="flex:1"></div></div>'));
    var ev = el('<div class="hj-ev"></div>');
    var card = el('<div class="hj-evcard ' + (state === 'now' ? 'now' : 'std') + '"></div>');
    var meta = el('<div class="hj-evmeta"></div>');
    meta.appendChild(chipSetor(o.act));
    meta.appendChild(txt('span', 'hj-evsec', RECOR_LABEL[o.act.recorrencia] || ''));
    var camTl = chipCamada(o.act); if (camTl) { meta.appendChild(camTl); }
    if (o.status === 'em_andamento') { var em = txt('span', 'hj-evsec', 'em andamento'); em.style.color = 'var(--doing)'; meta.appendChild(em); }
    card.appendChild(meta);
    card.appendChild(txt('div', 'hj-evt ' + (state === 'done' ? 'ttl-done' : 'ttl-live'), o.titulo));
    if (PODE_AGIR(o)) {
      var acts = el('<div class="hj-rowacts"></div>');
      if (state === 'done') { acts.appendChild(miniBtn('Reabrir', function () { reabrir(o); })); }
      else {
        acts.appendChild(miniBtn('Concluir', function () { concluir(o); }, 'ok'));
        if (state !== 'now') { acts.appendChild(miniBtn('Iniciar', function () { iniciar(o); })); }
      }
      card.appendChild(acts);
    }
    ev.appendChild(card); row.appendChild(ev);
    return row;
  }

  function dayRow(o) {
    var row = el('<div class="hj-daytask"></div>');
    var done = o.status === 'concluida';
    row.appendChild(UI.checkbox({
      checked: done, label: o.titulo,
      onToggle: function () { if (!PODE_AGIR(o)) { toast('Só o responsável (ou líder/gestor) marca esta.', 'err'); refresh(); return; } if (done) { reabrir(o); } else { concluir(o); } }
    }));
    if (o.status === 'em_andamento') { var em = txt('span', 'hj-freq', 'Em andamento'); em.style.color = 'var(--doing)'; row.appendChild(em); }
    else if (!done && PODE_AGIR(o)) { row.appendChild(miniBtn('Iniciar', function () { iniciar(o); })); }
    var camDia = chipCamada(o.act); if (camDia) { row.appendChild(camDia); }
    if (origemReuniao(o.act)) {
      var chR = txt('span', 'hj-freq', 'Reunião'); chR.style.color = 'var(--doing)';
      var ogD = o.act.origem || {};
      chR.title = 'Nasceu na reunião' + (ogD.reuniaoTitulo ? ' "' + ogD.reuniaoTitulo + '"' : '') + (ogD.reuniaoData ? ' de ' + ogD.reuniaoData : '');
      row.appendChild(chR);
    }
    row.appendChild(txt('span', 'hj-freq', RECOR_LABEL[o.act.recorrencia] || ''));
    return row;
  }

  function lateRow(o, hoje) {
    var days = R.diasEntre(o.effDate, hoje);
    var sev = days >= 8 ? { t: 'red', l: 'Crítico' } : days >= 4 ? { t: 'orange', l: 'Alto' } : { t: 'amber', l: 'Médio' };
    var row = el('<div class="hj-late" style="--tone:var(--' + sev.t + ')"></div>');
    var dd = el('<div class="hj-late-days"></div>');
    dd.appendChild(txt('div', 'hj-late-dn', String(days)));
    dd.appendChild(txt('div', 'hj-late-dl', days === 1 ? 'DIA' : 'DIAS'));
    row.appendChild(dd);
    var main = el('<div class="hj-late-main"></div>');
    main.appendChild(txt('div', 'hj-late-t', o.titulo));
    var sigs = o.act.todosSetores ? 'Todos os setores' : KPI.setoresDe(o.act, MODELO.setores).join(' · ');
    var camTx = (o.act.camada && CAMADA_LABEL[o.act.camada]) ? ' · ' + CAMADA_LABEL[o.act.camada] : '';
    main.appendChild(txt('div', 'hj-late-s', sigs + camTx + (o.responsavel ? ' · ' + o.responsavel : '')));
    row.appendChild(main);
    if (origemReuniao(o.act)) {
      var chL = txt('span', 'hj-freq', 'Reunião'); chL.style.color = 'var(--doing)';
      var ogL = o.act.origem || {};
      chL.title = 'Nasceu na reunião' + (ogL.reuniaoTitulo ? ' "' + ogL.reuniaoTitulo + '"' : '') + (ogL.reuniaoData ? ' de ' + ogL.reuniaoData : '');
      row.appendChild(chL);
    }
    if (PODE_AGIR(o)) { row.appendChild(miniBtn('Concluir', function () { concluir(o); }, 'ok')); }
    row.appendChild(UI.statusPill(sev.l, { tone: sev.t }));
    return row;
  }

  /* ---------- F1-I · "i" leve (Protocolo A: fórmula + dados + números) ---------- */
  function infoHj(titulo, d) {
    var b = el('<button type="button" class="hj-i" aria-label="Como este número é calculado">i</button>');
    b.addEventListener('click', function (ev) {
      ev.stopPropagation();
      var dd = (typeof d === 'function') ? d() : d;   /* função = números do momento */
      var body = [];
      [['FÓRMULA', dd.formula], ['DADOS', dd.dados], ['NÚMEROS DESTE CÁLCULO', dd.numeros]].forEach(function (r) {
        if (!r[1]) { return; }
        var k = txt('div', 'hj-prog-s', r[0]); k.style.marginTop = '8px';
        var v = txt('div', '', r[1]); v.style.cssText = 'font-size:12.5px;line-height:1.5';
        body.push(k); body.push(v);
      });
      UI.modal({ title: titulo, width: 460, body: body,
        footer: function (close) { return [UI.button({ label: 'Entendi', onClick: close })]; } });
    });
    return b;
  }

  /* ---------- F1-I · Você supervisiona (campo supervisor → valor no dia) ----------
     Ocorrências ABERTAS já vencidas ou de hoje cujas atividades têm
     supervisorUid = você (e o responsável é OUTRA pessoa). Derivado do
     MESMO board — zero query nova. Só rastreio e cobrança leve.       */
  function cardSupervisiona(m, hoje) {
    var uid = CURRENT_USER.uid;
    if (!uid || (Guard.isUsuario && Guard.isUsuario())) { return null; }
    var itens = m.board.filter(function (o) {
      var a = o.act || {};
      if (a.supervisorUid !== uid || a.responsavelUid === uid) { return false; }
      var aberta = o.status === 'pendente' || o.status === 'em_andamento' || o.status === 'reprogramada';
      return aberta && o.effDate && R.compareISO(o.effDate, hoje) <= 0;
    }).sort(function (a, b) { return ((b.atrasada ? 1 : 0) - (a.atrasada ? 1 : 0)) || (a.effDate < b.effDate ? -1 : 1); });
    if (!itens.length) { return null; }
    var atras = itens.filter(function (o) { return o.atrasada; }).length;
    var card = el('<div class="hj-xcard"></div>');
    var hd = el('<div class="hj-xhead"></div>');
    hd.appendChild(txt('div', 'hj-xtitle', 'Você supervisiona'));
    hd.appendChild(infoHj('Você supervisiona', {
      formula: 'ocorrências ABERTAS (pendente, em andamento ou reprogramada) já vencidas ou de hoje, cujas atividades têm VOCÊ como supervisor e outra pessoa como responsável.',
      dados: 'campo supervisor da atividade (sugerido pela hierarquia, editável) + as mesmas ocorrências do painel.',
      numeros: itens.length + ' aberta(s) · ' + atras + ' atrasada(s)'
    }));
    var ct = el('<span class="hj-xcount"></span>');
    ct.textContent = itens.length + ' aberta(s)' + (atras ? ' · ' + atras + ' atrasada(s)' : '');
    ct.style.color = atras ? 'var(--red)' : 'var(--muted2)';
    hd.appendChild(ct);
    card.appendChild(hd);
    itens.slice(0, 5).forEach(function (o) {
      var row = el('<div class="hj-xrow"></div>');
      row.style.cursor = 'pointer';
      row.title = 'Abrir esta atividade';
      row.addEventListener('click', function () { window.location.href = 'atividades.html#a=' + encodeURIComponent(o.act.id); });
      row.appendChild(el('<span class="hj-xdot" style="background:var(--' + (o.atrasada ? 'red' : 'amber') + ')"></span>'));
      var t = el('<span class="hj-xtit"></span>');
      t.textContent = (o.act.titulo || '(sem título)'); t.title = t.textContent;
      row.appendChild(t);
      var mt = el('<span class="hj-xmeta"></span>');
      var dd = o.atrasada ? R.diasEntre(o.effDate, hoje) : 0;
      mt.textContent = (o.act.responsavelNome || 'sem responsável') + (dd ? ' · ' + dd + 'd de atraso' : ' · hoje');
      row.appendChild(mt);
      card.appendChild(row);
    });
    if (itens.length > 5) { card.appendChild(txt('div', 'hj-prog-s', '+ ' + (itens.length - 5) + ' outra(s).')); }
    return card;
  }

  /* ---------- F1-I · Cobranças do PEF (escalonamento D-5/D-3/D-0) ----------
     Spec travada: D-5 alerta o DONO · D-3 escala à GESTÃO · D-0 vira
     NÃO-CONFORMIDADE. NUNCA bloqueia. Derivado (KPI.escalonamentoPlano,
     harness_f1i): gestor vê tudo; líder vê só os planos em que é o dono. */
  function cardCobrancas(m, hoje) {
    if (!PLANOS.length) { return null; }
    var souGestor = Guard.isGestor && Guard.isGestor();
    var uid = CURRENT_USER.uid;
    var itens = [];
    PLANOS.forEach(function (p) {
      var prog = KPI.pctPlano(p.atividadeIds, m.board, hoje);
      var esc = KPI.escalonamentoPlano(p, prog.pct, hoje);
      if (!esc) { return; }
      if (!souGestor && p.donoUid !== uid) { return; }
      itens.push({ p: p, pct: prog.pct, esc: esc });
    });
    if (!itens.length) { return null; }
    var peso = { D0: 0, D3: 1, D5: 2 };
    itens.sort(function (a, b) { return peso[a.esc.nivel] - peso[b.esc.nivel] || ((a.p.prazo || '') < (b.p.prazo || '') ? -1 : 1); });
    var card = el('<div class="hj-xcard"></div>');
    var hd = el('<div class="hj-xhead"></div>');
    hd.appendChild(el('<span class="hj-reddot"></span>'));
    hd.appendChild(txt('div', 'hj-xtitle', 'Cobranças do PEF — planos escalando'));
    hd.appendChild(infoHj('Cobranças do PEF', {
      formula: 'plano de ação abaixo de 70% escala sozinho: faltando ≤ 5 dias alerta o DONO (D-5) · faltando ≤ 3 dias sobe à GESTÃO (D-3) · vencido vira NÃO-CONFORMIDADE (D-0). Nunca bloqueia nada — só muda de dono e de cor.',
      dados: 'planos de ação vivos + % derivado das atividades vinculadas (mesma conta da Inteligência).',
      numeros: itens.length + ' plano(s) escalando agora'
    }));
    var ct = el('<span class="hj-xcount"></span>'); ct.textContent = itens.length; ct.style.color = 'var(--red)';
    hd.appendChild(ct);
    card.appendChild(hd);
    itens.slice(0, 5).forEach(function (it) {
      var row = el('<div class="hj-xrow"></div>');
      row.appendChild(el('<span class="hj-xdot" style="background:var(--' + it.esc.tom + ')"></span>'));
      var t = el('<span class="hj-xtit"></span>');
      t.textContent = it.p.titulo || '(sem título)'; t.title = t.textContent;
      row.appendChild(t);
      var mt = el('<span class="hj-xmeta"></span>');
      mt.textContent = it.esc.rotulo + ' · ' + (it.pct == null ? 'coletando' : it.pct + '%') +
        ' · dono ' + (it.p.donoNome || '—') + ' · prazo ' + (it.p.prazo ? it.p.prazo.split('-').reverse().join('/') : '—');
      row.appendChild(mt);
      card.appendChild(row);
    });
    var lk = el('<a class="hj-xlink" href="inteligencia.html">Tratar na Inteligência →</a>');
    card.appendChild(lk);
    return card;
  }

  /* ---------- F1-N · G1: COCKPIT DO LÍDER ----------
     4 números do MEU escopo (Parmenter: poucos heróis; Marr: cada um
     dispara ação). Só perfil líder; derivado do MESMO board.          */
  function escopoDoLider() {
    if (!(Guard.isLider && Guard.isLider())) { return null; }
    var lids = USER.setoresLiderados || [];
    if (!lids.length) { return null; }
    return KPI.escopoLider ? KPI.escopoLider(lids, m0Setores()) : null;

  /* R4-B3: competência SEGUINTE ao dia civil (o plano de M vence dia 25

  /* ---------- F1-N · G3: RADAR DO GESTOR ----------
     Pior × melhor equipe do dia (aderência) — o gestor sabe QUEM
     chamar sem abrir a Inteligência. Só gestor; raízes ativas.       */
  function cardRadarGestor(m, hoje) {
    if (!(Guard.isGestor && Guard.isGestor())) { return null; }

    });
    if (linhas.length < 2) { return null; }

  /* ---------- F1-N · G2: QUEM PRECISA DE AJUDA HOJE ----------
     Top-3 do escopo com atrasadas — cobrança vira conversa 1:1, sem
     ranking público (Kahneman). Líder = escopo; gestor = escola.     */
  function cardAjuda(m, hoje) {
    var esc = null;
    if (Guard.isGestor && Guard.isGestor()) {
      esc = {};

  /* ---------- estados ---------- */

  /* ---------- pintura ---------- */
  var CTX_MONTADO = false;
  function paint() {
    var m = MODELO, hoje = m.hoje;
    /* F1-D(j): o seletor global precisa das siglas reais — monta no 1º paint */
    if (!CTX_MONTADO && window.GrautCtx) { CTX_MONTADO = true; pintarScope(); }
    /* F1-B: o escopo do papel é o PISO — gestor vê tudo, líder só seus setores,
       usuário só as suas. O toggle Minhas/Todas atua DENTRO desse escopo. */
    var escopo = m.board.filter(function (o) { return KPI.visivelPara(o.act, CURRENT_USER, m.setores); });
    var board = (MODO === 'minhas')
      ? escopo.filter(function (o) { return o.act.responsavelUid === CURRENT_USER.uid; })
      : escopo;
    /* F1-D(j): pré-filtro GLOBAL de setor (context switcher) — antes dos filtros locais */
    if (window.GrautCtx) {
      var cxSig = GrautCtx.sanear(GrautCtx.get(), m.setores, CURRENT_USER);
      if (cxSig) { board = board.filter(function (o) { return GrautCtx.aplicaAtividade(o.act, cxSig); }); }
    }
    /* P2: filtro por camada — atividade sem o campo conta como 'operacional' (default do import) */
    if (FCAMADA !== 'todas') {
      board = board.filter(function (o) { return (o.act.camada || 'operacional') === FCAMADA; });
    }
    var d = derivar(board, hoje);

    /* F1-B: nada no escopo do papel (líder sem setores com atividade / usuário sem atribuições) */
    if (!escopo.length && m.board.length) {
      setState('Nada no seu escopo.',
        (Guard.isLider && Guard.isLider())
          ? 'Você vê apenas as atividades dos setores que lidera.'
          : 'Você vê apenas as atividades atribuídas a você. Peça ao gestor para te definir como responsável.');
      return;
    }
    /* escopo vazio didático (dentro do escopo, nada é SEU) */
    if (MODO === 'minhas' && !board.length && escopo.length) {
      setState('Nada atribuído a você nesta janela.',
        'Use o seletor acima para ver o restante do seu escopo.');
      var kp0 = document.getElementById('hj-kpis'); kp0.style.display = 'none';
      return;
    }
    if (!m.board.length) {
      setState('Ainda não há atividades cadastradas.', 'Crie a primeira em Atividades — os indicadores nascem daí.');
      return;
    }
    setState(null);
    pintarReunioes(hoje); /* F1-E · 3.1/6.2 */

    var mm = KPI.computar({ board: board, hoje: hoje, setores: m.setores, ativ: m.ativ, janela: m.janela, periodo: m.periodo });

    /* F1-D(m): régua do dia — "quantas de quantas" com barra viva.
       Marcou um check → refresh() → a barra ANDA (transição CSS). */
    var pg = document.getElementById('hj-prog'); pg.innerHTML = '';
    var pctDia = d.doHoje.length ? Math.round(d.feitasHoje / d.doHoje.length * 100) : 0;
    /* F1-I: streak pessoal (regra 80%, derivada do MESMO board — KPI.streak80) */
    var stk = KPI.streak80 ? KPI.streak80(m.board, CURRENT_USER.uid, hoje) : { dias: 0, hojeFechado: false, recorde: 0, semana: [] };
    /* F1-N · U1+U3: PRÓXIMA AÇÃO — saudação contextual + 1 sugestão
       determinística (Krug). Some quando não há nada aberto. */
    (function () {
      var fn0 = String(USER.name || '').trim().split(/\s+/)[0] || 'você';
      var px = KPI.proximaAcao ? KPI.proximaAcao(m.board, CURRENT_USER.uid, hoje) : null;
      if (!px) { return; }
      var card = el('<div class="hj-xcard" style="border-left:3px solid var(--brand)"></div>');
      var hd = el('<div class="hj-xhead"></div>');
      var restam = d.doHoje.length - d.feitasHoje;
      hd.appendChild(txt('div', 'hj-xtitle', saudacao() + ', ' + fn0 + (restam > 0 ? ' — faltam ' + restam + ' para fechar o dia.' : '!') + ' Comece por esta:'));
      hd.appendChild(infoHj('Próxima ação', {
        formula: 'uma única sugestão, sempre pela mesma regra: (1º) sua atrasada MAIS VELHA · senão (2º) a de hoje com horário mais cedo · senão (3º) a primeira de hoje. Reduz o custo de decidir por onde começar.',
        dados: 'suas ocorrências abertas no painel.',
        numeros: px.motivo === 'atrasada' ? 'atrasada há ' + px.dias + ' dia(s)' : px.motivo === 'hora' ? 'horário ' + px.hora : 'de hoje, sem horário'
      }));
      card.appendChild(hd);
      var row = el('<div class="hj-xrow"></div>');
      row.appendChild(el('<span class="hj-xdot" style="background:var(--' + (px.motivo === 'atrasada' ? 'red' : 'brand') + ')"></span>'));
      var t = el('<span class="hj-xtit"></span>');
      t.textContent = px.occ.act.titulo || '(sem título)'; t.title = t.textContent;
      row.appendChild(t);
      var mt = el('<span class="hj-xmeta"></span>');

      row.appendChild(mt);
      if (PODE_AGIR(px.occ) && px.occ.status !== 'concluida') {
        row.appendChild(miniBtn('Concluir', (function (occ) { return function () { concluir(occ); }; })(px.occ), 'ok'));
      }
      card.appendChild(row);
      card.setAttribute('data-lente', 'eufaco'); /* R3 · lente */
      pg.appendChild(card);
    })();
    if (d.doHoje.length) {
      var pbox = el('<div class="hj-prog"></div>');
      pbox.setAttribute('data-lente', 'eufaco'); /* R3 · lente */
      var ptop = el('<div class="hj-prog-top"></div>');
      var msg = d.feitasHoje === 0 ? 'Comece marcando a primeira ✓'
        : (d.feitasHoje === d.doHoje.length ? 'Dia fechado. 🎯' : pctDia + '% do dia');
      var pt1 = el('<div class="hj-prog-t"></div>');
      pt1.appendChild(el('<span><b>' + d.feitasHoje + '</b> de <b>' + d.doHoje.length + '</b> concluídas hoje</span>'));
      if (stk.dias >= 1) {
        var fire = el('<span class="hj-fire"></span>');
        fire.textContent = '🔥 ' + stk.dias + (stk.dias === 1 ? ' dia' : ' dias') +
          (stk.recorde > stk.dias ? ' · recorde ' + stk.recorde : (stk.dias >= 2 && stk.recorde === stk.dias ? ' · seu recorde!' : ''));
        fire.title = 'Sequência de dias com pelo menos 80% das suas atividades do dia concluídas. Dia sem nada previsto não quebra.';
        pt1.appendChild(fire);
      } else if (stk.recorde >= 2) {
        var fr2 = el('<span class="hj-fire" style="color:var(--muted2)"></span>');
        fr2.textContent = 'recorde: ' + stk.recorde + ' dias — recomece hoje';
        pt1.appendChild(fr2);
      }
      pt1.appendChild(infoHj('Progresso do dia', {
        formula: 'concluídas hoje ÷ previstas para hoje × 100. Sequência (🔥): dias seguidos com ≥ 80% das SUAS atividades do dia concluídas; dia sem nada previsto (folga/feriado) não quebra; o dia de hoje, ainda aberto, também não.',
        dados: 'as MESMAS ocorrências do seu painel (responsável = você), por dia civil de Salvador. Puladas ficam fora da conta.',
        numeros: d.feitasHoje + ' ÷ ' + d.doHoje.length + ' = ' + pctDia + '%' + (stk.dias ? ' · sequência: ' + stk.dias + ' dia(s)' : ' · sequência: começa quando você fechar 80% de um dia')
      }));
      ptop.appendChild(pt1);
      ptop.appendChild(el('<div class="hj-prog-s">' + msg + '</div>'));
      pbox.appendChild(ptop);
      var tr = el('<div class="hj-prog-track"></div>');
      var fill = el('<div class="hj-prog-fill"></div>');
      fill.style.width = '0%';
      fill.style.background = pctDia >= 60 ? 'var(--green)' : 'var(--amber)';
      tr.appendChild(fill); pbox.appendChild(tr);
      /* F1-N · U6: sua semana em 7 pontos (verde = dia fechado ≥80%;
         âmbar vazado = teve previsto e não fechou; cinza = folga). */
      if (stk.semana && stk.semana.length) {
        var wk = el('<div style="display:flex;align-items:center;gap:7px;margin-top:9px"></div>');
        wk.appendChild(txt('span', 'hj-prog-s', 'Sua semana'));
        stk.semana.forEach(function (dw) {
          var dot = el('<span style="width:11px;height:11px;border-radius:50%;display:inline-block"></span>');
          if (dw.fechado) { dot.style.background = 'var(--green)'; }
          else if (dw.prev > 0) { dot.style.cssText += ';background:var(--s2);border:2px solid var(--amber)'; }
          else { dot.style.cssText += ';background:var(--s2);border:1px solid var(--border)'; }
          dot.title = dw.iso.split('-').reverse().join('/') + (dw.fechado ? ' — fechado' : dw.prev ? ' — não fechou (' + dw.prev + ' prevista(s))' : ' — sem previstas');

      if (stk.hojePrev > 0 && !stk.hojeFechado && (stk.hojeFeitas / stk.hojePrev) >= 0.8 && CELEB80 !== hoje) {

      if (stk.hojeFechado && stk.hojePrev > 0 && CELEBRADO !== hoje) {

    }
    /* F1-I: Cobranças do PEF (escalonamento D-5/D-3/D-0 dos planos de ação) */

    /* F1-I: Você supervisiona (o campo supervisor vira valor imediato) */

    /* F1-N · G1: Cockpit do líder (KPIs do MEU setor, sem trocar de tela) */

    var gp = cardPlanejamentoLider(hoje); if (gp) { gp.setAttribute('data-lente', 'eufaco'); pg.appendChild(gp); } /* R4-B3 */
    /* F1-N · G3: Radar do gestor (pior × melhor equipe do dia → agir) */
    var g3 = cardRadarGestor(m, hoje); if (g3) { g3.setAttribute('data-lente', 'numeros'); pg.appendChild(g3); }
    /* F1-N · G2: Quem precisa de ajuda hoje (cobrança vira conversa 1:1) */
    var g2 = cardAjuda(m, hoje); if (g2) { g2.setAttribute('data-lente', 'eucobro'); pg.appendChild(g2); }

    /* KPIs do topo */
    var kg = document.getElementById('hj-kpis'); kg.innerHTML = '';
    var kpis = [

    else { tl.appendChild(txt('div', 'hj-empty', 'Sem horários marcados hoje — os compromissos com hora aparecem aqui.')); }

    /* atividades do dia (sem horário) — F1-D(i): agrupadas por setor-RAIZ.
       O paredão alfabético vira blocos colapsáveis: sigla + nome + "N · M feitas".
       Multi-homing aparece em cada setor marcado — o check é o MESMO objeto
       (concluir num grupo conclui em todos). Ordem interna: camada
       (sócio→gestor→operacional) e depois título. Motor puro: KPI.gruposDoDia

    var dt = document.getElementById('hj-daytasks'); dt.innerHTML = '';

        grupos[0].items.forEach(function (o) { dt.appendChild(dayRow(o)); });

          hd.appendChild(car);

    else { dt.appendChild(txt('div', 'hj-empty', 'Nada previsto sem horário — dia livre nesta lista. Puxe uma atividade do catálogo se quiser adiantar.')); }

    /* atrasadas */

    var lb = document.querySelector('.hj-late-badge'); if (lb) { lb.textContent = d.atras.length + ' pendente(s)'; }
    if (d.atras.length) { d.atras.forEach(function (o) { at.appendChild(lateRow(o, hoje)); }); }
    else { at.appendChild(txt('div', 'hj-empty', 'Zero atrasadas — tudo em dia. 🎯 Continue assim que a sequência cresce.')); }

    /* R3 · lentes: os blocos renasceram — a lente ativa reaplica a visibilidade */

  }

  /* ---------- escopo (Minhas / Todas) ---------- */
  function pintarScope() {
    var sc = document.getElementById('hj-scope'); sc.innerHTML = '';
    /* F1-B: usuário só enxerga as suas — o toggle não faz sentido, some.
       Líder vê "seus setores" (não a escola inteira); gestor vê a escola. */
    if (Guard.isUsuario && Guard.isUsuario()) { sc.style.display = 'none'; return; }
    var rotuloTodas = (Guard.isGestor && Guard.isGestor()) ? 'Toda a escola' : 'Meus setores';
    [['minhas', 'Minhas'], ['todas', rotuloTodas]].forEach(function (p) {
      var b = el('<button type="button" class="hj-seg-b' + (MODO === p[0] ? ' on' : '') + '"></button>');
      b.textContent = p[1];
      b.addEventListener('click', function () { if (MODO !== p[0]) { MODO = p[0]; pintarScope(); paint(); } });
      sc.appendChild(b);
    });
    /* P2: seletor de camada (Sócio × Gestor × Operacional) ao lado do de escopo */
    var cs = document.getElementById('hj-camada');
    if (!cs) {
      cs = el('<div class="hj-scope" id="hj-camada" style="margin-left:8px"></div>');
      sc.parentNode.insertBefore(cs, sc.nextSibling);
    }
    cs.innerHTML = '';
    [['todas', 'Todas as camadas'], ['socio', 'Sócio'], ['gestor', 'Gestor'], ['operacional', 'Operacional']].forEach(function (c) {
      var cb = el('<button type="button" class="hj-seg-b' + (FCAMADA === c[0] ? ' on' : '') + '"></button>');
      cb.textContent = c[1];
      cb.addEventListener('click', function () { if (FCAMADA !== c[0]) { FCAMADA = c[0]; pintarScope(); paint(); } });
      cs.appendChild(cb);
    });
    /* F1-D(j): contexto global de setor ao lado dos seletores locais */
    var gx = document.getElementById('hj-gctx');
    if (!gx) {
      gx = el('<div class="hj-scope" id="hj-gctx" style="margin-left:8px;border:0;background:transparent;padding:0"></div>');
      cs.parentNode.insertBefore(gx, cs.nextSibling);
    }
    gx.innerHTML = '';
    if (window.GrautCtx && MODELO) {
      GrautCtx.mount(gx, { setores: MODELO.setores, user: CURRENT_USER,
        rotuloTudo: (Guard.isGestor && Guard.isGestor()) ? 'Toda a escola' : 'Meu escopo',
        onChange: function () { paint(); } });
    }
  }

  /* ---------- F1-E · reuniões no Hoje (3.1 convocações + 6.2 compromissos) ---------- */
  /* Compromissos = atividades nascidas de decisão de reunião sob minha
     responsabilidade, em aberto (do board — janela padrão). Atividade ÚNICA
     fora da janela aparece SEM occurrence: mostrada como aberta (limitação
     declarada — o board é a única fonte sem query nova).                    */
  function compromissosDeReuniao(hoje) {
    var uid = (CURRENT_USER && CURRENT_USER.uid) || null;
    if (!uid || !MODELO) { return []; }
    var out = [], vistos = {};
    MODELO.board.forEach(function (o) {
      if (!origemReuniao(o.act)) { return; }
      if (o.act.responsavelUid !== uid) { return; }
      if (o.status === 'concluida' || o.status === 'pulada') { return; }
      vistos[o.act.id] = true;
      out.push({ occ: o, act: o.act, prazo: o.effDate, vencida: R.compareISO(o.effDate, hoje) < 0 });
    });
    (MODELO.ativ || []).forEach(function (a) {
      if (vistos[a.id] || !origemReuniao(a) || a.responsavelUid !== uid) { return; }
      if (a.recorrencia !== 'unico' || !a.data) { return; }
      out.push({ occ: null, act: a, prazo: a.data, vencida: R.compareISO(a.data, hoje) < 0 });
    });
    out.sort(function (x, y) { return (x.prazo || '').localeCompare(y.prazo || ''); });
    return out;
  }
  function fmtBRhj(iso) { if (!iso) { return '—'; } var p = iso.split('-'); return p[2] + '/' + p[1]; }
  /* R5-B1: "Não vou" da convocação — motivo obrigatório da lista O3
     ('Outro' exige detalhe). Quem convocou vê o motivo na tela Reuniões. */
  function modalRecusaConvocacao(r) {
    var motSel = UI.select({ value: '', placeholder: '— Motivo (obrigatório) —',
      options: MOTIVOS_FALTA.map(function (m) { return { value: m, label: m }; }) });
    var detInp = UI.input({ placeholder: 'Detalhe (obrigatório se "Outro")' });
    UI.modal({
      title: 'Avisar que não vou — ' + (r.titulo || (TIPO_LABEL_R[r.tipo] || 'Reunião')), width: 440,
      body: [
        UI.field({ label: 'Motivo', required: true, control: motSel }),
        UI.field({ label: 'Detalhe', control: detInp, hint: 'O motivo aparece para quem convocou (padrão RSVP: recusar informa o organizador).' })
      ],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: 'Enviar aviso', icon: 'check', onClick: function () {
            if (!motSel.value) { toast('Escolha o motivo.', 'err'); return; }
            if (motSel.value === 'Outro' && !detInp.value.trim()) { toast('Detalhe o motivo "Outro".', 'err'); return; }
            Store.recusarPresenca(r.id, r.confirmadosUids, r.recusas, CURRENT_USER.uid, CURRENT_USER.name || CURRENT_USER.nome || '', motSel.value, detInp.value.trim() || null)
              .then(function () {
                r.confirmadosUids = (r.confirmadosUids || []).filter(function (u) { return u !== CURRENT_USER.uid; });
                r.recusas = r.recusas || {};
                r.recusas[CURRENT_USER.uid] = { motivo: motSel.value, detalhe: detInp.value.trim() || null, nome: CURRENT_USER.name || '', em: Date.now() };
                close(); toast('Aviso enviado — quem convocou vê o motivo.'); paint();
              })
              .catch(function (e) { toast(e.message || 'Não deu para enviar.', 'err'); });
          } })];
      }
    });
  }
  /* R5-B1: "Não posso" na atribuição — motivo livre obrigatório. A recusa
     NÃO desatribui: sinaliza o líder (selo na decisão da reunião) para
     reatribuir — padrão Outlook: recusar devolve a decisão ao delegante. */
  function modalRecusaAtribuicao(act) {
    var motInp = UI.input({ placeholder: 'Ex.: estou de férias na semana do prazo' });
    UI.modal({
      title: 'Não posso assumir — ' + (act.titulo || 'compromisso'), width: 440,
      body: [UI.field({ label: 'Motivo', required: true, control: motInp, hint: 'A tarefa continua sua até o líder reatribuir; o motivo aparece para ele na reunião.' })],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: 'Enviar', icon: 'check', onClick: function () {
            if (!motInp.value.trim()) { toast('Escreva o motivo.', 'err'); return; }
            Store.aceitarAtribuicao(act.id, { recusaAtribuicao: { uid: CURRENT_USER.uid, nome: CURRENT_USER.name || '', motivo: motInp.value.trim(), em: Date.now() }, aceite: null }, 'recusar_atribuicao')
              .then(function () { act.recusaAtribuicao = { uid: CURRENT_USER.uid, nome: CURRENT_USER.name || '', motivo: motInp.value.trim(), em: Date.now() }; act.aceite = null; close(); toast('Aviso enviado ao líder.'); paint(); })
              .catch(function (e) { toast(e.message || 'Não deu para enviar.', 'err'); });
          } })];
      }
    });
  }
  function pintarReunioes(hoje) {
    var velho = document.getElementById('hj-reun');
    if (velho && velho.parentNode) { velho.parentNode.removeChild(velho); }
    var comps = compromissosDeReuniao(hoje);
    if (!CONVOC.length && !comps.length) { return; }
    var box = el('<div id="hj-reun" style="margin-bottom:16px"></div>');
    box.setAttribute('data-lente', 'eufaco'); /* R3 · lente */

    if (CONVOC.length) {
      var c1 = el('<div class="hj-card" style="padding:14px 16px;margin-bottom:10px"></div>');
      c1.appendChild(txt('div', 'hj-late-t', 'Convocações de reunião (' + CONVOC.length + ')'));
      CONVOC.forEach(function (r) {
        var lin = el('<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px"></div>');
        lin.appendChild(txt('span', '', 'Convocado: ' + (TIPO_LABEL_R[r.tipo] || 'Reunião') + ' · ' + fmtBRhj(r.data) + (r.horaPrevista ? ' ' + r.horaPrevista : '') + ' — ' + (r.titulo || '')));
        var vencidos = comps.filter(function (c) { return c.vencida; }).length;
        var vp = txt('button', 'hj-freq', 'Ver pauta'); vp.type = 'button'; vp.style.cursor = 'pointer'; vp.style.color = 'var(--doing)';
        vp.addEventListener('click', function () { window.location.href = 'projetos.html'; });
        lin.appendChild(vp);
        /* F1-N · U7 + R5-B1: RSVP em 3 estados (padrão Google Calendar —
           Vou / Não vou com motivo / sem resposta), sempre reversível. */
        var confs = Array.isArray(r.confirmadosUids) ? r.confirmadosUids : [];
        var minhaRecusa = (r.recusas || {})[CURRENT_USER.uid] || null;
        var confirmarFn = (function (rr) {
          return function () {
            Store.confirmarPresenca(rr.id, rr.confirmadosUids, CURRENT_USER.uid, rr.recusas)
              .then(function () {
                if ((rr.confirmadosUids || []).indexOf(CURRENT_USER.uid) === -1) { rr.confirmadosUids = (rr.confirmadosUids || []).concat([CURRENT_USER.uid]); }
                if (rr.recusas && rr.recusas[CURRENT_USER.uid]) { delete rr.recusas[CURRENT_USER.uid]; }
                toast('Presença confirmada — quem convocou já vê.'); paint();
              })
              .catch(function (e) { toast(e.message || 'Não deu para confirmar.', 'err'); });
          };
        })(r);
        if (confs.indexOf(CURRENT_USER.uid) !== -1) {
          var okc = txt('span', 'hj-freq', '✓ Presença confirmada');
          okc.style.color = 'var(--green)';
          lin.appendChild(okc);
          lin.appendChild(miniBtn('Não vou', (function (rr) { return function () { modalRecusaConvocacao(rr); }; })(r), 'warn'));
        } else if (minhaRecusa) {
          var rk = txt('span', 'hj-freq', '✗ Avisou que não vem: ' + (minhaRecusa.motivo || '—'));
          rk.style.color = 'var(--orange)';
          if (minhaRecusa.detalhe) { rk.title = minhaRecusa.detalhe; }
          lin.appendChild(rk);
          lin.appendChild(miniBtn('Vou sim', confirmarFn, 'ok'));
        } else {
          lin.appendChild(miniBtn('Confirmar presença', confirmarFn, 'ok'));
          lin.appendChild(miniBtn('Não vou', (function (rr) { return function () { modalRecusaConvocacao(rr); }; })(r), 'warn'));
        }
        if (vencidos) {
          var pv = txt('span', 'hj-freq', 'você tem ' + vencidos + ' pendência(s) de reunião anterior');
          pv.style.color = 'var(--orange)';
          lin.appendChild(pv);
        }
        c1.appendChild(lin);
      });
      box.appendChild(c1);
    }

    if (comps.length) {
      var c2 = el('<div class="hj-card" style="padding:14px 16px"></div>');
      c2.appendChild(txt('div', 'hj-late-t', 'Compromissos de reunião (' + comps.length + ')'));
      comps.forEach(function (c) {
        var lin = el('<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:6px"></div>');
        lin.appendChild(txt('span', '', c.act.titulo || '(sem título)'));
        var pz = txt('span', 'hj-freq', 'prazo ' + fmtBRhj(c.prazo));
        if (c.vencida) { pz.style.color = 'var(--red)'; }
        lin.appendChild(pz);

        ch.title = 'Nasceu na reunião' + (og.reuniaoTitulo ? ' "' + og.reuniaoTitulo + '"' : '') + (og.reuniaoData ? ' de ' + fmtBRhj(og.reuniaoData) : '');
        lin.appendChild(ch);
        /* R5-B1: ACEITE DE ATRIBUIÇÃO (Outlook Accept/Decline) — o card já
           é filtrado pelo responsável, então quem vê é quem decide. */
        if (c.act.aceite) {
          var sa = txt('span', 'hj-freq', '✓ aceito');
          sa.style.color = 'var(--green)';

          lin.appendChild(sa);
        } else if (c.act.recusaAtribuicao) {
          var sr = txt('span', 'hj-freq', '✗ recusado — aguardando o líder');
          sr.style.color = 'var(--orange)';
          sr.title = 'Motivo: ' + (c.act.recusaAtribuicao.motivo || '—') + '. A tarefa segue sua até o líder reatribuir.';

          lin.appendChild(miniBtn('Aceitar', (function (act) {
            return function () {
              Store.aceitarAtribuicao(act.id, { aceite: { uid: CURRENT_USER.uid, nome: CURRENT_USER.name || '', em: Date.now() }, recusaAtribuicao: null }, 'aceitar_atribuicao')
                .then(function () { act.aceite = { uid: CURRENT_USER.uid, nome: CURRENT_USER.name || '', em: Date.now() }; act.recusaAtribuicao = null; toast('Atribuição aceita — o líder vê.'); paint(); })
                .catch(function (e) { toast(e.message || 'Não deu para aceitar.', 'err'); });

          lin.appendChild(miniBtn('Não posso', (function (act) { return function () { modalRecusaAtribuicao(act); }; })(c.act), 'warn'));
        }

        }
        c2.appendChild(lin);
      });
      box.appendChild(c2);
    }
    var cols = document.querySelector('.hj-cols');

  }

  /* ---------- carga ---------- */

      KPI.carregar('band'),
      Store.listPlanosVivos ? ((Guard.isUsuario && Guard.isUsuario()) ? Promise.resolve([]) : Store.listPlanosVivos()) : Promise.resolve([]),

    ]).then(function (r) { MODELO = r[0]; PLANOS = r[1] || []; CONVOC = r[2] || []; paint(); })

  Guard.onReady(function (USER) {

    app.insertBefore(UI.sidebar({ active: 'Hoje', user: USER }), app.firstChild);

    /* N4-B (D2): botão "Agenda de Eventos" — pulsa se max(atualizadoEm) dos
       eventos > localStorage['graut_evt_lastSeen'] (por aparelho). Custo da
       checagem: 1 read (orderBy atualizadoEm desc + limit 1). Falha ou

    (function wireEventosBtn() {
      var evBtn = UI.button({ label: 'Agenda de Eventos', icon: 'clock', variant: 'ghost' });
      evBtn.classList.add('hj-evbtn');
      evBtn.addEventListener('click', function () { window.location.href = 'eventos.html'; });
      var slot = document.getElementById('hj-cta');
      slot.parentNode.insertBefore(evBtn, slot);
      fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'eventos'),
          c.f.orderBy('atualizadoEm', 'desc'), c.f.limit(1));
        return c.f.getDocs(q);
      }).then(function (snap) {
        var max = 0;
        snap.forEach(function (d) { max = (d.data() || {}).atualizadoEm || 0; });
        var visto = 0;
        try { visto = parseInt(localStorage.getItem('graut_evt_lastSeen') || '0', 10) || 0; } catch (e) {}
        if (max > visto) { evBtn.classList.add('pulse'); }
      }).catch(function (e) { if (window.console && console.warn) { console.warn('[hoje] pulso eventos indisponível', e); } });
    })();
    document.getElementById('hj-mav').appendChild(UI.avatar({ initials: USER.initials, size: 42 }));
    var fn = String(USER.name || '').trim().split(/\s+/)[0] || USER.name;
    var g1 = document.querySelector('.hj-hi'); if (g1) { g1.textContent = saudacao() + ', ' + fn; }
    var g2 = document.querySelector('.hj-mg'); if (g2) { g2.textContent = saudacao() + ', ' + fn; }
    var hojeISO = R.hojeISO();
    var d1 = document.querySelector('.hj-dd'); if (d1) { d1.textContent = dataLonga(hojeISO); }
    var d2 = document.querySelector('.hj-md'); if (d2) { d2.textContent = dataLonga(hojeISO); }
    /* R3 · Bloco 1: barra das 3 lentes (motor em lentes.js) — reorganiza os
       blocos JÁ existentes por pergunta; troca de lente repinta o dia. */
    if (window.GrautLentes) {
      GrautLentes.mount({ tela: 'hoje', user: USER, padrao: 'eufaco',
        before: document.getElementById('hj-scope'),
        onChange: function () { if (MODELO) { paint(); } } });
    }
    pintarScope();
    setState('Carregando o seu dia…', 'Lendo atividades e ocorrências.');
    refresh();
  });
  </script>
