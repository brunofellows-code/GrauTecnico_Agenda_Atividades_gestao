<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hoje — GERA</title>

<!-- provider + primitivos -->
<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
<script src="mnav.js"></script>

<style>
/* ============================================================
   HOJE · v2 (16/09/2026) — a tela do desenho aprovado em 15/09
   (02_PRODUTO_E_DESIGN/2026-09-15_MOCK_HOJE.html), com dado real.
   Regras que esta tela obedece:
   - nenhum filtro acima da dobra: o escopo é o do papel (guard) e pronto;
   - 3 números + 1 ação no topo; o resto é rolagem;
   - todo número tem "i" (fórmula · dados · números) e clique que leva
     à lista que o compõe;
   - cor só pelos tokens do theme.css (marca verde, claro e escuro);
   - escala tipográfica do theme.css (--fs-*), nada de tamanho solto.
   ============================================================ */
.hj-app{display:flex;min-height:100vh;background:var(--bg)}
.hj-app>.ui-side{position:sticky;top:0;height:100vh}
.hj-main{flex:1;min-width:0;display:flex;flex-direction:column}

.hj-top{position:sticky;top:0;z-index:20;display:flex;align-items:center;justify-content:space-between;gap:var(--sp-3);padding:var(--sp-4) var(--sp-6);background:var(--bg);border-bottom:1px solid var(--border)}
.hj-hi{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;margin:0;line-height:1.15}
.hj-dd{font-size:var(--fs-sm);font-weight:600;color:var(--muted);margin-top:3px}
.hj-topactions{display:flex;align-items:center;gap:var(--sp-2);flex-wrap:wrap;justify-content:flex-end}

.hj-mhead{display:none;align-items:center;justify-content:space-between;padding:14px 18px;background:var(--s1);border-bottom:1px solid var(--border)}
.hj-mg{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.02em;margin:0}
.hj-md{font-size:var(--fs-sm);font-weight:600;color:var(--muted);margin-top:2px}

.hj-wrap{padding:var(--sp-5) var(--sp-6) var(--sp-7);max-width:1040px}
.hj-sec{font-size:var(--fs-xs);font-weight:800;letter-spacing:.12em;color:var(--muted2);margin:var(--sp-5) 0 var(--sp-3);display:flex;align-items:center;gap:var(--sp-2);text-transform:uppercase}
.hj-sec:first-child{margin-top:0}
.hj-sec .n{font-weight:800;color:var(--muted)}
.hj-sec .hj-link{margin-left:auto;text-transform:none;letter-spacing:0}

/* "i" — botão real (abre fórmula · dados · números) */
.hj-i{width:18px;height:18px;border-radius:50%;border:1px solid var(--muted2);background:transparent;color:var(--muted2);font-size:9px;font-weight:800;line-height:1;cursor:pointer;flex:0 0 auto;display:inline-flex;align-items:center;justify-content:center;padding:0;font-family:inherit}
.hj-i:hover,.hj-i:focus-visible{color:var(--text);border-color:var(--brand);outline:none}
.hj-link{font-size:var(--fs-sm);font-weight:800;color:var(--accentText);text-decoration:none;background:transparent;border:0;cursor:pointer;font-family:inherit;padding:0}
.hj-link:hover{text-decoration:underline}

/* 1) faixa "exige você" */
.hj-foco{display:flex;align-items:center;gap:var(--sp-3);background:var(--s1);border:1px solid var(--brand);border-radius:13px;padding:12px var(--sp-4);margin-bottom:var(--sp-4);box-shadow:var(--shadowSoft)}
.hj-foco .lb{font-size:var(--fs-xs);font-weight:800;color:var(--onBrand);background:var(--brand);border-radius:6px;padding:2px 8px;white-space:nowrap;letter-spacing:.04em}
.hj-foco .tx{flex:1;font-size:var(--fs-base);font-weight:700;min-width:0;line-height:1.35}
.hj-foco .tx small{display:block;font-weight:600;color:var(--muted);font-size:var(--fs-xs);margin-top:2px}
.hj-foco .gp{display:flex;gap:7px;flex-wrap:wrap}
.hj-gb{border:1px solid var(--border);background:var(--s2);color:var(--text);font-family:inherit;font-weight:700;font-size:var(--fs-sm);padding:7px 12px;border-radius:9px;cursor:pointer;white-space:nowrap;text-decoration:none;display:inline-flex;align-items:center}
.hj-gb:hover{background:var(--s3)}
.hj-gb.p{background:var(--cta);color:var(--ctaText);border-color:transparent}
.hj-gb:focus-visible{outline:2px solid var(--brand);outline-offset:2px}

/* 2) progresso do dia + carimbo */
.hj-prog{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:6px}
.hj-prog .bar{flex:1;height:7px;border-radius:5px;background:var(--track);overflow:hidden}
.hj-prog .bar>span{display:block;height:100%;border-radius:5px;background:var(--green);transition:width .45s var(--easeOut)}
.hj-prog .tx{font-size:var(--fs-sm);font-weight:700;color:var(--muted);white-space:nowrap}
.hj-prog .tx b{color:var(--green)}
.hj-fire{font-size:var(--fs-xs);font-weight:800;color:var(--bandaAlta,var(--orange));background:var(--s2);border:1px solid var(--border);border-radius:20px;padding:2px 9px;white-space:nowrap}
.hj-stamp{display:flex;align-items:center;gap:var(--sp-2);margin:0 0 var(--sp-4);font-size:var(--fs-xs);color:var(--muted2);flex-wrap:wrap}
.hj-stamp button{border:1px solid var(--border);background:var(--s1);color:var(--muted);font-family:inherit;font-weight:700;font-size:var(--fs-xs);padding:3px 9px;border-radius:7px;cursor:pointer}
.hj-stamp button:hover{color:var(--text)}
.hj-stamp button:disabled{opacity:.6;cursor:default}
.hj-stamp .velho{color:var(--bandaAlta,var(--amber));font-weight:700}

/* 3) painel de números */
.hj-kpis{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:var(--sp-3)}
.hj-kpis.tres{grid-template-columns:2fr 1fr 1fr}
.hj-kpi{position:relative;background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:14px var(--sp-4);box-shadow:var(--shadowSoft);min-width:0}
.hj-kpi.wide{grid-column:span 1;min-width:0}
.hj-kpis.tres .hj-kpi.wide{grid-column:span 1}
.hj-kpi .lab{font-size:var(--fs-xs);font-weight:800;letter-spacing:.04em;color:var(--muted);text-transform:uppercase;display:flex;align-items:center;gap:6px}
.hj-kpi .val{font-size:var(--fs-display);font-weight:800;letter-spacing:-.02em;line-height:1;margin-top:10px;font-variant-numeric:tabular-nums}
.hj-kpi .val small{font-size:var(--fs-sm);font-weight:700;color:var(--muted2);margin-left:4px;letter-spacing:0}
.hj-kpi .sub{font-size:var(--fs-xs);font-weight:700;color:var(--muted2);margin-top:6px}
.hj-kpi.t-green .val{color:var(--green)} .hj-kpi.t-red .val{color:var(--red)} .hj-kpi.t-amber .val{color:var(--amber)} .hj-kpi.t-blue .val{color:var(--accentText)} .hj-kpi.t-flat .val{color:var(--muted)}
.hj-kpi[role="button"]{cursor:pointer;transition:transform .18s var(--easeOut),box-shadow .18s var(--easeOut)}
.hj-kpi[role="button"]:hover{transform:translateY(-1px);box-shadow:var(--elev-2)}
.hj-kpi[role="button"]:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
/* bullet chart (Stephen Few): faixas ruim / aceitável / bom + traço da meta */
.hj-blt{margin-top:10px}
.hj-blt .top{display:flex;align-items:baseline;justify-content:space-between;gap:8px;margin-bottom:7px}
.hj-blt .v{font-size:var(--fs-display);font-weight:800;letter-spacing:-.02em;line-height:1;font-variant-numeric:tabular-nums}
.hj-blt .v small{font-size:var(--fs-sm);font-weight:700;color:var(--muted2);margin-left:3px}
.hj-blt .t{font-size:var(--fs-xs);font-weight:700;color:var(--muted2)}
.hj-bltrack{position:relative;height:14px;border-radius:7px;overflow:hidden;background:var(--track)}
.hj-blband{position:absolute;top:0;bottom:0}
.hj-blband.low{background:var(--haloRed)} .hj-blband.mid{background:var(--haloAmber)} .hj-blband.high{background:var(--haloGreen)}
.hj-blfill{position:absolute;top:3px;bottom:3px;left:0;border-radius:6px;background:var(--bc);transition:width .5s var(--easeOut)}
.hj-blmark{position:absolute;top:-2px;bottom:-2px;width:3px;border-radius:2px;background:var(--text);opacity:.85}
.hj-blcap{margin-top:7px;font-size:var(--fs-xs);color:var(--muted2);display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.hj-spark{flex:none}

/* 4) gráfico de barras por setor */
.hj-chart{background:var(--s1);border:1px solid var(--border);border-radius:14px;padding:var(--sp-4) 18px;box-shadow:var(--shadowSoft);margin-top:var(--sp-3)}
.hj-chart .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px;flex-wrap:wrap}
.hj-chart .h .t{font-size:var(--fs-base);font-weight:800;display:flex;align-items:center;gap:6px}
.hj-chart .h .leg{font-size:var(--fs-xs);color:var(--muted2)}
.hj-brow{display:flex;align-items:center;gap:var(--sp-3);margin-bottom:9px;cursor:pointer;border-radius:8px}
.hj-brow:last-child{margin-bottom:0}
.hj-brow:hover .nm{color:var(--accentText)}
.hj-brow:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hj-brow .nm{width:200px;flex:none;font-size:var(--fs-sm);font-weight:700;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:flex;align-items:center;gap:8px}
.hj-brow .nm .d{width:9px;height:9px;border-radius:50%;background:var(--sc);flex:none}
.hj-brow .track{flex:1;height:14px;border-radius:8px;background:var(--track);overflow:hidden}
.hj-brow .track>span{display:block;height:100%;border-radius:8px;background:var(--sc);transition:width .5s var(--easeOut)}
.hj-brow .vv{width:150px;flex:none;text-align:right;font-size:var(--fs-xs);font-weight:800;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-brow .vv b{color:var(--text);font-variant-numeric:tabular-nums}
.hj-brow .vv .amb{color:var(--bandaAlta,var(--amber))}

/* 5) cartões por setor */
.hj-pgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.hj-pcard{position:relative;overflow:hidden;background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:12px 14px;cursor:pointer;transition:transform .18s var(--easeOut),box-shadow .18s var(--easeOut);box-shadow:var(--shadowSoft);text-align:left;font-family:inherit;color:var(--text);width:100%}
.hj-pcard:hover{transform:translateY(-2px);box-shadow:var(--elev-2)}
.hj-pcard:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hj-pcard::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--sc)}
.hj-pcard .h{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:9px}
.hj-pcard .h .nm{font-size:var(--fs-sm);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-pcard .h .who{font-size:var(--fs-xs);color:var(--muted2);white-space:nowrap}
.hj-pcard .st{display:flex;gap:14px}
.hj-pcard .st .b{font-size:var(--fs-xs);font-weight:700;color:var(--muted)}
.hj-pcard .st .b b{display:block;font-size:19px;font-weight:800;letter-spacing:-.01em;margin-top:2px;font-variant-numeric:tabular-nums;color:var(--text)}
.hj-pcard .st .b.red b{color:var(--red)} .hj-pcard .st .b.amber b{color:var(--amber)} .hj-pcard .st .b.green b{color:var(--green)}

/* 6) blocos pessoais */
.hj-hero{position:relative;overflow:hidden;background:var(--s1);border:1px solid var(--brand);border-radius:15px;padding:var(--sp-4) 18px;box-shadow:var(--shadowSoft)}
.hj-hero .lab{display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-xs);font-weight:800;color:var(--onBrand);background:var(--brand);border-radius:6px;padding:2px 8px;margin-bottom:10px;letter-spacing:.04em}
.hj-hero .ttl{font-size:var(--fs-xl);font-weight:800;letter-spacing:-.01em;line-height:1.25;margin-bottom:6px}
.hj-hero .meta{font-size:var(--fs-sm);color:var(--muted);margin-bottom:12px}
.hj-hero .meta b{color:var(--red)}
.hj-acts{display:flex;gap:8px;flex-wrap:wrap}
.hj-act{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border);background:var(--s2);color:var(--text);font-family:inherit;font-weight:700;font-size:var(--fs-sm);padding:8px 13px;border-radius:9px;cursor:pointer}
.hj-act:hover{background:var(--s3)}
.hj-act.go{background:var(--cta);color:var(--ctaText);border-color:transparent}
.hj-act.go:hover{filter:brightness(1.05)}
.hj-act.stop{color:var(--red);border-color:var(--red)}
.hj-act:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hj-row{display:flex;align-items:center;gap:var(--sp-3);background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:11px 14px;margin-bottom:7px;box-shadow:var(--shadowSoft);transition:box-shadow .15s,transform .15s}
.hj-row:hover{box-shadow:var(--elev-2);transform:translateY(-1px)}
.hj-row .tt{flex:1;min-width:0}
.hj-row .tt .t{font-size:var(--fs-base);font-weight:700;line-height:1.3;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hj-row .tt .m{font-size:var(--fs-xs);color:var(--muted2);margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-row.done{opacity:.55}.hj-row.done .tt .t{text-decoration:line-through}
.hj-row.trv{border-left:3px solid var(--orange)}
.hj-late{font-size:var(--fs-xs);font-weight:800;color:var(--red);background:var(--haloRed);border-radius:6px;padding:2px 8px;white-space:nowrap;min-width:64px;text-align:center}
.hj-time{font-size:var(--fs-sm);font-weight:800;color:var(--accentText);white-space:nowrap;min-width:44px;font-variant-numeric:tabular-nums}
.hj-time.sem{color:var(--muted2);font-weight:700}
.hj-doing{font-size:var(--fs-xs);font-weight:800;color:var(--doing);background:var(--haloDoing);border-radius:6px;padding:2px 8px;white-space:nowrap}
.hj-miniacts{display:flex;gap:6px;flex:none}
.hj-mini{width:30px;height:30px;border-radius:8px;border:1px solid var(--border);background:var(--s2);color:var(--muted);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;font-family:inherit;padding:0}
.hj-mini:hover{color:var(--text);background:var(--s3)}
.hj-mini.go{color:var(--greenText);border-color:var(--green)}
.hj-mini.stop{color:var(--red)}
.hj-mini:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hj-mrow{display:flex;align-items:center;gap:var(--sp-3);background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:8px;box-shadow:var(--shadowSoft);flex-wrap:wrap}
.hj-mrow .tt{flex:1;min-width:200px}
.hj-mrow .tt .t{font-size:var(--fs-base);font-weight:700}
.hj-mrow .tt .m{font-size:var(--fs-xs);color:var(--muted2);margin-top:3px}
.hj-mrow .m.bad{color:var(--bandaAlta,var(--orange))}
.hj-rsvp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.hj-rb{border:1px solid var(--border);background:var(--s2);color:var(--text);font-family:inherit;font-weight:700;font-size:var(--fs-sm);padding:6px 12px;border-radius:8px;cursor:pointer}
.hj-rb:hover{background:var(--s3)}
.hj-rb.on{background:var(--green);color:var(--onGreen);border-color:transparent}
.hj-rb.no.on{background:var(--red);color:var(--onRed)}
.hj-rb:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
.hj-tag{font-size:var(--fs-xs);font-weight:800;padding:2px 8px;border-radius:6px;background:var(--chipBg);border:1px solid var(--border);white-space:nowrap}
.hj-tag.ok{color:var(--greenText);border-color:var(--green)}
.hj-tag.warn{color:var(--bandaAlta,var(--orange));border-color:var(--orange)}
.hj-rank{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.hj-rc{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:12px;text-align:center;box-shadow:var(--shadowSoft)}
.hj-rc.you{border-color:var(--brand);background:var(--activeBg)}
.hj-rc .pos{font-size:var(--fs-xs);font-weight:800;color:var(--muted2);letter-spacing:.1em}
.hj-rc .av{margin:8px auto;width:40px;height:40px;border-radius:50%;background:var(--brand);color:var(--onBrand);font-size:var(--fs-md);font-weight:800;display:flex;align-items:center;justify-content:center}
.hj-rc.you .av{background:var(--s3);border:1px solid var(--border);color:var(--text)}
.hj-rc .nm{font-size:var(--fs-sm);font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-rc .sc{font-size:var(--fs-xs);color:var(--muted);margin-top:3px}
.hj-egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:var(--sp-3)}
.hj-ecard{background:var(--s1);border:1px solid var(--border);border-radius:13px;padding:12px 14px;box-shadow:var(--shadowSoft);display:flex;align-items:center;gap:10px}
.hj-ecard .av{width:34px;height:34px;border-radius:50%;background:var(--s3);border:1px solid var(--border);color:var(--text);font-size:var(--fs-xs);font-weight:800;display:flex;align-items:center;justify-content:center;flex:none}
.hj-ecard .nm{font-size:var(--fs-sm);font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hj-ecard .m{font-size:var(--fs-xs);color:var(--muted2);margin-top:2px}
.hj-ecard .m b{color:var(--red)}

/* estados */
.hj-ez{background:var(--s1);border:1px dashed var(--border);border-radius:14px;padding:18px;display:flex;gap:14px;align-items:flex-start}
.hj-ez .ic{width:36px;height:36px;flex:none;border-radius:11px;background:var(--s3);color:var(--muted);display:flex;align-items:center;justify-content:center}
.hj-ez .tt{font-size:var(--fs-base);font-weight:800;margin-bottom:4px}
.hj-ez .ds{font-size:var(--fs-sm);color:var(--muted);line-height:1.55;max-width:66ch}
.hj-ez .nx{margin-top:8px;font-size:var(--fs-xs);font-weight:800;color:var(--accentText)}
.hj-state{display:none;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:280px;padding:40px 20px}
.hj-state-t{font-size:var(--fs-lg);font-weight:800;color:var(--text)}
.hj-state-s{font-size:var(--fs-base);color:var(--muted);max-width:460px;line-height:1.5}
.hj-sk{background:var(--s1);border:1px solid var(--border);border-radius:14px;height:92px;position:relative;overflow:hidden}
.hj-sk::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,var(--s2),transparent);transform:translateX(-100%);animation:hjsh 1.1s infinite}
@keyframes hjsh{100%{transform:translateX(100%)}}
.hj-skgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:var(--sp-3)}
.hj-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--s1);border:1px solid var(--border);color:var(--text);font-size:var(--fs-base);font-weight:600;padding:10px 16px;border-radius:10px;z-index:80;box-shadow:var(--elev-3)}
.hj-toast.err{border-color:var(--red);color:var(--red)}
.hj-info-k{font-size:var(--fs-xs);font-weight:800;color:var(--muted2);letter-spacing:.08em;margin-top:10px}
.hj-info-v{font-size:var(--fs-base);line-height:1.5}

/* toggle de tema (mobile; no desktop a barra lateral já tem) */
.hj-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;font-size:var(--fs-sm);font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--elev-2)}
.hj-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}

@media (max-width:1100px){.hj-pgrid,.hj-egrid{grid-template-columns:1fr 1fr}}
@media (max-width:900px){
  .hj-app>.ui-side{display:none}
  .hj-top{display:none}
  .hj-mhead{display:flex}
  .hj-wrap{padding:var(--sp-4) var(--sp-4) 110px}
  .hj-kpis,.hj-kpis.tres{grid-template-columns:1fr 1fr}
  .hj-kpi.wide,.hj-kpis.tres .hj-kpi.wide{grid-column:span 2}

  .hj-brow .nm{width:120px}.hj-brow .vv{width:110px}

}

  .hj-prog .bar>span,.hj-blfill,.hj-brow .track>span,.hj-row,.hj-pcard,.hj-kpi[role="button"]{transition:none}
  .hj-sk::after{animation:none}
}
</style>
</head>
<body>

  <!-- portão de acesso (guard.js controla) -->
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="hj-dev" data-theme-toggle type="button" title="Alternar tema claro/escuro"><span class="pin"></span>Tema</button>

  <div class="hj-app" id="app">
    <!-- barra lateral inserida via JS (desktop) -->
    <main class="hj-main">

      <div class="hj-top">
        <div>
          <h1 class="hj-hi">Olá</h1>
          <div class="hj-dd">Carregando o dia…</div>
        </div>
        <div class="hj-topactions"><span id="hj-cta"></span></div>
      </div>

      <div class="hj-mhead">
        <div>
          <h1 class="hj-mg">Olá</h1>
          <div class="hj-md">Carregando o dia…</div>
        </div>
        <span id="hj-mav"></span>
      </div>

      <div class="hj-wrap">
        <div class="hj-state" id="hj-state"></div>
        <div id="hj-wrap"></div>
      </div>

    </main>
  </div>

  <script src="flags.js"></script>
  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script src="scores.js"></script>
  <script src="conclusao.js"></script>
  <script src="app-version.js"></script>
  <script src="fmt.js"></script>
  <script src="firestore-adapter.js"></script>
  <script>
  /* ================= HOJE v2 — dados REAIS (zero mock) =================
     Carrega via KPI.carregar (o mesmo motor da Inteligência) e recorta pelo
     papel do usuário (guard). Ações de 1 toque gravam override em
     `ocorrencias` (idempotente) + atividade_log, igual ao atividades.html.
     Camada de dados e de ações herdada da tela anterior (testada); a camada
     de tela é a do mock aprovado em 15/09. */
  var CURRENT_USER = null;
  var MODELO = null;            /* último KPI.carregar */
  var PLANOS = [];              /* planos de ação vivos (líder/gestor) */
  var CONVOC = [];              /* reuniões abertas em que fui convocado */
  var CONVOC_AVISO = '';        /* '' | 'cheio' | 'erro' */
  var CONVOC_LIMITE = 500;
  var SNAPS = [];               /* kpi_snapshots dos últimos 20 dias (tendência) */
  var USUARIOS = [];            /* contas ativas (líder por setor, ranking) */
  var LIDO_EM = null;
  var CELEBRADO = '', CELEB80 = '';
  var R = window.GrautRecorrencia;
  var RECOR_LABEL = { diario: 'diária', semanal: 'semanal', quinzenal: 'quinzenal', mensal: 'mensal', bimestral: 'bimestral', trimestral: 'trimestral', unico: 'única' };
  var PESO_LABEL = { vital: 'VITAL', importante: 'IMPORTANTE', rotina: 'ROTINA' };
  var TRAVA_MOTIVOS = [
    { value: 'dependencia', label: 'Dependo de outra pessoa ou setor' },
    { value: 'informacao', label: 'Faltou informação para conseguir fazer' },
    { value: 'prioridade', label: 'Outra prioridade entrou na frente' },
    { value: 'tempo', label: 'Não sobrou tempo no dia' },
    { value: 'ferramenta', label: 'Sistema ou ferramenta fora do ar' },
    { value: 'outro', label: 'Outro motivo' }
  ];
  /* espelha TIPOS_REUNIAO de projetos.html */
  var TIPO_LABEL_R = { lideres: 'Reunião de Líderes', integrada: 'Reunião Integrada', instrutor: 'Reunião com Instrutor', lideres_turma: 'Reunião c/ Líderes de Turmas', departamento: 'Reunião de Departamento', resultado_mensal: 'Resultado Mensal', socio_fin: 'Sócios · Financeiro', socio_com: 'Sócios · Comercial', mensal_estrategica: 'Mensal Estratégica' };
  var MOTIVOS_FALTA = ['Conflito de agenda', 'Atendimento urgente', 'Ausência justificada', 'Esquecimento/não vi', 'Outro'];

  function travaLabel(v) { for (var i = 0; i < TRAVA_MOTIVOS.length; i++) { if (TRAVA_MOTIVOS[i].value === v) { return TRAVA_MOTIVOS[i].label; } } return ''; }
  function estaTravada(o) { return !!(o && o.ov && o.ov.travadoMotivo); }
  function origemReuniao(act) { return !!(act && (act.origemTipo === 'reuniao' || (act.origem && act.origem.tipo === 'reuniao') || act.origemReuniaoId || (act.origem && act.origem.reuniaoId))); }
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function txt(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } e.textContent = text == null ? '' : text; return e; }
  function tituloDe(o) { return (o && o.ov && o.ov.tituloOverride) || (o && o.act && o.act.titulo) || '(sem título)'; }
  function horarioDe(o) { return (o && o.ov && o.ov.horarioOverride) || (o && o.act && o.act.horario) || ''; }
  function pad2(n) { return n < 10 ? '0' + n : '' + n; }
  function fmtBR(iso) { if (!iso) { return '—'; } var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function saudacao() { var h = new Date().getHours(); return h < 12 ? 'Bom dia' : h < 18 ? 'Boa tarde' : 'Boa noite'; }
  function dataLonga(iso) {
    var M = ['janeiro', 'fevereiro', 'março', 'abril', 'maio', 'junho', 'julho', 'agosto', 'setembro', 'outubro', 'novembro', 'dezembro'];
    var D = ['Domingo', 'Segunda-feira', 'Terça-feira', 'Quarta-feira', 'Quinta-feira', 'Sexta-feira', 'Sábado'];
    var d = R.fromISO(iso);
    return D[d.getDay()] + ', ' + d.getDate() + ' de ' + M[d.getMonth()];
  }
  function primeiroNome(n) { return String(n || '').trim().split(/\s+/)[0] || ''; }
  function iniciais(n) { var p = String(n || '').trim().split(/\s+/); return (((p[0] || '')[0] || '') + ((p[1] || '')[0] || '')).toUpperCase(); }
  function diasTxt(d) { return d === 1 ? 'há 1 dia' : 'há ' + d + ' dias'; }

  /* ---------- Firestore (mesmo padrão do atividades/kpi) ---------- */
  var _fb = null;
  function fb() {
    if (!_fb) {
      _fb = Promise.all([
        import('./firebase.js'),
        import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
      ]).then(function (m) { return { db: m[0].db, f: m[1] }; });
    }
    return _fb;
  }
  function ferr(e) {
    var code = (e && e.code) || '';
    if (code === 'permission-denied') { return new Error('Sem permissão para esta ação. Confirme seu perfil com o gestor.'); }
    return new Error((e && e.message) || 'Erro ao falar com o banco.');
  }

  var Store = {
    log: function (entry) {
      return fb().then(function (c) {
        var row = Object.assign({ ts: Date.now(), uid: (CURRENT_USER && CURRENT_USER.uid) || null }, entry);
        return c.f.addDoc(c.f.collection(c.db, 'atividade_log'), row);
      }).catch(function (e) { if (window.console && console.warn) { console.warn('[hoje] log falhou', e); } });
    },
    setOcorrencia: function (act, origData, patch, acao) {
      return fb().then(function (c) {
        var idoc = R.docIdOcorrencia(act.id, origData);
        var base = { atividadeId: act.id, setorSigla: act.setorSigla, responsavelUid: act.responsavelUid || null, data: origData, prazoOriginal: origData };
        var body = Object.assign(base, patch);
        return c.f.setDoc(c.f.doc(c.db, 'ocorrencias', idoc), body, { merge: true }).then(function () {
          Store.log({ acao: acao, entidade: 'ocorrencia', refId: idoc, antes: null, depois: patch });
        });
      }).catch(function (e) { throw ferr(e); });
    },
    /* pedido de adiamento — corpo IDÊNTICO ao createSolicitacao do atividades/projetos */
    createSolicitacao: function (d) {
      return fb().then(function (c) {
        var doc = Object.assign({ status: 'pendente', criadoEm: Date.now() }, d);
        return c.f.addDoc(c.f.collection(c.db, 'solicitacoes'), doc).then(function (ref) {
          Store.log({ acao: 'solicitar_data', entidade: 'solicitacao', refId: ref.id, antes: { data: d.dataAtual }, depois: { data: d.dataProposta } });
          return ref.id;
        });
      }).catch(function (e) { throw ferr(e); });
    },
    listPlanosVivos: function () {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'planos_acao'), c.f.where('ativo', '==', true), c.f.limit(100));
        return c.f.getDocs(q).then(function (snap) { var a = []; snap.forEach(function (d) { a.push(Object.assign({ id: d.id }, d.data())); }); return a; });
      }).catch(function () { return []; });
    },
    /* contas ativas: quem lidera cada setor (cartões) e o ranking. Falha → [] (a tela nunca quebra). */
    listUsuarios: function () {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'usuarios'), c.f.where('ativo', '==', true), c.f.limit(200));
        return c.f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var u = d.data() || {}; u.uid = d.id; u.id = d.id; a.push(u); }); return a;
        });
      }).catch(function () { return []; });
    },
    confirmarPresenca: function (reuniaoId, atuais, uid, recusas) {
      return fb().then(function (c) {
        var novo = (Array.isArray(atuais) ? atuais.slice() : []);
        if (novo.indexOf(uid) === -1) { novo.push(uid); }
        var patch = { confirmadosUids: novo };
        if (recusas && recusas[uid]) { var rc = {}; Object.keys(recusas).forEach(function (k) { if (k !== uid) { rc[k] = recusas[k]; } }); patch.recusas = rc; }
        return c.f.updateDoc(c.f.doc(c.db, 'reunioes', reuniaoId), patch).then(function () {
          return Store.log({ acao: 'confirmar_presenca', entidade: 'reuniao', refId: reuniaoId, antes: null, depois: { uid: uid } });
        });
      });
    },
    recusarPresenca: function (reuniaoId, confirmados, recusas, uid, nome, motivo, detalhe) {
      return fb().then(function (c) {
        var conf = (Array.isArray(confirmados) ? confirmados : []).filter(function (u) { return u !== uid; });
        var rc = {}; Object.keys(recusas || {}).forEach(function (k) { rc[k] = recusas[k]; });
        rc[uid] = { motivo: motivo, detalhe: detalhe || null, nome: nome || '', em: Date.now() };
        return c.f.updateDoc(c.f.doc(c.db, 'reunioes', reuniaoId), { confirmadosUids: conf, recusas: rc }).then(function () {
          return Store.log({ acao: 'recusar_presenca', entidade: 'reuniao', refId: reuniaoId, antes: null, depois: { uid: uid, motivo: motivo } });
        });
      });
    },
    aceitarAtribuicao: function (actId, patch, acao) {
      return fb().then(function (c) {
        var up = Object.assign({}, patch, { atualizadoEm: Date.now() });
        return c.f.updateDoc(c.f.doc(c.db, 'atividades', actId), up).then(function () {
          return Store.log({ acao: acao, entidade: 'atividade', refId: actId, antes: null, depois: patch });
        });
      });
    },
    /* convocações sem corte cego (#32): teto alto, filtro e ordem no cliente, leitura cheia avisa */
    listMinhasConvocacoes: function (uid) {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'reunioes'), c.f.where('convocadosUids', 'array-contains', uid), c.f.limit(CONVOC_LIMITE));
        return c.f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var r = d.data() || {}; r.id = d.id; a.push(r); });
          return convocacoesVivas(a, CONVOC_LIMITE);
        });
      }).catch(function (e) {
        if (window.console && console.warn) { console.warn('[hoje] convocações não lidas:', (e && e.message) || e); }
        return { itens: [], cheio: false, erro: true };
      });
    }
  };
  function convocacoesVivas(docs, limite) {
    var lidos = Array.isArray(docs) ? docs : [];
    var vivas = lidos.filter(function (r) { return r && r.ativo !== false && !r.encerradaEm; });
    vivas.sort(function (x, y) {
      var kx = (x.data || '') + ' ' + (x.horaPrevista || '99:99'), ky = (y.data || '') + ' ' + (y.horaPrevista || '99:99');
      return kx < ky ? -1 : (kx > ky ? 1 : 0);
    });
    return { itens: vivas, cheio: lidos.length >= limite, erro: false };
  }

  /* ---------- toast ---------- */
  function toast(msg, kind) {
    var t = el('<div class="hj-toast' + (kind === 'err' ? ' err' : '') + '" role="status"></div>');
    t.textContent = msg; document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 2600);
  }

  /* ---------- mutações (1 toque) — herdadas, testadas ---------- */
  function CAN_WRITE() { var p = (CURRENT_USER && CURRENT_USER.profile) || ''; return p === 'Admin' || p === 'Editor'; }
  function PODE_AGIR(o) { if (CAN_WRITE()) { return true; } return !!(o && o.act && CURRENT_USER && o.act.responsavelUid === CURRENT_USER.uid); }
  function mutar(o, patch, acao, msg) {
    if (!PODE_AGIR(o)) { toast('Só o responsável (ou líder/gestor) mexe nesta atividade.', 'err'); return Promise.resolve(false); }
    return Store.setOcorrencia(o.act, o.origData, patch, acao)
      .then(function () { toast(msg); refresh(); return true; })
      .catch(function (e) { toast(e.message, 'err'); return false; });
  }
  function concluir(o) {
    if (!window.GrautConclusao) { toast('Não carreguei o módulo de conclusão. Recarregue a página.', 'err'); return Promise.resolve(false); }
    if (!PODE_AGIR(o)) { toast('Só o responsável (ou líder/gestor) mexe nesta atividade.', 'err'); return Promise.resolve(false); }
    return GrautConclusao.pedir({ titulo: 'Concluir · ' + tituloDe(o), subtitulo: 'Conte em uma linha o que foi feito. Quem lidera lê isto, não o "ok".' })
      .then(function (relato) {
        if (relato == null) { return false; }
        var agora = Date.now();
        var patch = { status: 'concluida', concluidaEm: agora, relato: relato, relatoEm: agora };
        if (estaTravada(o)) { patch.travadoMotivo = ''; patch.travadoDetalhe = ''; patch.travadoEm = null; }
        return mutar(o, patch, 'concluir_ocorrencia', 'Concluída. ✔');
      });
  }
  function reabrir(o) { return mutar(o, { status: 'pendente', concluidaEm: null }, 'reabrir_ocorrencia', 'Reaberta.'); }
  function iniciar(o) { return mutar(o, { status: 'em_andamento', iniciadaEm: Date.now() }, 'iniciar_ocorrencia', 'Em andamento.'); }
  function destravar(o) { return mutar(o, { travadoMotivo: '', travadoDetalhe: '', travadoEm: null }, 'destravar_ocorrencia', 'Destravada.'); }
  function modalTravei(o) {
    var jaTravada = estaTravada(o);
    var sel = UI.select({ value: (o.ov && o.ov.travadoMotivo) || '', placeholder: 'Escolha o que está no caminho', options: TRAVA_MOTIVOS });
    var ta = el('<textarea class="ui-input" rows="2"></textarea>');
    ta.value = (o.ov && o.ov.travadoDetalhe) || '';
    ta.placeholder = 'Quem, o quê, desde quando (ex.: aguardo a lista do Financeiro desde 3ª)';
    var aviso = txt('div', 'hj-info-v', 'A tarefa continua pendente e continua contando no atraso. Travar não é adiar nem pular — é dizer, em 1 toque, o que está no caminho. Se o problema é a data, use "Adiar".');
    aviso.style.color = 'var(--muted)';
    UI.modal({
      title: 'Travei nesta — ' + tituloDe(o), width: 460,
      body: [aviso,
        UI.field({ label: 'O que está travando', required: true, control: sel, hint: 'Motivo de lista porque o líder soma as causas do mês. Frase digitada não vira estatística.' }),
        UI.field({ label: 'Detalhe', control: ta, hint: 'Opcional — obrigatório só em "Outro motivo". Até 280 caracteres.' })],
      footer: function (close) {
        var acoes = [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close })];
        if (jaTravada) { acoes.push(UI.button({ label: 'Destravar', variant: 'ghost', onClick: function () { destravar(o).then(function (ok) { if (ok) { close(); } }); } })); }
        acoes.push(UI.button({ label: jaTravada ? 'Atualizar' : 'Registrar trava', icon: 'check', onClick: function () {
          var mot = sel.value, det = ta.value.trim().slice(0, 280);
          if (!travaLabel(mot)) { toast('Escolha o motivo.', 'err'); return; }
          if (mot === 'outro' && det.length < 3) { toast('Em "Outro motivo" escreva o detalhe — sem ele a trava não diz nada a ninguém.', 'err'); return; }
          mutar(o, { travadoMotivo: mot, travadoDetalhe: det, travadoEm: Date.now() }, 'travar_ocorrencia', jaTravada ? 'Trava atualizada.' : 'Trava registrada. Seu líder vê o motivo.')
            .then(function (ok) { if (ok) { close(); } });
        } }));
        return acoes;
      }
    });
  }
  function isoAmanha(hoje) { var dt = R.fromISO(hoje); dt.setDate(dt.getDate() + 1); return dt.getFullYear() + '-' + pad2(dt.getMonth() + 1) + '-' + pad2(dt.getDate()); }
  function modalAdiar(o) {
    var hoje = R.hojeISO(), direct = CAN_WRITE();
    var dtInp = el('<input type="date" class="ui-input">'); dtInp.value = isoAmanha(hoje);
    var motTa = el('<textarea class="ui-input" rows="2"></textarea>');
    motTa.placeholder = direct ? 'Motivo (fica no histórico)' : 'Por que precisa mudar a data? (o dono decide com isso)';
    var aviso = txt('div', 'hj-info-v', direct ? 'A reprogramação aplica na hora e conta no índice de reprogramação.' : 'Você não é líder/gestor — vira um pedido para o dono (ou gestor) aprovar.');
    aviso.style.color = 'var(--muted)';
    UI.modal({
      title: 'Adiar — ' + tituloDe(o), width: 440,
      body: [aviso,
        UI.field({ label: 'Nova data', required: true, control: dtInp, hint: 'Sugerida: amanhã. Data atual: ' + o.effDate.split('-').reverse().join('/') + '.' }),
        UI.field({ label: 'Motivo', required: true, control: motTa })],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: direct ? 'Adiar' : 'Enviar pedido', icon: 'check', onClick: function () {
            var nova = dtInp.value, motivo = motTa.value.trim();
            if (!R.isISO(nova)) { toast('Escolha uma data válida.', 'err'); return; }
            if (R.compareISO(nova, hoje) <= 0) { toast('Adiar é para frente — escolha uma data a partir de amanhã.', 'err'); return; }
            if (motivo.length < 3) { toast('Escreva o motivo (mínimo 3 caracteres) — é ele que explica o índice de reprogramação.', 'err'); return; }
            if (direct) {
              Store.setOcorrencia(o.act, o.origData, { status: 'reprogramada', dataOverride: nova, reprogMotivo: motivo }, 'reprogramar_ocorrencia')
                .then(function () { close(); toast('Adiada para ' + nova.split('-').reverse().join('/') + '.'); refresh(); })
                .catch(function (e) { toast(e.message, 'err'); });
              return;
            }
            Store.createSolicitacao({ atividadeId: o.act.id, ocorrenciaData: o.origData, escopo: 'esta', dataAtual: o.effDate, dataProposta: nova, motivo: motivo,
              solicitanteUid: CURRENT_USER.uid, solicitanteNome: CURRENT_USER.name || CURRENT_USER.nome || '', tituloAtividade: o.act.titulo, donoUid: o.act.criadoPor || null })
              .then(function () { close(); toast('Pedido de adiamento enviado ao dono.'); })
              .catch(function (e) { toast(e.message, 'err'); });
          } })];
      }
    });
  }
  function modalRecusaConvocacao(r) {
    var motSel = UI.select({ value: '', placeholder: '— Motivo (obrigatório) —', options: MOTIVOS_FALTA.map(function (m) { return { value: m, label: m }; }) });
    var detInp = UI.input({ placeholder: 'Detalhe (obrigatório se "Outro")' });
    UI.modal({
      title: 'Avisar que não vou — ' + (r.titulo || (TIPO_LABEL_R[r.tipo] || 'Reunião')), width: 440,
      body: [UI.field({ label: 'Motivo', required: true, control: motSel }),
        UI.field({ label: 'Detalhe', control: detInp, hint: 'O motivo aparece para quem convocou.' })],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: 'Enviar aviso', icon: 'check', onClick: function () {
            if (!motSel.value) { toast('Escolha o motivo.', 'err'); return; }
            if (motSel.value === 'Outro' && !detInp.value.trim()) { toast('Detalhe o motivo "Outro".', 'err'); return; }
            Store.recusarPresenca(r.id, r.confirmadosUids, r.recusas, CURRENT_USER.uid, CURRENT_USER.name || CURRENT_USER.nome || '', motSel.value, detInp.value.trim() || null)
              .then(function () {
                r.confirmadosUids = (r.confirmadosUids || []).filter(function (u) { return u !== CURRENT_USER.uid; });
                r.recusas = r.recusas || {}; r.recusas[CURRENT_USER.uid] = { motivo: motSel.value, detalhe: detInp.value.trim() || null, nome: CURRENT_USER.name || '', em: Date.now() };
                close(); toast('Aviso enviado — quem convocou vê o motivo.'); paint();
              })
              .catch(function (e) { toast(e.message || 'Não deu para enviar.', 'err'); });
          } })];
      }
    });
  }
  function modalRecusaAtribuicao(act) {
    var motInp = UI.input({ placeholder: 'Ex.: estou de férias na semana do prazo' });
    UI.modal({
      title: 'Não posso assumir — ' + (act.titulo || 'compromisso'), width: 440,

      w.appendChild(blocoEquipe(bs, hoje));
    } else {
      w.appendChild(secao('sec-painel', 'Seu dia em números'));
      w.appendChild(painelNumeros(pessoal, [], hoje, 'pessoal'));
    }

    /* 3 · comece por esta — a MESMA regra das pendências: a rotina atrasada
       mais crítica (vital, mais dias sem fazer), pela ocorrência mais recente;
       sem atraso, a de hoje mais cedo (proximaAcao). */
    var pendMinhas = KPI.pendenciasPorRotina(pessoal, hoje);
    var px = null;
    if (pendMinhas.total) { var p0 = pendMinhas.itens[0]; px = { occ: p0.occ, motivo: 'atrasada', dias: p0.dias, perdidas: p0.perdidas }; }
    else { px = KPI.proximaAcao ? KPI.proximaAcao(m.board, uid, hoje) : null; if (px && px.motivo === 'atrasada') { px = null; } }
    if (px) { w.appendChild(secao('sec-comece', 'Comece por esta', { formula: 'uma única sugestão, sempre pela mesma regra: (1º) sua rotina atrasada mais crítica — vital primeiro, depois há mais dias sem fazer — pela ocorrência mais recente · senão (2º) a de hoje com horário mais cedo · senão (3º) a primeira de hoje.', dados: 'suas ocorrências abertas.', numeros: px.motivo === 'atrasada' ? 'atrasada ' + diasTxt(px.dias) : px.motivo === 'hora' ? 'horário ' + px.hora : 'de hoje, sem horário', serve: 'tirar o custo de decidir por onde começar.' })); w.appendChild(heroi(px)); }

    /* 4 · agenda de hoje */
    w.appendChild(secao('sec-agenda', 'Agenda de hoje', { formula: 'suas ocorrências com data de hoje (menos as puladas): primeiro as com horário, em ordem; depois as sem horário, por nome.', dados: 'responsável = você.', numeros: d.doHoje.length + ' prevista(s) · ' + d.feitasHoje + ' concluída(s)', serve: 'um só lugar para fechar o dia.' }, d.doHoje.length || null));
    if (!d.doHoje.length) { w.appendChild(vazio('Nada previsto para hoje', gestor || lider ? 'Suas rotinas pessoais aparecem aqui quando você for o responsável por alguma atividade.' : 'Quando o seu líder atribuir uma rotina a você, ela aparece aqui com horário e um toque para concluir.')); }
    else { d.comHora.concat(d.semHora).forEach(function (o) { w.appendChild(linhaDia(o)); }); }

    /* 5 · mais atrasadas (usuário: as suas; líder: do setor; gestor: da unidade) */
    var baseAtr = usuario ? pessoal : (lider ? vis.filter(function (o) { return actNoEscopo(o.act, escopoLider() || {}); }) : vis);
    var pend = KPI.pendenciasPorRotina(baseAtr, hoje);
    var rotAtr = usuario ? 'Suas atrasadas' : (lider ? 'Mais atrasadas do seu setor' : 'Mais atrasadas da unidade');
    w.appendChild(secao('sec-atrasadas', rotAtr, { formula: 'uma pendência por rotina (a ocorrência mais recente de cada atividade atrasada; tarefa única conta uma por ocorrência). Ordem: vitais primeiro, depois há mais dias sem fazer.', dados: usuario ? 'suas ocorrências' : 'ocorrências do seu escopo', numeros: pend.total + ' pendência(s) · ' + pend.ocorrencias + ' ocorrência(s) perdida(s)', serve: 'o que ainda dá para recuperar hoje, sem a pilha.' }, pend.total || null, pend.total > 5 ? { label: 'Ver todas', href: 'atividades.html' } : null));
    if (!pend.total) { w.appendChild(vazio('Nada atrasado', usuario ? 'Tudo o que venceu está feito. Mantenha.' : 'Nenhuma rotina do escopo está vencida. Reconheça isso na próxima reunião.')); }
    else {
      pend.itens.slice(0, 5).forEach(function (it) { w.appendChild(linhaAtrasada(it)); });
      if (pend.itens.length > 5) {
        var fx2 = KPI.faixasDePendencia(pend.itens);
        var ln = txt('div', 'hj-info-v', '+ ' + (pend.itens.length - 5) + ' outra(s) · por idade: ' + fx2.map(function (f) { return f.rotulo + ' ' + f.n; }).join(' · '));
        ln.style.cssText = 'color:var(--muted2);font-size:var(--fs-xs);margin-top:4px'; w.appendChild(ln);
      }
    }

    /* 6 · reuniões */
    w.appendChild(blocoReunioes(hoje));

    /* 7 · ranking */
    var rk = blocoRanking(hoje); if (rk) { w.appendChild(rk); }

    /* celebrações (1 toast por dia por sessão; nunca modal) */
    if (stk && stk.hojePrev > 0 && !stk.hojeFechado && (stk.hojeFeitas / stk.hojePrev) >= 0.8 && CELEB80 !== hoje) { CELEB80 = hoje; toast('80% do seu dia — sequência garantida. 🔥'); }
    if (stk && stk.hojeFechado && stk.hojePrev > 0 && CELEBRADO !== hoje) { CELEBRADO = hoje; toast('Dia fechado! 🎯' + (stk.dias >= 2 ? ' Sequência de ' + stk.dias + ' dias. 🔥' : '')); }
  }

  /* ---------- carga ---------- */
  function refresh() {
    var uid = (CURRENT_USER && CURRENT_USER.uid) || null;
    var hoje = R.hojeISO();
    var ehUsuario = !!(Guard.isUsuario && Guard.isUsuario());
    Promise.all([
      KPI.carregar('band'),
      ehUsuario ? Promise.resolve([]) : Store.listPlanosVivos(),
      uid ? Store.listMinhasConvocacoes(uid) : Promise.resolve({ itens: [], cheio: false, erro: false }),
      KPI.lerSnapshots ? KPI.lerSnapshots(hoje) : Promise.resolve([]),
      ehUsuario ? Promise.resolve([]) : Store.listUsuarios()
    ]).then(function (r) {
      MODELO = r[0]; PLANOS = r[1] || [];
      var cv = r[2] || {}; CONVOC = cv.itens || []; CONVOC_AVISO = cv.cheio ? 'cheio' : (cv.erro ? 'erro' : '');
      SNAPS = r[3] || []; USUARIOS = r[4] || [];
      LIDO_EM = Date.now();
      paint();
    }).catch(function (e) { setState('Não consegui carregar o seu dia.', (e && e.message) || 'Erro ao ler o banco.'); });
  }
  setInterval(function () { if (LIDO_EM && MODELO) { var s = document.querySelector('.hj-stamp'); if (s && s.parentNode) { s.parentNode.replaceChild(carimbo(), s); } } }, 60000);

  Guard.onReady(function (USER) {
    CURRENT_USER = USER;
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Hoje', user: USER }), app.firstChild);
    if (CAN_WRITE()) {
      var cta = UI.button({ label: 'Nova atividade', icon: 'plus' });
      cta.addEventListener('click', function () { window.location.href = 'atividades.html'; });
      document.getElementById('hj-cta').appendChild(cta);
    }
    document.getElementById('hj-mav').appendChild(UI.avatar({ initials: USER.initials, size: 40 }));
    var fn = primeiroNome(USER.name) || USER.name;
    var hojeISO = R.hojeISO();
    var escopoTxt = (Guard.isGestor && Guard.isGestor()) ? 'visão da unidade' : ((Guard.isLider && Guard.isLider()) ? ((USER.setoresLiderados || []).join(', ') || 'seu setor') : 'o seu dia');
    ['.hj-hi', '.hj-mg'].forEach(function (s) { var n = document.querySelector(s); if (n) { n.textContent = saudacao() + ', ' + fn; } });
    ['.hj-dd', '.hj-md'].forEach(function (s) { var n = document.querySelector(s); if (n) { n.textContent = dataLonga(hojeISO) + ' · ' + escopoTxt; } });
    setState(null); skeleton();
    refresh();
  });
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
