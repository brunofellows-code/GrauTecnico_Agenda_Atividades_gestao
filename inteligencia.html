<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Inteligência — GERA</title>

<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
  <script src="mnav.js"></script>

<style>
.pf-app{display:flex;min-height:100vh;background:var(--bg)}
.pf-app>.ui-side{position:sticky;top:0;height:100vh}
.pf-main{flex:1;min-width:0;display:flex;flex-direction:column}

/* topbar desktop */
.pf-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--s1)}
.pf-top-l{display:flex;flex-direction:column;gap:3px}
.pf-h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.pf-top-r{display:flex;align-items:center;gap:12px}

/* header mobile */
.pf-mhead{display:none;flex-direction:column;gap:12px;padding:14px 16px;background:var(--s1);border-bottom:1px solid var(--border)}
.pf-mhead-top{display:flex;align-items:center;gap:12px}
.pf-back{width:34px;height:34px;border-radius:10px;background:var(--s2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;flex:none}
.pf-back svg{width:18px;height:18px;color:var(--text)}
.pf-mtitle{font-size:17px;font-weight:800;letter-spacing:-.02em}

/* segmented período */
.pf-seg{display:inline-flex;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.pf-seg-b{appearance:none;border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.pf-seg-b.on{background:var(--cta);color:var(--ctaText)}
.pf-mhead .pf-seg{display:flex;width:100%}
.pf-mhead .pf-seg-b{flex:1;text-align:center;padding:8px 0}

/* carimbo (não-retroativo) */
.pf-stamp{font-size:11px;font-weight:600;color:var(--muted2);padding:12px 32px 0}

.pf-body{padding:18px 32px 32px}

/* KPI cards (foco + scorecard) */
.pf-focus{display:grid;grid-template-columns:repeat(5,1fr);gap:13px;margin-bottom:13px}
.pf-score{display:grid;grid-template-columns:repeat(4,1fr);gap:11px;margin-bottom:22px}
.pf-big,.pf-small{background:var(--s1);border:1px solid var(--border);border-radius:15px;box-shadow:var(--shadowSoft)}
.pf-big{padding:16px 16px 14px}
.pf-small{padding:13px}
.pf-card-top{display:flex;align-items:center;gap:8px;margin-bottom:12px}
.pf-small .pf-card-top{margin-bottom:9px}
.pf-dot{width:9px;height:9px;border-radius:50%;flex:none}
.pf-label{flex:1;min-width:0;font-size:12px;font-weight:700;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-small .pf-label{font-size:11px}
.pf-val{font-size:25px;font-weight:800;letter-spacing:-.02em;line-height:1}
.pf-small .pf-val{font-size:20px}
.pf-trend{display:flex;align-items:center;gap:5px;font-size:12px;font-weight:700;margin-top:6px}
.pf-small .pf-trend{font-size:11px;gap:4px}
.pf-tri{font-size:10px;line-height:1}
.pf-spark{display:flex;align-items:flex-end;gap:3px;height:30px;margin-top:12px}
.pf-small .pf-spark{height:22px;gap:2.5px;margin-top:9px}
.pf-spark i{flex:1;border-radius:2px 2px 0 0;min-height:3px;opacity:.85}

/* botão "i" */
.pf-i{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted2);display:inline-flex;flex:none}
.pf-i:hover{color:var(--greenText)}
.pf-i svg{display:block}

/* gráficos */
.pf-row1{display:grid;grid-template-columns:1.25fr 1fr;gap:13px;margin-bottom:13px}
.pf-row2{display:grid;grid-template-columns:1fr 1.25fr;gap:13px}
.pf-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:18px}
.pf-card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:16px}
.pf-card-t{font-size:14px;font-weight:800}

/* barras horizontais */
.pf-bh{position:relative}
.pf-bh-rows{position:relative;z-index:1}
.pf-bh-row{margin-bottom:13px}
.pf-bh-row:last-child{margin-bottom:0}
.pf-bh-head{display:flex;justify-content:space-between;margin-bottom:5px;font-size:11.5px;font-weight:700}
.pf-bh-head .l{color:var(--muted)}
.pf-bh-head .v{color:var(--text)}
.pf-bh-track{height:14px;background:var(--track);border-radius:7px;overflow:hidden}
.pf-bh-fill{height:100%;border-radius:7px}
.pf-bh-meta{position:absolute;top:0;bottom:18px;width:2px;border-radius:2px;background:var(--muted2);z-index:2}
.pf-bh-meta b{position:absolute;top:-15px;left:50%;transform:translateX(-50%);font-size:9.5px;font-weight:700;color:var(--muted2);white-space:nowrap}

/* barras verticais */
.pf-bv{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:20px}
.pf-bv-col{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%}
.pf-bv-bar{width:100%;max-width:46px;border-radius:7px 7px 0 0;position:relative;min-height:4px}
.pf-bv-val{position:absolute;top:-17px;left:0;right:0;text-align:center;font-size:11px;font-weight:800;color:var(--text)}
.pf-bv-label{margin-top:7px;font-size:10.5px;font-weight:600;color:var(--muted2);text-align:center;line-height:1.1}

/* popover do "i" */
.pf-backdrop{position:fixed;inset:0;z-index:40;display:none}
.pf-backdrop.on{display:block}
.pf-pop{position:fixed;z-index:41;display:none;width:290px;max-width:calc(100vw - 32px);background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;box-shadow:var(--cardShadow)}
.pf-pop.on{display:block}
.pf-pop-t{font-size:12.5px;font-weight:800;margin-bottom:9px}
.pf-pop-row{margin-bottom:8px}
.pf-pop-k{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--muted2);margin-bottom:2px}
.pf-pop-v{font-size:12px;font-weight:600;color:var(--text);line-height:1.35}
.pf-pop-note{margin-top:4px;font-size:11px;font-weight:700;color:var(--orange);line-height:1.3}

/* tab bar mobile */
.pf-tabbar{display:none}
.pf-tab{display:flex;flex-direction:column;align-items:center;gap:5px;color:var(--muted);font-size:10px;font-weight:600}
.pf-tab svg{width:22px;height:22px}
.pf-tab.on{color:var(--greenText);font-weight:700}
.pf-fab{width:50px;height:50px;border-radius:16px;background:var(--cta);color:var(--ctaText);display:flex;align-items:center;justify-content:center;margin-top:-6px;box-shadow:0 6px 16px var(--activeBg)}
.pf-fab svg{width:24px;height:24px}

/* toggle de tema temporário */
.pf-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--cardShadow)}
.pf-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}

@media (max-width:900px){
  .pf-app>.ui-side{display:none}
  .pf-top{display:none}
  .pf-mhead{display:flex}
  .pf-stamp{padding:14px 16px 0}
  .pf-body{padding:16px 16px 96px}
  .pf-focus{grid-template-columns:1fr 1fr}
  .pf-score{grid-template-columns:1fr 1fr}
  .pf-row1,.pf-row2{grid-template-columns:1fr;margin-bottom:13px}
  #pf-aging,#pf-throughput,#pf-carga{display:none}
  .pf-ader-row:nth-child(n+6){display:none}
  .pf-tabbar{display:flex;position:fixed;left:0;right:0;bottom:0;height:80px;background:var(--s1);border-top:1px solid var(--border);align-items:flex-start;justify-content:space-around;padding:11px 14px 0;z-index:20}
  .pf-dev{bottom:94px}
}

/* ---- Inteligência: adições ---- */
.pf-sub2{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:6px}
.pf-empty2{font-size:12.5px;color:var(--muted);padding:18px 4px}
.pf-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:340px;padding:40px 20px}
.pf-state-t{font-size:16px;font-weight:800;color:var(--text)}
.pf-state-s{font-size:13px;color:var(--muted);max-width:440px;line-height:1.5}
.pf-plano{display:flex;flex-direction:column;gap:2px;margin-top:4px}
.pf-plano-item{display:flex;align-items:flex-start;gap:11px;padding:11px 2px;border-top:1px solid var(--border)}
.pf-plano-item:first-child{border-top:0}
.pf-plano-dot{width:9px;height:9px;border-radius:50%;margin-top:5px;flex:none}
.pf-plano-c{flex:1;min-width:0}
.pf-plano-txt{font-size:13.5px;font-weight:700;color:var(--text)}
.pf-plano-act{font-size:12px;color:var(--muted);margin-top:2px}
.pf-plano-ok{font-size:13.5px;font-weight:700;color:var(--green);padding:14px 2px}

/* ---- N2: tendência (Δ7d + sparkline) e score por setor ---- */
.pf-delta{display:flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;margin-top:8px}
.pf-delta .lbl{color:var(--muted2);font-weight:700}
.pf-delta.ok{color:var(--green)}
.pf-delta.bad{color:var(--red)}
.pf-delta.flat{color:var(--muted2)}
.pf-colet{display:inline-block;font-size:10px;font-weight:800;color:var(--muted2);background:var(--chipBg);border:1px solid var(--border);padding:2px 8px;border-radius:20px;margin-top:9px}
.pf-sparkwrap{margin-top:9px;height:26px}
.pf-sparkwrap svg{display:block;width:100%;height:26px;overflow:visible}
.pf-ss-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--border)}
.pf-ss-row:first-child{border-top:0}
.pf-ss-nome{width:170px;flex:none;font-size:12.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-ss-track{flex:1;height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.pf-ss-fill{height:100%;border-radius:6px}
.pf-ss-num{width:36px;text-align:right;font-size:13px;font-weight:800}
.pf-ss-dot{width:9px;height:9px;border-radius:50%;flex:none}
@media(max-width:900px){.pf-ss-nome{width:96px}}
/* ---------- C4: drill-down — lista dos itens que compõem o número ---------- */
.pf-big.dd-click,.pf-small.dd-click,.pf-ss-row.dd-click{cursor:pointer}
.pf-big.dd-click:hover,.pf-small.dd-click:hover{border-color:var(--brand)}
.pf-ss-row.dd-click:hover .pf-ss-nome{color:var(--text)}
.dd-count{font-size:12px;color:var(--muted);margin:0 0 10px}
.dd-list{display:flex;flex-direction:column;gap:6px;max-height:56vh;overflow:auto}
.dd-row{display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--border);border-radius:10px;background:var(--s1);min-width:0}
.dd-tit{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-sig{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);background:var(--chipBg);border:1px solid var(--border);border-radius:6px;padding:2px 6px;white-space:nowrap}
.dd-meta{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dd-late{color:var(--red);font-weight:700}
.dd-more,.dd-empty{font-size:12px;color:var(--muted2);text-align:center;padding:10px}
.dd-go{font-size:12.5px;font-weight:700;color:var(--greenText);text-decoration:none;margin-right:auto;align-self:center}
.dd-go:hover{text-decoration:underline}
@media(max-width:700px){.dd-row{flex-wrap:wrap}.dd-tit{flex-basis:100%;white-space:normal}}

/* ---------- F1-D: partida fria + backlog sem dono ---------- */
.pf-banner{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--brand);border-radius:12px;padding:12px 16px;margin-bottom:13px;font-size:12.5px;color:var(--muted);font-weight:600}
.pf-banner b{color:var(--text)}
.pf-colet-row{opacity:.85}
.pf-colet-tag{font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted2);background:var(--chipBg);border:1px solid var(--border);border-radius:20px;padding:2px 9px}
.pf-orfa{font-size:12px;color:var(--muted2);border-top:1px dashed var(--border);margin-top:10px;padding-top:9px}
.pf-backlog{display:flex;align-items:center;gap:14px;background:var(--s1);border:1px solid var(--border);border-left:3px solid var(--amber);border-radius:15px;padding:14px 18px;margin-bottom:13px;flex-wrap:wrap}
.pf-backlog-n{font-size:24px;font-weight:800;color:var(--amber);line-height:1}
.pf-backlog-t{font-size:13px;font-weight:700;color:var(--text)}
.pf-backlog-s{font-size:12px;color:var(--muted);font-weight:600}
.pf-backlog a{color:var(--greenText);font-weight:800;font-size:12.5px;text-decoration:none;margin-left:auto}
.pf-backlog a:hover{text-decoration:underline}
/* F1-G · criar plano */
.pf-catlist{max-height:34vh;overflow:auto;display:flex;flex-direction:column;gap:4px;margin-top:6px}
.pf-catrow{display:flex;align-items:center;gap:8px;padding:6px 8px;border:1px solid var(--border);border-radius:8px;background:var(--surface);cursor:pointer}
.pf-catt{font-size:.8rem;color:var(--text)}
.pf-date{background:var(--surface);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:8px 10px;font:inherit}
</style>
</head>
<body>

  <!-- portão de acesso (guard.js controla) -->
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="pf-dev" data-theme-toggle type="button" title="Alternar tema (temporário)"><span class="pin"></span>Tema</button>

  <div class="pf-app" id="app">
    <main class="pf-main">

      <div class="pf-top">
        <div class="pf-top-l">
          <div class="pf-h1">Inteligência</div>
        </div>
        <div class="pf-top-r">
          <div class="pf-seg">
            <button class="pf-seg-b on" type="button" data-periodo="band">Atrasadas + 30d</button>
            <button class="pf-seg-b" type="button" data-periodo="semana">Semana</button>
            <button class="pf-seg-b" type="button" data-periodo="mes">Mês</button>
          </div>
          <span id="pf-export"></span>
        </div>
      </div>

      <div class="pf-mhead">
        <div class="pf-mhead-top">
          <div class="pf-back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg></div>
          <div class="pf-mtitle">Inteligência</div>
        </div>
        <div class="pf-seg">
          <button class="pf-seg-b on" type="button" data-periodo="band">Atrasadas + 30d</button>
          <button class="pf-seg-b" type="button" data-periodo="semana">Semana</button>
          <button class="pf-seg-b" type="button" data-periodo="mes">Mês</button>
        </div>
      </div>

      <div class="pf-stamp" id="pf-stamp">Indicadores do estado atual das rotinas.</div>

      <div class="pf-body" id="pf-body"></div>

    </main>
  </div>

  <div class="pf-tabbar">
    <div class="pf-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><path d="M12 7v5l3 2"></path></svg><span>Hoje</span></div>
    <div class="pf-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path></svg><span>Projetos</span></div>
    <div class="pf-fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M12 5v14M5 12h14"></path></svg></div>
    <div class="pf-tab on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"></path></svg><span>Inteligência</span></div>
    <div class="pf-tab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 11a8 8 0 0 1 16 0"></path><path d="M4 11v3a8 8 0 0 0 16 0v-3"></path></svg><span>Perfil</span></div>
  </div>

  <div class="pf-backdrop" id="pf-backdrop"></div>
  <div class="pf-pop" id="pf-pop"></div>

  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script src="ctx.js"></script>
  <script>
  /* ===== Inteligência: KPIs REAIS via kpi.js (motor validado à mão). Zero mock. ===== */
  var USER = { name: '—', profile: 'Visualizador', initials: '—' };
  var PERIODO = 'band';   /* band = atrasadas + 30 dias (padrão) | 'semana' | 'mes' */
  var MODELO = null;      /* último retorno de KPI.computar */
  var BOARD = [];         /* M2: board expandido retido p/ agrupar gargalos multi-setor */
  var ATIV = [];          /* F1-G: atividades ativas retidas p/ vincular a planos */
  var DATA_OPER_MIN = null; /* F1-D: menor dataInicio recorrente — âncora do banner de partida */
  var SNAPSHOTS = [];     /* N2: fotos diárias (kpi_snapshots) p/ Δ7d + sparkline */
  var SNAP_TENTADO = false; /* N2: gravação idempotente — 1 tentativa por sessão */
  var HOJE = null;        /* N2: dia civil local do último computar */

  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function haloOf(tone) { return 'halo' + tone.charAt(0).toUpperCase() + tone.slice(1); }

  /* ---------- popover do "i" ---------- */
  var POP, BACK;
  function infoBtn(data) {
    var b = el('<button class="pf-i" type="button" aria-label="Como é calculado"></button>');
    b.appendChild(UI.icon('info', 14));
    b.addEventListener('click', function (ev) { ev.stopPropagation(); openPop(ev, data); });
    return b;
  }
  function openPop(ev, d) {
    POP.innerHTML = '';
    /* RAIO-X: textContent em tudo que carrega dado dinâmico (títulos de
       plano/atividade entram aqui) — HTML injetado em título não executa. */
    var pt = el('<div class="pf-pop-t"></div>'); pt.textContent = d.title || ''; POP.appendChild(pt);
    [['FÓRMULA', d.formula], ['DADOS / COLUNAS', d.dados], ['NÚMEROS DESTE CÁLCULO', d.numeros]].forEach(function (r) {
      var row = el('<div class="pf-pop-row"></div>');
      var rk = el('<div class="pf-pop-k"></div>'); rk.textContent = r[0]; row.appendChild(rk);
      var rv = el('<div class="pf-pop-v"></div>'); rv.textContent = r[1] || ''; row.appendChild(rv);
      POP.appendChild(row);
    });
    if (d.nota) { var nt = el('<div class="pf-pop-note"></div>'); nt.textContent = d.nota; POP.appendChild(nt); }
    BACK.classList.add('on');
    POP.classList.add('on');
    if (window.innerWidth <= 900) {
      POP.style.left = '50%';
      POP.style.transform = 'translateX(-50%)';
      POP.style.top = '';
      POP.style.bottom = '96px';
    } else {
      POP.style.transform = '';
      POP.style.bottom = '';
      var pr = POP.getBoundingClientRect();
      var x = Math.min(ev.clientX + 12, window.innerWidth - pr.width - 12);
      var y = Math.min(ev.clientY + 12, window.innerHeight - pr.height - 12);
      POP.style.left = Math.max(12, x) + 'px';
      POP.style.top = Math.max(12, y) + 'px';
    }
  }
  function closePop() { POP.classList.remove('on'); BACK.classList.remove('on'); }

  /* ---------- sparkline (tendência REAL: fotos diárias do kpi_snapshots) ---------- */
  /* ---------- card de KPI (sem tendência: ainda não há histórico real) ---------- */
  function kpiCard(k, big) {
    var c = el('<div class="' + (big ? 'pf-big' : 'pf-small') + '"></div>');
    if (k.drill) {                          /* C4: clique no card abre a lista dos itens */
      c.classList.add('dd-click');
      c.title = 'Clique para ver os itens que compõem este número';
      c.addEventListener('click', function () { abrirDrill(k.drillTitle || (k.label + ' — itens'), k.drill()); });
    }
    var top = el('<div class="pf-card-top"></div>');
    top.appendChild(el('<span class="pf-dot" style="background:var(--' + k.tone + ');box-shadow:0 0 0 3px var(--' + haloOf(k.tone) + ')"></span>'));
    top.appendChild(el('<span class="pf-label">' + k.label + '</span>'));
    top.appendChild(infoBtn(k.info));
    c.appendChild(top);
    c.appendChild(el('<div class="pf-val">' + k.value + '</div>'));
    if (k.sub) { c.appendChild(el('<div class="pf-sub2">' + k.sub + '</div>')); }
    /* N2: tendência real por fotos diárias — só na janela padrão (as fotos
       são gravadas nela; comparar com semana/mês misturaria métricas). */
    if (PERIODO === 'band' && k.trendKey && HOJE) {
      var t = KPI._trend(SNAPSHOTS, k.trendKey, HOJE);
      if (!t.suficiente) {
        c.appendChild(el('<span class="pf-colet">coletando ' + t.coletando + ' dias</span>'));
      } else {
        var df = KPI._deltaFmt(t.delta7, !!k.menorMelhor);
        var seta = t.delta7 > 0 ? '▲' : (t.delta7 < 0 ? '▼' : '·');
        c.appendChild(el('<div class="pf-delta ' + df.tom + '"><span class="pf-tri">' + seta + '</span><span>' + df.texto + '</span><span class="lbl">vs 7d</span></div>'));
      }
      var serie = SNAPSHOTS.map(function (s) { return s[k.trendKey]; }).filter(function (v) { return v != null; });
      var pts = KPI._sparkPoints(serie, 100, 24);
      if (pts) {
        var sw = el('<div class="pf-sparkwrap" style="color:var(--' + k.tone + ')"></div>');
        sw.innerHTML = '<svg viewBox="0 0 100 24" preserveAspectRatio="none" aria-hidden="true"><polyline points="' + pts + '" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"></polyline></svg>';
        c.appendChild(sw);
      }
    }
    return c;
  }

  /* ---------- barras horizontais (aderência, carga) ---------- */
  function barsH(items, opt) {
    var node = el('<div class="pf-bh"></div>');
    var rows = el('<div class="pf-bh-rows"></div>');
    items.forEach(function (it) {
      var r = el('<div class="pf-bh-row ' + (opt.rowClass || '') + '"></div>');
      /* RAIO-X: it.l carrega nome de pessoa/setor (dado dinâmico) → textContent */
      var head = el('<div class="pf-bh-head"></div>');
      var lb = el('<span class="l"></span>'); lb.textContent = it.l; head.appendChild(lb);
      var vv = el('<span class="v"></span>'); vv.textContent = String(it.v) + (opt.suffix || ''); head.appendChild(vv);
      r.appendChild(head);
      var tr = el('<div class="pf-bh-track"></div>');
      tr.appendChild(el('<div class="pf-bh-fill" style="width:' + (it.v / opt.max * 100) + '%;background:' + it.c + '"></div>'));
      r.appendChild(tr);
      rows.appendChild(r);
    });
    node.appendChild(rows);
    if (opt.meta != null) {
      var m = el('<div class="pf-bh-meta" style="left:' + opt.meta + '%"></div>');
      if (opt.metaLabel) { m.appendChild(el('<b>' + opt.metaLabel + '</b>')); }
      node.appendChild(m);
    }
    return node;
  }

  /* ---------- barras verticais (aging, throughput) ---------- */
  function barsV(items, opt) {
    var node = el('<div class="pf-bv"></div>');
    items.forEach(function (it) {
      var col = el('<div class="pf-bv-col"></div>');
      var bar = el('<div class="pf-bv-bar" style="height:' + (it.v / opt.max * 100) + '%;background:' + it.c + '"></div>');
      bar.appendChild(el('<span class="pf-bv-val">' + it.v + '</span>'));
      col.appendChild(bar);
      col.appendChild(el('<span class="pf-bv-label">' + it.l + '</span>'));
      node.appendChild(col);
    });
    return node;
  }

  function chartCard(title, info, body, id) {
    var c = el('<div class="pf-card"></div>');
    c.id = id;
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">' + title + '</div>'));
    h.appendChild(infoBtn(info));
    c.appendChild(h);
    c.appendChild(body);
    return c;
  }

  /* ---------- formatação ---------- */
  function fmtPct(v) { return v == null ? '—' : v + '%'; }
  function fmtDias(x) { return (Math.round(x * 10) / 10).toString().replace('.', ',') + ' d'; }
  function brData(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function rotuloSemana(iso) { var p = iso.split('-'); return p[2] + '/' + p[1]; }
  function rotuloPeriodo(p) { return ({ band: 'atrasadas + 30 dias', semana: 'esta semana', mes: 'este mês' })[p] || p; }

  /* ============================================================
     C4 · DRILL-DOWN — o "i" prova a fórmula; o drill mostra os
     ITENS que compõem o número. Filtro client-side do BOARD já
     em memória (mesmo motor dos KPIs) — ZERO query extra.
     ============================================================ */
  var DD_TETO = 100;
  var DD_STATUS = {
    pendente:     { l: 'Pendente',     t: 'amber'  },
    em_andamento: { l: 'Em andamento', t: 'doing'  },
    reprogramada: { l: 'Reprogramada', t: 'orange' },
    concluida:    { l: 'Concluída',    t: 'green'  },
    pulada:       { l: 'Pulada',       t: 'muted2' }
  };
  function ddDias(iso, hoje) {            /* dias de atraso em DIA CIVIL LOCAL */
    var a = iso.split('-'), b = hoje.split('-');
    var d1 = new Date(+a[0], +a[1] - 1, +a[2]), d2 = new Date(+b[0], +b[1] - 1, +b[2]);
    return Math.round((d2 - d1) / 86400000);
  }
  function ddRow(o, hoje) {
    var st = DD_STATUS[o.status] || { l: o.status, t: 'muted2' };
    var r = el('<div class="dd-row"></div>');
    r.appendChild(el('<span class="pf-ss-dot" style="background:var(--' + st.t + ')"></span>'));
    var tit = el('<span class="dd-tit"></span>');
    tit.textContent = (o.act && o.act.titulo) || '(sem título)'; tit.title = tit.textContent;
    r.appendChild(tit);
    var sigs = KPI.setoresDe(o.act, MODELO.setores);
    var sig = el('<span class="dd-sig"></span>'); sig.textContent = sigs.length ? sigs.join('·') : '—';
    r.appendChild(sig);
    var resp = el('<span class="dd-meta"></span>'); resp.textContent = o.responsavel || 'sem responsável';
    r.appendChild(resp);
    /* F1-I: do insight à ação em 1 clique — abre a atividade na tela Atividades */
    if (o.act && o.act.id) {
      var lk = el('<a class="dd-meta" style="color:var(--brand);font-weight:800;text-decoration:none;flex:0 0 auto"></a>');
      lk.textContent = 'abrir →';
      lk.href = 'atividades.html#a=' + encodeURIComponent(o.act.id);
      lk.addEventListener('click', function (ev) { ev.stopPropagation(); });
      r.appendChild(lk);
    }
    var dt = el('<span class="dd-meta' + (o.atrasada ? ' dd-late' : '') + '"></span>');
    dt.textContent = brData(o.effDate) + (o.atrasada ? ' · ' + ddDias(o.effDate, hoje) + 'd' : '');
    r.appendChild(dt);
    r.appendChild(el('<span class="dd-meta">' + st.l + '</span>'));
    return r;
  }
  function abrirDrill(titulo, itens) {
    UI.modal({
      title: titulo,
      width: 640,
      body: function () {
        var box = document.createElement('div');
        box.appendChild(el('<div class="dd-count">' + itens.length + ' item(ns)' +
          (itens.length > DD_TETO ? ' · mostrando os ' + DD_TETO + ' primeiros' : '') +
          ' · janela: ' + rotuloPeriodo(PERIODO) + '</div>'));
        if (!itens.length) {
          box.appendChild(el('<div class="dd-empty">Nenhum item compõe este número agora.</div>'));
          return box;
        }
        var list = el('<div class="dd-list"></div>');
        itens.slice(0, DD_TETO).forEach(function (o) { list.appendChild(ddRow(o, HOJE)); });
        box.appendChild(list);
        if (itens.length > DD_TETO) {
          box.appendChild(el('<div class="dd-more">+ ' + (itens.length - DD_TETO) + ' item(ns) — refine na tela de Atividades.</div>'));
        }
        return box;
      },
      footer: function (close) {
        return [el('<a class="dd-go" href="atividades.html">Abrir tela de Atividades →</a>'),
                UI.button({ label: 'Fechar', variant: 'ghost', onClick: close })];
      }
    });
  }
  /* ordenações: mais antigas primeiro; abertas antes de concluídas/puladas */
  function ddOrdData(a, b) { return a.effDate < b.effDate ? -1 : a.effDate > b.effDate ? 1 : 0; }
  function ddOrdPend(a, b) {
    var pa = (a.status === 'concluida' || a.status === 'pulada') ? 1 : 0;
    var pb = (b.status === 'concluida' || b.status === 'pulada') ? 1 : 0;
    return (pa - pb) || ddOrdData(a, b);
  }
  function ddAberta(o) { return o.status === 'pendente' || o.status === 'em_andamento' || o.status === 'reprogramada'; }
  var DD = {
    previstas:     function () { return BOARD.filter(function (o) { return o.effDate <= HOJE && o.status !== 'pulada'; }).sort(ddOrdPend); },
    atrasadas:     function () { return BOARD.filter(function (o) { return o.atrasada; }).sort(ddOrdData); },
    andamento:     function () { return BOARD.filter(function (o) { return o.status === 'em_andamento'; }).sort(ddOrdData); },
    concluidas:    function () { return BOARD.filter(function (o) { return o.status === 'concluida'; }).sort(ddOrdData); },
    reprogramadas: function () { return BOARD.filter(function (o) { return o.status === 'reprogramada'; }).sort(ddOrdData); },
    puladas:       function () { return BOARD.filter(function (o) { return o.status === 'pulada'; }).sort(ddOrdData); },
    semResp:       function () { return BOARD.filter(function (o) { return o.semResp && ddAberta(o); }).sort(ddOrdData); },
    abertas:       function () { return BOARD.filter(ddAberta).sort(ddOrdData); },
    setor:         function (sig) {
      return BOARD.filter(function (o) {
        var s = KPI.setoresDe(o.act, MODELO.setores); if (!s.length) { s = ['—']; }
        return s.indexOf(sig) >= 0;
      }).sort(function (a, b) { return ((b.atrasada ? 1 : 0) - (a.atrasada ? 1 : 0)) || ddOrdData(a, b); });
    }
  };

  /* ---------- KPIs de topo (grandes) ---------- */
  function toneAder(v) { return v == null ? 'muted2' : v >= 90 ? 'green' : v >= 80 ? 'amber' : 'red'; }
  function focusKPIs(m) {
    var t = m.totais;
    return [
      { label: 'Aderência à rotina',
        /* F1-D(e): nada venceu ainda → neutro "coletando" (0% falso não existe) */
        value: t.previstasVencidas === 0 ? '—' : fmtPct(m.aderencia),
        tone: t.previstasVencidas === 0 ? 'muted2' : toneAder(m.aderencia),
        sub: t.previstasVencidas === 0 ? 'coletando — mede quando a 1ª rotina vencer' : (t.concluidasAteHoje + ' de ' + t.previstasAteHoje + ' previstas até hoje'),
        trendKey: 'aderencia', menorMelhor: false,
        drill: function () { return DD.previstas(); }, drillTitle: 'Aderência — previstas até hoje (abertas primeiro)',
        info: { title: 'Aderência à rotina (indicador-mestre)', formula: 'concluídas até hoje ÷ previstas até hoje × 100', dados: 'ocorrências da janela com data ≤ hoje; “previstas” exclui as puladas. Δ7d e linha: fotos diárias (kpi_snapshots) da janela padrão', numeros: t.concluidasAteHoje + ' ÷ ' + t.previstasAteHoje + ' = ' + fmtPct(m.aderencia) } },
      { label: 'Atividades atrasadas', value: String(t.atrasadas), tone: t.atrasadas ? 'red' : 'green',
        sub: 'vencidas e ainda abertas',
        trendKey: 'atrasadas', menorMelhor: true,
        drill: function () { return DD.atrasadas(); }, drillTitle: 'Atrasadas — mais antigas primeiro',
        info: { title: 'Atividades atrasadas', formula: 'ocorrências abertas (pendente, em andamento ou reprogramada) com data efetiva < hoje', dados: 'ocorrências da janela + override de data. Δ7d (queda = verde) e linha: fotos diárias (kpi_snapshots)', numeros: t.atrasadas + ' atrasada(s) agora' } },
      { label: 'Em andamento', value: String(t.andamento), tone: t.andamento ? 'doing' : 'muted2',
        sub: 'já iniciadas, não concluídas',
        trendKey: 'andamento', menorMelhor: true,
        drill: function () { return DD.andamento(); },
        info: { title: 'Trabalho em andamento (WIP)', formula: 'ocorrências com status = em andamento', dados: 'ocorrências: override de status. Δ7d (queda = verde: menos WIP parado) e linha: fotos diárias (kpi_snapshots)', numeros: t.andamento + ' em andamento' } },
      { label: 'Concluídas na janela', value: String(t.concluidas), tone: 'green',
        sub: rotuloPeriodo(m.periodo),
        drill: function () { return DD.concluidas(); }, drillTitle: 'Concluídas na janela',
        info: { title: 'Concluídas na janela', formula: 'ocorrências com status = concluída dentro da janela', dados: 'ocorrências: override de status', numeros: t.concluidas + ' concluída(s)' } }
    ];
  }

  /* ---------- KPIs secundários (pequenos) ---------- */
  function scoreKPIs(m) {
    var t = m.totais;
    var pessoas = m.carga.filter(function (c) { return c.nome !== '(sem responsável)'; }).length;
    var cargaMedia = pessoas ? (Math.round(t.abertas / pessoas * 10) / 10) : null;
    var cargaStr = cargaMedia == null ? '—' : String(cargaMedia).replace('.', ',');
    return [
      { label: 'Previstas até hoje', value: String(t.previstasAteHoje), tone: 'muted2',
        drill: function () { return DD.previstas(); },
        info: { title: 'Previstas até hoje', formula: 'ocorrências da janela com data ≤ hoje, menos as puladas', dados: 'ocorrências da janela', numeros: t.previstasAteHoje + ' previstas' } },
      { label: 'Aging médio', value: t.atrasadas ? fmtDias(m.agingMedio) : '—', tone: t.atrasadas ? 'amber' : 'green',
        drill: function () { return DD.atrasadas(); }, drillTitle: 'Atrasadas por idade — mais antigas primeiro',
        info: { title: 'Aging médio das atrasadas', formula: 'média de (hoje − data efetiva) das atrasadas', dados: 'atrasadas: data efetiva', numeros: t.atrasadas ? ('soma de dias ÷ ' + t.atrasadas + ' = ' + fmtDias(m.agingMedio)) : 'sem atrasadas' } },
      { label: 'Reprogramação', value: m.reprogPct + '%', tone: m.reprogPct > 20 ? 'orange' : 'green',
        drill: function () { return DD.reprogramadas(); },
        info: { title: 'Evasão de prazo (reprogramação)', formula: 'reprogramadas ÷ total de ocorrências × 100', dados: 'ocorrências: status reprogramada', numeros: t.reprogramadas + ' ÷ ' + t.ocorrencias + ' = ' + m.reprogPct + '%' } },
      { label: 'Puladas', value: String(t.puladas), tone: t.puladas ? 'amber' : 'green',
        drill: function () { return DD.puladas(); },
        info: { title: 'Ocorrências puladas', formula: 'ocorrências com status = pulada', dados: 'ocorrências: override de status', numeros: t.puladas + ' pulada(s)' } },
      { label: 'Sem responsável', value: String(t.semResp), tone: t.semResp ? 'red' : 'green',
        drill: function () { return DD.semResp(); }, drillTitle: 'Abertas sem responsável',
        info: { title: 'Abertas sem responsável', formula: 'ocorrências abertas cujo responsável está vazio', dados: 'atividade: responsavelNome', numeros: t.semResp + ' sem responsável' } },
      { label: 'Carga média / pessoa', value: cargaStr, tone: 'muted2',
        drill: function () { return DD.abertas(); }, drillTitle: 'Abertas (carga) — todas as pessoas',
        info: { title: 'Carga média por pessoa', formula: 'abertas ÷ nº de responsáveis com carga', dados: 'abertas + responsáveis distintos', numeros: pessoas ? (t.abertas + ' ÷ ' + pessoas + ' = ' + cargaStr) : 'sem responsáveis' } }
    ];
  }

  /* ---------- gráficos ---------- */
  function aderCor(v) { return v == null ? 'var(--muted2)' : v >= 90 ? 'var(--green)' : v >= 80 ? 'var(--amber)' : 'var(--red)'; }
  function chartAderencia(m) {
    /* F1-D(e): barra só de quem JÁ TEM rotina vencida — partida fria não pinta 0% vermelho */
    var itens = m.porSetor.filter(function (s) { return s.prevVencidas > 0; }).map(function (s) {
      return { l: KPI.nomeSetor(s.sig, m.setores), v: s.aderencia == null ? 0 : s.aderencia, c: aderCor(s.aderencia) };
    });
    var body = itens.length
      ? barsH(itens, { max: 100, suffix: '%', meta: 90, metaLabel: 'meta 90%', rowClass: 'pf-ader-row' })
      : el('<div class="pf-empty2">Nada venceu ainda — a aderência aparece quando a primeira rotina vencer.</div>');
    return chartCard('Aderência por setor',
      { title: 'Aderência por setor', formula: 'concluídas ÷ previstas × 100, por setor (até hoje)', dados: 'ocorrências agrupadas por setor (multi-setor conta em cada um)', numeros: 'linha = meta 90%; ordem: pior para melhor' },
      body, 'pf-aderencia');
  }
  function chartAging(m) {
    var f = m.faixasAging;
    var itens = [
      { l: '0–3d', v: f.f03, c: 'var(--green)' }, { l: '4–7d', v: f.f47, c: 'var(--amber)' },
      { l: '8–15d', v: f.f815, c: 'var(--orange)' }, { l: '15+d', v: f.f15, c: 'var(--red)' }
    ];
    var max = Math.max(1, f.f03, f.f47, f.f815, f.f15);
    return chartCard('Envelhecimento (aging)',
      { title: 'Envelhecimento das atrasadas', formula: 'atrasadas agrupadas por faixa de dias de atraso', dados: 'atrasadas: hoje − data efetiva', numeros: '0–3d: ' + f.f03 + ' · 4–7d: ' + f.f47 + ' · 8–15d: ' + f.f815 + ' · 15+d: ' + f.f15 },
      barsV(itens, { max: max }), 'pf-aging');
  }
  function chartThroughput(m) {
    var t = m.throughput.slice(-8);
    if (!t.length) {
      return chartCard('Throughput semanal',
        { title: 'Throughput semanal', formula: 'concluídas por semana (segunda a domingo)', dados: 'concluídas: data efetiva ≤ hoje', numeros: 'sem conclusões na janela' },
        el('<div class="pf-empty2">Sem conclusões na janela.</div>'), 'pf-throughput');
    }
    var max = Math.max.apply(null, t.map(function (x) { return x.n; }).concat([1]));
    var itens = t.map(function (x, i, a) { return { l: rotuloSemana(x.semana), v: x.n, c: (i === a.length - 1) ? 'var(--brand)' : 'var(--muted2)' }; });
    return chartCard('Throughput semanal',
      { title: 'Throughput semanal', formula: 'nº de concluídas por semana', dados: 'concluídas agrupadas pela segunda-feira da semana', numeros: 'últimas ' + t.length + ' semana(s); a última é destacada' },
      barsV(itens, { max: max }), 'pf-throughput');
  }
  function chartCarga(m) {
    /* F1-D(f): '(sem responsável)' NÃO entra no gráfico de pessoas — vira o
       card "Backlog sem dono" (acionável). Aqui só gente real. */
    var reais = m.carga.filter(function (x) { return x.nome !== '(sem responsável)'; });
    var top = reais.slice(0, 8);
    if (!top.length) {
      return chartCard('Carga por responsável',
        { title: 'Carga por responsável', formula: 'abertas por pessoa (sem contar o backlog sem dono)', dados: 'abertas: pendente + em andamento + reprogramada', numeros: 'nenhuma pessoa com carga' },
        el('<div class="pf-empty2">Nenhuma pessoa com carga atribuída.</div>'), 'pf-carga');
    }
    var vals = reais.map(function (x) { return x.n; }).sort(function (a, b) { return a - b; });
    var mediana = vals[Math.floor(vals.length / 2)] || 0;
    var cap = Math.max(1, Math.round(mediana * 1.5));
    var max = Math.max.apply(null, top.map(function (x) { return x.n; }).concat([cap]));
    var itens = top.map(function (x) { return { l: x.nome, v: x.n, c: x.n > cap ? 'var(--amber)' : 'var(--green)' }; });
    return chartCard('Carga por responsável',
      { title: 'Carga por responsável (WIP)', formula: 'nº de abertas por pessoa', dados: 'abertas por responsável', numeros: 'linha = 1,5× a mediana (' + cap + '); acima = sobrecarga' },
      barsH(itens, { max: max, meta: cap / max * 100, metaLabel: '1,5× mediana' }), 'pf-carga');
  }

  /* ---------- N2: score composto por setor (pesos 50/30/20) ---------- */
  function tomToken(t) { return t === 'ok' ? 'green' : t === 'warn' ? 'amber' : 'red'; }
  function sigAtiva(sig, setores) {
    var s = (setores || []).filter(function (x) { return x.sigla === sig; })[0];
    return !!(s && s.ativo);
  }
  function setoresParaScore(m) {
    /* F1-D: mensurável = sigla ATIVA no cadastro + previstas VENCIDAS > 0
       (só o que já devia ter acontecido pode ser cobrado — partida fria
       não entra no score; evita 0% falso no dia 1). */
    return m.porSetor.filter(function (s) { return s.sig !== '—' && sigAtiva(s.sig, m.setores) && s.prevVencidas > 0; }).map(function (s) {
      return { sigla: s.sig, ader: s.aderencia == null ? 0 : s.aderencia, atrasadas: s.atrasadas, agingMedio: s.agingMedio || 0, carga: s.carga || 0 };
    });
  }
  function setoresColetando(m) {
    /* ativos com atividade na janela mas NADA vencido ainda → "coletando" (neutro) */
    return m.porSetor.filter(function (s) { return s.sig !== '—' && sigAtiva(s.sig, m.setores) && (s.previstas + (s.carga || 0)) > 0 && s.prevVencidas === 0; });
  }
  function setoresOrfaos(m) {
    /* siglas desativadas/inexistentes ainda apontadas por atividades */
    var tot = 0, sigs = [];
    m.porSetor.forEach(function (s) {
      if (s.sig === '—' || sigAtiva(s.sig, m.setores)) { return; }
      tot += (s.previstas || 0) + (s.carga || 0);
      sigs.push(s.sig);
    });
    return { total: tot, sigs: sigs };
  }
  function scoreSetores(m) {
    var base = setoresParaScore(m);
    var colet = setoresColetando(m);
    var orfa = setoresOrfaos(m);
    if (!base.length && !colet.length && !orfa.sigs.length) { return null; }
    var calc = base.map(function (s) {
      var pctAtr = s.carga ? Math.round(s.atrasadas / s.carga * 100) : 0;
      return { sigla: s.sigla, sc: KPI._score(s.ader, pctAtr, s.agingMedio) };
    }).sort(function (a, b) { return a.sc.score - b.sc.score; }); /* pior primeiro = onde agir */
    var nums = calc.map(function (x) { return x.sigla + ': A' + x.sc.compA + ' B' + x.sc.compB + ' C' + x.sc.compC + ' → ' + x.sc.score; }).join(' · ');
    var card = el('<div class="pf-card" style="margin-bottom:13px"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Score por setor (0–100)</div>'));
    h.appendChild(infoBtn({
      title: 'Score composto por setor',
      formula: 'score = 0,5×A + 0,3×B + 0,2×C. A = aderência% (peso 50) · B = 100 − %atrasadas (atrasadas ÷ abertas do setor; peso 30) · C = 100 − aging×12,5 (0d=100 · 4d=50 · 8d+=0; peso 20). Semáforo: ≥80 verde · 60–79 âmbar · <60 vermelho.',
      dados: 'ocorrências por setor até hoje (aderência, atrasadas, aging) + abertas por setor (carga). Multi-setor conta em cada área.',
      numeros: nums
    }));
    card.appendChild(h);
    var list = el('<div></div>');
    calc.forEach(function (x) {
      var tok = tomToken(x.sc.tom);
      var row = el('<div class="pf-ss-row dd-click"></div>');
      row.title = 'Clique para ver as ocorrências do setor';
      (function (sig) {                     /* C4: drill do setor */
        row.addEventListener('click', function () {
          abrirDrill('Setor ' + KPI.nomeSetor(sig, m.setores) + ' — ocorrências da janela (atrasadas primeiro)', DD.setor(sig));
        });
      })(x.sigla);
      row.appendChild(el('<span class="pf-ss-dot" style="background:var(--' + tok + ');box-shadow:0 0 0 3px var(--' + haloOf(tok) + ')"></span>'));
      var nome = el('<span class="pf-ss-nome"></span>');
      nome.textContent = KPI.nomeSetor(x.sigla, m.setores);
      nome.title = x.sigla;
      row.appendChild(nome);
      var tr = el('<div class="pf-ss-track"></div>');
      tr.appendChild(el('<div class="pf-ss-fill" style="width:' + x.sc.score + '%;background:var(--' + tok + ')"></div>'));
      row.appendChild(tr);
      row.appendChild(el('<span class="pf-ss-num" style="color:var(--' + tok + ')">' + x.sc.score + '</span>'));
      list.appendChild(row);
    });
    /* F1-D(e): setores em partida — tom NEUTRO, nunca vermelho */
    colet.forEach(function (s) {
      var row = el('<div class="pf-ss-row pf-colet-row"></div>');
      row.appendChild(el('<span class="pf-ss-dot" style="background:var(--muted2)"></span>'));
      var nome = el('<span class="pf-ss-nome"></span>');
      nome.textContent = KPI.nomeSetor(s.sig, m.setores);
      nome.title = s.sig;
      row.appendChild(nome);
      row.appendChild(el('<span class="pf-ss-track"></span>'));
      row.appendChild(el('<span class="pf-colet-tag">— coletando</span>'));
      list.appendChild(row);
    });
    card.appendChild(list);
    /* F1-D(g): siglas desativadas/inexistentes — fora do score, com ação */
    if (orfa.sigs.length) {
      var of = el('<div class="pf-orfa"></div>');
      of.textContent = '(setor desativado — reatribuir): ' + orfa.total + ' ocorrência(s) em ' + orfa.sigs.join(', ') + '. Reatribua o setor dessas atividades na tela Atividades.';
      card.appendChild(of);
    }
    return card;
  }

  /* ---------- F1-D(f): card de backlog sem dono (acionável) ---------- */
  function backlogCard(m) {
    var t = m.totais;
    if (!t.semResp && !t.ativSemResp) { return null; }
    var card = el('<div class="pf-backlog"></div>');
    card.appendChild(el('<div class="pf-backlog-n">' + t.semResp + '</div>'));
    var mid = el('<div></div>');
    mid.appendChild(el('<div class="pf-backlog-t">Backlog sem dono: ' + t.semResp + ' ocorrência(s) · ' + t.ativSemResp + ' atividade(s)</div>'));
    mid.appendChild(el('<div class="pf-backlog-s">Rotina sem responsável não é cobrada de ninguém. Atribua os responsáveis para os números valerem.</div>'));
    card.appendChild(mid);
    card.appendChild(el('<a href="atividades.html">Atribuir na tela Atividades →</a>'));
    return card;
  }

  /* ---------- F1-D(e): banner de partida (medição nasce do uso) ---------- */
  function bannerPartida(m) {
    if (m.totais.previstasVencidas > 0 || !m.totais.ocorrencias) { return null; }
    var dtStr = '';
    if (DATA_OPER_MIN) { dtStr = ' Início da operação: <b>' + DATA_OPER_MIN.slice(8, 10) + '/' + DATA_OPER_MIN.slice(5, 7) + '</b>.'; }
    return el('<div class="pf-banner">Medição em partida — os indicadores nascem do uso: cada número começa a contar quando a primeira rotina vence.' + dtStr + ' Volte amanhã para ver o primeiro número — nada aqui é ruim ainda; é cedo.</div>');
  }

  /* ---------- plano de ação (priorização) ---------- */
  function planoAcao(m) {
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Plano de ação — o que atacar primeiro</div>'));
    h.appendChild(infoBtn({ title: 'Plano de ação', formula: 'priorização por impacto: gargalos do detector (aderência < 80% OU atrasadas + aging ≥ 4d + carga > 1,5×mediana), setores com mais atrasadas, pessoas sobrecarregadas e itens sem dono', dados: 'derivado dos indicadores acima', numeros: 'gargalos primeiro, depois pelo nº de atrasadas' }));
    card.appendChild(h);
    var list = el('<div class="pf-plano"></div>');
    var itens = [];
    /* N2: gargalos NOMEADOS do detector validado (regra explícita no "i").
       M2: quando a MESMA(S) atividade(s) multi-setor atrasada(s) explica(m)
       o gargalo de N setores, agrupa num item só (menos ruído). Regra:
       setores cujas atrasadas são TODAS multi-setor e idênticas entre si. */
    var gargalos = KPI._gargalos(setoresParaScore(m));
    var siglasGargalo = {};                       /* M1: setores já cobertos */
    var atrPorSig = {};                           /* sigla -> ids de atividades atrasadas + flag só-multi */
    BOARD.forEach(function (o) {
      if (!o.atrasada) { return; }
      var sigs = KPI.setoresDe(o.act, m.setores); if (!sigs.length) { sigs = ['—']; }
      var multi = sigs.length > 1;
      sigs.forEach(function (sig) {
        var b = atrPorSig[sig] || (atrPorSig[sig] = { ids: {}, soMulti: true });
        b.ids[o.act.id] = true;
        if (!multi) { b.soMulti = false; }
      });
    });
    function chaveIds(sig) {
      var b = atrPorSig[sig];
      if (!b || !b.soMulti) { return null; }
      var ids = Object.keys(b.ids).sort();
      return ids.length ? ids.join('|') : null;
    }
    var grupos = {}; var soltos = [];
    gargalos.forEach(function (g) {
      siglasGargalo[g.sigla] = true;
      var k = chaveIds(g.sigla);
      if (k) { (grupos[k] = grupos[k] || []).push(g); } else { soltos.push(g); }
    });
    Object.keys(grupos).forEach(function (k) {
      var gs = grupos[k];
      if (gs.length >= 2) {
        var nAtiv = k.split('|').length;
        itens.push({ sev: 'red',
          txt: nAtiv + ' atividade(s) multi-setor atrasada(s) afeta(m) ' + gs.length + ' setores (' +
            gs.map(function (g) { return g.sigla; }).join(', ') + ')',
          act: 'Resolver a atividade multi-setor destrava todos os setores de uma vez.',
          pl: { tipo: 'gargalo', chave: 'multi-setor', setorSigla: gs[0].sigla, atividadeIds: k.split('|') } });
      } else {
        soltos.push(gs[0]);
      }
    });
    soltos.forEach(function (g) {
      itens.push({ sev: 'red', txt: 'Gargalo: ' + g.sigla + ' — ' + g.motivo,
        act: 'Levar à reunião de líderes: causa raiz e replanejamento do setor.',
        pl: { tipo: 'gargalo', chave: g.motivo, setorSigla: g.sigla } });
    });
    m.porSetor.forEach(function (s) {
      if (s.atrasadas > 0 && !siglasGargalo[s.sig]) { /* M1: gargalo não repete como atrasadas */
        itens.push({ sev: s.atrasadas >= 5 ? 'red' : 'amber',
          txt: KPI.nomeSetor(s.sig, m.setores) + ': ' + s.atrasadas + ' atrasada(s) · aderência ' + (s.aderencia == null ? '—' : s.aderencia + '%'),
          act: 'Repriorizar e redistribuir as vencidas mais antigas primeiro.',
          pl: { tipo: 'setor_atrasadas', chave: s.sig, setorSigla: s.sig } });
      }
    });
    /* F1-D(f): a mediana da régua sai só de PESSOAS REAIS — o backlog sem dono
       (milhares de ocorrências) distorceria o corte de sobrecarga. */
    var vals = m.carga.filter(function (x) { return x.nome !== '(sem responsável)'; }).map(function (x) { return x.n; }).sort(function (a, b) { return a - b; });
    var mediana = vals[Math.floor(vals.length / 2)] || 0; var cap = Math.max(1, Math.round(mediana * 1.5));
    m.carga.forEach(function (c) {
      if (c.nome !== '(sem responsável)' && c.n > cap) {
        itens.push({ sev: 'amber', txt: c.nome + ': ' + c.n + ' abertas (acima de 1,5× a mediana)', act: 'Aliviar a carga ou renegociar prazos.',
          pl: { tipo: 'sobrecarga', chave: c.nome, setorSigla: null } });
      }
    });
    if (m.totais.semResp > 0) {
      itens.push({ sev: 'red', txt: m.totais.semResp + ' ocorrência(s) aberta(s) sem responsável', act: 'Atribuir um dono para não cair no vazio.',
        pl: { tipo: 'sem_dono', chave: 'backlog', setorSigla: null } });
    }
    if (!itens.length) {
      list.appendChild(el('<div class="pf-plano-ok">Sem alertas: rotina em dia. 🎯</div>'));
    } else {
      itens.forEach(function (it) {
        var row = el('<div class="pf-plano-item"></div>');
        row.appendChild(el('<span class="pf-plano-dot" style="background:var(--' + it.sev + ')"></span>'));
        var cc = el('<div class="pf-plano-c"></div>');
        var t1 = el('<div class="pf-plano-txt"></div>'); t1.textContent = it.txt; cc.appendChild(t1);
        var t2 = el('<div class="pf-plano-act"></div>'); t2.textContent = it.act; cc.appendChild(t2);
        row.appendChild(cc);
        /* F1-G: AÇÃO OBRIGATÓRIA vira PLANO VIVO com 1 clique (dono +
           prazo + atividades). Padrão Jira/Easy Agile: o insight da
           retro/indicador vira item rastreável do backlog — 2/3 dos
           times implementam <25% do que decidem quando não há sistema. */
        row.appendChild(UI.button({ label: 'Criar plano', variant: 'ghost', onClick: function () { abrirCriarPlano(it); } }));
        list.appendChild(row);
      });
    }
    card.appendChild(list);
    return card;
  }

  /* ============================================================
     F1-H · LENTE DE RISCO DINÂMICO (P1-Risco). Zero tela nova,
     zero coleção nova, zero write: só leitura do MESMO board.
     score = prioridade(PEF) × fatorAging × fatorReprog
     (KPI.riscoAtividades, validado no harness_f1h.js).
     Mitigação: SOMENTE a importada do PEF (act.mitigacao).
     ============================================================ */
  function lenteRisco(m) {
    var riscos = KPI.riscoAtividades(BOARD, HOJE);
    if (!riscos.length) { return null; }
    var TETO_LINHAS = 10;
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Matriz de risco dinâmica — prioridade × comportamento</div>'));
    /* F1-J: tendência REAL dos Críticos via fotos diárias (menor = melhor) */
    var nCrit = riscos.filter(function (r) { return r.faixa === 'critico'; }).length;
    if (PERIODO === 'band' && KPI._trend) {
      var tR = KPI._trend(SNAPSHOTS, 'riscoCriticos', HOJE);
      if (tR && tR.suficiente) {
        var dfR = KPI._deltaFmt(tR.delta7, true);
        var corR = dfR.tom === 'ok' ? 'green' : dfR.tom === 'bad' ? 'red' : 'muted2';
        var chipR = el('<span class="pf-colet" style="color:var(--' + corR + ')"></span>');
        chipR.textContent = 'Críticos ' + nCrit + ' · Δ7d ' + dfR.texto;
        chipR.title = 'Variação do nº de atividades CRÍTICAS vs 7 dias atrás (fotos diárias). Menor é melhor.';
        h.appendChild(chipR);
      }
    }
    h.appendChild(infoBtn({
      title: 'Risco dinâmico por atividade',
      formula: 'score = pesoPrioridade × fatorAging × fatorReprog. Peso: P1=5 · P2=4 · P3=3 · P4=2 · P5=1 (sem prioridade = 3). fatorAging (maior atraso da atividade na janela): 0d=1,0 · 1–3d=1,2 · 4–7d=1,5 · 8–15d=2,0 · 15+d=3,0. fatorReprog = 1 + 0,5 × reprogramadas (teto 3,0). Faixas: ≥15 Crítico · ≥7,5 Em risco · <7,5 Observação.',
      dados: 'prioridade e mitigação importadas do PEF (planilha-modelo) + ocorrências da janela (atrasadas e reprogramadas). Só entram atividades com sinal dinâmico: atraso > 0 OU reprogramação > 0.',
      numeros: riscos.length + ' atividade(s) com sinal · exibindo até ' + TETO_LINHAS + ' · maior score: ' + riscos[0].score
    }));
    card.appendChild(h);
    var list = el('<div class="pf-plano"></div>');
    riscos.slice(0, TETO_LINHAS).forEach(function (r) {
      var tok = r.faixa === 'critico' ? 'red' : r.faixa === 'em_risco' ? 'orange' : 'amber';
      var rot = r.faixa === 'critico' ? 'Crítico' : r.faixa === 'em_risco' ? 'Em risco' : 'Observação';
      var row = el('<div class="pf-plano-item dd-click"></div>');
      row.title = 'Clique para ver as ocorrências desta atividade';
      (function (id, tit) {
        row.addEventListener('click', function () {
          abrirDrill('Risco · ' + tit + ' — ocorrências da janela (atrasadas primeiro)',
            BOARD.filter(function (o) { return o.act && o.act.id === id; })
              .sort(function (a, b) { return ((b.atrasada ? 1 : 0) - (a.atrasada ? 1 : 0)) || ddOrdData(a, b); }));
        });
      })(r.act.id, r.act.titulo || '(sem título)');
      row.appendChild(el('<span class="pf-plano-dot" style="background:var(--' + tok + ')"></span>'));
      var cc = el('<div class="pf-plano-c"></div>');
      var t1 = el('<div class="pf-plano-txt"></div>');
      t1.textContent = (r.act.titulo || '(sem título)') + (r.act.setorSigla ? ' · ' + r.act.setorSigla : '');
      cc.appendChild(t1);
      var t2 = el('<div class="pf-plano-act"></div>');
      t2.textContent = rot + ' · score ' + String(r.score).replace('.', ',') +
        ' = ' + (r.prio || 'P?') + '(' + r.peso + ') × aging ' + String(r.fatorAging).replace('.', ',') +
        (r.maxAtraso ? ' (' + r.maxAtraso + 'd)' : '') +
        ' × reprog ' + String(r.fatorReprog).replace('.', ',') + (r.reprog ? ' (' + r.reprog + '×)' : '');
      cc.appendChild(t2);
      var t3 = el('<div class="pf-plano-act"></div>');
      t3.textContent = r.mitigacao ? ('Mitigação (PEF): ' + r.mitigacao) : 'Sem mitigação cadastrada no PEF para esta rotina.';
      cc.appendChild(t3);
      row.appendChild(cc);
      list.appendChild(row);
    });
    card.appendChild(list);
    return card;
  }

  /* ---------- F1-H · Pareto das atrasadas por setor (80/20 · Juran) ---------- */
  function chartPareto(m) {
    var p = KPI.paretoAtrasadas(m.porSetor);
    if (!p) { return null; }
    var vitais = p.itens.filter(function (x) { return x.vital; });
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Pareto das atrasadas — 80/20 por setor</div>'));
    h.appendChild(infoBtn({
      title: 'Pareto das atrasadas por setor',
      formula: 'setores em ordem decrescente de atrasadas + % acumulado. "Vitais" = setores até (e incluindo) a barra em que o acumulado cruza 80% — é onde agir rende mais.',
      dados: 'as MESMAS atrasadas do painel, agrupadas por setor (multi-setor conta em cada área).',
      numeros: p.total + ' atrasada(s) no total · ' + vitais.map(function (x) { return x.sig + ' ' + x.atrasadas; }).join(' · ') + ' → acumulado ' + vitais[vitais.length - 1].acumPct + '%'
    }));
    card.appendChild(h);
    var list = el('<div></div>');
    var max = p.itens[0].atrasadas;
    p.itens.forEach(function (x) {
      var tok = x.vital ? 'red' : 'muted2';
      var row = el('<div class="pf-ss-row dd-click"></div>');
      row.title = 'Clique para ver as ocorrências do setor';
      (function (sig) {
        row.addEventListener('click', function () {
          abrirDrill('Setor ' + KPI.nomeSetor(sig, m.setores) + ' — ocorrências da janela (atrasadas primeiro)', DD.setor(sig));
        });
      })(x.sig);
      row.appendChild(el('<span class="pf-ss-dot" style="background:var(--' + tok + ')"></span>'));
      var nome = el('<span class="pf-ss-nome"></span>');
      nome.textContent = KPI.nomeSetor(x.sig, m.setores);
      nome.title = x.sig;
      row.appendChild(nome);
      var tr = el('<div class="pf-ss-track"></div>');
      tr.appendChild(el('<div class="pf-ss-fill" style="width:' + Math.round(x.atrasadas / max * 100) + '%;background:var(--' + tok + ')"></div>'));
      row.appendChild(tr);
      var num = el('<span class="pf-ss-num" style="color:var(--' + tok + ')"></span>');
      num.textContent = x.atrasadas + ' · Σ' + x.acumPct + '%';
      row.appendChild(num);
      list.appendChild(row);
    });
    card.appendChild(list);
    var rod = el('<div class="pf-plano-act" style="margin-top:8px"></div>');
    rod.textContent = 'Vitais (concentram ' + vitais[vitais.length - 1].acumPct + '% das atrasadas): ' +
      vitais.map(function (x) { return x.sig; }).join(', ') + '. Atacar estes primeiro rende mais que espalhar esforço.';
    card.appendChild(rod);
    return card;
  }

  /* ---------- render + estados + boot ---------- */
  var CTX_MONTADO = false;
  function montarCtx(m) {
    /* F1-D(j): seletor global de setor — só depois do 1º load (precisa das siglas reais) */
    if (CTX_MONTADO || !window.GrautCtx) { return; }
    var exp = document.getElementById('pf-export');
    if (!exp) { return; }
    var w = GrautCtx.mount(exp, { setores: m.setores, user: USER, rotuloTudo: 'Toda a escola', onChange: carregar });
    if (w) { exp.insertBefore(w, exp.firstChild); }
    CTX_MONTADO = true;
  }

  /* ---------- F1-F · candidatos a indicador (fila da cascata) ----------
     Fonte: pauta_sugestoes com candidatoIndicador = true (marcado no
     formulário de pauta ou ao encaminhar decisão). Fila de ENTRADA do
     catálogo (KPIMAX): virar indicador de verdade exige fórmula + dado +
     decisão que dispara — trabalho de sessão (F1-G), não automático.
     Query própria: where ativo==true + limit 100; filtro fino no cliente
     (padrão §2.6 — evita índice composto). Recarrega a cada pintura. */
  var CAND_TOKEN = 0;
  function candidatosIndicador() {
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Candidatos a indicador — vindos das reuniões</div>'));
    h.appendChild(infoBtn({
      title: 'Candidatos a indicador',
      formula: 'lista de pauta_sugestoes com candidatoIndicador = true (marcado no formulário de pauta ou ao encaminhar uma decisão)',
      dados: 'coleção pauta_sugestoes · where ativo == true · limit 100 · filtro candidatoIndicador no navegador',
      numeros: 'cada item mostra o texto, a reunião de origem e a data de registro, do mais novo p/ o mais velho',
      nota: 'Fila de entrada do catálogo: virar indicador exige fórmula + dado + decisão que dispara (próxima fase) — nada vira KPI sozinho.'
    }));
    card.appendChild(h);
    var list = el('<div class="pf-plano"></div>');
    list.appendChild(el('<div class="pf-plano-act">Carregando…</div>'));
    card.appendChild(list);
    var meu = ++CAND_TOKEN;
    Promise.all([
      import('./firebase.js'),
      import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
    ]).then(function (mods) {
      var db = mods[0].db, f = mods[1];
      var q = f.query(f.collection(db, 'pauta_sugestoes'), f.where('ativo', '==', true), f.limit(100));
      return f.getDocs(q);
    }).then(function (snap) {
      if (meu !== CAND_TOKEN) { return; }
      var itens = [];
      snap.forEach(function (d) {
        var g = d.data();
        if (g && g.candidatoIndicador === true) { itens.push(g); }
      });
      itens.sort(function (a, b) { return (b.criadoEm || 0) - (a.criadoEm || 0); });
      list.innerHTML = '';
      if (!itens.length) {
        list.appendChild(el('<div class="pf-plano-act">Nenhum candidato ainda — marque "candidato a indicador" no formulário de pauta ou ao encaminhar uma decisão.</div>'));
        return;
      }
      itens.forEach(function (g) {
        var item = el('<div class="pf-plano-item"></div>');
        item.appendChild(el('<span class="pf-plano-dot" style="background:var(--doing)"></span>'));
        var c = el('<div class="pf-plano-c"></div>');
        var t = el('<div class="pf-plano-txt"></div>');
        t.textContent = g.texto || '(sem texto)';
        c.appendChild(t);
        var org = g.origem || {};
        var a = el('<div class="pf-plano-act"></div>');
        var quando = g.criadoEm ? brData(window.GrautRecorrencia.toISO(new Date(Number(g.criadoEm)))) : '—';
        a.textContent = 'Origem: ' + (org.titulo ? org.titulo + ' · ' : '') + (org.data ? brData(org.data) : '—') + ' · registrado em ' + quando;
        c.appendChild(a);
        item.appendChild(c);
        list.appendChild(item);
      });
    }).catch(function (e) {
      if (meu !== CAND_TOKEN) { return; }
      list.innerHTML = '';
      list.appendChild(el('<div class="pf-plano-act">Não consegui ler os candidatos agora (' + ((e && e.message) || 'erro') + ').</div>'));
    });
    return card;
  }

  /* ============================================================
     F1-G · PLANOS DE AÇÃO VIVOS. Plano APONTA para atividades
     (atividadeIds[]) — a execução vive no motor de atividades;
     status e % são SEMPRE derivados (KPI.pctPlano/statusPlano,
     validados no harness_f1g.js). Soft-delete: ativo:false.
     ============================================================ */
  var _fbi = null;
  function fbi() {
    if (!_fbi) {
      _fbi = Promise.all([
        import('./firebase.js'),
        import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
      ]).then(function (m) { return { db: m[0].db, f: m[1] }; });
    }
    return _fbi;
  }
  function logPlano(acao, refId, antes, depois) {
    return fbi().then(function (c) {
      return c.f.addDoc(c.f.collection(c.db, 'atividade_log'), {
        ts: Date.now(), uid: (USER && USER.uid) || null, acao: acao, entidade: 'plano_acao',
        refId: refId || null, antes: antes || null, depois: depois || null
      });
    }).catch(function () {});
  }
  function abrirCriarPlano(it) {
    var pl = it.pl || {};
    var titInp = UI.input({ value: it.txt || '', maxlength: 140, placeholder: 'Ex: Zerar as vencidas do PED' });
    var titField = UI.field({ label: 'Título do plano', required: true, control: titInp });
    var prazoInp = el('<input type="date" class="pf-date">');
    var prazoField = UI.field({ label: 'Prazo', required: true, control: prazoInp, hint: 'Data-limite para o plano fechar.' });
    var donoHold = el('<div></div>'); donoHold.appendChild(el('<div class="pf-plano-act">Carregando pessoas…</div>'));
    var donoField = UI.field({ label: 'Dono', required: true, control: donoHold, hint: 'Quem responde pelo plano na reunião.' });
    var donoSel = null;
    /* atividades vinculadas (>=1): a execução do plano SÃO as atividades */
    var filtroInp = UI.input({ placeholder: 'Filtrar por título…' });
    var listHold = el('<div class="pf-catlist"></div>');
    var marcadas = {};
    if (pl.atividadeIds) { pl.atividadeIds.forEach(function (id) { marcadas[id] = true; }); }
    function pintaAtiv() {
      listHold.innerHTML = '';
      var termo = (filtroInp.value || '').toLowerCase();
      var base = ATIV.filter(function (a) {
        if (pl.setorSigla) {
          var sigs = KPI.setoresDe(a, MODELO ? MODELO.setores : []);
          if (sigs.indexOf(pl.setorSigla) < 0) { return false; }
        }
        return !termo || (a.titulo || '').toLowerCase().indexOf(termo) >= 0;
      }).slice(0, 60);
      if (!base.length) { listHold.appendChild(el('<div class="pf-plano-act">Nenhuma atividade neste filtro.</div>')); return; }
      base.forEach(function (a) {
        var row = el('<label class="pf-catrow"></label>');
        var ck = el('<input type="checkbox">');
        ck.checked = !!marcadas[a.id];
        ck.addEventListener('change', function () { marcadas[a.id] = ck.checked; });
        row.appendChild(ck);
        var tx = el('<span class="pf-catt"></span>'); tx.textContent = a.titulo + (a.setorSigla ? ' · ' + a.setorSigla : '');
        row.appendChild(tx);
        listHold.appendChild(row);
      });
    }
    filtroInp.addEventListener('input', pintaAtiv);
    pintaAtiv();
    var ativField = UI.field({ label: 'Atividades do plano (mínimo 1)', required: true, control: el('<div></div>'),
      hint: pl.setorSigla ? 'Mostrando as atividades de ' + pl.setorSigla + '.' : 'A execução do plano vive nas atividades — o % vem delas.' });
    ativField.appendChild(filtroInp); ativField.appendChild(listHold);
    var banner = el('<div class="pf-banner" style="display:none"></div>');
    var saveBtn = null;
    var m2 = UI.modal({
      title: 'Criar plano de ação', width: 560,
      body: [titField, donoField, prazoField, ativField, banner],
      footer: function (close) {
        var c = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
        saveBtn = UI.button({ label: 'Criar plano', icon: 'check', onClick: salvar });
        return [c, saveBtn];
      }
    });
    /* pessoas: usuarios ativos (gestor/líder podem listar pelas regras) */
    fbi().then(function (c) {
      var q = c.f.query(c.f.collection(c.db, 'usuarios'), c.f.where('ativo', '==', true), c.f.limit(300));
      return c.f.getDocs(q);
    }).then(function (s) {
      var opts = [];
      s.forEach(function (d) { var u = d.data(); opts.push({ value: d.id, label: (u.nome || d.id) + (u.perfil ? ' · ' + u.perfil : '') }); });
      opts.sort(function (a, b) { return a.label < b.label ? -1 : 1; });
      donoHold.innerHTML = '';
      donoSel = UI.select({ value: (USER && USER.uid) || '', placeholder: '— Escolha o dono —', options: opts });
      donoHold.appendChild(donoSel);
    }).catch(function (e) {
      donoHold.innerHTML = '';
      donoHold.appendChild(el('<div class="pf-plano-act">Não consegui listar as pessoas (' + ((e && e.message) || 'erro') + ').</div>'));
    });
    function erro(msg) { banner.textContent = msg; banner.style.display = ''; }
    function salvar() {
      banner.style.display = 'none';
      var titulo = titInp.value.trim();
      var prazo = prazoInp.value;
      var ids = Object.keys(marcadas).filter(function (k) { return marcadas[k]; });
      if (!titulo) { erro('Dê um título ao plano.'); return; }
      if (!donoSel || !donoSel.value) { erro('Escolha o dono.'); return; }
      if (!window.GrautRecorrencia.isISO(prazo)) { erro('Escolha o prazo.'); return; }
      if (!ids.length) { erro('Vincule ao menos 1 atividade — a execução do plano vive nelas.'); return; }
      var donoNome = '';
      if (donoSel.selectedIndex >= 0) { donoNome = (donoSel.options[donoSel.selectedIndex].text || '').split(' · ')[0]; }
      var doc = {
        titulo: titulo,
        origem: { tipo: pl.tipo || 'manual', chave: pl.chave || null, setorSigla: pl.setorSigla || null, textoAlerta: it.txt || null },
        donoUid: donoSel.value, donoNome: donoNome, prazo: prazo,
        atividadeIds: ids, ativo: true,
        criadoEm: Date.now(), criadoPorUid: (USER && USER.uid) || null
      };
      if (saveBtn) { saveBtn.disabled = true; }
      fbi().then(function (c) {
        return c.f.addDoc(c.f.collection(c.db, 'planos_acao'), doc);
      }).then(function (ref) {
        logPlano('criar_plano', ref.id, null, doc);
        m2.close(); carregar();
      }).catch(function (e) {
        if (saveBtn) { saveBtn.disabled = false; }
        erro((e && e.message) || 'Não consegui gravar o plano.');
      });
    }
  }

  var PLANO_TOKEN = 0;
  function planosVivos(m) {
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Planos de ação vivos</div>'));
    h.appendChild(infoBtn({
      title: 'Planos de ação vivos',
      formula: '% do plano = média, entre as atividades vinculadas COM previstas, de (concluídas ÷ previstas até hoje) das ocorrências da janela. Status derivado (nunca gravado): Concluído (100%) · Vencido (prazo < hoje) · Em risco (faltam ≤ 5 dias e < 70%) · No prazo · Coletando (sem previstas ainda). Atividade sem ocorrência na janela fica fora do % e é sinalizada.',
      dados: 'coleção planos_acao (ativo = true) + as MESMAS ocorrências do board desta tela',
      numeros: 'janela ' + (m && m.janela ? m.janela.jIni + ' a ' + m.janela.jFim : '—')
    }));
    card.appendChild(h);
    var list = el('<div class="pf-plano"></div>');
    list.appendChild(el('<div class="pf-plano-act">Carregando…</div>'));
    card.appendChild(list);
    var meu = ++PLANO_TOKEN;
    fbi().then(function (c) {
      var q = c.f.query(c.f.collection(c.db, 'planos_acao'), c.f.where('ativo', '==', true), c.f.limit(100));
      return c.f.getDocs(q);
    }).then(function (snap) {
      if (meu !== PLANO_TOKEN) { return; }
      var planos = [];
      snap.forEach(function (d) { planos.push(Object.assign({ id: d.id }, d.data())); });
      planos.sort(function (a, b) { return (a.prazo || '9999') < (b.prazo || '9999') ? -1 : 1; });
      list.innerHTML = '';
      if (!planos.length) {
        list.appendChild(el('<div class="pf-plano-act">Nenhum plano vivo. Crie a partir de um alerta do Plano de ação acima — indicador → plano → execução.</div>'));
        return;
      }
      planos.forEach(function (p) {
        var prog = KPI.pctPlano(p.atividadeIds, BOARD, HOJE);
        var st = KPI.statusPlano(p, prog.pct, HOJE);
        /* F1-I: escalonamento D-5/D-3/D-0 (spec travada) — só rótulo/cor, nunca bloqueia */
        var esc = KPI.escalonamentoPlano ? KPI.escalonamentoPlano(p, prog.pct, HOJE) : null;
        var tok = esc ? esc.tom : (st.tom === 'ok' ? 'green' : st.tom === 'warn' ? 'amber' : st.tom === 'bad' ? 'red' : 'muted2');
        var row = el('<div class="pf-plano-item"></div>');
        row.appendChild(el('<span class="pf-plano-dot" style="background:var(--' + tok + ')"></span>'));
        var cc = el('<div class="pf-plano-c"></div>');
        var t1 = el('<div class="pf-plano-txt"></div>');
        t1.textContent = p.titulo + ' — ' + st.rotulo + (prog.pct == null ? '' : ' · ' + prog.pct + '%') + (esc ? ' · ⚠ ' + esc.rotulo : '');
        cc.appendChild(t1);
        var t2 = el('<div class="pf-plano-act"></div>');
        t2.textContent = 'Dono: ' + (p.donoNome || '—') + ' · prazo ' + (p.prazo ? brData(p.prazo) : '—') +
          ' · ' + prog.comPrevistas + ' de ' + prog.total + ' atividade(s) medindo' +
          (prog.foraJanela ? ' · ' + prog.foraJanela + ' fora da janela' : '') +
          (p.origem && p.origem.setorSigla ? ' · origem: ' + p.origem.setorSigla : '');
        cc.appendChild(t2);
        row.appendChild(cc);
        row.appendChild(infoBtn({
          title: p.titulo,
          formula: 'status ' + st.rotulo + ' — regra no “i” do card',
          dados: 'atividades vinculadas: ' + (p.atividadeIds || []).length + ' · origem: ' + ((p.origem && p.origem.tipo) || 'manual') + ((p.origem && p.origem.textoAlerta) ? ' (' + p.origem.textoAlerta + ')' : ''),
          numeros: '% = ' + (prog.pct == null ? 'coletando' : prog.pct + '%') + ' sobre ' + prog.comPrevistas + ' atividade(s) com previstas'
        }));
        row.appendChild(UI.button({ label: 'Arquivar', variant: 'ghost', onClick: function () {
          UI.modal({
            title: 'Arquivar plano?', width: 420,
            body: [el('<div class="pf-plano-act">“' + p.titulo + '” sai da lista (soft-delete: ativo = false; nada é apagado, as atividades continuam).</div>')],
            footer: function (close) {
              return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
                UI.button({ label: 'Arquivar', icon: 'check', onClick: function () {
                  fbi().then(function (c) {
                    return c.f.updateDoc(c.f.doc(c.db, 'planos_acao', p.id), { ativo: false, atualizadoEm: Date.now() });
                  }).then(function () {
                    logPlano('arquivar_plano', p.id, { ativo: true }, { ativo: false });
                    close(); carregar();
                  }).catch(function (e) { alert((e && e.message) || 'Não consegui arquivar.'); });
                } })];
            }
          });
        } }));
        list.appendChild(row);
      });
    }).catch(function (e) {
      if (meu !== PLANO_TOKEN) { return; }
      list.innerHTML = '';
      list.appendChild(el('<div class="pf-plano-act">Não consegui ler os planos (' + ((e && e.message) || 'erro') + '). Publique as regras novas (planos_acao).</div>'));
    });
    return card;
  }

  function paint(m) {
    MODELO = m;
    montarCtx(m);
    document.getElementById('pf-stamp').textContent =
      'Janela: ' + rotuloPeriodo(m.periodo) + ' (' + brData(m.janela.jIni) + ' a ' + brData(m.janela.jFim) + ') · ' +
      m.totais.atividadesAtivas + ' atividades ativas · ' + m.totais.ocorrencias + ' ocorrências.';
    var body = document.getElementById('pf-body');
    body.innerHTML = '';
    /* F1-D(h): "abrir e saber o que fazer" — banner (se partida) → KPIs de foco →
       PLANO DE AÇÃO → score por setor → backlog sem dono → KPIs pequenos → gráficos.
       Só reordenação de blocos; zero lógica nova nos cálculos. */
    var bp = bannerPartida(m);
    if (bp) { body.appendChild(bp); }
    /* F1-I (Parmenter): a tela em 2 andares. DECIDIR AGORA = os 4 heróis +
       plano de ação + risco (o que exige ação hoje). ANALISAR = o resto,
       colapsável (estado por aparelho em localStorage). Só reordenação/
       agrupamento — zero mudança em qualquer cálculo. */
    function secHead(t, subEl) {
      var h2 = el('<div style="display:flex;align-items:center;gap:10px;margin:4px 0 10px"></div>');
      var tt = el('<div style="font-size:11px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;color:var(--muted2)"></div>');
      tt.textContent = t; h2.appendChild(tt);
      h2.appendChild(el('<div style="flex:1;height:1px;background:var(--border)"></div>'));
      if (subEl) { h2.appendChild(subEl); }
      return h2;
    }
    body.appendChild(secHead('Decidir agora'));
    var focus = el('<div class="pf-focus"></div>');
    focusKPIs(m).forEach(function (k) { focus.appendChild(kpiCard(k, true)); });
    body.appendChild(focus);
    body.appendChild(planoAcao(m));
    var lr = lenteRisco(m);                     /* F1-H: risco dinâmico como LENTE (P1-Risco) */
    if (lr) { lr.style.marginTop = '13px'; body.appendChild(lr); }

    var ANA_KEY = 'gera_intel_analisar';
    var anaAberto = true;
    try { anaAberto = localStorage.getItem(ANA_KEY) !== '0'; } catch (e0) { }
    var tg = el('<button type="button" style="font:inherit;font-size:11.5px;font-weight:800;color:var(--text);background:var(--s2);border:1px solid var(--border);border-radius:9px;padding:6px 12px;cursor:pointer"></button>');
    var secA = el('<div></div>');
    function pintaTg() {
      tg.textContent = anaAberto ? 'Recolher ▴' : 'Expandir ▾';
      secA.style.display = anaAberto ? '' : 'none';
    }
    tg.addEventListener('click', function () {
      anaAberto = !anaAberto;
      try { if (anaAberto) { localStorage.removeItem(ANA_KEY); } else { localStorage.setItem(ANA_KEY, '0'); } } catch (e1) { }
      pintaTg();
    });
    var hAna = secHead('Analisar', tg);
    hAna.style.marginTop = '18px';
    body.appendChild(hAna);
    body.appendChild(secA);

    secA.appendChild(planosVivos(m));           /* F1-G: fecha o ciclo indicador→plano→execução */
    var cand = candidatosIndicador();
    cand.style.marginTop = '13px';
    secA.appendChild(cand); /* F1-F */
    var ss = scoreSetores(m);
    if (ss) { ss.style.marginTop = '13px'; secA.appendChild(ss); }
    var bk = backlogCard(m);
    if (bk) { bk.style.marginTop = '13px'; secA.appendChild(bk); }
    var score = el('<div class="pf-score"></div>');
    score.style.marginTop = '13px';
    scoreKPIs(m).forEach(function (k) { score.appendChild(kpiCard(k, false)); });
    secA.appendChild(score);
    var row1 = el('<div class="pf-row1"></div>');
    row1.appendChild(chartAderencia(m)); row1.appendChild(chartAging(m));
    secA.appendChild(row1);
    var row2 = el('<div class="pf-row2"></div>');
    row2.appendChild(chartThroughput(m)); row2.appendChild(chartCarga(m));
    secA.appendChild(row2);
    var pa = chartPareto(m);                    /* F1-H: 80/20 das atrasadas (Juran) */
    if (pa) { pa.style.marginTop = '13px'; secA.appendChild(pa); }
    pintaTg();
  }

  /* ---------- N2: foto do dia (idempotente; falha nunca quebra o painel) ---------- */
  function gravarFotoDoDia(m) {
    if (SNAP_TENTADO || PERIODO !== 'band') { return; }             /* fotos SÓ da janela padrão (comparável dia a dia) */
    if (!USER || (USER.profile !== 'Admin' && USER.profile !== 'Editor')) { return; }
    SNAP_TENTADO = true;
    var ja = SNAPSHOTS.some(function (s) { return s.data === m.hoje; });
    if (ja) { return; }
    /* F1-J: contagens de risco entram na foto (Δ7d da lente) — derivadas na hora */
    try {
      var rr = KPI.riscoAtividades(BOARD, m.hoje);
      m.riscoCriticos = rr.filter(function (r) { return r.faixa === 'critico'; }).length;
      m.riscoEmRisco = rr.filter(function (r) { return r.faixa === 'em_risco'; }).length;
    } catch (eR) { m.riscoCriticos = null; m.riscoEmRisco = null; }
    KPI.gravarSnapshotHoje(m, USER.uid).then(function (res) {
      if (res && res.gravado) { SNAPSHOTS.push(KPI.snapshotDoc(m)); } /* cache local coerente p/ o resto da sessão */
    }).catch(function (e) {
      if (window.console && console.warn) { console.warn('[inteligencia] foto do dia não gravada (painel segue normal):', (e && e.message) || e); }
    });
  }

  function showState(title, sub) {
    var body = document.getElementById('pf-body'); body.innerHTML = '';
    var box = el('<div class="pf-state"></div>');
    var t = el('<div class="pf-state-t"></div>'); t.textContent = title; box.appendChild(t);
    if (sub) { var s = el('<div class="pf-state-s"></div>'); s.textContent = sub; box.appendChild(s); }
    body.appendChild(box);
  }

  function carregar() {
    /* F1-B: painel de gestão. Usuário não tem no menu; se chegar por URL, barra. */
    if (Guard.isUsuario && Guard.isUsuario()) {
      var stmp = document.getElementById('pf-stamp'); if (stmp) { stmp.textContent = 'Restrito.'; }
      showState('Sem conteúdo para o seu perfil', 'A Inteligência é um painel de gestão. Sua agenda está em Hoje e suas tarefas em Atividades.');
      return;
    }
    showState('Carregando indicadores…', 'Lendo as ocorrências da janela.');
    Promise.all([
      KPI.carregar(PERIODO).then(function (ctx) {
        ctx = KPI.recortarContexto(ctx, USER);
        /* F1-D(j): pré-filtro global de setor — mesmos números das outras telas */
        if (window.GrautCtx) {
          var cxSig = GrautCtx.sanear(GrautCtx.get(), ctx.setores, USER);
          if (cxSig) {
            ctx = { board: ctx.board.filter(function (o) { return GrautCtx.aplicaAtividade(o.act, cxSig); }),
                    ativ: ctx.ativ.filter(function (a) { return GrautCtx.aplicaAtividade(a, cxSig); }),
                    setores: ctx.setores, janela: ctx.janela, hoje: ctx.hoje, periodo: ctx.periodo };
          }
        }
        BOARD = ctx.board; ATIV = ctx.ativ; DATA_OPER_MIN = KPI.minDataInicio(ctx.ativ); return KPI.computar(ctx);
      }),
      KPI.lerSnapshots(window.GrautRecorrencia.hojeISO()) /* degrada p/ [] se as regras ainda não foram publicadas */
    ]).then(function (r) {
      var m = r[0];
      SNAPSHOTS = r[1] || [];
      HOJE = m.hoje;
      if (!m.totais.atividadesAtivas) {
        var ehLider = Guard.isLider && Guard.isLider();
        document.getElementById('pf-stamp').textContent = ehLider ? 'Sem atividades no seu escopo.' : 'Sem atividades ativas.';
        showState(ehLider ? 'Nada no seu escopo' : 'Ainda não há atividades',
          ehLider ? 'Não há atividades ativas nos setores que você lidera nesta janela.'
                  : 'Cadastre atividades para ver os indicadores de gestão.');
        return;
      }
      paint(m);
      gravarFotoDoDia(m);
    }).catch(function (e) {
      showState('Não consegui carregar os indicadores', (e && e.message) || 'Erro ao ler o banco.');
    });
  }

  function setPeriodo(p) { if (p === PERIODO) { return; } PERIODO = p; carregar(); }

  function wireSeg(group) {
    group.addEventListener('click', function (e) {
      var b = e.target.closest('.pf-seg-b'); if (!b) { return; }
      document.querySelectorAll('.pf-seg .pf-seg-b').forEach(function (x) {
        if (x.getAttribute('data-periodo') === b.getAttribute('data-periodo')) { x.classList.add('on'); } else { x.classList.remove('on'); }
      });
      setPeriodo(b.getAttribute('data-periodo') || 'band');
    });
  }

  function renderShell() {
    POP = document.getElementById('pf-pop');
    BACK = document.getElementById('pf-backdrop');
    BACK.addEventListener('click', closePop);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); } });
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Inteligência', user: USER }), app.firstChild);
    var exp = document.getElementById('pf-export');
    if (exp) { var rb = UI.button({ label: 'Atualizar', icon: 'upload', variant: 'ghost' }); rb.addEventListener('click', carregar); exp.appendChild(rb); }
    document.querySelectorAll('.pf-seg').forEach(wireSeg);
    carregar();
  }

  Guard.onReady(function (u) { USER = u; renderShell(); });
  </script>
