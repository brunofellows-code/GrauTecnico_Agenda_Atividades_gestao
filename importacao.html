<style>

/* de-para */

<body>

  <script src="ui.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script><!-- F1-D: leitura de .xlsx/.xls no navegador -->
  <script src="recorrencia.js"></script>
  <script type="module">
  (function () {
  'use strict';

  /* ============================================================
     IMPORTAÇÃO + AUDITORIA (Protocolo A · aba 4)
     ------------------------------------------------------------
     Contrato (instrução do projeto §8.2 + Protocolo A):
     · Upsert por CÓDIGO ESTÁVEL (coluna `codigo`): existe → atualiza;
       não existe → cria. Padrão que o mercado pede e não entrega
       (Asana só cria; Monday não mapeia por ID único) — registrado.
     · De-para esperado × encontrado: CRÍTICO bloqueia (codigo/titulo
       ausentes) · LEVE alerta e libera com confirmação (opcionais
       ausentes / colunas extras ignoradas).
     · DELTA, nunca upsert total: só grava campos que MUDARAM;
       célula VAZIA preserva o valor atual; linha idêntica é pulada.
     · Teto 200 linhas/importação (quota).
     · Toda gravação → atividade_log (acao importar_*) + 1 log-resumo.
     ============================================================ */

  var R = window.GrautRecorrencia;
  var USER = null;
  function CAN_WRITE() { var p = (USER && USER.profile) || ''; return p === 'Admin' || p === 'Editor'; }

  var _fb = null;
  function fb() {
    if (!_fb) {
      _fb = Promise.all([
        import('./firebase.js'),
        import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
      ]).then(function (m) { return { db: m[0].db, f: m[1] }; });
    }
    return _fb;
  }
  function ferr(e) {
    var code = (e && e.code) || '';
    if (code === 'permission-denied') { return new Error('Sem permissão para gravar. Confirme seu perfil e as Regras publicadas.'); }
    return new Error((e && e.message) || 'Erro ao falar com o banco.');
  }

  var Store = {
    listSetores: function () {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'setores'), c.f.where('ativo', '==', true), c.f.limit(200));
        return c.f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var o = d.data() || {}; o.sigla = o.sigla || d.id; a.push(o); });
          return a;
        });
      }).catch(function (e) { throw ferr(e); });
    },
    listAtividadesAtivas: function () {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'atividades'), c.f.where('ativo', '==', true), c.f.limit(2000));
        return c.f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var o = d.data() || {}; o.id = d.id; a.push(o); });
          return a;
        });
      }).catch(function (e) { throw ferr(e); });
    },
    /* P2-Resp: usuários ativos p/ resolver a coluna "responsavel" e o default líder-do-setor */
    listUsuariosAtivos: function () {
      return fb().then(function (c) {
        var q = c.f.query(c.f.collection(c.db, 'usuarios'), c.f.where('ativo', '==', true), c.f.limit(500));
        return c.f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var u = d.data() || {}; a.push({ uid: d.id, nome: u.nome || '', perfil: u.perfil || '', setor: u.setor || null, setoresLiderados: Array.isArray(u.setoresLiderados) ? u.setoresLiderados : [] }); });
          return a;
        });
      }).catch(function () { return []; }); /* falha aqui não bloqueia o import — só desativa o default */
    },
    criar: function (doc) {
      return fb().then(function (c) {
        return c.f.addDoc(c.f.collection(c.db, 'atividades'), doc).then(function (ref) { return ref.id; });
      }).catch(function (e) { throw ferr(e); });
    },
    atualizar: function (id, patch) {
      return fb().then(function (c) {
        return c.f.updateDoc(c.f.doc(c.db, 'atividades', id), patch);
      }).catch(function (e) { throw ferr(e); });
    },
    log: function (entry) {
      return fb().then(function (c) {
        var row = Object.assign({ ts: Date.now(), uid: (USER && USER.uid) || null }, entry);
        return c.f.addDoc(c.f.collection(c.db, 'atividade_log'), row);
      }).catch(function (e) { if (window.console && console.warn) { console.warn('[import] log falhou', e); } });
    }
  };

  /* ===================== modelo ===================== */
  var COLS_CRITICAS = ['codigo', 'titulo'];
  var COLS_OPCIONAIS = ['descricao', 'setor', 'subsetor', 'recorrencia', 'data', 'data_inicio', 'data_fim', 'dias_semana', 'dia_mes', 'horario', 'prioridade', 'mitigacao', 'camada', 'responsavel', 'apelido'];
  var CAMADAS_VALIDAS = ['socio', 'gestor', 'operacional']; /* P1: organograma Sócios → Gestor → Operacional */
  var COLS_TODAS = COLS_CRITICAS.concat(COLS_OPCIONAIS);
  var MODELO_CSV = COLS_TODAS.join(';') + '\n' +
    'PED-001;Planejar aula da semana;Plano semanal dos professores;PED;;semanal;;;;1;;08:00;;;operacional;Maria Silva;\n' +
    'SEC-010;Fechar caixa do dia;;SEC;FIN;diario;;;;;;17:30;;;operacional;;Assis. SEC 1\n' +
    'GES-005;Enviar relatório mensal;Relatório ao mantenedor;GES;;mensal;;;;;5;;;;gestor;;\n' +
    'CSA-020;Acompanhar evasão do bimestre;Contato com faltosos;CSA;EVA;bimestral;;;;;15;;Alta;Ligar e convocar o responsável;operacional;;\n' +
    'COM-002;Visita à escola parceira;;COM;;unico;2026-07-15;;;;;09:00;;;socio;;';

  /* ===================== parser CSV (; ou ,) ===================== */
  function parseCSV(text) {
    var linhas = String(text || '').replace(/\r\n/g, '\n').replace(/\r/g, '\n').split('\n')
      .filter(function (l) { return l.trim() !== ''; });
    if (!linhas.length) { return { header: [], rows: [] }; }
    var sep = linhas[0].indexOf(';') >= 0 ? ';' : ',';
    function splitLine(l) {
      /* split simples com suporte a aspas duplas */
      var out = [], cur = '', q = false;
      for (var i = 0; i < l.length; i++) {
        var ch = l.charAt(i);
        if (ch === '"') { q = !q; continue; }
        if (ch === sep && !q) { out.push(cur); cur = ''; continue; }
        cur += ch;
      }
      out.push(cur);
      return out.map(function (c) { return c.trim(); });
    }
    var header = splitLine(linhas[0]).map(function (h) { return h.toLowerCase().replace(/\s+/g, '_'); });
    var rows = linhas.slice(1).map(splitLine);
    return { header: header, rows: rows, sep: sep };
  }

  /* ===================== DOM ===================== */
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function txt(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } e.textContent = text == null ? '' : text; return e; }
  function toast(msg, kind) {
    var t = txt('div', '', msg);
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;background:var(--s2);border:1px solid var(--border);color:' + (kind === 'err' ? 'var(--red)' : 'var(--text)') + ';font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:11px;box-shadow:var(--cardShadow)';
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 2800);
  }

  var SETORES = [], ATIV = [], PLANO = null;
  var USUARIOS = []; /* P2-Resp: base p/ resolver responsável no import */
  var DATA_OPER = null; /* P1: carimbo da data de início da operação (definida no passo 1) */
  var bodyEl, POP, BACK;

  /* ===================== auditoria de-para ===================== */
  function auditarHeader(header) {
    var out = { criticas: [], leves: [], mapa: {}, extras: [] };
    COLS_TODAS.forEach(function (c) {
      var idx = header.indexOf(c);
      if (idx >= 0) { out.mapa[c] = idx; }
      else if (COLS_CRITICAS.indexOf(c) >= 0) { out.criticas.push(c); }
      else { out.leves.push(c); }
    });
    header.forEach(function (h) {
      if (COLS_TODAS.indexOf(h) < 0) { out.extras.push(h); }
    });
    return out;
  }

  /* ===================== montagem do plano (delta) ===================== */
  function valOf(row, mapa, col) {
    var idx = mapa[col];
    if (idx == null) { return null; }            /* coluna ausente = não toca */
    var v = row[idx];
    if (v == null || v === '') { return null; }  /* célula vazia PRESERVA */
    return v;
  }
  function normSetor(sig) {
    if (!sig) { return null; }
    var up = sig.toUpperCase();
    return SETORES.some(function (s) { return s.sigla === up; }) ? up : undefined; /* undefined = inválida */
  }
  /* valida a sigla de subsetor: null=ausente · undefined=não existe ·
     false=existe mas é setor raiz (não subsetor) · senão o objeto do subsetor. */
  function normSubsetor(sig) {
    if (!sig) { return null; }
    var up = sig.toUpperCase();
    var achou = SETORES.filter(function (s) { return s.sigla === up; })[0];
    if (!achou) { return undefined; }
    if (!achou.setorPaiSigla) { return false; }
    return achou;
  }

  /* ===== P2-Resp: responsável no import =====
     Ordem: (1) coluna "responsavel" (nome exato, case-insensitive) →
     (2) default líder do subsetor → líder do setor → gestor → (3) null com aviso.
     Motivo: 100% das rotinas importadas nasciam sem responsável e os
     indicadores zeravam (aderência precisa de dono). Padrão de mercado:
     Monday/Todoist exigem mapeamento; aqui alertamos e atribuímos default. */
  function acharUsuarioPorNome(nome) {
    if (!nome) { return null; }
    /* R2: casamento TOLERANTE — sem acento, sem caixa; aceita nome exato,
       primeiro nome ou prefixo, desde que aponte para UM único usuário ativo.
       "Brenda" acha "Brenda Silva"; ambíguo (2+ candidatos) → null com aviso. */
    function norm(s) {
      s = (s || '').trim().toLowerCase();
      try { s = s.normalize('NFD').replace(/[\u0300-\u036f]/g, ''); } catch (e) {}
      return s;
    }
    var alvo = norm(nome);
    if (!alvo) { return null; }
    var exato = USUARIOS.filter(function (u) { return norm(u.nome) === alvo; });
    if (exato.length === 1) { return exato[0]; }
    if (exato.length > 1) { return null; }
    var cand = USUARIOS.filter(function (u) {
      var n = norm(u.nome);
      return n.indexOf(alvo + ' ') === 0 || n === alvo || n.split(' ')[0] === alvo;
    });
    return cand.length === 1 ? cand[0] : null;
  }
  function liderDefault(setorSigla, subsetorSigla) {
    function liderDe(sig) {
      if (!sig) { return null; }
      return USUARIOS.filter(function (u) { return u.perfil === 'lider' && u.setoresLiderados.indexOf(sig) !== -1; })[0] || null;
    }
    return liderDe(subsetorSigla) || liderDe(setorSigla)
      || USUARIOS.filter(function (u) { return u.perfil === 'gestor'; })[0] || null;
  }

  function montarPlano(parsed, audit) {
    var porCodigo = {};
    ATIV.forEach(function (a) { if (a.codigo) { porCodigo[a.codigo] = a; } });
    var plano = { criar: [], atualizar: [], pular: 0, rejeitar: [], avisos: [] };
    var vistos = {};

    parsed.rows.forEach(function (row, li) {
      var linha = li + 2; /* 1-indexado + cabeçalho */
      var codigo = valOf(row, audit.mapa, 'codigo');
      var titulo = valOf(row, audit.mapa, 'titulo');
      if (!codigo) { plano.rejeitar.push({ linha: linha, motivo: 'codigo vazio' }); return; }
      if (vistos[codigo]) { plano.rejeitar.push({ linha: linha, motivo: 'codigo duplicado no arquivo (' + codigo + ')' }); return; }
      vistos[codigo] = true;

      var setor = valOf(row, audit.mapa, 'setor');
      var setorNorm = setor == null ? null : normSetor(setor);
      if (setorNorm === undefined) { plano.rejeitar.push({ linha: linha, motivo: 'setor "' + setor + '" não existe (sigla inválida)' }); return; }

      var subRaw = valOf(row, audit.mapa, 'subsetor');
      var subObj = subRaw == null ? null : normSubsetor(subRaw);
      if (subObj === undefined) { plano.rejeitar.push({ linha: linha, motivo: 'subsetor "' + subRaw + '" não existe' }); return; }
      if (subObj === false) { plano.rejeitar.push({ linha: linha, motivo: '"' + subRaw + '" é um setor raiz, não um subsetor' }); return; }
      if (subObj && setorNorm && subObj.setorPaiSigla !== setorNorm) { plano.rejeitar.push({ linha: linha, motivo: 'subsetor "' + subObj.sigla + '" não pertence ao setor ' + setorNorm }); return; }

      var rec = valOf(row, audit.mapa, 'recorrencia');
      if (rec != null) {
        rec = rec.toLowerCase();
        if (['diario', 'semanal', 'quinzenal', 'mensal', 'bimestral', 'trimestral', 'unico'].indexOf(rec) < 0) {
          plano.rejeitar.push({ linha: linha, motivo: 'recorrencia "' + rec + '" inválida' }); return;
        }
      }
      var data = valOf(row, audit.mapa, 'data');
      var dIni = valOf(row, audit.mapa, 'data_inicio');
      var dFim = valOf(row, audit.mapa, 'data_fim');
      var badData = [data, dIni, dFim].some(function (d) { return d != null && !R.isISO(d); });
      if (badData) { plano.rejeitar.push({ linha: linha, motivo: 'data fora do formato AAAA-MM-DD' }); return; }

      var diasSem = valOf(row, audit.mapa, 'dias_semana');
      var diasArr = null;
      if (diasSem != null) {
        diasArr = diasSem.split(/[|,\s]+/).map(function (d) { return parseInt(d, 10); })
          .filter(function (n) { return !isNaN(n) && n >= 0 && n <= 6; });
        if (!diasArr.length) { plano.rejeitar.push({ linha: linha, motivo: 'dias_semana inválido (use 0=Dom..6=Sáb, separados por |)' }); return; }
      }
      var diaMes = valOf(row, audit.mapa, 'dia_mes');
      var diaMesN = diaMes == null ? null : parseInt(diaMes, 10);
      if (diaMes != null && (isNaN(diaMesN) || diaMesN < 1 || diaMesN > 31)) {
        plano.rejeitar.push({ linha: linha, motivo: 'dia_mes inválido (1–31)' }); return;
      }

      /* candidato: só campos PRESENTES na linha */
      var cand = {};
      if (titulo != null) { cand.titulo = titulo; }
      var desc = valOf(row, audit.mapa, 'descricao');
      if (desc != null) { cand.descricao = desc; }
      if (setorNorm != null) { cand.setorSigla = setorNorm; cand.setorSiglas = [setorNorm]; cand.todosSetores = false; }
      if (rec != null) { cand.recorrencia = rec; }
      if (data != null) { cand.data = data; }
      if (dIni != null) { cand.dataInicio = dIni; }
      if (dFim != null) { cand.dataFim = dFim; }
      /* P1(b): motor de data de operação — recorrente declarada na planilha e SEM
         data_inicio herda a data digitada no passo 1; 'unico' mantém a própria data.
         Vale para criar E atualizar (reimportar com outra data reancora via delta). */
      if (rec != null && rec !== 'unico' && dIni == null && DATA_OPER) { cand.dataInicio = DATA_OPER; }
      if (diasArr != null) { cand.diasSemana = diasArr; }
      if (diaMesN != null) { cand.diaMes = diaMesN; }
      var hora = valOf(row, audit.mapa, 'horario');
      if (hora != null) { cand.horario = hora; }
      if (subObj) { cand.subsetorSigla = subObj.sigla; }
      var prio = valOf(row, audit.mapa, 'prioridade');
      if (prio != null) { cand.prioridade = prio; }
      var mit = valOf(row, audit.mapa, 'mitigacao');
      if (mit != null) { cand.mitigacao = mit; }
      /* P1(a): camada do organograma — inválida vira 'operacional' COM aviso no preview */
      var cam = valOf(row, audit.mapa, 'camada');
      if (cam != null) {
        cam = cam.toLowerCase();
        if (CAMADAS_VALIDAS.indexOf(cam) < 0) {
          plano.avisos.push('linha ' + linha + ' (' + codigo + '): camada "' + cam + '" inválida — assumida "operacional"');
          cam = 'operacional';
        }
        cand.camada = cam;
      }

      /* P2-Resp: coluna "responsavel" (por nome) — não encontrado = aviso e cai no default */
      var respNome = valOf(row, audit.mapa, 'responsavel');
      if (respNome != null) {
        var uResp = acharUsuarioPorNome(respNome);
        if (uResp) { cand.responsavelUid = uResp.uid; cand.responsavelNome = uResp.nome; }
        else { plano.avisos.push('linha ' + linha + ' (' + codigo + '): responsável "' + respNome + '" não encontrado OU ambíguo (2+ usuários com esse nome) — aplicando a regra da camada'); }
      }
      /* R2: coluna "apelido" = RÓTULO VISUAL sem login (UID nulo). Só vale se
         nenhum responsável REAL foi resolvido acima — pessoa de verdade sempre
         ganha da etiqueta. Serve p/ o líder ver a distribuição planejada; a
         atividade conta como "sem responsável" nos indicadores (UID nulo). */
      var apel = valOf(row, audit.mapa, 'apelido');
      if (apel != null && cand.responsavelUid == null) {
        cand.responsavelNome = apel; cand.responsavelUid = null;
        cand.apelidoPlaceholder = true; /* marca p/ futuros: é etiqueta, não pessoa */
      }
      function aplicarRespDefault(destino, ctxSetor, ctxSub, ctxCamada) {
        /* R2: decisão do Bruno — PEF define o dono das rotinas de GESTOR/SÓCIO;
           OPERACIONAL sem coluna preenchida FICA EM BRANCO de propósito
           (o líder direciona na tela). Default automático só p/ gestor/sócio. */
        if ((ctxCamada || 'operacional') === 'operacional') {
          plano.avisos.push('linha ' + linha + ' (' + codigo + '): operacional sem responsável — deixada em branco para o líder direcionar');
          return false;
        }
        var lid = liderDefault(ctxSetor, ctxSub);
        if (lid) {
          destino.responsavelUid = lid.uid; destino.responsavelNome = lid.nome;
          plano.avisos.push('linha ' + linha + ' (' + codigo + '): sem responsável — atribuído a ' + lid.nome + ' (default ' + (ctxCamada || '') + ')');
          return true;
        }
        plano.avisos.push('linha ' + linha + ' (' + codigo + '): sem responsável e sem líder/gestor cadastrado para o setor — ficará sem dono');
        return false;
      }

      var existente = porCodigo[codigo];
      if (existente) {
        /* P2-Resp: saneamento de órfãs — doc existente SEM responsável e linha sem
           a coluna preenchida ganha o default do setor. Não é quebra da regra
           "vazio preserva": não havia valor a preservar (null ≠ valor). */
        if (cand.responsavelUid == null && !cand.responsavelNome && existente.responsavelUid == null) {
          aplicarRespDefault(cand,
            cand.setorSigla || existente.setorSigla || null,
            (cand.subsetorSigla !== undefined ? cand.subsetorSigla : existente.subsetorSigla) || null,
            cand.camada || existente.camada || 'operacional');
        }
        /* DELTA: só o que mudou */
        var patch = {}, diffs = [];
        Object.keys(cand).forEach(function (k) {
          var novo = cand[k], atual = existente[k];
          var difere = Array.isArray(novo)
            ? JSON.stringify(novo) !== JSON.stringify(atual || [])
            : String(novo) !== String(atual == null ? '' : atual);
          if (difere) { patch[k] = novo; diffs.push(k + ': "' + (atual == null ? '' : atual) + '" → "' + (Array.isArray(novo) ? novo.join('|') : novo) + '"'); }
        });
        if (!Object.keys(patch).length) { plano.pular++; return; }
        plano.atualizar.push({ codigo: codigo, id: existente.id, titulo: existente.titulo, patch: patch, diffs: diffs });
      } else {
        /* criação exige o mínimo viável */
        if (!titulo) { plano.rejeitar.push({ linha: linha, motivo: 'atividade NOVA (' + codigo + ') sem titulo' }); return; }
        if (setorNorm == null) { plano.rejeitar.push({ linha: linha, motivo: 'atividade NOVA (' + codigo + ') sem setor' }); return; }
        if (rec == null) { plano.rejeitar.push({ linha: linha, motivo: 'atividade NOVA (' + codigo + ') sem recorrencia' }); return; }
        if (cam == null) { plano.avisos.push('linha ' + linha + ' (' + codigo + '): camada ausente — assumida "operacional"'); }
        /* P2-Resp: default só quando NÃO há responsável real NEM apelido.
           (responsavelNome cobre os dois: pessoa resolvida ou etiqueta.) */
        if (cand.responsavelUid == null && !cand.responsavelNome) {
          aplicarRespDefault(cand, setorNorm || null, (subObj && subObj.sigla) || null, cand.camada || 'operacional');
        }        var doc = Object.assign({
          codigo: codigo, descricao: '', horario: null, diasSemana: null, diaMes: null,
          data: null, deslizante: false, dataInicio: null, dataFim: null, subsetorSigla: null,
          camada: 'operacional',
          responsavelUid: null, responsavelNome: null,
          projetoId: null, projetoSigla: null, todosSetores: false
        }, cand);
        var verr = R.validar(doc);
        if (verr.length) { plano.rejeitar.push({ linha: linha, motivo: verr[0] }); return; }
        plano.criar.push({ codigo: codigo, doc: doc });
      }
    });
    return plano;
  }

  /* ===================== execução ===================== */
  function executar(plano) {
    var total = plano.criar.length + plano.atualizar.length;
    var feito = 0, falhas = [];
    var btn = document.getElementById('im-exec');
    if (btn) { btn.disabled = true; btn.querySelector('span').textContent = 'Gravando 0/' + total + '…'; }
    function tick() { feito++; if (btn) { btn.querySelector('span').textContent = 'Gravando ' + feito + '/' + total + '…'; } }

    var seq = Promise.resolve();
    plano.criar.forEach(function (c) {
      seq = seq.then(function () {
        var doc = Object.assign({}, c.doc, { ativo: true, criadoPor: USER.uid, criadoEm: Date.now(), atualizadoEm: Date.now() });
        return Store.criar(doc).then(function (id) {
          tick();
          return Store.log({ acao: 'importar_criar', entidade: 'atividade', refId: id, antes: null, depois: { codigo: c.codigo, titulo: doc.titulo } });
        }).catch(function (e) { falhas.push(c.codigo + ': ' + e.message); });
      });
    });
    plano.atualizar.forEach(function (u) {
      seq = seq.then(function () {
        var patch = Object.assign({}, u.patch, { atualizadoEm: Date.now() });
        return Store.atualizar(u.id, patch).then(function () {
          tick();
          return Store.log({ acao: 'importar_atualizar', entidade: 'atividade', refId: u.id, antes: null, depois: u.patch });
        }).catch(function (e) { falhas.push(u.codigo + ': ' + e.message); });
      });
    });
    seq.then(function () {
      return Store.log({ acao: 'importacao_resumo', entidade: 'importacao', refId: null, antes: null,
        depois: { criadas: plano.criar.length, atualizadas: plano.atualizar.length, puladas: plano.pular, rejeitadas: plano.rejeitar.length, falhas: falhas.length } });
    }).then(function () {
      if (falhas.length) {
        toast(falhas.length + ' gravação(ões) falharam — veja o console.', 'err');
        if (window.console) { console.warn('[import] falhas:', falhas); }
      } else {
        toast('Importação concluída: ' + plano.criar.length + ' criada(s), ' + plano.atualizar.length + ' atualizada(s).');
      }
      PLANO = null;
      boot2(); /* recarrega a base e volta ao passo 1 */
    });
  }

  /* ===================== telas ===================== */
  function renderPasso1() {
    bodyEl.innerHTML = '';
    var card = el('<div class="im-card"></div>');
    card.appendChild(txt('div', 'im-step', 'Passo 1 de 3'));
    card.appendChild(txt('div', 'im-card-t', 'Cole o conteúdo da planilha-modelo'));
    card.appendChild(txt('div', 'im-hint',
      'Abra a planilha no Excel/Sheets, salve como CSV (separado por ; ou ,) e cole o conteúdo aqui — ou baixe o modelo abaixo, preencha e cole. ' +
      'A coluna "codigo" é a chave: código que JÁ existe atualiza a atividade; código novo cria. Célula vazia PRESERVA o valor atual. Teto: 200 linhas.'));
    var ta = document.createElement('textarea');
    ta.className = 'im-ta';
    ta.placeholder = COLS_TODAS.join(';') + '\nPED-001;Planejar aula da semana;…';
    card.appendChild(ta);
    /* F1-D(a): escolher arquivo — .csv lê como texto; .xlsx/.xls via SheetJS.
       O arquivo só PREENCHE o campo acima; o pipeline (parseCSV → auditoria →
       delta) é EXATAMENTE o mesmo do colar. */
    var fileWrap = el('<div class="im-row" style="margin-top:8px;align-items:center"></div>');
    var fileInp = document.createElement('input');
    fileInp.type = 'file';
    fileInp.accept = '.csv,.xlsx,.xls,.txt';
    fileInp.id = 'im-file';
    fileInp.style.cssText = 'display:none';
    var fileBtn = UI.button({ label: 'Escolher arquivo (.csv / .xlsx)', icon: 'upload', variant: 'ghost' });
    fileBtn.addEventListener('click', function () { fileInp.click(); });
    var fileName = txt('span', 'im-hint', 'ou cole o conteúdo acima');
    fileName.style.margin = '0';
    fileWrap.appendChild(fileBtn); fileWrap.appendChild(fileInp); fileWrap.appendChild(fileName);
    card.appendChild(fileWrap);
    fileInp.addEventListener('change', function () {
      var f = fileInp.files && fileInp.files[0];
      if (!f) { return; }
      var nome = f.name || 'arquivo';
      var ext = nome.toLowerCase().split('.').pop();
      if (f.size === 0) { toast('Arquivo vazio — nada para importar.', 'err'); fileInp.value = ''; return; }
      var rd = new FileReader();
      rd.onerror = function () { toast('Não consegui ler o arquivo. Tente salvar como CSV e colar.', 'err'); fileInp.value = ''; };
      if (ext === 'xlsx' || ext === 'xls') {
        if (!window.XLSX) { toast('Leitor de Excel não carregou (sem internet no CDN?). Salve como CSV e cole.', 'err'); fileInp.value = ''; return; }
        rd.onload = function () {
          try {
            var wb = window.XLSX.read(new Uint8Array(rd.result), { type: 'array' });
            var first = wb.SheetNames && wb.SheetNames[0];
            if (!first) { toast('Planilha sem abas legíveis.', 'err'); return; }
            var csv = window.XLSX.utils.sheet_to_csv(wb.Sheets[first], { FS: ';', blankrows: false });
            if (!csv.trim()) { toast('A primeira aba está vazia.', 'err'); return; }
            ta.value = csv;
            var nl = csv.split('\n').filter(function (l) { return l.trim() !== ''; }).length;
            fileName.textContent = nome + ' · ' + (nl - 1) + ' linha(s) de dado (1ª aba)';
            toast('Arquivo lido. Confira e clique em "Auditar arquivo".');
          } catch (e) { toast('Excel ilegível: ' + ((e && e.message) || 'formato não suportado') + '. Salve como CSV.', 'err'); }
        };
        rd.readAsArrayBuffer(f);
      } else {
        rd.onload = function () {
          var texto = String(rd.result || '');
          if (!texto.trim()) { toast('Arquivo vazio — nada para importar.', 'err'); return; }
          ta.value = texto.replace(/^\ufeff/, '');
          var nl2 = texto.split('\n').filter(function (l) { return l.trim() !== ''; }).length;
          fileName.textContent = nome + ' · ' + (nl2 - 1) + ' linha(s) de dado';
          toast('Arquivo lido. Confira e clique em "Auditar arquivo".');
        };
        rd.readAsText(f, 'utf-8');
      }
    });
    /* P1(b): a virada de chave — o gestor digita UMA data e toda recorrente sem
       data_inicio na planilha passa a valer a partir dela. */
    var opLbl = txt('div', 'im-hint', 'Data de início da operação — atividades recorrentes SEM "data_inicio" na planilha começam a valer nesta data. Atividades de data única ("unico") mantêm a própria data.');
    opLbl.style.marginTop = '10px';
    card.appendChild(opLbl);
    var opInput = document.createElement('input');
    opInput.type = 'date';
    opInput.id = 'im-dataoper';
    opInput.value = R.hojeISO();
    opInput.style.cssText = 'background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:8px 10px;font:inherit;font-size:13px;margin-top:6px;display:block';
    card.appendChild(opInput);
    var row = el('<div class="im-row"></div>');
    var down = UI.button({ label: 'Baixar planilha-modelo (CSV)', icon: 'upload', variant: 'ghost' });
    down.addEventListener('click', function () {
      var blob = new Blob(['\ufeff' + MODELO_CSV], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'modelo_importacao_atividades.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 500);
    });
    row.appendChild(down);
    var next = UI.button({ label: 'Auditar arquivo', icon: 'check' });
    next.addEventListener('click', function () {
      var di = document.getElementById('im-dataoper');
      DATA_OPER = (di && R.isISO(di.value)) ? di.value : R.hojeISO();
      var parsed = parseCSV(ta.value);
      if (!parsed.header.length || !parsed.rows.length) { toast('Cole o conteúdo com cabeçalho + ao menos 1 linha.', 'err'); return; }
      if (parsed.rows.length > 200) { toast('Teto de 200 linhas por importação (quota). Divida o arquivo.', 'err'); return; }
      renderPasso2(parsed);
    });
    row.appendChild(next);
    card.appendChild(row);
    bodyEl.appendChild(card);
    renderManutencao(); /* F1-D(d): zona de manutenção (gestor) abaixo do passo 1 */
  }

  /* ============================================================
     F1-D(d) · ZONA DE MANUTENÇÃO (Gestor) — limpar dados de TESTE
     para a estreia começar com histórico limpo.
     1) Zerar checks de um período: as ocorrências gravadas no
        intervalo voltam a 'pendente' (concluidaEm/iniciadaEm/
        dataOverride limpos). NÃO apaga atividades nem docs.
     2) Desativar atividades de teste por SIGLA (soft-delete
        ativo:false) — inclui siglas órfãs/desativadas.
     Ambas: preview + confirmação em modal + 1 registro-resumo no
     atividade_log (quota-são). Teto 400 escritas por rodada.
     ============================================================ */
  function ehGestor() { return !!(USER && (USER.perfil === 'gestor' || USER.profile === 'Admin')); }

  function renderManutencao() {
    if (!ehGestor()) { return; }
    var card = el('<div class="im-card" style="margin-top:16px"></div>');
    card.appendChild(txt('div', 'im-step', 'Zona de manutenção · Gestor'));
    card.appendChild(txt('div', 'im-card-t', 'Limpar dados de teste'));
    card.appendChild(txt('div', 'im-hint', 'Para a estreia começar limpa após o treino. Toda limpeza mostra um preview, pede confirmação e registra um resumo no histórico (atividade_log). Nada é apagado de verdade: checks voltam a "pendente" e atividades são desativadas (reversível em "Inativas").'));

    /* --- ação 1: zerar checks de um período --- */
    var r1 = el('<div class="im-row" style="align-items:center;flex-wrap:wrap;margin-top:10px"></div>');
    r1.appendChild(txt('span', 'im-hint', 'Zerar checks de teste no período:'));
    var d1 = document.createElement('input'); d1.type = 'date';
    var d2 = document.createElement('input'); d2.type = 'date';
    d1.style.cssText = d2.style.cssText = 'background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 9px;font:inherit;font-size:12.5px';
    d2.value = R.hojeISO(); d1.value = R.addDias(R.hojeISO(), -45);
    r1.appendChild(d1); r1.appendChild(d2);
    var b1 = UI.button({ label: 'Ver o que será zerado', variant: 'ghost', icon: 'check' });
    b1.addEventListener('click', function () { previewZerarChecks(d1.value, d2.value); });
    r1.appendChild(b1);
    card.appendChild(r1);

    /* --- ação 2: desativar atividades por sigla --- */
    var r2 = el('<div class="im-row" style="align-items:center;flex-wrap:wrap;margin-top:8px"></div>');
    r2.appendChild(txt('span', 'im-hint', 'Desativar atividades de teste da sigla:'));
    var sel = document.createElement('select');
    sel.style.cssText = 'background:var(--s2);border:1px solid var(--border);color:var(--text);border-radius:9px;padding:7px 9px;font:inherit;font-size:12.5px';
    var vistos = {}, ativasSig = {};
    SETORES.forEach(function (s) { if (s && s.ativo) { ativasSig[s.sigla] = true; } });
    var op0 = document.createElement('option'); op0.value = ''; op0.textContent = '— escolha a sigla —'; sel.appendChild(op0);
    ATIV.forEach(function (a) {
      var sig = a && a.setorSigla; if (!sig || vistos[sig]) { return; } vistos[sig] = true;
      var op = document.createElement('option'); op.value = sig;
      op.textContent = sig + (ativasSig[sig] ? '' : ' · (setor desativado)');
      sel.appendChild(op);
    });
    r2.appendChild(sel);
    var b2 = UI.button({ label: 'Ver o que será desativado', variant: 'ghost', icon: 'check' });
    b2.addEventListener('click', function () { if (!sel.value) { toast('Escolha a sigla.', 'err'); return; } previewDesativarSigla(sel.value); });
    r2.appendChild(b2);
    card.appendChild(r2);
    bodyEl.appendChild(card);
  }

  function modalConfirmar(titulo, linhas, aviso, onOk) {
    var body = [];
    var box = el('<div></div>');
    linhas.slice(0, 20).forEach(function (l) { box.appendChild(txt('div', 'im-hint', '• ' + l)); });
    if (linhas.length > 20) { box.appendChild(txt('div', 'im-hint', '… e mais ' + (linhas.length - 20) + ' item(ns).')); }
    body.push(box);
    var av = txt('div', 'im-hint', aviso); av.style.color = 'var(--red)'; av.style.fontWeight = '700'; av.style.marginTop = '8px';
    body.push(av);
    var okBtn = null;
    var mm = UI.modal({
      title: titulo, width: 520, body: body,
      footer: function (close) {
        var c = UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close });
        okBtn = UI.button({ label: 'Confirmar limpeza', icon: 'check', onClick: function () { okBtn.disabled = true; onOk(mm); } });
        return [c, okBtn];
      }
    });
    return mm;
  }

  function previewZerarChecks(ini, fim) {
    if (!R.isISO(ini) || !R.isISO(fim) || ini > fim) { toast('Período inválido.', 'err'); return; }
    fb().then(function (c) {
      var q = c.f.query(c.f.collection(c.db, 'ocorrencias'),
        c.f.where('data', '>=', ini), c.f.where('data', '<=', fim), c.f.limit(400));
      return c.f.getDocs(q).then(function (snap) {
        var docs = [];
        snap.forEach(function (d) {
          var x = d.data() || {};
          if (x.status && x.status !== 'pendente') { docs.push({ id: d.id, data: x.data, status: x.status }); }
        });
        if (!docs.length) { toast('Nenhum check gravado no período — nada a zerar.'); return; }
        var porStatus = {};
        docs.forEach(function (x) { porStatus[x.status] = (porStatus[x.status] || 0) + 1; });
        var resumo = Object.keys(porStatus).map(function (k) { return porStatus[k] + ' ' + k; }).join(' · ');
        modalConfirmar(
          'Zerar checks de ' + ini + ' a ' + fim,
          docs.slice(0, 20).map(function (x) { return x.data + ' · ' + x.status; }),
          docs.length + ' registro(s) voltarão a "pendente" (' + resumo + '). As atividades e o cadastro NÃO são tocados. Esta ação fica no histórico.',
          function (mm) { executarZerar(docs, ini, fim, mm); }
        );
      });
    }).catch(function (e) { toast(ferr(e).message, 'err'); });
  }

  function executarZerar(docs, ini, fim, mm) {
    fb().then(function (c) {
      var i = 0;
      function passo() {
        if (i >= docs.length) {
          return Store.log({ acao: 'limpeza_teste_checks', entidade: 'ocorrencia', refId: ini + '..' + fim,
            antes: { total: docs.length }, depois: { status: 'pendente', periodo: ini + ' a ' + fim } })
            .then(function () { mm.close(); toast(docs.length + ' check(s) zerados. Estreia limpa. ✔'); });
        }
        var d = docs[i]; i++;
        return c.f.setDoc(c.f.doc(c.db, 'ocorrencias', d.id),
          { status: 'pendente', concluidaEm: null, iniciadaEm: null, dataOverride: null }, { merge: true }).then(passo);
      }
      return passo();
    }).catch(function (e) { mm.close(); toast('Limpeza interrompida: ' + ferr(e).message + ' Rode de novo para continuar (é idempotente).', 'err'); });
  }

  function previewDesativarSigla(sig) {
    var alvo = ATIV.filter(function (a) { return a && a.setorSigla === sig && a.ativo !== false; });
    if (!alvo.length) { toast('Nenhuma atividade ativa com a sigla ' + sig + '.'); return; }
    modalConfirmar(
      'Desativar atividades de ' + sig,
      alvo.map(function (a) { return a.titulo || a.id; }),
      alvo.length + ' atividade(s) serão desativadas (soft-delete ativo:false). Reversível em Atividades → Inativas. Fica no histórico.',
      function (mm) { executarDesativar(alvo, sig, mm); }
    );
  }

  function executarDesativar(alvo, sig, mm) {
    fb().then(function (c) {
      var i = 0;
      function passo() {
        if (i >= alvo.length) {
          return Store.log({ acao: 'limpeza_teste_atividades', entidade: 'atividade', refId: sig,
            antes: { total: alvo.length }, depois: { ativo: false, sigla: sig } })
            .then(function () { mm.close(); toast(alvo.length + ' atividade(s) desativadas. ✔'); boot2(); });
        }
        var a = alvo[i]; i++;
        return c.f.setDoc(c.f.doc(c.db, 'atividades', a.id), { ativo: false, atualizadoEm: Date.now() }, { merge: true }).then(passo);
      }
      return passo();
    }).catch(function (e) { mm.close(); toast('Interrompido: ' + ferr(e).message + ' Rode de novo (idempotente).', 'err'); });
  }

  function renderPasso2(parsed) {
    bodyEl.innerHTML = '';
    var audit = auditarHeader(parsed.header);
    var card = el('<div class="im-card"></div>');
    card.appendChild(txt('div', 'im-step', 'Passo 2 de 3 — auditoria de-para'));
    card.appendChild(txt('div', 'im-card-t', 'Colunas: esperado × encontrado'));

    var tbl = el('<table class="im-tbl"><thead><tr><th>Coluna esperada</th><th>Situação</th></tr></thead><tbody></tbody></table>');
    var tb = tbl.querySelector('tbody');
    COLS_TODAS.forEach(function (c) {
      var tr = document.createElement('tr');
      tr.appendChild(txt('td', '', c + (COLS_CRITICAS.indexOf(c) >= 0 ? ' *' : '')));
      var st;
      if (audit.mapa[c] != null) { st = txt('td', 'im-ok', 'Encontrada (coluna ' + (audit.mapa[c] + 1) + ')'); }
      else if (COLS_CRITICAS.indexOf(c) >= 0) { st = txt('td', 'im-crit', 'AUSENTE — crítica'); }
      else { st = txt('td', 'im-warn', 'Ausente — esses campos não serão tocados'); }
      tr.appendChild(st);
      tb.appendChild(tr);
    });
    audit.extras.forEach(function (c) {
      var tr = document.createElement('tr');
      tr.appendChild(txt('td', '', c));
      tr.appendChild(txt('td', 'im-warn', 'Extra — será IGNORADA'));
      tb.appendChild(tr);
    });
    card.appendChild(tbl);

    var row = el('<div class="im-row"></div>');
    var back = UI.button({ label: 'Voltar', variant: 'ghost' });
    back.addEventListener('click', renderPasso1);
    row.appendChild(back);

    if (audit.criticas.length) {
      var b = el('<div class="im-banner crit"></div>');
      b.textContent = 'BLOQUEADO: coluna(s) crítica(s) ausente(s) — ' + audit.criticas.join(', ') + '. Sem "codigo" o sistema não sabe o que criar × atualizar; sem "titulo" não há como criar. Corrija o cabeçalho e cole de novo.';
      card.appendChild(b);
    } else {
      if (audit.leves.length || audit.extras.length) {
        var w = el('<div class="im-banner warn"></div>');
        var partes = [];
        if (audit.leves.length) { partes.push('ausentes (não serão tocadas): ' + audit.leves.join(', ')); }
        if (audit.extras.length) { partes.push('extras (ignoradas): ' + audit.extras.join(', ')); }
        w.textContent = 'Divergência leve — ' + partes.join(' · ') + '. Pode prosseguir com confirmação.';
        card.appendChild(w);
      } else {
        var ok = el('<div class="im-banner ok"></div>');
        ok.textContent = 'Cabeçalho 100% no modelo.';
        card.appendChild(ok);
      }
      var next = UI.button({ label: 'Confirmar e montar preview', icon: 'check' });
      next.addEventListener('click', function () {
        PLANO = montarPlano(parsed, audit);
        renderPasso3(parsed, audit);
      });
      row.appendChild(next);
    }
    card.appendChild(row);
    bodyEl.appendChild(card);
  }

  function renderPasso3() {
    bodyEl.innerHTML = '';
    var plano = PLANO;
    var card = el('<div class="im-card"></div>');
    card.appendChild(txt('div', 'im-step', 'Passo 3 de 3 — preview do delta'));
    card.appendChild(txt('div', 'im-card-t', 'O que vai acontecer (nada foi gravado ainda)'));

    var sum = el('<div class="im-sum"></div>');
    [[plano.criar.length, 'criar', 'green'], [plano.atualizar.length, 'atualizar', 'doing'],
     [plano.pular, 'pular (idênticas)', 'muted'], [plano.rejeitar.length, 'rejeitadas', 'red']].forEach(function (s) {
      var d = el('<div class="im-sm"></div>');
      var v = txt('div', 'im-sm-v', String(s[0]));
      v.style.color = s[2] === 'muted' ? 'var(--muted)' : 'var(--' + s[2] + ')';
      d.appendChild(v);
      d.appendChild(txt('div', 'im-sm-k', s[1]));
      sum.appendChild(d);
    });
    card.appendChild(sum);

    if (DATA_OPER) {
      var od = el('<div class="im-banner ok"></div>');
      od.textContent = 'Data de início da operação aplicada às recorrentes sem data_inicio: ' + DATA_OPER + '.';
      card.appendChild(od);
    }
    if (plano.avisos && plano.avisos.length) {
      var av = el('<div class="im-banner warn"></div>');
      var mostra = plano.avisos.slice(0, 5).join(' · ');
      if (plano.avisos.length > 5) { mostra += ' · … e mais ' + (plano.avisos.length - 5) + ' aviso(s)'; }
      av.textContent = 'Avisos (' + plano.avisos.length + '): ' + mostra;
      card.appendChild(av);
    }

    var L = [];
    if (plano.criar.length) {
      L.push('== CRIAR (' + plano.criar.length + ') ==');
      plano.criar.forEach(function (c) { L.push('+ ' + c.codigo + ' · ' + c.doc.titulo + ' · ' + c.doc.setorSigla + ' · ' + c.doc.recorrencia); });
      L.push('');
    }
    if (plano.atualizar.length) {
      L.push('== ATUALIZAR (' + plano.atualizar.length + ') — só os campos que mudaram ==');
      plano.atualizar.forEach(function (u) {
        L.push('~ ' + u.codigo + ' · ' + (u.titulo || ''));
        u.diffs.forEach(function (d) { L.push('    ' + d); });
      });
      L.push('');
    }
    if (plano.rejeitar.length) {
      L.push('== REJEITADAS (' + plano.rejeitar.length + ') — não serão gravadas ==');
      plano.rejeitar.forEach(function (r) { L.push('✗ linha ' + r.linha + ': ' + r.motivo); });
    }
    if (!L.length) { L.push('Nenhuma mudança: o arquivo é idêntico ao que já está no sistema.'); }
    var diff = el('<div class="im-diff"></div>');
    diff.textContent = L.join('\n');
    card.appendChild(diff);

    var row = el('<div class="im-row"></div>');
    var back = UI.button({ label: 'Voltar ao início', variant: 'ghost' });
    back.addEventListener('click', function () { PLANO = null; renderPasso1(); });
    row.appendChild(back);

    var total = plano.criar.length + plano.atualizar.length;
    if (total > 0) {
      if (!CAN_WRITE()) {
        var b = el('<div class="im-banner crit"></div>');
        b.textContent = 'Seu perfil só visualiza — a gravação está bloqueada.';
        card.appendChild(b);
      } else {
        var exec = UI.button({ label: 'Gravar ' + total + ' mudança(s)', icon: 'check' });
        exec.id = 'im-exec';
        exec.addEventListener('click', function () { executar(plano); });
        row.appendChild(exec);
      }
    }
    card.appendChild(row);
    bodyEl.appendChild(card);
  }

  /* ===================== estados / boot ===================== */
  function renderLoading() {
    bodyEl.innerHTML = '';
    bodyEl.appendChild(el('<div class="im-state"><div class="im-state-t">Carregando…</div><div class="im-state-s">Lendo setores e atividades atuais (base do delta).</div></div>'));
  }
  function renderError(e) {
    bodyEl.innerHTML = '';
    var s = el('<div class="im-state"></div>');
    s.appendChild(txt('div', 'im-state-t', 'Não deu para carregar'));
    s.appendChild(txt('div', 'im-state-s', (e && e.message) || 'Erro desconhecido.'));
    var rb = UI.button({ label: 'Tentar de novo', icon: 'upload' });
    rb.addEventListener('click', boot2);
    s.appendChild(rb);
    bodyEl.appendChild(s);
  }

  function boot2() {
    renderLoading();
    Promise.all([Store.listSetores(), Store.listAtividadesAtivas(), Store.listUsuariosAtivos()])
      .then(function (r) { SETORES = r[0]; ATIV = r[1]; USUARIOS = r[2]; renderPasso1(); })
      .catch(renderError);
  }

  function boot() {
    bodyEl = document.getElementById('im-body');
    POP = document.getElementById('im-pop');
    BACK = document.getElementById('im-back');
    BACK.addEventListener('click', function () { POP.classList.remove('on'); BACK.classList.remove('on'); });
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Importar', user: USER }), app.firstChild);

    var ib = el('<button class="im-i" type="button" aria-label="Como funciona"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></button>');
    ib.addEventListener('click', function () {
      POP.innerHTML = '';
      POP.appendChild(txt('div', 'im-pop-t', 'Regras da importação'));
      [['Chave', 'Coluna "codigo" (estável): código existente ATUALIZA; novo CRIA. Duplicado no arquivo → linha rejeitada.'],
       ['Delta', 'Só grava o que MUDOU. Célula vazia PRESERVA o valor atual. Linha idêntica é pulada. Nunca sobrescreve tudo.'],
       ['Responsável', 'Coluna "responsavel" = NOME de usuário ativo (com login). Vazia: camada GESTOR/SÓCIO recebe o líder/gestor do setor; OPERACIONAL fica em branco pro líder direcionar.'],
       ['Apelido', 'Coluna "apelido" = etiqueta VISUAL sem login (ex.: "Assis. PED 1"). Aparece no card pro líder ver a divisão planejada, mas NÃO loga e conta como "sem responsável" nos indicadores até virar pessoa real. Responsável real sempre ganha do apelido.'],
       ['Auditoria', 'De-para do cabeçalho: sem "codigo"/"titulo" BLOQUEIA · coluna faltando/extra ALERTA e pede confirmação. Cada gravação vai ao atividade_log com rótulo de importação + 1 registro-resumo.'],
       ['Quota', 'Teto de 200 linhas por importação — protege o limite diário de escritas do banco.']].forEach(function (r) {
        var v = txt('div', 'im-pop-v', r[0] + ': ' + r[1]);
        POP.appendChild(v);
      });
      POP.classList.add('on'); BACK.classList.add('on');
      var r = ib.getBoundingClientRect();
      POP.style.top = (r.bottom + 8) + 'px';
      POP.style.left = Math.max(12, Math.min(r.left, window.innerWidth - 336)) + 'px';
    });
    document.getElementById('im-info').appendChild(ib);
    montarBackup(); /* F1-I: exportação de segurança (só gestor) */
    boot2();
  }

  /* ============================================================
     F1-I · BACKUP (exportação JSON) — fecha o risco CRÍTICO do
     RAIO-X: "perda de dados sem backup". Só GESTOR. Lê cada
     coleção com limit (leitura limitada, contrato §2) e baixa um
     arquivo gera_backup_AAAA-MM-DD.json. Nada é gravado além de
     1 linha de auditoria no atividade_log. Coleção que bater no
     teto é sinalizada como possivelmente truncada — honestidade
     antes de conveniência.
     ============================================================ */
  var BK_COLS = ['setores', 'usuarios', 'atividades', 'ocorrencias', 'projetos', 'subtarefas',
    'eventos', 'reunioes', 'pauta_sugestoes', 'planos_acao', 'solicitacoes', 'kpi_snapshots', 'atividade_log'];
  var BK_TETO = 9000;
  function montarBackup() {
    if (!(Guard.isGestor && Guard.isGestor())) { return; }
    var top = document.querySelector('.im-top');
    if (!top) { return; }
    var bx = el('<div style="display:flex;align-items:center;gap:10px;margin-left:auto"></div>');
    var st = txt('span', 'im-pop-v', '');
    st.style.cssText = 'font-size:11.5px;font-weight:700;color:var(--muted2)';
    var bt = UI.button({ label: 'Backup (exportar JSON)', icon: 'upload', variant: 'ghost' });
    bt.title = 'Baixa uma cópia completa do banco (todas as coleções) em JSON. Guarde num lugar seguro — é a sua recuperação de desastre.';
    bt.addEventListener('click', function () {
      bt.disabled = true; st.textContent = 'Lendo o banco…';
      var out = { geradoEm: new Date().toISOString(), sistema: 'GERA · Sistema A', colecoes: {} };
      var truncadas = [];
      fb().then(function (c) {
        var seq = Promise.resolve();
        BK_COLS.forEach(function (col) {
          seq = seq.then(function () {
            st.textContent = 'Lendo ' + col + '…';
            var q = c.f.query(c.f.collection(c.db, col), c.f.limit(BK_TETO));
            return c.f.getDocs(q).then(function (snap) {
              var a = [];
              snap.forEach(function (d) { a.push(Object.assign({ _id: d.id }, d.data())); });
              out.colecoes[col] = a;
              if (a.length >= BK_TETO) { truncadas.push(col); }
            });
          });
        });
        return seq.then(function () { return c; });
      }).then(function (c) {
        var nome = 'gera_backup_' + R.hojeISO() + '.json';
        var blob = new Blob([JSON.stringify(out)], { type: 'application/json' });
        var a = document.createElement('a');
        a.href = URL.createObjectURL(blob); a.download = nome;
        document.body.appendChild(a); a.click(); document.body.removeChild(a);
        setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
        var tot = 0; BK_COLS.forEach(function (k) { tot += (out.colecoes[k] || []).length; });
        st.textContent = tot + ' documento(s) exportado(s)' + (truncadas.length ? ' · ATENÇÃO: ' + truncadas.join(', ') + ' pode(m) estar truncada(s) no teto de ' + BK_TETO : '') + '. Guarde o arquivo em local seguro.';
        /* auditoria (uid = autor autenticado, regra anti-spoof) */
        return c.f.addDoc(c.f.collection(c.db, 'atividade_log'), {
          ts: Date.now(), uid: (USER && USER.uid) || null, acao: 'backup_exportado', entidade: 'sistema',
          refId: nome, antes: null, depois: { documentos: tot, truncadas: truncadas }
        }).catch(function () { });
      }).catch(function (e) {
        st.textContent = 'Falhou: ' + ((e && e.message) || 'erro ao ler o banco.');
      }).then(function () { bt.disabled = false; });
    });
    bx.appendChild(st); bx.appendChild(bt);
    top.appendChild(bx);
  }

  Guard.onReady(function (u) { USER = u; boot(); });
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
