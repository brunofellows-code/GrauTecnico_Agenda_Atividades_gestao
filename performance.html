<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance — Sistema A</title>

<link rel="stylesheet" href="theme.css">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>

<style>
/* casca padrão (mesma da Inteligência) */
.pf-app{display:flex;min-height:100vh;background:var(--bg)}
.pf-app>.ui-side{position:sticky;top:0;height:100vh}
.pf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pf-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--s1)}
.pf-h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.pf-top-r{display:flex;align-items:center;gap:12px}
.pf-mhead{display:none;flex-direction:column;gap:12px;padding:14px 16px;background:var(--s1);border-bottom:1px solid var(--border)}
.pf-mtitle{font-size:17px;font-weight:800;letter-spacing:-.02em}
.pf-seg{display:inline-flex;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.pf-seg-b{appearance:none;border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.pf-seg-b.on{background:var(--cta);color:var(--ctaText)}
.pf-mhead .pf-seg{display:flex;width:100%}
.pf-mhead .pf-seg-b{flex:1;text-align:center;padding:8px 0}
.pf-stamp{font-size:11px;font-weight:600;color:var(--muted2);padding:12px 32px 0}
.pf-banner{margin:12px 32px 0;padding:10px 14px;border-radius:11px;background:var(--chipBg);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:9px}
.pf-banner .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.pf-body{padding:18px 32px 32px}
.pf-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:13px}
.pf-card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pf-card-t{font-size:14px;font-weight:800}
.pf-i{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted2);display:inline-flex;flex:none}
.pf-i:hover{color:var(--greenText)}
.pf-i svg{display:block}
.pf-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:340px;padding:40px 20px}
.pf-state-t{font-size:16px;font-weight:800;color:var(--text)}
.pf-state-s{font-size:13px;color:var(--muted);max-width:440px;line-height:1.5}
.pf-empty2{font-size:12.5px;color:var(--muted);padding:18px 4px}
/* popover do "i" */
.pf-backdrop{position:fixed;inset:0;z-index:40;display:none}
.pf-backdrop.on{display:block}
.pf-pop{position:fixed;z-index:41;display:none;width:290px;max-width:calc(100vw - 32px);background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;box-shadow:var(--cardShadow)}
.pf-pop.on{display:block}
.pf-pop-t{font-size:12.5px;font-weight:800;margin-bottom:9px}
.pf-pop-row{margin-bottom:8px}
.pf-pop-k{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--muted2);margin-bottom:2px}
.pf-pop-v{font-size:12px;font-weight:600;color:var(--text);line-height:1.35}
/* filtro de setor (chips) */
.pf-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
.pf-chip{appearance:none;border:1px solid var(--border);background:var(--s1);color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer}
.pf-chip.on{background:var(--activeBg);border-color:var(--brand);color:var(--greenText)}
/* tabela ranking */
.pf-tblwrap{overflow-x:auto}
.pf-tbl{width:100%;border-collapse:collapse;min-width:760px}
.pf-tbl th{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.pf-tbl th .thx{display:inline-flex;align-items:center;gap:5px}
.pf-tbl td{font-size:13px;font-weight:600;color:var(--text);padding:11px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.pf-tbl tbody tr{cursor:pointer}
.pf-tbl tbody tr:hover td{background:var(--s2)}
.pf-tbl tr:last-child td{border-bottom:0}
.pf-nome{font-weight:800}
.pf-sigs{font-size:10.5px;font-weight:700;color:var(--muted2)}
.pf-scorecell{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.pf-scoredot{width:9px;height:9px;border-radius:50%;flex:none}
.pf-semresp td{background:var(--haloRed)}
.pf-semresp .pf-nome{color:var(--red)}
/* score por setor (mesma renderização do N2) */
.pf-ss-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--border)}
.pf-ss-row:first-child{border-top:0}
.pf-ss-nome{width:170px;flex:none;font-size:12.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-ss-track{flex:1;height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.pf-ss-fill{height:100%;border-radius:6px}
.pf-ss-num{width:36px;text-align:right;font-size:13px;font-weight:800}
.pf-ss-dot{width:9px;height:9px;border-radius:50%;flex:none}
/* painel da pessoa (dentro do UI.modal) */
.pf-pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.pf-pm{background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.pf-pm .k{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2)}
.pf-pm .v{font-size:16px;font-weight:800;margin-top:3px}
.pf-pm .f{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.pf-acoes-t{font-size:12px;font-weight:800;margin:6px 0 8px}
.pf-acao{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-top:1px solid var(--border);font-size:12px}
.pf-acao:first-of-type{border-top:0}
.pf-acao .a{font-weight:700;color:var(--text)}
.pf-acao .d{font-weight:600;color:var(--muted2);flex:none}
.pf-acoes-note{font-size:11px;color:var(--muted2);padding:8px 2px}
.pf-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--cardShadow)}
.pf-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}
@media (max-width:900px){
  .pf-app>.ui-side{display:none}
  .pf-top{display:none}
  .pf-mhead{display:flex}
  .pf-stamp{padding:14px 16px 0}
  .pf-banner{margin:12px 16px 0}
  .pf-body{padding:16px 16px 40px}
  .pf-ss-nome{width:96px}
  .pf-pgrid{grid-template-columns:1fr}
  .pf-dev{bottom:20px}
}
</style>
</head>
<body>

  <!-- portão de acesso (guard.js controla) -->
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="pf-dev" data-theme-toggle type="button" title="Alternar tema (temporário)"><span class="pin"></span>Tema</button>

  <div class="pf-app" id="app">
    <main class="pf-main">

      <div class="pf-top">
        <div class="pf-h1">Performance</div>
        <div class="pf-top-r">
          <div class="pf-seg">
            <button class="pf-seg-b on" type="button" data-periodo="band">Atrasadas + 30d</button>
            <button class="pf-seg-b" type="button" data-periodo="semana">Semana</button>
            <button class="pf-seg-b" type="button" data-periodo="mes">Mês</button>
          </div>
          <span id="pf-export"></span>
        </div>
      </div>

      <div class="pf-mhead">
        <div class="pf-mtitle">Performance</div>
        <div class="pf-seg">
          <button class="pf-seg-b on" type="button" data-periodo="band">Atrasadas + 30d</button>
          <button class="pf-seg-b" type="button" data-periodo="semana">Semana</button>
          <button class="pf-seg-b" type="button" data-periodo="mes">Mês</button>
        </div>
      </div>

      <div class="pf-stamp" id="pf-stamp">Desempenho por pessoa, calculado das ocorrências reais.</div>
      <div class="pf-banner"><span class="dot"></span>Sem medição retroativa — os indicadores nascem do uso: ocorrências e atividade_log registrados a partir da adoção do sistema.</div>

      <div class="pf-body" id="pf-body"></div>

    </main>
  </div>

  <div class="pf-backdrop" id="pf-backdrop"></div>
  <div class="pf-pop" id="pf-pop"></div>

  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script>
  /* ===== Performance: ranking REAL por pessoa via KPI.computarPorPessoa (board expandido reaproveitado). Zero mock. ===== */
  (function () {
  'use strict';

  var USER = { name: '—', profile: 'Visualizador', initials: '—' };
  var PERIODO = 'band';
  var FILTRO = 'TODOS';   /* sigla de setor ou TODOS */
  var PP = null;          /* último retorno de computarPorPessoa */
  var MODELO = null;      /* último retorno de computar (seção por setor) */
  var LOG = [];           /* atividade_log recente (query global única) */

  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function haloOf(tone) { return 'halo' + tone.charAt(0).toUpperCase() + tone.slice(1); }
  function tomToken(t) { return t === 'ok' ? 'green' : t === 'warn' ? 'amber' : t === 'bad' ? 'red' : 'muted2'; }
  function fmtPct(v) { return v == null ? '—' : v + '%'; }
  function fmtDias(v) { return v == null ? '—' : String(v).replace('.', ',') + ' d'; }
  function fmtNum(v) { return String(v).replace('.', ','); }
  function brData(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function brDataHora(ms) {
    var d = new Date(Number(ms));
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  function rotuloPeriodo(p) { return ({ band: 'atrasadas + 30 dias', semana: 'esta semana', mes: 'este mês' })[p] || p; }

  /* ---------- popover do "i" (mesmo padrão da Inteligência) ---------- */
  var POP, BACK;
  function infoBtn(data) {
    var b = el('<button class="pf-i" type="button" aria-label="Como é calculado"></button>');
    b.appendChild(UI.icon('info', 14));
    b.addEventListener('click', function (ev) { ev.stopPropagation(); openPop(ev, data); });
    return b;
  }
  function openPop(ev, d) {
    POP.innerHTML = '';
    POP.appendChild(el('<div class="pf-pop-t">' + d.title + '</div>'));
    [['FÓRMULA', d.formula], ['DADOS / COLUNAS', d.dados], ['NÚMEROS DESTE CÁLCULO', d.numeros]].forEach(function (r) {
      var row = el('<div class="pf-pop-row"></div>');
      row.appendChild(el('<div class="pf-pop-k">' + r[0] + '</div>'));
      row.appendChild(el('<div class="pf-pop-v">' + r[1] + '</div>'));
      POP.appendChild(row);
    });
    BACK.classList.add('on'); POP.classList.add('on');
    if (window.innerWidth <= 900) {
      POP.style.left = '50%'; POP.style.transform = 'translateX(-50%)'; POP.style.top = ''; POP.style.bottom = '20px';
    } else {
      POP.style.transform = ''; POP.style.bottom = '';
      var pr = POP.getBoundingClientRect();
      POP.style.left = Math.max(12, Math.min(ev.clientX + 12, window.innerWidth - pr.width - 12)) + 'px';
      POP.style.top = Math.max(12, Math.min(ev.clientY + 12, window.innerHeight - pr.height - 12)) + 'px';
    }
  }
  function closePop() { POP.classList.remove('on'); BACK.classList.remove('on'); }

  /* ---------- ações do log em linguagem leiga ---------- */
  var ACOES = {
    criar_atividade: 'Criou atividade', editar_atividade: 'Editou atividade',
    inativar_atividade: 'Inativou atividade', reativar_atividade: 'Reativou atividade',
    concluir_ocorrencia: 'Concluiu ocorrência', reabrir_ocorrencia: 'Reabriu ocorrência',
    iniciar_ocorrencia: 'Iniciou ocorrência', pendenciar_ocorrencia: 'Voltou p/ pendente',
    editar_ocorrencia: 'Editou ocorrência', solicitar_data: 'Solicitou nova data',
    aprovar_data: 'Aprovou nova data', rejeitar_data: 'Rejeitou nova data',
    decisao_para_atividade: 'Converteu decisão em atividade',
    criar_evento: 'Criou evento', editar_evento: 'Editou evento', realizar_evento: 'Marcou evento como realizado'
  };
  function acaoLabel(a) { return ACOES[a] || (a || 'ação'); }

  /* ---------- "i" das colunas (fórmula + dados + agregado do recorte) ---------- */
  function colInfos(lista) {
    var tPrev = 0, tConcl = 0, tCT = 0, tNP = 0, tPar = 0, tCarga = 0, tRe = 0, tTot = 0;
    lista.forEach(function (p) {
      tPrev += p.previstas; tConcl += p.concluidasAteHoje; tCT += p.concluidasTotal;
      tNP += p.noPrazo; tPar += p.pares; tCarga += p.carga; tRe += p.reprogramadas; tTot += p.total;
    });
    return {
      score: { title: 'Score da pessoa (0–100)', formula: 'score = 0,5×aderência + 0,3×(100 − %atrasadas) + 0,2×(100 − aging×12,5). Pesos declarados: aderência 50 · atrasadas 30 · aging 20. Semáforo: ≥80 verde · 60–79 âmbar · <60 vermelho. Sem previstas na janela → sem score (—).', dados: 'ocorrências da pessoa na janela (mesmo motor da Inteligência)', numeros: lista.length + ' pessoa(s) no recorte; ordenado do pior para o melhor (onde agir primeiro)' },
      ader: { title: 'Aderência à rotina', formula: 'concluídas até hoje ÷ previstas até hoje × 100 (previstas exclui puladas)', dados: 'ocorrências da pessoa com data efetiva ≤ hoje', numeros: 'recorte: ' + tConcl + ' ÷ ' + tPrev + ' previstas' },
      prazo: { title: 'Conclusão no prazo', formula: 'concluídas com DIA CIVIL LOCAL (Salvador) da conclusão ≤ data efetiva ÷ concluídas × 100', dados: 'ocorrências concluídas: concluidaEm (carimbo real) × data efetiva', numeros: 'recorte: ' + tNP + ' no prazo de ' + tCT + ' concluída(s)' },
      ciclo: { title: 'Tempo de ciclo', formula: 'média(concluidaEm − iniciadaEm) em dias — SÓ quando os dois carimbos existem; sem o par → "—" (nunca inventa)', dados: 'ocorrências com iniciadaEm E concluidaEm', numeros: 'recorte: ' + tPar + ' par(es) medido(s)' },
      carga: { title: 'Carga (WIP)', formula: 'ocorrências abertas (pendente + em andamento + reprogramada) atribuídas à pessoa na janela', dados: 'status das ocorrências', numeros: 'recorte: ' + tCarga + ' aberta(s)' },
      reprog: { title: 'Reprogramação', formula: 'reprogramadas ÷ total de ocorrências da pessoa × 100', dados: 'status das ocorrências da janela', numeros: 'recorte: ' + tRe + ' ÷ ' + tTot }
    };
  }

  /* ---------- filtro por setor ---------- */
  function chipsSetores(pp) {
    var set = {};
    pp.pessoas.forEach(function (p) { p.setores.forEach(function (s) { if (s !== '—') { set[s] = true; } }); });
    if (pp.semResp) { pp.semResp.setores.forEach(function (s) { if (s !== '—') { set[s] = true; } }); }
    var sigs = Object.keys(set).sort();
    var wrap = el('<div class="pf-chips"></div>');
    function chip(sig, label) {
      var b = el('<button type="button" class="pf-chip' + (FILTRO === sig ? ' on' : '') + '"></button>');
      b.textContent = label;
      b.addEventListener('click', function () { FILTRO = sig; render(); });
      return b;
    }
    wrap.appendChild(chip('TODOS', 'Toda a escola'));
    sigs.forEach(function (s) { wrap.appendChild(chip(s, s)); });
    return wrap;
  }
  function passaFiltro(p) { return FILTRO === 'TODOS' || p.setores.indexOf(FILTRO) >= 0; }

  /* ---------- painel da pessoa (modal padrão) ---------- */
  function abrirPessoa(p) {
    UI.modal({
      title: p.nome,
      width: 520,
      body: function () {
        var box = document.createElement('div');
        var grid = el('<div class="pf-pgrid"></div>');
        function pm(k, v, f) {
          var d = el('<div class="pf-pm"></div>');
          d.appendChild(el('<div class="k">' + k + '</div>'));
          d.appendChild(el('<div class="v">' + v + '</div>'));
          d.appendChild(el('<div class="f">' + f + '</div>'));
          return d;
        }
        grid.appendChild(pm('Score', p.score == null ? '—' : p.score, p.score == null ? 'sem previstas na janela' : '0,5×' + p.comp.compA + ' + 0,3×' + p.comp.compB + ' + 0,2×' + p.comp.compC));
        grid.appendChild(pm('Aderência', fmtPct(p.ader), p.concluidasAteHoje + ' ÷ ' + p.previstas + ' previstas até hoje'));
        grid.appendChild(pm('No prazo', fmtPct(p.pctNoPrazo), p.noPrazo + ' de ' + p.concluidasTotal + ' concluída(s), por dia civil local'));
        grid.appendChild(pm('Ciclo', fmtDias(p.cicloDias), p.pares ? p.pares + ' par(es) iniciada→concluída' : 'sem par iniciada/concluída — não inventa'));
        grid.appendChild(pm('Carga (WIP)', String(p.carga), 'abertas atribuídas na janela'));
        grid.appendChild(pm('Reprogramação', p.reprogPct + '%', p.reprogramadas + ' ÷ ' + p.total + ' ocorrências'));
        grid.appendChild(pm('Atrasadas', String(p.atrasadas), p.atrasadas ? 'aging médio ' + fmtNum(p.agingMedio) + ' d' : 'nenhuma agora'));
        grid.appendChild(pm('Throughput', fmtNum(p.thr4) + '/sem', p.thr4n + ' concluída(s) nos últimos 28 dias ÷ 4'));
        box.appendChild(grid);
        box.appendChild(el('<div class="pf-acoes-t">Últimas ações (atividade_log)</div>'));
        if (!p.uid) {
          box.appendChild(el('<div class="pf-acoes-note">Sem pessoa vinculada — atribua um responsável às atividades.</div>'));
        } else {
          var acoes = LOG.filter(function (r) { return r.uid === p.uid; }).slice(0, 10);
          if (!acoes.length) {
            box.appendChild(el('<div class="pf-acoes-note">Sem ações desta pessoa nas últimas 200 entradas do log (ou log indisponível agora).</div>'));
          } else {
            acoes.forEach(function (r) {
              var row = el('<div class="pf-acao"></div>');
              var a = el('<span class="a"></span>'); a.textContent = acaoLabel(r.acao); row.appendChild(a);
              row.appendChild(el('<span class="d">' + (r.ts ? brDataHora(r.ts) : '—') + '</span>'));
              box.appendChild(row);
            });
          }
        }
        return box;
      },
      footer: function (close) { return [UI.button({ label: 'Fechar', variant: 'ghost', onClick: close })]; }
    });
  }

  /* ---------- score por setor (mesmos dados/render do N2) ---------- */
  function scoreSetores(m) {
    var base = m.porSetor.filter(function (s) { return s.sig !== '—' && s.previstas > 0; }).map(function (s) {
      return { sigla: s.sig, ader: s.aderencia == null ? 0 : s.aderencia, atrasadas: s.atrasadas, agingMedio: s.agingMedio || 0, carga: s.carga || 0 };
    });
    if (!base.length) { return null; }
    var calc = base.map(function (s) {
      var pctAtr = s.carga ? Math.round(s.atrasadas / s.carga * 100) : 0;
      return { sigla: s.sigla, sc: KPI._score(s.ader, pctAtr, s.agingMedio) };
    }).sort(function (a, b) { return a.sc.score - b.sc.score; });
    var nums = calc.map(function (x) { return x.sigla + ': ' + x.sc.score; }).join(' · ');
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Score por setor (0–100)</div>'));
    h.appendChild(infoBtn({ title: 'Score composto por setor', formula: 'score = 0,5×aderência + 0,3×(100 − %atrasadas) + 0,2×(100 − aging×12,5). Pesos: aderência 50 · atrasadas 30 · aging 20. Semáforo: ≥80 verde · 60–79 âmbar · <60 vermelho.', dados: 'mesmos números da Inteligência (ocorrências por setor até hoje + abertas por setor)', numeros: nums }));
    card.appendChild(h);
    calc.forEach(function (x) {
      var tok = tomToken(x.sc.tom);
      var row = el('<div class="pf-ss-row"></div>');
      row.appendChild(el('<span class="pf-ss-dot" style="background:var(--' + tok + ');box-shadow:0 0 0 3px var(--' + haloOf(tok) + ')"></span>'));
      var nome = el('<span class="pf-ss-nome"></span>'); nome.textContent = KPI.nomeSetor(x.sigla, m.setores); nome.title = x.sigla;
      row.appendChild(nome);
      var tr = el('<div class="pf-ss-track"></div>');
      tr.appendChild(el('<div class="pf-ss-fill" style="width:' + x.sc.score + '%;background:var(--' + tok + ')"></div>'));
      row.appendChild(tr);
      row.appendChild(el('<span class="pf-ss-num" style="color:var(--' + tok + ')">' + x.sc.score + '</span>'));
      card.appendChild(row);
    });
    return card;
  }

  /* ---------- render ---------- */
  function render() {
    var body = document.getElementById('pf-body');
    body.innerHTML = '';
    var lista = PP.pessoas.filter(passaFiltro);
    var semResp = (PP.semResp && passaFiltro(PP.semResp)) ? PP.semResp : null;

    body.appendChild(chipsSetores(PP));

    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Ranking por pessoa — pior score primeiro (onde agir)</div>'));
    h.appendChild(infoBtn({ title: 'Ranking por pessoa', formula: 'todas as métricas saem das ocorrências REAIS da janela, agregadas por responsável (responsavelUid). Toque numa linha para os números individuais e as últimas ações.', dados: 'mesmo board expandido da Inteligência — nenhuma expansão duplicada', numeros: lista.length + ' pessoa(s)' + (semResp ? ' + linha de higiene (sem responsável)' : '') }));
    card.appendChild(h);

    if (!lista.length && !semResp) {
      card.appendChild(el('<div class="pf-empty2">Nenhuma pessoa com ocorrências neste recorte.</div>'));
      body.appendChild(card);
      var so = MODELO ? scoreSetores(MODELO) : null;
      if (so) { body.appendChild(so); }
      return;
    }

    var infos = colInfos(lista.concat(semResp ? [semResp] : []));
    var wrap = el('<div class="pf-tblwrap"></div>');
    var tbl = el('<table class="pf-tbl"></table>');
    var thead = el('<thead><tr></tr></thead>');
    var trh = thead.firstChild;
    function th(label, info) {
      var t = document.createElement('th');
      var x = el('<span class="thx"></span>');
      x.appendChild(document.createTextNode(label));
      if (info) { x.appendChild(infoBtn(info)); }
      t.appendChild(x);
      trh.appendChild(t);
    }
    th('Pessoa', null); th('Score', infos.score); th('Aderência', infos.ader); th('No prazo', infos.prazo);
    th('Ciclo', infos.ciclo); th('Carga', infos.carga); th('Reprog.', infos.reprog);
    tbl.appendChild(thead);
    var tbody = document.createElement('tbody');

    function linha(p, semRespRow) {
      var tr = document.createElement('tr');
      if (semRespRow) { tr.className = 'pf-semresp'; }
      var tdN = document.createElement('td');
      var nm = el('<div class="pf-nome"></div>'); nm.textContent = p.nome; tdN.appendChild(nm);
      var sg = el('<div class="pf-sigs"></div>'); sg.textContent = p.setores.join(' · ') || '—'; tdN.appendChild(sg);
      tr.appendChild(tdN);
      var tdS = document.createElement('td');
      var tok = tomToken(p.tom);
      var sc = el('<span class="pf-scorecell"></span>');
      sc.appendChild(el('<span class="pf-scoredot" style="background:var(--' + tok + ');box-shadow:0 0 0 3px var(--' + haloOf(tok === 'muted2' ? 'green' : tok) + ')"></span>'));
      sc.appendChild(el('<span style="color:var(--' + tok + ')">' + (p.score == null ? '—' : p.score) + '</span>'));
      tdS.appendChild(sc); tr.appendChild(tdS);
      [fmtPct(p.ader), fmtPct(p.pctNoPrazo), fmtDias(p.cicloDias), String(p.carga), p.reprogPct + '%'].forEach(function (v) {
        var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
      });
      tr.addEventListener('click', function () { abrirPessoa(p); });
      return tr;
    }
    lista.forEach(function (p) { tbody.appendChild(linha(p, false)); });
    if (semResp) { tbody.appendChild(linha(semResp, true)); }
    tbl.appendChild(tbody);
    wrap.appendChild(tbl);
    card.appendChild(wrap);
    body.appendChild(card);

    var so = MODELO ? scoreSetores(MODELO) : null;
    if (so) { body.appendChild(so); }
  }

  /* ---------- estados + boot ---------- */
  function showState(title, sub) {
    var body = document.getElementById('pf-body'); body.innerHTML = '';
    var box = el('<div class="pf-state"></div>');
    var t = el('<div class="pf-state-t"></div>'); t.textContent = title; box.appendChild(t);
    if (sub) { var s = el('<div class="pf-state-s"></div>'); s.textContent = sub; box.appendChild(s); }
    body.appendChild(box);
  }

  function carregar() {
    showState('Calculando desempenho…', 'Lendo as ocorrências e o log de ações.');
    Promise.all([
      KPI.carregar(PERIODO),
      KPI.lerLogRecente()
    ]).then(function (r) {
      var ctx = r[0];
      LOG = r[1] || [];
      MODELO = KPI.computar(ctx);
      PP = KPI.computarPorPessoa(ctx);
      document.getElementById('pf-stamp').textContent =
        'Janela: ' + rotuloPeriodo(PERIODO) + ' (' + brData(ctx.janela.jIni) + ' a ' + brData(ctx.janela.jFim) + ') · ' +
        PP.pessoas.length + ' pessoa(s) com ocorrências · ' + ctx.board.length + ' ocorrências.';
      if (!ctx.ativ.length) {
        showState('Ainda não há atividades', 'Cadastre atividades com responsável para medir o desempenho.');
        return;
      }
      render();
    }).catch(function (e) {
      showState('Não consegui calcular o desempenho', (e && e.message) || 'Erro ao ler o banco.');
    });
  }

  function setPeriodo(p) { if (p === PERIODO) { return; } PERIODO = p; carregar(); }
  function wireSeg(group) {
    group.addEventListener('click', function (e) {
      var b = e.target.closest('.pf-seg-b'); if (!b) { return; }
      document.querySelectorAll('.pf-seg .pf-seg-b').forEach(function (x) {
        if (x.getAttribute('data-periodo') === b.getAttribute('data-periodo')) { x.classList.add('on'); } else { x.classList.remove('on'); }
      });
      setPeriodo(b.getAttribute('data-periodo') || 'band');
    });
  }

  function renderShell() {
    POP = document.getElementById('pf-pop');
    BACK = document.getElementById('pf-backdrop');
    BACK.addEventListener('click', closePop);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); } });
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Performance', user: USER }), app.firstChild);
    var exp = document.getElementById('pf-export');
    if (exp) { var rb = UI.button({ label: 'Atualizar', icon: 'upload', variant: 'ghost' }); rb.addEventListener('click', carregar); exp.appendChild(rb); }
    document.querySelectorAll('.pf-seg').forEach(wireSeg);
    carregar();
  }

  Guard.onReady(function (u) { USER = u; renderShell(); });
  })();
  </script>
</body>
</html>
