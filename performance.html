<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Performance — GERA</title>

<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
  <script src="mnav.js"></script>

<style>
/* casca padrão (mesma da Inteligência) */
.pf-app{display:flex;min-height:100vh;background:var(--bg)}
.pf-app>.ui-side{position:sticky;top:0;height:100vh}
.pf-main{flex:1;min-width:0;display:flex;flex-direction:column}
.pf-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--s1)}
.pf-h1{font-size:21px;font-weight:800;letter-spacing:-.02em}
.pf-top-r{display:flex;align-items:center;gap:12px}
.pf-mhead{display:none;flex-direction:column;gap:12px;padding:14px 16px;background:var(--s1);border-bottom:1px solid var(--border)}
.pf-mtitle{font-size:17px;font-weight:800;letter-spacing:-.02em}
.pf-seg{display:inline-flex;background:var(--s2);border:1px solid var(--border);border-radius:10px;padding:3px;gap:2px}
.pf-seg-b{appearance:none;border:0;background:transparent;font-family:inherit;font-size:12.5px;font-weight:700;color:var(--muted);padding:7px 14px;border-radius:7px;cursor:pointer}
.pf-seg-b.on{background:var(--cta);color:var(--ctaText)}
.pf-mhead .pf-seg{display:flex;width:100%}
.pf-mhead .pf-seg-b{flex:1;text-align:center;padding:8px 0}
.pf-stamp{font-size:11px;font-weight:600;color:var(--muted2);padding:12px 32px 0}
.pf-banner{margin:12px 32px 0;padding:10px 14px;border-radius:11px;background:var(--chipBg);border:1px solid var(--border);font-size:12px;font-weight:700;color:var(--muted);display:flex;align-items:center;gap:9px}
.pf-banner .dot{width:8px;height:8px;border-radius:50%;background:var(--orange);flex:none}
.pf-body{padding:18px 32px 32px}
.pf-card{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:18px;margin-bottom:13px}
.pf-card-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.pf-card-t{font-size:14px;font-weight:800}
.pf-i{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted2);display:inline-flex;flex:none}
.pf-i:hover{color:var(--greenText)}
.pf-i svg{display:block}
.pf-state{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:8px;min-height:340px;padding:40px 20px}
.pf-state-t{font-size:16px;font-weight:800;color:var(--text)}
.pf-state-s{font-size:13px;color:var(--muted);max-width:440px;line-height:1.5}
.pf-empty2{font-size:12.5px;color:var(--muted);padding:18px 4px}
/* popover do "i" */
.pf-backdrop{position:fixed;inset:0;z-index:40;display:none}
.pf-backdrop.on{display:block}
.pf-pop{position:fixed;z-index:41;display:none;width:290px;max-width:calc(100vw - 32px);background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;box-shadow:var(--cardShadow)}
.pf-pop.on{display:block}
.pf-pop-t{font-size:12.5px;font-weight:800;margin-bottom:9px}
.pf-pop-row{margin-bottom:8px}
.pf-pop-k{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--muted2);margin-bottom:2px}
.pf-pop-v{font-size:12px;font-weight:600;color:var(--text);line-height:1.35}
/* filtro de setor (chips) */
.pf-chips{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:13px}
.pf-chip{appearance:none;border:1px solid var(--border);background:var(--s1);color:var(--muted);font-family:inherit;font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer}
.pf-chip.on{background:var(--activeBg);border-color:var(--brand);color:var(--greenText)}
/* tabela ranking */
.pf-tblwrap{overflow-x:auto}

/* ===== REGRA GLOBAL: 3 heróis + grupos por severidade + barras ===== */
.pf-heroes{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:13px;margin-bottom:13px}
.pf-hero{background:var(--s1);border:1px solid var(--border);border-radius:16px;padding:16px 18px}
.pf-hlab{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--muted2);margin-bottom:8px}
.pf-hnum{font-size:30px;font-weight:800;line-height:1;color:var(--text)}
.pf-hnum .pf-hdot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:9px;vertical-align:middle}
.pf-hsub{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:7px;line-height:1.4}
.pf-bars{display:flex;flex-direction:column;gap:9px}
.pf-bar{display:flex;align-items:center;gap:10px}
.pf-bname{width:52px;flex:none;font-size:11.5px;font-weight:800;color:var(--text);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;cursor:default}
.pf-btrack{flex:1;height:14px;background:var(--chipBg);border:1px solid var(--border);border-radius:8px;overflow:hidden}
.pf-bfill{height:100%;border-radius:7px;min-width:2px}
.pf-bval{width:84px;flex:none;font-size:11.5px;font-weight:700;color:var(--muted);text-align:right}
.pf-bval .lt{color:var(--red);font-weight:800}
.pf-groups{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:13px;align-items:start;margin-bottom:13px}
.pf-grp{background:var(--sideBg);border:1px solid var(--border);border-radius:14px;padding:11px}
.pf-grphd{display:flex;align-items:center;gap:8px;padding:3px 4px 10px}
.pf-grpdot{width:9px;height:9px;border-radius:50%;flex:none}
.pf-grpname{font-size:11.5px;font-weight:800;letter-spacing:.05em;text-transform:uppercase;color:var(--text)}
.pf-grpsp{flex:1}
.pf-grpcount{font-size:11px;font-weight:800;color:var(--muted2);background:var(--chipBg);border:1px solid var(--border);border-radius:20px;padding:1px 8px}
.pf-pcard{display:flex;flex-direction:column;gap:5px;background:var(--s1);border:1px solid var(--border);border-radius:11px;padding:11px 12px;cursor:pointer;margin-bottom:8px}
.pf-pcard:hover{background:var(--s2)}
.pf-pcard:last-child{margin-bottom:0}
.pf-pcn{font-size:13px;font-weight:700;color:var(--text)}
.pf-pcs{font-size:10.5px;font-weight:700;color:var(--muted2)}
.pf-pcm{display:flex;align-items:center;gap:10px;font-size:11.5px;font-weight:700;color:var(--muted)}
.pf-pcm .sc{display:inline-flex;align-items:center;gap:5px}
.pf-pcm .sc .d{width:8px;height:8px;border-radius:50%;display:inline-block}
.pf-pcm .lt{color:var(--red);font-weight:800}
.pf-hyg{display:flex;align-items:center;gap:10px;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:11px 14px;margin-bottom:13px;cursor:pointer}
.pf-hyg:hover{background:var(--s2)}
.pf-hygdot{width:9px;height:9px;border-radius:50%;background:var(--amber);flex:none}
.pf-hygt{font-size:12.5px;font-weight:700;color:var(--text)}
.pf-hygs{font-size:11.5px;font-weight:600;color:var(--muted)}
.pf-tbl{width:100%;border-collapse:collapse;min-width:760px}
.pf-tbl th{font-size:10.5px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2);text-align:left;padding:8px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.pf-tbl th .thx{display:inline-flex;align-items:center;gap:5px}
.pf-tbl td{font-size:13px;font-weight:600;color:var(--text);padding:11px 10px;border-bottom:1px solid var(--border);white-space:nowrap}
.pf-tbl tbody tr{cursor:pointer}
.pf-tbl tbody tr:hover td{background:var(--s2)}
.pf-tbl tr:last-child td{border-bottom:0}
.pf-nome{font-weight:800}
.pf-sigs{font-size:10.5px;font-weight:700;color:var(--muted2)}
.pf-scorecell{display:inline-flex;align-items:center;gap:8px;font-weight:800}
.pf-scoredot{width:9px;height:9px;border-radius:50%;flex:none}
.pf-semresp td{background:var(--haloRed)}
.pf-semresp .pf-nome{color:var(--red)}
/* score por setor (mesma renderização do N2) */
.pf-ss-row{display:flex;align-items:center;gap:12px;padding:10px 2px;border-top:1px solid var(--border)}
.pf-ss-row:first-child{border-top:0}
.pf-ss-nome{width:170px;flex:none;font-size:12.5px;font-weight:700;color:var(--text);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pf-ss-track{flex:1;height:12px;background:var(--track);border-radius:6px;overflow:hidden}
.pf-ss-fill{height:100%;border-radius:6px}
.pf-ss-num{width:36px;text-align:right;font-size:13px;font-weight:800}
.pf-ss-dot{width:9px;height:9px;border-radius:50%;flex:none}
/* painel da pessoa (dentro do UI.modal) */
.pf-pgrid{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin-bottom:14px}
.pf-pm{background:var(--s2);border:1px solid var(--border);border-radius:11px;padding:10px 12px}
.pf-pm .k{font-size:10px;font-weight:800;letter-spacing:.04em;text-transform:uppercase;color:var(--muted2)}
.pf-pm .v{font-size:16px;font-weight:800;margin-top:3px}
.pf-pm .f{font-size:10.5px;font-weight:600;color:var(--muted);margin-top:3px;line-height:1.35}
.pf-acoes-t{font-size:12px;font-weight:800;margin:6px 0 8px}
.pf-acao{display:flex;justify-content:space-between;gap:10px;padding:7px 2px;border-top:1px solid var(--border);font-size:12px}
.pf-acao:first-of-type{border-top:0}
.pf-acao .a{font-weight:700;color:var(--text)}
.pf-acao .d{font-weight:600;color:var(--muted2);flex:none}
.pf-acoes-note{font-size:11px;color:var(--muted2);padding:8px 2px}
.pf-dev{position:fixed;left:14px;bottom:14px;z-index:30;display:inline-flex;align-items:center;gap:8px;cursor:pointer;border:0;font-family:inherit;font-size:12px;font-weight:700;padding:9px 13px;border-radius:10px;background:var(--cta);color:var(--ctaText);box-shadow:var(--cardShadow)}
.pf-dev .pin{width:8px;height:8px;border-radius:50%;background:var(--ctaText)}
@media (max-width:900px){
  .pf-app>.ui-side{display:none}
  .pf-top{display:none}
  .pf-mhead{display:flex}
  .pf-stamp{padding:14px 16px 0}
  .pf-banner{margin:12px 16px 0}
  .pf-body{padding:16px 16px 40px}
  .pf-ss-nome{width:96px}
  .pf-pgrid{grid-template-columns:1fr}
  .pf-dev{bottom:20px}
}
/* ---------- C4: drill-down — itens que compõem cada métrica ---------- */
.pf-pm.dd-click,.pf-ss-row.dd-click{cursor:pointer}
.pf-pm.dd-click:hover{border-color:var(--brand)}
.pf-pm.dd-click.on{border-color:var(--brand);background:var(--activeBg)}
.pf-ss-row.dd-click:hover .pf-ss-nome{color:var(--text)}
.dd-count{font-size:12px;color:var(--muted);margin:0 0 8px}
.dd-list{display:flex;flex-direction:column;gap:6px;max-height:34vh;overflow:auto}
.dd-row{display:flex;align-items:center;gap:10px;padding:8px 11px;border:1px solid var(--border);border-radius:10px;background:var(--s1);min-width:0}
.dd-tit{font-size:13px;font-weight:600;color:var(--text);flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dd-sig{font-size:10.5px;font-weight:800;letter-spacing:.4px;color:var(--muted);background:var(--chipBg);border:1px solid var(--border);border-radius:6px;padding:2px 6px;white-space:nowrap}
.dd-meta{font-size:11.5px;color:var(--muted);white-space:nowrap}
.dd-late{color:var(--red);font-weight:700}
.dd-more,.dd-empty{font-size:12px;color:var(--muted2);text-align:center;padding:8px}
@media(max-width:700px){.dd-row{flex-wrap:wrap}.dd-tit{flex-basis:100%;white-space:normal}}
</style>
</head>
<body>

  <!-- portão de acesso (guard.js controla) -->
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <button class="pf-dev" data-theme-toggle type="button" title="Alternar tema (temporário)"><span class="pin"></span>Tema</button>

  <div class="pf-app" id="app">
    <main class="pf-main">

      <div class="pf-top">
        <div class="pf-h1">Performance</div>
        <div class="pf-top-r">
          <div class="pf-seg">
            <button class="pf-seg-b on" type="button" data-periodo="band">Atrasadas + 30d</button>
            <button class="pf-seg-b" type="button" data-periodo="semana">Semana</button>
            <button class="pf-seg-b" type="button" data-periodo="mes">Mês</button>
          </div>
          <span id="pf-export"></span>
        </div>
      </div>

      <div class="pf-mhead">
        <div class="pf-mtitle">Performance</div>
        <div class="pf-seg">
          <button class="pf-seg-b on" type="button" data-periodo="band">Atrasadas + 30d</button>
          <button class="pf-seg-b" type="button" data-periodo="semana">Semana</button>
          <button class="pf-seg-b" type="button" data-periodo="mes">Mês</button>
        </div>
      </div>

      <div class="pf-stamp" id="pf-stamp">Desempenho por pessoa, calculado das ocorrências reais.</div>
      <div class="pf-banner"><span class="dot"></span>Sem medição retroativa — os indicadores nascem do uso: ocorrências e atividade_log registrados a partir da adoção do sistema.</div>

      <div class="pf-body" id="pf-body"></div>

    </main>
  </div>

  <div class="pf-backdrop" id="pf-backdrop"></div>
  <div class="pf-pop" id="pf-pop"></div>

  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script src="lentes.js"></script>
  <script>
  /* ===== Performance: ranking REAL por pessoa via KPI.computarPorPessoa (board expandido reaproveitado). Zero mock. ===== */
  (function () {
  'use strict';

  var USER = { name: '—', profile: 'Visualizador', initials: '—' };
  var PERIODO = 'band';
  var FILTRO = 'TODOS';   /* sigla de setor ou TODOS */
  var PP = null;          /* último retorno de computarPorPessoa */
  var RANK = null;        /* F1-G: computarRanking (3 lentes) */
  var USUARIOS = [];      /* F1-G: lista p/ a lente LÍDER (setoresLiderados) */
  var LENTE = 'setores';  /* F1-G: setores | lideres | usuarios */
  var MODELO = null;      /* último retorno de computar (seção por setor) */
  var LOG = [];           /* atividade_log recente (query global única) */
  var BOARD = [];         /* C4: board expandido retido p/ o drill-down (zero query extra) */
  var HOJE = null;        /* C4: dia civil LOCAL da última carga */

  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function txt(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } e.textContent = text == null ? '' : text; return e; }
  function haloOf(tone) { return 'halo' + tone.charAt(0).toUpperCase() + tone.slice(1); }
  function tomToken(t) { return t === 'ok' ? 'green' : t === 'warn' ? 'amber' : t === 'bad' ? 'red' : 'muted2'; }
  function fmtPct(v) { return v == null ? '—' : v + '%'; }
  /* M3: par iniciada→concluída no mesmo dia dá ciclo 0 (matemática certa,
     leitura ruim) — todo ciclo MEDIDO abaixo de 1 dia exibe "<1 d". */
  function fmtDias(v) { if (v == null) { return '—'; } if (v < 1) { return '<1 d'; } return String(v).replace('.', ',') + ' d'; }
  function fmtNum(v) { return String(v).replace('.', ','); }
  function brData(iso) { var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function brDataHora(ms) {
    var d = new Date(Number(ms));
    function z(n) { return (n < 10 ? '0' : '') + n; }
    return z(d.getDate()) + '/' + z(d.getMonth() + 1) + ' ' + z(d.getHours()) + ':' + z(d.getMinutes());
  }
  function rotuloPeriodo(p) { return ({ band: 'atrasadas + 30 dias', semana: 'esta semana', mes: 'este mês' })[p] || p; }

  /* ---------- popover do "i" (mesmo padrão da Inteligência) ---------- */
  var POP, BACK;
  function infoBtn(data) {
    var b = el('<button class="pf-i" type="button" aria-label="Como é calculado"></button>');
    b.appendChild(UI.icon('info', 14));
    b.addEventListener('click', function (ev) { ev.stopPropagation(); openPop(ev, data); });
    return b;
  }
  function openPop(ev, d) {
    POP.innerHTML = '';
    POP.appendChild(el('<div class="pf-pop-t">' + d.title + '</div>'));
    [['FÓRMULA', d.formula], ['DADOS / COLUNAS', d.dados], ['NÚMEROS DESTE CÁLCULO', d.numeros]].forEach(function (r) {
      var row = el('<div class="pf-pop-row"></div>');
      row.appendChild(el('<div class="pf-pop-k">' + r[0] + '</div>'));
      row.appendChild(el('<div class="pf-pop-v">' + r[1] + '</div>'));
      POP.appendChild(row);
    });
    BACK.classList.add('on'); POP.classList.add('on');
    if (window.innerWidth <= 900) {
      POP.style.left = '50%'; POP.style.transform = 'translateX(-50%)'; POP.style.top = ''; POP.style.bottom = '20px';
    } else {
      POP.style.transform = ''; POP.style.bottom = '';
      var pr = POP.getBoundingClientRect();
      POP.style.left = Math.max(12, Math.min(ev.clientX + 12, window.innerWidth - pr.width - 12)) + 'px';
      POP.style.top = Math.max(12, Math.min(ev.clientY + 12, window.innerHeight - pr.height - 12)) + 'px';
    }
  }
  function closePop() { POP.classList.remove('on'); BACK.classList.remove('on'); }

  /* ---------- ações do log em linguagem leiga ---------- */
  var ACOES = {
    criar_atividade: 'Criou atividade', editar_atividade: 'Editou atividade',
    inativar_atividade: 'Inativou atividade', reativar_atividade: 'Reativou atividade',
    concluir_ocorrencia: 'Concluiu ocorrência', reabrir_ocorrencia: 'Reabriu ocorrência',
    iniciar_ocorrencia: 'Iniciou ocorrência', pendenciar_ocorrencia: 'Voltou p/ pendente',
    editar_ocorrencia: 'Editou ocorrência', solicitar_data: 'Solicitou nova data',
    aprovar_data: 'Aprovou nova data', rejeitar_data: 'Rejeitou nova data',
    decisao_para_atividade: 'Converteu decisão em atividade',
    criar_evento: 'Criou evento', editar_evento: 'Editou evento', realizar_evento: 'Marcou evento como realizado'
  };
  function acaoLabel(a) { return ACOES[a] || (a || 'ação'); }

  /* ---------- "i" das colunas (fórmula + dados + agregado do recorte) ---------- */
  function colInfos(lista) {
    var tPrev = 0, tConcl = 0, tCT = 0, tNP = 0, tPar = 0, tCarga = 0, tRe = 0, tTot = 0;
    lista.forEach(function (p) {
      tPrev += p.previstas; tConcl += p.concluidasAteHoje; tCT += p.concluidasTotal;
      tNP += p.noPrazo; tPar += p.pares; tCarga += p.carga; tRe += p.reprogramadas; tTot += p.total;
    });
    return {
      score: { title: 'Score da pessoa (0–100)', formula: 'score = 0,5×aderência + 0,3×(100 − %atrasadas) + 0,2×(100 − aging×12,5). Pesos declarados: aderência 50 · atrasadas 30 · aging 20. Semáforo: ≥80 verde · 60–79 âmbar · <60 vermelho. Sem previstas na janela → sem score (—).', dados: 'ocorrências da pessoa na janela (mesmo motor da Inteligência)', numeros: lista.length + ' pessoa(s) no recorte; ordenado do pior para o melhor (onde agir primeiro)' },
      ader: { title: 'Aderência à rotina', formula: 'concluídas até hoje ÷ previstas até hoje × 100 (previstas exclui puladas)', dados: 'ocorrências da pessoa com data efetiva ≤ hoje', numeros: 'recorte: ' + tConcl + ' ÷ ' + tPrev + ' previstas' },
      prazo: { title: 'Conclusão no prazo', formula: 'concluídas com DIA CIVIL LOCAL (Salvador) da conclusão ≤ data efetiva ÷ concluídas × 100', dados: 'ocorrências concluídas: concluidaEm (carimbo real) × data efetiva', numeros: 'recorte: ' + tNP + ' no prazo de ' + tCT + ' concluída(s)' },
      ciclo: { title: 'Tempo de ciclo', formula: 'média(concluidaEm − iniciadaEm) em dias — SÓ quando os dois carimbos existem; sem o par → "—" (nunca inventa)', dados: 'ocorrências com iniciadaEm E concluidaEm', numeros: 'recorte: ' + tPar + ' par(es) medido(s)' },
      carga: { title: 'Carga (WIP)', formula: 'ocorrências abertas (pendente + em andamento + reprogramada) atribuídas à pessoa na janela', dados: 'status das ocorrências', numeros: 'recorte: ' + tCarga + ' aberta(s)' },
      reprog: { title: 'Reprogramação', formula: 'reprogramadas ÷ total de ocorrências da pessoa × 100', dados: 'status das ocorrências da janela', numeros: 'recorte: ' + tRe + ' ÷ ' + tTot }
    };
  }

  /* ---------- filtro por setor ---------- */
  function chipsSetores(pp) {
    var set = {};
    pp.pessoas.forEach(function (p) { p.setores.forEach(function (s) { if (s !== '—') { set[s] = true; } }); });
    if (pp.semResp) { pp.semResp.setores.forEach(function (s) { if (s !== '—') { set[s] = true; } }); }
    var sigs = Object.keys(set).sort();
    var wrap = el('<div class="pf-chips"></div>');
    function chip(sig, label) {
      var b = el('<button type="button" class="pf-chip' + (FILTRO === sig ? ' on' : '') + '"></button>');
      b.textContent = label;
      b.addEventListener('click', function () { FILTRO = sig; render(); });
      return b;
    }
    wrap.appendChild(chip('TODOS', 'Toda a escola'));
    sigs.forEach(function (s) { wrap.appendChild(chip(s, s)); });
    return wrap;
  }
  function passaFiltro(p) { return FILTRO === 'TODOS' || p.setores.indexOf(FILTRO) >= 0; }

  /* ============================================================
     C4 · DRILL-DOWN — filtro client-side do BOARD retido em
     memória (mesmo motor dos KPIs) — ZERO query extra.
     ============================================================ */
  var DD_TETO = 60;
  var DD_STATUS = {
    pendente:     { l: 'Pendente',     t: 'amber'  },
    em_andamento: { l: 'Em andamento', t: 'doing'  },
    reprogramada: { l: 'Reprogramada', t: 'orange' },
    concluida:    { l: 'Concluída',    t: 'green'  },
    pulada:       { l: 'Pulada',       t: 'muted2' }
  };
  function ddDias(iso, hoje) {              /* dias de atraso em DIA CIVIL LOCAL */
    var a = iso.split('-'), b = hoje.split('-');
    var d1 = new Date(+a[0], +a[1] - 1, +a[2]), d2 = new Date(+b[0], +b[1] - 1, +b[2]);
    return Math.round((d2 - d1) / 86400000);
  }
  function ddAberta(o) { return o.status === 'pendente' || o.status === 'em_andamento' || o.status === 'reprogramada'; }
  function ddOrdData(a, b) { return a.effDate < b.effDate ? -1 : a.effDate > b.effDate ? 1 : 0; }
  function ddOrdAtrasoTopo(a, b) { return ((b.atrasada ? 1 : 0) - (a.atrasada ? 1 : 0)) || ddOrdData(a, b); }
  function ddRow(o) {
    var st = DD_STATUS[o.status] || { l: o.status, t: 'muted2' };
    var r = el('<div class="dd-row"></div>');
    r.appendChild(el('<span class="pf-ss-dot" style="background:var(--' + st.t + ')"></span>'));
    var tit = el('<span class="dd-tit"></span>');
    tit.textContent = (o.act && o.act.titulo) || '(sem título)'; tit.title = tit.textContent;
    r.appendChild(tit);
    var sigs = KPI.setoresDe(o.act, MODELO.setores);
    var sig = el('<span class="dd-sig"></span>'); sig.textContent = sigs.length ? sigs.join('·') : '—';
    r.appendChild(sig);
    var dt = el('<span class="dd-meta' + (o.atrasada ? ' dd-late' : '') + '"></span>');
    dt.textContent = brData(o.effDate) + (o.atrasada ? ' · ' + ddDias(o.effDate, HOJE) + 'd' : '');
    r.appendChild(dt);
    r.appendChild(el('<span class="dd-meta">' + st.l + '</span>'));
    return r;
  }
  function ddPintar(wrap, itens, rotulo) {
    wrap.innerHTML = '';
    wrap.appendChild(el('<div class="dd-count">' + rotulo + ' · ' + itens.length + ' item(ns)' +
      (itens.length > DD_TETO ? ' · mostrando os ' + DD_TETO + ' primeiros' : '') + '</div>'));
    if (!itens.length) {
      wrap.appendChild(el('<div class="dd-empty">Nenhum item neste recorte.</div>'));
      return;
    }
    var list = el('<div class="dd-list"></div>');
    itens.slice(0, DD_TETO).forEach(function (o) { list.appendChild(ddRow(o)); });
    wrap.appendChild(list);
    if (itens.length > DD_TETO) {
      wrap.appendChild(el('<div class="dd-more">+ ' + (itens.length - DD_TETO) + ' item(ns) — refine na tela de Atividades.</div>'));
    }
  }
  /* drill de setor (linhas do Score por setor) */
  function abrirDrillSetor(sig, setores) {
    var itens = BOARD.filter(function (o) {
      var s = KPI.setoresDe(o.act, setores); if (!s.length) { s = ['—']; }
      return s.indexOf(sig) >= 0;
    }).sort(ddOrdAtrasoTopo);
    UI.modal({
      title: 'Setor ' + KPI.nomeSetor(sig, setores) + ' — ocorrências da janela',
      width: 640,
      body: function () {
        var box = document.createElement('div');
        ddPintar(box, itens, 'Atrasadas primeiro');
        return box;
      },
      footer: function (close) { return [UI.button({ label: 'Fechar', variant: 'ghost', onClick: close })]; }
    });
  }

  /* ---------- painel da pessoa (modal padrão) ---------- */
  function abrirPessoa(p) {
    UI.modal({
      title: p.nome,
      width: 520,
      body: function () {
        var box = document.createElement('div');
        var grid = el('<div class="pf-pgrid"></div>');
        /* C4: ocorrências da PESSOA (mesma chave do computarPorPessoa: uid ou bucket sem-uid) */
        var occ = BOARD.filter(function (o) { return p.uid ? o.uid === p.uid : !o.uid; });
        var ddWrap = el('<div></div>');
        var FILTROS = {
          abertas:       { r: 'Abertas (carga)',            f: function (o) { return ddAberta(o); } },
          previstas:     { r: 'Previstas até hoje',         f: function (o) { return o.effDate <= HOJE && o.status !== 'pulada'; } },
          concluidas:    { r: 'Concluídas',                 f: function (o) { return o.status === 'concluida'; } },
          ciclo:         { r: 'Concluídas com par medido',  f: function (o) { return o.status === 'concluida' && o.ov && o.ov.iniciadaEm && o.ov.concluidaEm; } },
          reprogramadas: { r: 'Reprogramadas',              f: function (o) { return o.status === 'reprogramada'; } },
          atrasadas:     { r: 'Atrasadas',                  f: function (o) { return o.atrasada; } }
        };
        var atual = null;
        function aplicar(chave, cardEl) {
          atual = chave;
          var fl = FILTROS[chave];
          ddPintar(ddWrap, occ.filter(fl.f).sort(ddOrdAtrasoTopo), fl.r);
          var marcados = grid.querySelectorAll('.pf-pm.on');
          for (var i = 0; i < marcados.length; i++) { marcados[i].classList.remove('on'); }
          if (cardEl) { cardEl.classList.add('on'); }
        }
        function pm(k, v, f, chave) {
          var d = el('<div class="pf-pm"></div>');
          d.appendChild(el('<div class="k">' + k + '</div>'));
          d.appendChild(el('<div class="v">' + v + '</div>'));
          d.appendChild(el('<div class="f">' + f + '</div>'));
          if (chave) {                       /* C4: métrica clicável filtra a lista abaixo */
            d.classList.add('dd-click');
            d.title = 'Clique para ver os itens desta métrica';
            d.addEventListener('click', function () { aplicar(chave, d); });
          }
          return d;
        }
        grid.appendChild(pm('Score', p.score == null ? (p.coletando ? '— coletando' : '—') : p.score, p.score == null ? (p.coletando ? 'nada venceu ainda — a medição começa quando a primeira rotina vence' : 'sem previstas na janela') : '0,5×' + p.comp.compA + ' + 0,3×' + p.comp.compB + ' + 0,2×' + p.comp.compC));
        grid.appendChild(pm('Aderência', fmtPct(p.ader), p.concluidasAteHoje + ' ÷ ' + p.previstas + ' previstas até hoje', 'previstas'));
        grid.appendChild(pm('No prazo', fmtPct(p.pctNoPrazo), p.noPrazo + ' de ' + p.concluidasTotal + ' concluída(s), por dia civil local', 'concluidas'));
        grid.appendChild(pm('Ciclo', fmtDias(p.cicloDias), p.pares ? p.pares + ' par(es) iniciada→concluída' : 'sem par iniciada/concluída — não inventa', 'ciclo'));
        grid.appendChild(pm('Carga (WIP)', String(p.carga), 'abertas atribuídas na janela', 'abertas'));
        grid.appendChild(pm('Reprogramação', p.reprogPct + '%', p.reprogramadas + ' ÷ ' + p.total + ' ocorrências', 'reprogramadas'));
        grid.appendChild(pm('Atrasadas', String(p.atrasadas), p.atrasadas ? 'aging médio ' + fmtNum(p.agingMedio) + ' d' : 'nenhuma agora', 'atrasadas'));
        grid.appendChild(pm('Throughput', fmtNum(p.thr4) + '/sem', p.thr4n + ' concluída(s) nos últimos 28 dias ÷ 4', 'concluidas'));
        box.appendChild(grid);
        box.appendChild(el('<div class="pf-acoes-t">Ocorrências da pessoa — clique numa métrica acima para trocar o recorte</div>'));
        box.appendChild(ddWrap);
        aplicar('abertas', null);            /* recorte inicial: o mais acionável */
        box.appendChild(el('<div class="pf-acoes-t">Últimas ações (atividade_log)</div>'));
        if (!p.uid) {
          box.appendChild(el('<div class="pf-acoes-note">Sem pessoa vinculada — atribua um responsável às atividades.</div>'));
        } else {
          var acoes = LOG.filter(function (r) { return r.uid === p.uid; }).slice(0, 10);
          if (!acoes.length) {
            box.appendChild(el('<div class="pf-acoes-note">Sem ações desta pessoa nas últimas 200 entradas do log (ou log indisponível agora).</div>'));
          } else {
            acoes.forEach(function (r) {
              var row = el('<div class="pf-acao"></div>');
              var a = el('<span class="a"></span>'); a.textContent = acaoLabel(r.acao); row.appendChild(a);
              row.appendChild(el('<span class="d">' + (r.ts ? brDataHora(r.ts) : '—') + '</span>'));
              box.appendChild(row);
            });
          }
        }
        return box;
      },
      footer: function (close) { return [UI.button({ label: 'Fechar', variant: 'ghost', onClick: close })]; }
    });
  }

  /* ---------- score por setor (mesmos dados/render do N2) ---------- */
  function scoreSetores(m) {
    /* F1-D: mesma régua honesta da Inteligência — só sigla ATIVA com previstas
       VENCIDAS entra no score (partida fria não vira vermelho falso). */
    function sigAtiva(sig) { var s = (m.setores || []).filter(function (x) { return x.sigla === sig; })[0]; return !!(s && s.ativo); }
    var base = m.porSetor.filter(function (s) { return s.sig !== '—' && sigAtiva(s.sig) && s.prevVencidas > 0; }).map(function (s) {
      return { sigla: s.sig, ader: s.aderencia == null ? 0 : s.aderencia, atrasadas: s.atrasadas, agingMedio: s.agingMedio || 0, carga: s.carga || 0 };
    });
    var colet = m.porSetor.filter(function (s) { return s.sig !== '—' && sigAtiva(s.sig) && s.previstas + (s.carga || 0) > 0 && s.prevVencidas === 0; });
    if (!base.length && !colet.length) { return null; }
    var calc = base.map(function (s) {
      var pctAtr = s.carga ? Math.round(s.atrasadas / s.carga * 100) : 0;
      return { sigla: s.sigla, sc: KPI._score(s.ader, pctAtr, s.agingMedio) };
    }).sort(function (a, b) { return a.sc.score - b.sc.score; });
    var nums = calc.map(function (x) { return x.sigla + ': ' + x.sc.score; }).join(' · ');
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Score por setor (0–100)</div>'));
    h.appendChild(infoBtn({ title: 'Score composto por setor', formula: 'score = 0,5×aderência + 0,3×(100 − %atrasadas) + 0,2×(100 − aging×12,5). Pesos: aderência 50 · atrasadas 30 · aging 20. Semáforo: ≥80 verde · 60–79 âmbar · <60 vermelho.', dados: 'mesmos números da Inteligência (ocorrências por setor até hoje + abertas por setor)', numeros: nums }));
    card.appendChild(h);
    calc.forEach(function (x) {
      var tok = tomToken(x.sc.tom);
      var row = el('<div class="pf-ss-row dd-click"></div>');
      row.title = 'Clique para ver as ocorrências do setor';
      (function (sig) {                     /* C4: drill do setor */
        row.addEventListener('click', function () { abrirDrillSetor(sig, m.setores); });
      })(x.sigla);
      row.appendChild(el('<span class="pf-ss-dot" style="background:var(--' + tok + ');box-shadow:0 0 0 3px var(--' + haloOf(tok) + ')"></span>'));
      var nome = el('<span class="pf-ss-nome"></span>'); nome.textContent = KPI.nomeSetor(x.sigla, m.setores); nome.title = x.sigla;
      row.appendChild(nome);
      var tr = el('<div class="pf-ss-track"></div>');
      tr.appendChild(el('<div class="pf-ss-fill" style="width:' + x.sc.score + '%;background:var(--' + tok + ')"></div>'));
      row.appendChild(tr);
      row.appendChild(el('<span class="pf-ss-num" style="color:var(--' + tok + ')">' + x.sc.score + '</span>'));
      card.appendChild(row);
    });
    /* F1-D: setores em partida — neutro, nunca vermelho */
    colet.forEach(function (s) {
      var row = el('<div class="pf-ss-row" style="opacity:.85"></div>');
      row.appendChild(el('<span class="pf-ss-dot" style="background:var(--muted2)"></span>'));
      var nome = el('<span class="pf-ss-nome"></span>'); nome.textContent = KPI.nomeSetor(s.sig, m.setores); nome.title = s.sig;
      row.appendChild(nome);
      row.appendChild(el('<span class="pf-ss-track"></span>'));
      var tg = el('<span></span>');
      tg.style.cssText = 'font-size:10.5px;font-weight:800;letter-spacing:.04em;color:var(--muted2);background:var(--chipBg);border:1px solid var(--border);border-radius:20px;padding:2px 9px';
      tg.textContent = '— coletando';
      card.appendChild(row);
      row.appendChild(tg);
    });
    return card;
  }

  /* ---------- render ---------- */
  function render() {
    var body = document.getElementById('pf-body');
    body.innerHTML = '';
    var lista = PP.pessoas.filter(passaFiltro);
    var semResp = (PP.semResp && passaFiltro(PP.semResp)) ? PP.semResp : null;

    body.appendChild(chipsSetores(PP));

    var infos = colInfos(lista.concat(semResp ? [semResp] : []));

    /* ===== 3 HERÓIS (REGRA GLOBAL: abre calma; vermelho = ponto + número) ===== */
    var T = (MODELO && MODELO.totais) || {};
    /* conclusão no prazo global do recorte: Σ noPrazo ÷ Σ concluídas (mesma base do colInfos) */
    var gNP = 0, gCT = 0;
    lista.concat(semResp ? [semResp] : []).forEach(function (p) { gNP += p.noPrazo; gCT += p.concluidasTotal; });
    var pctNoPrazoG = gCT ? Math.round(gNP / gCT * 100) : null;

    function heroTom(v, okMin, warnMin) {
      if (v == null) { return 'muted2'; }
      return v >= okMin ? 'green' : v >= warnMin ? 'amber' : 'red';
    }
    function hero(label, info, numHtml, sub) {
      var h = el('<div class="pf-hero"></div>');
      var lb = el('<div class="pf-hlab"></div>'); lb.appendChild(document.createTextNode(label));
      if (info) { lb.appendChild(infoBtn(info)); }
      h.appendChild(lb);
      var n = el('<div class="pf-hnum"></div>'); n.innerHTML = numHtml; h.appendChild(n);
      if (sub) { h.appendChild(txt('div', 'pf-hsub', sub)); }
      return h;
    }
    var heroes = el('<div class="pf-heroes"></div>');
    var aderG = (MODELO && MODELO.aderencia != null) ? MODELO.aderencia : null;
    var tA = heroTom(aderG, 80, 60);
    heroes.appendChild(hero('Aderência à rotina', infos.ader,
      '<span class="pf-hdot" style="background:var(--' + tA + ')"></span><span style="color:var(--' + tA + ')">' + (aderG == null ? '—' : aderG + '%') + '</span>',
      aderG == null ? 'Coletando — nada previsto venceu ainda nesta janela.' : 'Concluídas ÷ previstas até hoje, no recorte da janela.'));
    var tP = heroTom(pctNoPrazoG, 80, 60);
    heroes.appendChild(hero('Conclusão no prazo', infos.prazo,
      '<span class="pf-hdot" style="background:var(--' + tP + ')"></span><span style="color:var(--' + tP + ')">' + (pctNoPrazoG == null ? '—' : pctNoPrazoG + '%') + '</span>',
      pctNoPrazoG == null ? 'Sem concluídas no recorte ainda.' : gNP + ' de ' + gCT + ' concluída(s) dentro do prazo.'));
    var nAtr = T.atrasadas || 0;
    var tR = nAtr ? 'red' : 'green';
    heroes.appendChild(hero('Atrasadas agora', { title: 'Atrasadas', formula: 'ocorrências abertas com data efetiva < hoje (dia civil de Salvador)', dados: 'board da janela', numeros: nAtr + ' atrasada(s) · aging médio ' + (MODELO ? (Math.round((MODELO.agingMedio || 0) * 10) / 10) : 0) + ' dia(s)' },
      '<span class="pf-hdot" style="background:var(--' + tR + ')"></span><span style="color:var(--' + tR + ')">' + nAtr + '</span>',
      nAtr ? ('Aging médio: ' + (Math.round((MODELO.agingMedio || 0) * 10) / 10) + ' dia(s). Clique nas pessoas abaixo para o detalhe.') : 'Nenhuma ocorrência vencida em aberto. '));
    heroes.setAttribute('data-lente', 'numeros'); /* R3 · lente */
    body.appendChild(heroes);

    /* ===== higiene: sem responsável (âmbar, 1 linha — não polui) ===== */
    if (semResp) {
      var hyg = el('<div class="pf-hyg"></div>');
      hyg.appendChild(el('<span class="pf-hygdot"></span>'));
      hyg.appendChild(txt('span', 'pf-hygt', 'Sem responsável: ' + semResp.total + ' ocorrência(s)'));
      hyg.appendChild(txt('span', 'pf-hygs', '— importe com a coluna "responsavel" ou edite as atividades. Clique para ver.'));
      hyg.addEventListener('click', function () { abrirPessoa(semResp); });
      hyg.setAttribute('data-lente', 'eucobro'); /* R3 · lente */
      body.appendChild(hyg);
    }

    /* ===== GRÁFICO: aderência por setor (barras, com atrasadas como ponto+número) ===== */
    if (MODELO && MODELO.porSetor && MODELO.porSetor.length) {
      var gc = el('<div class="pf-card"></div>');
      var gh = el('<div class="pf-card-h"></div>');
      gh.appendChild(el('<div class="pf-card-t">Aderência por setor</div>'));
      gh.appendChild(infoBtn({ title: 'Aderência por setor', formula: 'concluídas ÷ previstas até hoje × 100, por setor (multi-homing conta em cada setor onde a atividade aparece)', dados: 'MODELO.porSetor — mesmo motor da Inteligência', numeros: MODELO.porSetor.length + ' setor(es) na janela' }));
      gc.appendChild(gh);
      var bars = el('<div class="pf-bars"></div>');
      MODELO.porSetor.forEach(function (s) {
        var ad = s.previstas ? Math.round(s.concluidas / s.previstas * 100) : null;
        var tom = heroTom(ad, 80, 60);
        var row = el('<div class="pf-bar"></div>');
        var nm = txt('span', 'pf-bname', s.sig); nm.title = KPI.nomeSetor(s.sig, MODELO.setores); row.appendChild(nm);
        var tr2 = el('<div class="pf-btrack"></div>');
        var fill = el('<div class="pf-bfill"></div>');
        fill.style.width = (ad == null ? 0 : Math.max(2, ad)) + '%';
        fill.style.background = 'var(--' + (tom === 'muted2' ? 'chipBg' : tom) + ')';
        tr2.appendChild(fill); row.appendChild(tr2);
        var val = el('<span class="pf-bval"></span>');
        val.innerHTML = (ad == null ? '—' : ad + '%') + (s.atrasadas ? ' · <span class="lt">●&hairsp;' + s.atrasadas + '</span>' : '');
        val.title = s.concluidas + ' ÷ ' + s.previstas + ' previstas' + (s.atrasadas ? ' · ' + s.atrasadas + ' atrasada(s)' : '');
        row.appendChild(val);
        bars.appendChild(row);
      });
      gc.appendChild(bars);
      gc.setAttribute('data-lente', 'numeros'); /* R3 · lente */
      body.appendChild(gc);
    }

    /* ===== PESSOAS agrupadas por severidade (agrupar, não empilhar) ===== */
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Pessoas por severidade — clique para o detalhe individual</div>'));
    h.appendChild(infoBtn({ title: 'Pessoas por severidade', formula: 'grupo = semáforo do score (≥80 verde · 60–79 âmbar · <60 vermelho · sem dado = coletando). ' + (infos.score.formula), dados: infos.score.dados, numeros: lista.length + ' pessoa(s) no recorte' }));
    card.appendChild(h);
    card.setAttribute('data-lente', 'eucobro'); /* R3 · lente */

    if (!lista.length && !semResp) {
      card.appendChild(el('<div class="pf-empty2">Nenhuma pessoa com ocorrências neste recorte.</div>'));
      body.appendChild(card);
      var so0 = MODELO ? scoreSetores(MODELO) : null;
      if (so0) { so0.setAttribute('data-lente', 'numeros'); body.appendChild(so0); } /* R3 · lente */
      if (window.GrautLentes) { GrautLentes.aplicar(); }
      return;
    }

    var GRP_DEF = [
      { id: 'bad',  label: 'Crítico',   tok: 'red' },
      { id: 'warn', label: 'Atenção',   tok: 'amber' },
      { id: 'ok',   label: 'Ok',        tok: 'green' },
      { id: 'flat', label: 'Coletando', tok: 'muted2' }
    ];
    function pcard(p) {
      var c = el('<div class="pf-pcard" role="button" tabindex="0"></div>');
      c.appendChild(txt('div', 'pf-pcn', p.nome));
      c.appendChild(txt('div', 'pf-pcs', p.setores.join(' · ') || '—'));
      var m = el('<div class="pf-pcm"></div>');
      var tok = tomToken(p.tom);
      var sc = el('<span class="sc"></span>');
      sc.appendChild(el('<span class="d" style="background:var(--' + tok + ')"></span>'));
      sc.appendChild(document.createTextNode(p.score == null ? (p.coletando ? 'coletando' : '—') : 'score ' + p.score));
      m.appendChild(sc);
      m.appendChild(document.createTextNode('ader. ' + fmtPct(p.ader)));
      if (p.atrasadas) { var lt = el('<span class="lt"></span>'); lt.textContent = '● ' + p.atrasadas; lt.title = p.atrasadas + ' atrasada(s)'; m.appendChild(lt); }
      c.appendChild(m);
      c.addEventListener('click', function () { abrirPessoa(p); });
      return c;
    }
    var grid = el('<div class="pf-groups"></div>');
    GRP_DEF.forEach(function (g) {
      var arr = lista.filter(function (p) { return (p.tom || 'flat') === g.id; });
      if (!arr.length) { return; }
      var col = el('<div class="pf-grp"></div>');
      var hd = el('<div class="pf-grphd"></div>');
      hd.appendChild(el('<span class="pf-grpdot" style="background:var(--' + g.tok + ')"></span>'));
      hd.appendChild(txt('span', 'pf-grpname', g.label));
      hd.appendChild(el('<span class="pf-grpsp"></span>'));
      hd.appendChild(txt('span', 'pf-grpcount', String(arr.length)));
      col.appendChild(hd);
      arr.forEach(function (p) { col.appendChild(pcard(p)); });
      grid.appendChild(col);
    });
    card.appendChild(grid);
    body.appendChild(card);

    var _rk = rankingCard();                      /* F1-G */
    _rk.setAttribute('data-lente', 'eucobro');    /* R3 · lente */
    body.appendChild(_rk);

    var so = MODELO ? scoreSetores(MODELO) : null;
    if (so) { so.setAttribute('data-lente', 'numeros'); body.appendChild(so); } /* R3 · lente */

    /* R3 · lente EU FAÇO: o MEU cartão — o mesmo pcard do grid, sem os
       chips de filtro no caminho (eu sou sempre eu). Zero cálculo novo. */
    var minha = null;
    ((PP && PP.pessoas) || []).forEach(function (p) { if (p.uid && USER && p.uid === USER.uid) { minha = p; } });
    var meu = el('<div class="pf-card"></div>');
    meu.setAttribute('data-lente', 'eufaco');
    var mh = el('<div class="pf-card-h"></div>');
    mh.appendChild(el('<div class="pf-card-t">Meu desempenho — o mesmo cartão que o líder vê</div>'));
    meu.appendChild(mh);
    if (minha) {
      var mgrid = el('<div style="max-width:360px"></div>');
      mgrid.appendChild(pcard(minha));
      meu.appendChild(mgrid);
    } else {
      meu.appendChild(el('<div class="pf-empty2">Sem ocorrências suas neste recorte — seus números nascem do uso em Hoje e Atividades.</div>'));
    }
    body.appendChild(meu);

    if (window.GrautLentes) { GrautLentes.aplicar(); } /* R3 · lentes */
  }

  /* ============================================================
     F1-G · RANKING 50/30/20 — 3 lentes (SETOR / LÍDER / USUÁRIO).
     Score = 50% aderência + 30% no prazo + 20% (100 − atraso
     residual), pesos renormalizados quando falta componente
     (KPI.scoreDesempenho, validado no harness_f1g.js). MELHOR
     primeiro (ranking clássico); a tabela acima já mostra o pior
     primeiro para agir. Multi-setor conta em CADA setor (declarado).
     ============================================================ */
  function rankingCard() {
    var card = el('<div class="pf-card"></div>');
    var h = el('<div class="pf-card-h"></div>');
    h.appendChild(el('<div class="pf-card-t">Ranking de desempenho — score 50/30/20</div>'));
    h.appendChild(infoBtn({
      title: 'Score 50/30/20',
      formula: 'score = 50% × aderência + 30% × conclusão no prazo + 20% × (100 − atraso residual). Atraso residual = atrasadas ÷ previstas VENCIDAS × 100 (do que já venceu, quanto segue aberto). Componente sem dado sai do cálculo e os pesos são renormalizados sobre os presentes — nunca inventa 0 nem 100. Sem previstas → sem score. Nada venceu ainda → “coletando” (partida fria, não pune). Pesos calibráveis: KPI.PESOS_SCORE.',
      dados: 'mesmas ocorrências reais da janela (board), agregadas por setor (atividade multi-setor conta em CADA setor), por líder (ocorrência conta se o setor está no escopo raiz→filhos do líder) e por responsável (responsavelUid)',
      numeros: rkNums()
    }));
    card.appendChild(h);
    var seg = el('<div class="pf-seg" style="margin:8px 0 4px"></div>');
    [['setores', 'Setor'], ['lideres', 'Líder'], ['usuarios', 'Usuário']].forEach(function (par) {
      var b = el('<button type="button" class="pf-seg-b"></button>');
      b.textContent = par[1];
      if (LENTE === par[0]) { b.classList.add('on'); }
      b.addEventListener('click', function () {
        LENTE = par[0];
        seg.querySelectorAll('.pf-seg-b').forEach(function (x) { x.classList.remove('on'); });
        b.classList.add('on');
        pintaRk();
      });
      seg.appendChild(b);
    });
    card.appendChild(seg);
    var holder = el('<div></div>');
    card.appendChild(holder);
    /* F1-J: exportar a lente atual em CSV (padrão de todo BI/dashboard de
       mercado). Colunas ESTÁVEIS; separador ';' (Excel pt-BR); UTF-8 com BOM.
       Exporta o que está na tela — mesmo recorte, mesma janela, zero conta nova. */
    function csvEscape(v) {
      var s = String(v == null ? '' : v);
      return /[";\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
    }
    function exportarCSV() {
      var lst = (RANK && RANK[LENTE]) || [];
      if (!lst.length) { return; }
      var linhas = ['posicao;nome;score;aderencia_pct;no_prazo_pct;atraso_residual_pct;previstas;prev_vencidas;concluidas_ate_hoje;concluidas_total;no_prazo;atrasadas'];
      lst.forEach(function (b, ix) {
        linhas.push([ix + 1, b.nome, b.score == null ? '' : b.score,
          b.ader == null ? '' : b.ader, b.pctNoPrazo == null ? '' : b.pctNoPrazo,
          b.residual == null ? '' : b.residual,
          b.previstas, b.prevVencidas, b.concluidasAteHoje, b.concluidasTotal, b.noPrazo, b.atrasadas
        ].map(csvEscape).join(';'));
      });
      var blob = new Blob(['\uFEFF' + linhas.join('\r\n')], { type: 'text/csv;charset=utf-8' });
      var a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'gera_ranking_' + LENTE + '_' + HOJE + '.csv';
      document.body.appendChild(a); a.click(); document.body.removeChild(a);
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
    }
    var exb = el('<button type="button" class="pf-seg-b" style="margin-left:auto">Exportar CSV</button>');
    exb.title = 'Baixa a lente atual do ranking em CSV (abre no Excel). Mesmos números da tela.';
    exb.addEventListener('click', exportarCSV);
    seg.appendChild(exb);
    function pintaRk() {
      holder.innerHTML = '';
      var lst = (RANK && RANK[LENTE]) || [];
      if (LENTE === 'lideres' && !USUARIOS.length) {
        holder.appendChild(el('<div class="pf-empty2">Não consegui ler a lista de usuários (lente Líder precisa dos setores liderados). Confirme seu perfil e as regras publicadas.</div>'));
        return;
      }
      if (!lst.length) {
        holder.appendChild(el('<div class="pf-empty2">Nenhum item com ocorrências nesta lente e recorte.</div>'));
        return;
      }
      var wrap2 = el('<div class="pf-tblwrap"></div>');
      var tbl2 = el('<table class="pf-tbl"></table>');
      tbl2.appendChild(el('<thead><tr><th>#</th><th>Nome</th><th>Score</th><th>Aderência (50%)</th><th>No prazo (30%)</th><th>Atraso residual (20%)</th></tr></thead>'));
      var tb2 = document.createElement('tbody');
      lst.forEach(function (b, ix) {
        var tr = document.createElement('tr');
        var td0 = document.createElement('td'); td0.textContent = String(ix + 1); tr.appendChild(td0);
        var td1 = document.createElement('td');
        var nm = el('<div class="pf-nome"></div>'); nm.textContent = b.nome; td1.appendChild(nm);
        tr.appendChild(td1);
        var td2 = document.createElement('td');
        var tok = tomToken(b.tom);
        var sc = el('<span class="pf-scorecell"></span>');
        sc.appendChild(el('<span class="pf-scoredot" style="background:var(--' + tok + ');box-shadow:0 0 0 3px var(--' + haloOf(tok === 'muted2' ? 'green' : tok) + ')"></span>'));
        sc.appendChild(el('<span style="color:var(--' + tok + ')">' + (b.score == null ? (b.previstas ? '—' : '—') : b.score) + (b.coletando ? ' · coletando' : '') + '</span>'));
        var ib = infoBtn({
          title: 'Score de ' + b.nome,
          formula: 'componentes usados: ' + (b.usados.length ? b.usados.join(' + ') : 'nenhum (sem previstas)') + ' — pesos renormalizados sobre eles',
          dados: 'previstas até hoje: ' + b.previstas + ' · vencidas: ' + b.prevVencidas + ' · concluídas até hoje: ' + b.concluidasAteHoje + ' · concluídas (total): ' + b.concluidasTotal + ' · no prazo: ' + b.noPrazo + ' · atrasadas: ' + b.atrasadas,
          numeros: 'aderência ' + fmtPct(b.ader) + ' · no prazo ' + fmtPct(b.pctNoPrazo) + ' · residual ' + fmtPct(b.residual) + ' → score ' + (b.score == null ? '—' : b.score)
        });
        sc.appendChild(ib);
        td2.appendChild(sc); tr.appendChild(td2);
        [fmtPct(b.ader), fmtPct(b.pctNoPrazo), fmtPct(b.residual)].forEach(function (v) {
          var td = document.createElement('td'); td.textContent = v; tr.appendChild(td);
        });
        tb2.appendChild(tr);
      });
      tbl2.appendChild(tb2);
      wrap2.appendChild(tbl2);
      holder.appendChild(wrap2);
    }
    pintaRk();
    return card;
  }
  function rkNums() {
    if (!RANK) { return '—'; }
    return RANK.setores.length + ' setor(es) · ' + RANK.lideres.length + ' líder(es) · ' + RANK.usuarios.length + ' usuário(s) na janela';
  }

  /* ---------- estados + boot ---------- */
  function showState(title, sub) {
    var body = document.getElementById('pf-body'); body.innerHTML = '';
    var box = el('<div class="pf-state"></div>');
    var t = el('<div class="pf-state-t"></div>'); t.textContent = title; box.appendChild(t);
    if (sub) { var s = el('<div class="pf-state-s"></div>'); s.textContent = sub; box.appendChild(s); }
    body.appendChild(box);
  }

  function carregar() {
    /* F1-B: painel de gestão. Usuário não tem no menu; se chegar por URL, barra. */
    if (Guard.isUsuario && Guard.isUsuario()) {
      var stmp = document.getElementById('pf-stamp'); if (stmp) { stmp.textContent = 'Restrito.'; }
      showState('Sem conteúdo para o seu perfil', 'A Performance é um painel de gestão. Sua agenda está em Hoje e suas tarefas em Atividades.');
      return;
    }
    showState('Calculando desempenho…', 'Lendo as ocorrências e o log de ações.');
    Promise.all([
      KPI.carregar(PERIODO),
      KPI.lerLogRecente(),
      /* F1-G: usuarios p/ a lente LÍDER do ranking (setoresLiderados).
         Best-effort: falha (regras/HTTP) degrada p/ [] e a lente avisa. */
      Promise.all([
        import('./firebase.js'),
        import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
      ]).then(function (mods) {
        var db = mods[0].db, f = mods[1];
        var q = f.query(f.collection(db, 'usuarios'), f.where('ativo', '==', true), f.limit(300));
        return f.getDocs(q).then(function (s) {
          var a = []; s.forEach(function (d) { a.push(Object.assign({ uid: d.id }, d.data())); }); return a;
        });
      }).catch(function () { return []; })
    ]).then(function (r) {
      var ctx = KPI.recortarContexto(r[0], USER);   /* F1-B: gestor=tudo · líder=seus setores */
      LOG = r[1] || [];
      USUARIOS = r[2] || [];
      MODELO = KPI.computar(ctx);
      PP = KPI.computarPorPessoa(ctx);
      RANK = KPI.computarRanking(ctx, USUARIOS);    /* F1-G: mesmas ocorrências, 3 lentes */
      BOARD = ctx.board;                    /* C4: retido p/ drill-down */
      HOJE = MODELO.hoje;
      document.getElementById('pf-stamp').textContent =
        'Janela: ' + rotuloPeriodo(PERIODO) + ' (' + brData(ctx.janela.jIni) + ' a ' + brData(ctx.janela.jFim) + ') · ' +
        PP.pessoas.length + ' pessoa(s) com ocorrências · ' + ctx.board.length + ' ocorrências.';
      if (!ctx.ativ.length) {
        var ehLider = Guard.isLider && Guard.isLider();
        showState(ehLider ? 'Nada no seu escopo' : 'Ainda não há atividades',
          ehLider ? 'Não há atividades ativas nos setores que você lidera nesta janela.'
                  : 'Cadastre atividades com responsável para medir o desempenho.');
        return;
      }
      render();
    }).catch(function (e) {
      showState('Não consegui calcular o desempenho', (e && e.message) || 'Erro ao ler o banco.');
    });
  }

  function setPeriodo(p) { if (p === PERIODO) { return; } PERIODO = p; carregar(); }
  function wireSeg(group) {
    group.addEventListener('click', function (e) {
      var b = e.target.closest('.pf-seg-b'); if (!b) { return; }
      document.querySelectorAll('.pf-seg .pf-seg-b').forEach(function (x) {
        if (x.getAttribute('data-periodo') === b.getAttribute('data-periodo')) { x.classList.add('on'); } else { x.classList.remove('on'); }
      });
      setPeriodo(b.getAttribute('data-periodo') || 'band');
    });
  }

  function renderShell() {
    POP = document.getElementById('pf-pop');
    BACK = document.getElementById('pf-backdrop');
    BACK.addEventListener('click', closePop);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); } });
    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Performance', user: USER }), app.firstChild);
    /* R3 · Bloco 1: barra das 3 lentes (motor em lentes.js). Padrão desta
       tela = EU COBRO (pessoa a pessoa é a razão de ser da Performance). */
    if (window.GrautLentes) {
      GrautLentes.mount({ tela: 'performance', user: USER, padrao: 'eucobro',
        before: document.getElementById('pf-stamp'),
        onChange: function () { if (MODELO && PP) { render(); } } });
    }
    var exp = document.getElementById('pf-export');
    if (exp) { var rb = UI.button({ label: 'Atualizar', icon: 'upload', variant: 'ghost' }); rb.addEventListener('click', carregar); exp.appendChild(rb); }
    document.querySelectorAll('.pf-seg').forEach(wireSeg);
    carregar();
  }

  Guard.onReady(function (u) { USER = u; renderShell(); });
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
