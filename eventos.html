<!DOCTYPE html>
<html lang="pt-BR" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agenda — GERA</title>

<link rel="stylesheet" href="theme.css">
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#090B10">
<link rel="stylesheet" href="components.css">
<link rel="stylesheet" href="mod-agenda.css">
<script src="theme.js"></script>
<script src="guard.js"></script>
  <script src="mnav.js"></script>

<style>
/* casca padrão — namespace ev- */
.ev-app{display:flex;min-height:100vh;background:var(--bg)}
.ev-app>.ui-side{position:sticky;top:0;height:100vh}
.ev-main{flex:1;min-width:0;display:flex;flex-direction:column}
.ev-top{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:20px 32px;border-bottom:1px solid var(--border);background:var(--s1)}
.ev-h1{font-size:21px;font-weight:800;letter-spacing:-.02em;display:flex;align-items:center;gap:8px;margin:0}
.ev-top-r{display:flex;align-items:center;gap:12px}
.ev-body{padding:18px 32px 32px}
.ev-i{appearance:none;border:0;background:transparent;padding:0;cursor:pointer;color:var(--muted2Text,var(--muted2));display:inline-flex;flex:none}
.ev-i:hover{color:var(--greenText)}
/* a grade, os chips e a legenda moram no mod-agenda.css (namespace ag-) */
/* bottom sheet */
.ev-sheetback{position:fixed;inset:0;z-index:48;background:var(--scrim);display:none}
.ev-sheetback.on{display:block}
.ev-sheet{position:fixed;left:0;right:0;bottom:0;z-index:49;background:var(--s1);border:1px solid var(--border);border-bottom:0;border-radius:18px 18px 0 0;padding:16px 18px 22px;max-height:70vh;overflow-y:auto;transform:translateY(105%);transition:transform .22s ease}
@media (prefers-reduced-motion: reduce){.ev-sheet{transition:none}}
.ev-sheet.on{transform:translateY(0)}
.ev-sh-h{display:flex;align-items:center;justify-content:space-between;margin-bottom:10px}
.ev-sh-t{font-size:14.5px;font-weight:800}
.ev-sh-x{appearance:none;border:0;background:transparent;color:var(--muted2Text,var(--muted2));cursor:pointer;padding:2px;display:inline-flex}
.ev-item{border-top:1px solid var(--border);padding:12px 0}
.ev-item:first-of-type{border-top:0}
.ev-it-m{font-size:11.5px;font-weight:600;color:var(--muted);margin-top:5px;line-height:1.5}
/* os 4 estados da tela usam .ag-state do mod-agenda.css */
/* popover do "i" */
.ev-backdrop{position:fixed;inset:0;z-index:40;display:none}
.ev-backdrop.on{display:block}
.ev-pop{position:fixed;z-index:41;display:none;width:300px;max-width:calc(100vw - 32px);background:var(--s2);border:1px solid var(--border);border-radius:12px;padding:14px 15px;box-shadow:var(--cardShadow)}
.ev-pop.on{display:block}
.ev-pop-t{font-size:12.5px;font-weight:800;margin-bottom:9px}
.ev-pop-row{margin-bottom:8px}
.ev-pop-k{font-size:9.5px;font-weight:700;letter-spacing:.05em;color:var(--muted2Text,var(--muted2));margin-bottom:2px}
.ev-pop-v{font-size:12px;font-weight:600;color:var(--text);line-height:1.35}
@media (max-width:900px){
  /* celular: a barra lateral some (o menu vem pelo botão flutuante do mnav.js); topo compacto; barra da agenda em linhas */
  .ev-app>.ui-side{display:none}
  .ev-top{padding:12px 14px;gap:8px}
  .ev-h1{font-size:18px}
  .ev-top-r{width:100%;flex-wrap:wrap;gap:8px}
  .ev-body{padding:10px 10px 110px}
  .ag-bar{gap:6px 8px}
  .ag-bar-sp{display:none}
  /* mês no celular: as 7 colunas rolam dentro da grade, nunca a página */
  .ag-month{overflow-x:auto;grid-template-columns:repeat(7,minmax(92px,1fr))}
}
@media (max-width:760px){
  .ev-top{padding:12px 14px}
  .ev-body{padding:10px 10px 110px}
}
</style>
</head>
<body>
  <div id="graut-gate" class="graut-gate">
    <div class="graut-gate__box">
      <div class="graut-gate__spin" aria-hidden="true"></div>
      <p class="graut-gate__msg">Verificando acesso…</p>
    </div>
  </div>

  <div class="ev-app" id="app">
    <main class="ev-main">
      <div class="ev-top">
        <h1 class="ev-h1"><span>Agenda</span><span id="ev-info"></span></h1>
        <div class="ev-top-r" id="ev-actions"></div>
      </div>
      <div class="ev-body" id="ev-body"></div>
    </main>
  </div>

  <div class="ev-backdrop" id="ev-backdrop"></div>
  <div class="ev-pop" id="ev-pop" role="dialog" aria-label="Como funciona"></div>
  <div class="ev-sheetback" id="ev-sheetback"></div>
  <div class="ev-sheet" id="ev-sheet" role="dialog" aria-label="Eventos do dia"></div>

  <script src="ui.js"></script>
  <script src="recorrencia.js"></script>
  <script src="kpi.js"></script>
  <script src="agenda-motor.js"></script>
  <script type="module">
  (function () {
  'use strict';

  /* ============================================================
     AGENDA (MÓDULO 4) · Unidade | Meu setor · Semana | Mês
     ------------------------------------------------------------
     Toda a lógica que dá para provar no Node mora no
     agenda-motor.js (navegação, convite, cor por origem, filtro).
     Esta tela só desenha e grava.

     ARCH_EVENTOS_CALENDARIO.md — D2 Meu Dia (D1 revogada no R4·B2: "Projeto" não existe)
     segue 1ª tela (o pulso mora no hoje.html; ABRIR esta tela
     grava localStorage['graut_evt_lastSeen'] e o pulso para) ·
     D3 custo previsto + realizado em CENTAVOS (inteiro).
     Query da janela: range em 'data' + limit(200); 'ativo' filtrado
     NO CLIENTE (decisão C1 §2.6 — evita índice composto).
     Datas por dia civil LOCAL (Salvador). Mutações → atividade_log.
     ============================================================ */

  var R = window.GrautRecorrencia;
  var USER = null;

  var _fb = null;
  function fb() {
    if (!_fb) {
      _fb = Promise.all([
        import('./firebase.js'),
        import('https://www.gstatic.com/firebasejs/12.15.0/firebase-firestore.js')
      ]).then(function (m) { return { db: m[0].db, f: m[1] }; });
    }
    return _fb;
  }
  function ferr(e) {
    var code = (e && e.code) || '';
    if (code === 'permission-denied') { return Object.assign(new Error('Sem permissão para esta ação. Confirme seu perfil com o gestor.'), { code: code }); }
    if (code === 'resource-exhausted') { return Object.assign(new Error('A cota gratuita de leituras do banco acabou por hoje (plano Spark do Firebase: 50 mil por dia). Volta sozinha de madrugada. Avise o gestor: é o sinal para passar o Firebase ao plano Blaze.'), { code: code }); }
    if (code === 'unavailable' || code === 'failed-precondition' || code === 'deadline-exceeded') { return Object.assign(new Error('Não consegui falar com o banco agora. Verifique a conexão e tente de novo.'), { code: code }); }
    return Object.assign(new Error((e && e.message) || 'Erro ao acessar os eventos.'), { code: code });
  }
  function mapDocs(snap) { var a = []; snap.forEach(function (d) { var o = d.data() || {}; o.id = d.id; a.push(o); }); return a; }

  var Store = {
    listEventosMes: function (ini, fim) {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var q = f.query(f.collection(db, 'eventos'),
          f.where('data', '>=', ini), f.where('data', '<=', fim), f.limit(200));
        return f.getDocs(q).then(mapDocs).then(function (a) {
          return a.filter(function (e) { return e.ativo !== false; }); /* §2.6 */
        });
      }).catch(function (e) { throw ferr(e); });
    },
    /* F1-M: a agenda mostra TUDO que tem data (padrão "Everything Calendar"
       do ClickUp). Reuniões entram na MESMA grade dos eventos, sem fundir
       coleção. Falha vira [] — a agenda nunca quebra por causa da reunião. */
    listReunioesMes: function (ini, fim) {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var q = f.query(f.collection(db, 'reunioes'),
          f.where('data', '>=', ini), f.where('data', '<=', fim), f.limit(200));
        return f.getDocs(q).then(mapDocs).then(function (a) {
          return a.filter(function (r) { return r.ativo !== false; });
        });
      }).catch(function () { return []; });
    },
    listSetores: function () {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var q = f.query(f.collection(db, 'setores'), f.where('ativo', '==', true), f.limit(200));
        return f.getDocs(q).then(function (snap) {
          var a = []; snap.forEach(function (d) { var o = d.data() || {}; o.sigla = o.sigla || d.id; a.push(o); });
          a.sort(function (x, y) { return (x.ordem || 99) - (y.ordem || 99); });
          return a;
        });
      }).catch(function (e) { throw ferr(e); });
    },
    criarEvento: function (data) {
      return fb().then(function (c) {
        var db = c.db, f = c.f, now = Date.now();
        var doc = Object.assign({}, data, { realizado: false, custoRealizado: null, ativo: true, criadoPorUid: USER.uid, criadoEm: now, atualizadoEm: now });
        return f.addDoc(f.collection(db, 'eventos'), doc).then(function (ref) {
          Store.log({ acao: 'criar_evento', entidade: 'evento', refId: ref.id, antes: null, depois: { titulo: doc.titulo, data: doc.data } });
          return ref.id;
        });
      }).catch(function (e) { throw ferr(e); });
    },
    /* 17/09 · sentido inverso: evento nascido de um item do plano (planoId + itemId) — mudar data, hora, título ou local aqui atualiza o item. Nunca bloqueia a edição. */
    sincronizarItemDoPlano: function (c, id, patch) {
      if (!patch || !('data' in patch || 'hora' in patch || 'titulo' in patch || 'local' in patch)) { return Promise.resolve(); }
      var db = c.db, f = c.f;
      return f.getDoc(f.doc(db, 'eventos', id)).then(function (snap) {
        var ev = snap && snap.exists && snap.exists() ? snap.data() : null;
        if (!ev || !ev.planoId || !ev.itemId) { return; }
        var ref = f.doc(db, 'planejamentos', ev.planoId);
        return f.runTransaction(db, function (tx) {
          return tx.get(ref).then(function (ps) {
            if (!ps.exists()) { return; }
            var d = ps.data() || {}, mudou = false;
            var itens = (d.itens || []).map(function (it) {
              if (!it || it.id !== ev.itemId) { return it; }
              var novo = Object.assign({}, it);
              if ('data' in patch && ev.data) { novo.inicio = ev.data; }
              if ('hora' in patch) { novo.hora = ev.hora || null; }
              if ('titulo' in patch && ev.titulo) { novo.oque = ev.titulo; }
              if ('local' in patch) { novo.onde = ev.local || null; }
              mudou = JSON.stringify(novo) !== JSON.stringify(it); return novo;
            });
            if (mudou) { tx.update(ref, { itens: itens, atualizadoEm: Date.now() }); }
          });
        });
      }).catch(function (e) { if (window.console && console.warn) { console.warn('[agenda] item do plano não acompanhou:', (e && e.message) || e); } });
    },
    atualizarEvento: function (id, patch, acao, antes) {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var up = Object.assign({}, patch, { atualizadoEm: Date.now() });
        return f.updateDoc(f.doc(db, 'eventos', id), up).then(function () { return Store.sincronizarItemDoPlano(c, id, patch); }).then(function () {
          Store.log({ acao: acao || 'editar_evento', entidade: 'evento', refId: id, antes: antes || null, depois: patch });
        });
      }).catch(function (e) { throw ferr(e); });
    },
    inativarEvento: function (id) {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        return f.updateDoc(f.doc(db, 'eventos', id), { ativo: false, atualizadoEm: Date.now() }).then(function () {
          Store.log({ acao: 'inativar_evento', entidade: 'evento', refId: id, antes: { ativo: true }, depois: { ativo: false } });
        });
      }).catch(function (e) { throw ferr(e); });
    },
    /* MÓDULO 4: o convidado responde ao PRÓPRIO convite. O patch vem
       pronto do agenda-motor.js (só confirmadosUids + recusas — os dois
       únicos campos que a regra do Firestore libera para o convidado).
       Serve reunião e evento: muda só o nome da coleção. */
    responderConvite: function (colecao, id, patch, acao) {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        return f.updateDoc(f.doc(db, colecao, id), patch).then(function () {
          Store.log({ acao: acao, entidade: colecao === 'reunioes' ? 'reuniao' : 'evento', refId: id, antes: null, depois: { uid: USER && USER.uid } });
        });
      }).catch(function (e) { throw ferr(e); });
    },
    log: function (entry) {
      return fb().then(function (c) {
        var db = c.db, f = c.f;
        var row = Object.assign({ ts: Date.now(), uid: (USER && USER.uid) || null }, entry);
        return f.addDoc(f.collection(db, 'atividade_log'), row);
      }).catch(function (e) { if (window.console && console.warn) { console.warn('[eventos] log falhou', e); } });
    }
  };

  /* ===================== util ===================== */
  function el(html) { var t = document.createElement('template'); t.innerHTML = html.trim(); return t.content.firstChild; }
  function txt(tag, cls, text) { var e = document.createElement(tag); if (cls) { e.className = cls; } e.textContent = text == null ? '' : text; return e; }
  function toast(msg, kind) {
    var t = txt('div', '', msg);
    t.style.cssText = 'position:fixed;left:50%;bottom:26px;transform:translateX(-50%);z-index:60;background:var(--s2);border:1px solid var(--border);color:' + (kind === 'err' ? 'var(--red)' : 'var(--text)') + ';font-size:12.5px;font-weight:700;padding:10px 16px;border-radius:11px;box-shadow:var(--cardShadow)';
    document.body.appendChild(t);
    setTimeout(function () { if (t.parentNode) { t.parentNode.removeChild(t); } }, 2600);
  }
  function fmtBR(iso) { if (!iso) { return '—'; } var p = iso.split('-'); return p[2] + '/' + p[1] + '/' + p[0]; }
  function fmtBRL(cents) {
    if (cents == null) { return '—'; }
    var v = (Number(cents) || 0) / 100;
    return 'R$ ' + v.toFixed(2).replace('.', ',').replace(/\B(?=(\d{3})+(?!\d))/g, '.');
  }
  function parseBRL(str) { var d = String(str || '').replace(/\D/g, ''); return d ? parseInt(d, 10) : 0; }

  /* popover "i" */
  var POP, BACK;
  function closePop() { POP.classList.remove('on'); BACK.classList.remove('on'); }
  function openPop(anchor, title, rows) {
    POP.innerHTML = '';
    POP.appendChild(txt('div', 'ev-pop-t', title));
    rows.forEach(function (r) {
      var d = txt('div', 'ev-pop-row', '');
      d.appendChild(txt('div', 'ev-pop-k', r[0]));
      d.appendChild(txt('div', 'ev-pop-v', r[1]));
      POP.appendChild(d);
    });
    POP.classList.add('on'); BACK.classList.add('on');
    var r = anchor.getBoundingClientRect();
    var top = r.bottom + 8, left = Math.min(r.left, window.innerWidth - 316);
    if (top + POP.offsetHeight > window.innerHeight - 12) { top = Math.max(12, r.top - POP.offsetHeight - 8); }
    POP.style.top = top + 'px'; POP.style.left = Math.max(12, left) + 'px';
  }

  /* ===================== estado ===================== */
  var AG = window.GrautAgenda;   /* lógica pura: navegação, convite, cor */
  var HOJE = R.hojeISO();
  var ANCORA = HOJE;             /* o dia que ancora a semana/mês visível */
  var VISAO = 'semana';          /* 'semana' | 'mes' */
  var ESCOPO = 'unidade';        /* 'unidade' | 'setor' */
  var MOSTRAR_RECUSADOS = false;
  var TUDO = [];        /* o que veio do banco na janela visível */
  var EVTS = [];        /* o recorte que está na tela */
  var SETORES = [];
  var CHIPS = {};       /* id do item -> nós na tela (repinte cirúrgico) */
  var bodyEl, actionsEl, SHEET, SHEETBACK;

  function nomeSetor(sig) { return KPI.nomeSetor(sig, SETORES); }
  function raizDe(sig) {
    var s = SETORES.filter(function (x) { return x.sigla === sig; })[0];
    if (!s) { return sig; }                                   /* desconhecido: usa a própria */
    return s.setorPaiSigla ? s.setorPaiSigla : s.sigla;       /* subsetor -> pai; raiz -> ela */
  }
  /* MÓDULO 4: os setores do usuário já pela RAIZ (subsetor conta como o pai) */
  function meusSetores() {
    var brutos = AG.setoresDoUsuario(USER), out = {}, k;
    for (k in brutos) { if (Object.prototype.hasOwnProperty.call(brutos, k)) { out[raizDe(k)] = true; } }
    return out;
  }
  function ctx() {
    return { uid: (USER && USER.uid) || null, escopo: ESCOPO, setores: meusSetores() };
  }
  function temSetorProprio() {
    var m = meusSetores(), k;
    for (k in m) { if (Object.prototype.hasOwnProperty.call(m, k)) { return true; } }
    return false;
  }
  function colecaoDe(item) { return item._kind === 'reuniao' ? 'reunioes' : 'eventos'; }

  /* ===================== chip do item ===================== */
  /* A cor sai INTEIRA do agenda-motor.js (D8) e nunca é gravada.
     Cor nunca sozinha: todo chip leva marca (? ✓ ▸ •), ícone da
     categoria e o rótulo da origem no title/aria-label. */
  function chipDe(item) {
    var c = AG.corDoItem(item, ctx());
    var b = document.createElement('button');
    b.type = 'button';
    b.className = 'ag-chip ag-' + c.token + (c.estilo === 'riscado' ? ' ag-riscado' : '');
    b.title = c.rotulo;
    b.setAttribute('aria-label', (item.titulo || 'Item da agenda') + ' — ' + c.rotulo);
    b.appendChild(txt('span', 'ag-mark', c.marca));
    b.appendChild(txt('span', 'ag-cat', item._kind === 'reuniao' ? '📋' : AG.categoriaDe(item).icone));
    b.appendChild(txt('span', 'ag-chip-t', item.titulo || (item._kind === 'reuniao' ? 'Reunião' : 'Evento')));
    if (item.hora) { b.appendChild(txt('span', 'ag-chip-h', item.hora)); }
    b.addEventListener('click', function (ev) { ev.stopPropagation(); abrirItem(item); });
    if (!CHIPS[item.id]) { CHIPS[item.id] = []; }
    CHIPS[item.id].push(b);
    return b;
  }

  /* repinte cirúrgico: responder o convite troca SÓ os chips daquele
     item e a caixa de convites — a tela não é redesenhada. */
  function repintarItem(item) {
    var nos = CHIPS[item.id] || [];
    CHIPS[item.id] = [];
    nos.forEach(function (antigo) {
      if (!antigo.parentNode) { return; }
      antigo.parentNode.replaceChild(chipDe(item), antigo);
    });
    if (!MOSTRAR_RECUSADOS && AG.statusConvite(item, USER && USER.uid) === 'nao_vou') {
      (CHIPS[item.id] || []).forEach(function (n) { if (n.parentNode) { n.parentNode.removeChild(n); } });
      CHIPS[item.id] = [];
    }
    pintarConvites();
  }

  /* ===================== barra de controles ===================== */
  function seg(opcoes, valorAtual, aoTrocar, rotuloGrupo) {
    var wrap = el('<div class="ag-seg" role="group"></div>');
    wrap.setAttribute('aria-label', rotuloGrupo);
    opcoes.forEach(function (o) {
      var b = txt('button', 'ag-segb' + (o.valor === valorAtual ? ' on' : ''), o.rotulo);
      b.type = 'button';
      b.setAttribute('aria-pressed', o.valor === valorAtual ? 'true' : 'false');
      b.addEventListener('click', function () { if (o.valor !== valorAtual) { aoTrocar(o.valor); } });
      wrap.appendChild(b);
    });
    return wrap;
  }

  function barraControles() {
    var bar = el('<div class="ag-bar"></div>');

    bar.appendChild(seg(
      [{ valor: 'unidade', rotulo: 'Unidade' }, { valor: 'setor', rotulo: 'Meu setor' }],
      ESCOPO,
      function (v) { ESCOPO = v; lembrar('graut_agenda_escopo', v); aplicarRecorte(); },
      'Ver a agenda da unidade ou do meu setor'
    ));

    bar.appendChild(seg(
      [{ valor: 'semana', rotulo: 'Semana' }, { valor: 'mes', rotulo: 'Mês' }],
      VISAO,
      function (v) { VISAO = v; lembrar('graut_agenda_visao', v); carregarJanela(); },
      'Ver por semana ou por mês'
    ));

    var hj = txt('button', 'ag-hoje', 'Hoje');
    hj.type = 'button';
    hj.addEventListener('click', function () { ANCORA = HOJE; carregarJanela(); });
    bar.appendChild(hj);

    var nav = el('<div class="ag-nav"></div>');
    var prev = txt('button', 'ag-navb', '‹');
    prev.type = 'button';
    prev.setAttribute('aria-label', VISAO === 'semana' ? 'Semana anterior' : 'Mês anterior');
    prev.addEventListener('click', function () { ANCORA = AG.navegar(VISAO, ANCORA, -1); carregarJanela(); });
    var next = txt('button', 'ag-navb', '›');
    next.type = 'button';
    next.setAttribute('aria-label', VISAO === 'semana' ? 'Próxima semana' : 'Próximo mês');
    next.addEventListener('click', function () { ANCORA = AG.navegar(VISAO, ANCORA, 1); carregarJanela(); });
    nav.appendChild(prev); nav.appendChild(next);
    bar.appendChild(nav);

    bar.appendChild(txt('div', 'ag-per', AG.rotuloPeriodo(VISAO, ANCORA)));
    bar.appendChild(el('<div class="ag-bar-sp"></div>'));

    if (ESCOPO === 'setor') {
      var lab = el('<label class="ag-check"></label>');
      var cb = document.createElement('input');
      cb.type = 'checkbox'; cb.checked = MOSTRAR_RECUSADOS;
      cb.addEventListener('change', function () { MOSTRAR_RECUSADOS = cb.checked; aplicarRecorte(); });
      lab.appendChild(cb);
      lab.appendChild(txt('span', '', 'Mostrar recusados'));
      bar.appendChild(lab);
    }
    return bar;
  }

  /* ===================== legenda fixa (D8) ===================== */
  function legendaEl() {
    var box = el('<div class="ag-legend"></div>');
    AG.legenda().forEach(function (c) {
      var lg = el('<div class="ag-lg ag-' + c.token + '"></div>');
      lg.appendChild(el('<span class="ag-lgs ag-' + c.token + '"></span>'));
      lg.appendChild(txt('span', 'ag-lgm', c.marca));
      lg.appendChild(txt('span', '', c.rotulo));
      box.appendChild(lg);
    });
    return box;
  }

  /* ============ caixa "Convites esperando resposta" ============ */
  var INBOX = null;
  function pintarConvites() {
    if (!INBOX) { return; }
    INBOX.innerHTML = '';
    var pend = AG.convitesPendentes(TUDO, USER && USER.uid);
    if (!pend.length) { INBOX.style.display = 'none'; return; }
    INBOX.style.display = '';
    var t = el('<div class="ag-inbox-t"></div>');
    t.appendChild(txt('span', 'ag-mark', '?'));
    t.appendChild(txt('span', '', 'Convites esperando resposta (' + pend.length + ')'));
    INBOX.appendChild(t);
    INBOX.appendChild(txt('div', 'ag-inbox-s', 'Responda aqui mesmo. Quem convidou passa a ver a sua resposta.'));
    pend.forEach(function (item) {
      var row = el('<div class="ag-inbox-i"></div>');
      row.appendChild(txt('div', 'ag-inbox-n', (item._kind === 'reuniao' ? '📋 ' : AG.categoriaDe(item).icone + ' ') + (item.titulo || 'Convite')));
      row.appendChild(txt('div', 'ag-inbox-w', AG.rotuloDia(item.data) + (item.hora ? ' · ' + item.hora : '') + (item.local ? ' · ' + item.local : '')));
      var bs = el('<div class="ag-inbox-b"></div>');
      var sim = UI.button({ label: 'Vou', icon: 'check' });
      sim.addEventListener('click', function () { responderVou(item); });
      var nao = UI.button({ label: 'Não vou', variant: 'ghost' });
      nao.addEventListener('click', function () { modalNaoVou(item); });
      bs.appendChild(sim); bs.appendChild(nao);
      row.appendChild(bs);
      INBOX.appendChild(row);
    });
  }

  /* ===================== visão SEMANA ===================== */
  function gradeSemana(porDia) {
    var g = el('<div class="ag-week"></div>');
    AG.diasDaSemana(ANCORA).forEach(function (iso) {
      var dw = AG.diaSemana(iso);
      var col = el('<div class="ag-wcol' + (dw === 0 || dw === 6 ? ' fds' : '') + (iso === HOJE ? ' hoje' : '') + '"></div>');
      var h = el('<div class="ag-wh"></div>');
      h.appendChild(txt('span', 'ag-wh-d', String(AG.parseISO(iso).d)));
      h.appendChild(txt('span', '', AG.DOW_CURTO[dw]));
      col.appendChild(h);
      var lista = porDia[iso] || [];
      if (!lista.length) { col.appendChild(txt('div', 'ag-wempty', 'Nada marcado')); }
      lista.forEach(function (item) { col.appendChild(chipDe(item)); });
      g.appendChild(col);
    });
    return g;
  }

  /* ===================== visão MÊS ===================== */
  function gradeMes(porDia) {
    var g = el('<div class="ag-month"></div>');
    AG.DOW_CURTO.forEach(function (d) { g.appendChild(txt('div', 'ag-dow', d)); });
    AG.gradeMes(ANCORA).forEach(function (cel) {
      /* a célula NÃO é <button>: os chips dentro dela já são botões e
         botão dentro de botão quebra o leitor de tela. Div com papel de
         botão + Enter/Espaço resolve sem aninhar. */
      var cell = el('<div class="ag-day' + (cel.fora ? ' fora' : '') + (cel.iso === HOJE ? ' hoje' : '') + '"></div>');
      cell.appendChild(txt('div', 'ag-dn', String(cel.dia)));
      if (!cel.fora) {
        var lista = porDia[cel.iso] || [];
        lista.slice(0, 3).forEach(function (item) { cell.appendChild(chipDe(item)); });
        if (lista.length > 3) { cell.appendChild(txt('div', 'ag-more', '+' + (lista.length - 3) + ' neste dia')); }
        (function (iso2, lista2) {
          cell.setAttribute('role', 'button');
          cell.setAttribute('tabindex', '0');
          cell.setAttribute('aria-label', 'Dia ' + AG.rotuloDia(iso2) + ' — ' + lista2.length + ' item(ns)');
          cell.addEventListener('click', function () { abrirSheet(iso2, lista2); });
          cell.addEventListener('keydown', function (ev) {
            if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); abrirSheet(iso2, lista2); }
          });
        })(cel.iso, lista);
      }
      g.appendChild(cell);
    });
    return g;
  }

  /* ===================== render ===================== */
  function renderTudo() {
    bodyEl.innerHTML = '';
    CHIPS = {};

    bodyEl.appendChild(barraControles());

    INBOX = el('<div class="ag-inbox"></div>');
    bodyEl.appendChild(INBOX);
    pintarConvites();

    if (ESCOPO === 'setor') { bodyEl.appendChild(legendaEl()); }

    /* sem permissão / sem setor: porta em vez de tela morta */
    if (ESCOPO === 'setor' && !temSetorProprio()) {
      var sp = el('<div class="ag-state"></div>');
      sp.appendChild(txt('div', 'ag-state-t', 'Você não tem um setor próprio nesta agenda'));
      sp.appendChild(txt('div', 'ag-state-s', 'Quem responde pela escola inteira acompanha tudo em Unidade. Se faltar o seu setor no cadastro, avise o gestor.'));
      var vb = UI.button({ label: 'Ver a agenda da unidade' });
      vb.addEventListener('click', function () { ESCOPO = 'unidade'; lembrar('graut_agenda_escopo', 'unidade'); aplicarRecorte(); });
      sp.appendChild(vb);
      bodyEl.appendChild(sp);
      return;
    }

    /* F1-J: TOTAL do mês — previsto × realizado (padrão Monday/Asana:
       rollup de orçamento no topo do quadro). Soma os MESMOS eventos
       visíveis abaixo (recorte por papel já aplicado). */
    (function () {
      var soEv = EVTS.filter(function (e) { return e._kind !== 'reuniao'; });
      if (!soEv.length) { return; }
      var tp = 0, trz = 0, nReal = 0;
      soEv.forEach(function (e) {
        tp += (Number(e.custoPrevisto) || 0);
        if (e.custoRealizado != null) { trz += (Number(e.custoRealizado) || 0); nReal++; }
      });
      var bar = el('<div style="display:flex;align-items:center;gap:8px;flex-wrap:wrap;background:var(--s1);border:1px solid var(--border);border-radius:12px;padding:9px 14px;margin:0 0 12px;font-size:12.5px;font-weight:700"></div>');
      var lft = el('<span></span>');
      lft.textContent = 'Custo do período: ' + fmtBRL(tp) + ' previsto × ' + fmtBRL(trz) + ' realizado';
      bar.appendChild(lft);
      var dif = trz - tp;
      if (nReal) {
        var dv = el('<span style="font-size:11.5px;font-weight:800"></span>');
        dv.style.color = dif > 0 ? 'var(--red)' : 'var(--green)';
        dv.textContent = dif > 0 ? ('+' + fmtBRL(dif) + ' acima do previsto') : (dif < 0 ? (fmtBRL(-dif) + ' abaixo do previsto') : 'na linha do previsto');
        bar.appendChild(dv);
      }
      var ib2 = el('<button class="ev-i" type="button" aria-label="Como este número é calculado" style="margin-left:auto"><svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></button>');
      ib2.addEventListener('click', function () {
        openPop(ib2, 'Custo do período — como é calculado', [
          ['Fórmula', 'soma do custo PREVISTO de todos os eventos do período × soma do custo REALIZADO dos já marcados como realizados. Diferença = realizado − previsto.'],
          ['Dados', soEv.length + ' evento(s) visíveis no seu recorte · ' + nReal + ' com realizado lançado. Valores guardados em centavos (sem erro de arredondamento).'],
          ['Números', fmtBRL(tp) + ' previsto · ' + fmtBRL(trz) + ' realizado · diferença ' + (dif >= 0 ? '+' : '−') + fmtBRL(Math.abs(dif))]
        ]);
      });
      bar.appendChild(ib2);
      bodyEl.appendChild(bar);
    })();

    var porDia = AG.porDia(EVTS);
    bodyEl.appendChild(VISAO === 'semana' ? gradeSemana(porDia) : gradeMes(porDia));

    if (!EVTS.length) {
      var em = el('<div class="ag-state"></div>');
      em.appendChild(txt('div', 'ag-state-t', 'Nada marcado ' + (VISAO === 'semana' ? 'nesta semana' : 'neste mês')));
      em.appendChild(txt('div', 'ag-state-s', ESCOPO === 'setor'
        ? 'Aparecem aqui os compromissos do seu setor e os convites que você recebeu. Use as setas para olhar outro período.'
        : 'Aparecem aqui os compromissos publicados para a escola inteira. Use as setas para olhar outro período.'));
      if (AG.podePublicar(USER)) {
        var nb2 = UI.button({ label: 'Publicar evento', icon: 'plus' });
        nb2.addEventListener('click', function () { modalEvento(null, null); });
        em.appendChild(nb2);
      }
      bodyEl.appendChild(em);
    }
  }

  /* recorte muda (escopo / mostrar recusados): não busca no banco de
     novo, só refaz o filtro do que já está em memória */
  function aplicarRecorte() {
    EVTS = AG.filtrar(TUDO, ctx(), MOSTRAR_RECUSADOS);
    renderTudo();
  }

  function lembrar(chave, valor) { try { localStorage.setItem(chave, valor); } catch (er) {} }
  function lembrado(chave, padrao) {
    try { return localStorage.getItem(chave) || padrao; } catch (er) { return padrao; }
  }

  /* ===================== bottom sheet ===================== */
  function fecharSheet() { SHEET.classList.remove('on'); SHEETBACK.classList.remove('on'); }
  function abrirSheet(iso, lista) {
    SHEET.innerHTML = '';
    var h = el('<div class="ev-sh-h"></div>');
    h.appendChild(txt('div', 'ev-sh-t', AG.rotuloDia(iso) + ' · ' + fmtBR(iso)));
    var x = el('<button class="ev-sh-x" type="button" aria-label="Fechar"><svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 6 6 18M6 6l12 12"></path></svg></button>');
    x.addEventListener('click', fecharSheet);
    h.appendChild(x);
    SHEET.appendChild(h);

    if (!lista.length) {
      SHEET.appendChild(txt('div', 'ev-it-m', 'Nada marcado neste dia.'));
      if (AG.podePublicar(USER)) {
        var nb = UI.button({ label: 'Publicar evento neste dia', icon: 'plus' });
        nb.addEventListener('click', function () { fecharSheet(); modalEvento(null, iso); });
        var w = el('<div style="margin-top:10px"></div>'); w.appendChild(nb); SHEET.appendChild(w);
      }
    }
    lista.forEach(function (item) {
      var it = el('<div class="ev-item"></div>');
      it.appendChild(chipDe(item));
      it.appendChild(txt('div', 'ev-it-m', linhaResumo(item)));
      SHEET.appendChild(it);
    });

    SHEETBACK.classList.add('on');
    SHEET.classList.add('on');
  }

  /* ============ item: popup com resposta ao convite ============ */
  function linhaResumo(item) {
    var meta = [];
    if (item.hora) { meta.push(item.hora); }
    if (item.local) { meta.push(item.local); }
    if (item.siglaSetor) { meta.push(nomeSetor(item.siglaSetor)); }
    if (item._kind !== 'reuniao') { meta.push(AG.categoriaDe(item).rotulo); }
    var c = AG.contagemConvites(item);
    if (c.convidados) { meta.push(c.vou + ' vão · ' + c.naoVou + ' não vão · ' + c.semResposta + ' sem resposta'); }
    return meta.join(' · ');
  }

  function linha(rotulo, valor) {
    var d = el('<div class="ev-pop-row"></div>');
    d.appendChild(txt('div', 'ev-pop-k', rotulo));
    d.appendChild(txt('div', 'ev-pop-v', valor));
    return d;
  }

  function abrirItem(item) {
    fecharSheet();
    var meuStatus = AG.statusConvite(item, USER && USER.uid);
    var cor = AG.corDoItem(item, ctx());
    var corpo = [];

    corpo.push(linha('Quando', AG.rotuloDia(item.data) + ' · ' + fmtBR(item.data) + (item.hora ? ' às ' + item.hora : ' (sem hora marcada)')));
    if (item.local) { corpo.push(linha('Onde', item.local)); }
    corpo.push(linha('Setor', item.siglaSetor ? nomeSetor(item.siglaSetor) + ' (' + item.siglaSetor + ')' : '—'));
    if (item._kind !== 'reuniao') { corpo.push(linha('Tipo', AG.categoriaDe(item).icone + ' ' + AG.categoriaDe(item).rotulo)); }
    corpo.push(linha('Como aparece na sua agenda', cor.marca + ' ' + cor.rotulo));
    if (item.obs) { corpo.push(linha('Observações', item.obs)); }
    var cnt = AG.contagemConvites(item);
    if (cnt.convidados) {
      corpo.push(linha('Convidados', cnt.convidados + ' pessoa(s) · ' + cnt.vou + ' vão · ' + cnt.naoVou + ' não vão · ' + cnt.semResposta + ' ainda sem resposta'));
    }
    if (item._kind !== 'reuniao' && item.custoPrevisto != null) {
      corpo.push(linha('Custo', fmtBRL(item.custoPrevisto) + ' previsto × ' + (item.custoRealizado != null ? fmtBRL(item.custoRealizado) : '—') + ' realizado'));
    }

    /* bloco de resposta ao convite — muda a cor na hora, sem recarregar */
    if (meuStatus !== 'nao_convidado') {
      var bloco = el('<div class="ag-resp"></div>');
      bloco.appendChild(txt('div', 'ag-resp-q', meuStatus === 'sem_resposta' ? 'Vai?' : 'Você já respondeu — pode mudar:'));
      var bs = el('<div class="ag-resp-b"></div>');
      var sim = UI.button({ label: meuStatus === 'vou' ? 'Vou (sua resposta)' : 'Vou', icon: 'check', variant: meuStatus === 'vou' ? 'ghost' : 'primary' });
      sim.addEventListener('click', function () { fecharModalAtual(); responderVou(item); });
      var nao = UI.button({ label: meuStatus === 'nao_vou' ? 'Não vou (sua resposta)' : 'Não vou', variant: 'ghost' });
      nao.addEventListener('click', function () { fecharModalAtual(); modalNaoVou(item); });
      bs.appendChild(sim); bs.appendChild(nao);
      bloco.appendChild(bs);
      var minha = AG.minhaRecusa(item, USER && USER.uid);
      if (minha) {
        bloco.appendChild(txt('div', 'ag-resp-r', 'Você avisou que não vai — motivo: ' + AG.rotuloMotivo(minha.motivo) + (minha.detalhe ? ' (' + minha.detalhe + ')' : '') + '. Quem convidou vê este motivo.'));
      }
      corpo.push(bloco);
    }

    UI.modal({
      title: (item._kind === 'reuniao' ? '📋 ' : AG.categoriaDe(item).icone + ' ') + (item.titulo || 'Item da agenda'),
      width: 480,
      body: corpo,
      footer: function (close) {
        MODAL_FECHAR = close;
        var bts = [];
        if (item._kind === 'reuniao') {
          bts.push(UI.button({ label: 'Abrir reunião', variant: 'ghost', onClick: function () { window.location.href = 'projetos.html'; } }));
        } else if (item.planoId) {
          bts.push(UI.button({ label: 'Abrir no Planejamento', variant: 'ghost', onClick: function () { window.location.href = 'planejamento.html'; } }));
        } else if (AG.podeEditar(USER, item)) {
          bts.push(UI.button({ label: 'Editar', variant: 'ghost', onClick: function () { close(); modalEvento(item, null); } }));
          if (!item.realizado) {
            bts.push(UI.button({ label: 'Marcar realizado', icon: 'check', variant: 'ghost', onClick: function () { close(); modalRealizado(item); } }));
          }
          bts.push(UI.button({ label: 'Cancelar evento', variant: 'ghost', onClick: function () {
            Store.inativarEvento(item.id)
              .then(function () { close(); toast('Evento cancelado — some da agenda de todo mundo.'); carregarJanela(); })
              .catch(function (er) { console.error('[agenda] falha ao cancelar:', er); toast('Não deu para cancelar. Verifique a conexão e tente de novo.', 'err'); });
          } }));
        }
        bts.push(UI.button({ label: 'Fechar', onClick: close }));
        return bts;
      }
    });
  }

  var MODAL_FECHAR = null;
  function fecharModalAtual() { if (MODAL_FECHAR) { try { MODAL_FECHAR(); } catch (er) {} MODAL_FECHAR = null; } }

  /* aplica o patch no objeto em memória para o repinte não esperar o banco */
  function aplicarLocal(item, patch) {
    var k;
    for (k in patch) { if (Object.prototype.hasOwnProperty.call(patch, k)) { item[k] = patch[k]; } }
  }

  function responderVou(item) {
    var uid = USER && USER.uid;
    if (!uid) { return; }
    var patch = AG.patchVou(item, uid);
    Store.responderConvite(colecaoDe(item), item.id, patch, 'confirmar_presenca')
      .then(function () {
        aplicarLocal(item, patch);
        repintarItem(item);
        toast('Anotado: você vai. Quem convidou já vê a sua resposta.');
      })
      .catch(function (er) {
        console.error('[agenda] falha ao responder o convite:', er);
        toast((er && er.message) || 'Não deu para responder agora. Tente de novo.', 'err');
      });
  }

  function modalNaoVou(item) {
    var uid = USER && USER.uid;
    if (!uid) { return; }
    var motSel = UI.select({
      value: '', placeholder: '— Motivo (obrigatório) —',
      options: AG.MOTIVOS_RECUSA.map(function (m) { return { value: m.valor, label: m.rotulo }; })
    });
    var detInp = UI.input({ placeholder: 'Obrigatório quando o motivo é "Outro"' });
    UI.modal({
      title: 'Avisar que não vou — ' + (item.titulo || 'convite'), width: 460,
      body: [
        UI.field({ label: 'Motivo', required: true, control: motSel }),
        UI.field({ label: 'Detalhe', control: detInp, hint: 'Até 280 caracteres. Quem convidou vê o motivo — é assim que ele remarca ou chama outra pessoa.' })
      ],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: 'Enviar aviso', icon: 'check', onClick: function () {
            var r = AG.patchNaoVou(item, uid, motSel.value, detInp.value, Date.now(), (USER && (USER.name || USER.nome)) || '');
            if (r.erro) { toast(r.erro, 'err'); return; }
            Store.responderConvite(colecaoDe(item), item.id, r.patch, 'recusar_presenca')
              .then(function () {
                aplicarLocal(item, r.patch);
                close();
                repintarItem(item);
                toast('Aviso enviado — quem convidou vê o motivo.');
              })
              .catch(function (er) {
                console.error('[agenda] falha ao avisar que não vai:', er);
                toast((er && er.message) || 'Não deu para enviar agora. Tente de novo.', 'err');
              });
          } })];
      }
    });
  }

  function modalRealizado(e) {
    var custoInp = UI.input({ placeholder: 'R$ 0,00', value: e.custoPrevisto ? fmtBRL(e.custoPrevisto) : '' });
    custoInp.addEventListener('input', function () { custoInp.value = fmtBRL(parseBRL(custoInp.value)); });
    UI.modal({
      title: 'Marcar como realizado', width: 420,
      body: [UI.field({ label: 'Custo realizado', control: custoInp, hint: 'Pré-preenchido com o previsto — ajuste para o valor real.' })],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: 'Confirmar', icon: 'check', onClick: function () {
            Store.atualizarEvento(e.id, { realizado: true, custoRealizado: parseBRL(custoInp.value) }, 'realizar_evento', { realizado: false })
              .then(function () { close(); toast('Evento marcado como realizado.'); fecharSheet(); carregarJanela(); })
              .catch(function (er) { console.error('[agenda] falha ao marcar realizado:', er); toast('Não deu para salvar. Verifique a conexão e tente de novo.', 'err'); });
          } })];
      }
    });
  }

  /* ===================== modal publicar/editar ===================== */
  function modalEvento(e, isoFixo) {
    var editing = !!e;
    var titInp = UI.input({ value: editing ? e.titulo : '', placeholder: 'Ex.: Feira de profissões' });
    var dtInp = UI.input({}); dtInp.type = 'date'; dtInp.value = editing ? e.data : (isoFixo || HOJE);
    var hrInp = UI.input({}); hrInp.type = 'time'; if (editing && e.hora) { hrInp.value = e.hora; }
    /* F1-C: só raiz — subsetor nunca em evento.
       MÓDULO 4 / D6: líder só publica nos setores que lidera; gestor, em todos. */
    var permitidos = AG.setoresQuePublica(USER);
    var todos = permitidos.length === 1 && permitidos[0] === '*';
    var meus = meusSetores();
    var setOpts = SETORES
      .filter(function (s) { return !s.setorPaiSigla && (todos || meus[s.sigla]); })
      .map(function (s) { return { value: s.sigla, label: (s.nome || s.sigla) + ' (' + s.sigla + ')' }; });
    var setSel = UI.select({ value: editing ? e.siglaSetor : (setOpts.length === 1 ? setOpts[0].value : ''), placeholder: 'Escolha o setor', options: setOpts });
    var catSel = UI.select({
      value: editing ? AG.categoriaDe(e).valor : 'evento',
      options: AG.CATEGORIAS.map(function (c) { return { value: c.valor, label: c.icone + '  ' + c.rotulo }; })
    });
    var locInp = UI.input({ value: editing ? (e.local || '') : '', placeholder: 'Ex.: Auditório' });
    var custoInp = UI.input({ placeholder: 'R$ 0,00', value: editing && e.custoPrevisto ? fmtBRL(e.custoPrevisto) : '' });
    custoInp.addEventListener('input', function () { custoInp.value = fmtBRL(parseBRL(custoInp.value)); });
    var obsTa = document.createElement('textarea');
    obsTa.className = 'ui-input'; obsTa.rows = 2; obsTa.style.resize = 'vertical';
    obsTa.value = editing ? (e.obs || '') : '';

    UI.modal({
      title: editing ? 'Editar evento' : 'Publicar evento', width: 520,
      body: [
        UI.field({ label: 'Título', required: true, control: titInp }),
        UI.field({ label: 'Data', required: true, control: dtInp }),
        UI.field({ label: 'Hora (opcional)', control: hrInp }),
        UI.field({ label: 'Setor', required: true, control: setSel, hint: 'A cor na Agenda da Unidade vem do setor; na agenda do setor, a cor vem de como o item chegou até você.' }),
        UI.field({ label: 'Tipo', required: true, control: catSel, hint: 'O ícone do tipo aparece junto do título, para a cor nunca ser a única informação.' }),
        UI.field({ label: 'Local (opcional)', control: locInp }),
        UI.field({ label: 'Custo previsto', control: custoInp, hint: 'Guardado em centavos (inteiro — evita erro de vírgula).' }),
        UI.field({ label: 'Observações', control: obsTa })
      ],
      footer: function (close) {
        return [UI.button({ label: 'Cancelar', variant: 'ghost', onClick: close }),
          UI.button({ label: editing ? 'Salvar' : 'Publicar', icon: 'check', onClick: function () {
            if (!titInp.value.trim()) { toast('Informe o título.', 'err'); return; }
            if (!R.isISO(dtInp.value)) { toast('Informe a data.', 'err'); return; }
            if (!setSel.value) { toast('Escolha o setor.', 'err'); return; }
            if (!todos && !meus[setSel.value]) { toast('Você só publica nos setores que lidera.', 'err'); return; }
            if (!AG.categoriaValida(catSel.value)) { toast('Escolha o tipo do evento.', 'err'); return; }
            var data = {
              titulo: titInp.value.trim(), data: dtInp.value, hora: hrInp.value || null,
              siglaSetor: setSel.value, categoria: catSel.value,
              local: locInp.value.trim() || null, obs: obsTa.value.trim() || null,
              custoPrevisto: parseBRL(custoInp.value)
            };
            var pr = editing
              ? Store.atualizarEvento(e.id, data, 'editar_evento', { titulo: e.titulo, data: e.data })
              : Store.criarEvento(data);
            pr.then(function () { close(); toast(editing ? 'Evento salvo.' : 'Evento publicado.'); carregarJanela(); })
              .catch(function (er) { console.error('[agenda] falha ao salvar:', er); toast('Não deu para salvar o evento. Verifique a conexão e tente de novo.', 'err'); });
          } })];
      }
    });
  }

  /* ===================== estados / boot ===================== */
  function renderLoading() {
    bodyEl.innerHTML = '';
    bodyEl.appendChild(el('<div class="ag-state"><div class="ag-state-t">Carregando…</div><div class="ag-state-s">Buscando os compromissos do período.</div></div>'));
  }
  function renderError(er) {
    if (er) { console.error('[agenda] falha ao carregar o período:', er); } /* detalhe técnico: só no console (R6/design) */
    bodyEl.innerHTML = '';
    var semPermissao = er && er.code === 'permission-denied';
    var s = el('<div class="ag-state"></div>');
    s.appendChild(txt('div', 'ag-state-t', semPermissao ? 'Você não tem acesso à agenda' : 'Não deu para carregar a agenda'));
    s.appendChild(txt('div', 'ag-state-s', semPermissao
      ? 'Seu perfil não libera esta tela. Peça ao gestor para conferir o seu cadastro.'
      : 'Verifique sua conexão e tente de novo. Se continuar, avise o gestor — o detalhe do erro está registrado.'));
    if (!semPermissao) {
      var rb = UI.button({ label: 'Tentar de novo', icon: 'upload' });
      rb.addEventListener('click', carregarJanela);
      s.appendChild(rb);
    }
    bodyEl.appendChild(s);
  }

  /* busca a janela visível (semana ou mês) e guarda TUDO; o recorte por
     escopo/recusados é feito em memória, sem ir ao banco de novo. */
  function carregarJanela() {
    renderLoading();
    var w = AG.janela(VISAO, ANCORA);
    if (!w) { ANCORA = HOJE; w = AG.janela(VISAO, ANCORA); }
    Promise.all([Store.listEventosMes(w.ini, w.fim), Store.listReunioesMes(w.ini, w.fim)])
      .then(function (res) {
        /* F1-M: reunião normalizada como item de agenda (mesma grade).
           _kind='reuniao' distingue o chip. MÓDULO 4: os campos de convite
           vêm junto, para o agenda-motor.js derivar a cor (D8). */
        var reun = (res[1] || []).map(function (r) {
          return {
            id: r.id, _kind: 'reuniao', titulo: r.titulo || 'Reunião',
            /* #45: projetos.html grava a hora da reunião em "horaPrevista" (criar
               e próxima da série) e nunca em "hora". Lendo só r.hora, TODA reunião
               saía "(sem hora marcada)" e ia para o fim do dia na grade — a das
               08:00 aparecia depois do evento das 14:00. "hora" fica de reserva. */
            data: r.data, hora: r.horaPrevista || r.hora || null, local: r.local || null,
            siglaSetor: r.setorSigla || null, tipo: r.tipo || null,
            encerrada: !!r.encerrada,
            convocadosUids: Array.isArray(r.convocadosUids) ? r.convocadosUids : [],
            confirmadosUids: Array.isArray(r.confirmadosUids) ? r.confirmadosUids : [],
            recusas: r.recusas || {},
            ativo: r.ativo, cancelado: r.cancelado
          };
        });
        TUDO = (res[0] || []).concat(reun);
        aplicarRecorte();
      })
      .catch(renderError);
  }

  function boot() {
    POP = document.getElementById('ev-pop');
    BACK = document.getElementById('ev-backdrop');
    BACK.addEventListener('click', closePop);
    SHEET = document.getElementById('ev-sheet');
    SHEETBACK = document.getElementById('ev-sheetback');
    SHEETBACK.addEventListener('click', fecharSheet);
    document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closePop(); fecharSheet(); } });
    bodyEl = document.getElementById('ev-body');
    actionsEl = document.getElementById('ev-actions');

    /* D2: abrir a tela grava o "visto" — o pulso do Meu Dia para. */
    try { localStorage.setItem('graut_evt_lastSeen', String(Date.now())); } catch (er) {}

    var app = document.getElementById('app');
    app.insertBefore(UI.sidebar({ active: 'Eventos', user: USER }), app.firstChild);

    /* "i" do cabeçalho */
    var ib = el('<button class="ev-i" type="button" aria-label="Como funciona"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><path d="M12 16v-4M12 8h.01"></path></svg></button>');
    ib.addEventListener('click', function () {
      openPop(ib, 'Agenda — como ler esta tela', [
        ['O que mostra', 'Unidade: tudo que foi publicado para a escola inteira, todo mundo vê. Meu setor: o que é do seu setor mais os convites que você recebeu.'],
        ['As cores', '? contorno vermelho = convite que você ainda não respondeu · ✓ azul = você disse que vai · ▸ verde = veio do plano do seu setor · • cinza = agenda da unidade. A cor é sempre calculada na hora, nunca fica guardada.'],
        ['Recusados', 'O que você recusou some da grade. Marque "Mostrar recusados" para vê-los riscados.'],
        ['Custos', 'Previsto e realizado guardados em CENTAVOS (número inteiro — evita erro de centavos); exibidos em R$.']
      ]);
    });
    document.getElementById('ev-info').appendChild(ib);

    if (AG.podePublicar(USER)) {
      var nb = UI.button({ label: 'Publicar evento', icon: 'plus' });
      nb.addEventListener('click', function () { modalEvento(null, null); });
      actionsEl.appendChild(nb);
    }

    /* estado inicial: o que o usuário escolheu da última vez neste
       aparelho; senão, semana no desktop e a agenda do próprio setor
       (gestor não tem setor próprio, então abre na unidade). */
    VISAO = lembrado('graut_agenda_visao', window.innerWidth < 760 ? 'semana' : AG.escopoTempoPadrao(window.innerWidth)); /* celular abre na semana (dias empilhados); o mês fica a um toque */
    if (VISAO !== 'semana' && VISAO !== 'mes') { VISAO = 'mes'; }
    ESCOPO = lembrado('graut_agenda_escopo', '');
    if (ESCOPO !== 'unidade' && ESCOPO !== 'setor') {
      ESCOPO = (USER && USER.perfil === 'gestor') ? 'unidade' : 'setor';
    }

    /* setores primeiro (cores e nomes), depois a janela */
    renderLoading();
    Store.listSetores()
      .then(function (r) {
        SETORES = r;
        if (ESCOPO === 'setor' && !temSetorProprio()) { ESCOPO = 'unidade'; }
        carregarJanela();
      })
      .catch(renderError);
  }

  Guard.onReady(function (u) { USER = u; boot(); });
  })();
  </script>
<script>if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js');}</script>
</body>
